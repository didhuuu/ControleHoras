              private fun calculate(
                  r:PunchDay
              ):Calc{

                  var worked=
                      minutesBetween(
                          r.punches[0],
                          r.punches[1]
                      )

                  val six=
                      r.punches[3].isNotBlank() ||
                      r.punches[4].isNotBlank()

                  if(six){

                      worked+=
                          minutesBetween(
                              r.punches[2],
                              r.punches[3]
                          )

                      worked+=
                          minutesBetween(
                              r.punches[4],
                              r.punches[5]
                          )

                  }else{

                      worked+=
                          minutesBetween(
                              r.punches[2],
                              r.punches[5]
                          )
                  }

                  val date=
                      parseIso(r.date)

                  if(!modeForDay(date)){

                      return Calc(
                          worked,
                          0,
                          0,
                          worked
                      )
                  }

                  val weekly=
                      durationMinutes(
                          weeklyTarget
                      )

                  val daysInWeek=
                      if(
                          modeForDate(date)=="MS"
                      )
                          6
                      else
                          5

                  val expected=
                      weekly/daysInWeek

                  val extra=
                      max(
                          0,
                          worked-expected
                      )

                  return Calc(
                      worked,
                      expected,
                      extra,
                      0
                  )
              }

              private fun minutesBetween(
                  a:String,
                  b:String
              ):Int{

                  val x=
                      normalizeTime(a)

                  val y=
                      normalizeTime(b)

                  if(
                      x.isBlank() ||
                      y.isBlank()
                  )
                      return 0

                  return try{

                      val xa=x.split(":")
                      val ya=y.split(":")

                      val start=
                          xa[0].toInt()*60+
                          xa[1].toInt()

                      val end=
                          ya[0].toInt()*60+
                          ya[1].toInt()

                      max(
                          0,
                          end-start
                      )

                  }catch(_:Exception){

                      0
                  }
              }

              private fun normalizeTime(
                  value:String
              ):String{

                  val digits=
                      value
                          .filter{
                              it.isDigit()
                          }
                          .take(4)

                  if(
                      digits.length==4
                  ){

                      val h=
                          digits.substring(
                              0,
                              2
                          ).toIntOrNull()

                      val m=
                          digits.substring(
                              2,
                              4
                          ).toIntOrNull()

                      if(
                          h!=null &&
                          m!=null &&
                          h in 0..23 &&
                          m in 0..59
                      ){

                          return "%02d:%02d".format(
                              Locale.US,
                              h,
                              m
                          )
                      }
                  }

                  val p=
                      value.split(":")

                  if(p.size==2){

                      val h=
                          p[0].toIntOrNull()

                      val m=
                          p[1].toIntOrNull()

                      if(
                          h!=null &&
                          m!=null &&
                          h in 0..23 &&
                          m in 0..59
                      ){

                          return "%02d:%02d".format(
                              Locale.US,
                              h,
                              m
                          )
                      }
                  }

                  return ""
              }

              private fun timeEdit(
                  initial:String,
                  hintText:String
              ):EditText{

                  val e=
                      EditText(this).apply{

                          hint=hintText
                          inputType=2
                          setSingleLine()

                          val n=
                              normalizeTime(
                                  initial
                              )

                          if(n.isNotBlank()){
                              setText(n)
                          }
                      }

                  var changing=false

                  e.addTextChangedListener(
                      object:
                          android.text.TextWatcher{

                          override fun
                          beforeTextChanged(
                              s:CharSequence?,
                              start:Int,
                              count:Int,
                              after:Int
                          ){}

                          override fun
                          onTextChanged(
                              s:CharSequence?,
                              start:Int,
                              before:Int,
                              count:Int
                          ){}

                          override fun
                          afterTextChanged(
                              s:android.text.Editable?
                          ){

                              if(changing)return

                              val d=
                                  s?.toString()
                                      ?.filter{
                                          it.isDigit()
                                      }
                                      ?.take(4)
                                      .orEmpty()

                              val f=
                                  when{

                                      d.isEmpty()->
                                          ""

                                      d.length<=2->
                                          d

                                      else->
                                          d.substring(
                                              0,
                                              2
                                          )+
                                          ":"+
                                          d.substring(
                                              2
                                          )
                                  }

                              if(
                                  f!=s?.toString()
                              ){

                                  changing=true

                                  e.setText(f)
                                  e.setSelection(
                                      e.text.length
                                  )

                                  changing=false
                              }
                          }
                      }
                  )

                  return e
              }

              private fun normalizeDuration(
                  value:String
              ):String{

                  val d=
                      value
                          .filter{
                              it.isDigit()
                          }
                          .take(4)

                  if(d.length!=4)return ""

                  val h=
                      d.substring(
                          0,
                          2
                      ).toIntOrNull()
                      ?:return ""

                  val m=
                      d.substring(
                          2,
                          4
                      ).toIntOrNull()
                      ?:return ""

                  if(h<0)return ""
                  if(m !in 0..59)return ""

                  return "%02d:%02d".format(
                      Locale.US,
                      h,
                      m
                  )
              }

              private fun durationMinutes(
                  value:String
              ):Int{

                  val v=
                      normalizeDuration(
                          value
                      )

                  if(v.isBlank())return 0

                  val p=v.split(":")

                  return p[0].toInt()*60+
                      p[1].toInt()
              }

              private fun weekKey(
                  date:Date
              ):String{

                  val c=
                      Calendar.getInstance()

                  c.time=date

                  while(
                      c.get(
                          Calendar.DAY_OF_WEEK
                      ) !=
                      Calendar.MONDAY
                  ){

                      c.add(
                          Calendar.DAY_OF_MONTH,
                          -1
                      )
                  }

                  c.set(
                      Calendar.HOUR_OF_DAY,
                      0
                  )

                  c.set(
                      Calendar.MINUTE,
                      0
                  )

                  c.set(
                      Calendar.SECOND,
                      0
                  )

                  c.set(
                      Calendar.MILLISECOND,
                      0
                  )

                  return iso.format(
                      c.time
                  )
              }

              private fun modeForDate(
                  date:Date
              ):String{

                  return weekModes[
                      weekKey(date)
                  ] ?: "MF"
              }

              private fun modeForDay(
                  date:Date
              ):Boolean{

                  val c=
                      Calendar.getInstance()

                  c.time=date

                  val day=
                      c.get(
                          Calendar.DAY_OF_WEEK
                      )

                  return if(
                      modeForDate(date)=="MS"
                  ){

                      day!=Calendar.SUNDAY

                  }else{

                      day!=Calendar.SATURDAY &&
                      day!=Calendar.SUNDAY
                  }
              }

              private fun weekLabel(
                  date:Date
              ):String{

                  val c=
                      Calendar.getInstance()

                  c.time=date

                  while(
                      c.get(
                          Calendar.DAY_OF_WEEK
                      ) !=
                      Calendar.MONDAY
                  ){

                      c.add(
                          Calendar.DAY_OF_MONTH,
                          -1
                      )
                  }

                  val start=
                      df.format(c.time)

                  c.add(
                      Calendar.DAY_OF_MONTH,
                      6
                  )

                  val end=
                      df.format(c.time)

                  return "$start até $end"
              }

              private fun scheduledDays(
                  empId:Long,
                  ym:String
              ):Int{

                  val p=
                      ym.split("-")

                  val c=
                      Calendar.getInstance()

                  c.set(
                      p[0].toInt(),
                      p[1].toInt()-1,
                      1
                  )

                  val last=
                      c.getActualMaximum(
                          Calendar.DAY_OF_MONTH
                      )

                  var total=0

                  for(day in 1..last){

                      c.set(
                          Calendar.DAY_OF_MONTH,
                          day
                      )

                      if(
                          modeForDay(
                              c.time
                          )
                      )
                          total++
                  }

                  return total
              }

              private fun calendarDaysInMonth(
                  ym:String
              ):Int{

                  val p=
                      ym.split("-")

                  val c=
                      Calendar.getInstance()

                  c.set(
                      p[0].toInt(),
                      p[1].toInt()-1,
                      1
                  )

                  return c.getActualMaximum(
                      Calendar.DAY_OF_MONTH
                  )
              }

              private fun sharePdf(
                  emp:Employee,
                  list:List<PunchDay>
              ){

                  try{

                      val ym=
                          SimpleDateFormat(
                              "yyyy-MM",
                              Locale.US
                          ).format(Date())

                      val file=
                          File(
                              cacheDir,
                              "relatorio_${emp.name.replace(
                                  Regex("[^A-Za-z0-9_-]"),
                                  "_"
                              )}.pdf"
                          )

                      val e60=
                          list.sumOf{
                              calculate(it).extra60
                          }

                      val e100=
                          list.sumOf{
                              calculate(it).extra100
                          }

                      val scheduled=
                          scheduledDays(
                              emp.id,
                              ym
                          )

                      val workedDays=
                          list.count{

                              val c=
                                  calculate(it)

                              c.worked>0 &&
                              c.expected>0
                          }

                      val hourly=
                          emp.salary/220.0

                      val value60=
                          e60/60.0*
                          hourly*
                          1.60

                      val value100=
                          e100/60.0*
                          hourly*
                          2.00

                      val extra=
                          value60+value100

                      val rest=
                          max(
                              0,
                              calendarDaysInMonth(
                                  ym
                              )-
                              scheduled
                          )

                      val dsr=
                          if(scheduled>0)
                              extra/
                              scheduled*
                              rest
                          else
                              0.0

                      val total=
                          extra+dsr

                      val document=
                          PdfDocument()

                      var pageNumber=1

                      var pdfPage=
                          document.startPage(
                              PdfDocument.PageInfo
                                  .Builder(
                                      595,
                                      842,
                                      pageNumber
                                  )
                                  .create()
                          )

                      var canvas=
                          pdfPage.canvas

                      var y=42f

                      val paint=
                          Paint(
                              Paint.ANTI_ALIAS_FLAG
                          ).apply{
                              color=Color.BLACK
                              textSize=13f
                          }

                      fun line(
                          value:String
                      ){

                          if(y>800f){

                              document.finishPage(
                                  pdfPage
                              )

                              pageNumber++

                              pdfPage=
                                  document.startPage(
                                      PdfDocument
                                          .PageInfo
                                          .Builder(
                                              595,
                                              842,
                                              pageNumber
                                          )
                                          .create()
                                  )

                              canvas=
                                  pdfPage.canvas

                              y=42f
                          }

                          canvas.drawText(
                              value.take(90),
                              35f,
                              y,
                              paint
                          )

                          y+=22f
                      }

                      paint.textSize=19f

                      paint.typeface=
                          Typeface.DEFAULT_BOLD

                      line(
                          "CONTROLE DE HORAS - RELATORIO MENSAL"
                      )

                      paint.textSize=13f

                      paint.typeface=
                          Typeface.DEFAULT

                      line(
                          "Funcionario: ${emp.name}"
                      )

                      line(
                          "Salario: "+
                          money.format(
                              emp.salary
                          )
                      )

                      line(
                          "Valor hora: "+
                          money.format(hourly)
                      )

                      line(
                          "HE 60%: "+
                          money.format(value60)
                      )

                      line(
                          "HE 100%: "+
                          money.format(value100)
                      )

                      line(
                          "Dias trabalhados: "+
                          workedDays
                      )

                      line(
                          "DSR: "+
                          money.format(dsr)
                      )

                      line(
                          "TOTAL FINAL: "+
                          money.format(total)
                      )

                      document.finishPage(
                          pdfPage
                      )

                      file.outputStream().use{
                          document.writeTo(it)
                      }

                      document.close()

                      val uri=
                          FileProvider.getUriForFile(
                              this,
                              "$packageName.fileprovider",
                              file
                          )

                      val send=
                          Intent(
                              Intent.ACTION_SEND
                          ).apply{

                              type=
                                  "application/pdf"

                              putExtra(
                                  Intent.EXTRA_STREAM,
                                  uri
                              )

                              addFlags(
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION
                              )
                          }

                      startActivity(
                          Intent.createChooser(
                              send,
                              "Enviar relatório PDF"
                          )
                      )

                  }catch(e:Exception){

                      Toast.makeText(
                          this,
                          "Erro ao gerar PDF: "+
                          e.message,
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

