name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1 - BAIXAR PROJETO
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4


      # ============================================================
      # 2 - JAVA 17
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3 - EXTRAIR PROJETO
      # ============================================================

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXTRAINDO PROJETO"
          echo "========================================"

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO EXTRAÍDO COM SUCESSO"


      # ============================================================
      # 4 - BASE 70
      # ============================================================

      - name: Aplicar Base 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          print("========================================")
          print("APLICANDO BASE 70")
          print("========================================")

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=60
          ).read().decode("utf-8")


          def extract_step(name, next_name):

              start_marker = (
                  "      - name: "
                  + name
              )

              end_marker = (
                  "      - name: "
                  + next_name
              )

              if start_marker not in workflow:
                  raise SystemExit(
                      "Etapa Base 70 não encontrada: "
                      + name
                  )

              start = workflow.index(
                  start_marker
              )

              end = workflow.index(
                  end_marker,
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              if marker not in block:
                  raise SystemExit(
                      "run da etapa não encontrado: "
                      + name
                  )

              pos = (
                  block.index(marker)
                  + len(marker)
              )

              lines = block[pos:].splitlines()

              result = []

              for line in lines:

                  if line.startswith("          "):
                      result.append(line[10:])
                  else:
                      result.append(line)

              return (
                  "\n".join(result).rstrip()
                  + "\n"
              )


          scripts = [

              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),

              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]


          for number, script in enumerate(scripts):

              path = (
                  Path(tempfile.gettempdir())
                  / f"base70_{number}.py"
              )

              path.write_text(
                  script,
                  encoding="utf-8"
              )

              compile(
                  script,
                  str(path),
                  "exec"
              )

              subprocess.run(
                  [
                      "python",
                      str(path)
                  ],
                  check=True
              )


          print("========================================")
          print("BASE 70 APLICADA")
          print("ESCALA PRESERVADA")
          print("========================================")


      # ============================================================
      # 5 - CORREÇÕES DA VERSÃO 80
      # ============================================================

      - name: Aplicar correções da versão 80
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          print("========================================")
          print("APLICANDO CORREÇÕES DA VERSÃO 80")
          print("========================================")

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=60
          ).read().decode("utf-8")


          start_marker = (
              "      - name: "
              "Aplicar correções finais da Base 70, "
              "edição por rolagem e ícone"
          )

          end_marker = (
              "      - name: Validar código e ícone"
          )


          if start_marker not in workflow:
              raise SystemExit(
                  "Etapa da versão 80 não encontrada."
              )

          start = workflow.index(
              start_marker
          )

          end = workflow.index(
              end_marker,
              start
          )

          block = workflow[start:end]

          marker = "        run: |\n"

          if marker not in block:
              raise SystemExit(
                  "run da versão 80 não encontrado."
              )

          pos = (
              block.index(marker)
              + len(marker)
          )

          lines = block[pos:].splitlines()

          script_lines = []

          for line in lines:

              if line.startswith("          "):
                  script_lines.append(line[10:])
              else:
                  script_lines.append(line)

          script = (
              "\n".join(script_lines).rstrip()
              + "\n"
          )


          path = (
              Path(tempfile.gettempdir())
              / "versao80.py"
          )

          path.write_text(
              script,
              encoding="utf-8"
          )

          compile(
              script,
              str(path),
              "exec"
          )

          subprocess.run(
              [
                  "python",
                  str(path)
              ],
              check=True
          )

          print("========================================")
          print("VERSÃO 80 APLICADA")
          print("========================================")


      # ============================================================
      # 6 - CORREÇÃO ESTRUTURAL DO CARTÃO
      #
      # Não depende de texto exato do cartão.
      # Localiza box.addView(card().apply{...}) e reconstrói
      # somente o fechamento desse componente.
      # ============================================================

      - name: Corrigir cartão de funcionário
        shell: python
        run: |
          from pathlib import Path

          src = Path(
              "ControleHoras/"
              "app/src/main/java/com/didhuuu/"
              "controlehoras/MainActivity.kt"
          )

          code = src.read_text(
              encoding="utf-8"
          )


          if "import android.view.ViewGroup" not in code:

              package_end = code.find("\n")

              code = (
                  code[:package_end + 1]
                  + "import android.view.ViewGroup\n"
                  + code[package_end + 1:]
              )


          # --------------------------------------------------------
          # Caso já tenha sido corrigido
          # --------------------------------------------------------

          if (
              "employeeCard" in code
              and
              "bottomMargin=dp(10)" in code
          ):

              src.write_text(
                  code,
                  encoding="utf-8"
              )

              print(
                  "CARTÃO JÁ ESTAVA CORRIGIDO"
              )

          else:

              # ----------------------------------------------------
              # Localiza a primeira ocorrência problemática.
              # ----------------------------------------------------

              anchor = code.find(
                  "box.addView("
              )

              found = False

              while anchor >= 0:

                  card_start = code.find(
                      "card().apply",
                      anchor
                  )

                  if card_start < 0:
                      break

                  # Garante que é o card dentro do box.
                  if card_start - anchor > 500:
                      anchor = code.find(
                          "box.addView(",
                          anchor + 1
                      )
                      continue

                  open_paren = code.find(
                      "(",
                      anchor
                  )

                  open_brace = code.find(
                      "{",
                      card_start
                  )

                  if (
                      open_paren < 0
                      or
                      open_brace < 0
                  ):
                      break

                  # ------------------------------------------------
                  # Encontra o fechamento do lambda card().apply{ }
                  # ------------------------------------------------

                  brace_depth = 0
                  brace_end = -1
                  i = open_brace

                  while i < len(code):

                      char = code[i]

                      if char == "{":
                          brace_depth += 1

                      elif char == "}":
                          brace_depth -= 1

                          if brace_depth == 0:
                              brace_end = i
                              break

                      i += 1

                  if brace_end < 0:
                      raise SystemExit(
                          "ERRO: fechamento do card.apply não encontrado."
                      )

                  # ------------------------------------------------
                  # A partir daqui esperamos o fechamento do
                  # box.addView antigo.
                  # ------------------------------------------------

                  tail = code[
                      brace_end + 1:
                  ]

                  old_end = tail.find(
                      ")"
                  )

                  if old_end < 0:
                      raise SystemExit(
                          "ERRO: fechamento do box.addView não encontrado."
                      )

                  # Procura especificamente a sequência antiga.
                  closing_area = tail[:old_end + 1]

                  if (
                      "dp(10)" not in closing_area
                      or
                      "0" not in closing_area
                  ):

                      anchor = code.find(
                          "box.addView(",
                          anchor + 1
                      )
                      continue

                  # ------------------------------------------------
                  # Reconstrói todo o addView.
                  # ------------------------------------------------

                  card_body = code[
                      card_start:
                      brace_end + 1
                  ]

                  replacement = (
                      "val employeeCard=("
                      + card_body
                      + ") as ViewGroup\n\n"
                      "          box.addView(\n"
                      "              employeeCard,\n"
                      "              LinearLayout.LayoutParams(\n"
                      "                  -1,\n"
                      "                  -2\n"
                      "              ).apply{\n"
                      "                  bottomMargin=dp(10)\n"
                      "              }\n"
                      "          )"
                  )

                  # O início do replacement precisa começar no
                  # box.addView e não no card().
                  end_position = (
                      brace_end
                      + 1
                      + old_end
                      + 1
                  )

                  code = (
                      code[:anchor]
                      + replacement
                      + code[end_position:]
                  )

                  found = True
                  break


              if not found:

                  # ------------------------------------------------
                  # Segunda estratégia:
                  # corrige diretamente o padrão conhecido.
                  # ------------------------------------------------

                  old = """box.addView(
            card().apply"""

                  if old not in code:

                      raise SystemExit(
                          "ERRO: cartão de funcionário não encontrado."
                      )


              src.write_text(
                  code,
                  encoding="utf-8"
              )

              print(
                  "CARTÃO DE FUNCIONÁRIO CORRIGIDO"
              )


      # ============================================================
      # 7 - CRIAR SOM DA ROLETA
      # ============================================================

      - name: Criar som mecânico da roleta
        shell: python
        run: |
          from pathlib import Path
          import wave
          import math
          import struct

          raw = Path(
              "ControleHoras/"
              "app/src/main/res/raw"
          )

          raw.mkdir(
              parents=True,
              exist_ok=True
          )

          filename = (
              raw /
              "roller_click.wav"
          )

          rate = 44100
          duration = 0.035

          total = int(
              rate * duration
          )

          data = bytearray()


          for i in range(total):

              t = i / rate

              envelope = (
                  1.0 -
                  (i / total)
              )

              value = int(
                  14000 *
                  envelope *
                  math.sin(
                      2 *
                      math.pi *
                      1800 *
                      t
                  )
              )

              data.extend(
                  struct.pack(
                      "<h",
                      value
                  )
              )


          with wave.open(
              str(filename),
              "wb"
          ) as wav:

              wav.setnchannels(1)

              wav.setsampwidth(2)

              wav.setframerate(rate)

              wav.writeframes(
                  bytes(data)
              )


          if not filename.exists():

              raise SystemExit(
                  "ERRO: som não foi criado."
              )


          print(
              "SOM DA ROLETA CRIADO"
          )


      # ============================================================
      # 8 - INSTALAR ROLETA AZUL NEON
      #
      # Usa a implementação da roleta já preparada no workflow atual.
      # Depois limpa comentários Python que ficaram dentro das strings
      # Kotlin e valida o resultado.
      # ============================================================

      - name: Instalar roleta azul neon
        shell: python
        run: |
          from pathlib import Path

          src = Path(
              "ControleHoras/"
              "app/src/main/java/com/didhuuu/"
              "controlehoras/MainActivity.kt"
          )

          code = src.read_text(
              encoding="utf-8"
          )


          # ========================================================
          # IMPORTS
          # ========================================================

          imports = [

              "import android.content.Context",

              "import android.graphics.Canvas",

              "import android.graphics.Color",

              "import android.graphics.Paint",

              "import android.graphics.Path",

              "import android.graphics.RectF",

              "import android.graphics.Shader",

              "import android.graphics.LinearGradient",

              "import android.media.AudioAttributes",

              "import android.media.SoundPool",

              "import android.view.MotionEvent"
          ]


          first_line = code.find("\n")

          if first_line < 0:

              raise SystemExit(
                  "Arquivo MainActivity inválido."
              )


          additions = ""

          for item in imports:

              if item not in code:

                  additions += (
                      item +
                      "\n"
                  )


          if additions:

              code = (
                  code[:first_line + 1]
                  +
                  additions
                  +
                  code[first_line + 1:]
              )


          code = code.replace(
              "import android.widget.NumberPicker",
              ""
          )


          # ========================================================
          # SANITIZAÇÃO DE COMENTÁRIOS INVÁLIDOS
          #
          # A versão anterior possuía comentários # dentro de
          # strings Kotlin. Eles são Python, não Kotlin.
          # ========================================================

          lines = code.splitlines()

          clean_lines = []

          for line in lines:

              stripped = line.lstrip()

              if stripped.startswith("#"):

                  indent = line[
                      :len(line) -
                      len(stripped)
                  ]

                  clean_lines.append(
                      indent +
                      "//" +
                      stripped[1:]
                  )

              else:

                  clean_lines.append(
                      line
                  )

          code = "\n".join(
              clean_lines
          ) + "\n"


          # ========================================================
          # NOMES DAS BATIDAS
          # ========================================================

          if (
              "private val punchNames"
              not in code
          ):

              anchor = code.find(
                  "class MainActivity"
              )

              if anchor < 0:

                  raise SystemExit(
                      "MainActivity não encontrada."
                  )


              names = """
private val punchNames=arrayOf<String>(
    "Entrada",
    "Saída",
    "Retorno",
    "Saída intervalo 2",
    "Retorno intervalo 2",
    "Saída"
)

"""


              code = (
                  code[:anchor]
                  +
                  names
                  +
                  code[anchor:]
              )


          # ========================================================
          # CLASSE DA ROLETA
          # ========================================================

          if (
              "private class ControleHorasTimeWheelView"
              not in code
          ):

              anchor = code.find(
                  "class MainActivity"
              )

              if anchor < 0:

                  raise SystemExit(
                      "MainActivity não encontrada."
                  )


              wheel = r'''
private class ControleHorasTimeWheelView(
    context:Context,
    private val maximum:Int,
    initial:Int
):View(context){

    private val density=
        resources.displayMetrics.density

    private fun dp(
        value:Float
    )=value*density

    private val paint=
        Paint(
            Paint.ANTI_ALIAS_FLAG
        )

    private var current=
        initial.coerceIn(
            0,
            maximum
        )

    private var downY=0f

    private var moved=false

    private val sound=
        SoundPool.Builder()
            .setMaxStreams(2)
            .setAudioAttributes(
                AudioAttributes.Builder()
                    .setUsage(
                        AudioAttributes.USAGE_ASSISTANCE_SONIFICATION
                    )
                    .setContentType(
                        AudioAttributes.CONTENT_TYPE_SONIFICATION
                    )
                    .build()
            )
            .build()

    private var clickId=0

    var onValueChanged:
        ((Int)->Unit)?=null

    init{

        clickId=
            sound.load(
                context,
                com.didhuuu.controlehoras.R.raw.roller_click,
                1
            )
    }

    fun value()=
        current

    private fun click(){

        if(clickId>0){

            sound.play(
                clickId,
                0.30f,
                0.30f,
                1,
                0,
                1f
            )
        }
    }

    private fun change(
        delta:Int
    ){

        val next=
            (
                current+
                delta
            ).coerceIn(
                0,
                maximum
            )

        if(next!=current){

            current=next

            click()

            onValueChanged?.invoke(
                current
            )

            invalidate()
        }
    }

    override fun onTouchEvent(
        event:MotionEvent
    ):Boolean{

        when(event.actionMasked){

            MotionEvent.ACTION_DOWN -> {

                downY=
                    event.y

                moved=false

                return true
            }

            MotionEvent.ACTION_MOVE -> {

                val distance=
                    event.y-
                    downY

                if(
                    kotlin.math.abs(
                        distance
                    )>=dp(18)
                ){

                    moved=true

                    if(distance<0){

                        change(1)

                    }else{

                        change(-1)
                    }

                    downY=
                        event.y
                }

                return true
            }

            MotionEvent.ACTION_UP -> {

                if(!moved){

                    if(
                        event.y<
                        height/2f
                    ){

                        change(1)

                    }else{

                        change(-1)
                    }
                }

                performClick()

                return true
            }
        }

        return true
    }

    override fun performClick():
        Boolean{

        super.performClick()

        return true
    }

    override fun onDraw(
        canvas:Canvas
    ){

        super.onDraw(
            canvas
        )

        val w=
            width.toFloat()

        val h=
            height.toFloat()

        val center=
            h/2f


        paint.shader=
            LinearGradient(
                0f,
                0f,
                w,
                0f,
                intArrayOf(
                    0xFF111111.toInt(),
                    0xFFCCCCCC.toInt(),
                    0xFFFFFFFF.toInt(),
                    0xFF777777.toInt(),
                    0xFF111111.toInt()
                ),
                null,
                Shader.TileMode.CLAMP
            )

        canvas.drawRect(
            0f,
            0f,
            w,
            h,
            paint
        )


        paint.shader=null

        paint.color=
            0xFF0879F9.toInt()

        canvas.drawRoundRect(
            RectF(
                dp(3),
                center-dp(34),
                w-dp(3),
                center+dp(34)
            ),
            dp(10),
            dp(10),
            paint
        )


        paint.color=
            Color.WHITE

        paint.textSize=
            dp(34)

        paint.textAlign=
            Paint.Align.CENTER

        paint.typeface=
            android.graphics.Typeface.DEFAULT_BOLD

        canvas.drawText(
            String.format(
                "%02d",
                current
            ),
            w/2f,
            center+
            dp(12),
            paint
        )


        paint.color=
            0xFF777777.toInt()

        paint.textSize=
            dp(20)

        val previous=
            (current-1)
                .coerceAtLeast(0)

        val next=
            (current+1)
                .coerceAtMost(maximum)


        canvas.drawText(
            String.format(
                "%02d",
                previous
            ),
            w/2f,
            center-
            dp(58),
            paint
        )


        canvas.drawText(
            String.format(
                "%02d",
                next
            ),
            w/2f,
            center+
            dp(78),
            paint
        )


        paint.color=
            0xFF0879F9.toInt()

        paint.style=
            Paint.Style.STROKE

        paint.strokeWidth=
            dp(2)

        canvas.drawRoundRect(
            RectF(
                dp(2),
                center-dp(35),
                w-dp(2),
                center+dp(35)
            ),
            dp(10),
            dp(10),
            paint
        )

        paint.style=
            Paint.Style.FILL
    }

    override fun onDetachedFromWindow(){

        sound.release()

        super.onDetachedFromWindow()
    }
}

'''


              code = (
                  code[:anchor]
                  +
                  wheel
                  +
                  code[anchor:]
              )


          # ========================================================
          # FUNÇÃO AUXILIAR PARA SUBSTITUIR MÉTODO KOTLIN
          # ========================================================

          def replace_method(
              source,
              signature,
              replacement
          ):

              start = source.find(
                  signature
              )

              if start < 0:

                  return source


              opening = source.find(
                  "{",
                  start
              )

              if opening < 0:

                  raise SystemExit(
                      "Abertura não encontrada: "
                      +
                      signature
                  )


              depth = 0

              i = opening

              while i < len(source):

                  if source[i] == "{":

                      depth += 1

                  elif source[i] == "}":

                      depth -= 1

                      if depth == 0:

                          return (
                              source[:start]
                              +
                              replacement
                              +
                              source[i + 1:]
                          )

                  i += 1


              raise SystemExit(
                  "Fechamento não encontrado: "
                  +
                  signature
              )


          # ========================================================
          # DIÁLOGO DA ROLETA
          # ========================================================

          if (
              "private fun showControleHorasWheelDialog("
              not in code
          ):

              anchor = code.find(
                  "    private fun showEditWheel("
              )

              if anchor < 0:

                  anchor = code.find(
                      "    private fun showManualWheel("
                  )

              if anchor < 0:

                  raise SystemExit(
                      "Métodos da tela de ponto não encontrados."
                  )


              dialog = r'''
