name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip
          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          echo "PROJETO ORIGINAL OK"

      - name: Aplicar código completo corrigido
        shell: python
        run: |
          from pathlib import Path
          import base64
          import gzip

          root = Path("ControleHoras")
          main = root / "app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          manifest = root / "app/src/main/AndroidManifest.xml"
          paths = root / "app/src/main/res/xml/file_paths.xml"

          paths.parent.mkdir(parents=True, exist_ok=True)

          dados = (
              "H4sIAAAAAAACA+1ZC3PbNhL+K4S8P4P8h8gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
              "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          )

          codigo = gzip.decompress(base64.b64decode(dados)).decode("utf-8")

          main.write_text(codigo, encoding="utf-8")

          manifest_text = manifest.read_text(encoding="utf-8")

          provider = (
              "\n        <provider\n"
              "            android:name=\"androidx.core.content.FileProvider\"\n"
              "            android:authorities=\"${applicationId}.fileprovider\"\n"
              "            android:exported=\"false\"\n"
              "            android:grantUriPermissions=\"true\">\n"
              "            <meta-data\n"
              "                android:name=\"android.support.FILE_PROVIDER_PATHS\"\n"
              "                android:resource=\"@xml/file_paths\" />\n"
              "        </provider>\n"
          )

          if "androidx.core.content.FileProvider" not in manifest_text:
              manifest_text = manifest_text.replace(
                  "</application>",
                  provider + "    </application>"
              )
              manifest.write_text(manifest_text, encoding="utf-8")

          paths.write_text(
              "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n"
              "<paths xmlns:android=\"http://schemas.android.com/apk/res/android\">\n"
              "    <cache-path name=\"cache\" path=\".\" />\n"
              "</paths>\n",
              encoding="utf-8"
          )

          required = [
              "selectedPunchDate",
              "choosePunchDate",
              "normalizeTime",
              "weeklyTarget",
              "weekModes",
              "extra60",
              "extra100",
              "DSR sobre extras",
              "FileProvider"
          ]

          for item in required:
              if item not in codigo:
                  raise SystemExit("FALTANDO: " + item)

          print("MainActivity aplicada:", len(codigo.splitlines()), "linhas")
          print("CODIGO COMPLETO APLICADO")

      - name: Validar código
        shell: bash
        run: |
          set -e

          MAIN="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          test -f "$MAIN"
          test -f "ControleHoras/app/src/main/res/xml/file_paths.xml"

          grep -q 'private var selectedPunchDate:String=""' "$MAIN"
          grep -q 'private fun choosePunchDate' "$MAIN"
          grep -q 'private fun normalizeTime' "$MAIN"
          grep -q 'private fun timeEdit' "$MAIN"
          grep -q 'private fun calculate' "$MAIN"
          grep -q 'extra60' "$MAIN"
          grep -q 'extra100' "$MAIN"
          grep -q 'DSR sobre extras' "$MAIN"
          grep -q 'FileProvider' "$MAIN"

          echo "VALIDACAO OK"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q gradle-8.11.1-bin.zip

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          ls -lh "$APK"

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
