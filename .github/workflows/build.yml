name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          rm -rf ControleHoras
          unzip -o ControleHoras.zip

          test -f ControleHoras/settings.gradle
          test -f ControleHoras/app/build.gradle
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

      - name: Configurar AndroidX
        working-directory: ControleHoras
        shell: bash
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Preparar Gradle
        working-directory: ControleHoras
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Compilar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Conferir APK
        working-directory: ControleHoras
        shell: bash
        run: |
          find app/build/outputs/apk/debug -type f -name "*.apk" -print
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
