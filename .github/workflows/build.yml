name: Gerar APK - ControleHoras

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "Projeto encontrado corretamente."

      - name: Corrigir Kotlin durante o Build
        shell: bash
        run: |
          set -e

          python3 -c 'from pathlib import Path; p=Path("ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"); s=p.read_text(encoding="utf-8"); s=s.replace("        }, 0, 0, 0, dp(10))","        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(10) })"); s=s.replace("        }, 0, 0, 0, dp(12))","        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(12) })"); s=s.replace("setTextColor(text)","setTextColor(this@MainActivity.text)"); s=s.replace("setText(if(existing!=null)existing.salary.toString():\"\")","setText(if (existing != null) existing.salary.toString() else \"\")"); s=s.replace("if(existing!=null)existing.salary.toString():\"\"","if (existing != null) existing.salary.toString() else \"\""); s=s.replace("if(existing != null) existing.salary.toString():\"\"","if (existing != null) existing.salary.toString() else \"\""); p.write_text(s,encoding="utf-8"); print("Correções aplicadas durante o Build.")'

          echo "Verificando correções..."

          if grep -q 'setTextColor(text)' ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt; then
            echo "ERRO: setTextColor(text) ainda existe."
            exit 1
          fi

          if grep -q '0, 0, 0, dp(10))' ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt; then
            echo "ERRO: addView de 10dp ainda existe."
            exit 1
          fi

          if grep -q '0, 0, 0, dp(12))' ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt; then
            echo "ERRO: addView de 12dp ainda existe."
            exit 1
          fi

          echo "Todas as correções foram aplicadas."

      - name: Configurar AndroidX
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          grep -q '^android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -q '^android.enableJetifier=true' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties

      - name: Preparar Gradle
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle wrapper --gradle-version 8.11.1

          chmod +x gradlew

          ./gradlew --version

      - name: Compilar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "COMPILANDO APK"
          echo "======================================"

          ./gradlew clean assembleDebug --no-daemon --stacktrace

          echo "======================================"
          echo "COMPILAÇÃO CONCLUÍDA"
          echo "======================================"

      - name: Conferir APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "APKs encontrados:"

          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print

          test -s app/build/outputs/apk/debug/app-debug.apk

          echo "APK encontrado com sucesso."

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
