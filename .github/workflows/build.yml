    private fun weekKey(date:Date):String{

        val c=Calendar.getInstance().apply{

            time=date

            set(
                Calendar.HOUR_OF_DAY,
                0
            )

            set(
                Calendar.MINUTE,
                0
            )

            set(
                Calendar.SECOND,
                0
            )

            set(
                Calendar.MILLISECOND,
                0
            )

            set(
                Calendar.DAY_OF_WEEK,
                Calendar.MONDAY
            )
        }

        return SimpleDateFormat(
            "yyyy-MM-dd",
            Locale.US
        ).format(c.time)
    }

    private fun modeForDate(date:Date):String{

        return weekModes[
            weekKey(date)
        ] ?: "MF"
    }

    private fun modeForDay(date:Date):Boolean{

        val c=Calendar.getInstance().apply{
            time=date
        }

        val day=c.get(
            Calendar.DAY_OF_WEEK
        )

        return if(modeForDate(date)=="MS"){

            day in
                Calendar.MONDAY..
                Calendar.SATURDAY

        }else{

            day in
                Calendar.MONDAY..
                Calendar.FRIDAY
        }
    }

    private fun weekLabel(date:Date):String{

        val c=Calendar.getInstance().apply{

            time=date

            set(
                Calendar.DAY_OF_WEEK,
                Calendar.MONDAY
            )
        }

        val inicio=
            SimpleDateFormat(
                "dd/MM/yyyy",
                Locale.US
            ).format(c.time)

        c.add(
            Calendar.DAY_OF_MONTH,
            6
        )

        val fim=
            SimpleDateFormat(
                "dd/MM/yyyy",
                Locale.US
            ).format(c.time)

        return "$inicio até $fim"
    }

    private fun modeTitle(mode:String):String{

        return if(mode=="MS"){

            "Segunda a sábado — 07:20 por dia"

        }else{

            "Segunda a sexta — 08:48 por dia"
        }
    }

