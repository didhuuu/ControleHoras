                      ?.coerceIn(0,23)
                      ?:now.get(
                          Calendar.HOUR_OF_DAY
                      )

              val minute=
                  parts.getOrNull(1)
                      ?.toIntOrNull()
                      ?.coerceIn(0,59)
                      ?:now.get(
                          Calendar.MINUTE
                      )

              showTimeWheelDialog(
                  "Editar registro",
                  "${punchNames[index]}\n" +
                  df.format(
                      parseIso(
                          rec.date
                      )
                  ),
                  hour,
                  minute,
                  "SALVAR"
              ){h,m->

                  rec.punches[index]=
                      "%02d:%02d".format(
                          Locale.US,
                          h,
                          m
                      )

                  saveData()

                  showPunch()
              }
          }

          private fun showManualWheel(
              empId:Long
          ){

              val r=
                  getRecord(
                      empId,
                      selectedPunchDate
                  )

              val n=
                  nextPunchIndex(
                      r,
                      extraEnabled(
                          empId,
                          selectedPunchDate
                      )
                  )

              if(n<0){

                  Toast.makeText(
                      this,
                      "As batidas disponíveis deste dia já estão preenchidas.",
                      Toast.LENGTH_LONG
                  ).show()

                  return
              }

              val now=
                  Calendar.getInstance()

              showTimeWheelDialog(
                  "Registro manual",
                  "${punchNames[n]}\n" +
                  df.format(
                      parseIso(
                          selectedPunchDate
                      )
                  ),
                  now.get(
                      Calendar.HOUR_OF_DAY
                  ),
                  now.get(
                      Calendar.MINUTE
                  ),
                  "REGISTRAR"
              ){h,m->

                  r.punches[n]=
                      "%02d:%02d".format(
                          Locale.US,
                          h,
                          m
                      )

                  saveData()

                  showPunch()
              }
          }

