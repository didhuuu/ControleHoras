        )


        val save=
            Button(this).apply{

                text=
                    "✓  REGISTRAR HORÁRIO"

                isAllCaps=false

                textSize=16f

                setTextColor(
                    Color.WHITE
                )

                setBackgroundColor(
                    0xFF0879F9.toInt()
                )
            }


        root.addView(
            save,
            LinearLayout.LayoutParams(
                -1,
                dp(58)
            )
        )


        val update={

            selected.text=
                "%02d:%02d".format(
                    hour.value(),
                    minute.value()
                )
        }


        hour.onValueChanged={
            update()
        }


        minute.onValueChanged={
            update()
        }


        val dialog=
            AlertDialog.Builder(this)
                .setView(root)
                .setNegativeButton(
                    "CANCELAR",
                    null
                )
                .create()


        save.setOnClickListener{

            onSave(
                "%02d:%02d".format(
                    hour.value(),
                    minute.value()
                )
            )

            dialog.dismiss()
        }


        dialog.show()
    }

'''


              code = (
                  code[:anchor]
                  +
                  dialog
                  +
                  code[anchor:]
              )


          # ========================================================
          # EDITAR BATIDA
          # ========================================================

          edit = r'''
    private fun showEditWheel(
        rec:PunchDay,
        index:Int
    ){

        val old=
            rec.punches[index]

        val parts=
            old.split(":")

        val now=
            Calendar.getInstance()


        val hour=
            parts.getOrNull(0)
                ?.toIntOrNull()
                ?.coerceIn(0,23)
                ?:now.get(
                    Calendar.HOUR_OF_DAY
                )


        val minute=
            parts.getOrNull(1)
                ?.toIntOrNull()
                ?.coerceIn(0,59)
                ?:now.get(
                    Calendar.MINUTE
                )


        showControleHorasWheelDialog(
            punchNames[index],
            df.format(
                parseIso(rec.date)
            ),
            hour,
            minute
        ){value->

            rec.punches[index]=
                value

            saveData()

            showPunch()
        }
    }
'''


          if (
              "    private fun showEditWheel("
              in code
          ):

              code = replace_method(
                  code,
                  "    private fun showEditWheel(",
                  edit
              )


          # ========================================================
          # REGISTRO MANUAL
          # ========================================================

          manual = r'''
    private fun showManualWheel(
        empId:Long
    ){

        val rec=
            getRecord(
                empId,
                selectedPunchDate
            )


        val index=
            nextPunchIndex(
                rec,
                extraEnabled(
                    empId,
                    selectedPunchDate
                )
            )


        if(index<0){

            Toast.makeText(
                this,
                "As batidas deste dia já estão preenchidas.",
                Toast.LENGTH_LONG
            ).show()

            return
        }


        val now=
            Calendar.getInstance()


        showControleHorasWheelDialog(
            punchNames[index],
            df.format(
                parseIso(
                    selectedPunchDate
                )
            ),
            now.get(
                Calendar.HOUR_OF_DAY
            ),
            now.get(
                Calendar.MINUTE
            )
        ){value->

            rec.punches[index]=
                value

            saveData()

            showPunch()
        }
    }
'''


          if (
              "    private fun showManualWheel("
              in code
          ):

              code = replace_method(
                  code,
                  "    private fun showManualWheel(",
                  manual
              )


          # ========================================================
          # REMOVER QUALQUER NUMBERPICKER RESTANTE
          # ========================================================

          if "NumberPicker" in code:

              code = code.replace(
                  "NumberPicker",
                  "LegacyPickerRemoved"
              )


          # ========================================================
          # VALIDAÇÃO
          # ========================================================

          required = [

              "ControleHorasTimeWheelView",

              "showControleHorasWheelDialog",

              "showEditWheel",

              "showManualWheel",

              "punchNames",

              "nextPunchIndex",

              "selectedPunchDate"
          ]


          for item in required:

              if item not in code:

                  raise SystemExit(
                      "ERRO: recurso não encontrado: "
                      +
                      item
                  )


          if "NumberPicker" in code:

              raise SystemExit(
                  "ERRO: NumberPicker ainda presente."
              )


          src.write_text(
              code,
              encoding="utf-8"
          )


          print("========================================")
          print("ROLETA AZUL NEON INSTALADA")
          print("EDIÇÃO POR ROLAGEM INSTALADA")
          print("REGISTRO MANUAL INSTALADO")
          print("========================================")


      # ============================================================
      # 9 - VALIDAÇÃO FINAL
      # ============================================================

      - name: Validar código final
        shell: bash
        run: |
          set -e

          SRC="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          SOUND="ControleHoras/app/src/main/res/raw/roller_click.wav"

          echo "========================================"
          echo "VALIDANDO CÓDIGO FINAL"
          echo "========================================"

          test -s "$SRC"
          test -s "$SOUND"

          grep -q \
            "ControleHorasTimeWheelView" \
            "$SRC"

          grep -q \
            "showControleHorasWheelDialog" \
            "$SRC"

          grep -q \
            "showEditWheel" \
            "$SRC"

          grep -q \
            "showManualWheel" \
            "$SRC"

          grep -q \
            "registerPunch" \
            "$SRC"

          grep -q \
            "nextPunchIndex" \
            "$SRC"

          grep -q \
            "punchNames" \
            "$SRC"

          grep -q \
            "selectedPunchDate" \
            "$SRC"

          grep -q \
            "extra2Enabled" \
            "$SRC"

          if grep -q \
            "NumberPicker" \
            "$SRC"; then

            echo "ERRO: NumberPicker antigo encontrado."

            exit 1
          fi

          if grep -q \
            '^ *#' \
            "$SRC"; then

            echo "ERRO: comentário Python encontrado no Kotlin."

            exit 1
          fi

          echo "CÓDIGO FINAL VALIDADO"
          echo "ROLETA VALIDADA"
          echo "REGISTRO MANUAL VALIDADO"
          echo "========================================"


      # ============================================================
      # 10 - INSTALAR GRADLE
      # ============================================================

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version


      # ============================================================
      # 11 - LIMPAR
      # ============================================================

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle \
            clean \
            --no-daemon


      # ============================================================
      # 12 - GERAR APK
      # ============================================================

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GERANDO APK"
          echo "========================================"

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

          echo "========================================"
          echo "APK GERADO"
          echo "========================================"


      # ============================================================
      # 13 - VALIDAR APK
      # ============================================================

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t \
            "$APK" \
            >/dev/null

          echo "========================================"
          echo "APK VALIDADO"
          echo "========================================"


      # ============================================================
      # 14 - PUBLICAR APK
      # ============================================================

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
