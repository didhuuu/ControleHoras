          # -------------------------------------------------
          # MÉTODO PARA ENCONTRAR FUNÇÃO
          # -------------------------------------------------

          def method_span(
              text,
              name
          ):

              token =
                  "    private fun " + name

              start =
                  text.find(token)

              if start < 0:
                  return None

              opening =
                  text.find(
                      "{",
                      start
                  )

              if opening < 0:
                  raise SystemExit(
                      "Abertura não encontrada: "
                      + name
                  )

              depth = 0
              string = False
              escaped = False
              line_comment = False
              block_comment = False

              i = opening

              while i < len(text):

                  c = text[i]

                  n = (
                      text[i + 1]
                      if i + 1 < len(text)
                      else ""
                  )

                  if line_comment:

                      if c == "\n":
                          line_comment = False

                  elif block_comment:

                      if (
                          c == "*"
                          and n == "/"
                      ):

                          block_comment = False
                          i += 1

                  elif string:

                      if escaped:

                          escaped = False

                      elif c == "\\":
                          escaped = True

                      elif c == '"':
                          string = False

                  else:

                      if (
                          c == "/"
                          and n == "/"
                      ):

                          line_comment = True
                          i += 1

                      elif (
                          c == "/"
                          and n == "*"
                      ):

                          block_comment = True
                          i += 1

                      elif c == '"':
                          string = True

                      elif c == "{":
                          depth += 1

                      elif c == "}":

                          depth -= 1

                          if depth == 0:

                              return (
                                  start,
                                  i + 1
                              )

                  i += 1

              raise SystemExit(
                  "Chaves não fechadas: "
                  + name
              )

          def replace_method(
              text,
              name,
              replacement
          ):

              span =
                  method_span(
                      text,
                      name
                  )

              if span is None:
                  return text

              start, end = span

              return (
                  text[:start] +
                  replacement.rstrip() +
                  "\n" +
                  text[end:]
              )

