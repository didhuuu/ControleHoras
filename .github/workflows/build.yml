name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name, next_name):

              start = workflow.index(
                  f"      - name: {name}"
              )

              end = workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              pos = block.index(marker) + len(marker)

              lines = block[pos:].splitlines()

              return "\n".join(
                  line[10:]
                  if line.startswith("          ")
                  else line
                  for line in lines
              ) + "\n"

          scripts = [
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for i, script in enumerate(scripts):

              p = (
                  Path(tempfile.gettempdir()) /
                  f"base70_{i}.py"
              )

              p.write_text(
                  script,
                  encoding="utf-8"
              )

              subprocess.run(
                  ["python", str(p)],
                  check=True
              )

          print("BASE 70 APLICADA")

      - name: Aplicar funcionalidades da versão 80
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          start = workflow.index(
              "      - name: Aplicar correções finais da Base 70, edição por rolagem e ícone"
          )

          end = workflow.index(
              "      - name: Validar código e ícone",
              start
          )

          block = workflow[start:end]

          marker = "        run: |\n"

          pos = block.index(marker) + len(marker)

          lines = block[pos:].splitlines()

          script = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in lines
          ) + "\n"

          p = (
              Path(tempfile.gettempdir()) /
              "funcionalidades.py"
          )

          p.write_text(
              script,
              encoding="utf-8"
          )

          subprocess.run(
              ["python", str(p)],
              check=True
          )

          print("FUNCIONALIDADES DA VERSÃO 80 APLICADAS")

      - name: Criar som mecânico da roleta
        shell: python
        run: |
          from pathlib import Path
          import wave
          import math
          import struct

          raw = Path(
              "ControleHoras/app/src/main/res/raw"
          )

          raw.mkdir(
              parents=True,
              exist_ok=True
          )

          filename = raw / "roller_click.wav"

          rate = 44100
          duration = 0.035

          frames = []

          for i in range(
              int(rate * duration)
          ):

              t = i / rate

              a = (
                  0.45
                  * math.exp(-85 * t)
                  * math.sin(
                      2 * math.pi * 1850 * t
                  )
              )

              b = (
                  0.22
                  * math.exp(-130 * t)
                  * math.sin(
                      2 * math.pi * 3200 * t
                  )
              )

              value = max(
                  -1.0,
                  min(
                      1.0,
                      a + b
                  )
              )

              frames.append(
                  struct.pack(
                      "<h",
                      int(value * 32767)
                  )
              )

          with wave.open(
              str(filename),
              "wb"
          ) as wav:

              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)

              wav.writeframes(
                  b"".join(frames)
              )

          print("SOM DA ROLETA CRIADO")

      - name: Corrigir tela e instalar roleta personalizada
        shell: python
        run: |
          from pathlib import Path
          import re

          src = Path(
              "ControleHoras/app/src/main/java/"
              "com/didhuuu/controlehoras/MainActivity.kt"
          )

          if not src.exists():
              raise SystemExit(
                  "MainActivity.kt não encontrado"
              )

          code = src.read_text(
              encoding="utf-8"
          )

          # ==========================================================
          # IMPORTS
          # ==========================================================

          package_line = code.find(
              "\n",
              code.find("package ")
          )

          imports = [
              "import android.content.Context",
              "import android.graphics.Canvas",
              "import android.graphics.Paint",
              "import android.graphics.Path",
              "import android.graphics.LinearGradient",
              "import android.graphics.Shader",
              "import android.graphics.RectF",
              "import android.media.AudioAttributes",
              "import android.media.SoundPool",
              "import android.view.MotionEvent"
          ]

          insertion = ""

          for imp in imports:

              if imp not in code:

                  insertion += imp + "\n"

          if insertion:

              code = (
                  code[:package_line + 1]
                  + insertion
                  + code[package_line + 1:]
              )

          # ==========================================================
          # PUNCH NAMES
          # ==========================================================

          if "private val punchNames" not in code:

              names = '''    private val punchNames=arrayOf<String>(
                  "Entrada",
                  "Saída",
                  "Retorno",
                  "Saída intervalo 2",
                  "Retorno intervalo 2",
                  "Saída"
              )

              '''

              class_match = re.search(
                  r'class\s+MainActivity\b[^{]*\{',
                  code
              )

              if not class_match:
                  raise SystemExit(
                      "MainActivity não encontrada"
                  )

              pos = class_match.end()

              code = (
                  code[:pos]
                  + "\n"
                  + names
                  + code[pos:]
              )

          # ==========================================================
          # REFERÊNCIA DA PÁGINA DE PONTO
          # ==========================================================

          if "private var controleHorasPunchPage" not in code:

              class_match = re.search(
                  r'class\s+MainActivity\b[^{]*\{',
                  code
              )

              if not class_match:
                  raise SystemExit(
                      "MainActivity não encontrada"
                  )

              pos = class_match.end()

              page_property = '''
              
                  private var controleHorasPunchPage:View?=null

              '''

              code = (
                  code[:pos]
                  + page_property
                  + code[pos:]
              )

          # ==========================================================
          # TIME WHEEL VIEW
          # ==========================================================

          if "class ControleHorasTimeWheelView" not in code:

              wheel_class = r'''
              
              private class ControleHorasTimeWheelView(
                  context:Context,
                  private val maximum:Int,
                  initial:Int
              ):View(context){

                  private val density=
                      resources.displayMetrics.density

                  private fun dp(v:Float)=
                      v*density

                  private val paint=
                      Paint(Paint.ANTI_ALIAS_FLAG)

                  private var current=
                      initial.coerceIn(0,maximum)

                  private var downY=0f
                  private var moved=false

                  private val audio=
                      SoundPool.Builder()
                          .setMaxStreams(2)
                          .setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(
                                      AudioAttributes.USAGE_ASSISTANCE_SONIFICATION
                                  )
                                  .setContentType(
                                      AudioAttributes.CONTENT_TYPE_SONIFICATION
                                  )
                                  .build()
                          )
                          .build()

                  private var clickId=0

                  var onValueChanged:
                      ((Int)->Unit)?=null

                  init{

                      setLayerType(
                          View.LAYER_TYPE_SOFTWARE,
                          null
                      )

                      clickId=
                          audio.load(
                              context,
                              com.didhuuu.controlehoras.R.raw.roller_click,
                              1
                          )

                      setBackgroundColor(
                          0xFF111111.toInt()
                      )
                  }

                  fun value()=current

                  fun setCurrent(v:Int){

                      current=
                          v.coerceIn(
                              0,
                              maximum
                          )

                      invalidate()

                      onValueChanged?.invoke(
                          current
                      )
                  }

                  private fun click(){

                      if(clickId>0){

                          audio.play(
                              clickId,
                              0.32f,
                              0.32f,
                              1,
                              0,
                              1f
                          )
                      }
                  }

                  private fun change(delta:Int){

                      val old=current

                      current=
                          (
                              current+delta
                          ).coerceIn(
                              0,
                              maximum
                          )

                      if(old!=current){

                          click()

                          onValueChanged?.invoke(
                              current
                          )

                          invalidate()
                      }
                  }

                  override fun onDraw(
                      canvas:Canvas
                  ){

                      super.onDraw(canvas)

                      val w=width.toFloat()
                      val h=height.toFloat()

                      val radius=
                          dp(20f)

                      paint.shader=
                          LinearGradient(
                              0f,
                              0f,
                              w,
                              0f,
                              intArrayOf(
                                  0xFF181818.toInt(),
                                  0xFFBFC2C4.toInt(),
                                  0xFFF4F4F4.toInt(),
                                  0xFF96999B.toInt(),
                                  0xFF151515.toInt()
                              ),
                              null,
                              Shader.TileMode.CLAMP
                          )

                      canvas.drawRoundRect(
                          RectF(
                              0f,
                              0f,
                              w,
                              h
                          ),
                          radius,
                          radius,
                          paint
                      )

                      paint.shader=null

                      paint.style=
                          Paint.Style.STROKE

                      paint.strokeWidth=
                          dp(2f)

                      paint.color=
                          0xFF707070.toInt()

                      canvas.drawRoundRect(
                          RectF(
                              dp(4f),
                              dp(4f),
                              w-dp(4f),
                              h-dp(4f)
                          ),
                          radius,
                          radius,
                          paint
                      )

                      paint.style=
                          Paint.Style.FILL

                      val centerY=
                          h/2f

                      val bandH=
                          dp(58f)

                      paint.setShadowLayer(
                          dp(9f),
                          0f,
                          0f,
                          0xAA006EFF.toInt()
                      )

                      paint.color=
                          0xFF086BEA.toInt()

                      canvas.drawRoundRect(
                          RectF(
                              dp(9f),
                              centerY-bandH/2f,
                              w-dp(9f),
                              centerY+bandH/2f
                          ),
                          dp(9f),
                          dp(9f),
                          paint
                      )

                      paint.clearShadowLayer()

                      val centerPaint=
                          Paint(
                              Paint.ANTI_ALIAS_FLAG
                          )

                      centerPaint.color=
                          0xFFFFFFFF.toInt()

                      centerPaint.textAlign=
                          Paint.Align.CENTER

                      centerPaint.typeface=
                          android.graphics.Typeface.DEFAULT_BOLD

                      centerPaint.textSize=
                          dp(31f)

                      val centerBase=
                          centerY-
                          (
                              centerPaint.ascent()+
                              centerPaint.descent()
                          )/2f

                      canvas.drawText(
                          current.toString()
                              .padStart(2,'0'),
                          w/2f,
                          centerBase,
                          centerPaint
                      )

                      val normalPaint=
                          Paint(
                              Paint.ANTI_ALIAS_FLAG
                          )

                      normalPaint.color=
                          0xFF101318.toInt()

                      normalPaint.textAlign=
                          Paint.Align.CENTER

                      normalPaint.typeface=
                          android.graphics.Typeface.DEFAULT_BOLD

                      normalPaint.textSize=
                          dp(25f)

                      val step=
                          dp(51f)

                      for(offset in -2..2){

                          if(offset==0)
                              continue

                          val number=
                              current+offset

                          if(
                              number<0 ||
                              number>maximum
                          )
                              continue

                          val y=
                              centerBase+
                              offset*step

                          normalPaint.alpha=
                              when(
                                  kotlin.math.abs(offset)
                              ){
                                  1->255
                                  else->125
                              }

                          canvas.drawText(
                              number
                                  .toString()
                                  .padStart(2,'0'),
                              w/2f,
                              y,
                              normalPaint
                          )
                      }

                      normalPaint.alpha=255

                      val arrowPaint=
                          Paint(
                              Paint.ANTI_ALIAS_FLAG
                          )

                      arrowPaint.color=
                          0xFF1494FF.toInt()

                      arrowPaint.style=
                          Paint.Style.FILL

                      val left=
                          Path()

                      left.moveTo(
                          dp(7f),
                          centerY
                      )

                      left.lineTo(
                          dp(25f),
                          centerY-dp(14f)
                      )

                      left.lineTo(
                          dp(25f),
                          centerY+dp(14f)
                      )

                      left.close()

                      canvas.drawPath(
                          left,
                          arrowPaint
                      )

                      val right=
                          Path()

                      right.moveTo(
                          w-dp(7f),
                          centerY
                      )

                      right.lineTo(
                          w-dp(25f),
                          centerY-dp(14f)
                      )

                      right.lineTo(
                          w-dp(25f),
                          centerY+dp(14f)
                      )

                      right.close()

                      canvas.drawPath(
                          right,
                          arrowPaint
                      )
                  }

                  override fun onTouchEvent(
                      event:MotionEvent
                  ):Boolean{

                      when(
                          event.actionMasked
                      ){

                          MotionEvent.ACTION_DOWN->{

                              downY=
                                  event.y

                              moved=false

                              return true
                          }

                          MotionEvent.ACTION_MOVE->{

                              val distance=
                                  downY-event.y

                              if(
                                  kotlin.math.abs(
                                      distance
                                  )>=
                                  dp(24f)
                              ){

                                  moved=true

                                  val steps=
                                      (
                                          distance/
                                          dp(24f)
                                      ).toInt()

                                  if(steps!=0){

                                      val direction=
                                          if(steps>0)
                                              1
                                          else
                                              -1

                                      repeat(
                                          kotlin.math.abs(
                                              steps
                                          )
                                      ){
                                          change(
                                              direction
                                          )
                                      }

                                      downY=
                                          event.y
                                  }
                              }

                              return true
                          }

                          MotionEvent.ACTION_UP->{

                              if(!moved){

                                  if(
                                      event.x<
                                      width/2f
                                  )
                                      change(-1)
                                  else
                                      change(1)

                              }

                              performClick()

                              return true
                          }

                          MotionEvent.ACTION_CANCEL->{

                              return true
                          }
                      }

                      return true
                  }

                  override fun performClick():
                      Boolean{

                      super.performClick()

                      return true
                  }

                  override fun onDetachedFromWindow(){

                      audio.release()

                      super.onDetachedFromWindow()
                  }
              }

              '''

              main_index=
                  code.find(
                      "class MainActivity"
                  )

              code=(
                  code[:main_index]
                  + wheel_class
                  + "\n"
                  + code[main_index:]
              )

          # ==========================================================
          # DIALOGO DE ROLAGEM
          # ==========================================================

          wheel_dialog = r'''
              
              private fun showControleHorasWheelDialog(
                  title:String,
                  date:String,
                  initialHour:Int,
                  initialMinute:Int,
                  onSave:(String)->Unit
              ){

                  val wrap=
                      LinearLayout(this).apply{

                          orientation=
                              LinearLayout.VERTICAL

                          gravity=
                              Gravity.CENTER_HORIZONTAL

                          setPadding(
                              dp(18),
                              dp(12),
                              dp(18),
                              dp(16)
                          )

                          background(
                              Color.WHITE,
                              dp(22),
                              dp(22),
                              dp(22),
                              dp(22)
                          )
                      }

                  val top=
                      LinearLayout(this).apply{

                          orientation=
                              LinearLayout.HORIZONTAL

                          gravity=
                              Gravity.CENTER_VERTICAL
                      }

                  val titleView=
                      TextView(this).apply{

                          text=title

                          textSize=24f

                          setTypeface(
                              null,
                              Typeface.BOLD
                          )

                          setTextColor(
                              darkBlue
                          )

                          gravity=
                              Gravity.CENTER_VERTICAL
                      }

                  top.addView(
                      titleView,
                      LinearLayout.LayoutParams(
                          0,
                          dp(50),
                          1f
                      )
                  )

                  val close=
                      TextView(this).apply{

                          text="×"

                          textSize=36f

                          setTextColor(
                              darkBlue
                          )

                          gravity=
                              Gravity.CENTER

                          setPadding(
                              dp(8),
                              0,
                              0,
                              0
                          )
                      }

                  top.addView(
                      close,
                      LinearLayout.LayoutParams(
                          dp(50),
                          dp(50)
                      )
                  )

                  wrap.addView(top)

                  wrap.addView(
                      TextView(this).apply{

                          text=
                              "DATA: ${date}"

                          textSize=17f

                          gravity=
                              Gravity.CENTER

                          setTextColor(
                              0xFF26364A.toInt()
                          )

                          setPadding(
                              0,
                              dp(2),
                              0,
                              dp(12)
                          )
                      }
                  )

                  val wheels=
                      LinearLayout(this).apply{

                          orientation=
                              LinearLayout.HORIZONTAL

                          gravity=
                              Gravity.CENTER
                      }

                  val hour=
                      ControleHorasTimeWheelView(
                          this@MainActivity,
                          23,
                          initialHour
                      )

                  val minute=
                      ControleHorasTimeWheelView(
                          this@MainActivity,
                          59,
                          initialMinute
                      )

                  wheels.addView(
                      hour,
                      LinearLayout.LayoutParams(
                          dp(155),
                          dp(245)
                      ).apply{
                          rightMargin=dp(6)
                      }
                  )

                  wheels.addView(
                      TextView(this).apply{

                          text=":"

                          textSize=32f

                          setTypeface(
                              null,
                              Typeface.BOLD
                          )

                          setTextColor(
                              darkBlue
                          )

                          gravity=
                              Gravity.CENTER
                      },
                      LinearLayout.LayoutParams(
                          dp(30),
                          dp(245)
                      )
                  )

                  wheels.addView(
                      minute,
                      LinearLayout.LayoutParams(
                          dp(155),
                          dp(245)
                      ).apply{
                          leftMargin=dp(6)
                      }
                  )

                  wrap.addView(wheels)

                  val selected=
                      TextView(this).apply{

                          text=
                              "%02d:%02d".format(
                                  hour.value(),
                                  minute.value()
                              )

                          textSize=38f

                          setTypeface(
                              null,
                              Typeface.BOLD
                          )

                          setTextColor(
                              blue
                          )

                          gravity=
                              Gravity.CENTER

                          background(
                              0xFFF7F9FC.toInt(),
                              dp(14),
                              dp(14),
                              dp(14),
                              dp(14)
                          )

                          setPadding(
                              0,
                              dp(6),
                              0,
                              dp(6)
                          )
                      }

                  wrap.addView(
                      selected,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(72)
                      ).apply{
                          topMargin=dp(12)
                          bottomMargin=dp(14)
                      }
                  )

                  val register=
                      Button(this).apply{

                          text=
                              "✓  Registrar horário"

                          textSize=18f

                          isAllCaps=false

                          setTextColor(
                              Color.WHITE
                          )

                          background(
                              blue,
                              dp(18),
                              dp(18),
                              dp(18),
                              dp(18)
                          )

                          setOnClickListener{

                              onSave(
                                  "%02d:%02d".format(
                                      hour.value(),
