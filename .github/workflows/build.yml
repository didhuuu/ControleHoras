              private fun safeTime(
                  value:String
              ):String{

                  if(value.isBlank())
                      return ""

                  return normalizeTime(value)
              }

              private fun formatMin(
                  minutes:Int
              ):String{

                  val m=max(
                      0,
                      minutes
                  )

                  return "%02d:%02d".format(
                      Locale.US,
                      m/60,
                      m%60
                  )
              }

              private fun parseIso(
                  value:String
              ):Date{

                  return try{

                      iso.parse(value)
                          ?:Date()

                  }catch(_:Exception){

                      Date()
                  }
              }

              private fun dp(
                  value:Int
              ):Int{

                  return (
                      value*
                      resources
                          .displayMetrics
                          .density
                  ).toInt()
                      .coerceAtLeast(1)
              }

