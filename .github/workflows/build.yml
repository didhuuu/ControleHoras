name: Gerar APK - ControleHoras

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto original
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "========================================"
          echo " PROJETO ORIGINAL ENCONTRADO"
          echo "========================================"

          wc -l ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

      - name: Corrigir aplicativo original
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt")
          s = p.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global s

              count = s.count(old)

              if count != 1:
                  raise SystemExit(
                      f"ERRO: {label}: encontrado {count} vez(es)"
                  )

              s = s.replace(old, new, 1)

          # =========================================================
          # CORREÇÕES DE COMPILAÇÃO
          # =========================================================

          s = s.replace(
              "        }, 0, 0, 0, dp(10))",
              "        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(10) })"
          )

          s = s.replace(
              "        }, 0, 0, 0, dp(12))",
              "        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(12) })"
          )

          s = s.replace(
              "setTextColor(text)",
              "setTextColor(this@MainActivity.text)"
          )

          # =========================================================
          # SALÁRIO
          # =========================================================

          replace_once(
              'setText(if(existing!=null)existing.salary.toString():"")',
              'setText(if (existing != null) existing.salary.toString() else "")',
              "salário"
          )

          # =========================================================
          # HISTÓRICO MENSAL
          # Registro = yyyy-MM-dd
          # =========================================================

          s = s.replace(
              'it.date.endsWith(SimpleDateFormat("MM-yyyy", Locale.US).format(Date()))',
              'it.date.startsWith(SimpleDateFormat("yyyy-MM", Locale.US).format(Date()))'
          )

          # =========================================================
          # FORMATO DOS TOTAIS
          # SEMPRE 00:00
          # =========================================================

          format_pattern = r'(?m)^    private fun formatMin\(m:Int\):String=.*$'

          matches = re.findall(
              format_pattern,
              s
          )

          if len(matches) != 1:
              raise SystemExit(
                  f"ERRO: formatMin: encontrado {len(matches)} vez(es)"
              )

          s = re.sub(
              format_pattern,
              '    private fun formatMin(m:Int):String="%02d:%02d".format(Locale.US,max(0,m)/60,max(0,m)%60)',
              s,
              count=1
          )

          # =========================================================
          # FUNÇÕES DE HORÁRIO
          # =========================================================

          marker = "    private fun getRecord(empId:Long,date:String):PunchDay{"

          if marker not in s:
              raise SystemExit(
                  "ERRO: getRecord não encontrado"
              )

          helper = '''    private fun normalizeTime(value:String):String{
              val digits=value.filter{it.isDigit()}.take(4)

              if(digits.length!=4){
                  return ""
              }

              val hour=digits.substring(0,2).toIntOrNull()
                  ?:return ""

              val minute=digits.substring(2,4).toIntOrNull()
                  ?:return ""

              if(hour !in 0..23 || minute !in 0..59){
                  return ""
              }

              return "%02d:%02d".format(
                  Locale.US,
                  hour,
                  minute
              )
          }

          private fun timeEdit(
              initial:String="",
              hintText:String="00:00"
          ):EditText{

              val e=EditText(this).apply{

                  hint=hintText

                  inputType=2

                  setSingleLine()

                  val normalized=normalizeTime(initial)

                  if(normalized.isNotEmpty()){
                      setText(normalized)
                  }
              }

              var changing=false

              e.addTextChangedListener(
                  object:android.text.TextWatcher{

                      override fun beforeTextChanged(
                          s:CharSequence?,
                          start:Int,
                          count:Int,
                          after:Int
                      ){}

                      override fun onTextChanged(
                          s:CharSequence?,
                          start:Int,
                          before:Int,
                          count:Int
                      ){}

                      override fun afterTextChanged(
                          editable:android.text.Editable?
                      ){

                          if(changing){
                              return
                          }

                          val digits=
                              editable
                                  ?.toString()
                                  ?.filter{it.isDigit()}
                                  ?.take(4)
                                  .orEmpty()

                          val formatted=when{

                              digits.isEmpty()->""

                              digits.length==1->
                                  digits

                              digits.length==2->
                                  digits+":"

                              digits.length==3->
                                  digits.substring(0,2)+":"+
                                  digits.substring(2)

                              else->
                                  digits.substring(0,2)+":"+
                                  digits.substring(2,4)
                          }

                          if(
                              formatted!=editable?.toString()
                          ){

                              changing=true

                              e.setText(formatted)

                              e.setSelection(
                                  e.text.length
                              )

                              changing=false
                          }
                      }
                  )
              )

              return e
          }

          '''

          if s.count("private fun normalizeTime") == 0:
              s = s.replace(
                  marker,
                  helper + marker,
                  1
              )

          # =========================================================
          # CÁLCULO DAS HORAS
          #
          # SUBSTITUI SOMENTE O BLOCO minutesBetween
          # ATÉ formatMin.
          #
          # =========================================================

          minutes_pattern = (
              r'(?s)'
              r'    private fun minutesBetween\(a:String,b:String\):Int\{'
              r'.*?'
              r'\n    private fun formatMin'
          )

          replacement = '''    private fun minutesBetween(a:String,b:String):Int{
              val x=normalizeTime(a)
              val y=normalizeTime(b)

              if(x.isBlank()||y.isBlank()){
                  return 0
              }

              return try{

                  val xa=x.split(":")
                  val ya=y.split(":")

                  max(
                      0,
                      (ya[0].toInt()*60+ya[1].toInt()) -
                      (xa[0].toInt()*60+xa[1].toInt())
                  )

              }catch(_:Exception){
                  0
              }
          }

          private fun formatMin'''

          s, n = re.subn(
              minutes_pattern,
              replacement,
              s,
              count=1
          )

          if n != 1:
              raise SystemExit(
                  f"ERRO: minutesBetween: encontrado {n} bloco(s)"
              )

          # =========================================================
          # ADIÇÃO MANUAL
          # =========================================================

          replace_once(
              'val e=EditText(this).apply{setText(r.punches[index]);hint="HH:mm";inputType=2;setSingleLine()}',
              'val e=timeEdit(r.punches[index],punchNames[index])',
              "campo de adição manual"
          )

          replace_once(
              'r.punches[index]=e.text.toString();saveData();showPunch()',
              'r.punches[index]=normalizeTime(e.text.toString());saveData();showPunch()',
              "salvamento da adição manual"
          )

          # =========================================================
          # EDIÇÃO DOS 6 HORÁRIOS
          # =========================================================

          replace_once(
              'val fields=r.punches.mapIndexed{i,v->EditText(this).apply{hint=punchNames[i];setText(v);inputType=2;setSingleLine();}}',
              'val fields=r.punches.mapIndexed{i,v->timeEdit(v,punchNames[i])}',
              "campos de edição"
          )

          replace_once(
              'fields.forEachIndexed{i,e->r.punches[i]=e.text.toString()};saveData();showHistory()',
              'fields.forEachIndexed{i,e->r.punches[i]=normalizeTime(e.text.toString())};saveData();showHistory()',
              "salvamento da edição"
          )

          # =========================================================
          # ESCALA
          # =========================================================

          replace_once(
              'val ed=EditText(this).apply{setText(p.second);hint="00:00";gravity=Gravity.CENTER;inputType=2;setSingleLine()}',
              'val ed=timeEdit(p.second,"00:00").apply{gravity=Gravity.CENTER}',
              "horários da escala"
          )

          replace_once(
              '0->s.e=ed.text.toString();1->s.x1=ed.text.toString();2->s.r1=ed.text.toString();3->s.x2=ed.text.toString()',
              '0->s.e=normalizeTime(ed.text.toString());1->s.x1=normalizeTime(ed.text.toString());2->s.r1=normalizeTime(ed.text.toString());3->s.x2=normalizeTime(ed.text.toString())',
              "salvamento da escala"
          )

          # =========================================================
          # SALVAR ARQUIVO
          # =========================================================

          p.write_text(
              s,
              encoding="utf-8"
          )

          print("========================================")
          print(" CORREÇÕES APLICADAS")
          print("========================================")
          print("UI ORIGINAL PRESERVADA")
          print("REGISTRO OK")
          print("ADIÇÃO MANUAL OK")
          print("DOIS PONTOS AUTOMÁTICOS OK")
          print("SOMATÓRIO OK")
          print("FORMATO 00:00 OK")
          print("HISTÓRICO OK")
          print("ESCALA OK")
          print("========================================")
          print("LINHAS:",len(s.splitlines()))
          print("========================================")
          PY

      - name: Verificar código Kotlin
        shell: bash
        run: |
          set -e

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          test -s "$FILE"

          grep -q "private fun normalizeTime" "$FILE"
          grep -q "private fun timeEdit" "$FILE"
          grep -q "private fun minutesBetween" "$FILE"
          grep -q 'private fun formatMin(m:Int):String="%02d:%02d"' "$FILE"

          echo "========================================"
          echo " CÓDIGO KOTLIN VALIDADO"
          echo "========================================"

          wc -l "$FILE"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"

          unzip -q \
            "gradle-8.11.1-bin.zip"

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          export PATH="$PWD/gradle-8.11.1/bin:$PATH"

          gradle --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo " GERANDO APK"
          echo "========================================"

          gradle assembleDebug --no-daemon --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "========================================"
          echo " APK GERADO"
          echo "========================================"

          ls -lh "$APK"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" > /dev/null

          echo "========================================"
          echo " APK ÍNTEGRO"
          echo "========================================"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Finalizar
        shell: bash
        run: |
          echo "========================================"
          echo " BUILD FINALIZADO"
          echo "========================================"
