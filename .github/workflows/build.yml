                          )
                      )

                      dialog.dismiss()
                  }

                  dialog.show()

                  dialog.window?.setBackgroundDrawableResource(
                      android.R.color.transparent
                  )

                  dialog.window?.setLayout(
                      -1,
                      -2
                  )
              }

          '''

          if "showControleHorasWheelDialog(" not in code:

              anchor=code.find(
                  "    private fun showManualWheel("
              )

              if anchor<0:
                  raise SystemExit(
                      "showManualWheel não encontrado"
                  )

              code=(
                  code[:anchor]
                  + wheel_dialog
                  + "\n"
                  + code[anchor:]
              )

          # ==========================================================
          # SUBSTITUIR SHOW EDIT WHEEL
          # ==========================================================

          edit_start=code.find(
              "    private fun showEditWheel("
          )

          if edit_start<0:
              raise SystemExit(
                  "showEditWheel não encontrado"
              )

          edit_end=code.find(
              "    private fun showManualWheel(",
              edit_start
          )

          if edit_end<0:
              raise SystemExit(
                  "fim de showEditWheel não encontrado"
              )

          edit_method=r'''
              private fun showEditWheel(
                  rec:PunchDay,
                  index:Int
              ){

                  val old=
                      rec.punches[index]

                  val parts=
                      old.split(":")

                  val now=
                      Calendar.getInstance()

                  val hour=
                      if(
                          parts.size==2
                      )
                          parts[0].toIntOrNull()
                              ?:now.get(Calendar.HOUR_OF_DAY)
                      else
                          now.get(Calendar.HOUR_OF_DAY)

                  val minute=
                      if(
                          parts.size==2
                      )
                          parts[1].toIntOrNull()
                              ?:now.get(Calendar.MINUTE)
                      else
                          now.get(Calendar.MINUTE)

                  showControleHorasWheelDialog(
                      "Editar registro",
                      df.format(
                          parseIso(rec.date)
                      ),
                      hour,
                      minute
                  ){value->

                      rec.punches[index]=value

                      saveData()

                      showPunch()
                  }
              }

          '''

          code=(
              code[:edit_start]
              + edit_method
              + code[edit_end:]
          )

          # ==========================================================
          # SUBSTITUIR SHOW MANUAL WHEEL
          # ==========================================================

          manual_start=code.find(
              "    private fun showManualWheel("
          )

          if manual_start<0:
              raise SystemExit(
                  "showManualWheel não encontrado"
              )

          manual_end=code.find(
              "    private fun ",
              manual_start+20
          )

          if manual_end<0:
              manual_end=len(code)

          manual_method=r'''
              private fun showManualWheel(
                  empId:Long
              ){

                  val r=
                      getRecord(
                          empId,
                          selectedPunchDate
                      )

                  val n=
                      nextPunchIndex(
                          r,
                          extraEnabled(
                              empId,
                              selectedPunchDate
                          )
                      )

                  if(n<0){

                      Toast.makeText(
                          this,
                          "As batidas deste dia já estão preenchidas.",
                          Toast.LENGTH_LONG
                      ).show()

                      return
                  }

                  val now=
                      Calendar.getInstance()

                  showControleHorasWheelDialog(
                      "Registro manual",
                      df.format(
                          parseIso(
                              selectedPunchDate
                          )
                      ),
                      now.get(
                          Calendar.HOUR_OF_DAY
                      ),
                      now.get(
                          Calendar.MINUTE
                      )
                  ){value->

                      r.punches[n]=value

                      saveData()

                      showPunch()
                  }
              }

          '''

          code=(
              code[:manual_start]
              + manual_method
              + code[manual_end:]
          )

          # ==========================================================
          # REGISTER PUNCH
          # ==========================================================

          register_start=code.find(
              "    private fun registerPunch("
          )

          if register_start>=0:

              register_end=code.find(
                  "    private fun ",
                  register_start+25
              )

              if register_end<0:
                  register_end=len(code)

              register_method=r'''
                  private fun registerPunch(
                      empId:Long
                  ){

                      if(
                          selectedPunchDate!=today()
                      ){

                          showManualWheel(
                              empId
                          )

                          return
                      }

                      val r=
                          getRecord(
                              empId,
                              selectedPunchDate
                          )

                      val n=
                          nextPunchIndex(
                              r,
                              extraEnabled(
                                  empId,
                                  selectedPunchDate
                              )
                          )

                      if(n<0)
                          return

                      r.punches[n]=nowTime()

                      saveData()

                      showPunch()
                  }

              '''

              code=(
                  code[:register_start]
                  + register_method
                  + code[register_end:]
              )

          # ==========================================================
          # SUBSTITUIR SHOW PUNCH
          # ==========================================================

          show_start=code.find(
              "    private fun showPunch()"
          )

          if show_start<0:
              raise SystemExit(
                  "showPunch não encontrado"
              )

          show_end=code.find(
              "    private fun showHistory()",
              show_start
          )

          if show_end<0:

              show_end=code.find(
                  "    private fun showHist",
                  show_start
              )

          if show_end<0:
              raise SystemExit(
                  "fim de showPunch não encontrado"
              )

          show_method=r'''
              private fun showPunch(){

                  controleHorasPunchPage?.let{old->

                      (
                          old.parent
                          as? ViewGroup
                      )?.removeView(old)
                  }

                  val box=
                      page("Bater Ponto")

                  controleHorasPunchPage=box

                  if(employees.isEmpty()){

                      box.addView(
                          infoCard(
                              "Nenhum funcionário cadastrado.\n"
                              +"Cadastre o primeiro em Funcionários."
                          )
                      )

                      return
                  }

                  val emp=
                      employees.firstOrNull{
                          it.id==
                          selectedEmployeeId
                      }
                      ?:employees.first().also{

                          selectedEmployeeId=
                              it.id
                      }

                  box.addView(
                      card().apply{

                          val line=
                              LinearLayout(context).apply{

                                  orientation=
                                      LinearLayout.VERTICAL

                                  setPadding(
                                      dp(16),
                                      dp(12),
                                      dp(16),
                                      dp(12)
                                  )
                              }

                          line.addView(
                              label("Funcionário")
                          )

                          val spinner=
                              Spinner(context)

                          spinner.adapter=
                              ArrayAdapter(
                                  context,
                                  android.R.layout.simple_spinner_dropdown_item,
                                  employees.map{
                                      it.name
                                  }
                              )

                          spinner.setSelection(
                              employees
                                  .indexOfFirst{
                                      it.id==
                                      selectedEmployeeId
                                  }
                                  .coerceAtLeast(0)
                          )

                          spinner.onItemSelectedListener=
                              object:
                              AdapterView.OnItemSelectedListener{

                                  override fun onNothingSelected(
                                      p:AdapterView<*>?
                                  ){}

                                  override fun onItemSelected(
                                      p:AdapterView<*>?,
                                      v:View?,
                                      pos:Int,
                                      id:Long
                                  ){

                                      if(
                                          employees[pos].id!=
                                          selectedEmployeeId
                                      ){

                                          selectedEmployeeId=
                                              employees[pos].id

                                          selectedPunchDate=
                                              today()

                                          showPunch()
                                      }
                                  }
                              }

                          line.addView(
                              spinner
                          )

                          line.addView(
                              TextView(context).apply{

                                  text=
                                      "Salário mensal   "
                                      +"${money.format(emp.salary)}"

                                  textSize=14f

                                  setTextColor(
                                      muted
                                  )

                                  setPadding(
                                      0,
                                      dp(8),
                                      0,
                                      0
                                  )
                              }
                          )

                          addView(line)
                      },
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      ).apply{
                          bottomMargin=dp(10)
                      }
                  )

                  val dateCard=
                      card()

                  val dateLine=
                      LinearLayout(this).apply{

                          orientation=
                              LinearLayout.HORIZONTAL

                          gravity=
                              Gravity.CENTER_VERTICAL

                          setPadding(
                              dp(14),
                              dp(8),
                              dp(14),
                              dp(8)
                          )
                      }

                  dateLine.addView(
                      TextView(this).apply{

                          text="📅"

                          textSize=25f
                      },
                      LinearLayout.LayoutParams(
                          dp(45),
                          dp(55)
                      )
                  )

                  dateLine.addView(
                      TextView(this).apply{

                          text=
                              "DATA\n"
                              +"${df.format(parseIso(selectedPunchDate))}"

                          textSize=16f

                          setTypeface(
                              null,
                              Typeface.BOLD
                          )

                          setTextColor(
                              this@MainActivity.text
                          )

                      },
                      LinearLayout.LayoutParams(
                          0,
                          dp(60),
                          1f
                      )
                  )

                  dateLine.addView(
                      Button(this).apply{

                          text="ALTERAR"

                          isAllCaps=false

                          setOnClickListener{
                              choosePunchDate()
                          }

                      },
                      LinearLayout.LayoutParams(
                          dp(105),
                          dp(52)
                      )
                  )

                  dateCard.addView(
                      dateLine
                  )

                  box.addView(
                      dateCard,
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      ).apply{
                          bottomMargin=dp(10)
                      }
                  )

                  box.addView(
                      Button(this).apply{

                          text=
                              "✎  REGISTRO MANUAL"

                          isAllCaps=false

                          textSize=15f

                          setOnClickListener{

                              showManualWheel(
                                  emp.id
                              )
                          }

                      },
                      LinearLayout.LayoutParams(
                          -1,
                          dp(56)
                      ).apply{
                          bottomMargin=dp(10)
                      }
                  )

                  val rec=
                      getRecord(
                          emp.id,
                          selectedPunchDate
                      )

                  val extra=
                      extraEnabled(
                          emp.id,
                          selectedPunchDate
                      )

                  val next=
                      nextPunchIndex(
                          rec,
                          extra
                      )

                  box.addView(
                      Button(this).apply{

                          text=
                              if(next<0)
                                  "PONTO DO DIA COMPLETO"
                              else
                                  "▶  REGISTRAR PRÓXIMA BATIDA\n"
                                  +"${punchNames[next]}"

                          textSize=15f

                          setTextColor(
                              Color.WHITE
                          )

                          isAllCaps=false

                          isEnabled=
                              next>=0

                          background(
                              green,
                              dp(18),
                              dp(18),
                              dp(18),
                              dp(18)
                          )

                          setOnClickListener{
                              registerPunch(
                                  emp.id
                              )
                          }

                      },
                      LinearLayout.LayoutParams(
                          -1,
                          dp(76)
                      ).apply{
                          bottomMargin=dp(12)
                      }
                  )

                  box.addView(
                      TextView(this).apply{

                          text=
                              "BATIDAS DO DIA"

                          textSize=13f

                          setTypeface(
                              null,
                              Typeface.BOLD
                          )

                          setTextColor(
                              muted
                          )

                          setPadding(
                              dp(4),
                              dp(2),
                              0,
                              dp(7)
                          )
                      }
                  )

                  addPunchRow(
                      box,
                      rec,
                      0,
                      punchNames[0]
                  )

                  addPunchRow(
                      box,
                      rec,
                      1,
                      punchNames[1]
                  )

                  addPunchRow(
                      box,
                      rec,
                      2,
                      punchNames[2]
                  )

                  box.addView(
                      TextView(this).apply{

                          text=
                              "INTERVALO 2 (OPCIONAL)"

                          textSize=13f

                          setTypeface(
                              null,
                              Typeface.BOLD
                          )

                          setTextColor(
                              muted
                          )

                          setPadding(
                              dp(4),
                              dp(10),
                              0,
                              dp(5)
                          )
                      }
                  )

                  addExtraSwitch(
                      box,
                      emp.id,
                      selectedPunchDate,
                      0,
                      rec
                  )

                  addExtraSwitch(
                      box,
                      emp.id,
                      selectedPunchDate,
                      1,
                      rec
                  )

                  addPunchRow(
                      box,
                      rec,
                      3,
                      punchNames[3]
                  )

                  addPunchRow(
                      box,
                      rec,
                      4,
                      punchNames[4]
                  )

                  addPunchRow(
                      box,
                      rec,
                      5,
                      punchNames[5]
                  )

                  val calc=
                      calculate(rec)

                  val cards=
                      LinearLayout(this).apply{

                          orientation=
                              LinearLayout.HORIZONTAL

                          setPadding(
                              0,
                              dp(5),
                              0,
                              dp(15)
                          )
                      }

                  cards.addView(
                      metricCard(
                          "Horas trabalhadas",
                          formatMin(
                              calc.worked
                          ),
                          blue
                      ),
                      LinearLayout.LayoutParams(
                          0,
                          dp(82),
                          1f
                      ).apply{
                          rightMargin=dp(6)
                      }
                  )

                  cards.addView(
                      metricCard(
                          "Horas extras",
                          formatMin(
                              calc.extra60+
                              calc.extra100
                          ),
                          green
                      ),
                      LinearLayout.LayoutParams(
                          0,
                          dp(82),
                          1f
                      ).apply{
                          leftMargin=dp(6)
                      }
                  )

                  box.addView(cards)
              }

          '''

          code=(
              code[:show_start]
              + show_method
              + code[show_end:]
          )

          # ==========================================================
          # PERMITIR EDITAR BATIDA VAZIA
          # ==========================================================

          code=code.replace(
              '''if(rec.punches[index].isBlank()){
                  Toast.makeText(
                      this,
                      "Esse registro ainda está vazio. Use REGISTRO MANUAL.",
                      Toast.LENGTH_LONG
                  ).show()
                  return
              }''',
              ""
          )

          # ==========================================================
          # GARANTIR MANIFESTO
          # ==========================================================

          manifest=Path(
              "ControleHoras/app/src/main/AndroidManifest.xml"
          )

          m=manifest.read_text(
              encoding="utf-8"
          )

          if (
              'android:icon="@drawable/controlehoras_icon"'
              not in m
          ):

              m=m.replace(
                  "<application",
                  '<application\n'
                  '        android:icon="@drawable/controlehoras_icon"\n'
                  '        android:roundIcon="@drawable/controlehoras_icon"',
                  1
              )

              manifest.write_text(
                  m,
                  encoding="utf-8"
              )

          # ==========================================================
          # VALIDAR
          # ==========================================================

          required=[
              "ControleHorasTimeWheelView",
              "showControleHorasWheelDialog",
              "showManualWheel",
              "showEditWheel",
              "punchNames",
              "controleHorasPunchPage",
              "extra2Enabled",
              "nextPunchIndex"
          ]

          for item in required:

              if item not in code:

                  raise SystemExit(
                      "ERRO: recurso não encontrado: "
                      + item
                  )

          if "NumberPicker(" in code:

              raise SystemExit(
                  "ERRO: NumberPicker ainda presente"
              )

          if "Esse registro ainda está vazio" in code:

              raise SystemExit(
                  "ERRO: mensagem antiga ainda presente"
              )

          src.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "TELA + ROLETA + SOM APLICADOS"
          )

      - name: Validar projeto antes do Gradle
        shell: bash
        run: |
          set -e

          SRC="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          ICON="ControleHoras/app/src/main/res/drawable/controlehoras_icon.jpg"

          SOUND="ControleHoras/app/src/main/res/raw/roller_click.wav"

          test -s "$SRC"
          test -s "$ICON"
          test -s "$SOUND"

          grep -q \
            "ControleHorasTimeWheelView" \
            "$SRC"

          grep -q \
            "showControleHorasWheelDialog" \
            "$SRC"

          grep -q \
            "controleHorasPunchPage" \
            "$SRC"

          grep -q \
            "punchNames" \
            "$SRC"

          grep -q \
            'controlehoras_icon' \
            ControleHoras/app/src/main/AndroidManifest.xml

          if grep -q "NumberPicker(" "$SRC"; then
              echo "ERRO: NumberPicker encontrado"
              exit 1
          fi

          if grep -q "Esse registro ainda está vazio" "$SRC"; then
              echo "ERRO: mensagem antiga encontrada"
              exit 1
          fi

          echo "VALIDAÇÃO DO PROJETO OK"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

          echo "APK GERADO COM SUCESSO"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t \
            "$APK" \
            >/dev/null

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
