name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto original
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Aplicar Base 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name, next_name):

              start = workflow.index(
                  "      - name: " + name
              )

              end = workflow.index(
                  "      - name: " + next_name,
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              pos = (
                  block.index(marker)
                  + len(marker)
              )

              lines = block[pos:].splitlines()

              result = []

              for line in lines:

                  if line.startswith("          "):
                      result.append(line[10:])
                  else:
                      result.append(line)

              return "\n".join(result) + "\n"

          scripts = [
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for i, script in enumerate(scripts):

              path = (
                  Path(tempfile.gettempdir())
                  / f"base70_{i}.py"
              )

              path.write_text(
                  script,
                  encoding="utf-8"
              )

              subprocess.run(
                  [
                      "python",
                      str(path)
                  ],
                  check=True
              )

          print("BASE 70 APLICADA")
          print("ESCALA DA BASE 70 PRESERVADA")

      - name: Criar roleta 3D azul neon
        shell: bash
        run: |
          set -euo pipefail

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/TimeWheelView.kt"

          mkdir -p "$(dirname "$FILE")"

          cat > "$FILE" <<'KOTLIN'
          package com.didhuuu.controlehoras

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Shader
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.abs

          class TimeWheelView(
              context: Context,
              private val minValue: Int,
              private val maxValue: Int,
              initialValue: Int
          ) : View(context) {

              var value: Int =
                  initialValue.coerceIn(
                      minValue,
                      maxValue
                  )
                  private set

              var onValueChanged:
                  ((Int) -> Unit)? = null

              private val density =
                  resources.displayMetrics.density

              private val paint =
                  Paint(Paint.ANTI_ALIAS_FLAG)

              private val tone =
                  ToneGenerator(
                      AudioManager.STREAM_NOTIFICATION,
                      55
                  )

              private var lastY = 0f
              private var accumulated = 0f

              private fun dp(
                  value: Float
              ): Float {
                  return value * density
              }

              init {
                  setBackgroundColor(
                      Color.TRANSPARENT
                  )

                  isClickable = true
              }

              private fun change(
                  step: Int
              ) {

                  var next =
                      value + step

                  if (next > maxValue) {
                      next = minValue
                  }

                  if (next < minValue) {
                      next = maxValue
                  }

                  if (next != value) {

                      value = next

                      tone.startTone(
                          ToneGenerator.TONE_PROP_BEEP,
                          28
                      )

                      onValueChanged?.invoke(
                          value
                      )

                      invalidate()
                  }
              }

              override fun onDraw(
                  canvas: Canvas
              ) {

                  super.onDraw(canvas)

                  val widthF =
                      width.toFloat()

                  val heightF =
                      height.toFloat()

                  val centerY =
                      heightF / 2f

                  /*
                   * FUNDO AZUL/NEON.
                   * SEM PRATA.
                   */
                  paint.shader =
                      LinearGradient(
                          0f,
                          centerY - dp(55f),
                          widthF,
                          centerY + dp(55f),
                          intArrayOf(
                              Color.rgb(
                                  2,
                                  25,
                                  75
                              ),
                              Color.rgb(
                                  5,
                                  65,
                                  150
                              ),
                              Color.rgb(
                                  20,
                                  125,
                                  245
                              ),
                              Color.rgb(
                                  5,
                                  65,
                                  150
                              ),
                              Color.rgb(
                                  2,
                                  25,
                                  75
                              )
                          ),
                          null,
                          Shader.TileMode.CLAMP
                      )

                  canvas.drawRoundRect(
                      dp(7f),
                      centerY - dp(42f),
                      widthF - dp(7f),
                      centerY + dp(42f),
                      dp(18f),
                      dp(18f),
                      paint
                  )

                  paint.shader = null

                  /*
                   * BRILHO SUPERIOR.
                   */
                  paint.color =
                      Color.argb(
                          130,
                          75,
                          220,
                          255
                      )

                  paint.strokeWidth =
                      dp(2f)

                  canvas.drawLine(
                      dp(14f),
                      centerY - dp(39f),
                      widthF - dp(14f),
                      centerY - dp(39f),
                      paint
                  )

                  /*
                   * BRILHO INFERIOR.
                   */
                  paint.color =
                      Color.argb(
                          90,
                          30,
                          130,
                          255
                      )

                  canvas.drawLine(
                      dp(14f),
                      centerY + dp(39f),
                      widthF - dp(14f),
                      centerY + dp(39f),
                      paint
                  )

                  /*
                   * NÚMEROS.
                   */
                  paint.textAlign =
                      Paint.Align.CENTER

                  val stepHeight =
                      dp(46f)

                  val range =
                      maxValue - minValue + 1

                  for (offset in -2..2) {

                      var number =
                          value + offset

                      while (
                          number > maxValue
                      ) {
                          number -= range
                      }

                      while (
                          number < minValue
                      ) {
                          number += range
                      }

                      val y =
                          centerY +
                          offset * stepHeight

                      val distance =
                          abs(offset)

                      val scale =
                          1f -
                          distance * 0.16f

                      val alpha =
                          when (distance) {
                              0 -> 255
                              1 -> 170
                              else -> 90
                          }

                      canvas.save()

                      canvas.scale(
                          scale,
                          scale * 0.88f,
                          widthF / 2f,
                          y
                      )

                      paint.textSize =
                          dp(
                              if (
                                  offset == 0
                              ) {
                                  30f
                              } else {
                                  22f
                              }
                          )

                      paint.typeface =
                          android.graphics.Typeface.create(
                              android.graphics.Typeface.DEFAULT,
                              android.graphics.Typeface.BOLD
                          )

                      paint.color =
                          Color.argb(
                              alpha,
                              if (
                                  offset == 0
                              ) {
                                  255
                              } else {
                                  210
                              },
                              if (
                                  offset == 0
                              ) {
                                  255
                              } else {
                                  230
                              },
                              255
                          )

                      if (
                          offset == 0
                      ) {

                          paint.setShadowLayer(
                              dp(9f),
                              0f,
                              dp(2f),
                              Color.rgb(
                                  0,
                                  45,
                                  150
                              )
                          )
                      }

                      canvas.drawText(
                          String.format(
                              "%02d",
                              number
                          ),
                          widthF / 2f,
                          y + dp(10f),
                          paint
                      )

                      paint.clearShadowLayer()

                      canvas.restore()
                  }

                  /*
                   * LINHAS DE SELEÇÃO.
                   */
                  paint.style =
                      Paint.Style.STROKE

                  paint.strokeWidth =
                      dp(2.2f)

                  paint.color =
                      Color.rgb(
                          75,
                          215,
                          255
                      )

                  canvas.drawLine(
                      dp(5f),
                      centerY - dp(32f),
                      widthF - dp(5f),
                      centerY - dp(32f),
                      paint
                  )

                  canvas.drawLine(
                      dp(5f),
                      centerY + dp(32f),
                      widthF - dp(5f),
                      centerY + dp(32f),
                      paint
                  )

                  paint.style =
                      Paint.Style.FILL
              }

              override fun onTouchEvent(
                  event: MotionEvent
              ): Boolean {

                  when (
                      event.actionMasked
                  ) {

                      MotionEvent.ACTION_DOWN -> {

                          lastY =
                              event.y

                          accumulated =
                              0f

                          return true
                      }

                      MotionEvent.ACTION_MOVE -> {

                          val delta =
                              event.y - lastY

                          accumulated +=
                              delta

                          lastY =
                              event.y

                          while (
                              accumulated <=
                              -dp(24f)
                          ) {

                              change(1)

                              accumulated +=
                                  dp(24f)
                          }

                          while (
                              accumulated >=
                              dp(24f)
                          ) {

                              change(-1)

                              accumulated -=
                                  dp(24f)
                          }

                          return true
                      }

                      MotionEvent.ACTION_UP -> {

                          if (
                              abs(accumulated) <
                              dp(8f)
                          ) {

                              if (
                                  event.y <
                                  height / 2f -
                                  dp(10f)
                              ) {

                                  change(1)

                              } else if (
                                  event.y >
                                  height / 2f +
                                  dp(10f)
                              ) {

                                  change(-1)
                              }
                          }

                          performClick()

                          return true
                      }
                  }

                  return true
              }

              override fun performClick():
                  Boolean {

                  super.performClick()

                  return true
              }

              override fun onDetachedFromWindow() {

                  tone.release()

                  super.onDetachedFromWindow()
              }
          }
          KOTLIN

          test -s "$FILE"

          echo "ROTA 3D AZUL NEON CRIADA"

