              extra_functions = """    private fun extraKey(
          empId:Long,
          date:String
      )=empId.toString()+"|"+date

      private fun extraEnabled(
          empId:Long,
          date:String
      )=extra2Enabled.contains(
          extraKey(empId,date)
      )

      private fun extraReturnEnabled(
          empId:Long,
          date:String
      )=extra2ReturnEnabled.contains(
          extraKey(empId,date)
      )

      private fun setExtraEnabled(
          empId:Long,
          date:String,
          value:Boolean
      ){
          val k=extraKey(empId,date)

          if(value){
              extra2Enabled.add(k)
          }else{
              extra2Enabled.remove(k)
              extra2ReturnEnabled.remove(k)
          }

