                          dp(150)
                      )
                  )

                  wheels.addView(
                      sep,
                      LinearLayout.LayoutParams(
                          dp(35),
                          dp(150)
                      )
                  )

                  wheels.addView(
                      minute,
                      LinearLayout.LayoutParams(
                          dp(88),
                          dp(150)
