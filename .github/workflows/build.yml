name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a Base 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          def get_workflow(sha):
              url = (
                  "https://raw.githubusercontent.com/"
                  f"didhuuu/ControleHoras/{sha}/"
                  ".github/workflows/build.yml"
              )

              return urlopen(
                  url,
                  timeout=30
              ).read().decode("utf-8")

          def extract_step(
              workflow,
              name,
              next_name
          ):

              start = workflow.index(
                  f"      - name: {name}"
              )

              end = workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block = workflow[
                  start:end
              ]

              marker = "        run: |\n"

              pos = (
                  block.index(marker)
                  + len(marker)
              )

              lines = block[
                  pos:
              ].splitlines()

              return "\n".join(
                  line[10:]
                  if line.startswith("          ")
                  else line
                  for line in lines
              ) + "\n"

          workflow = get_workflow(
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2"
          )

          scripts = [

              extract_step(
                  workflow,
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),

              extract_step(
                  workflow,
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for index, script in enumerate(
              scripts
          ):

              path = (
                  Path(tempfile.gettempdir())
                  / f"base70_{index}.py"
              )

              path.write_text(
                  script,
                  encoding="utf-8"
              )

              compile(
                  script,
                  str(path),
                  "exec"
              )

              subprocess.run(
                  [
                      "python",
                      str(path)
                  ],
                  check=True
              )

          print(
              "BASE 70 APLICADA"
          )

      - name: Aplicar tela estável da Base 70 + intervalo 2
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          start = workflow.index(
              "      - name: Aplicar correções finais da Base 70, edição por rolagem e ícone"
          )

          end = workflow.index(
              "      - name: Validar código e ícone",
              start
          )

          block = workflow[
              start:end
          ]

          marker = "        run: |\n"

          pos = (
              block.index(marker)
              + len(marker)
          )

          lines = block[
              pos:
          ].splitlines()

          script = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in lines
          ) + "\n"

          path = (
              Path(tempfile.gettempdir())
              / "base70_tela.py"
          )

          path.write_text(
              script,
              encoding="utf-8"
          )

          compile(
              script,
              str(path),
              "exec"
          )

          subprocess.run(
              [
                  "python",
                  str(path)
              ],
              check=True
          )

          print(
              "TELA BASE 70 APLICADA"
          )

      - name: Corrigir cartão do funcionário sem quebrar o addView
        shell: python
        run: |
          from pathlib import Path

          src = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          code = src.read_text(
              encoding="utf-8"
          )

          def find_matching(
              text,
              opening,
              start
          ):

              pairs = {
                  "(": ")",
                  "{": "}",
                  "[": "]"
              }

              closing = pairs[opening]

              depth = 0
              quote = None
              triple = False
              escape = False

              i = start

              while i < len(text):

                  ch = text[i]

                  if quote:

                      if escape:

                          escape = False

                      elif ch == "\\":

                          escape = True

                      elif triple:

                          if text.startswith(
                              quote * 3,
                              i
                          ):

                              quote = None
                              triple = False
                              i += 2

                      elif ch == quote:

                          quote = None

                      i += 1

                      continue

                  if text.startswith(
                      '"""',
                      i
                  ):

                      quote = '"'
                      triple = True
                      i += 3
                      continue

                  if ch in "\"'":

                      quote = ch
                      i += 1
                      continue

                  if ch == opening:

                      depth += 1

                  elif ch == closing:

                      depth -= 1

                      if depth == 0:

                          return i

                  i += 1

              raise RuntimeError(
                  "delimitador não fechado"
              )

          show_start = code.find(
              "    private fun showPunch()"
          )

          show_end = code.find(
              "    private fun showHistory()",
              show_start
          )

          if (
              show_start < 0
              or show_end < 0
          ):

              raise SystemExit(
                  "showPunch não encontrado"
              )

          show = code[
              show_start:show_end
          ]

          target = show.find(
              "box.addView(\n                      card().apply{"
          )

          if target < 0:

              target = show.find(
                  "box.addView(\n            card().apply{"
              )

          if target < 0:

              print(
                  "CARTÃO JÁ ESTÁ CORRETO"
              )

          else:

              absolute = (
                  show_start
                  + target
              )

              open_paren = code.find(
                  "(",
                  absolute
              )

              close_paren = find_matching(
                  code,
                  "(",
                  open_paren
              )

              inner_start = code.find(
                  "card().apply{",
                  absolute,
                  close_paren
              )

              if inner_start < 0:

                  raise SystemExit(
                      "card().apply não encontrado"
                  )

              card_open = code.find(
                  "{",
                  inner_start
              )

              card_close = find_matching(
                  code,
                  "{",
                  card_open
              )

              card_expr = code[
                  inner_start:
                  card_close + 1
              ]

              new = (
                  "val employeeCard=("
                  + card_expr
                  + ")\n\n"
                  "                  box.addView(\n"
                  "                      employeeCard,\n"
                  "                      LinearLayout.LayoutParams(-1,-2).apply{\n"
                  "                          bottomMargin=dp(10)\n"
                  "                      }\n"
                  "                  )"
              )

              code = (
                  code[:absolute]
                  + new
                  + code[close_paren + 1:]
              )

          if (
              "import android.view.ViewGroup"
              not in code
          ):

              code = code.replace(
                  "import android.view.View\n",
                  "import android.view.View\n"
                  "import android.view.ViewGroup\n",
                  1
              )

          code = code.replace(
              "import android.widget.NumberPicker\n",
              ""
          )

          src.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "CARTÃO DO FUNCIONÁRIO CORRIGIDO"
          )

      - name: Criar roleta azul neon 3D
        shell: bash
        run: |
          set -e

          WHEEL="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/TimeWheelView.kt"

          mkdir -p "$(dirname "$WHEEL")"

          cat > "$WHEEL" <<'KOT'
          package com.didhuuu.controlehoras

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Shader
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.abs

          class TimeWheelView(
              context: Context,
              private val min: Int,
              private val max: Int,
              initial: Int
          ) : View(context) {

              var value: Int =
                  initial.coerceIn(
                      min,
                      max
                  )
                  private set

              var onValueChanged:
                  ((Int) -> Unit)? = null

              private val density =
                  resources.displayMetrics.density

              private fun dp(
                  v: Int
              ) =
                  v * density

              private val paint =
                  Paint(
                      Paint.ANTI_ALIAS_FLAG
                  )

              private var lastY =
                  0f

              private var moved =
                  0f

              private val tone =
                  ToneGenerator(
                      AudioManager.STREAM_NOTIFICATION,
                      35
                  )

              init {

                  isClickable =
                      true

                  setBackgroundColor(
                      0x00000000
                  )
              }

              private fun change(
                  delta: Int
              ) {

                  var next =
                      value + delta

                  if(next > max)
                      next = min

                  if(next < min)
                      next = max

                  if(next != value) {

                      value =
                          next

                      tone.startTone(
                          ToneGenerator.TONE_PROP_BEEP,
                          35
                      )

                      onValueChanged?.invoke(
                          value
                      )

                      invalidate()
                  }
              }

              override fun onDraw(
                  canvas: Canvas
              ) {

                  super.onDraw(
                      canvas
                  )

                  val w =
                      width.toFloat()

                  val h =
                      height.toFloat()

                  val center =
                      h / 2f

                  paint.style =
                      Paint.Style.FILL

                  paint.shader =
                      LinearGradient(
                          0f,
                          0f,
                          w,
                          0f,
                          intArrayOf(
                              0xFF031B3A.toInt(),
                              0xFF006DFF.toInt(),
                              0xFF00B7FF.toInt(),
                              0xFF006DFF.toInt(),
                              0xFF031B3A.toInt()
                          ),
                          null,
                          Shader.TileMode.CLAMP
                      )

                  canvas.drawRoundRect(
                      dp(5),
                      dp(3),
                      w - dp(5),
                      h - dp(3),
                      dp(18),
                      dp(18),
                      paint
                  )

                  paint.shader =
                      null

                  paint.color =
                      0xFF062A52.toInt()

                  canvas.drawRoundRect(
                      dp(12),
                      center - dp(35),
                      w - dp(12),
                      center + dp(35),
                      dp(12),
                      dp(12),
                      paint
                  )

                  paint.color =
                      0xFF00B7FF.toInt()

                  paint.style =
                      Paint.Style.STROKE

                  paint.strokeWidth =
                      dp(2)

                  canvas.drawRoundRect(
                      dp(12),
                      center - dp(35),
                      w - dp(12),
                      center + dp(35),
                      dp(12),
                      dp(12),
                      paint
                  )

                  paint.style =
                      Paint.Style.FILL

                  paint.textAlign =
                      Paint.Align.CENTER

                  for(offset in -2..2) {

                      var v =
                          value + offset

                      val range =
                          max - min + 1

                      while(v > max)
                          v -= range

                      while(v < min)
                          v += range

                      paint.textSize =
                          if(offset == 0)
                              dp(27)
                          else
                              dp(20)

                      paint.color =
                          if(offset == 0)
                              0xFFFFFFFF.toInt()
                          else
                              0xFF9CCBFF.toInt()

                      canvas.drawText(
                          "%02d".format(v),
                          w / 2f,
                          center +
                          offset * dp(45) +
                          dp(9),
                          paint
                      )
                  }

                  paint.color =
                      0xFF00B7FF.toInt()

                  paint.strokeWidth =
                      dp(2)

                  paint.style =
                      Paint.Style.STROKE

                  canvas.drawLine(
                      dp(4),
                      center - dp(30),
                      dp(18),
                      center,
                      paint
                  )

                  canvas.drawLine(
                      dp(4),
                      center + dp(30),
                      dp(18),
                      center,
                      paint
                  )

                  canvas.drawLine(
                      w - dp(4),
                      center - dp(30),
                      w - dp(18),
                      center,
                      paint
                  )

                  canvas.drawLine(
                      w - dp(4),
                      center + dp(30),
                      w - dp(18),
                      center,
                      paint
                  )

                  paint.style =
                     
