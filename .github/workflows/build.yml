name: Gerar APK - ControleHoras

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto original
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "========================================"
          echo " PROJETO ORIGINAL ENCONTRADO"
          echo "========================================"

          wc -l ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

      - name: Corrigir aplicativo original
        shell: bash
        run: |
          set -e

          python3 -c '
          from pathlib import Path
          import re

          p = Path("ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt")
          s = p.read_text(encoding="utf-8")

          # ---------------------------------------------------------
          # CORREÇÕES DE COMPILAÇÃO
          # ---------------------------------------------------------

          s = s.replace(
              "        }, 0, 0, 0, dp(10))",
              "        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(10) })"
          )

          s = s.replace(
              "        }, 0, 0, 0, dp(12))",
              "        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(12) })"
          )

          s = s.replace(
              "setTextColor(text)",
              "setTextColor(this@MainActivity.text)"
          )

          s = s.replace(
              "setText(if(existing!=null)existing.salary.toString():\"\")",
              "setText(if (existing != null) existing.salary.toString() else \"\")"
          )

          # ---------------------------------------------------------
          # HISTÓRICO MENSAL
          # ---------------------------------------------------------

          s = s.replace(
              "it.date.endsWith(SimpleDateFormat(\"MM-yyyy\", Locale.US).format(Date()))",
              "it.date.startsWith(SimpleDateFormat(\"yyyy-MM\", Locale.US).format(Date()))"
          )

          # ---------------------------------------------------------
          # FORMATO DOS TOTAIS
          # SEMPRE 00:00
          # ---------------------------------------------------------

          s = re.sub(
              r"(?m)^\\s*private fun formatMin\\(m:Int\\):String=.*$",
              "    private fun formatMin(m:Int):String=\"%02d:%02d\".format(Locale.US,max(0,m)/60,max(0,m)%60)",
              s,
              count=1
          )

          # ---------------------------------------------------------
          # NORMALIZADOR DE HORÁRIO
          # ---------------------------------------------------------

          marker = "    private fun getRecord(empId:Long,date:String):PunchDay{"

          helper = (
              "    private fun normalizeTime(value:String):String{\\n"
              "        val digits=value.filter{it.isDigit()}.take(4)\\n"
              "        if(digits.isEmpty())return \"\"\\n"
              "        if(digits.length<3)return digits\\n"
              "        val hour=digits.substring(0,2).toIntOrNull()?:return \"\"\\n"
              "        val minute=digits.substring(2).toIntOrNull()?:0\\n"
              "        if(hour !in 0..23)return \"\"\\n"
              "        if(minute !in 0..59)return \"\"\\n"
              "        return \"%02d:%02d\".format(Locale.US,hour,minute)\\n"
              "    }\\n"
              "\\n"
              "    private fun timeEdit(initial:String=\"\",hintText:String=\"00:00\"):EditText{\\n"
              "        val e=EditText(this).apply{\\n"
              "            hint=hintText\\n"
              "            inputType=2\\n"
              "            setSingleLine()\\n"
              "            val normalized=normalizeTime(initial)\\n"
              "            if(normalized.length==5)setText(normalized)\\n"
              "        }\\n"
              "\\n"
              "        var changing=false\\n"
              "\\n"
              "        e.addTextChangedListener(object:android.text.TextWatcher{\\n"
              "            override fun beforeTextChanged(s:CharSequence?,start:Int,count:Int,after:Int){}\\n"
              "            override fun onTextChanged(s:CharSequence?,start:Int,before:Int,count:Int){}\\n"
              "            override fun afterTextChanged(editable:android.text.Editable?){\\n"
              "                if(changing)return\\n"
              "                val digits=editable?.toString()?.filter{it.isDigit()}?.take(4)?:""\\n"
              "                if(digits.isEmpty())return\\n"
              "                val formatted=when{\\n"
              "                    digits.length<=2->digits\\n"
              "                    else->digits.substring(0,2)+\":\"+digits.substring(2)\\n"
              "                }\\n"
              "                if(formatted!=editable.toString()){\\n"
              "                    changing=true\\n"
              "                    e.setText(formatted)\\n"
              "                    e.setSelection(e.text.length)\\n"
              "                    changing=false\\n"
              "                }\\n"
              "            }\\n"
              "        })\\n"
              "\\n"
              "        return e\\n"
              "    }\\n"
              "\\n"
          )

          if marker not in s:
              raise SystemExit("ERRO: getRecord não encontrado")

          if "private fun normalizeTime" not in s:
              s=s.replace(marker,helper+marker,1)

          # ---------------------------------------------------------
          # CÁLCULO DE MINUTOS
          # ---------------------------------------------------------

          old_start=s.find("    private fun minutesBetween(")

          if old_start==-1:
              raise SystemExit("ERRO: minutesBetween não encontrada")

          old_end=s.find("\\n    private fun ",old_start+10)

          if old_end==-1:
              raise SystemExit("ERRO: fim de minutesBetween não encontrado")

          new_minutes=(
              "    private fun minutesBetween(a:String,b:String):Int{\\n"
              "        val x=normalizeTime(a)\\n"
              "        val y=normalizeTime(b)\\n"
              "        if(x.isBlank()||y.isBlank())return 0\\n"
              "        return try{\\n"
              "            val xa=x.split(\":\")\\n"
              "            val ya=y.split(\":\")\\n"
              "            max(0,(ya[0].toInt()*60+ya[1].toInt())-(xa[0].toInt()*60+xa[1].toInt()))\\n"
              "        }catch(_:Exception){\\n"
              "            0\\n"
              "        }\\n"
              "    }"
          )

          s=s[:old_start]+new_minutes+s[old_end:]

          # ---------------------------------------------------------
          # ADIÇÃO MANUAL
          # ---------------------------------------------------------

          s=s.replace(
              "val e=EditText(this).apply{setText(r.punches[index]);hint=\"HH:mm\";inputType=2;setSingleLine()}",
              "val e=timeEdit(r.punches[index],punchNames[index])"
          )

          s=s.replace(
              "r.punches[index]=e.text.toString();saveData();showPunch()",
              "r.punches[index]=normalizeTime(e.text.toString());saveData();showPunch()"
          )

          # ---------------------------------------------------------
          # EDIÇÃO DOS 6 HORÁRIOS
          # ---------------------------------------------------------

          s=s.replace(
              "val fields=r.punches.mapIndexed{i,v->EditText(this).apply{hint=punchNames[i];setText(v);inputType=2;setSingleLine();}}",
              "val fields=r.punches.mapIndexed{i,v->timeEdit(v,punchNames[i])}"
          )

          s=s.replace(
              "r.punches[i]=e.text.toString()};saveData();showHistory()",
              "r.punches[i]=normalizeTime(e.text.toString())};saveData();showHistory()"
          )

          # ---------------------------------------------------------
          # ESCALA
          # ---------------------------------------------------------

          s=s.replace(
              "val ed=EditText(this).apply{setText(p.second);hint=\"00:00\";gravity=Gravity.CENTER;inputType=2;setSingleLine()}",
              "val ed=timeEdit(p.second,\"00:00\").apply{gravity=Gravity.CENTER}"
          )

          s=s.replace(
              "0->s.e=ed.text.toString();1->s.x1=ed.text.toString();2->s.r1=ed.text.toString();3->s.x2=ed.text.toString()",
              "0->s.e=normalizeTime(ed.text.toString());1->s.x1=normalizeTime(ed.text.toString());2->s.r1=normalizeTime(ed.text.toString());3->s.x2=normalizeTime(ed.text.toString())"
          )

          # ---------------------------------------------------------
          # SALVAR
          # ---------------------------------------------------------

          p.write_text(s,encoding="utf-8")

          print("========================================")
          print(" APLICATIVO ORIGINAL PRESERVADO")
          print("========================================")
          print("Registro: OK")
          print("Adição manual: OK")
          print("Hora 00:00: OK")
          print("Dois pontos automáticos: OK")
          print("Somatório: OK")
          print("Histórico: OK")
          print("Escala: OK")
          print("========================================")
          print("LINHAS:",len(s.splitlines()))
          print("========================================")
          '

      - name: Verificar código Kotlin
        shell: bash
        run: |
          set -e

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          test -s "$FILE"

          grep -q "private fun normalizeTime" "$FILE"
          grep -q "private fun timeEdit" "$FILE"
          grep -q "private fun minutesBetween" "$FILE"
          grep -q 'private fun formatMin(m:Int):String="%02d:%02d"' "$FILE"

          echo "========================================"
          echo " CÓDIGO VALIDADO"
          echo "========================================"

          tail -n 10 "$FILE"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"

          unzip -q "gradle-8.11.1-bin.zip"

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          export PATH="$PWD/gradle-8.11.1/bin:$PATH"

          gradle --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e
          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo " GERANDO APK"
          echo "========================================"

          gradle assembleDebug --no-daemon --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "========================================"
          echo " APK GERADO"
          echo "========================================"

          ls -lh "$APK"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" > /dev/null

          echo "========================================"
          echo " APK ÍNTEGRO"
          echo "========================================"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Finalizar
        shell: bash
        run: |
          echo "========================================"
          echo " BUILD FINALIZADO"
          echo "========================================"
