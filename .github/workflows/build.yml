name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip
          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          echo "BASE DO PROJETO OK"

      - name: Aplicar MainActivity corrigida
        shell: python
        env:
          MAIN_GZ_B64: >-
            

      - name: Instalar MainActivity
        shell: python
        run: |
          import base64
          import gzip
          from pathlib import Path

          data = base64.b64decode(__import__("os").environ["MAIN_GZ_B64"])
          source = gzip.decompress(data).decode("utf-8")

          target = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(source, encoding="utf-8")

          required = [
              "selectedPunchDate",
              "choosePunchDate",
              "normalizeTime",
              "weekModes",
              "HE 60%",
              "HE 100%",
              "DSR sobre horas extras",
              "FileProvider"
          ]

          for item in required:
              if item not in source:
                  raise SystemExit("FALTANDO: " + item)

          if source.count("{") != source.count("}"):
              raise SystemExit("CHAVES KOTLIN INCOMPATIVEIS")

          print("MainActivity instalada:", len(source.splitlines()), "linhas")

      - name: Corrigir FileProvider
        shell: python
        run: |
          from pathlib import Path

          root = Path("ControleHoras")
          manifest = root / "app/src/main/AndroidManifest.xml"
          xml_dir = root / "app/src/main/res/xml"
          xml_dir.mkdir(parents=True, exist_ok=True)

          m = manifest.read_text(encoding="utf-8")

          provider = '''
          <provider
              android:name="androidx.core.content.FileProvider"
              android:authorities="${applicationId}.fileprovider"
              android:exported="false"
              android:grantUriPermissions="true">
              <meta-data
                  android:name="android.support.FILE_PROVIDER_PATHS"
                  android:resource="@xml/paths" />
          </provider>
          '''

          if "${applicationId}.fileprovider" not in m:
              m = m.replace("</application>", provider + "\n    </application>")

          m = m.replace(
              'android:resource="@xml/file_paths"',
              'android:resource="@xml/paths"'
          )

          manifest.write_text(m, encoding="utf-8")

          paths = '''<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path
                  name="cache"
                  path="." />
          </paths>
          '''

          (xml_dir / "paths.xml").write_text(paths, encoding="utf-8")
          (xml_dir / "file_paths.xml").write_text(paths, encoding="utf-8")

          print("FileProvider corrigido")

      - name: Validar código
        shell: bash
        run: |
          set -e

          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt
          test -f ControleHoras/app/src/main/res/xml/paths.xml
          test -f ControleHoras/app/src/main/AndroidManifest.xml

          grep -q 'selectedPunchDate' \
            ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          grep -q 'DSR sobre horas extras' \
            ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          grep -q 'FileProvider' \
            ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          grep -q 'android:name="androidx.core.content.FileProvider"' \
            ControleHoras/app/src/main/AndroidManifest.xml

          echo "VALIDAÇÃO OK"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" --version

      - name: Limpar projeto
        working-directory: ControleHoras
        run: |
          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          unzip -t "$APK" >/dev/null

          ls -lh "$APK"

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
