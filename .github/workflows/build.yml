                                  )
                              )
                          }
                      }

                  wrap.addView(
                      register,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(64)
                      )
                  )

                  val dialog=
                      AlertDialog.Builder(this)
                          .setView(wrap)
                          .create()

                  close.setOnClickListener{
                      dialog.dismiss()
                  }

                  val updateTime={

                      selected.text=
                          "%02d:%02d".format(
                              hour.value(),
