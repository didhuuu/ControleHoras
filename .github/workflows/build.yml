              "        val p0=r.punches[0]\n"
              "        val p1=r.punches[1]\n"
              "        val p2=r.punches[2]\n"
              "        val p3=r.punches[3]\n"
              "        val p4=r.punches[4]\n"
              "        val p5=r.punches[5]\n"

              "        var worked=0\n"

              "        worked+="
              "minutesBetween(p0,p1)\n"

              "        if(p3.isNotBlank() && "
              "p4.isNotBlank()){\n"

              "            worked+="
              "minutesBetween(p2,p3)\n"

              "            worked+="
              "minutesBetween(p4,p5)\n"

              "        }else if(p3.isNotBlank()){\n"

              "            worked+="
              "minutesBetween(p2,p3)\n"

              "            worked+="
              "minutesBetween(p3,p5)\n"

              "        }else{\n"

              "            worked+="
              "minutesBetween(p2,p5)\n"

              "        }\n"

              "        val date=parseIso(r.date)\n"

              "        if(!modeForDay(date)){\n"
              "            return Calc("
              "worked,0,0,worked)\n"
              "        }\n"

              "        val expected="
              "durationMinutes(weeklyTarget)/"
              "(if(modeForDate(date)==\"MS\")6 else 5)\n"

              "        val extra="
              "max(0,worked-expected)\n"

              "        return Calc("
              "worked,expected,extra,0)\n"
              "    }\n"
          )

          code=(
              code[:cstart]+
              calc+
              code[cend:]
          )

          # =========================================================
          # INSETS / BARRAS DO ANDROID
          # =========================================================

          imports=(
              "import androidx.core.view.WindowCompat\n"
              "import androidx.core.view.ViewCompat\n"
              "import androidx.core.view.WindowInsetsCompat\n"
          )

          if (
              "import androidx.core.view.WindowCompat"
              not in code
          ):

              code=code.replace(
                  "import androidx.core.content.FileProvider\n",
                  "import androidx.core.content.FileProvider\n"+
                  imports,
                  1
              )

          if (
              "WindowCompat.setDecorFitsSystemWindows"
              not in code
          ):

              anchor="        buildShell()\n"

              if anchor in code:

                  inset=(
                      "        WindowCompat."
                      "setDecorFitsSystemWindows("
                      "window,false)\n"

                      "        window.statusBarColor=blue\n"

                      "        window.navigationBarColor="
                      "Color.WHITE\n"

                      "        window.decorView."
                      "systemUiVisibility="
                      "View.SYSTEM_UI_FLAG_"
                      "LIGHT_NAVIGATION_BAR\n"

                      "        ViewCompat."
                      "setOnApplyWindowInsetsListener("
                      "root){v,insets->\n"

                      "            val bars=insets."
                      "getInsets("
                      "WindowInsetsCompat.Type."
                      "systemBars())\n"

                      "            v.setPadding("
                      "v.paddingLeft,"
                      "bars.top,"
                      "v.paddingRight,"
                      "bars.bottom)\n"

                      "            insets\n"
                      "        }\n"

                      "        ViewCompat."
                      "requestApplyInsets(root)\n"
                  )

                  code=code.replace(
                      anchor,
                      anchor+
                      inset,
                      1
                  )

          # =========================================================
          # MANIFEST
          # =========================================================

          if manifest.exists():

              m=manifest.read_text(
                  encoding="utf-8"
              )

              if (
                  'android:icon='
                  not in m
              ):

                  m=m.replace(
                      "<application",
                      '<application\n'
                      '        android:icon="@drawable/controlehoras_icon"\n'
                      '        android:roundIcon="@drawable/controlehoras_icon"',
                      1
                  )

              manifest.write_text(
                  m,
                  encoding="utf-8"
              )

          src.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "CORREÇÕES PRINCIPAIS APLICADAS"
          )

