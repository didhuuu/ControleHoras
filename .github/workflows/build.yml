name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a Base 70
        shell: python
        run: |
          import subprocess
          import tempfile
          from pathlib import Path
          from urllib.request import urlopen

          subprocess.run(
              ["python", "-m", "pip", "install", "-q", "pyyaml"],
              check=True
          )

          import yaml

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(url, timeout=30).read().decode("utf-8")
          data = yaml.safe_load(workflow)

          steps = data["jobs"]["build"]["steps"]

          for step in steps:
              name = step.get("name", "")

              if name == "Validar código":
                  break

              if "uses" in step:
                  continue

              script = step.get("run")

              if not script:
                  continue

              shell = step.get("shell", "bash")
              workdir = step.get("working-directory", ".")

              print("")
              print("=" * 70)
              print("BASE 70:", name)
              print("=" * 70)

              cwd = Path(workdir)

              if shell == "python":
                  p = Path(tempfile.gettempdir()) / (
                      "base70_" +
                      str(len(name)) +
                      ".py"
                  )

                  p.write_text(
                      script,
                      encoding="utf-8"
                  )

                  subprocess.run(
                      ["python", str(p)],
                      cwd=str(cwd),
                      check=True
                  )

              else:
                  subprocess.run(
                      ["bash", "-e"],
                      input=script,
                      text=True,
                      cwd=str(cwd),
                      check=True
                  )

          print("")
          print("BASE 70 APLICADA")

      - name: Aplicar correções finais e rolagem
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("ControleHoras")

          src = (
              root /
              "app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          manifest = (
              root /
              "app/src/main/AndroidManifest.xml"
          )

          code = src.read_text(
              encoding="utf-8"
          )

          def ensure_import(
              text,
              imp,
              anchor=None
          ):
              if imp in text:
                  return text

              if anchor and anchor in text:
                  return text.replace(
                      anchor,
                      anchor + imp + "\n",
                      1
                  )

              return imp + "\n" + text

          code = ensure_import(
              code,
              "import android.view.ViewGroup",
              "package com.didhuuu.controlehoras\n"
          )

          code = ensure_import(
              code,
              (
                  "import androidx.core.view.WindowCompat\n"
                  "import androidx.core.view.ViewCompat\n"
                  "import androidx.core.view.WindowInsetsCompat"
              ),
              "package com.didhuuu.controlehoras\n"
          )

          if "private val extra2Enabled=" not in code:

              anchors = [
                  "    private val weekModes=linkedMapOf<String,String>()\n",
                  "    private val weekModes = linkedMapOf<String,String>()\n"
              ]

              found = False

              for anchor in anchors:
                  if anchor in code:
                      code = code.replace(
                          anchor,
                          anchor +
                          "    private val extra2Enabled="
                          "mutableSetOf<String>()\n"
                          "    private val extra2ReturnEnabled="
                          "mutableSetOf<String>()\n",
                          1
                      )
                      found = True
                      break

              if not found:
                  raise SystemExit(
                      "ERRO: weekModes não encontrado"
                  )

          if "private val punchNames=" not in code:

              anchor = (
                  "    private val extra2ReturnEnabled="
                  "mutableSetOf<String>()\n"
              )

              if anchor not in code:
                  raise SystemExit(
                      "ERRO: extra2ReturnEnabled não encontrado"
                  )

              code = code.replace(
