          )

          old = 'val ed=EditText(this).apply{setText(p.second);hint="00:00";gravity=Gravity.CENTER;inputType=2;setSingleLine()}'
          if old not in source:
              raise SystemExit("ERRO: campo da escala não encontrado")
          source = source.replace(old, 'val ed=timeEdit(p.second,"00:00").apply{gravity=Gravity.CENTER}', 1)
          source = source.replace(
              '0->s.e=ed.text.toString();1->s.x1=ed.text.toString();2->s.r1=ed.text.toString();3->s.x2=ed.text.toString()',
              '0->s.e=normalizeTime(ed.text.toString());1->s.x1=normalizeTime(ed.text.toString());2->s.r1=normalizeTime(ed.text.toString());3->s.x2=normalizeTime(ed.text.toString())',
              1
          )

          start = source.find('    private fun minutesBetween(a:String,b:String):Int{')
          end = source.find('    private fun formatMin(m:Int):String=', start)
          if start == -1 or end == -1:
              raise SystemExit("ERRO: funções de cálculo não encontradas")
          replacement = """    private fun minutesBetween(a:String,b:String):Int{
              val x=normalizeTime(a)
              val y=normalizeTime(b)
              if(x.isBlank()||y.isBlank())return 0
              return try{
                  val xa=x.split(":")
                  val ya=y.split(":")
                  max(0,(ya[0].toInt()*60+ya[1].toInt())-(xa[0].toInt()*60+xa[1].toInt()))
              }catch(_:Exception){0}
          }

          """
          source = source[:start] + replacement + source[end:]

          start = source.find('    private fun formatMin(m:Int):String=')
          end = source.find('\n', start)
          if start == -1 or end == -1:
              raise SystemExit("ERRO: formatMin inválido")
          source = source[:start] + '    private fun formatMin(m:Int):String="%02d:%02d".format(Locale.US,max(0,m)/60,max(0,m)%60)' + source[end:]

          source = source.replace('setTextColor(text)', 'setTextColor(this@MainActivity.text)')

          if source.count("private fun normalizeTime") != 1:
              raise SystemExit("ERRO FINAL: normalizeTime")
          if source.count("private fun timeEdit") != 1:
              raise SystemExit("ERRO FINAL: timeEdit")
          if source.count("private fun minutesBetween") != 1:
              raise SystemExit("ERRO FINAL: minutesBetween")
          if source.count("private fun formatMin") != 1:
              raise SystemExit("ERRO FINAL: formatMin")
          if source.count("{") != source.count("}"):
              raise SystemExit(f"ERRO FINAL: chaves {source.count('{')}/{source.count('}')}")

          main.write_text(source, encoding="utf-8")
          print("MAINACTIVITY ORIGINAL RESTAURADA E CORRIGIDA")
          print("LINHAS:", len(source.splitlines()))
          print("CHAVES:", source.count("{"), source.count("}"))
          PYTHON

      - name: Verificar código antes de compilar
        shell: bash
        run: |
          set -euo pipefail
          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          test -s "$FILE"
          grep -q 'private fun normalizeTime' "$FILE"
          grep -q 'private fun timeEdit' "$FILE"
          grep -q 'private fun minutesBetween' "$FILE"
          grep -q 'private fun formatMin' "$FILE"
          python3 - <<'PY'
          from pathlib import Path
          s=Path("ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt").read_text(encoding="utf-8")
          if s.count("{") != s.count("}"):
              raise SystemExit(f"ERRO: chaves {s.count('{')}/{s.count('}')}")
          print("VERIFICAÇÃO DO CÓDIGO OK")
          print("Linhas:", len(s.splitlines()))
          PY

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"
          "$PWD/gradle-8.11.1/bin/gradle" --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -euo pipefail
          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          echo "APK ÍNTEGRO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Finalizar
        shell: bash
        run: echo "BUILD FINALIZADO"
