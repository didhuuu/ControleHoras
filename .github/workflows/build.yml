name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip
          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          echo "BASE DO PROJETO OK"

      - name: Aplicar versão completa corrigida
        shell: python
        run: |
          from pathlib import Path

          root = Path("ControleHoras")
          main = root / "app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          manifest = root / "app/src/main/AndroidManifest.xml"
          paths = root / "app/src/main/res/xml/file_paths.xml"

          paths.parent.mkdir(parents=True, exist_ok=True)

          main.write_text(r'''package com.didhuuu.controlehoras

import android.app.*
import android.os.Bundle
import android.graphics.Color
import android.graphics.Paint
import android.graphics.Typeface
import android.graphics.pdf.PdfDocument
import android.graphics.drawable.GradientDrawable
import android.content.*
import android.view.*
import android.widget.*
import android.text.Editable
import android.text.TextWatcher
import androidx.core.content.FileProvider
import org.json.JSONArray
import org.json.JSONObject
import java.io.File
import java.text.NumberFormat
import java.text.SimpleDateFormat
import java.util.*
import kotlin.math.max
import kotlin.math.min

class MainActivity : Activity() {

    data class Employee(
        var id: Long,
        var name: String,
        var salary: Double
    )

    data class DayScale(
        var enabled: Boolean = true,
        var e: String = "08:00",
        var x1: String = "12:00",
        var r1: String = "13:30",
        var x2: String = "17:30"
    )

    data class PunchDay(
        var employeeId: Long,
        var employeeName: String,
        var date: String,
        var punches: MutableList<String> = MutableList(6) { "" }
    )

    data class Calc(
        val worked: Int,
        val expected: Int,
        val extra60: Int,
        val extra100: Int
    )

    private val blue = Color.rgb(0, 92, 205)
    private val darkBlue = Color.rgb(13, 54, 105)
    private val green = Color.rgb(0, 170, 82)
    private val bg = Color.rgb(245, 248, 252)
    private val textColor = Color.rgb(25, 35, 50)
    private val muted = Color.rgb(105, 115, 130)

    private lateinit var root: LinearLayout
    private lateinit var content: FrameLayout
    private lateinit var nav: LinearLayout

    private var selectedTab = 0
    private var selectedEmployeeId = 0L

    /*
     * IMPORTANTE:
     * Não inicializar com today() aqui.
     * today() usa iso, que é declarado abaixo.
     * A inicialização é feita dentro do onCreate().
     */
    private var selectedPunchDate = ""

    private val prefs by lazy {
        getSharedPreferences("controle_horas", MODE_PRIVATE)
    }

    private val employees = mutableListOf<Employee>()
    private val records = mutableListOf<PunchDay>()
    private val scale = linkedMapOf<String, DayScale>()
    private val weekModes = linkedMapOf<String, String>()

    private var weeklyTarget = "44:00"

    private val days = listOf(
        "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"
    )

    private val dayKeys = listOf(
        Calendar.MONDAY,
        Calendar.TUESDAY,
        Calendar.WEDNESDAY,
        Calendar.THURSDAY,
        Calendar.FRIDAY,
        Calendar.SATURDAY,
        Calendar.SUNDAY
    )

    private val money =
        NumberFormat.getCurrencyInstance(Locale("pt", "BR"))

    private val df =
        SimpleDateFormat("dd/MM/yyyy", Locale("pt", "BR"))

    private val iso =
        SimpleDateFormat("yyyy-MM-dd", Locale.US)

    private val punchNames = listOf(
        "Entrada",
        "Saída intervalo 1",
        "Retorno intervalo 1",
        "Saída intervalo 2",
        "Retorno intervalo 2",
        "Saída"
    )

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        loadData()

        selectedPunchDate = today()

        if (employees.isNotEmpty()) {
            selectedEmployeeId = employees.first().id
        }

        buildShell()
        showTab(0)
    }

    private fun loadData() {

        employees.clear()

        try {
            val ea = JSONArray(
                prefs.getString("employees", "[]") ?: "[]"
            )

            for (i in 0 until ea.length()) {
                val o = ea.getJSONObject(i)

                employees += Employee(
                    o.getLong("id"),
                    o.getString("name"),
                    o.optDouble("salary", 0.0)
                )
            }
        } catch (_: Exception) {
        }

        records.clear()

        try {
            val ra = JSONArray(
                prefs.getString("records", "[]") ?: "[]"
            )

            for (i in 0 until ra.length()) {
                val o = ra.getJSONObject(i)

                val punches = MutableList(6) { j ->
                    o.optString("p$j", "")
                }

                records += PunchDay(
                    o.getLong("employeeId"),
                    o.optString("employeeName", ""),
                    o.getString("date"),
                    punches
                )
            }
        } catch (_: Exception) {
        }

        scale.clear()

        for (i in days.indices) {

            val defaultScale =
                if (i < 5) {
                    DayScale()
                } else {
                    DayScale(
                        enabled = false,
                        e = "",
                        x1 = "",
                        r1 = "",
                        x2 = ""
                    )
                }

            try {

                val fallback = JSONObject()
                    .put("enabled", defaultScale.enabled)
                    .put("e", defaultScale.e)
                    .put("x1", defaultScale.x1)
                    .put("r1", defaultScale.r1)
                    .put("x2", defaultScale.x2)
                    .toString()

                val o = JSONObject(
                    prefs.getString(
                        "scale_$i",
                        fallback
                    ) ?: fallback
                )

                scale[days[i]] = DayScale(
                    o.optBoolean(
                        "enabled",
                        defaultScale.enabled
                    ),
                    safeTime(o.optString("e", defaultScale.e)),
                    safeTime(o.optString("x1", defaultScale.x1)),
                    safeTime(o.optString("r1", defaultScale.r1)),
                    safeTime(o.optString("x2", defaultScale.x2))
                )

            } catch (_: Exception) {

                scale[days[i]] = defaultScale
            }
        }

        weeklyTarget =
            normalizeDuration(
                prefs.getString("weeklyTarget", "44:00") ?: "44:00"
            ).ifBlank { "44:00" }

        weekModes.clear()

        try {

            val o = JSONObject(
                prefs.getString("weekModes", "{}") ?: "{}"
            )

            val keys = o.keys()

            while (keys.hasNext()) {
                val key = keys.next()
                weekModes[key] = o.optString(key, "MF")
            }

        } catch (_: Exception) {
        }
    }

    private fun saveData() {

        val ea = JSONArray()

        employees.forEach {

            ea.put(
                JSONObject()
                    .put("id", it.id)
                    .put("name", it.name)
                    .put("salary", it.salary)
            )
        }

        val ra = JSONArray()

        records.forEach { r ->

            val o = JSONObject()
                .put("employeeId", r.employeeId)
                .put("employeeName", r.employeeName)
                .put("date", r.date)

            r.punches.forEachIndexed { j, value ->
                o.put("p$j", normalizeTime(value))
            }

            ra.put(o)
        }

        val modes = JSONObject()

        weekModes.forEach { (key, value) ->
            modes.put(key, value)
        }

        val editor = prefs.edit()
            .putString("employees", ea.toString())
            .putString("records", ra.toString())
            .putString("weeklyTarget", weeklyTarget)
            .putString("weekModes", modes.toString())

        days.forEachIndexed { i, day ->

            val s = scale[day] ?: DayScale()

            editor.putString(
                "scale_$i",
                JSONObject()
                    .put("enabled", s.enabled)
                    .put("e", s.e)
                    .put("x1", s.x1)
                    .put("r1", s.r1)
                    .put("x2", s.x2)
                    .toString()
            )
        }

        editor.apply()
    }

    private fun buildShell() {

        root = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setBackgroundColor(bg)
        }

        val header = LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL
            gravity = Gravity.CENTER_VERTICAL
            setPadding(dp(18), dp(10), dp(14), dp(10))
            background(blue, 0, 0, 0, 0)
        }

        header.addView(
            TextView(this).apply {
                text = "◷"
                textSize = 34f
                setTextColor(Color.WHITE)
                gravity = Gravity.CENTER
            },
            LinearLayout.LayoutParams(
                dp(42),
                dp(62)
            )
        )

        header.addView(
            TextView(this).apply {
                text = "CONTROLE DE HORAS"
                textSize = 20f
                setTypeface(null, Typeface.BOLD)
                setTextColor(Color.WHITE)
                gravity = Gravity.CENTER_VERTICAL
            },
            LinearLayout.LayoutParams(
                0,
                dp(62),
                1f
            )
        )

        header.addView(
            TextView(this).apply {
                text = "⚙"
                textSize = 28f
                setTextColor(Color.WHITE)
                gravity = Gravity.CENTER
                setOnClickListener {
                    showSettings()
                }
            },
            LinearLayout.LayoutParams(
                dp(45),
                dp(62)
            )
        )

        root.addView(header)

        content = FrameLayout(this).apply {
            setBackgroundColor(bg)
        }

        root.addView(
            content,
            LinearLayout.LayoutParams(
                -1,
                0,
                1f
            )
        )

        nav = LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL
            setPadding(
                dp(2),
                dp(5),
                dp(2),
                dp(5)
            )
            background(
                Color.WHITE,
                dp(18),
                0,
                0,
                0
            )
        }

        val labels = listOf(
            "⌂\nPonto",
            "▣\nHistórico",
            "▥\nRelatório",
            "♟\nFuncionários",
            "▦\nEscala"
        )

        labels.forEachIndexed { index, label ->

            nav.addView(
                TextView(this).apply {

                    text = label
                    gravity = Gravity.CENTER
                    textSize = 12f

                    setTypeface(
                        null,
                        Typeface.BOLD
                    )

                    setPadding(
                        0,
                        dp(5),
                        0,
                        dp(4)
                    )

                    setOnClickListener {
                        showTab(index)
                    }
                },
                LinearLayout.LayoutParams(
                    0,
                    dp(68),
                    1f
                )
            )
        }

        root.addView(nav)

        setContentView(root)
    }

    private fun showTab(tab: Int) {

        selectedTab = tab

        content.removeAllViews()

        when (tab) {
            0 -> showPunch()
            1 -> showHistory()
            2 -> showReport()
            3 -> showEmployees()
            4 -> showScale()
        }

        for (i in 0 until nav.childCount) {

            val view =
                nav.getChildAt(i) as TextView

            if (i == tab) {

                view.setTextColor(blue)

                view.background(
                    0xFFE7F0FF.toInt(),
                    dp(16),
                    dp(16),
                    dp(16),
                    dp(16)
                )

            } else {

                view.setTextColor(muted)
                view.setBackgroundColor(
                    Color.TRANSPARENT
                )
            }
        }
    }

    private fun page(title: String): LinearLayout {

        val scroll = ScrollView(this)

        val box = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(
                dp(18),
                dp(16),
                dp(18),
                dp(22)
            )
        }

        box.addView(
            TextView(this).apply {
                text = title
                textSize = 25f
                setTypeface(
                    null,
                    Typeface.BOLD
                )
                setTextColor(textColor)
            },
            LinearLayout.LayoutParams(
                -1,
                -2
            )
        )

        scroll.addView(box)

        content.addView(
            scroll,
            FrameLayout.LayoutParams(
                -1,
                -1
            )
        )

        return box
    }

    private fun showPunch() {

        val box = page("Registro de ponto")

        if (employees.isEmpty()) {

            box.addView(
                infoCard(
                    "Cadastre um funcionário para começar."
                ),
                marginParams(0, 16, 0, 0)
            )

            return
        }

        val employeeNames =
            employees.map { it.name }.toTypedArray()

        box.addView(label("Funcionário"))

        val employeeSpinner =
            Spinner(this)

        employeeSpinner.adapter =
            ArrayAdapter(
                this,
                android.R.layout.simple_spinner_dropdown_item,
                employeeNames
            )

        val employeeIndex =
            employees.indexOfFirst {
                it.id == selectedEmployeeId
            }.coerceAtLeast(0)

        employeeSpinner.setSelection(
            employeeIndex,
            false
        )

        employeeSpinner.onItemSelectedListener =
            object : android.widget.AdapterView.OnItemSelectedListener {

                override fun onNothingSelected(
                    parent: android.widget.AdapterView<*>?
                ) {
                }

                override fun onItemSelected(
                    parent: android.widget.AdapterView<*>?,
                    view: View?,
                    position: Int,
                    id: Long
                ) {

                    val employee =
                        employees[position]

                    if (selectedEmployeeId != employee.id) {

                        selectedEmployeeId =
                            employee.id

                        /*
                         * Ao trocar funcionário,
                         * a data volta para hoje.
                         */
                        selectedPunchDate = today()

                        showPunch()
                    }
                }
            }

        box.addView(
            employeeSpinner,
            marginParams(0, 6, 0, 12)
        )

        val dateButton =
            Button(this).apply {

                text =
                    "Data: ${displayDate(selectedPunchDate)}"

                setOnClickListener {
                    choosePunchDate()
                }
            }

        box.addView(
            dateButton,
            marginParams(0, 0, 0, 14)
        )

        val currentEmployee =
            employees.firstOrNull {
                it.id == selectedEmployeeId
            } ?: employees.first()

        val record =
            getRecord(
                currentEmployee.id,
                selectedPunchDate
            )

        box.addView(
            infoCard(
                "Registro selecionado: ${displayDate(record.date)}"
            ),
            marginParams(0, 0, 0, 12)
        )

        punchNames.forEachIndexed { index, name ->

            val row =
                LinearLayout(this).apply {
                    orientation =
                        LinearLayout.HORIZONTAL
                    gravity =
                        Gravity.CENTER_VERTICAL
                    setPadding(
                        dp(10),
                        dp(7),
                        dp(10),
                        dp(7)
                    )
                    background(
                        Color.WHITE,
                        dp(12),
                        dp(12),
                        dp(12),
                        dp(12)
                    )
                }

            row.addView(
                TextView(this).apply {
                    text = "${index + 1}. $name"
                    textSize = 15f
                    setTextColor(textColor)
                },
                LinearLayout.LayoutParams(
                    0,
                    dp(52),
                    1f
                )
            )

            val time =
                EditText(this).apply {

                    hint = "HH:mm"
                    textSize = 17f
                    gravity = Gravity.CENTER
                    inputType = 2
                    setSingleLine(true)
                    setText(record.punches[index])
                    setSelectAllOnFocus(false)

                    addTextChangedListener(
                        object : TextWatcher {

                            private var editing = false

                            override fun beforeTextChanged(
                                s: CharSequence?,
                                start: Int,
                                count: Int,
                                after: Int
                            ) {
                            }

                            override fun onTextChanged(
                                s: CharSequence?,
                                start: Int,
                                before: Int,
                                count: Int
                            ) {
                            }

                            override fun afterTextChanged(
                                s: Editable?
                            ) {

                                if (editing) return

                                val digits =
                                    s?.toString()
                                        ?.filter {
                                            it.isDigit()
                                        }
                                        ?.take(4)
                                        ?: ""

                                val formatted =
                                    when {
                                        digits.length <= 2 ->
                                            digits

                                        else ->
                                            digits.substring(
                                                0,
                                                2
                                            ) +
                                            ":" +
                                            digits.substring(2)
                                    }

                                if (formatted != s?.toString()) {

                                    editing = true

                                    setText(formatted)
                                    setSelection(
                                        formatted.length
                                    )

                                    editing = false
                                }
                            }
                        }
                    )
                }

            time.setOnFocusChangeListener { _, hasFocus ->

                if (!hasFocus) {

                    val value =
                        normalizeTime(
                            time.text.toString()
                        )

                    record.punches[index] =
                        value

                    time.setText(value)

                    saveData()

                    updatePunchSummary(
                        box,
                        record
                    )
                }
            }

            row.addView(
                time,
                LinearLayout.LayoutParams(
                    dp(105),
                    dp(52)
                )
            )

            box.addView(
                row,
                marginParams(
                    0,
                    if (index == 0) 0 else 7,
                    0,
                    0
                )
            )
        }

        val saveButton =
            Button(this).apply {

                text = "SALVAR REGISTRO"

                setOnClickListener {

                    for (i in record.punches.indices) {

                        record.punches[i] =
                            normalizeTime(
                                record.punches[i]
                            )
                    }

                    saveData()

                    Toast.makeText(
                        this@MainActivity,
                        "Registro salvo.",
                        Toast.LENGTH_SHORT
                    ).show()

                    showPunch()
                }
            }

        box.addView(
            saveButton,
            marginParams(0, 18, 0, 10)
        )

        val calc = calculate(record)

        val summary =
            TextView(this).apply {

                text = summaryText(calc)
                textSize = 16f
                setTypeface(
                    null,
                    Typeface.BOLD
                )
                setTextColor(darkBlue)
                setPadding(
                    dp(14),
                    dp(14),
                    dp(14),
                    dp(14)
                )
                background(
                    0xFFEAF2FF.toInt(),
                    dp(14),
                    dp(14),
                    dp(14),
                    dp(14)
                )
            }

        box.addView(summary)

        record.punches.forEachIndexed { index, value ->

            if (value.isNotBlank()) {

                val edit =
                    Button(this).apply {
                        text =
                            "Editar ${punchNames[index]}"

                        setOnClickListener {
                            editPunch(
                                record,
                                index
                            )
                        }
                    }

                box.addView(
                    edit,
                    marginParams(
                        0,
                        5,
                        0,
                        0
                    )
                )
            }
        }
    }

    private fun updatePunchSummary(
        box: LinearLayout,
        record: PunchDay
    ) {
        if (box.childCount == 0) return
    }

    private fun summaryText(c: Calc): String {

        return buildString {

            append("Trabalhado: ")
            append(formatMin(c.worked))

            append("\nPrevisto: ")
            append(formatMin(c.expected))

            append("\nHE 60%: ")
            append(formatMin(c.extra60))

            append("\nHE 100%: ")
            append(formatMin(c.extra100))
        }
    }

    private fun choosePunchDate() {

        val selected =
            parseIso(selectedPunchDate)

        val cal =
            Calendar.getInstance()

        cal.time = selected

        val dialog =
            DatePickerDialog(
                this,
                { _, year, month, day ->

                    val chosen =
                        Calendar.getInstance()

                    chosen.set(
                        year,
                        month,
                        day,
                        0,
                        0,
                        0
                    )

                    chosen.set(
                        Calendar.MILLISECOND,
                        0
                    )

                    selectedPunchDate =
                        iso.format(chosen.time)

                    showPunch()
                },
                cal.get(Calendar.YEAR),
                cal.get(Calendar.MONTH),
                cal.get(Calendar.DAY_OF_MONTH)
            )

        /*
         * Não permite datas futuras.
         * Datas anteriores continuam disponíveis.
         */
        dialog.datePicker.maxDate =
            Calendar.getInstance().timeInMillis

        dialog.show()
    }

    private fun getRecord(
        empId: Long,
        date: String
    ): PunchDay {

        return records.firstOrNull {
            it.employeeId == empId &&
            it.date == date
        } ?: PunchDay(
            empId,
            employees.firstOrNull {
                it.id == empId
            }?.name ?: "",
            date
        ).also {
            records += it
        }
    }

    private fun editPunch(
        record: PunchDay,
        index: Int
    ) {

        val input =
            EditText(this).apply {

                setText(record.punches[index])
                hint = "HH:mm"
                inputType = 2
                setSingleLine()
            }

        AlertDialog.Builder(this)
            .setTitle(punchNames[index])
            .setMessage(
                "Digite a hora. Exemplo: 0558 ou 05:58."
            )
            .setView(input)
            .setNegativeButton(
                "Cancelar",
                null
            )
            .setPositiveButton(
                "Salvar"
            ) { _, _ ->

                val value =
                    normalizeTime(
                        input.text.toString()
                    )

                if (
                    input.text.toString().isNotBlank() &&
                    value.isBlank()
                ) {

                    Toast.makeText(
                        this,
                        "Horário inválido.",
                        Toast.LENGTH_SHORT
                    ).show()

                    return@setPositiveButton
                }

                record.punches[index] =
                    value

                saveData()
                showPunch()
            }
            .show()
    }

    private fun editRecord(
        record: PunchDay
    ) {

        val box =
            LinearLayout(this).apply {
                orientation =
                    LinearLayout.VERTICAL
                setPadding(
                    dp(12),
                    dp(4),
                    dp(12),
                    dp(4)
                )
            }

        val fields =
            record.punches.mapIndexed { i, value ->

                EditText(this).apply {

                    hint = punchNames[i]
                    setText(value)
                    inputType = 2
                    setSingleLine(true)

                    box.addView(
                        this,
                        LinearLayout.LayoutParams(
                            -1,
                            dp(55)
                        )
                    )
                }
            }

        AlertDialog.Builder(this)
            .setTitle("Editar ponto")
            .setView(box)
            .setNegativeButton(
                "Cancelar",
                null
            )
            .setPositiveButton(
                "Salvar"
            ) { _, _ ->

                fields.forEachIndexed { i, field ->

                    record.punches[i] =
                        normalizeTime(
                            field.text.toString()
                        )
                }

                saveData()
                showHistory()
            }
            .show()
    }

    private fun showHistory() {

        val box =
            page("Histórico")

        val employee =
            employees.firstOrNull {
                it.id == selectedEmployeeId
            }

        if (employee == null) {

            box.addView(
                infoCard(
                    "Nenhum funcionário cadastrado."
                )
            )

            return
        }

        val month =
            SimpleDateFormat(
                "yyyy-MM",
                Locale.US
            ).format(Date())

        val list =
            records
                .filter {
                    it.employeeId == employee.id &&
                    it.date.startsWith(month)
                }
                .sortedByDescending {
                    it.date
                }

        if (list.isEmpty()) {

            box.addView(
                infoCard(
                    "Nenhum registro neste mês."
                )
            )

            return
        }

        list.forEach { record ->

            val c =
                calculate(record)

            val card = card()

            card.addView(
                TextView(this).apply {

                    text =
                        "${displayDate(record.date)}\n" +
                        "Trabalhado: ${formatMin(c.worked)}\n" +
                        "HE60: ${formatMin(c.extra60)}\n" +
                        "HE100: ${formatMin(c.extra100)}"

                    textSize = 15f
                    setTextColor(textColor)
                    setPadding(
                        dp(14),
                        dp(12),
                        dp(14),
                        dp(8)
                    )
                }
            )

            val edit =
