        dialog.show()
    }
'''

          # --------------------------------------------------------
          # EDITAR BATIDA
          # --------------------------------------------------------

          edit_method = r'''
    private fun showEditWheel(
        rec:PunchDay,
        index:Int
    ){

        if(
            rec.punches[index].isBlank()
        ){

            Toast.makeText(
                this,
                "Esse registro ainda está vazio. Use REGISTRO MANUAL.",
                Toast.LENGTH_LONG
            ).show()

            return
        }

        val parts=
            rec.punches[index]
                .split(":")

        val hour=
            parts
                .getOrNull(0)
                ?.toIntOrNull()
                ?.coerceIn(0,23)
                ?:0

        val minute=
            parts
                .getOrNull(1)
                ?.toIntOrNull()
                ?.coerceIn(0,59)
                ?:0

        showTimeWheelDialog(
            "Editar registro",
            "${punchNames[index]}\n${df.format(parseIso(rec.date))}",
            hour,
            minute,
            "SALVAR"
        ){h,m->

            rec.punches[index]=
                "%02d:%02d".format(
                    Locale.US,
                    h,
                    m
                )

            saveData()

            showPunch()
        }
    }
'''

          # --------------------------------------------------------
          # REGISTRO MANUAL
          # --------------------------------------------------------

          manual_method = r'''
    private fun showManualWheel(
        empId:Long
    ){

        val r=
            getRecord(
                empId,
                selectedPunchDate
            )

        val n=
            nextPunchIndex(
                r,
                extraEnabled(
                    empId,
                    selectedPunchDate
                )
            )

        if(n<0){

            Toast.makeText(
                this,
                "As batidas disponíveis deste dia já estão preenchidas.",
