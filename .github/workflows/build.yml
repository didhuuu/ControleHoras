name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # BAIXAR PROJETO
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # JAVA
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # EXTRAIR PROJETO
      # ============================================================

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      # ============================================================
      # RECONSTRUIR EXATAMENTE A BASE 70
      # ============================================================

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name, next_name):

              start = workflow.index(
                  f"      - name: {name}"
              )

              end = workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              pos = block.index(marker) + len(marker)

              lines = block[pos:].splitlines()

              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in lines
              ) + "\n"

          scripts = [

              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),

              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for i, script in enumerate(scripts):

              p = (
                  Path(tempfile.gettempdir()) /
                  f"base70_{i}.py"
              )

              p.write_text(
                  script,
                  encoding="utf-8"
              )

              subprocess.run(
                  ["python", str(p)],
                  check=True
              )

          print("BASE DA VERSÃO 70 APLICADA")

      # ============================================================
      # APLICAR TODAS AS CORREÇÕES DA VERSÃO ATUAL
      # ============================================================

      - name: Aplicar correções completas
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          # --------------------------------------------------------
          # Busca a versão anterior completa que já contém:
          #
          # - intervalo 2
          # - persistência
          # - rolagem de horário
          # - edição de horário
          # - registro manual
          # - cálculo
          # - barras do sistema
          # - ícone DIDHUUU
          # - manifesto
          #
          # --------------------------------------------------------

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name, next_name):

              start = workflow.index(
                  f"      - name: {name}"
              )

              end = workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              pos = block.index(marker) + len(marker)

              lines = block[pos:].splitlines()

              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in lines
              ) + "\n"

          script = extract_step(
              "Aplicar correções finais da Base 70, edição por rolagem e ícone",
              "Validar código e ícone"
          )

          # ========================================================
          # CORREÇÃO 1
          # punchNames
          # ========================================================

          names_patch = '''# ============================================================
          # CORREÇÃO DEFINITIVA DOS NOMES DAS BATIDAS
          # ============================================================

          if "private val punchNames" not in code:

              namesAnchors = [
                  '    private val weekModes=linkedMapOf<String,String>()\\n',
                  '    private val weekModes = linkedMapOf<String,String>()\\n'
              ]

              namesBlock = (
                  '    private val punchNames=arrayOf<String>(\\n'
                  '        "Entrada",\\n'
                  '        "Saída",\\n'
                  '        "Retorno",\\n'
                  '        "Saída intervalo 2",\\n'
                  '        "Retorno intervalo 2",\\n'
                  '        "Saída"\\n'
                  '    )\\n'
              )

              for a in namesAnchors:

                  if a in code:

                      code = code.replace(
                          a,
                          a + namesBlock,
                          1
                      )

                      break

              else:
                  raise SystemExit(
                      "ERRO: não foi possível inserir punchNames"
                  )

          '''

          needle = '''code = src.read_text(
              encoding="utf-8"
          )

          '''

          if needle not in script:
              raise SystemExit(
                  "ERRO: ponto de inserção do punchNames não encontrado"
              )

          script = script.replace(
              needle,
              needle + names_patch,
              1
          )

          # ========================================================
          # CORREÇÃO 2
          # addView inválido
          # ========================================================

          old_add = '''                      },
                      0,
                      0,
                      0,
                      dp(10)
                  )

                  val dateCard=card()'''

          new_add = '''                      },
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      ).apply{
                          bottomMargin=dp(10)
                      }
                  )

                  val dateCard=card()'''

          if old_add not in script:
              raise SystemExit(
                  "ERRO: addView inválido não encontrado"
              )

          script = script.replace(
              old_add,
              new_add,
              1
          )

          # ========================================================
          # EXECUTAR SCRIPT CORRIGIDO
          # ========================================================

          p = (
              Path(tempfile.gettempdir()) /
              "correcoes_finais.py"
          )

          p.write_text(
              script,
              encoding="utf-8"
          )

          subprocess.run(
              ["python", str(p)],
              check=True
          )

          print(
              "TODAS AS CORREÇÕES APLICADAS"
          )

      # ============================================================
      # GARANTIR PUNCHNAMES NO CÓDIGO FINAL
      # ============================================================

      - name: Corrigir e validar punchNames
        shell: python
        run: |
          from pathlib import Path

          file = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          code = file.read_text(
              encoding="utf-8"
          )

          names = '''    private val punchNames=arrayOf<String>(
              "Entrada",
              "Saída",
              "Retorno",
              "Saída intervalo 2",
              "Retorno intervalo 2",
              "Saída"
          )
          '''

          if "private val punchNames" not in code:

              anchors = [
                  "    private val weekModes=linkedMapOf<String,String>()\n",
                  "    private val weekModes = linkedMapOf<String,String>()\n"
              ]

              inserted = False

              for anchor in anchors:

                  if anchor in code:

                      code = code.replace(
                          anchor,
                          anchor + names,
                          1
                      )

                      inserted = True
                      break

              if not inserted:
                  raise SystemExit(
                      "ERRO: não encontrei weekModes para inserir punchNames"
                  )

          file.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "PUNCHNAMES OK"
          )

      # ============================================================
      # VALIDAR CÓDIGO
      # ============================================================

      - name: Validar código e ícone
        shell: bash
        run: |
          set -e

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          test -s "$FILE"

          test -s \
            "ControleHoras/app/src/main/res/drawable/controlehoras_icon.jpg"

          grep -q \
            'extra2Enabled' \
            "$FILE"

          grep -q \
            'showManualWheel' \
            "$FILE"

          grep -q \
            'showEditWheel' \
            "$FILE"

          grep -q \
            'nextPunchIndex' \
            "$FILE"

          grep -q \
            'punchNames' \
            "$FILE"

          grep -q \
            'WindowCompat.setDecorFitsSystemWindows' \
            "$FILE"

          grep -q \
            'controlehoras_icon' \
            ControleHoras/app/src/main/AndroidManifest.xml

          if grep -q 'Button(context)' "$FILE"; then
            echo "ERRO: Button(context)"
            exit 1
          fi

          echo "VALIDAÇÃO OK"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      # ============================================================
      # LIMPAR
      # ============================================================

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon

      # ============================================================
      # GERAR APK
      # ============================================================

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

      # ============================================================
      # VALIDAR APK
      # ============================================================

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK VALIDADO"

      # ============================================================
      # PUBLICAR APK
      # ============================================================

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
