name: Gerar APK - ControleHoras

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto original
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " EXTRAINDO PROJETO ORIGINAL"
          echo "======================================"

          rm -rf ControleHoras

          unzip -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL ENCONTRADO"
          wc -l ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

      - name: Corrigir aplicativo sem alterar o layout original
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          s = p.read_text(encoding="utf-8")

          # ============================================================
          # 1. CORREÇÕES DE COMPILAÇÃO DO PROJETO ORIGINAL
          # ============================================================

          s = s.replace(
              "        }, 0, 0, 0, dp(10))",
              """        }, LinearLayout.LayoutParams(
              -1,
              LinearLayout.LayoutParams.WRAP_CONTENT
          ).apply {
              bottomMargin = dp(10)
          })"""
          )

          s = s.replace(
              "        }, 0, 0, 0, dp(12))",
              """        }, LinearLayout.LayoutParams(
              -1,
              LinearLayout.LayoutParams.WRAP_CONTENT
          ).apply {
              bottomMargin = dp(12)
          })"""
          )

          s = s.replace(
              "setTextColor(text)",
              "setTextColor(this@MainActivity.text)"
          )

          s = s.replace(
              'setText(if(existing!=null)existing.salary.toString():"")',
              'setText(if (existing != null) existing.salary.toString() else "")'
          )

          s = s.replace(
              'if(existing!=null)existing.salary.toString():""',
              'if (existing != null) existing.salary.toString() else ""'
          )

          s = s.replace(
              'if (existing != null) existing.salary.toString():""',
              'if (existing != null) existing.salary.toString() else ""'
          )

          # ============================================================
          # 2. CORRIGIR FILTRO DO HISTÓRICO / SOMATÓRIO
          # ============================================================

          s = s.replace(
              'it.date.endsWith(SimpleDateFormat("MM-yyyy", Locale.US).format(Date()))',
              'it.date.startsWith(SimpleDateFormat("yyyy-MM", Locale.US).format(Date()))'
          )

          # ============================================================
          # 3. GARANTIR FORMATO 00:00 NOS TOTAIS
          # ============================================================

          old_format = '''private fun formatMin(m:Int):String = "${m/60}:%02d".format(m%60)'''

          new_format = '''private fun formatMin(m: Int): String {
              val total = max(0, m)
              return "%02d:%02d".format(
                  Locale.US,
                  total / 60,
                  total % 60
              )
          }'''

          if old_format in s:
              s = s.replace(old_format, new_format)

          # Também corrige versões com espaços diferentes.
          old_format2 = '''private fun formatMin(m: Int): String = "${m / 60}:%02d".format(m % 60)'''

          if old_format2 in s:
              s = s.replace(old_format2, new_format)

          # ============================================================
          # 4. FUNÇÃO DE NORMALIZAÇÃO DE HORÁRIO
          #
          # Aceita:
          # 0800  -> 08:00
          # 800   -> 08:00
          # 930   -> 09:30
          # 09:30 -> 09:30
          # ============================================================

          helper = '''
          private fun normalizeTime(value: String): String {
              val digits = value.filter { it.isDigit() }

              if (digits.isEmpty()) {
                  return ""
              }

              val hour: Int
              val minute: Int

              when (digits.length) {
                  1 -> {
                      hour = digits.toInt()
                      minute = 0
                  }

                  2 -> {
                      hour = digits.toInt()
                      minute = 0
                  }

                  3 -> {
                      hour = digits.substring(0, 1).toInt()
                      minute = digits.substring(1).toInt()
                  }

                  else -> {
                      hour = digits.substring(0, 2).toInt()
                      minute = digits.substring(2, 4).toInt()
                  }
              }

              if (hour !in 0..23 || minute !in 0..59) {
                  return ""
              }

              return "%02d:%02d".format(
                  Locale.US,
                  hour,
                  minute
              )
          }

          private fun timeEdit(
              initial: String = "",
              hintText: String = "00:00"
          ): EditText {
              val e = EditText(this).apply {
                  hint = hintText
                  setText(normalizeTime(initial))

                  inputType = 2
                  setSingleLine()

                  if (text.isNotEmpty()) {
                      setSelection(text.length)
                  }
              }

              e.addTextChangedListener(object : android.text.TextWatcher {

                  private var changing = false

                  override fun beforeTextChanged(
                      s: CharSequence?,
                      start: Int,
                      count: Int,
                      after: Int
                  ) {
                  }

                  override fun onTextChanged(
                      s: CharSequence?,
                      start: Int,
                      before: Int,
                      count: Int
                  ) {
                  }

                  override fun afterTextChanged(editable: android.text.Editable?) {
                      if (changing) {
                          return
                      }

                      val digits = editable
                          ?.toString()
                          ?.filter { it.isDigit() }
                          ?: ""

                      if (digits.isEmpty()) {
                          return
                      }

                      val formatted = when {
                          digits.length <= 2 -> {
                              digits
                          }

                          digits.length == 3 -> {
                              digits.substring(0, 1) +
                                  ":" +
                                  digits.substring(1)
                          }

                          else -> {
                              digits.substring(0, 2) +
                                  ":" +
                                  digits.substring(2, 4)
                          }
                      }

                      if (formatted != editable.toString()) {
                          changing = true
                          e.setText(formatted)
                          e.setSelection(e.text.length)
                          changing = false
                      }
                  }
              })

              return e
          }
          '''

          # Insere os helpers antes de minutesBetween.
          if "private fun normalizeTime(" not in s:
              marker = "private fun minutesBetween("
              pos = s.find(marker)

              if pos != -1:
                  s = s[:pos] + helper + "\n" + s[pos:]

          # ============================================================
          # 5. CORRIGIR minutesBetween PARA ACEITAR HORÁRIOS NORMALIZADOS
          # ============================================================

          start = s.find("private fun minutesBetween(")

          if start != -1:
              end = s.find("\n}", start)

              if end != -1:
                  old_function = s[start:end + 2]

                  new_function = '''private fun minutesBetween(a: String, b: String): Int {
              val startTime = normalizeTime(a)
              val endTime = normalizeTime(b)

              if (startTime.isBlank() || endTime.isBlank()) {
                  return 0
              }

              return try {
                  val x = startTime.split(":")
                  val y = endTime.split(":")

                  val startMinutes =
                      x[0].toInt() * 60 + x[1].toInt()

                  val endMinutes =
                      y[0].toInt() * 60 + y[1].toInt()

                  var result = endMinutes - startMinutes

                  if (result < 0) {
                      result += 24 * 60
                  }

                  max(0, result)

              } catch (_: Exception) {
                  0
              }
          }'''

                  s = s.replace(old_function, new_function, 1)

          # ============================================================
          # 6. ADIÇÃO MANUAL DE HORÁRIO
          # ============================================================

          old_edit_punch = '''val e=EditText(this).apply{setText(r.punches[index]);hint="HH:mm";inputType=2;setSingleLine()}'''

          new_edit_punch = '''val e = timeEdit(r.punches[index], punchNames[index])'''

          s = s.replace(old_edit_punch, new_edit_punch)

          # ============================================================
          # 7. EDIÇÃO DOS 6 HORÁRIOS DO REGISTRO
          # ============================================================

          old_fields = '''val fields=r.punches.mapIndexed{i,v->EditText(this).apply{hint=punchNames[i];setText(v);inputType=2;setSingleLine();}}'''

          new_fields = '''val fields = r.punches.mapIndexed { i, v ->
              timeEdit(v, punchNames[i])
          }'''

          s = s.replace(old_fields, new_fields)

          # ============================================================
          # 8. ESCALA
          # ============================================================

          old_scale = '''val ed=EditText(this).apply{setText(p.second);hint="00:00";gravity=Gravity.CENTER;inputType=2;setSingleLine()}'''

          new_scale = '''val ed = timeEdit(p.second, "00:00").apply {
              gravity = Gravity.CENTER
          }'''

          s = s.replace(old_scale, new_scale)

          # ============================================================
          # 9. GARANTIR NORMALIZAÇÃO AO SALVAR OS HORÁRIOS
          # ============================================================

          s = s.replace(
              'r.punches[index]=e.text.toString();saveData();showPunch()',
              'r.punches[index]=normalizeTime(e.text.toString());saveData();showPunch()'
          )

          s = s.replace(
              'r.punches[i]=e.text.toString()};saveData();showHistory()',
              'r.punches[i]=normalizeTime(e.text.toString())};saveData();showHistory()'
          )

          # ============================================================
          # SALVAR
          # ============================================================

          p.write_text(s, encoding="utf-8")

          print("======================================")
          print(" CORREÇÕES APLICADAS")
          print("======================================")
          print("Linhas finais:", len(s.splitlines()))

          PY

      - name: Verificar Kotlin corrigido
        shell: bash
        run: |
          set -e

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          test -f "$FILE"

          echo "VERIFICANDO MainActivity.kt"

          grep -q "private fun normalizeTime" "$FILE"
          grep -q "private fun timeEdit" "$FILE"
          grep -q "private fun minutesBetween" "$FILE"

          echo "FUNÇÕES DE HORÁRIO ENCONTRADAS"

          echo "TRECHO DAS FUNÇÕES:"
          grep -n -E "normalizeTime|timeEdit|minutesBetween|formatMin" "$FILE" | head -30

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.11.1"

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          unzip -q \
            "gradle-${GRADLE_VERSION}-bin.zip"

          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          export PATH="$PWD/gradle-${GRADLE_VERSION}/bin:$PATH"

          gradle --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " GERANDO APK"
          echo "======================================"

          gradle assembleDebug --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK GERADO COM SUCESSO"
          ls -lh "$APK"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "VERIFICAÇÃO DO APK"
          file "$APK"
          unzip -t "$APK" > /dev/null

          echo "APK ZIP ÍNTEGRO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Finalizar
        shell: bash
        run: |
          echo "======================================"
          echo " BUILD FINALIZADO COM SUCESSO"
          echo "======================================"
