name: ControleHoras - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair ControleHoras.zip
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO EXTRAÍDO OK"

      - name: Corrigir MainActivity original
        shell: python
        run: |
          from pathlib import Path
          import re

          arquivo = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          if not arquivo.exists():
              raise SystemExit("ERRO: MainActivity.kt não encontrada.")

          codigo = arquivo.read_text(encoding="utf-8")

          print("========================================")
          print("ANALISANDO MAINACTIVITY ORIGINAL")
          print("========================================")
          print("Linhas originais:", len(codigo.splitlines()))

          # ======================================================
          # 1 - SALÁRIO
          # ======================================================

          codigo = codigo.replace(
              'setText(if(existing!=null)existing.salary.toString():"")',
              'setText(if(existing!=null)existing.salary.toString() else "")'
          )

          codigo = codigo.replace(
              'setText(if(existing != null) existing.salary.toString():"")',
              'setText(if(existing != null) existing.salary.toString() else "")'
          )

          print("OK - salário")

          # ======================================================
          # 2 - setTextColor
          # ======================================================

          codigo = codigo.replace(
              "setTextColor(text)",
              "setTextColor(this@MainActivity.text)"
          )

          print("OK - cores")

          # ======================================================
          # 3 - HISTÓRICO MENSAL
          # ======================================================

          codigo = codigo.replace(
              'it.date.endsWith(SimpleDateFormat("MM-yyyy", Locale.US).format(Date()))',
              'it.date.startsWith(SimpleDateFormat("yyyy-MM", Locale.US).format(Date()))'
          )

          print("OK - histórico")

          # ======================================================
          # 4 - NORMALIZAÇÃO DE HORÁRIO
          # ======================================================

          if "private fun normalizeTime(" not in codigo:

              marcador = (
                  "    private fun getRecord(empId:Long,date:String):PunchDay{"
              )

              if marcador not in codigo:
                  raise SystemExit(
                      "ERRO: getRecord não encontrado."
                  )

              helper = "\n".join([
                  "    private fun normalizeTime(value:String):String{",
                  "        val digits=value.filter{it.isDigit()}.take(4)",
                  "",
                  "        if(digits.length!=4)return \"\"",
                  "",
                  "        val hour=digits.substring(0,2).toIntOrNull()?:return \"\"",
                  "        val minute=digits.substring(2,4).toIntOrNull()?:return \"\"",
                  "",
                  "        if(hour !in 0..23)return \"\"",
                  "        if(minute !in 0..59)return \"\"",
                  "",
                  "        return \"%02d:%02d\".format(Locale.US,hour,minute)",
                  "    }",
                  "",
                  "    private fun timeEdit(initial:String=\"\",hintText:String=\"00:00\"):EditText{",
                  "",
                  "        val e=EditText(this).apply{",
                  "            hint=hintText",
                  "            inputType=2",
                  "            setSingleLine()",
                  "",
                  "            val normalized=normalizeTime(initial)",
                  "",
                  "            if(normalized.isNotEmpty()){",
                  "                setText(normalized)",
                  "            }",
                  "        }",
                  "",
                  "        var changing=false",
                  "",
                  "        e.addTextChangedListener(object:android.text.TextWatcher{",
                  "",
                  "            override fun beforeTextChanged(s:CharSequence?,start:Int,count:Int,after:Int){}",
                  "",
                  "            override fun onTextChanged(s:CharSequence?,start:Int,before:Int,count:Int){}",
                  "",
                  "            override fun afterTextChanged(editable:android.text.Editable?){",
                  "",
                  "                if(changing)return",
                  "",
                  "                val digits=editable?.toString()?.filter{it.isDigit()}?.take(4).orEmpty()",
                  "",
                  "                val formatted=when{",
                  "                    digits.isEmpty()->\"\"",
                  "                    digits.length<=2->digits",
                  "                    else->digits.substring(0,2)+\":\"+digits.substring(2)",
                  "                }",
                  "",
                  "                if(formatted!=editable?.toString()){",
                  "                    changing=true",
                  "                    e.setText(formatted)",
                  "                    e.setSelection(e.text.length)",
                  "                    changing=false",
                  "                }",
                  "            }",
                  "        })",
                  "",
                  "        e.setOnFocusChangeListener{_,hasFocus->",
                  "",
                  "            if(!hasFocus){",
                  "",
                  "                val normalized=normalizeTime(e.text.toString())",
                  "",
                  "                if(normalized.isNotEmpty()){",
                  "                    e.setText(normalized)",
                  "                    e.setSelection(e.text.length)",
                  "                }",
                  "            }",
                  "        }",
                  "",
                  "        return e",
                  "    }",
                  ""
              ])

              codigo = codigo.replace(
                  marcador,
                  helper + marcador,
                  1
              )

              print("OK - normalizeTime/timeEdit")

          else:
              print("OK - funções de horário já existem")

          # ======================================================
          # 5 - EDIÇÃO MANUAL
          # ======================================================

          padrao = re.compile(
              r'val e=EditText\(this\)\.apply\{'
              r'setText\(r\.punches\[index\]\);'
              r'hint="HH:mm";'
              r'inputType=2;'
              r'setSingleLine\(\)\}'
          )

          codigo, quantidade = padrao.subn(
              'val e=timeEdit(r.punches[index],punchNames[index])',
              codigo,
              count=1
          )

          print(
              "OK - edição manual:",
              quantidade
          )

          codigo = codigo.replace(
              'r.punches[index]=e.text.toString();saveData();showPunch()',
              'r.punches[index]=normalizeTime(e.text.toString());saveData();showPunch()'
          )

          # ======================================================
          # 6 - EDIÇÃO DO REGISTRO COMPLETO
          # ======================================================

          padrao = re.compile(
              r'val fields=r\.punches\.mapIndexed'
              r'\{i,v->EditText\(this\)\.apply\{'
              r'hint=punchNames\[i\];'
              r'setText\(v\);'
              r'inputType=2;'
              r'setSingleLine\(\);\}\}'
          )

          codigo, quantidade = padrao.subn(
              'val fields=r.punches.mapIndexed{i,v->timeEdit(v,punchNames[i])}',
              codigo,
              count=1
          )

          print(
              "OK - edição histórico:",
              quantidade
          )

          codigo = codigo.replace(
              'fields.forEachIndexed{i,e->r.punches[i]=e.text.toString()};saveData();showHistory()',
              'fields.forEachIndexed{i,e->r.punches[i]=normalizeTime(e.text.toString())};saveData();showHistory()'
          )

          # ======================================================
          # 7 - ESCALA
          # ======================================================

          padrao = re.compile(
              r'val ed=EditText\(this\)\.apply\{'
              r'setText\(p\.second\);'
              r'hint="00:00";'
              r'gravity=Gravity\.CENTER;'
              r'inputType=2;'
              r'setSingleLine\(\)\}'
          )

          codigo, quantidade = padrao.subn(
              'val ed=timeEdit(p.second,"00:00").apply{gravity=Gravity.CENTER}',
              codigo,
              count=1
          )

          print(
              "OK - escala:",
              quantidade
          )

          codigo = codigo.replace(
              '0->s.e=ed.text.toString();1->s.x1=ed.text.toString();2->s.r1=ed.text.toString();3->s.x2=ed.text.toString()',
              '0->s.e=normalizeTime(ed.text.toString());1->s.x1=normalizeTime(ed.text.toString());2->s.r1=normalizeTime(ed.text.toString());3->s.x2=normalizeTime(ed.text.toString())'
          )

          # ======================================================
          # 8 - MINUTES BETWEEN
          # ======================================================

          inicio = codigo.find(
              "    private fun minutesBetween(a:String,b:String):Int{"
          )

          if inicio == -1:
              raise SystemExit(
                  "ERRO: minutesBetween não encontrada."
              )

          fim = codigo.find(
              "    private fun formatMin(m:Int):String=",
              inicio
          )

          if fim == -1:
              raise SystemExit(
                  "ERRO: formatMin não encontrada."
              )

          minutes_lines = [
              "    private fun minutesBetween(a:String,b:String):Int{",
              "",
              "        val x=normalizeTime(a)",
              "        val y=normalizeTime(b)",
              "",
              "        if(x.isBlank()||y.isBlank())return 0",
              "",
              "        return try{",
              "",
              "            val xa=x.split(\":\")",
              "            val ya=y.split(\":\")",
              "",
              "            val inicio=xa[0].toInt()*60+xa[1].toInt()",
              "            val fim=ya[0].toInt()*60+ya[1].toInt()",
              "",
              "            max(0,fim-inicio)",
              "",
              "        }catch(_:Exception){",
              "            0",
              "        }",
              "    }",
              ""
          ]

          minutes_between = "\n".join(minutes_lines)

          codigo = (
              codigo[:inicio]
              + minutes_between
              + codigo[fim:]
          )

          print("OK - minutesBetween")

          # ======================================================
          # 9 - FORMATMIN
          # ======================================================

          inicio = codigo.find(
              "    private fun formatMin(m:Int):String="
          )

          if inicio == -1:
              raise SystemExit(
                  "ERRO: formatMin não encontrada."
              )

          fim = codigo.find(
              "\n",
              inicio
          )

          if fim == -1:
              fim = len(codigo)

          format_min = (
              '    private fun formatMin(m:Int):String='
              '"%02d:%02d".format(Locale.US,max(0,m)/60,max(0,m)%60)'
          )

          codigo = (
              codigo[:inicio]
              + format_min
              + codigo[fim:]
          )

          print("OK - formatMin")

          # ======================================================
          # 10 - VALIDAÇÕES
          # ======================================================

          obrigatorias = [
              "private fun normalizeTime",
              "private fun timeEdit",
              "private fun minutesBetween",
              "private fun formatMin",
              "private fun editPunch",
              "private fun editRecord",
              "private fun employeeDialog",
              "private fun confirmDelete",
              "private fun showPunch",
              "private fun showHistory",
              "private fun showReport",
              "private fun showEmployees",
              "private fun showScale"
          ]

          for funcao in obrigatorias:
              if funcao not in codigo:
                  raise SystemExit(
                      "ERRO FINAL: função ausente: "
                      + funcao
                  )

          abertas = codigo.count("{")
          fechadas = codigo.count("}")

          print("========================================")
          print("VALIDAÇÃO FINAL")
          print("========================================")
          print("Linhas:", len(codigo.splitlines()))
          print("Chaves abertas:", abertas)
          print("Chaves fechadas:", fechadas)

          if abertas != fechadas:
              raise SystemExit(
                  f"ERRO: chaves incompatíveis {abertas}/{fechadas}"
              )

          if "private fun normalizeTime" not in codigo:
              raise SystemExit("ERRO: normalizeTime")

          if "private fun timeEdit" not in codigo:
              raise SystemExit("ERRO: timeEdit")

          if "%02d:%02d" not in codigo:
              raise SystemExit("ERRO: formato 00:00")

          arquivo.write_text(
              codigo,
              encoding="utf-8"
          )

          print("========================================")
          print("MAINACTIVITY ORIGINAL CORRIGIDA")
          print("========================================")

      - name: Validar código
        shell: python
        run: |
          from pathlib import Path

          arquivo = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          codigo = arquivo.read_text(encoding="utf-8")

          obrigatorias = [
              "private fun normalizeTime",
              "private fun timeEdit",
              "private fun minutesBetween",
              "private fun formatMin"
          ]

          for item in obrigatorias:
              if item not in codigo:
                  raise SystemExit(
                      "ERRO: " + item
                  )

          abertas = codigo.count("{")
          fechadas = codigo.count("}")

          print("Linhas:", len(codigo.splitlines()))
          print("Chaves:", abertas, fechadas)

          if abertas != fechadas:
              raise SystemExit(
                  "ERRO DE CHAVES"
              )

          print("CÓDIGO VALIDADO")

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q gradle-8.11.1-bin.zip

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "========================================"
          echo "APK GERADO"
          echo "========================================"

          ls -lh "$APK"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK ÍNTEGRO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Finalizar
        shell: bash
        run: |
          echo "CONTROLEHORAS FINALIZADO"
