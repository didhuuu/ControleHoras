              private fun showManualWheel(
                  empId:Long
              ){

                  val r=
                      getRecord(
                          empId,
                          selectedPunchDate
                      )

                  val n=
                      nextPunchIndex(
                          r,
                          extraEnabled(
                              empId,
                              selectedPunchDate
                          )
                      )

                  if(n<0){

                      Toast.makeText(
                          this,
                          "As batidas disponíveis deste dia já estão preenchidas.",
                          Toast.LENGTH_LONG
                      ).show()

                      return
                  }

                  val wrap=
                      LinearLayout(this).apply{

                          orientation=
                              LinearLayout.VERTICAL

                          gravity=
                              Gravity.CENTER_HORIZONTAL

                          setPadding(
                              dp(10),
                              0,
                              dp(10),
                              0
                          )
                      }

                  wrap.addView(
                      TextView(this).apply{

                          text=
                              "${punchNames[n]}\n"+
                              df.format(
                                  parseIso(
                                      selectedPunchDate
                                  )
                              )

                          gravity=
                              Gravity.CENTER

                          textSize=16f

                          setTypeface(
                              null,
                              Typeface.BOLD
                          )

                          setTextColor(
                              darkBlue
                          )

                          setPadding(
                              0,
                              dp(4),
                              0,
                              dp(8)
                          )
                      }
                  )

                  val wheels=
                      LinearLayout(this).apply{

                          orientation=
                              LinearLayout.HORIZONTAL

                          gravity=
                              Gravity.CENTER
                      }

                  val now=
                      Calendar.getInstance()

                  val hour=
                      NumberPicker(this).apply{

                          minValue=0
                          maxValue=23

                          value=
                              now.get(
                                  Calendar.HOUR_OF_DAY
                              )

                          wrapSelectorWheel=true

                          descendantFocusability=
                              NumberPicker
                                  .FOCUS_BLOCK_DESCENDANTS
                      }

                  val minute=
                      NumberPicker(this).apply{

                          minValue=0
                          maxValue=59

                          value=
                              now.get(
                                  Calendar.MINUTE
                              )

                          wrapSelectorWheel=true

                          descendantFocusability=
                              NumberPicker
                                  .FOCUS_BLOCK_DESCENDANTS
                      }

                  styleWheel(hour)
                  styleWheel(minute)

                  val sep=
                      TextView(this).apply{

                          text=":"

                          textSize=22f

                          gravity=
                              Gravity.CENTER
                      }

                  wheels.addView(
                      hour,
                      LinearLayout.LayoutParams(
                          dp(72),
                          dp(126)
                      )
                  )

                  wheels.addView(
                      sep,
                      LinearLayout.LayoutParams(
                          dp(28),
                          dp(126)
                      )
                  )

                  wheels.addView(
                      minute,
                      LinearLayout.LayoutParams(
                          dp(72),
                          dp(126)
                      )
                  )

                  wrap.addView(wheels)

                  val value=
                      TextView(this).apply{

                          text=
                              "%02d:%02d".format(
                                  Locale.US,
                                  hour.value,
                                  minute.value
                              )

                          textSize=24f

                          setTypeface(
                              null,
                              Typeface.BOLD
                          )

                          setTextColor(
                              blue
                          )

                          gravity=
                              Gravity.CENTER

                          setPadding(
                              0,
                              dp(5),
                              0,
                              dp(5)
                          )
                      }

                  val listener=
                      NumberPicker
                          .OnValueChangeListener{
                              _,_,_->

                              value.text=
                                  "%02d:%02d".format(
                                      Locale.US,
                                      hour.value,
                                      minute.value
                                  )
                          }

                  hour.setOnValueChangedListener(
                      listener
                  )

                  minute.setOnValueChangedListener(
                      listener
                  )

                  wrap.addView(value)

                  val dialog=
                      AlertDialog.Builder(this)
                          .setTitle(
                              "Registro manual"
                          )
                          .setView(wrap)
                          .setNegativeButton(
                              "Cancelar",
                              null
                          )
                          .setPositiveButton(
                              "REGISTRAR",
                              null
                          )
                          .create()

                  dialog.setOnShowListener{

                      dialog.getButton(
                          AlertDialog.BUTTON_POSITIVE
                      ).setOnClickListener{

                          r.punches[n]=
                              "%02d:%02d".format(
                                  Locale.US,
                                  hour.value,
                                  minute.value
                              )

                          saveData()

                          dialog.dismiss()

                          showPunch()
                      }
                  }

                  dialog.show()
              }

          '''

          code=code[:start]+show+code[end:]

          # Calculation
          cstart=
              code.find(
                  '    private fun calculate(r:PunchDay):Calc{'
              )

          cend=
              code.find(
                  '    private fun minutesBetween',
                  cstart
              )

          if cstart<0 or cend<0:
              raise SystemExit(
                  'ERRO: calculate não encontrado'
              )

          calc='''    private fun calculate(
                  r:PunchDay
              ):Calc{

                  var worked=
                      minutesBetween(
                          r.punches[0],
                          r.punches[1]
                      )+
                      minutesBetween(
                          r.punches[2],
                          r.punches[5]
                      )

                  val extra2=
                      r.punches[3].isNotBlank()||
                      r.punches[4].isNotBlank()

                  if(extra2){

                      worked=
                          minutesBetween(
                              r.punches[0],
                              r.punches[1]
                          )+
                          minutesBetween(
                              r.punches[2],
                              r.punches[3]
                          )+
                          minutesBetween(
                              r.punches[4],
                              r.punches[5]
                          )
                  }

                  val date=
                      parseIso(r.date)

                  if(!modeForDay(date))
                      return Calc(
                          worked,
                          0,
                          0,
                          worked
                      )

                  val expected=
                      durationMinutes(
                          weeklyTarget
                      )/
                      (
                          if(
                              modeForDate(date)=="MS"
                          )
                              6
                          else
                              5
                      )

                  val extra=
                      max(
                          0,
                          worked-expected
                      )

                  return Calc(
                      worked,
                      expected,
                      extra,
                      0
                  )
              }

          '''

          code=
              code[:cstart]+
              calc+
              code[cend:]

          # Android window/insets
          imports=
              'import androidx.core.view.WindowCompat\n'+
              'import androidx.core.view.ViewCompat\n'+
              'import androidx.core.view.WindowInsetsCompat\n'

          if(
              'import androidx.core.view.WindowCompat'
              not in code
          ):

              code=
                  code.replace(
                      'import androidx.core.content.FileProvider\n',
                      'import androidx.core.content.FileProvider\n'+
                      imports,
                      1
                  )

          if(
              'WindowCompat.setDecorFitsSystemWindows(window,false)'
              not in code
          ):

              anchor='        buildShell()\n'

              if anchor not in code:
                  raise SystemExit(
                      'ERRO: buildShell não encontrado'
                  )

              inset='''        WindowCompat.setDecorFitsSystemWindows(window,false)
                  window.statusBarColor=blue
                  window.navigationBarColor=Color.WHITE
                  window.decorView.systemUiVisibility=View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR

                  ViewCompat.setOnApplyWindowInsetsListener(root){v,insets->

                      val bars=
                          insets.getInsets(
                              WindowInsetsCompat.Type.systemBars()
                          )

                      v.setPadding(
                          v.paddingLeft,
                          bars.top,
                          v.paddingRight,
                          bars.bottom
                      )

                      insets
                  }

                  ViewCompat.requestApplyInsets(root)

          '''

              code=
                  code.replace(
                      anchor,
                      anchor+inset,
                      1
                  )

          # ÍCONE CORRETO:
          # relógio + calendário + CONTROLE DE HORAS

          icon_b64=''

          icon=root/'app/src/main/res/drawable/controlehoras_icon.jpg'

          icon.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          icon.write_bytes(
              base64.b64decode(icon_b64)
          )

          m=manifest.read_text(
              encoding='utf-8'
          )

          if(
              'android:icon="@drawable/controlehoras_icon"'
              not in m
          ):

              m=m.replace(
                  '<application',
                  '<application\n'
                  '        android:icon="@drawable/controlehoras_icon"\n'
                  '        android:roundIcon="@drawable/controlehoras_icon"',
                  1
              )

          manifest.write_text(
              m,
              encoding='utf-8'
          )

          src.write_text(
              code,
              encoding='utf-8'
          )

          print(
              'CORREÇÕES FINAIS APLICADAS'
          )

