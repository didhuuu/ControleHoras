name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          rm -rf ControleHoras
          unzip -o ControleHoras.zip || test $? -eq 1

          echo "Verificando projeto..."

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "Projeto encontrado corretamente."

      - name: Configurar AndroidX
        working-directory: ControleHoras
        shell: bash
        run: |
          grep -q '^android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -q '^android.enableJetifier=true' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties

      - name: Preparar Gradle
        working-directory: ControleHoras
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Compilar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Conferir APK
        working-directory: ControleHoras
        shell: bash
        run: |
          find app/build/outputs/apk/debug -type f -name "*.apk" -print
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
