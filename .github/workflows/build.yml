name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # APLICA A BASE ESTÁVEL
      # ============================================================

      - name: Aplicar base correta
        shell: python
        run: |
          import subprocess
          import tempfile
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          subprocess.run(
              [
                  "python",
                  "-m",
                  "pip",
                  "install",
                  "-q",
                  "pyyaml"
              ],
              check=True
          )

          import yaml

          URL = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          print("=" * 70)
          print("BAIXANDO BASE ESTÁVEL")
          print("=" * 70)

          request = Request(
              URL,
              headers={
                  "User-Agent": "ControleHoras"
              }
          )

          workflow = urlopen(
              request,
              timeout=60
          ).read().decode("utf-8")

          data = yaml.safe_load(workflow)

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERRO: workflow da base inválido."
              )

          steps = (
              data
              .get("jobs", {})
              .get("build", {})
              .get("steps", [])
          )

          if not steps:
              raise SystemExit(
                  "ERRO: etapas da base não encontradas."
              )

          print(
              "Etapas encontradas:",
              len(steps)
          )

          def run_step(step):

              name = step.get(
                  "name",
                  "Etapa"
              )

              if "uses" in step:
                  return

              script = step.get("run")

              if not script:
                  return

              shell = step.get(
                  "shell",
                  "bash"
              )

              workdir = step.get(
                  "working-directory",
                  "."
              )

              cwd = Path(workdir)

              if not cwd.is_absolute():
                  cwd = Path.cwd() / cwd

              print("")
              print("=" * 70)
              print("EXECUTANDO:", name)
              print("=" * 70)

              env = os.environ.copy()

              if shell == "python":

                  script_file = (
                      Path(tempfile.gettempdir())
                      /
                      (
                          "controlehoras_"
                          +
                          str(abs(hash(name)))
                          +
                          ".py"
                      )
                  )

                  script_file.write_text(
                      script,
                      encoding="utf-8"
                  )

                  subprocess.run(
                      [
                          "python",
                          str(script_file)
                      ],
                      cwd=str(cwd),
                      env=env,
                      check=True
                  )

              else:

                  subprocess.run(
                      [
                          "bash",
                          "-e"
                      ],
                      input=script,
                      text=True,
                      cwd=str(cwd),
                      env=env,
                      check=True
                  )

          stop_names = {
              "Validar código",
              "Validar código e ícone",
              "Validar código final",
              "Instalar Gradle 8.11.1",
              "Limpar projeto",
              "Gerar APK",
              "Verificar APK"
          }

          for step in steps:

              name = step.get(
                  "name",
                  ""
              )

              if name in stop_names:
                  break

              if name in {
                  "Baixar projeto",
                  "Configurar Java 17"
              }:
                  continue

              run_step(step)

          print("")
          print("=" * 70)
          print("BASE ESTÁVEL APLICADA")
          print("=" * 70)

      # ============================================================
      # CORREÇÃO DO CARTÃO DO FUNCIONÁRIO
      # ============================================================

      - name: Corrigir cartão
        shell: python
        run: |
          from pathlib import Path
          import re

          main = Path(
              "ControleHoras/"
              "app/src/main/java/com/didhuuu/"
              "controlehoras/MainActivity.kt"
          )

          if not main.exists():
              raise SystemExit(
                  "ERRO: MainActivity.kt não encontrada."
              )

          code = main.read_text(
              encoding="utf-8"
          )

          pattern = re.compile(
              r"""
              box\.addView\(
                  \s*
                  card\(\)\.apply\{
                  (?P<body>.*?)
                  \n\s*
                  \},
                  \s*0,
                  \s*0,
                  \s*0,
                  \s*dp\(10\)
                  \s*
              \)
              """,
              re.DOTALL |
              re.VERBOSE
          )

          match = pattern.search(code)

          if match:

              body = match.group("body")

              replacement = (
                  "val employeeCard="
                  "(card() as ViewGroup).apply{"
                  +
                  body
                  +
                  "\n"
                  "              }\n\n"
                  "              box.addView(\n"
                  "                  employeeCard,\n"
                  "                  LinearLayout.LayoutParams(\n"
                  "                      -1,\n"
                  "                      -2\n"
                  "                  ).apply{\n"
                  "                      bottomMargin=dp(10)\n"
                  "                  }\n"
                  "              )"
              )

              code = (
                  code[:match.start()]
                  +
                  replacement
                  +
                  code[match.end():]
              )

              main.write_text(
                  code,
                  encoding="utf-8"
              )

              print(
                  "CARTÃO CORRIGIDO"
              )

          elif (
              "val employeeCard=" in code
              and
              "LinearLayout.LayoutParams" in code
          ):

              print(
                  "Cartão já estava corrigido."
              )

          else:

              raise SystemExit(
                  "ERRO: cartão de funcionário não encontrado."
              )

      # ============================================================
      # RODA DE HORAS AZUL / NEON
      #
      # SEM BASE64
      # SEM NUMBERPICKER
      # SEM ARQUIVO DE SOM EXTERNO
      #
      # O SOM É GERADO PELO ToneGenerator.
      # ============================================================

      - name: Instalar roda azul neon
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("ControleHoras")

          main = (
              root /
              "app/src/main/java/com/didhuuu/"
              "controlehoras/MainActivity.kt"
          )

          wheel = (
              root /
              "app/src/main/java/com/didhuuu/"
              "controlehoras/TimeWheelView.kt"
          )

          if not main.exists():
              raise SystemExit(
                  "ERRO: MainActivity.kt não encontrada."
              )

          code = main.read_text(
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # IMPORTS NECESSÁRIOS
          # --------------------------------------------------------

          package_line = (
              "package com.didhuuu.controlehoras\n"
          )

          imports = [
              "import android.view.ViewGroup",
              "import android.widget.LinearLayout"
          ]

          for imp in imports:

              if imp not in code:

                  code = code.replace(
                      package_line,
                      package_line +
                      imp +
                      "\n",
                      1
                  )

          # --------------------------------------------------------
          # NOMES DAS BATIDAS
          # --------------------------------------------------------

          punch_names = [
              "    private val punchNames = arrayOf(",
              '        "Entrada",',
              '        "Saída",',
              '        "Retorno",',
              '        "Saída intervalo 2",',
              '        "Retorno intervalo 2",',
              '        "Saída"',
              "    )"
          ]

          if "private val punchNames" not in code:

              class_pos = code.find(
                  "class MainActivity"
              )

              if class_pos < 0:
                  raise SystemExit(
                      "ERRO: MainActivity não encontrada."
                  )

              brace_pos = code.find(
                  "{",
                  class_pos
              )

              if brace_pos < 0:
                  raise SystemExit(
                      "ERRO: abertura da MainActivity não encontrada."
                  )

              code = (
                  code[:brace_pos + 1]
                  +
                  "\n"
                  +
                  "\n".join(
                      punch_names
                  )
                  +
                  "\n"
                  +
                  code[brace_pos + 1:]
              )

          # --------------------------------------------------------
          # LOCALIZA UMA FUNÇÃO KOTLIN COMPLETA
          # --------------------------------------------------------

          def find_method_span(
              source,
              name
          ):

              pattern = re.compile(
                  r"(?m)^\s*"
                  r"(?:private\s+|public\s+|internal\s+)?"
                  r"fun\s+"
                  +
                  re.escape(name)
                  +
                  r"\s*\("
              )

              match = pattern.search(
                  source
              )

              if not match:
                  return None

              start = match.start()

              brace = source.find(
                  "{",
                  match.end()
              )

              if brace < 0:
                  return None

              depth = 0
              i = brace
              state = "code"

              while i < len(source):

                  ch = source[i]

                  nxt = (
                      source[i + 1]
                      if i + 1 < len(source)
                      else ""
                  )

                  nxt2 = (
                      source[i + 2]
                      if i + 2 < len(source)
                      else ""
                  )

                  if state == "code":

                      if (
                          ch == "/"
                          and
                          nxt == "/"
                      ):
                          state = "line"
                          i += 2
                          continue

                      if (
                          ch == "/"
                          and
                          nxt == "*"
                      ):
                          state = "block"
                          i += 2
                          continue

                      if (
                          ch == '"'
                          and
                          nxt == '"'
                          and
                          nxt2 == '"'
                      ):
                          state = "triple"
                          i += 3
                          continue

                      if ch == '"':
                          state = "double"
                          i += 1
                          continue

                      if ch == "'":
                          state = "char"
                          i += 1
                          continue

                      if ch == "{":
                          depth += 1

                      elif ch == "}":

                          depth -= 1

                          if depth == 0:
                              return (
                                  start,
                                  i + 1
                              )

                      i += 1
                      continue

                  if state == "line":

                      if ch == "\n":
                          state = "code"

                      i += 1
                      continue

                  if state == "block":

                      if (
                          ch == "*"
                          and
                          nxt == "/"
                      ):
                          state = "code"
                          i += 2

                      else:
                          i += 1

                      continue

                  if state == "triple":

                      if (
                          ch == '"'
                          and
                          nxt == '"'
                          and
                          nxt2 == '"'
                      ):
                          state = "code"
                          i += 3

                      else:
                          i += 1

                      continue

                  if state == "double":

                      if ch == "\\":
                          i += 2

                      elif ch == '"':
                          state = "code"
                          i += 1

                      else:
                          i += 1

                      continue

                  if state == "char":

                      if ch == "\\":
                          i += 2

                      elif ch == "'":
                          state = "code"
                          i += 1

                      else:
                          i += 1

              return None

          # --------------------------------------------------------
          # SUBSTITUIÇÃO DE FUNÇÃO
          # --------------------------------------------------------

          def replace_method(
              source,
              name,
              new_code
          ):

              span = find_method_span(
                  source,
                  name
              )

              if not span:
                  raise SystemExit(
                      "ERRO: função "
                      +
                      name
                      +
                      " não encontrada."
                  )

              start, end = span

              return (
                  source[:start]
                  +
                  new_code
                  +
                  source[end:]
              )

          # --------------------------------------------------------
          # DIALOG DA RODA
          # --------------------------------------------------------

          dialog_code = r'''
              private fun showTimeWheelDialog(
                  title: String,
                  subtitle: String,
                  initialHour: Int,
                  initialMinute: Int,
                  positive: String,
                  onSave: (Int, Int) -> Unit
              ) {
                  val wrap =
                      android.widget.LinearLayout(this).apply {
                          orientation =
                              android.widget.LinearLayout.VERTICAL

                          gravity =
                              android.view.Gravity.CENTER_HORIZONTAL

                          setPadding(
                              dp(8),
                              dp(8),
                              dp(8),
                              0
                          )
                      }

                  val sub =
                      android.widget.TextView(this).apply {

                          text =
                              subtitle

                          gravity =
                              android.view.Gravity.CENTER

                          textSize =
                              16f

                          setTypeface(
                              null,
                              android.graphics.Typeface.BOLD
                          )

                          setTextColor(
                              0xFF173F68.toInt()
                          )

                          setPadding(
                              0,
                              0,
                              0,
                              dp(8)
                          )
                      }

                  wrap.addView(sub)

                  val wheels =
                      android.widget.LinearLayout(this).apply {

                          orientation =
                              android.widget.LinearLayout.HORIZONTAL

                          gravity =
                              android.view.Gravity.CENTER
                      }

                  val hour =
                      TimeWheelView(
                          this,
                          0,
                          23,
                          initialHour
                      )

                  val minute =
                      TimeWheelView(
                          this,
                          0,
                          59,
                          initialMinute
                      )

                  val colon =
                      android.widget.TextView(this).apply {

                          text =
                              ":"

                          textSize =
                              34f

                          gravity =
                              android.view.Gravity.CENTER

                          setTypeface(
                              null,
                              android.graphics.Typeface.BOLD
                          )

                          setTextColor(
                              0xFF777777.toInt()
                          )
                      }

                  wheels.addView(
                      hour,
                      android.widget.LinearLayout.LayoutParams(
                          dp(105),
                          dp(190)
                      )
                  )

                  wheels.addView(
                      colon,
                      android.widget.LinearLayout.LayoutParams(
                          dp(30),
                          dp(190)
                      )
                  )

                  wheels.addView(
                      minute,
                      android.widget.LinearLayout.LayoutParams(
                          dp(105),
                          dp(190)
                      )
                  )

                  wrap.addView(wheels)

                  val value =
                      android.widget.TextView(this).apply {

                          textSize =
                              30f

                          gravity =
                              android.view.Gravity.CENTER

                          setTypeface(
                              null,
                              android.graphics.Typeface.BOLD
                          )

                          setTextColor(
                              0xFF1565C0.toInt()
                          )

                          setPadding(
                              0,
                              dp(6),
                              0,
                              dp(2)
                          )
                      }

                  fun refresh() {

                      value.text =
                          "%02d:%02d".format(
                              java.util.Locale.US,
                              hour.value,
                              minute.value
                          )
                  }

                  hour.onValueChanged = {
                      refresh()
                  }

                  minute.onValueChanged = {
                      refresh()
                  }

                  refresh()

                  wrap.addView(value)

                  val dialog =
                      android.app.AlertDialog
                          .Builder(this)
                          .setTitle(title)
                          .setView(wrap)
                          .setNegativeButton(
                              "CANCELAR",
                              null
                          )
                          .setPositiveButton(
                              positive,
                              null
                          )
                          .create()

                  dialog.setOnShowListener {

                      dialog
                          .getButton(
                              android.app.AlertDialog
                                  .BUTTON_POSITIVE
                          )
                          .setOnClickListener {

                              onSave(
                                  hour.value,
                                  minute.value
                              )

                              dialog.dismiss()
                          }
                  }

                  dialog.show()
              }
          '''

          # --------------------------------------------------------
          # EDIÇÃO DE REGISTRO EXISTENTE
          # --------------------------------------------------------

          edit_code = r'''
              private fun showEditWheel(
                  rec: PunchDay,
                  index: Int
              ) {

                  if (
                      index !in rec.punches.indices
                      ||
                      rec.punches[index].isBlank()
                  ) {

                      Toast.makeText(
                          this,
                          "Esse registro ainda está vazio. Use REGISTRO MANUAL.",
                          Toast.LENGTH_LONG
                      ).show()

                      return
                  }

                  val parts =
                      rec.punches[index]
                          .split(":")

                  val hour =
                      parts
                          .getOrNull(0)
                          ?.toIntOrNull()
                          ?.coerceIn(0, 23)
                          ?: 0

                  val minute =
                      parts
                          .getOrNull(1)
                          ?.toIntOrNull()
                          ?.coerceIn(0, 59)
                          ?: 0

                  showTimeWheelDialog(
                      "Editar registro",
                      "${punchNames[index]}\n${rec.date}",
                      hour,
                      minute,
                      "SALVAR"
                  ) { h, m ->

                      rec.punches[index] =
                          "%02d:%02d".format(
                              java.util.Locale.US,
                              h,
                              m
                          )

                      saveData()

                      showPunch()
                  }
              }
          '''

          # --------------------------------------------------------
          # REGISTRO MANUAL
          # --------------------------------------------------------

          manual_code = r'''
              private fun showManualWheel(
                  empId: Long
              ) {

                  val r =
                      getRecord(
                          empId,
                          selectedPunchDate
                      )

                  val n =
                      nextPunchIndex(
                          r,
                          extraEnabled(
                              empId,
                              selectedPunchDate
                          )
                      )

                  if (n < 0) {

                      Toast.makeText(
                          this,
                          "As batidas disponíveis deste dia já estão preenchidas.",
                          Toast.LENGTH_LONG
                      ).show()

                      return
                  }

                  val now =
                      java.util.Calendar
                          .getInstance()

                  showTimeWheelDialog(
                      "Registro manual",
                      "${punchNames[n]}\n${selectedPunchDate}",
                      now.get(
                          java.util.Calendar.HOUR_OF_DAY
                      ),
                      now.get(
                          java.util.Calendar.MINUTE
                      ),
                      "REGISTRAR"
                  ) { h, m ->

                      r.punches[n] =
                          "%02d:%02d".format(
                              java.util.Locale.US,
                              h,
                              m
                          )

                      saveData()

                      showPunch()
                  }
              }
          '''

          # --------------------------------------------------------
          # APLICA AS FUNÇÕES
          # --------------------------------------------------------

          code = replace_method(
              code,
              "showEditWheel",
              edit_code
          )

          code = replace_method(
              code,
              "showManualWheel",
              manual_code
          )

          dialog_span = find_method_span(
              code,
              "showTimeWheelDialog"
          )

          if dialog_span:

              a, b = dialog_span

              code = (
                  code[:a]
                  +
                  dialog_code
                  +
                  code[b:]
              )

          else:

              history_pos = code.find(
                  "    private fun showHistory("
              )

              if history_pos < 0:

                  history_pos = code.find(
                      "    fun showHistory("
                  )

              if history_pos < 0:

                  raise SystemExit(
                      "ERRO: showHistory não encontrada."
                  )

              code = (
                  code[:history_pos]
                  +
                  dialog_code
                  +
                  "\n\n"
                  +
                  code[history_pos:]
              )

          # --------------------------------------------------------
          # RODA CUSTOMIZADA
          # --------------------------------------------------------

          wheel_code = r'''
          package com.didhuuu.controlehoras

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Shader
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.abs

          class TimeWheelView(
              context: Context,
              private val minimum: Int,
              private val maximum: Int,
              initial: Int
          ) : View(context) {

              var value: Int =
                  initial.coerceIn(
                      minimum,
                      maximum
                  )
                  private set

              var onValueChanged:
                  (() -> Unit)? = null

              private val density =
                  resources
                      .displayMetrics
                      .density

              private val paint =
                  Paint(
                      Paint.ANTI_ALIAS_FLAG
                  )

              private val tone =
                  ToneGenerator(
                      AudioManager.STREAM_NOTIFICATION,
                      65
                  )

              private var lastY =
                  0f

              private var accumulated =
                  0f

              private fun dp(
                  value: Float
              ): Float =
                  value * density

              private fun change(
                  delta: Int
              ) {

                  val next =
                      (
                          value + delta
                      ).coerceIn(
                          minimum,
                          maximum
                      )

                  if (
                      next == value
                  ) {
                      return
                  }

                  value =
                      next

                  tone.startTone(
                      ToneGenerator
                          .TONE_PROP_BEEP,
                      35
                  )

                  onValueChanged
                      ?.invoke()

                  invalidate()
              }

              override fun onDraw(
                  canvas: Canvas
              ) {

                  super.onDraw(
                      canvas
                  )

                  val width =
                      width.toFloat()

                  val height =
                      height.toFloat()

                  val center =
                      height / 2f

                  paint.shader =
                      LinearGradient(
                          0f,
                          0f,
                          width,
                          0f,
                          intArrayOf(
                              0xFF17191C.toInt(),
                              0xFFB9BDC4.toInt(),
                              0xFFF5F7FA.toInt(),
                              0xFF9EA4AB.toInt(),
                              0xFF17191C.toInt()
                          ),
                          null,
                          Shader.TileMode.CLAMP
                      )

                  canvas.drawRoundRect(
                      dp(4f),
                      dp(3f),
                      width - dp(4f),
                      height - dp(3f),
                      dp(18f),
                      dp(18f),
                      paint
                  )

                  paint.shader =
                      LinearGradient(
                          0f,
                          center - dp(34f),
                          0f,
                          center + dp(34f),
                          intArrayOf(
                              0xFF003CFF.toInt(),
                              0xFF008BFF.toInt(),
                              0xFF0050FF.toInt()
                          ),
                          null,
                          Shader.TileMode.CLAMP
                      )

                  canvas.drawRoundRect(
                      dp(9f),
                      center - dp(34f),
                      width - dp(9f),
                      center + dp(34f),
                      dp(10f),
                      dp(10f),
                      paint
                  )

                  paint.shader =
                      null

                  paint.textAlign =
                      Paint.Align.CENTER

                  val range =
                      maximum -
                      minimum +
                      1

                  for (
                      offset in -2..2
                  ) {

                      var number =
                          value + offset

                      while (
                          number > maximum
                      ) {
                          number -= range
                      }

                      while (
                          number < minimum
                      ) {
                          number += range
                      }

                      paint.textSize =
                          if (
                              offset == 0
                          ) {
                              dp(28f)
                          } else {
                              dp(19f)
                          }

                      paint.color =
                          if (
                              offset == 0
                          ) {
                              0xFFFFFFFF.toInt()
                          } else {
                              0xFFE2E7EE.toInt()
                          }

                      canvas.drawText(
                          "%02d".format(
                              number
                          ),
                          width / 2f,
                          center +
                              offset *
                              dp(45f) +
                              dp(9f),
                          paint
                      )
                  }

                  paint.color =
                      0xFF00D9FF.toInt()

                  paint.style =
                      Paint.Style.STROKE

                  paint.strokeWidth =
                      dp(2f)

                  canvas.drawLine(
                      dp(3f),
                      center - dp(30f),
                      dp(19f),
                      center,
                      paint
                  )

                  canvas.drawLine(
                      dp(3f),
                      center + dp(30f),
                      dp(19f),
                      center,
                      paint
                  )

                  canvas.drawLine(
                      width - dp(3f),
                      center - dp(30f),
                      width - dp(19f),
                      center,
                      paint
                  )

                  canvas.drawLine(
                      width - dp(3f),
                      center + dp(30f),
                      width - dp(19f),
                      center,
                      paint
                  )

                  paint.style =
                      Paint.Style.FILL
              }

              override fun onTouchEvent(
                  event: MotionEvent
              ): Boolean {

                  when (
                      event.actionMasked
                  ) {

                      MotionEvent.ACTION_DOWN -> {

                          lastY =
                              event.y

                          accumulated =
                              0f

                          return true
                      }

                      MotionEvent.ACTION_MOVE -> {

                          accumulated +=
                              event.y -
                              lastY

                          if (
                              abs(
                                  accumulated
                              ) >=
                              dp(28f)
                          ) {

                              change(
                                  if (
                                      accumulated < 0f
                                  ) {
                                      1
                                  } else {
                                      -1
                                  }
                              )

                              accumulated =
                                  0f
                          }

                          lastY =
                              event.y

                          return true
                      }

                      MotionEvent.ACTION_UP -> {

                          if (
                              abs(
                                  accumulated
                              ) < dp(10f)
                          ) {

                              change(
                                  if (
                                      event.y <
                                      height / 2f
                                  ) {
                                      1
                                  } else {
                                      -1
                                  }
                              )
                          }

                          performClick()

                          return true
                      }

                      MotionEvent.ACTION_CANCEL -> {

                          accumulated =
                              0f

                          return true
                      }
                  }

                  return true
              }

              override fun performClick():
                  Boolean {

                  super.performClick()

                  return true
              }
          }
          '''

          # Remove somente a indentação extra
          wheel_code = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in wheel_code.splitlines()
          )

          wheel.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          wheel.write_text(
              wheel_code.strip() + "\n",
              encoding="utf-8"
          )

          main.write_text(
              code,
              encoding="utf-8"
          )

          print("")
          print("=" * 70)
          print("RODA AZUL/NEON INSTALADA")
          print("SEM BASE64")
          print("SEM NUMBERPICKER")
          print("SOM MECÂNICO PELO TONEGENERATOR")
          print("=" * 70)

      # ============================================================
      # VALIDAÇÃO ANTES DO GRADLE
      # ============================================================

      - name: Validar código final
        shell: bash
        run: |
          set -e

          ROOT="ControleHoras"

          MAIN="$ROOT/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          WHEEL="$ROOT/app/src/main/java/com/didhuuu/controlehoras/TimeWheelView.kt"

          echo "Verificando arquivos..."

          test -s "$MAIN"
          test -s "$WHEEL"

          echo "Verificando roda..."

          grep -q "class TimeWheelView" "$WHEEL"

          grep -q "showTimeWheelDialog" "$MAIN"

          grep -q "showManualWheel" "$MAIN"

          grep -q "showEditWheel" "$MAIN"

          grep -q "punchNames" "$MAIN"

          echo "Verificando escala..."

          grep -q "08:48" "$MAIN"

          grep -q "07:20" "$MAIN"

          echo "Verificando datas..."

          grep -q "selectedPunchDate" "$MAIN"

          echo "Verificando intervalo 2..."

          grep -q "extra2Enabled" "$MAIN"

          grep -q "extra2ReturnEnabled" "$MAIN"

          echo "Verificando rolagem..."

          grep -q "MotionEvent" "$WHEEL"

          grep -q "accumulated" "$WHEEL"

          echo "Verificando som..."

          grep -q "TONE_PROP_BEEP" "$WHEEL"

          if grep -q "NumberPicker" "$MAIN"; then
            echo "ERRO: NumberPicker encontrado na MainActivity."
            exit 1
          fi

          if grep -q "NumberPicker" "$WHEEL"; then
            echo "ERRO: NumberPicker encontrado na roda."
            exit 1
          fi

          if grep -q "TONE_PROP_CLICK" "$WHEEL"; then
            echo "ERRO: TONE_PROP_CLICK encontrado."
            exit 1
          fi

          if grep -q "acculated" "$WHEEL"; then
            echo "ERRO: variável acculated encontrada."
            exit 1
          fi

          if grep -q "DSR" "$MAIN"; then
            echo "ERRO: DSR encontrado. DSR não faz parte desta versão."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "VALIDAÇÃO PRÉ-GRADLE OK"
          echo "=============================================="

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      # ============================================================
      # LIMPEZA
      # ============================================================

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon

      # ============================================================
      # GERAR APK
      # ============================================================

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "APK GERADO"
          echo "=============================================="

          ls -lh "$APK"

      # ============================================================
      # TESTE DO APK
      # ============================================================

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t \
            "$APK" \
            >/dev/null

          echo ""
          echo "=============================================="
          echo "APK VALIDADO COM SUCESSO"
          echo "=============================================="

      # ============================================================
      # PUBLICAR APK
      # ============================================================

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
