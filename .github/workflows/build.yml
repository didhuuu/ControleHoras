          nextPunchIndex = """    private fun nextPunchIndex(
          r:PunchDay,
          extra:Boolean
      ):Int{
          if(
              r.punches[0].isBlank()
          )return 0

          if(
              r.punches[1].isBlank()
          )return 1

          if(
              r.punches[2].isBlank()
          )return 2

          if(
              extra &&
              r.punches[3].isBlank()
          )return 3

          if(
              extra &&
              extraReturnEnabled(
                  r.employeeId,
                  r.date
              ) &&
              r.punches[4].isBlank()
          )return 4

          if(
              r.punches[5].isBlank()
          )return 5

          return -1
      }"""

          registerPunch = """    private fun registerPunch(
          empId:Long
      ){
          val r=
              getRecord(
                  empId,
                  selectedPunchDate
              )

          val n=
              nextPunchIndex(
                  r,
                  extraEnabled(
                      empId,
                      selectedPunchDate
                  )
              )

          if(n<0)return

          if(
              selectedPunchDate==
              today()
          ){
              r.punches[n]=nowTime()
              saveData()
              showPunch()
              return
          }

          val e=
              timeEdit(
                  "",
                  punchNames[n]
              )

          AlertDialog.Builder(this)
              .setTitle(
                  "Lançar " +
                  punchNames[n]
              )
              .setMessage(
                  df.format(
                      parseIso(
                          selectedPunchDate
                      )
                  )
              )
              .setView(e)
              .setNegativeButton(
                  "Cancelar",
                  null
              )
              .setPositiveButton(
                  "Salvar"
              ){_,_->

                  val t=
                      normalizeTime(
                          e.text.toString()
                      )

                  if(t.isNotBlank()){
                      r.punches[n]=t
                      saveData()
                      showPunch()
                  }else{
                      Toast.makeText(
                          this,
                          "Horário inválido.",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }
              .show()
      }"""

          showEditWheel = """    private fun showEditWheel(
