          private fun calculate(
              r:PunchDay
          ):Calc{

              var worked=0

              worked+=minutesBetween(
                  r.punches[0],
                  r.punches[1]
              )

              if(
                  r.punches[3].isNotBlank() &&
                  r.punches[4].isNotBlank()
              ){

                  worked+=minutesBetween(
                      r.punches[2],
                      r.punches[3]
                  )

                  worked+=minutesBetween(
                      r.punches[4],
                      r.punches[5]
                  )

              }else if(
                  r.punches[3].isNotBlank()
              ){

                  worked+=minutesBetween(
                      r.punches[2],
                      r.punches[3]
                  )

                  worked+=minutesBetween(
                      r.punches[3],
                      r.punches[5]
                  )

              }else{

                  worked+=minutesBetween(
                      r.punches[2],
                      r.punches[5]
                  )
              }

              val date=
                  parseIso(r.date)

              if(
                  !modeForDay(date)
              ){
                  return Calc(
                      worked,
                      0,
                      0,
                      worked
                  )
              }

              val expected=
                  durationMinutes(
                      weeklyTarget
                  )/
                  (
                      if(
                          modeForDate(date)=="MS"
                      ){
                          6
                      }else{
                          5
                      }
                  )

              val extra=
                  max(
                      0,
                      worked-expected
                  )

              return Calc(
                  worked,
                  expected,
                  extra,
                  0
              )
          }

          private fun minutesBetween(
              a:String,
              b:String
          ):Int{

              val x=
                  normalizeTime(a)

              val y=
                  normalizeTime(b)

              if(
                  x.isBlank() ||
                  y.isBlank()
              ){
                  return 0
              }

              return try{

                  val xa=x.split(":")
                  val ya=y.split(":")

                  max(
                      0,
                      (
                          ya[0].toInt()*60+
                          ya[1].toInt()
                      )-
                      (
                          xa[0].toInt()*60+
                          xa[1].toInt()
                      )
                  )

              }catch(
                  _:Exception
              ){
                  0
              }
          }

          private fun formatMin(
              m:Int
          ):String=
              "%02d:%02d".format(
                  Locale.US,
                  max(0,m)/60,
                  max(0,m)%60
              )

          private fun parseIso(
              s:String
          ):Date=
              try{
                  iso.parse(s)!!
              }catch(
                  _:Exception
              ){
                  Date()
              }

          '''

          code=code[:start]+show+code[end:]

          imports=
              'import android.view.ViewGroup\n'

          if(
              'import android.view.ViewGroup'
              not in code
          ){

              marker='import android.view.View\n'

              if marker in code:
                  code=code.replace(
                      marker,
                      marker+imports,
                      1
                  )

          }

          if(
              'import androidx.core.view.WindowCompat'
              not in code
          ):

              code=code.replace(
                  'import androidx.core.content.FileProvider\n',
                  'import androidx.core.content.FileProvider\n'+
                  'import androidx.core.view.WindowCompat\n'+
                  'import androidx.core.view.ViewCompat\n'+
                  'import androidx.core.view.WindowInsetsCompat\n',
                  1
              )

          if(
              'WindowCompat.setDecorFitsSystemWindows'
              not in code
          ):

              anchor='        buildShell()\n'

              if anchor not in code:
                  raise SystemExit(
                      'ERRO: buildShell não encontrado'
                  )

              inset='''        WindowCompat.setDecorFitsSystemWindows(
                      window,
                      false
                  )

                  window.statusBarColor=blue

                  window.navigationBarColor=Color.WHITE

                  window.decorView.systemUiVisibility=
                      View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR

                  ViewCompat.setOnApplyWindowInsetsListener(
                      root
                  ){v,insets->

                      val bars=
                          insets.getInsets(
                              WindowInsetsCompat.Type.systemBars()
                          )

                      v.setPadding(
                          v.paddingLeft,
                          bars.top,
                          v.paddingRight,
                          bars.bottom
                      )

                      insets
                  }

                  ViewCompat.requestApplyInsets(
                      root
                  )
          '''

              code=code.replace(
                  anchor,
                  anchor+inset,
                  1
              )

          m=manifest.read_text(
              encoding='utf-8'
          )

          if(
              'android:icon="@drawable/controlehoras_icon"'
              not in m
          ):

              m=m.replace(
                  '<application',
                  '<application\n'
                  '        android:icon="@drawable/controlehoras_icon"\n'
                  '        android:roundIcon="@drawable/controlehoras_icon"',
                  1
              )

          manifest.write_text(
              m,
              encoding='utf-8'
          )

          src.write_text(
              code,
              encoding='utf-8'
          )

          print(
              'CORREÇÕES FINAIS APLICADAS'
          )

