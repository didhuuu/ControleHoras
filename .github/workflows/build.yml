      }

"""

              code = code.replace(
                  anchor,
                  extra_functions + anchor,
                  1
              )

          def replace_fun(
              text,
              name,
              new_code
          ):
              pattern = (
                  r"(?ms)^    private fun "
                  + re.escape(name)
                  + r"\(.*?(?=^    private fun |\Z)"
              )

              result, count = re.subn(
                  pattern,
                  new_code + "\n\n",
                  text,
                  count=1
              )

              return result, count

          def put_fun(
              text,
              name,
              new_code
          ):
              result, count = replace_fun(
                  text,
                  name,
                  new_code
              )

              if count:
                  return result

              anchor = (
                  "    private fun showHistory()"
              )

              if anchor not in text:
                  raise SystemExit(
                      "ERRO: não foi possível inserir "
                      + name
                  )

              return text.replace(
                  anchor,
                  new_code +
                  "\n\n" +
                  anchor,
                  1
              )

