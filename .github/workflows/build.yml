name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip
          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt
          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url=(
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow=urlopen(url,timeout=30).read().decode("utf-8")

          def extract_step(name,next_name):
              start=workflow.index(f"      - name: {name}")
              end=workflow.index(
                  f"      - name: {next_name}",
                  start
              )
              block=workflow[start:end]
              marker="        run: |\n"
              pos=block.index(marker)+len(marker)
              lines=block[pos:].splitlines()
              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in lines
              )+"\n"

          scripts=[
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for i,script in enumerate(scripts):
              p=Path(tempfile.gettempdir())/f"base70_{i}.py"
              p.write_text(script,encoding="utf-8")
              subprocess.run(
                  ["python",str(p)],
                  check=True
              )

          print("BASE 70 APLICADA")

      - name: Aplicar funcionalidades da versão 80
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url=(
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow=urlopen(url,timeout=30).read().decode("utf-8")

          start=workflow.index(
              "      - name: Aplicar correções finais da Base 70, edição por rolagem e ícone"
          )

          end=workflow.index(
              "      - name: Validar código e ícone",
              start
          )

          block=workflow[start:end]
          marker="        run: |\n"
          pos=block.index(marker)

          pos+=len(marker)

          lines=block[pos:].splitlines()

          script="\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines
          )+"\n"

          p=Path(tempfile.gettempdir())/"base80.py"

          p.write_text(
              script,
              encoding="utf-8"
          )

          subprocess.run(
              ["python",str(p)],
              check=True
          )

          print("FUNCIONALIDADES BASE 80 APLICADAS")

      - name: Corrigir layout, registro manual e roda visual
        shell: python
        run: |
          from pathlib import Path
          import base64

          root=Path("ControleHoras")

          src=(
              root/
              "app/src/main/java/com/didhuuu/"
              "controlehoras/MainActivity.kt"
          )

          wheel=(
              root/
              "app/src/main/java/com/didhuuu/"
              "controlehoras/TimeWheelView.kt"
          )

          code=src.read_text(
              encoding="utf-8"
          )

          if "private val punchNames" not in code:

              names=base64.b64decode(
                  "ICAgIHByaXZhdGUgdmFsIHB1bmNoTmFtZXM9YXJyYXlPZjxTdHJpbmc+KAogICAgICAgICJFbnRyYWRhIiwKICAgICAgICAiU2HDrWRhIiwKICAgICAgICAiUmV0b3JubyIsCiAgICAgICAgIlNhw61kYSBpbnRlcnZhbG8gMiIsCiAgICAgICAgIlJldG9ybm8gaW50ZXJ2YWxvIDIiLAogICAgICAgICJTYcOtZGEiCiAgICApCg=="
              ).decode("utf-8")

              inserted=False

              for anchor in (
                  "    private val extra2ReturnEnabled=mutableSetOf<String>()\n",
                  "    private val extra2Enabled=mutableSetOf<String>()\n",
                  "    private val weekModes=linkedMapOf<String,String>()\n",
                  "    private val weekModes = linkedMapOf<String,String>()\n"
              ):

                  if anchor in code:

                      code=code.replace(
                          anchor,
                          anchor+names,
                          1
                      )

                      inserted=True

                      break

              if not inserted:

                  raise SystemExit(
                      "ERRO: não encontrei ponto para inserir punchNames"
                  )

          showPunch=base64.b64decode(
              " cCg16".replace(" ","")
          ).decode("utf-8")

          addExtra=base64.b64decode(
              " cCg14".replace(" ","")
          ).decode("utf-8")

          nextIndex=base64.b64decode(
              ""
          ).decode("utf-8")

          wheelDialog=base64.b64decode(
              ""
          ).decode("utf-8")

          calc=base64.b64decode(
              "ICAgIHByaXZhdGUgZnVuIGNhbGN1bGF0ZShyOlB1bmNoRGF5KTpDYWxjIHsKICAgICAgICB2YWwgcD1yLnB1bmNoZXMKCiAgICAgICAgdmFyIHdvcmtlZD0wCgogICAgICAgIGlmKHAW0pNDA7MzM5XS5pc0JsYW5rKCkpewogICAgICAgICAgICB3b3JrZWQrPW1pbnV0ZXNCZXR3ZWVuKHAW0pNDA7MzM5XSxwWzFdKQogICAgICAgIH0K"
          ).decode("utf-8")

          # O restante do código é aplicado abaixo pelas substituições seguras.
