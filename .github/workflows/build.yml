          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/didhuuu/ControleHoras/actions/artifacts/11068205148/zip" \
            -o /tmp/icon_artifact/icon.zip

