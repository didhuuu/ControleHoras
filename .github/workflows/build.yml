name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXTRAINDO PROJETO"
          echo "========================================"

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          print("========================================")
          print("APLICANDO BASE 70")
          print("========================================")

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          print("Baixando workflow da Base 70...")

          workflow = urlopen(
              url,
              timeout=60
          ).read().decode("utf-8")

          def extract_step(name, next_name):
              start_marker = f"      - name: {name}"
              end_marker = f"      - name: {next_name}"

              if start_marker not in workflow:
                  raise RuntimeError(
                      f"Etapa não encontrada na Base 70: {name}"
                  )

              start = workflow.index(start_marker)

              if end_marker not in workflow[start:]:
                  raise RuntimeError(
                      f"Próxima etapa não encontrada: {next_name}"
                  )

              end = workflow.index(
                  end_marker,
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              if marker not in block:
                  raise RuntimeError(
                      f"Bloco run não encontrado na etapa: {name}"
                  )

              pos = block.index(marker) + len(marker)

              lines = block[pos:].splitlines()

              script_lines = []

              for line in lines:
                  if line.startswith("          "):
                      script_lines.append(line[10:])
                  else:
                      script_lines.append(line)

              return "\n".join(script_lines).rstrip() + "\n"

          scripts = []

          scripts.append(
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              )
          )

          scripts.append(
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          )

          for i, script in enumerate(scripts):

              filename = (
                  Path(tempfile.gettempdir())
                  / f"base70_{i}.py"
              )

              filename.write_text(
                  script,
                  encoding="utf-8"
              )

              print(
                  f"Validando script Base 70 #{i + 1}..."
              )

              subprocess.run(
                  ["python", str(filename)],
                  check=True
              )

          print("========================================")
          print("BASE 70 APLICADA")
          print("ESCALA ORIGINAL PRESERVADA")
          print("========================================")

      - name: Aplicar funcionalidades da versão 80
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          print("========================================")
          print("APLICANDO FUNCIONALIDADES DA VERSÃO 80")
          print("========================================")

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=60
          ).read().decode("utf-8")

          start_marker = (
              "      - name: "
              "Aplicar correções finais da Base 70, "
              "edição por rolagem e ícone"
          )

          end_marker = (
              "      - name: Validar código e ícone"
          )

          if start_marker not in workflow:
              raise RuntimeError(
                  "Etapa da versão 80 não encontrada."
              )

          start = workflow.index(
              start_marker
          )

          if end_marker not in workflow[start:]:
              raise RuntimeError(
                  "Fim da etapa da versão 80 não encontrado."
              )

          end = workflow.index(
              end_marker,
              start
          )

          block = workflow[start:end]

          marker = "        run: |\n"

          if marker not in block:
              raise RuntimeError(
                  "Bloco run da versão 80 não encontrado."
              )

          pos = block.index(marker) + len(marker)

          lines = block[pos:].splitlines()

          script_lines = []

          for line in lines:
              if line.startswith("          "):
                  script_lines.append(line[10:])
              else:
                  script_lines.append(line)

          script = "\n".join(
              script_lines
          ).rstrip() + "\n"

          temp_file = (
              Path(tempfile.gettempdir())
              / "funcionalidades_v80.py"
          )

          temp_file.write_text(
              script,
              encoding="utf-8"
          )

          print("Validando script da versão 80...")

          subprocess.run(
              ["python", str(temp_file)],
              check=True
          )

          print("========================================")
          print("VERSÃO 80 APLICADA")
          print("========================================")

      - name: Criar som mecânico da roleta
        shell: python
        run: |
          from pathlib import Path
          import wave
          import math
          import struct

          print("========================================")
          print("CRIANDO SOM DA ROLETA")
          print("========================================")

          raw = Path(
              "ControleHoras/"
              "app/src/main/res/raw"
          )

          raw.mkdir(
              parents=True,
              exist_ok=True
          )

          filename = raw / "roller_click.wav"

          rate = 44100
          duration = 0.035
          frames = []

          for i in range(
              int(rate * duration)
          ):
              t = i / rate

              a = (
                  0.45
                  * math.exp(-85 * t)
                  * math.sin(
                      2 * math.pi * 1850 * t
                  )
              )

              b = (
                  0.22
                  * math.exp(-130 * t)
                  * math.sin(
                      2 * math.pi * 3200 * t
                  )
              )

              value = max(
                  -1.0,
                  min(
                      1.0,
                      a + b
                  )
              )

              frames.append(
                  struct.pack(
                      "<h",
                      int(value * 32767)
                  )
              )

          with wave.open(
              str(filename),
              "wb"
          ) as wav:

              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)

              wav.writeframes(
                  b"".join(frames)
              )

          test = filename.exists()

          if not test:
              raise RuntimeError(
                  "Som da roleta não foi criado."
              )

          print("SOM DA ROLETA CRIADO")

      - name: Corrigir tela e instalar roleta personalizada
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile
          import re

          print("========================================")
          print("PREPARANDO ROLETA PERSONALIZADA")
          print("========================================")

          src = Path(
              "ControleHoras/"
              "app/src/main/java/"
              "com/didhuuu/"
              "controlehoras/"
              "MainActivity.kt"
          )

          if not src.exists():
              raise SystemExit(
                  "ERRO: MainActivity.kt não encontrado."
              )

          code = src.read_text(
              encoding="utf-8"
          )

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "39fc6bfb41ebc7b01d6c435a85b5228e735f3f2/"
              ".github/workflows/build.yml"
          )

          print(
              "Baixando implementação original "
              "da roleta..."
          )

          workflow = urlopen(
              url,
              timeout=60
          ).read().decode("utf-8")

          step_name = (
              "      - name: "
              "Corrigir tela e instalar "
              "roleta personalizada"
          )

          if step_name not in workflow:
              raise SystemExit(
                  "ERRO: etapa original da roleta não encontrada."
              )

          start = workflow.index(
              step_name
          )

          end_marker = (
              "      - name: "
              "Validar projeto antes do Gradle"
          )

          if end_marker not in workflow[start:]:
              raise SystemExit(
                  "ERRO: final da etapa da roleta "
                  "não encontrado."
              )

          end = workflow.index(
              end_marker,
              start
          )

          block = workflow[start:end]

          marker = "        run: |\n"

          if marker not in block:
              raise SystemExit(
                  "ERRO: bloco run da roleta "
                  "não encontrado."
              )

          pos = block.index(marker) + len(marker)

          lines = block[pos:].splitlines()

          script_lines = []

          for line in lines:
              if line.startswith("          "):
                  script_lines.append(line[10:])
              else:
                  script_lines.append(line)

          script = (
              "\n".join(script_lines).rstrip()
              + "\n"
          )

          # ==================================================
          # CORREÇÃO DEFINITIVA DO ERRO DO RUN #103
          #
          # O código antigo tinha:
          #
          # main_index=
          #     code.find(
          #
          # Isso gera SyntaxError.
          #
          # A correção abaixo aceita qualquer quantidade
          # de espaços e mantém a indentação original.
          # ==================================================

          script = re.sub(
              r"(?m)^(\s*)main_index\s*=\s*\n"
              r"\s*code\.find\(",
              r"\1main_index = code.find(",
              script
          )

          # ==================================================
          # Também corrige caso existam espaços entre =
          # e a quebra de linha.
          # ==================================================

          script = re.sub(
              r"(?m)^(\s*)main_index\s*=\s*"
              r"\n\s*code\.find\(",
              r"\1main_index = code.find(",
              script
          )

          # ==================================================
          # Remove o bloco antigo que bloqueava a edição
          # de batida vazia.
          # ==================================================

          old_empty_start = script.find(
              "# PERMITIR EDITAR BATIDA VAZIA"
          )

          if old_empty_start >= 0:

              old_empty_end = script.find(
                  "# GARANTIR MANIFESTO",
                  old_empty_start
              )

              if old_empty_end >= 0:

                  script = (
                      script[:old_empty_start]
                      + script[old_empty_end:]
                  )

                  print(
                      "BLOCO ANTIGO DE BATIDA VAZIA "
                      "REMOVIDO"
                  )

          # ==================================================
          # A versão antiga procura showEditWheel antes de
          # executar a substituição.
          #
          # Garantimos que ele exista primeiro.
          # ==================================================

          if "private fun showEditWheel(" not in code:

              print(
                  "showEditWheel não encontrada."
              )

              anchor = code.find(
                  "    private fun showManualWheel("
              )

              if anchor < 0:
                  raise SystemExit(
                      "ERRO: showManualWheel não encontrada "
                      "para inserir showEditWheel."
                  )

              edit_method = "\n".join([
                  "    private fun showEditWheel(",
                  "        rec:PunchDay,",
                  "        index:Int",
                  "    ){",
                  "        val old=rec.punches[index]",
                  "        val parts=old.split(\":\")",
                  "        val now=Calendar.getInstance()",
                  "        val hour=if(parts.size==2)",
                  "            parts[0].toIntOrNull() ?: now.get(Calendar.HOUR_OF_DAY)",
                  "        else now.get(Calendar.HOUR_OF_DAY)",
                  "        val minute=if(parts.size==2)",
                  "            parts[1].toIntOrNull() ?: now.get(Calendar.MINUTE)",
                  "        else now.get(Calendar.MINUTE)",
                  "        showControleHorasWheelDialog(",
                  "            \"Editar registro\",",
                  "            df.format(parseIso(rec.date)),",
                  "            hour,",
                  "            minute",
                  "        ){value->",
                  "            rec.punches[index]=value",
                  "            saveData()",
                  "            showPunch()",
                  "        }",
                  "    }",
                  ""
              ])

              code = (
                  code[:anchor]
                  + edit_method
                  + code[anchor:]
              )

              src.write_text(
                  code,
                  encoding="utf-8"
              )

              code = src.read_text(
                  encoding="utf-8"
              )

              print(
                  "showEditWheel GARANTIDO"
              )

          # ==================================================
          # Corrige validação antiga da roleta.
          # ==================================================

          script = script.replace(
              'if "showControleHorasWheelDialog(" not in code:',
              'if "private fun showControleHorasWheelDialog(" not in code:'
          )

          script = re.sub(
              r'if\s+"showControleHorasWheelDialog\("\s+'
              r'not\s+in\s+code:',
              'if "private fun showControleHorasWheelDialog(" not in code:',
              script
          )

          # Remove entradas antigas da lista de validação
          # para não provocar falso erro.
          script = re.sub(
              r'(?m)^\s*"showControleHorasWheelDialog",\s*$',
              "",
              script
          )

          script = re.sub(
              r'(?m)^\s*"showEditWheel",\s*$',
              "",
              script
          )

          # ==================================================
          # IMPORTANTE:
          # compila o Python antes de executar.
          # Assim, se houver erro, o Actions para aqui
          # mostrando a linha real.
          # ==================================================

          print(
              "VALIDANDO SINTAXE PYTHON DA ROLETA..."
          )

          compile(
              script,
              "corrigir_roleta.py",
              "exec"
          )

          print(
              "SINTAXE PYTHON DA ROLETA OK"
          )

          temp_script = (
              Path(tempfile.gettempdir())
              / "corrigir_roleta.py"
          )

          temp_script.write_text(
              script,
              encoding="utf-8"
          )

          print(
              "EXECUTANDO TRANSFORMAÇÃO DA ROLETA..."
          )

          subprocess.run(
              ["python", str(temp_script)],
              check=True
          )

          code = src.read_text(
              encoding="utf-8"
          )

          # ==================================================
          # VALIDAÇÕES FINAIS
          # ==================================================

          required = [
              "ControleHorasTimeWheelView",
              "showControleHorasWheelDialog",
              "showManualWheel",
              "showEditWheel",
              "punchNames",
              "controleHorasPunchPage",
              "extra2Enabled",
              "nextPunchIndex"
          ]

          for item in required:

              if item not in code:

                  raise SystemExit(
                      "ERRO FINAL: recurso não encontrado: "
                      + item
                  )

          if "NumberPicker(" in code:

              raise SystemExit(
                  "ERRO FINAL: NumberPicker ainda presente."
              )

          if (
              "Esse registro ainda está vazio"
              in code
          ):

              raise SystemExit(
                  "ERRO FINAL: mensagem antiga "
                  "de registro vazio ainda presente."
              )

          print(
              "TODOS OS RECURSOS DA ROLETA PRESENTES"
          )

          # ==================================================
          # MANIFESTO
          # ==================================================

          manifest = Path(
              "ControleHoras/"
              "app/src/main/AndroidManifest.xml"
          )

          if manifest.exists():

              m = manifest.read_text(
                  encoding="utf-8"
              )

              if (
                  'android:icon=' not in m
                  and 'android:roundIcon=' not in m
              ):

                  m = m.replace(
                      "<application",
                      '<application\n'
                      '        android:icon="@drawable/controlehoras_icon"\n'
                      '        android:roundIcon="@drawable/controlehoras_icon"',
                      1
                  )

                  manifest.write_text(
                      m,
                      encoding="utf-8"
                  )

                  print(
                      "Ícone configurado no Manifest."
                  )

          print("========================================")
          print("ROLETA INSTALADA COM SUCESSO")
          print("EDIÇÃO MANUAL PRESERVADA")
          print("ESCALA DA BASE 70 PRESERVADA")
          print("========================================")

      - name: Validar projeto antes do Gradle
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VALIDAÇÃO FINAL DO CÓDIGO"
          echo "========================================"

          SRC="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          test -s "$SRC"

          grep -q \
            "ControleHorasTimeWheelView" \
            "$SRC"

          grep -q \
            "showControleHorasWheelDialog" \
            "$SRC"

          grep -q \
            "showManualWheel" \
            "$SRC"

          grep -q \
            "showEditWheel" \
            "$SRC"

          grep -q \
            "controleHorasPunchPage" \
            "$SRC"

          grep -q \
            "punchNames" \
            "$SRC"

          grep -q \
            "extra2Enabled" \
            "$SRC"

          grep -q \
            "nextPunchIndex" \
            "$SRC"

          if grep -q \
            "NumberPicker(" \
            "$SRC"; then

            echo "ERRO: NumberPicker encontrado."

            exit 1
          fi

          if grep -q \
            "Esse registro ainda está vazio" \
            "$SRC"; then

            echo "ERRO: bloqueio antigo encontrado."

            exit 1
          fi

          test -s \
            "ControleHoras/app/src/main/res/raw/roller_click.wav"

          grep -q \
            "controlehoras_icon" \
            "ControleHoras/app/src/main/AndroidManifest.xml" \
            || true

          echo "========================================"
          echo "VALIDAÇÃO FINAL OK"
          echo "========================================"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INSTALANDO GRADLE 8.11.1"
          echo "========================================"

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "LIMPANDO PROJETO"
          echo "========================================"

          gradle clean \
            --no-daemon \
            --stacktrace

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GERANDO APK"
          echo "========================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then

            echo "ERRO: APK não foi gerado."

            exit 1
          fi

          ls -lh "$APK"

          echo "========================================"
          echo "APK GERADO COM SUCESSO"
          echo "========================================"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "========================================"
          echo "APK VALIDADO"
          echo "========================================"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
