name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml

          echo "BASE DO PROJETO OK"

      - name: Aplicar MainActivity corrigida
        shell: python
        run: |
          from pathlib import Path
          import base64
          import gzip

          root = Path("ControleHoras")

          main = root / "app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          manifest = root / "app/src/main/AndroidManifest.xml"
          xml_dir = root / "app/src/main/res/xml"

          xml_dir.mkdir(parents=True, exist_ok=True)

          # MainActivity completa corrigida.
          # Não usa variável de ambiente e não depende de MAIN_B64.
          DATA = """"""

          source = gzip.decompress(base64.b64decode(DATA)).decode("utf-8")

          main.write_text(source, encoding="utf-8")

          manifest_text = manifest.read_text(encoding="utf-8")

          provider = '''
        <provider
            android:name="androidx.core.content.FileProvider"
            android:authorities="${applicationId}.fileprovider"
            android:exported="false"
            android:grantUriPermissions="true">
            <meta-data
                android:name="android.support.FILE_PROVIDER_PATHS"
                android:resource="@xml/paths" />
        </provider>
          '''

          if "${applicationId}.fileprovider" not in manifest_text:
              manifest_text = manifest_text.replace(
                  "</application>",
                  provider + "\n    </application>"
              )
              manifest.write_text(manifest_text, encoding="utf-8")

          paths = '''<?xml version="1.0" encoding="utf-8"?>
        <paths xmlns:android="http://schemas.android.com/apk/res/android">
            <cache-path name="cache" path="." />
        </paths>
          '''

          (xml_dir / "paths.xml").write_text(paths, encoding="utf-8")
          (xml_dir / "file_paths.xml").write_text(paths, encoding="utf-8")

          # Validação antes de chegar no Gradle.
          if not main.exists():
              raise SystemExit("ERRO: MainActivity.kt não foi criada")

          s = main.read_text(encoding="utf-8")

          required = [
              "selectedPunchDate",
              "choosePunchDate",
              "normalizeTime",
              "weekModes",
              "HE 60%",
              "HE 100%",
              "DSR sobre horas extras",
              "FileProvider"
          ]

          for item in required:
              if item not in s:
                  raise SystemExit("FALTANDO NO CÓDIGO: " + item)

          if s.count("{") != s.count("}"):
              raise SystemExit("ERRO: quantidade de chaves Kotlin incompatível")

          print("======================================")
          print("MAINACTIVITY CORRIGIDA")
          print("Linhas:", len(s.splitlines()))
          print("Bytes:", len(s.encode("utf-8")))
          print("VALIDAÇÃO DO CÓDIGO OK")
          print("======================================")

      - name: Validar projeto
        shell: bash
        run: |
          set -e

          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt
          test -f ControleHoras/app/src/main/res/xml/paths.xml
          test -f ControleHoras/app/src/main/res/xml/file_paths.xml

          grep -q "selectedPunchDate" ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt
          grep -q "normalizeTime" ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt
          grep -q "weekModes" ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt
          grep -q "DSR sobre horas extras" ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt
          grep -q "FileProvider" ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "VALIDAÇÃO DOS ARQUIVOS OK"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e
          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "======================================"
          echo "APK GERADO E VALIDADO"
          ls -lh "$APK"
          echo "======================================"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
