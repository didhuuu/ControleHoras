name: Gerar APK - ControleHoras

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "EXTRAINDO PROJETO"
          echo "================================"

          rm -rf ControleHoras
          unzip -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml

          echo "PROJETO EXTRAIDO"

      # ==========================================================
      # CORREÇÃO COMPLETA DO APLICATIVO
      # ==========================================================
      - name: Corrigir aplicativo
        shell: bash
        run: |
          set -e

          MAIN="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          mkdir -p "$(dirname "$MAIN")"

          cat > "$MAIN" <<'KOTLIN'
package com.didhuuu.controlehoras

import android.app.AlertDialog
import android.os.Bundle
import android.text.Editable
import android.text.InputFilter
import android.text.TextWatcher
import android.view.Gravity
import android.view.View
import android.widget.*
import android.graphics.Color
import android.content.Context
import java.text.SimpleDateFormat
import java.util.*

class MainActivity : android.app.Activity() {

    private data class Registro(
        val id: Long,
        val data: String,
        val entrada: String,
        val saida: String,
        val observacao: String
    )

    private lateinit var listaLayout: LinearLayout
    private lateinit var totalHojeText: TextView
    private lateinit var totalMesText: TextView
    private lateinit var totalGeralText: TextView

    private val registros = mutableListOf<Registro>()

    private val prefs by lazy {
        getSharedPreferences("controle_horas", Context.MODE_PRIVATE)
    }

    private val formatoData = SimpleDateFormat("dd/MM/yyyy", Locale.getDefault())

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        carregarRegistros()
        montarTela()
        atualizarTela()
    }

    // ==========================================================
    // TELA
    // ==========================================================

    private fun montarTela() {

        val raiz = LinearLayout(this)
        raiz.orientation = LinearLayout.VERTICAL
        raiz.setPadding(dp(16), dp(16), dp(16), dp(16))
        raiz.setBackgroundColor(Color.WHITE)

        val scroll = ScrollView(this)

        val conteudo = LinearLayout(this)
        conteudo.orientation = LinearLayout.VERTICAL

        val titulo = TextView(this)
        titulo.text = "CONTROLE DE HORAS"
        titulo.textSize = 25f
        titulo.setTextColor(Color.BLACK)
        titulo.gravity = Gravity.CENTER
        titulo.setPadding(0, 0, 0, dp(16))

        conteudo.addView(
            titulo,
            LinearLayout.LayoutParams(
                -1,
                LinearLayout.LayoutParams.WRAP_CONTENT
            )
        )

        // ======================================================
        // RESUMO
        // ======================================================

        totalHojeText = criarResumo("TOTAL HOJE")
        totalMesText = criarResumo("TOTAL DO MÊS")
        totalGeralText = criarResumo("TOTAL GERAL")

        conteudo.addView(totalHojeText)
        conteudo.addView(totalMesText)
        conteudo.addView(totalGeralText)

        // ======================================================
        // BOTÕES
        // ======================================================

        val registroBtn = Button(this)
        registroBtn.text = "REGISTRAR AGORA"
        registroBtn.textSize = 16f
        registroBtn.setOnClickListener {
            registrarAgora()
        }

        conteudo.addView(
            registroBtn,
            LinearLayout.LayoutParams(
                -1,
                dp(55)
            ).apply {
                bottomMargin = dp(8)
            }
        )

        val manualBtn = Button(this)
        manualBtn.text = "ADICIONAR MANUALMENTE"
        manualBtn.textSize = 16f
        manualBtn.setOnClickListener {
            abrirAdicaoManual()
        }

        conteudo.addView(
            manualBtn,
            LinearLayout.LayoutParams(
                -1,
                dp(55)
            ).apply {
                bottomMargin = dp(8)
            }
        )

        val somarBtn = Button(this)
        somarBtn.text = "ADICIONAR HORAS AO SOMATÓRIO"
        somarBtn.textSize = 16f
        somarBtn.setOnClickListener {
            abrirAdicaoHoras()
        }

        conteudo.addView(
            somarBtn,
            LinearLayout.LayoutParams(
                -1,
                dp(55)
            ).apply {
                bottomMargin = dp(16)
            }
        )

        // ======================================================
        // LISTA
        // ======================================================

        val listaTitulo = TextView(this)
        listaTitulo.text = "REGISTROS"
        listaTitulo.textSize = 20f
        listaTitulo.setTextColor(Color.BLACK)
        listaTitulo.setPadding(0, dp(8), 0, dp(8))

        conteudo.addView(listaTitulo)

        listaLayout = LinearLayout(this)
        listaLayout.orientation = LinearLayout.VERTICAL

        conteudo.addView(
            listaLayout,
            LinearLayout.LayoutParams(
                -1,
                LinearLayout.LayoutParams.WRAP_CONTENT
            )
        )

        scroll.addView(conteudo)

        raiz.addView(
            scroll,
            LinearLayout.LayoutParams(
                -1,
                0,
                1f
            )
        )

        setContentView(raiz)
    }

    private fun criarResumo(titulo: String): TextView {

        val tv = TextView(this)

        tv.text = "$titulo\n00:00"
        tv.textSize = 19f
        tv.setTextColor(Color.BLACK)
        tv.setPadding(dp(14), dp(12), dp(14), dp(12))

        val params = LinearLayout.LayoutParams(
            -1,
            LinearLayout.LayoutParams.WRAP_CONTENT
        )

        params.bottomMargin = dp(8)

        tv.layoutParams = params

        return tv
    }

    // ==========================================================
    // REGISTRO AUTOMÁTICO
    // ==========================================================

    private fun registrarAgora() {

        val agora = SimpleDateFormat(
            "HH:mm",
            Locale.getDefault()
        ).format(Date())

        val hoje = formatoData.format(Date())

        val ultimo = registros
            .filter { it.data == hoje }
            .maxByOrNull { it.id }

        if (ultimo != null && ultimo.saida.isEmpty()) {

            val atualizado = Registro(
                ultimo.id,
                ultimo.data,
                ultimo.entrada,
                agora,
                ultimo.observacao
            )

            val indice = registros.indexOfFirst {
                it.id == ultimo.id
            }

            if (indice >= 0) {
                registros[indice] = atualizado
            }

        } else {

            registros.add(
                Registro(
                    System.currentTimeMillis(),
                    hoje,
                    agora,
                    "",
                    ""
                )
            )
        }

        salvarRegistros()
        atualizarTela()

        Toast.makeText(
            this,
            "Registro realizado: $agora",
            Toast.LENGTH_SHORT
        ).show()
    }

    // ==========================================================
    // ADIÇÃO MANUAL
    // ==========================================================

    private fun abrirAdicaoManual() {

        val layout = LinearLayout(this)
        layout.orientation = LinearLayout.VERTICAL
        layout.setPadding(
            dp(20),
            dp(5),
            dp(20),
            dp(5)
        )

        val data = EditText(this)
        data.hint = "Data: DD/MM/AAAA"
        data.setText(formatoData.format(Date()))
        data.inputType = 2

        val entrada = criarCampoHora("Entrada")

        val saida = criarCampoHora("Saída")

        val observacao = EditText(this)
        observacao.hint = "Observação"
        observacao.inputType = 1

        layout.addView(data)
        layout.addView(entrada)
        layout.addView(saida)
        layout.addView(observacao)

        AlertDialog.Builder(this)
            .setTitle("Adicionar registro")
            .setView(layout)
            .setNegativeButton("CANCELAR", null)
            .setPositiveButton("ADICIONAR") { _, _ ->

                val dataTexto = data.text.toString().trim()
                val entradaTexto = entrada.text.toString().trim()
                val saidaTexto = saida.text.toString().trim()

                if (!validarData(dataTexto)) {
                    Toast.makeText(
                        this,
                        "Data inválida.",
                        Toast.LENGTH_SHORT
                    ).show()
                    return@setPositiveButton
                }

                if (!validarHora(entradaTexto) ||
                    !validarHora(saidaTexto)
                ) {
                    Toast.makeText(
                        this,
                        "Informe os horários no formato 00:00.",
                        Toast.LENGTH_SHORT
                    ).show()
                    return@setPositiveButton
                }

                if (minutos(saidaTexto) <= minutos(entradaTexto)) {
                    Toast.makeText(
                        this,
                        "A saída precisa ser depois da entrada.",
                        Toast.LENGTH_SHORT
                    ).show()
                    return@setPositiveButton
                }

                registros.add(
                    Registro(
                        System.currentTimeMillis(),
                        dataTexto,
                        entradaTexto,
                        saidaTexto,
                        observacao.text.toString()
                    )
                )

                salvarRegistros()
                atualizarTela()

                Toast.makeText(
                    this,
                    "Registro adicionado.",
                    Toast.LENGTH_SHORT
                ).show()
            }
            .show()
    }

    // ==========================================================
    // ADIÇÃO DIRETA AO SOMATÓRIO
    // ==========================================================

    private fun abrirAdicaoHoras() {

        val campo = criarCampoHora("Horas para adicionar")

        val container = LinearLayout(this)
        container.orientation = LinearLayout.VERTICAL
        container.setPadding(dp(20), 0, dp(20), 0)

        container.addView(campo)

        AlertDialog.Builder(this)
            .setTitle("Adicionar horas")
            .setView(container)
            .setNegativeButton("CANCELAR", null)
            .setPositiveButton("ADICIONAR") { _, _ ->

                val valor = campo.text.toString()

                if (!validarHora(valor)) {
                    Toast.makeText(
                        this,
                        "Digite no formato 00:00.",
                        Toast.LENGTH_SHORT
                    ).show()
                    return@setPositiveButton
                }

                val atual = prefs.getInt("ajuste_minutos", 0)

                prefs.edit()
                    .putInt(
                        "ajuste_minutos",
                        atual + minutos(valor)
                    )
                    .apply()

                atualizarTela()

                Toast.makeText(
                    this,
                    "Horas adicionadas ao somatório.",
                    Toast.LENGTH_SHORT
                ).show()
            }
            .show()
    }

    // ==========================================================
    // CAMPO DE HORA COM MÁSCARA 00:00
    // ==========================================================

    private fun criarCampoHora(hint: String): EditText {

        val campo = EditText(this)

        campo.hint = "$hint 00:00"
        campo.textSize = 18f
        campo.gravity = Gravity.CENTER
        campo.inputType = 2
        campo.filters = arrayOf(InputFilter.LengthFilter(5))

        campo.addTextChangedListener(
            object : TextWatcher {

                private var alterando = false

                override fun beforeTextChanged(
                    s: CharSequence?,
                    start: Int,
                    count: Int,
                    after: Int
                ) {}

                override fun onTextChanged(
                    s: CharSequence?,
                    start: Int,
                    before: Int,
                    count: Int
                ) {}

                override fun afterTextChanged(s: Editable?) {

                    if (alterando) return

                    val original = s?.toString() ?: ""

                    val numeros = original
                        .replace(":", "")
                        .filter { it.isDigit() }
                        .take(4)

                    var formatado = numeros

                    if (numeros.length > 2) {
                        formatado =
                            numeros.substring(0, 2) +
                            ":" +
                            numeros.substring(2)
                    }

                    if (formatado != original) {

                        alterando = true

                        campo.setText(formatado)
                        campo.setSelection(formatado.length)

                        alterando = false
                    }
                }
            }
        )

        val params = LinearLayout.LayoutParams(
            -1,
            dp(60)
        )

        params.bottomMargin = dp(8)

        campo.layoutParams = params

        return campo
    }

    // ==========================================================
    // ATUALIZAÇÃO DA TELA
    // ==========================================================

    private fun atualizarTela() {

        if (!::listaLayout.isInitialized) return

        listaLayout.removeAllViews()

        val hoje = formatoData.format(Date())

        val totalHoje =
            registros
                .filter { it.data == hoje }
                .sumOf { duracao(it.entrada, it.saida) }

        val mesAtual =
            SimpleDateFormat(
                "MM/yyyy",
                Locale.getDefault()
            ).format(Date())

        val totalMes =
            registros
                .filter {
                    it.data.endsWith(mesAtual)
                }
                .sumOf {
                    duracao(it.entrada, it.saida)
                }

        val ajuste =
            prefs.getInt("ajuste_minutos", 0)

        val totalGeral =
            registros.sumOf {
                duracao(it.entrada, it.saida)
            } + ajuste

        totalHojeText.text =
            "TOTAL HOJE\n${formatarMinutos(totalHoje)}"

        totalMesText.text =
            "TOTAL DO MÊS\n${formatarMinutos(totalMes)}"

        totalGeralText.text =
            "TOTAL GERAL\n${formatarMinutos(totalGeral)}"

        registros
            .sortedByDescending { it.id }
            .forEach { registro ->

                val item = LinearLayout(this)

                item.orientation = LinearLayout.VERTICAL
                item.setPadding(
                    dp(12),
                    dp(10),
                    dp(12),
                    dp(10)
                )

                val texto = TextView(this)

                val total =
                    duracao(
                        registro.entrada,
                        registro.saida
                    )

                texto.text =
                    buildString {

                        append(registro.data)
                        append("\n")

                        append("Entrada: ")
                        append(
                            if (registro.entrada.isEmpty())
                                "--:--"
                            else
                                registro.entrada
                        )

                        append("   ")

                        append("Saída: ")
                        append(
                            if (registro.saida.isEmpty())
                                "--:--"
                            else
                                registro.saida
                        )

                        append("\n")

                        append("Total: ")
                        append(formatarMinutos(total))

                        if (registro.observacao.isNotBlank()) {
                            append("\n")
                            append(registro.observacao)
                        }
                    }

                texto.textSize = 16f
                texto.setTextColor(Color.BLACK)

                item.addView(
                    texto,
                    LinearLayout.LayoutParams(
                        0,
                        LinearLayout.LayoutParams.WRAP_CONTENT,
                        1f
                    )
                )

                val excluir = Button(this)

                excluir.text = "EXCLUIR"

                excluir.setOnClickListener {

                    AlertDialog.Builder(this)
                        .setTitle("Excluir registro?")
                        .setMessage(
                            "Esse registro será removido."
                        )
                        .setNegativeButton(
                            "CANCELAR",
                            null
                        )
                        .setPositiveButton(
                            "EXCLUIR"
                        ) { _, _ ->

                            registros.removeAll {
                                it.id == registro.id
                            }

                            salvarRegistros()
                            atualizarTela()
                        }
                        .show()
                }

                item.addView(
                    excluir,
                    LinearLayout.LayoutParams(
                        -1,
                        dp(45)
                    )
                )

                listaLayout.addView(
                    item,
                    LinearLayout.LayoutParams(
                        -1,
                        LinearLayout.LayoutParams.WRAP_CONTENT
                    ).apply {
                        bottomMargin = dp(8)
                    }
                )
            }
    }

    // ==========================================================
    // CÁLCULO DE HORAS
    // ==========================================================

    private fun duracao(
        entrada: String,
        saida: String
    ): Int {

        if (!validarHora(entrada) ||
            !validarHora(saida)
        ) {
            return 0
        }

        val inicio = minutos(entrada)
        val fim = minutos(saida)

        if (fim < inicio) {
            return (24 * 60 - inicio) + fim
        }

        return fim - inicio
    }

    private fun minutos(hora: String): Int {

        val partes = hora.split(":")

        if (partes.size != 2) return 0

        val h = partes[0].toIntOrNull() ?: 0
        val m = partes[1].toIntOrNull() ?: 0

        return h * 60 + m
    }

    private fun validarHora(hora: String): Boolean {

        if (!hora.matches(Regex("\\d{2}:\\d{2}"))) {
            return false
        }

        val partes = hora.split(":")

        val h = partes[0].toIntOrNull() ?: return false
        val m = partes[1].toIntOrNull() ?: return false

        return h in 0..23 && m in 0..59
    }

    private fun validarData(data: String): Boolean {

        if (!data.matches(
                Regex("\\d{2}/\\d{2}/\\d{4}")
            )
        ) {
            return false
        }

        return try {

            val sdf = SimpleDateFormat(
                "dd/MM/yyyy",
                Locale.getDefault()
            )

            sdf.isLenient = false
            sdf.parse(data)

            true

        } catch (_: Exception) {
            false
        }
    }

    private fun formatarMinutos(valor: Int): String {

        val positivo = valor >= 0
        val total = kotlin.math.abs(valor)

        val horas = total / 60
        val minutos = total % 60

        val resultado =
            String.format(
                Locale.getDefault(),
                "%02d:%02d",
                horas,
                minutos
            )

        return if (positivo) resultado else "-$resultado"
    }

    // ==========================================================
    // SALVAR
    // ==========================================================

    private fun salvarRegistros() {

        val dados = registros.joinToString("§") {

            listOf(
                it.id,
                it.data,
                it.entrada,
                it.saida,
                it.observacao
                    .replace("§", "")
                    .replace("|", "")
            ).joinToString("|")
        }

        prefs.edit()
            .putString("registros", dados)
            .apply()
    }

    // ==========================================================
    // CARREGAR
    // ==========================================================

    private fun carregarRegistros() {

        registros.clear()

        val dados =
            prefs.getString("registros", "") ?: ""

        if (dados.isBlank()) return

        dados.split("§").forEach { linha ->

            val partes = linha.split("|")

            if (partes.size >= 5) {

                val id =
                    partes[0].toLongOrNull()
                        ?: System.currentTimeMillis()

                registros.add(
                    Registro(
                        id = id,
                        data = partes[1],
                        entrada = partes[2],
                        saida = partes[3],
                        observacao = partes
                            .drop(4)
                            .joinToString("|")
                    )
                )
            }
        }
    }

    // ==========================================================
    // UTIL
    // ==========================================================

    private fun dp(valor: Int): Int {

        return (
            valor *
            resources.displayMetrics.density
        ).toInt()
    }
}
KOTLIN

          echo "================================"
          echo "APLICATIVO CORRIGIDO"
          echo "================================"

          test -s "$MAIN"

          wc -l "$MAIN"

      # ==========================================================
      # GRADLE 8.11.1
      # ==========================================================

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.11.1"

          echo "INSTALANDO GRADLE $GRADLE_VERSION"

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          unzip -q \
            "gradle-${GRADLE_VERSION}-bin.zip"

          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          export PATH="$PWD/gradle-${GRADLE_VERSION}/bin:$PATH"

          gradle --version

      # ==========================================================
      # LIMPAR
      # ==========================================================

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "LIMPANDO PROJETO"

          gradle clean

          echo "LIMPEZA CONCLUIDA"

      # ==========================================================
      # GERAR APK
      # ==========================================================

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "GERANDO APK"
          echo "================================"

          gradle assembleDebug

          echo "VERIFICANDO APK"

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "================================"
          echo "APK GERADO COM SUCESSO"
          echo "================================"

          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # ==========================================================
      # PUBLICAR APK
      # ==========================================================

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Finalizar
        shell: bash
        run: |
          echo "================================"
          echo "BUILD FINALIZADO"
          echo "================================"
          echo "APK: app-debug.apk"
          echo "Artifact: ControleHoras-APK"
          echo "================================"
