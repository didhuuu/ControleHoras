name: ControleHoras APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip
          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt
          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url="https://raw.githubusercontent.com/didhuuu/ControleHoras/6381d26e525e1f9eeb91af17cdb9fed66293c1f2/.github/workflows/build.yml"

          workflow=urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name,next_name):
              start=workflow.index(
                  f"      - name: {name}"
              )

              end=workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block=workflow[start:end]

              marker="        run: |\n"

              pos=block.index(marker)+len(marker)

              lines=block[pos:].splitlines()

              return (
                  "\n".join(
                      line[10:]
                      if line.startswith("          ")
                      else line
                      for line in lines
                  )
                  +"\n"
              )

          scripts=[
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for i,script in enumerate(scripts):

              p=(
                  Path(tempfile.gettempdir())
                  /f"base70_{i}.py"
              )

              p.write_text(
                  script,
                  encoding="utf-8"
              )

              subprocess.run(
                  [
                      "python",
                      str(p)
                  ],
                  check=True
              )

          print(
              "BASE DA VERSÃO 70 APLICADA"
          )

      - name: Aplicar correções finais da Base 70, edição por rolagem e ícone
        shell: python
        run: |
          from pathlib import Path
          import base64

          root=Path("ControleHoras")

          src=(
              root
              /"app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          manifest=(
              root
              /"app/src/main/AndroidManifest.xml"
          )

          code=src.read_text(
              encoding="utf-8"
          )

          if "private val extra2Enabled" not in code:

              anchors=[
                  "    private val weekModes=linkedMapOf<String,String>()\n",
                  "    private val weekModes = linkedMapOf<String,String>()\n"
              ]

              for a in anchors:

                  if a in code:

                      code=code.replace(
                          a,
                          a
                          +"    private val extra2Enabled=mutableSetOf<String>()\n"
                          +"    private val extra2ReturnEnabled=mutableSetOf<String>()\n",
                          1
                      )

                      break

              else:
                  raise SystemExit(
                      "ERRO: weekModes não encontrado"
                  )

          if 'prefs.getString("extra2Enabled"' not in code:

              anchor="        scale.clear()\n"

              if anchor not in code:
                  raise SystemExit(
                      "ERRO: scale.clear não encontrado"
                  )

              block=(
                  "        extra2Enabled.clear()\n"
                  "                  extra2ReturnEnabled.clear()\n"
                  "                  try{\n"
                  "                      val ja=JSONArray(prefs.getString(\"extra2Enabled\",\"[]\") ?: \"[]\")\n"
                  "                      for(i in 0 until ja.length()) extra2Enabled.add(ja.optString(i))\n"
                  "                      val jb=JSONArray(prefs.getString(\"extra2ReturnEnabled\",\"[]\") ?: \"[]\")\n"
                  "                      for(i in 0 until jb.length()) extra2ReturnEnabled.add(jb.optString(i))\n"
                  "                  }catch(_:Exception){}\n"
              )

              code=code.replace(
                  anchor,
                  block+anchor,
                  1
              )

              anchor="        e.apply()\n"

              if anchor not in code:
                  raise SystemExit(
                      "ERRO: e.apply não encontrado"
                  )

              block=(
                  "        val extraJson=JSONArray()\n"
                  "                  extra2Enabled.forEach{extraJson.put(it)}\n"
                  "                  e.putString(\"extra2Enabled\",extraJson.toString())\n"
                  "                  val extraReturnJson=JSONArray()\n"
                  "                  extra2ReturnEnabled.forEach{extraReturnJson.put(it)}\n"
                  "                  e.putString(\"extra2ReturnEnabled\",extraReturnJson.toString())\n"
              )

              code=code.replace(
                  anchor,
                  block+anchor,
                  1
              )

          if "private fun extraKey" not in code:

              anchor="    private fun today()=iso.format(Date())\n"

              if anchor not in code:
                  raise SystemExit(
