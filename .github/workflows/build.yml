name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extrair projeto
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -s ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt
          test -s ControleHoras/app/build.gradle.kts

          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url=(
              "https://raw.githubusercontent.com/didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow=(
              urlopen(
                  url,
                  timeout=30
              )
              .read()
              .decode("utf-8")
          )

          def extract_step(name,next_name):

              start=workflow.index(
                  f"      - name: {name}"
              )

              end=workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block=workflow[start:end]

              marker="        run: |\n"

              pos=(
                  block.index(marker)
                  + len(marker)
              )

              lines=block[pos:].splitlines()

              result=[]

              for line in lines:

                  if line.startswith("          "):
                      result.append(
                          line[10:]
                      )
                  else:
                      result.append(line)

              return "\n".join(result)+"\n"

          scripts=[
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for index,script in enumerate(scripts):

              path=(
                  Path(tempfile.gettempdir())
                  / f"base70_{index}.py"
              )

              path.write_text(
                  script,
                  encoding="utf-8"
              )

              compile(
                  script,
                  str(path),
                  "exec"
              )

              subprocess.run(
                  ["python",str(path)],
                  check=True
              )

          print("BASE 70 APLICADA")

      - name: Preservar icone original
        shell: bash
        run: |
          set -euo pipefail

          cp \
            ControleHoras/app/src/main/AndroidManifest.xml \
            /tmp/ControleHoras-AndroidManifest.xml

      - name: Aplicar funcionalidades da versão 80
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile
          import re

          url=(
              "https://raw.githubusercontent.com/didhuuu/ControleHoras/"
              "39fc6bfb41ebc7b01d6c435a85b5228e735f3f2/"
              ".github/workflows/build.yml"
          )

          workflow=(
              urlopen(
                  url,
                  timeout=30
              )
              .read()
              .decode("utf-8")
          )

          start=workflow.index(
              "      - name: Aplicar funcionalidades da versão 80"
          )

          end=workflow.index(
              "      - name: Aplicar correções finais da Base 70, edição por rolagem e ícone",
              start
          )

          block=workflow[start:end]

          marker="        run: |\n"

          pos=(
              block.index(marker)
              + len(marker)
          )

          lines=block[pos:].splitlines()

          script="\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in lines
          )+"\n"

          def repair_python(source):

              lines=source.splitlines()

              output=[]

              triple=None

              i=0

              while i<len(lines):

                  line=lines[i]

                  if triple is None:

                      match=re.match(
                          r"^(\s*)([A-Za-z_]\w*)\s*=\s*$",
                          line
                      )

                      if match:

                          j=i+1

                          while(
                              j<len(lines)
                              and not lines[j].strip()
                          ):
                              j+=1

                          if j<len(lines):

                              line=(
                                  match.group(1)
                                  +match.group(2)
                                  +"="
                                  +lines[j].lstrip()
                              )

                              i=j

                  output.append(line)

                  for delimiter in (
                      '"""',
                      "'''"
                  ):

                      if line.count(delimiter)%2:

                          if triple is None:
                              triple=delimiter

                          elif triple==delimiter:
                              triple=None

                  i+=1

              return "\n".join(output)+"\n"

          script=repair_python(script)

          path=(
              Path(tempfile.gettempdir())
              / "version80.py"
          )

          path.write_text(
              script,
              encoding="utf-8"
          )

          compile(
              script,
              str(path),
              "exec"
          )

          subprocess.run(
              ["python",str(path)],
              check=True
          )

          print("VERSÃO 80 APLICADA")

      - name: Aplicar roleta azul neon 3D
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile
          import re

          url=(
              "https://raw.githubusercontent.com/didhuuu/ControleHoras/"
              "39fc6bfb41ebc7b01d6c435a85b5228e735f3f2/"
              ".github/workflows/build.yml"
          )

          workflow=(
              urlopen(
                  url,
                  timeout=30
              )
              .read()
              .decode("utf-8")
          )

          start=workflow.index(
              "      - name: Corrigir tela e instalar roleta personalizada"
          )

          end=workflow.index(
              "      - name: Validar projeto antes do Gradle",
              start
          )

          block=workflow[start:end]

          marker="        run: |\n"

          pos=(
              block.index(marker)
              +len(marker)
          )

          lines=block[pos:].splitlines()

          script="\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in lines
          )+"\n"

          def repair_python(source):

              lines=source.splitlines()

              output=[]

              triple=None

              i=0

              while i<len(lines):

                  line=lines[i]

                  if triple is None:

                      match=re.match(
                          r"^(\s*)([A-Za-z_]\w*)\s*=\s*$",
                          line
                      )

                      if match:

                          j=i+1

                          while(
                              j<len(lines)
                              and not lines[j].strip()
                          ):
                              j+=1

                          if j<len(lines):

                              line=(
                                  match.group(1)
                                  +match.group(2)
                                  +"="
                                  +lines[j].lstrip()
                              )

                              i=j

                  output.append(line)

                  for delimiter in (
                      '"""',
                      "'''"
                  ):

                      if line.count(delimiter)%2:

                          if triple is None:
                              triple=delimiter

                          elif triple==delimiter:
                              triple=None

                  i+=1

              return "\n".join(output)+"\n"

          script=repair_python(script)

          path=(
              Path(tempfile.gettempdir())
              / "roleta.py"
          )

          path.write_text(
              script,
              encoding="utf-8"
          )

          compile(
              script,
              str(path),
              "exec"
          )

          subprocess.run(
              ["python",str(path)],
              check=True
          )

          src=Path(
              "ControleHoras/app/src/main/java/"
              "com/didhuuu/controlehoras/MainActivity.kt"
          )

          code=src.read_text(
              encoding="utf-8"
          )

          # ------------------------------------------------------
          # CORREÇÃO DEFINITIVA DO CARD DE FUNCIONÁRIO
          # ------------------------------------------------------

          pattern=re.compile(
              r"box\.addView\(\s*"
              r"card\(\)\.apply\{"
              r"(.*?)"
              r"\},\s*"
              r"0,\s*0,\s*0,\s*"
              r"dp\(10\)\s*"
              r"\)",
              re.DOTALL
          )

          match=pattern.search(code)

          if match:

              inner=match.group(1)

              replacement=(
                  "val employeeCard="
                  "(card() as ViewGroup).apply{"
                  +inner+
                  "}\n\n"
                  "        box.addView(\n"
                  "            employeeCard,\n"
                  "            LinearLayout.LayoutParams(\n"
                  "                -1,\n"
                  "                -2\n"
                  "            ).apply{\n"
                  "                bottomMargin=dp(10)\n"
                  "            }\n"
                  "        )"
              )

              code=(
                  code[:match.start()]
                  +replacement
                  +code[match.end():]
              )

              print(
                  "CARD FUNCIONÁRIO CORRIGIDO"
              )

          else:

              print(
                  "CARD DE FUNCIONÁRIO JÁ ESTÁ CORRETO"
              )

          # ------------------------------------------------------
          # VIEWGROUP
          # ------------------------------------------------------

          if(
              "import android.view.ViewGroup"
              not in code
          ):

              code=code.replace(
                  "import android.view.View\n",
                  "import android.view.View\n"
                  "import android.view.ViewGroup\n",
                  1
              )

          # ------------------------------------------------------
          # ROLETE AZUL / NEON
          # ------------------------------------------------------

          colors={
              "0xFF181818.toInt()":
                  "0xFF031B3A.toInt()",

              "0xFFBFC2C4.toInt()":
                  "0xFF006DFF.toInt()",

              "0xFFF4F4F4.toInt()":
                  "0xFF00B7FF.toInt()",

              "0xFF96999B.toInt()":
                  "0xFF006DFF.toInt()",

              "0xFF151515.toInt()":
                  "0xFF031B3A.toInt()",

              "0xFF707070.toInt()":
                  "0xFF006DFF.toInt()"
          }

          for old,new in colors.items():

              code=code.replace(
                  old,
                  new
              )

          # ------------------------------------------------------
          # RESTAURA ICONE ORIGINAL
          # ------------------------------------------------------

          manifest=Path(
              "ControleHoras/app/src/main/AndroidManifest.xml"
          )

          original=Path(
              "/tmp/ControleHoras-AndroidManifest.xml"
          )

          manifest.write_text(
              original.read_text(
                  encoding="utf-8"
              ),
              encoding="utf-8"
          )

          injected=Path(
              "ControleHoras/app/src/main/res/drawable/"
              "controlehoras_icon.jpg"
          )

          if injected.exists():
              injected.unlink()

          src.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "ROTAÇÃO AZUL NEON 3D APLICADA"
          )

      - name: Criar som mecanico da roleta
        shell: python
        run: |
          from pathlib import Path
          import math
          import struct
          import wave

          output=Path(
              "ControleHoras/app/src/main/res/raw/"
              "roller_click.wav"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          rate=44100
          duration=0.035
          frequency=1450

          frames=[]

          total=int(
              rate*duration
          )

          for i in range(total):

              t=i/rate

              envelope=max(
                  0.0,
                  1.0-t/duration
              )

              value=int(
                  15000
                  *envelope
                  *math.sin(
                      2*math.pi*frequency*t
                  )
              )

              frames.append(
                  struct.pack(
                      "<h",
                      value
                  )
              )

          with wave.open(
              str(output),
              "wb"
          ) as wav:

              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)

              wav.writeframes(
                  b"".join(frames)
              )

          print("SOM DA ROLETA OK")

      - name: Validar estrutura final
        shell: bash
        run: |
          set -euo pipefail

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          test -s "$FILE"

          test -s \
            "ControleHoras/app/src/main/res/raw/roller_click.wav"

          grep -q \
            "ControleHorasTimeWheelView" \
            "$FILE"

          grep -q \
            "showControleHorasWheelDialog" \
            "$FILE"

          grep -q \
            "showManualWheel" \
            "$FILE"

          grep -q \
            "showEditWheel" \
            "$FILE"

          grep -q \
            "extra2Enabled" \
            "$FILE"

          grep -q \
            "nextPunchIndex" \
            "$FILE"

          if grep -q "NumberPicker" "$FILE"; then
            echo "ERRO: NumberPicker antigo ainda presente"
            exit 1
          fi

          if grep -q "Button(context)" "$FILE"; then
            echo "ERRO: Button(context)"
            exit 1
          fi

          if grep -q "0xFFBFC2C4" "$FILE"; then
            echo "ERRO: cor metalica antiga encontrada"
            exit 1
          fi

          if grep -q "0xFFF4F4F4" "$FILE"; then
            echo "ERRO: cor prata antiga encontrada"
            exit 1
          fi

          echo "ESTRUTURA FINAL VALIDADA"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -euo pipefail

          gradle clean \
            --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -euo pipefail

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

          echo "APK GERADO"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
