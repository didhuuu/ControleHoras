name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url=(
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow=urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name,next_name):

              start=workflow.index(
                  f"      - name: {name}"
              )

              end=workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block=workflow[start:end]

              marker="        run: |\n"

              pos=block.index(marker)+len(marker)

              lines=block[pos:].splitlines()

              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in lines
              )+"\n"

          scripts=[
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for i,script in enumerate(scripts):

              p=(
                  Path(tempfile.gettempdir())/
                  f"base70_{i}.py"
              )

              p.write_text(
                  script,
                  encoding="utf-8"
              )

              subprocess.run(
                  ["python",str(p)],
                  check=True
              )

          print("BASE 70 APLICADA")

      - name: Aplicar funcionalidades completas da versão 80
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url=(
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "acc38dd316464293e4d47b10ea3ccf6da7b9454a/"
              ".github/workflows/build.yml"
          )

          workflow=urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name,next_name):

              start=workflow.index(
                  f"      - name: {name}"
              )

              end=workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block=workflow[start:end]

              marker="        run: |\n"

              pos=block.index(marker)+len(marker)

              lines=block[pos:].splitlines()

              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in lines
              )+"\n"

          script=extract_step(
              "Aplicar funcionalidades completas",
              "Corrigir MainActivity definitivamente"
          )

          p=(
              Path(tempfile.gettempdir())/
              "funcionalidades80.py"
          )

          p.write_text(
              script,
              encoding="utf-8"
          )

          subprocess.run(
              ["python",str(p)],
              check=True
          )

          print(
              "FUNCIONALIDADES DA BASE 80 APLICADAS"
          )

      - name: Corrigir MainActivity definitivamente
        shell: python
        run: |
          from pathlib import Path
          import re

          file=Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          code=file.read_text(
              encoding="utf-8"
          )

          if "private val punchNames" not in code:

              names=(
                  "    private val punchNames=arrayOf<String>(\n"
                  "        \"Entrada\",\n"
                  "        \"Saída\",\n"
                  "        \"Retorno\",\n"
                  "        \"Saída intervalo 2\",\n"
                  "        \"Retorno intervalo 2\",\n"
                  "        \"Saída\"\n"
                  "    )\n"
              )

              anchors=[
                  '    private val extra2ReturnEnabled=mutableSetOf<String>()\n',
                  '    private val extra2Enabled=mutableSetOf<String>()\n',
                  '    private val weekModes=linkedMapOf<String,String>()\n',
                  '    private val weekModes = linkedMapOf<String,String>()\n'
              ]

              for anchor in anchors:

                  if anchor in code:

                      code=code.replace(
                          anchor,
                          anchor+names,
                          1
                      )

                      break

              else:

                  raise SystemExit(
                      "ERRO: não foi possível inserir punchNames"
                  )

          pattern=(
              r'\},\s*'
              r'0,\s*'
              r'0,\s*'
              r'0,\s*'
              r'dp\(10\)\s*'
              r'\)\s*'
              r'val dateCard\s*=\s*card\(\)'
          )

          replacement=(
              "},\n"
              "                      LinearLayout.LayoutParams(\n"
              "                          -1,\n"
              "                          -2\n"
              "                      ).apply{\n"
              "                          bottomMargin=dp(10)\n"
              "                      }\n"
              "                  )\n\n"
              "                  val dateCard=card()"
          )

          code,count=re.subn(
              pattern,
              replacement,
              code,
              count=1
          )

          if count==0:

              print(
                  "ADDVIEW já estava corrigido"
              )

          file.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "MAINACTIVITY BASE CORRIGIDA"
          )

      - name: Corrigir rolagem, hora padrão e registros
        shell: python
        run: |
          from pathlib import Path
          import re

          file=Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          code=file.read_text(
              encoding="utf-8"
          )

          # ========================================================
          # RELÓGIO COMPACTO
          # ========================================================

          code=re.sub(
              r'LinearLayout\.LayoutParams\(\s*dp\(88\),\s*dp\(150\)\s*\)',
              'LinearLayout.LayoutParams(dp(72),dp(126))',
              code
          )

          code=re.sub(
              r'LinearLayout\.LayoutParams\(\s*dp\(35\),\s*dp\(150\)\s*\)',
              'LinearLayout.LayoutParams(dp(28),dp(126))',
              code
          )

          # ========================================================
          # DOIS PONTOS PADRÃO
          # ========================================================

          code=re.sub(
              r'(text=":"\s*textSize=)28f',
              r'\g<1>22f',
              code
          )

          # ========================================================
          # ESTILO DAS RODAS
          # ========================================================

          if "private fun styleWheel(picker:NumberPicker)" not in code:

              marker="    private fun showEditWheel("

              helper=(
                  "    private fun styleWheel(picker:NumberPicker){\n"
                  "        picker.setBackgroundColor(Color.TRANSPARENT)\n"
                  "        picker.wrapSelectorWheel=true\n"
                  "        picker.descendantFocusability=NumberPicker.FOCUS_BLOCK_DESCENDANTS\n"
                  "        picker.displayedValues=(picker.minValue..picker.maxValue).map{\n"
                  "            String.format(Locale.US,\"%02d\",it)\n"
                  "        }.toTypedArray()\n"
                  "        picker.post{\n"
                  "            for(i in 0 until picker.childCount){\n"
                  "                val child=picker.getChildAt(i)\n"
                  "                if(child is TextView){\n"
                  "                    child.setTextColor(darkBlue)\n"
                  "                    child.textSize=21f\n"
                  "                    child.gravity=Gravity.CENTER\n"
                  "                    child.setTypeface(null,Typeface.BOLD)\n"
                  "                }\n"
                  "            }\n"
                  "        }\n"
                  "    }\n\n"
              )

              if marker not in code:

                  raise SystemExit(
                      "ERRO: showEditWheel não encontrado"
                  )

              code=code.replace(
                  marker,
                  helper+marker,
                  1
              )

          # ========================================================
          # APLICAR ESTILO NAS DUAS RODAS
          # ========================================================

          pattern=(
              r'(                  val minute=\s*'
              r'NumberPicker\(this\)\.apply\{.*?'
              r'                  \}\n\n)'
              r'(                  val sep=)'
          )

          replacement=(
              r'\1'
              "\n"
              "                  styleWheel(hour)\n"
              "                  styleWheel(minute)\n\n"
              r'\2'
          )

          code,new_count=re.subn(
              pattern,
              replacement,
              code,
              count=2,
              flags=re.S
          )

          if new_count<2:

              raise SystemExit(
                  f"ERRO: esperado 2 blocos de roda, encontrados {new_count}"
              )

          # ========================================================
          # GARANTIR REGISTRO MANUAL
          # ========================================================

          required=[
              "private fun showManualWheel(",
              "private fun showEditWheel(",
              "private fun nextPunchIndex(",
              "private fun calculate(",
              "r.punches[n]=",
              "saveData()"
          ]

          for term in required:

              if term not in code:

                  raise SystemExit(
                      "ERRO: função obrigatória ausente: "+
                      term
                  )

          # ========================================================
          # GARANTIR SOMATÓRIO
          # ========================================================

          totals=[
              "formatMin(calc.worked)",
              "calc.extra60",
              "calc.extra100"
          ]

          for term in totals:

              if term not in code:

                  raise SystemExit(
                      "ERRO: somatório ausente: "+
                      term
                  )

          # ========================================================
          # GARANTIR HH:MM
          # ========================================================

          if '"%02d:%02d".format' not in code:

              raise SystemExit(
                  "ERRO: formato HH:MM não encontrado"
              )

          file.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "ROLAGEM, HORA, REGISTRO MANUAL E SOMATÓRIO VALIDADOS"
          )

      - name: Validar código e ícone
        shell: bash
        run: |
          set -e

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          ICON="ControleHoras/app/src/main/res/drawable/controlehoras_icon.jpg"

          MANIFEST="ControleHoras/app/src/main/AndroidManifest.xml"

          test -s "$FILE"

          test -s "$ICON"

          grep -q 'extra2Enabled' "$FILE"

          grep -q 'extra2ReturnEnabled' "$FILE"

          grep -q 'showManualWheel' "$FILE"

          grep -q 'showEditWheel' "$FILE"

          grep -q 'nextPunchIndex' "$FILE"

          grep -q 'punchNames' "$FILE"

          grep -q 'calculate(' "$FILE"

          grep -q 'formatMin(calc.worked)' "$FILE"

          grep -q 'calc.extra60' "$FILE"

          grep -q 'calc.extra100' "$FILE"

          grep -q '"%02d:%02d".format' "$FILE"

          grep -q 'styleWheel' "$FILE"

          grep -q 'WindowCompat.setDecorFitsSystemWindows' "$FILE"

          grep -q 'controlehoras_icon' "$MANIFEST"

          if grep -q 'Button(context)' "$FILE"; then

              echo "ERRO: Button(context) encontrado"

              exit 1

          fi

          if grep -n "'''" "$GITHUB_WORKSPACE/.github/workflows/build.yml"; then

              echo "ERRO: aspas triplas proibidas encontradas no workflow"

              exit 1

          fi

          echo "VALIDAÇÃO COMPLETA OK"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t \
            "$APK" \
            >/dev/null

          echo "APK VALIDADO COM SUCESSO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
