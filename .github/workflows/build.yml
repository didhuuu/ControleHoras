name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts

          test -f ControleHoras/app/src/main/AndroidManifest.xml

          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          URL = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = (
              urlopen(URL, timeout=30)
              .read()
              .decode("utf-8")
          )

          def extract_step(name, next_name):
              start = workflow.index(
                  f"      - name: {name}"
              )

              end = workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              pos = (
                  block.index(marker)
                  + len(marker)
              )

              lines = block[pos:].splitlines()

              result = []

              for line in lines:
                  if line.startswith("          "):
                      result.append(line[10:])
                  else:
                      result.append(line)

              return "\n".join(result) + "\n"

          scripts = [
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for index, script in enumerate(scripts):

              path = (
                  Path(tempfile.gettempdir())
                  / f"base70_{index}.py"
              )

              path.write_text(
                  script,
                  encoding="utf-8"
              )

              subprocess.run(
                  ["python", str(path)],
                  check=True
              )

          print("BASE 70 APLICADA")

      - name: Aplicar versão com roleta
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile
          import re

          URL = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = (
              urlopen(URL, timeout=30)
              .read()
              .decode("utf-8")
          )

          start_marker = (
              "      - name: "
              "Aplicar correções finais da Base 70, "
              "edição por rolagem e ícone"
          )

          end_marker = (
              "      - name: Validar código e ícone"
          )

          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start)

          block = workflow[start:end]

          marker = "        run: |\n"

          pos = (
              block.index(marker)
              + len(marker)
          )

          lines = block[pos:].splitlines()

          script_lines = []

          for line in lines:

              if line.startswith("          "):
                  script_lines.append(line[10:])
              else:
                  script_lines.append(line)

          script = "\n".join(script_lines) + "\n"

          # Algumas versões antigas desse script possuem
          # atribuições quebradas em duas linhas.
          # Corrigimos somente esse problema de sintaxe Python.

          patterns = [
              r"(?m)^(\s*)([A-Za-z_][A-Za-z0-9_]*)=\s*\n\s+(.+)$",
              r"(?m)^(\s*)([A-Za-z_][A-Za-z0-9_]*)\s*=\s*\n\s+(.+)$",
          ]

          previous = None

          while previous != script:

              previous = script

              for pattern in patterns:

                  script = re.sub(
                      pattern,
                      lambda m:
                          m.group(1)
                          + m.group(2)
                          + "="
                          + m.group(3),
                      script
                  )

          path = (
              Path(tempfile.gettempdir())
              / "roleta_base.py"
          )

          path.write_text(
              script,
              encoding="utf-8"
          )

          # Primeiro valida o Python sem executar.
          compile(
              script,
              str(path),
              "exec"
          )

          subprocess.run(
              ["python", str(path)],
              check=True
          )

          print("ROTAÇÃO BASE APLICADA")

      - name: Corrigir cartão de funcionário
        shell: python
        run: |
          from pathlib import Path

          path = Path(
              "ControleHoras/app/src/main/java/"
              "com/didhuuu/controlehoras/MainActivity.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          # ViewGroup é necessário para o addView interno.
          if "import android.view.ViewGroup" not in text:

              marker = "import android.view.View"

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n"
                      "import android.view.ViewGroup",
                      1
                  )
              else:
                  text = (
                      "import android.view.ViewGroup\n"
                      + text
                  )

          old = """box.addView(
        card().apply{

            val line=
                LinearLayout(context).apply{
                    orientation=
                        LinearLayout.VERTICAL

                    setPadding(
                        dp(16),
                        dp(12),
                        dp(16),
                        dp(12)
                    )
                }

            line.addView(
                label("Funcionário")
            )

            val spinner=
                Spinner(context)

            spinner.adapter=
                ArrayAdapter(
                    context,
                    android.R.layout.simple_spinner_dropdown_item,
                    employees.map{
                        it.name
                    }
                )

            spinner.setSelection(
                employees
                    .indexOfFirst{
                        it.id==
                        selectedEmployeeId
                    }
                    .coerceAtLeast(0)
            )

            spinner.onItemSelectedListener=
                object:
                AdapterView.OnItemSelectedListener{

                    override fun onNothingSelected(
                        p:AdapterView<*>?
                    ){}

                    override fun onItemSelected(
                        p:AdapterView<*>?,
                        v:View?,
                        pos:Int,
                        id:Long
                    ){

                        if(
                            employees[pos].id !=
                            selectedEmployeeId
                        ){

                            selectedEmployeeId=
                                employees[pos].id

                            selectedPunchDate=
                                today()

                            showPunch()
                        }
                    }
                }

            line.addView(spinner)

            line.addView(
                TextView(context).apply{

                    text=
                        "Salário mensal   ${money.format(emp.salary)}"

                    textSize=14f

                    setTextColor(
                        muted
                    )

                    setPadding(
                        0,
                        dp(8),
                        0,
                        0
                    )
                }
            )

            addView(line)

        },
        0,
        0,
        0,
        dp(10)
    )"""

          new = """val employeeCard=
        (card() as ViewGroup).apply{

            val line=
                LinearLayout(context).apply{
                    orientation=
                        LinearLayout.VERTICAL

                    setPadding(
                        dp(16),
                        dp(12),
                        dp(16),
                        dp(12)
                    )
                }

            line.addView(
                label("Funcionário")
            )

            val spinner=
                Spinner(context)

            spinner.adapter=
                ArrayAdapter(
                    context,
                    android.R.layout.simple_spinner_dropdown_item,
                    employees.map{
                        it.name
                    }
                )

            spinner.setSelection(
                employees
                    .indexOfFirst{
                        it.id==
                        selectedEmployeeId
                    }
                    .coerceAtLeast(0)
            )

            spinner.onItemSelectedListener=
                object:
                AdapterView.OnItemSelectedListener{

                    override fun onNothingSelected(
                        p:AdapterView<*>?
                    ){}

                    override fun onItemSelected(
                        p:AdapterView<*>?,
                        v:View?,
                        pos:Int,
                        id:Long
                    ){

                        if(
                            employees[pos].id !=
                            selectedEmployeeId
                        ){

                            selectedEmployeeId=
                                employees[pos].id

                            selectedPunchDate=
                                today()

                            showPunch()
                        }
                    }
                }

            line.addView(spinner)

            line.addView(
                TextView(context).apply{

                    text=
                        "Salário mensal   ${money.format(emp.salary)}"

                    textSize=14f

                    setTextColor(
                        muted
                    )

                    setPadding(
                        0,
                        dp(8),
                        0,
                        0
                    )
                }
            )

            addView(line)
        }

    box.addView(
        employeeCard,
        LinearLayout.LayoutParams(
            -1,
            -2
        ).apply{
            bottomMargin=
                dp(10)
        }
    )"""

          if old in text:
              text = text.replace(
                  old,
                  new,
                  1
              )
              print("CARTÃO CORRIGIDO")
          else:
              print(
                  "CARTÃO ANTIGO NÃO ENCONTRADO; "
                  "mantendo versão atual"
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

      - name: Corrigir aparência azul da roleta
        shell: python
        run: |
          from pathlib import Path

          wheel = Path(
              "ControleHoras/app/src/main/java/"
              "com/didhuuu/controlehoras/TimeWheelView.kt"
          )

          if not wheel.exists():
              print(
                  "TimeWheelView.kt ainda não existe."
              )
          else:

              text = wheel.read_text(
                  encoding="utf-8"
              )

              # Retira aparência metálica/prateada.
              text = text.replace(
                  "0xFF252525",
                  "0xFF031B3A"
              )

              text = text.replace(
                  "0xFFBFC4C8",
                  "0xFF006DFF"
              )

              text = text.replace(
                  "0xFFF0F2F3",
                  "0xFF00B7FF"
              )

              text = text.replace(
                  "0xFF9CA2A7",
                  "0xFF006DFF"
              )

              text = text.replace(
                  "0xFF242424",
                  "0xFF031B3A"
              )

              text = text.replace(
                  "0xFF062A52",
                  "0xFF062A52"
              )

              wheel.write_text(
                  text,
                  encoding="utf-8"
              )

              print(
                  "APARÊNCIA AZUL/NEON APLICADA"
              )

      - name: Remover referências a DSR
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path(
              "ControleHoras/app/src/main/java/"
              "com/didhuuu/controlehoras/MainActivity.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          # Não altera cálculo de horas.
          # Apenas remove linhas que sejam exclusivamente
          # de apresentação/referência ao DSR.
          lines = []

          for line in text.splitlines():

              if re.search(
                  r'(?i)^\s*(?:label|text|println|Log\.)'
                  r'.*DSR',
                  line
              ):
                  continue

              lines.append(line)

          text = "\n".join(lines) + "\n"

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("DSR REMOVIDO DA INTERFACE")

      - name: Validar estrutura final
        shell: bash
        run: |
          set -euo pipefail

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          test -s "$FILE"

          echo "MainActivity encontrada"

          if [ -f "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/TimeWheelView.kt" ]; then
            echo "TimeWheelView encontrada"
          fi

          if grep -q "NumberPicker" "$FILE"; then
            echo "AVISO: ainda existe NumberPicker"
          fi

          if grep -q "Button(context)" "$FILE"; then
            echo "ERRO: Button(context) encontrado"
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          p = Path(
              "ControleHoras/app/src/main/java/"
              "com/didhuuu/controlehoras/MainActivity.kt"
          )

          text = p.read_text(
              encoding="utf-8"
          )

          # Verificação simples de equilíbrio das chaves.
          depth = 0

          for ch in text:
              if ch == "{":
                  depth += 1
              elif ch == "}":
                  depth -= 1

              if depth < 0:
                  raise SystemExit(
                      "ERRO: chaves Kotlin desequilibradas"
                  )

          if depth != 0:
              raise SystemExit(
                  f"ERRO: chaves Kotlin desequilibradas: {depth}"
              )

          print(
              "ESTRUTURA KOTLIN OK"
          )
          PY

          echo "VALIDAÇÃO FINAL OK"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -euo pipefail

          gradle clean \
            --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -euo pipefail

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

          echo "APK GERADO"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
