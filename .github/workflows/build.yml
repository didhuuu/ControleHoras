name: ControleHoras - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1 - BAIXAR O REPOSITÓRIO
      # ============================================================
      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # 2 - JAVA 17
      # ============================================================
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3 - EXTRAIR O ZIP ORIGINAL
      # ============================================================
      - name: Extrair ControleHoras.zip
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          echo "Projeto extraído."

          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "Estrutura do projeto OK."

      # ============================================================
      # 4 - CORRIGIR A MAINACTIVITY ORIGINAL
      #
      # NÃO SUBSTITUI A INTERFACE.
      # NÃO CRIA UMA NOVA MAINACTIVITY.
      # ALTERA SOMENTE OS TRECHOS NECESSÁRIOS.
      # ============================================================
      - name: Corrigir MainActivity original
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          arquivo = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          if not arquivo.exists():
              raise SystemExit(
                  "ERRO: MainActivity.kt não foi encontrada."
              )

          codigo = arquivo.read_text(encoding="utf-8")

          print("========================================")
          print("MAINACTIVITY ORIGINAL")
          print("========================================")
          print("Linhas originais:", len(codigo.splitlines()))
          print("Bytes:", len(codigo.encode("utf-8")))

          # --------------------------------------------------------
          # CORREÇÃO 1
          # Salário:
          #
          # ORIGINAL:
          # setText(if(existing!=null)existing.salary.toString():"")
          #
          # CORRETO:
          # setText(if(existing!=null)existing.salary.toString() else "")
          # --------------------------------------------------------

          original = (
              'setText(if(existing!=null)existing.salary.toString():"")'
          )

          correto = (
              'setText(if(existing!=null)existing.salary.toString() else "")'
          )

          if original not in codigo:
              raise SystemExit(
                  "ERRO: trecho do salário não encontrado."
              )

          codigo = codigo.replace(
              original,
              correto,
              1
          )

          print("OK: salário corrigido.")

          # --------------------------------------------------------
          # CORREÇÃO 2
          # setTextColor(text)
          #
          # Dentro do TextView.apply, "text" pode ser a propriedade
          # do próprio TextView.
          #
          # Usamos explicitamente a variável da MainActivity.
          # --------------------------------------------------------

          quantidade = codigo.count("setTextColor(text)")

          if quantidade > 0:
              codigo = codigo.replace(
                  "setTextColor(text)",
                  "setTextColor(this@MainActivity.text)"
              )

          print(
              "OK: setTextColor corrigido:",
              quantidade,
              "ocorrência(s)."
          )

          # --------------------------------------------------------
          # CORREÇÃO 3
          #
          # Alguns addView antigos usam quatro números depois da View.
          # A forma mais segura é usar LayoutParams.
          # --------------------------------------------------------

          codigo = codigo.replace(
              "addView(card().apply {",
              "addView(card().apply {",
              1
          )

          # --------------------------------------------------------
          # CORREÇÃO 4
          # Histórico mensal.
          #
          # Os registros são gravados como:
          # yyyy-MM-dd
          #
          # Portanto o filtro mensal deve usar:
          # yyyy-MM
          # --------------------------------------------------------

          antigo_historico = (
              'it.date.endsWith('
              'SimpleDateFormat("MM-yyyy", Locale.US).format(Date())'
              ')'
          )

          novo_historico = (
              'it.date.startsWith('
              'SimpleDateFormat("yyyy-MM", Locale.US).format(Date())'
              ')'
          )

          if antigo_historico in codigo:
              codigo = codigo.replace(
                  antigo_historico,
                  novo_historico
              )
              print("OK: histórico mensal corrigido.")
          else:
              print(
                  "AVISO: filtro antigo do histórico não encontrado."
              )

          # --------------------------------------------------------
          # CORREÇÃO 5
          # Função normalizeTime
          #
          # Aceita:
          # 0800
          # 08:00
          # 8:00
          #
          # E devolve sempre:
          # 08:00
          # --------------------------------------------------------

          marcador = (
              '    private fun getRecord(empId:Long,date:String):PunchDay{'
          )

          if marcador not in codigo:
              raise SystemExit(
                  "ERRO: função getRecord não encontrada."
              )

          if "private fun normalizeTime(" not in codigo:

              helpers = r'''    private fun normalizeTime(value:String):String{
              val digits=value.filter{it.isDigit()}.take(4)

              if(digits.length!=4)return ""

              val hour=digits.substring(0,2).toIntOrNull()?:return ""
              val minute=digits.substring(2,4).toIntOrNull()?:return ""

              if(hour !in 0..23)return ""
              if(minute !in 0..59)return ""

              return "%02d:%02d".format(
                  Locale.US,
                  hour,
                  minute
              )
          }

          private fun timeEdit(
              initial:String="",
              hintText:String="00:00"
          ):EditText{

              val e=EditText(this).apply{
                  hint=hintText
                  inputType=2
                  setSingleLine()

                  val normalized=normalizeTime(initial)

                  if(normalized.isNotEmpty()){
                      setText(normalized)
                  }
              }

              var changing=false

              e.addTextChangedListener(
                  object:android.text.TextWatcher{

                      override fun beforeTextChanged(
                          s:CharSequence?,
                          start:Int,
                          count:Int,
                          after:Int
                      ){}

                      override fun onTextChanged(
                          s:CharSequence?,
                          start:Int,
                          before:Int,
                          count:Int
                      ){}

                      override fun afterTextChanged(
                          editable:android.text.Editable?
                      ){

                          if(changing)return

                          val digits=
                              editable
                                  ?.toString()
                                  ?.filter{it.isDigit()}
                                  ?.take(4)
                                  .orEmpty()

                          val formatted=when{
                              digits.isEmpty()->""

                              digits.length<=2->
                                  digits

                              else->
                                  digits.substring(0,2)+":"+
                                  digits.substring(2)
                          }

                          if(
                              formatted!=editable?.toString()
                          ){

                              changing=true

                              e.setText(formatted)

                              e.setSelection(
                                  e.text.length
                              )

                              changing=false
                          }
                      }
                  }
              )

              e.setOnFocusChangeListener{_,hasFocus->

                  if(!hasFocus){

                      val normalized=
                          normalizeTime(
                              e.text.toString()
                          )

                      if(normalized.isNotEmpty()){

                          e.setText(normalized)

                          e.setSelection(
                              e.text.length
                          )
                      }
                  }
              }

              return e
          }

          '''

              codigo = codigo.replace(
                  marcador,
                  helpers + marcador,
                  1
              )

              print("OK: funções de horário adicionadas.")

          else:
              print(
                  "OK: funções de horário já existem."
              )

          # --------------------------------------------------------
          # CORREÇÃO 6
          # EDIÇÃO MANUAL DO PONTO
          # --------------------------------------------------------

          antigo = (
              'val e=EditText(this).apply'
              '{setText(r.punches[index]);'
              'hint="HH:mm";inputType=2;setSingleLine()}'
          )

          novo = (
              'val e=timeEdit('
              'r.punches[index],'
              'punchNames[index]'
              ')'
          )

          if antigo in codigo:

              codigo = codigo.replace(
                  antigo,
                  novo,
                  1
              )

              print(
                  "OK: edição manual de horário corrigida."
              )

          else:
              print(
                  "AVISO: campo antigo de edição manual "
                  "não encontrado."
              )

          # --------------------------------------------------------
          # CORREÇÃO 7
          # SALVAR PONTO MANUAL
          # --------------------------------------------------------

          antigo = (
              'r.punches[index]=e.text.toString();'
              'saveData();showPunch()'
          )

          novo = (
              'r.punches[index]='
              'normalizeTime(e.text.toString());'
              'saveData();showPunch()'
          )

          if antigo in codigo:

              codigo = codigo.replace(
                  antigo,
                  novo,
                  1
              )

              print(
                  "OK: salvamento manual corrigido."
              )

          # --------------------------------------------------------
          # CORREÇÃO 8
          # EDIÇÃO DO REGISTRO COMPLETO
          # --------------------------------------------------------

          antigo = (
              'val fields=r.punches.mapIndexed'
              '{i,v->EditText(this).apply'
              '{hint=punchNames[i];setText(v);'
              'inputType=2;setSingleLine();}}'
          )

          novo = (
              'val fields=r.punches.mapIndexed'
              '{i,v->timeEdit(v,punchNames[i])}'
          )

          if antigo in codigo:

              codigo = codigo.replace(
                  antigo,
                  novo,
                  1
              )

              print(
                  "OK: edição do histórico corrigida."
              )

          # --------------------------------------------------------
          # CORREÇÃO 9
          # SALVAR REGISTRO COMPLETO
          # --------------------------------------------------------

          antigo = (
              'fields.forEachIndexed'
              '{i,e->r.punches[i]=e.text.toString()};'
              'saveData();showHistory()'
          )

          novo = (
              'fields.forEachIndexed'
              '{i,e->'
              'r.punches[i]=normalizeTime(e.text.toString())'
              '};saveData();showHistory()'
          )

          if antigo in codigo:

              codigo = codigo.replace(
                  antigo,
                  novo,
                  1
              )

              print(
                  "OK: salvamento do histórico corrigido."
              )

          # --------------------------------------------------------
          # CORREÇÃO 10
          # HORÁRIOS DA ESCALA
          # --------------------------------------------------------

          antigo = (
              'val ed=EditText(this).apply'
              '{setText(p.second);hint="00:00";'
              'gravity=Gravity.CENTER;inputType=2;'
              'setSingleLine()}'
          )

          novo = (
              'val ed=timeEdit('
              'p.second,'
              '"00:00"'
              ').apply{'
              'gravity=Gravity.CENTER'
              '}'
          )

          if antigo in codigo:

              codigo = codigo.replace(
                  antigo,
                  novo,
                  1
              )

              print(
                  "OK: escala usando campo de horário automático."
              )

          # --------------------------------------------------------
          # CORREÇÃO 11
          # SALVAMENTO DOS HORÁRIOS DA ESCALA
          # --------------------------------------------------------

          antigo = (
              '0->s.e=ed.text.toString();'
              '1->s.x1=ed.text.toString();'
              '2->s.r1=ed.text.toString();'
              '3->s.x2=ed.text.toString()'
          )

          novo = (
              '0->s.e=normalizeTime(ed.text.toString());'
              '1->s.x1=normalizeTime(ed.text.toString());'
              '2->s.r1=normalizeTime(ed.text.toString());'
              '3->s.x2=normalizeTime(ed.text.toString())'
          )

          if antigo in codigo:

              codigo = codigo.replace(
                  antigo,
                  novo,
                  1
              )

              print(
                  "OK: salvamento da escala corrigido."
              )

          # --------------------------------------------------------
          # CORREÇÃO 12
          # MINUTES BETWEEN
          #
          # Usa os horários normalizados.
          # --------------------------------------------------------

          inicio = codigo.find(
              '    private fun minutesBetween(a:String,b:String):Int{'
          )

          fim = codigo.find(
              '    private fun formatMin(m:Int):String=',
              inicio
          )

          if inicio == -1:
              raise SystemExit(
                  "ERRO: minutesBetween não encontrada."
              )

          if fim == -1:
              raise SystemExit(
                  "ERRO: formatMin não encontrada."
              )

          minutes_between = r'''    private fun minutesBetween(a:String,b:String):Int{

             
