                  val k=extraKey(empId,date)

                  if(
                      value &&
                      extra2Enabled.contains(k)
                  )
                      extra2ReturnEnabled.add(k)
                  else
                      extra2ReturnEnabled.remove(k)

                  saveData()
              }

