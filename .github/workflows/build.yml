          """

          code = (
              code[:start] +
              show +
              code[end:]
          )

          # ============================================================
          # CÁLCULO
          # ============================================================

          cstart = code.find(
              "    private fun calculate(r:PunchDay):Calc{"
          )

          cend = code.find(
              "    private fun minutesBetween",
              cstart
          )

          if cstart < 0 or cend < 0:
              raise SystemExit(
                  "ERRO: calculate não encontrado"
              )

          calc = """    private fun calculate(
                  r:PunchDay
              ):Calc{

                  var worked=
                      minutesBetween(
                          r.punches[0],
                          r.punches[1]
                      )+
                      minutesBetween(
                          r.punches[2],
                          r.punches[5]
                      )

                  val extra2=
                      r.punches[3].isNotBlank()||
                      r.punches[4].isNotBlank()

                  if(extra2){

                      worked=
                          minutesBetween(
                              r.punches[0],
                              r.punches[1]
                          )+
                          minutesBetween(
                              r.punches[2],
                              r.punches[3]
                          )+
                          minutesBetween(
                              r.punches[4],
                              r.punches[5]
                          )
                  }

                  val date=
                      parseIso(r.date)

                  if(!modeForDay(date))
                      return Calc(
                          worked,
                          0,
                          0,
                          worked
                      )

                  val expected=
                      durationMinutes(
                          weeklyTarget
                      )/
                      (
                          if(
                              modeForDate(date)=="MS"
                          )
                              6
                          else
                              5
                      )

                  val extra=
                      max(
                          0,
                          worked-expected
                      )

                  return Calc(
                      worked,
                      expected,
                      extra,
                      0
                  )
              }

          """

          code = (
              code[:cstart] +
              calc +
              code[cend:]
          )

          # ============================================================
          # IMPORTS PARA SISTEMA / INSETS
          # ============================================================

          imports = (
              "import androidx.core.view.WindowCompat\n"
              "import androidx.core.view.ViewCompat\n"
              "import androidx.core.view.WindowInsetsCompat\n"
          )

          if (
              "import androidx.core.view.WindowCompat"
              not in code
          ):

              code = code.replace(
                  "import androidx.core.content.FileProvider\n",
                  "import androidx.core.content.FileProvider\n" +
                  imports,
                  1
              )

          # ============================================================
          # SISTEMA DE BARRAS / ÁREA SEGURA
          # ============================================================

          if (
              "WindowCompat.setDecorFitsSystemWindows(window,false)"
              not in code
          ):

              anchor = "        buildShell()\n"

              if anchor not in code:
                  raise SystemExit(
                      "ERRO: buildShell não encontrado"
                  )

              inset = """        WindowCompat.setDecorFitsSystemWindows(
                      window,
                      false
                  )

                  window.statusBarColor=blue

                  window.navigationBarColor=
                      Color.WHITE

                  window.decorView.systemUiVisibility=
                      View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR

                  ViewCompat.setOnApplyWindowInsetsListener(
                      root
                  ){v,insets->

                      val bars=
                          insets.getInsets(
                              WindowInsetsCompat.Type.systemBars()
                          )

                      v.setPadding(
                          v.paddingLeft,
                          bars.top,
                          v.paddingRight,
                          bars.bottom
                      )

                      insets
                  }

                  ViewCompat.requestApplyInsets(root)

          """

              code = code.replace(
                  anchor,
                  anchor + inset,
                  1
              )

          # ============================================================
          # ÍCONE DIDHUUU EMBUTIDO
          # ============================================================

          icon_b64 = (
              "/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABIMDRANCxIQDhAUExIVGywdGxgYGzYnKSAsQDlEQz85Pj1HUGZXR0thTT0+WXlaYWltcnNyRVV9"
              ""
          )

          icon = (
              root /
              "app/src/main/res/drawable/controlehoras_icon.jpg"
          )

          icon.write_bytes(
              base64.b64decode(icon_b64)
          )

          # ============================================================
          # MANIFEST
          # ============================================================

          m = manifest.read_text(
              encoding="utf-8"
          )

          if (
              'android:icon="@drawable/controlehoras_icon"'
              not in m
          ):

              m = m.replace(
                  "<application",
                  '<application\n'
                  '        android:icon="@drawable/controlehoras_icon"\n'
                  '        android:roundIcon="@drawable/controlehoras_icon"',
                  1
              )

          manifest.write_text(
              m,
              encoding="utf-8"
          )

          src.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "CORREÇÕES FINAIS APLICADAS"
          )

      - name: Validar código e ícone
        shell: bash
        run: |
          set -e

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          test -s "$FILE"

          test -s \
            "ControleHoras/app/src/main/res/drawable/controlehoras_icon.jpg"

          grep -q \
            'extra2Enabled' \
            "$FILE"

          grep -q \
            'showManualWheel' \
            "$FILE"

          grep -q \
            'showEditWheel' \
            "$FILE"

          grep -q \
            'nextPunchIndex' \
            "$FILE"

          grep -q \
            'WindowCompat.setDecorFitsSystemWindows' \
            "$FILE"

          grep -q \
            'controlehoras_icon' \
            ControleHoras/app/src/main/AndroidManifest.xml

          if grep -q 'Button(context)' "$FILE"; then
            echo "ERRO Button(context)"
            exit 1
          fi

          echo "VALIDAÇÃO OK"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
