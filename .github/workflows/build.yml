              wrap.addView(
                  selected
              )

              val dialog=
                  AlertDialog.Builder(this)
                      .setTitle(title)
                      .setView(wrap)
                      .setNegativeButton(
                          "CANCELAR",
                          null
                      )
                      .setPositiveButton(
                          positive,
                          null
                      )
                      .create()

              dialog.setOnShowListener{

                  dialog.getButton(
                      AlertDialog.BUTTON_POSITIVE
                  ).setOnClickListener{

                      onSave(
                          hour.value,
                          minute.value
                      )

                      dialog.dismiss()
                  }
              }

              dialog.show()
          }

          '''

          code = (
              code[:start]
              + helpers
              + "\n"
              + code[end:]
          )

          wheel.write_text(
              '''package com.didhuuu.controlehoras

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Shader
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.abs

          class TimeWheelView(
              context:Context,
              private val min:Int,
              private val max:Int,
              initial:Int
          ):View(context){

              var value:Int=
                  initial.coerceIn(
                      min,
                      max
                  )
                  private set

              var onValueChanged:
                  ((Int)->Unit)?=null

              private val density=
                  resources
                      .displayMetrics
                      .density

              private fun dp(
                  v:Int
              )=
                  v*density

              private val paint=
                  Paint(
                      Paint.ANTI_ALIAS_FLAG
                  )

              private var lastY=0f

              private var moved=0f

              private val tone=
                  ToneGenerator(
                      AudioManager.STREAM_NOTIFICATION,
                      35
                  )

              init{

                  setBackgroundColor(
                      0x00000000
                  )

                  isClickable=true
              }

              private fun change(
                  delta:Int
              ){

                  var next=
                      value+delta

                  if(next>max)
                      next=min

                  if(next<min)
                      next=max

                  if(next!=value){

                      value=next

                      tone.startTone(
                          ToneGenerator.TONE_PROP_BEEP,
                          35
                      )

                      onValueChanged?.invoke(
                          value
                      )

                      invalidate()
                  }
              }

              override fun onDraw(
                  canvas:Canvas
              ){

                  super.onDraw(
                      canvas
                  )

                  val w=
                      width.toFloat()

                  val h=
                      height.toFloat()

                  val center=
                      h/2f

                  paint.shader=
                      LinearGradient(
                          0f,
                          0f,
                          w,
                          0f,
                          intArrayOf(
                              0xFF031B3A.toInt(),
                              0xFF006DFF.toInt(),
                              0xFF00B7FF.toInt(),
                              0xFF006DFF.toInt(),
                              0xFF031B3A.toInt()
                          ),
                          null,
                          Shader.TileMode.CLAMP
                      )

                  canvas.drawRoundRect(
                      dp(6),
                      dp(3),
                      w-dp(6),
                      h-dp(3),
                      dp(18),
                      dp(18),
                      paint
                  )

                  paint.shader=null

                  paint.style=
                      Paint.Style.FILL

                  paint.color=
                      0xFF062A52.toInt()

                  canvas.drawRoundRect(
                      dp(12),
                      center-dp(34),
                      w-dp(12),
                      center+dp(34),
                      dp(10),
                      dp(10),
                      paint
                  )

                  paint.color=
                      0xFF0867E8.toInt()

                  canvas.drawRoundRect(
                      dp(12),
                      center-dp(34),
                      w-dp(12),
                      center+dp(34),
                      dp(10),
                      dp(10),
                      paint
                  )

                  paint.textAlign=
                      Paint.Align.CENTER

                  for(offset in -2..2){

                      var v=
                          value+offset

                      val range=
                          max-min+1

                      while(v>max)
                          v-=range

                      while(v<min)
                          v+=range

                      paint.textSize=
                          if(offset==0)
                              28f
                          else
                              21f

                      paint.color=
                          if(offset==0)
                              0xFFFFFFFF.toInt()
                          else
                              0xFF20252A.toInt()

                      paint.typeface=
                          android.graphics.Typeface.create(
                              android.graphics.Typeface.DEFAULT,
                              android.graphics.Typeface.BOLD
                          )

                      canvas.drawText(
                          "%02d".format(v),
                          w/2f,
                          center+
                          offset*dp(47)+
                          dp(9),
                          paint
                      )
                  }

                  paint.color=
                      0xFF0875FF.toInt()

                  paint.style=
                      Paint.Style.STROKE

                  paint.strokeWidth=
                      2.5f*density

                  val cy=
                      center

                  canvas.drawLine(
                      dp(3),
                      cy-dp(30),
                      dp(18),
                      cy,
                      paint
                  )

                  canvas.drawLine(
                      dp(3),
                      cy+dp(30),
                      dp(18),
                      cy,
                      paint
                  )

                  canvas.drawLine(
                      w-dp(3),
                      cy-dp(30),
                      w-dp(18),
                      cy,
                      paint
                  )

                  canvas.drawLine(
                      w-dp(3),
                      cy+dp(30),
                      w-dp(18),
                      cy,
                      paint
                  )

                  paint.style=
                      Paint.Style.FILL
              }

              override fun onTouchEvent(
                  event:MotionEvent
              ):Boolean{

                  when(
                      event.actionMasked
                  ){

                      MotionEvent.ACTION_DOWN->{

                          lastY=
                              event.y

                          moved=0f

                          return true
                      }

                      MotionEvent.ACTION_MOVE->{

                          val dy=
                              event.y-lastY

                          moved+=dy

                          if(
                              moved<=-dp(32)
                          ){

                              change(1)

                              moved=0f

                          }else if(
                              moved>=dp(32)
                          ){

                              change(-1)

                              moved=0f
                          }

                          lastY=
                              event.y

                          return true
                      }

                      MotionEvent.ACTION_UP->{

                          if(
                              abs(moved)<dp(10)
                          ){

                              if(
                                  event.y<
                                  height/2f
                              ){

                                  change(1)

                              }else{

                                  change(-1)
                              }
                          }

                          performClick()

                          return true
                      }
                  }

                  return true
              }

              override fun onDetachedFromWindow(){

                  tone.release()

                  super.onDetachedFromWindow()
              }

              override fun performClick():
                  Boolean{

                  super.performClick()

                  return true
              }
          }
          ''',
              encoding="utf-8"
          )

          src.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "RODA AZUL/NEON APLICADA"
          )
          '''
          ]

          for i, code in enumerate(PATCHES):

              path = Path(
                  f"/tmp/final_patch_{i}.py"
              )

              path.write_text(
                  code,
                  encoding="utf-8"
              )

              compile(
                  code,
                  str(path),
                  "exec"
              )

              subprocess.run(
                  [
                      sys.executable,
                      str(path)
                  ],
                  check=True
              )

          print(
              "PATCHES FINAIS APLICADOS"
          )

      - name: Validar estrutura final
        shell: bash
        run: |
          set -euo pipefail

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          WHEEL="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/TimeWheelView.kt"

          test -s "$FILE"
          test -s "$WHEEL"

          grep -q "extra2Enabled" "$FILE"
          grep -q "showManualWheel" "$FILE"
          grep -q "showEditWheel" "$FILE"
          grep -q "showTimeWheelDialog" "$FILE"
          grep -q "TimeWheelView" "$FILE"
          grep -q "nextPunchIndex" "$FILE"
          grep -q "punchNames" "$FILE"
          grep -q "class TimeWheelView" "$WHEEL"

          if grep -q "NumberPicker" "$FILE"; then
            echo "ERRO: NumberPicker antigo ainda presente"
            exit 1
          fi

          if grep -q "DSR" "$FILE"; then
            echo "ERRO: DSR não deve existir nesta versão"
            exit 1
          fi

          if grep -q "Button(context)" "$FILE"; then
            echo "ERRO: Button(context)"
            exit 1
          fi

          echo "ESTRUTURA FINAL VALIDADA"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
