                      orientation=
                          LinearLayout.VERTICAL

                      gravity=
                          Gravity.CENTER_HORIZONTAL

                      setPadding(
                          dp(8),
                          0,
                          dp(8),
                          0
                      )
                  }

              wrap.addView(
                  TextView(this).apply{

                      text=subtitle

                      gravity=
                          Gravity.CENTER

                      textSize=16f

                      setTypeface(
                          null,
                          Typeface.BOLD
                      )

                      setTextColor(
                          darkBlue
