name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto
        shell: bash
        run: |
          set -e
          if [ -f "ControleHoras.zip" ]; then
            mkdir -p /tmp/controlehoras
            unzip -o "ControleHoras.zip" -d /tmp/controlehoras
            if [ -d "/tmp/controlehoras/ControleHoras" ]; then
              cp -a /tmp/controlehoras/ControleHoras/. ControleHoras/
            else
              cp -a /tmp/controlehoras/. ControleHoras/
            fi
          fi

          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/example/controlehoras/MainActivity.kt || \
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt || \
          find ControleHoras/app/src/main/java -name MainActivity.kt -type f | grep -q .

      - name: Reconstruir Base 70
        shell: bash
        run: |
          set -e

          URL="https://raw.githubusercontent.com/didhuuu/ControleHoras/6381d26e525e1f9eeb91af17cdb9fed66293c1f2/.github/workflows/build.yml"

          curl -L --fail "$URL" -o /tmp/base70.yml

          python3 - <<'PY'
          from pathlib import Path
          import re

          base = Path("/tmp/base70.yml").read_text(encoding="utf-8")
          print("Base 70 localizada.")
          print("Tamanho:", len(base), "bytes")

          # A Base 70 já está no projeto enviado.
          # Este passo serve somente para validar que a referência
          # correta da versão 70 existe.
          if "Aplicar versão 36" not in base:
              raise SystemExit("A referência da Base 70 não foi encontrada.")
          PY

      - name: Aplicar correções ControleHoras
        shell: bash
        run: |
          set -e

          MAIN=$(find ControleHoras/app/src/main/java -name MainActivity.kt -type f | head -n 1)

          if [ -z "$MAIN" ]; then
            echo "MainActivity.kt não encontrada."
            exit 1
          fi

          python3 - "$MAIN" <<'PY'
          from pathlib import Path
          import sys
          import re

          path = Path(sys.argv[1])
          s = path.read_text(encoding="utf-8")

          # ------------------------------------------------------------
          # ESTADOS DAS BATIDAS EXTRAS
          # ------------------------------------------------------------

          if "private val extra2Enabled=mutableSetOf<String>()" not in s:
              marker = "private val "
              pos = s.find(marker)
              if pos >= 0:
                  end = s.find("\n", pos)
                  s = s[:end+1] + (
                      "private val extra2Enabled=mutableSetOf<String>()\n"
                      "private val extra2ReturnEnabled=mutableSetOf<String>()\n"
                  ) + s[end+1:]

          # ------------------------------------------------------------
          # FUNÇÕES AUXILIARES
          # ------------------------------------------------------------

          helpers = r'''
          private fun extraKey(empId:Long)=empId.toString()

          private fun extraEnabled(empId:Long)=
              extra2Enabled.contains(extraKey(empId))

          private fun extraReturnEnabled(empId:Long)=
              extra2ReturnEnabled.contains(extraKey(empId))

          private fun setExtraEnabled(empId:Long,value:Boolean){
              val key=extraKey(empId)
              if(value) extra2Enabled.add(key)
              else extra2Enabled.remove(key)
              saveData()
          }

          private fun setExtraReturnEnabled(empId:Long,value:Boolean){
              val key=extraKey(empId)
              if(value) extra2ReturnEnabled.add(key)
              else extra2ReturnEnabled.remove(key)
              saveData()
          }
          '''

          if "private fun extraKey(empId:Long)" not in s:
              candidates=[
                  "private fun saveData()",
                  "private fun loadData()",
                  "private fun showPunch()"
              ]
              inserted=False
              for c in candidates:
                  p=s.find(c)
                  if p>=0:
                      s=s[:p]+helpers+"\n"+s[p:]
                      inserted=True
                      break
              if not inserted:
                  s += "\n"+helpers+"\n"

          # ------------------------------------------------------------
          # ROLAGEM MANUAL DE HORÁRIO
          # ------------------------------------------------------------

          wheel = r'''
          private fun showManualWheel(empId:Long){
              val dialog=AlertDialog.Builder(this).create()
              val box=LinearLayout(this).apply{
                  orientation=LinearLayout.VERTICAL
                  setPadding(dp(24),dp(20),dp(24),dp(12))
              }

              val title=TextView(this).apply{
                  text="Adicionar horário"
                  textSize=20f
                  setPadding(0,0,0,dp(12))
              }
              box.addView(title)

              val wheels=LinearLayout(this).apply{
                  orientation=LinearLayout.HORIZONTAL
                  gravity=Gravity.CENTER
              }

              val hour=NumberPicker(this).apply{
                  minValue=0
                  maxValue=23
                  wrapSelectorWheel=true
              }

              val minute=NumberPicker(this).apply{
                  minValue=0
                  maxValue=59
                  wrapSelectorWheel=true
              }

              val sep=TextView(this).apply{
                  text=":"
                  textSize=28f
                  gravity=Gravity.CENTER
                  setPadding(dp(4),0,dp(4),0)
              }

              wheels.addView(hour)
              wheels.addView(sep)
              wheels.addView(minute)

              box.addView(wheels)

              val buttons=LinearLayout(this).apply{
                  orientation=LinearLayout.HORIZONTAL
                  gravity=Gravity.END
              }

              val cancel=Button(this).apply{
                  text="Cancelar"
              }

              val ok=Button(this).apply{
                  text="Salvar"
              }

              buttons.addView(cancel)
              buttons.addView(ok)
              box.addView(buttons)

              dialog.setView(box)

              cancel.setOnClickListener{
                  dialog.dismiss()
              }

              ok.setOnClickListener{
                  val emp=employees.firstOrNull{it.id==empId}
                  if(emp!=null){
                      val index=nextPunchIndex(emp)

                      while(emp.punches.size<=index){
                          emp.punches.add("")
                      }

                      emp.punches[index]="%02d:%02d".format(
                          Locale.US,
                          hour.value,
                          minute.value
                      )

                      saveData()
                      dialog.dismiss()
                      showPunch()
                  }
              }

              dialog.show()
          }

          private fun showEditWheel(rec:EmployeeRecord,index:Int){
              if(index<0 || index>=rec.punches.size)return

              val current=rec.punches[index]
              val parts=current.split(":")

              val currentHour=parts.getOrNull(0)?.toIntOrNull()?.coerceIn(0,23) ?: 0
              val currentMinute=parts.getOrNull(1)?.toIntOrNull()?.coerceIn(0,59) ?: 0

              val dialog=AlertDialog.Builder(this).create()

              val box=LinearLayout(this).apply{
                  orientation=LinearLayout.VERTICAL
                  setPadding(dp(24),dp(20),dp(24),dp(12))
              }

              val title=TextView(this).apply{
                  text="Editar horário"
                  textSize=20f
                  setPadding(0,0,0,dp(12))
              }

              box.addView(title)

              val wheels=LinearLayout(this).apply{
                  orientation=LinearLayout.HORIZONTAL
                  gravity=Gravity.CENTER
              }

              val hour=NumberPicker(this).apply{
                  minValue=0
                  maxValue=23
                  value=currentHour
                  wrapSelectorWheel=true
              }

              val minute=NumberPicker(this).apply{
                  minValue=0
                  maxValue=59
                  value=currentMinute
                  wrapSelectorWheel=true
              }

              val sep=TextView(this).apply{
                  text=":"
                  textSize=28f
                  gravity=Gravity.CENTER
                  setPadding(dp(4),0,dp(4),0)
              }

              wheels.addView(hour)
              wheels.addView(sep)
              wheels.addView(minute)

              box.addView(wheels)

              val buttons=LinearLayout(this).apply{
                  orientation=LinearLayout.HORIZONTAL
                  gravity=Gravity.END
              }

              val cancel=Button(this).apply{
                  text="Cancelar"
              }

              val save=Button(this).apply{
                  text="Salvar"
              }

              buttons.addView(cancel)
              buttons.addView(save)
              box.addView(buttons)

              dialog.setView(box)

              cancel.setOnClickListener{
                  dialog.dismiss()
              }

              save.setOnClickListener{
                  rec.punches[index]="%02d:%02d".format(
                      Locale.US,
                      hour.value,
                      minute.value
                  )

                  saveData()
                  dialog.dismiss()
                  showPunch()
              }

              dialog.show()
          }
          '''

          if "private fun showEditWheel(rec:EmployeeRecord,index:Int)" not in s:
              p=s.find("private fun showManualWheel")
              if p>=0:
                  s=s[:p]+wheel+"\n"+s[p:]
              else:
                  p=s.find("private fun calculate")
                  if p>=0:
                      s=s[:p]+wheel+"\n"+s[p:]
                  else:
                      s += "\n"+wheel+"\n"

          # ------------------------------------------------------------
          # ÍNDICE DA PRÓXIMA BATIDA
          # ------------------------------------------------------------

          nextfn=r'''
          private fun nextPunchIndex(emp:EmployeeRecord):Int{
              for(i in emp.punches.indices){
                  if(emp.punches[i].isBlank()) return i
              }

              if(emp.punches.size<4)return emp.punches.size

              if(extraEnabled(emp.id)){
                  if(emp.punches.size<6)return emp.punches.size
              }

              return emp.punches.size
          }
          '''

          if "private fun nextPunchIndex(emp:EmployeeRecord)" not in s:
              p=s.find("private fun calculate")
              if p>=0:
                  s=s[:p]+nextfn+"\n"+s[p:]
              else:
                  s += "\n"+nextfn+"\n"

          # ------------------------------------------------------------
          # CLIQUE NAS BATIDAS EXISTENTES
          # ------------------------------------------------------------

          if "showEditWheel(rec,index)" not in s:
              pattern=r'([^\n]*)(row\.addView|addViewrow)'
              matches=list(re.finditer(pattern,s))
              for m in reversed(matches):
                  line=m.group(0)
                  if "punch" in line.lower() or "row" in line.lower():
                      insert="\n                    row.setOnClickListener{showEditWheel(rec,index)}"
                      s=s[:m.end()]+insert
