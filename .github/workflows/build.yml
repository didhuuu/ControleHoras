    private fun simpleTimeField(
        value: String
    ): EditText {

        return EditText(this).apply {

            hint = "HH:mm"
            inputType = 2
            setSingleLine()
            setText(value)

            addTextChangedListener(
                object : TextWatcher {

                    private var changing = false

                    override fun beforeTextChanged(
                        s: CharSequence?,
                        start: Int,
                        count: Int,
                        after: Int
                    ) {
                    }

                    override fun onTextChanged(
                        s: CharSequence?,
                        start: Int,
                        before: Int,
                        count: Int
                    ) {
                    }

                    override fun afterTextChanged(
                        s: Editable?
                    ) {

                        if (changing) return

                        val digits =
                            s?.toString()
                                ?.filter {
                                    it.isDigit()
                                }
                                ?.take(4)
                                ?: ""

                        val formatted =
                            if (digits.length > 2)
                                digits.substring(
                                    0,
                                    2
                                ) +
                                ":" +
                                digits.substring(2)
                            else
                                digits

                        if (
                            formatted !=
                            s?.toString()
                        ) {

                            changing = true
                            setText(formatted)
                            setSelection(
                                formatted.length
                            )
                            changing = false
                        }
                    }
                }
            )
        }
    }

    private fun showReport() {

        val box =
            page("Relatório mensal")

        val employee =
            employees.firstOrNull {
                it.id == selectedEmployeeId
            }

        if (employee == null) {

            box.addView(
                infoCard(
                    "Cadastre um funcionário."
                )
            )

            return
        }

        val month =
            SimpleDateFormat(
                "yyyy-MM",
                Locale.US
            ).format(Date())

        val list =
            records
                .filter {
                    it.employeeId ==
                    employee.id &&
                    it.date.startsWith(month)
                }
                .sortedBy {
                    it.date
                }

        val worked =
            list.sumOf {
                calculate(it).worked
            }

        val extra60 =
            list.sumOf {
                calculate(it).extra60
            }

        val extra100 =
            list.sumOf {
                calculate(it).extra100
            }

        val normal =
            list.sumOf {

                val c =
                    calculate(it)

                minOf(
                    c.worked,
                    c.expected
                )
            }

        val workedDays =
            list.count {

                val c =
                    calculate(it)

                c.worked > 0 &&
                c.expected > 0
            }

        val scheduled =
            scheduledDays(
                employee.id,
                month
            )

        val absence =
            max(
                0,
                scheduled - workedDays
            )

        val hourly =
            employee.salary / 220.0

        val value60 =
            extra60 /
                60.0 *
                hourly *
                1.60

        val value100 =
            extra100 /
                60.0 *
                hourly *
                2.00

        val overtime =
            value60 + value100

        val restDays =
            max(
                0,
                calendarDaysInMonth(month) -
                scheduled
            )

        /*
         * DSR financeiro:
         * valor das horas extras /
         * dias trabalhados previstos *
         * dias de repouso.
         */
        val dsr =
            if (scheduled > 0)
                overtime /
                    scheduled *
                    restDays
            else
                0.0

        val finalTotal =
            overtime + dsr

        box.addView(
            metricCard(
                "Horas normais",
                formatMin(normal),
                blue
            ),
            marginParams(
                0,
                14,
                0,
                8
            )
        )

        box.addView(
            metricCard(
                "HE 60%",
                "${formatMin(extra60)}\n${money.format(value60)}",
                blue
            ),
            marginParams(
                0,
                0,
                0,
                8
            )
        )

        box.addView(
            metricCard(
                "HE 100%",
                "${formatMin(extra100)}\n${money.format(value100)}",
                blue
            ),
            marginParams(
                0,
                0,
                0,
                8
            )
        )

        box.addView(
            metricCard(
                "DSR sobre horas extras",
                money.format(dsr),
                green
            ),
            marginParams(
                0,
                0,
                0,
                8
            )
        )

        box.addView(
            infoCard(
                "Funcionário: ${employee.name}\n" +
                "Salário: ${money.format(employee.salary)}\n" +
                "Valor hora normal: ${money.format(hourly)}\n\n" +
                "Total trabalhado: ${formatMin(worked)}\n" +
                "Dias trabalhados: $workedDays\n" +
                "Dias de ausência: $absence\n" +
                "HE 60%: ${money.format(value60)}\n" +
                "HE 100%: ${money.format(value100)}\n" +
                "DSR: ${money.format(dsr)}\n\n" +
                "TOTAL FINAL: ${money.format(finalTotal)}"
            ),
            marginParams(
                0,
                0,
                0,
                12
            )
        )

        val pdf =
            Button(this).apply {

                text =
                    "GERAR / COMPARTILHAR PDF"

                setOnClickListener {

                    sharePdf(
                        employee,
                        list
                    )
                }
            }

        box.addView(pdf)
    }

