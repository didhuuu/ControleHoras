name: Gerar APK - ControleHoras

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto original
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "======================================"
          echo " PROJETO ORIGINAL OK"
          echo "======================================"

          wc -l ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

      - name: Corrigir aplicativo original
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          s = p.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global s

              count = s.count(old)

              if count != 1:
                  raise SystemExit(
                      f"ERRO: trecho '{label}' encontrado "
                      f"{count} vez(es); arquivo original não corresponde ao esperado."
                  )

              s = s.replace(old, new, 1)

          # ============================================================
          # CORREÇÕES DE COMPILAÇÃO
          # NÃO ALTERA A INTERFACE ORIGINAL
          # ============================================================

          s = s.replace(
              "        }, 0, 0, 0, dp(10))",
              "        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(10) })"
          )

          s = s.replace(
              "        }, 0, 0, 0, dp(12))",
              "        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(12) })"
          )

          s = s.replace(
              "setTextColor(text)",
              "setTextColor(this@MainActivity.text)"
          )

          replace_once(
              'setText(if(existing!=null)existing.salary.toString():"")',
              'setText(if (existing != null) existing.salary.toString() else "")',
              "salário do funcionário"
          )

          # ============================================================
          # CORRIGIR HISTÓRICO / SOMATÓRIO
          #
          # Os registros são yyyy-MM-dd.
          # ============================================================

          replace_once(
              'it.date.endsWith(SimpleDateFormat("MM-yyyy", Locale.US).format(Date()))',
              'it.date.startsWith(SimpleDateFormat("yyyy-MM", Locale.US).format(Date()))',
              "filtro mensal do histórico"
          )

          # ============================================================
          # TOTAL SEMPRE COMO 00:00
          # ============================================================

          pattern = r'(?m)^\s*private fun formatMin\(m:Int\):String=.*$'

          matches = re.findall(pattern, s)

          if len(matches) != 1:
              raise SystemExit(
                  f"ERRO: função formatMin encontrada {len(matches)} vez(es)."
              )

          s = re.sub(
              pattern,
              '    private fun formatMin(m:Int):String="%02d:%02d".format(Locale.US,max(0,m)/60,max(0,m)%60)',
              s,
              count=1
          )

          # ============================================================
          # FUNÇÃO PARA NORMALIZAR HORÁRIOS
          #
          # 0800 -> 08:00
          # 800  -> 08:00
          # 930  -> 09:30
          # 08:00 -> 08:00
          # ============================================================

          helper = '''
              private fun normalizeTime(value:String):String{
                  val digits=value.filter{it.isDigit()}.take(4)

                  if(digits.isEmpty())return ""

                  val hour:Int
                  val minute:Int

                  when(digits.length){

                      1->{
                          hour=digits.toInt()
                          minute=0
                      }

                      2->{
                          hour=digits.toInt()
                          minute=0
                      }

                      3->{
                          hour=digits.substring(0,1).toInt()
                          minute=digits.substring(1,3).toInt()
                      }

                      else->{
                          hour=digits.substring(0,2).toInt()
                          minute=digits.substring(2,4).toInt()
                      }
                  }

                  if(hour !in 0..23 || minute !in 0..59)return ""

                  return "%02d:%02d".format(
                      Locale.US,
                      hour,
                      minute
                  )
              }

              private fun timeEdit(
                  initial:String="",
                  hintText:String="00:00"
              ):EditText{

                  val e=EditText(this).apply{

                      hint=hintText

                      setText(
                          normalizeTime(initial)
                      )

                      inputType=2

                      setSingleLine()

                      if(text.isNotEmpty()){
                          setSelection(text.length)
                      }
                  }

                  e.addTextChangedListener(
                      object:android.text.TextWatcher{

                          private var changing=false

                          override fun beforeTextChanged(
                              s:CharSequence?,
                              start:Int,
                              count:Int,
                              after:Int
                          ){}

                          override fun onTextChanged(
                              s:CharSequence?,
                              start:Int,
                              before:Int,
                              count:Int
                          ){}

                          override fun afterTextChanged(
                              editable:android.text.Editable?
                          ){

                              if(changing)return

                              val digits=
                                  editable
                                      ?.toString()
                                      ?.filter{it.isDigit()}
                                      ?: ""

                              if(digits.isEmpty())return

                              val formatted=when{

                                  digits.length<=2->{
                                      digits
                                  }

                                  else->{
                                      digits.substring(0,2)+
                                          ":"+
                                          digits.substring(
                                              2,
                                              4.coerceAtMost(digits.length)
                                          )
                                  }
                              }

                              if(
                                  formatted != editable.toString()
                              ){

                                  changing=true

                                  e.setText(formatted)

                                  e.setSelection(
                                      e.text.length
                                  )

                                  changing=false
                              }
                          }
                      }
                  )

                  return e
              }

          '''

          # Inserir antes de getRecord.
          marker = "    private fun getRecord(empId:Long,date:String):PunchDay{"

          if marker not in s:
              raise SystemExit(
                  "ERRO: ponto de inserção das funções de horário não encontrado."
              )

          s = s.replace(
              marker,
              helper + marker,
              1
          )

          # ============================================================
          # CORRIGIR CÁLCULO DOS MINUTOS
          # ============================================================

          old_minutes = '''    private fun minutesBetween(a:String,b:String):Int{
        if(a.isBlank()||b.isBlank())return 0
        return try{val x=a.split(":");val y=b.split(":");max(0,(y[0].toInt()*60+y[1].toInt())-(x[0].toInt()*60+x[1].toInt()))}catch(_:Exception){0}
    }'''

          new_minutes = '''    private fun minutesBetween(a:String,b:String):Int{
        val x=normalizeTime(a)
        val y=normalizeTime(b)

        if(x.isBlank()||y.isBlank())return 0

        return try{

            val xa=x.split(":")
            val ya=y.split(":")

            max(
                0,
                (ya[0].toInt()*60+ya[1].toInt()) -
                (xa[0].toInt()*60+xa[1].toInt())
            )

        }catch(_:Exception){
            0
        }
    }'''

          replace_once(
              old_minutes,
              new_minutes,
              "cálculo de minutos"
          )

          # ============================================================
          # ADIÇÃO MANUAL DE HORÁRIO
          # ============================================================

          replace_once(
              'val e=EditText(this).apply{setText(r.punches[index]);hint="HH:mm";inputType=2;setSingleLine()}',
              'val e=timeEdit(r.punches[index],punchNames[index])',
              "campo de adição manual"
          )

          replace_once(
              'r.punches[index]=e.text.toString();saveData();showPunch()',
              'r.punches[index]=normalizeTime(e.text.toString());saveData();showPunch()',
              "salvamento da adição manual"
          )

          # ============================================================
          # EDIÇÃO DOS 6 HORÁRIOS
          # ============================================================

          replace_once(
              'val fields=r.punches.mapIndexed{i,v->EditText(this).apply{hint=punchNames[i];setText(v);inputType=2;setSingleLine();}}',
              'val fields=r.punches.mapIndexed{i,v->timeEdit(v,punchNames[i])}',
              "campos da edição do registro"
          )

          replace_once(
              'r.punches[i]=e.text.toString()};saveData();showHistory()',
              'r.punches[i]=normalizeTime(e.text.toString())};saveData();showHistory()',
              "salvamento da edição do registro"
          )

          # ============================================================
          # ESCALA
          # ============================================================

          replace_once(
              'val ed=EditText(this).apply{setText(p.second);hint="00:00";gravity=Gravity.CENTER;inputType=2;setSingleLine()}',
              'val ed=timeEdit(p.second,"00:00").apply{gravity=Gravity.CENTER}',
              "campo de horário da escala"
          )

          replace_once(
              '0->s.e=ed.text.toString();1->s.x1=ed.text.toString();2->s.r1=ed.text.toString();3->s.x2=ed.text.toString()',
              '0->s.e=normalizeTime(ed.text.toString());1->s.x1=normalizeTime(ed.text.toString());2->s.r1=normalizeTime(ed.text.toString());3->s.x2=normalizeTime(ed.text.toString())',
              "salvamento dos horários da escala"
          )

          # ============================================================
          # GRAVAR
          # ============================================================

          p.write_text(
              s,
              encoding="utf-8"
          )

          print("======================================")
          print(" CORREÇÕES APLICADAS")
          print("======================================")
          print("UI ORIGINAL PRESERVADA")
          print("HORÁRIO MANUAL CORRIGIDO")
          print("DOIS PONTOS AUTOMÁTICOS")
          print("SOMATÓRIO CORRIGIDO")
          print("ESCALA CORRIGIDA")
          print("FORMATO 00:00 CORRIGIDO")
          print("LINHAS:", len(s.splitlines()))
          print("======================================")

          PY

      - name: Verificar código antes de compilar
        shell: bash
        run: |
          set -e

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          test -s "$FILE"

          grep -q "private fun normalizeTime" "$FILE"
          grep -q "private fun timeEdit" "$FILE"
          grep -q "private fun minutesBetween" "$FILE"
          grep -q 'private fun formatMin(m:Int):String="%02d:%02d"' "$FILE"

          echo "======================================"
          echo " KOTLIN VALIDADO PARA COMPILAÇÃO"
          echo "======================================"

          tail -n 5 "$FILE"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"

          unzip -q \
            "gradle-8.11.1-bin.zip"

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          export PATH="$PWD/gradle-8.11.1/bin:$PATH"

          gradle --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " GERANDO APK"
          echo "======================================"

          gradle assembleDebug --no-daemon --stacktrace

          test -s \
            app/build/outputs/apk/debug/app-debug.apk

          echo "======================================"
          echo " APK GERADO"
          echo "======================================"

          ls -lh \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" > /dev/null

          echo "======================================"
          echo " APK ÍNTEGRO"
          echo "======================================"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Finalizar
        shell: bash
        run: |
          echo "======================================"
          echo " BUILD FINALIZADO"
          echo "======================================"
