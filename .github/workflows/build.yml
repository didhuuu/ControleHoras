name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # RECUPERA O WORKFLOW COMPLETO ANTERIOR
      #
      # O arquivo anterior possui as correções da Base 70,
      # versão 80, roda azul/neon, registro manual, edição,
      # intervalo 2, escala e geração do APK.
      #
      # O problema atual é somente que algumas strings Python
      # perderam a indentação YAML.
      #
      # Aqui corrigimos a indentação AUTOMATICAMENTE antes de
      # interpretar o YAML.
      # ============================================================

      - name: Corrigir workflow e executar construção
        shell: python
        run: |
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          from urllib.request import Request, urlopen

          print("=" * 70)
          print("CORRIGINDO WORKFLOW ANTERIOR")
          print("=" * 70)

          # Commit exato do workflow que contém todas as correções.
          SOURCE_URL = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "7ace9abd46f05cf10baa6ed6b56af61a2b694472/"
              ".github/workflows/build.yml"
          )

          request = Request(
              SOURCE_URL,
              headers={
                  "User-Agent": "ControleHoras-Build"
              }
          )

          source = urlopen(
              request,
              timeout=60
          ).read().decode(
              "utf-8"
          )

          print(
              "Workflow anterior baixado:",
              len(source),
              "caracteres"
          )

          # --------------------------------------------------------
          # CORREÇÃO CRÍTICA
          #
          # Os blocos:
          #
          # wheel_dialog = r'''
          # edit_method = r'''
          # manual_method = r'''
          # wheel_code = r'''
          #
          # ficaram sem indentação YAML.
          #
          # O conteúdo precisa permanecer dentro do:
          #
          # run: |
          #
          # portanto colocamos 10 espaços em cada linha interna.
          # --------------------------------------------------------

          lines = source.splitlines()

          fixed_lines = []

          inside_raw = False

          for line in lines:

              if (
                  not inside_raw
                  and
                  "= r'''" in line
              ):
                  inside_raw = True
                  fixed_lines.append(
                      line
                  )
                  continue

              if inside_raw:

                  fixed_lines.append(
                      "          " +
                      line
                  )

                  if line.strip() == "'''":
                      inside_raw = False

                  continue

              fixed_lines.append(
                  line
              )

          fixed = "\n".join(
              fixed_lines
          ) + "\n"

          # --------------------------------------------------------
          # GARANTIA
          # --------------------------------------------------------

          raw_blocks = [
              "wheel_dialog = r'''",
              "edit_method = r'''",
              "manual_method = r'''",
              "wheel_code = r'''"
          ]

          for block in raw_blocks:

              if block not in fixed:

                  raise SystemExit(
                      "ERRO: bloco não encontrado: "
                      + block
                  )

          print(
              "Indentação dos blocos Python corrigida."
          )

          # --------------------------------------------------------
          # INSTALAR PYYAML
          # --------------------------------------------------------

          subprocess.run(
              [
                  "python",
                  "-m",
                  "pip",
                  "install",
                  "-q",
                  "pyyaml"
              ],
              check=True
          )

          import yaml

          # --------------------------------------------------------
          # VALIDAR YAML ANTES DE EXECUTAR
          # --------------------------------------------------------

          try:

              data = yaml.safe_load(
                  fixed
              )

          except Exception as error:

              print("")
              print(
                  "=========================================="
              )
              print(
                  "ERRO NO YAML CORRIGIDO"
              )
              print(
                  "=========================================="
              )
              print(error)
              raise

          print("")
          print(
              "YAML corrigido foi interpretado com sucesso."
          )

          if not isinstance(
              data,
              dict
          ):

              raise SystemExit(
                  "ERRO: YAML corrigido não é um objeto."
              )

          jobs = data.get(
              "jobs"
          )

          if not jobs:

              raise SystemExit(
                  "ERRO: jobs não encontrado."
              )

          build_job = jobs.get(
              "build"
          )

          if not build_job:

              raise SystemExit(
                  "ERRO: job build não encontrado."
              )

          steps = build_job.get(
              "steps",
              []
          )

          print(
              "Quantidade de etapas:",
              len(steps)
          )

          # --------------------------------------------------------
          # EXECUTOR DAS ETAPAS
          # --------------------------------------------------------

          def execute_step(
              step
          ):

              name = step.get(
                  "name",
                  "Etapa sem nome"
              )

              if "uses" in step:

                  print("")
                  print(
                      "IGNORANDO ação externa:",
                      name
                  )

                  return

              script = step.get(
                  "run"
              )

              if not script:

                  print(
                      "Sem script:",
                      name
                  )

                  return

              shell = step.get(
                  "shell",
                  "bash"
              )

              working_directory = step.get(
                  "working-directory",
                  "."
              )

              cwd = Path(
                  working_directory
              )

              if not cwd.is_absolute():

                  cwd = (
                      Path.cwd() /
                      cwd
                  )

              print("")
              print("=" * 70)
              print(
                  "EXECUTANDO:",
                  name
              )
              print("=" * 70)

              # ----------------------------------------------------
              # VARIÁVEIS DA ETAPA
              # ----------------------------------------------------

              environment = os.environ.copy()

              step_env = step.get(
                  "env",
                  {}
              )

              if isinstance(
                  step_env,
                  dict
              ):

                  for key, value in step_env.items():

                      if value is None:
                          continue

                      value = str(
                          value
                      )

                      if value == "${{ github.token }}":

                          value = os.environ.get(
                              "GH_TOKEN",
                              ""
                          )

                      environment[
                          str(key)
                      ] = value

              # ----------------------------------------------------
              # PYTHON
              # ----------------------------------------------------

              if shell == "python":

                  filename = (
                      Path(
                          tempfile.gettempdir()
                      ) /
                      (
                          "controlehoras_"
                          +
                          str(
                              abs(
                                  hash(
                                      name
                                  )
                              )
                          )
                          +
                          ".py"
                      )
                  )

                  filename.write_text(
                      script,
                      encoding="utf-8"
                  )

                  subprocess.run(
                      [
                          "python",
                          str(filename)
                      ],
                      cwd=str(
                          cwd
                      ),
                      env=environment,
                      check=True
                  )

                  return

              # ----------------------------------------------------
              # BASH
              # ----------------------------------------------------

              if shell in [
                  "bash",
                  "sh",
                  ""
              ]:

                  subprocess.run(
                      [
                          "bash",
                          "-e"
                      ],
                      input=script,
                      text=True,
                      cwd=str(
                          cwd
                      ),
                      env=environment,
                      check=True
                  )

                  return

              # ----------------------------------------------------
              # OUTROS SHELLS
              # ----------------------------------------------------

              subprocess.run(
                  [
                      "bash",
                      "-e"
                  ],
                  input=script,
                  text=True,
                  cwd=str(
                      cwd
                  ),
                  env=environment,
                  check=True
              )

          # --------------------------------------------------------
          # EXECUTAR TODAS AS ETAPAS RUN
          #
          # A etapa "Baixar projeto" é ignorada porque já fizemos
          # checkout acima.
          #
          # Java também já foi configurado acima.
          # --------------------------------------------------------

          for step in steps:

              name = step.get(
                  "name",
                  ""
              )

              if name in [
                  "Baixar projeto",
                  "Configurar Java 17"
              ]:

                  continue

              # A publicação original usa actions/upload-artifact.
              # Será feita no final deste workflow.
              if "Publicar APK" in name:

                  continue

              execute_step(
                  step
              )

          print("")
          print("=" * 70)
          print("TODAS AS ETAPAS DO WORKFLOW ANTERIOR TERMINARAM")
          print("=" * 70)

      # ============================================================
      # GARANTIA FINAL DO APK
      # ============================================================

      - name: Verificar APK final
        shell: bash
        run: |
          set -e

          APK="ControleHoras/app/build/outputs/apk/debug/app-debug.apk"

          echo ""
          echo "=============================================="
          echo "VERIFICANDO APK"
          echo "=============================================="

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK está vazio."
            exit 1
          fi

          unzip -t \
            "$APK" \
            >/dev/null

          echo ""
          echo "APK ENCONTRADO:"
          ls -lh "$APK"

          echo ""
          echo "=============================================="
          echo "APK VALIDADO"
          echo "=============================================="

      # ============================================================
      # PUBLICAR APK
      # ============================================================

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
