name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # BASE 70 + CORREÇÕES EXISTENTES
      # ============================================================

      - name: Aplicar base correta
        shell: python
        run: |
          import subprocess
          import tempfile
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          subprocess.run(
              [
                  "python",
                  "-m",
                  "pip",
                  "install",
                  "-q",
                  "pyyaml"
              ],
              check=True
          )

          import yaml

          URL = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          print("=" * 70)
          print("BAIXANDO BASE")
          print("=" * 70)

          request = Request(
              URL,
              headers={
                  "User-Agent": "ControleHoras"
              }
          )

          workflow = urlopen(
              request,
              timeout=60
          ).read().decode(
              "utf-8"
          )

          data = yaml.safe_load(
              workflow
          )

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERRO: workflow inválido."
              )

          steps = (
              data
              .get("jobs", {})
              .get("build", {})
              .get("steps", [])
          )

          if not steps:
              raise SystemExit(
                  "ERRO: etapas da base não encontradas."
              )

          print(
              "Etapas encontradas:",
              len(steps)
          )

          def run_step(step):

              name = step.get(
                  "name",
                  "Etapa"
              )

              if "uses" in step:
                  return

              script = step.get("run")

              if not script:
                  return

              shell = step.get(
                  "shell",
                  "bash"
              )

              workdir = step.get(
                  "working-directory",
                  "."
              )

              cwd = Path(
                  workdir
              )

              if not cwd.is_absolute():
                  cwd = (
                      Path.cwd() /
                      cwd
                  )

              print("")
              print("=" * 70)
              print(
                  "EXECUTANDO:",
                  name
              )
              print("=" * 70)

              env = os.environ.copy()

              if shell == "python":

                  script_file = (
                      Path(
                          tempfile.gettempdir()
                      )
                      /
                      (
                          "controlehoras_"
                          +
                          str(
                              abs(
                                  hash(name)
                              )
                          )
                          +
                          ".py"
                      )
                  )

                  script_file.write_text(
                      script,
                      encoding="utf-8"
                  )

                  subprocess.run(
                      [
                          "python",
                          str(script_file)
                      ],
                      cwd=str(cwd),
                      env=env,
                      check=True
                  )

              else:

                  subprocess.run(
                      [
                          "bash",
                          "-e"
                      ],
                      input=script,
                      text=True,
                      cwd=str(cwd),
                      env=env,
                      check=True
                  )

          stop_names = {
              "Validar código",
              "Validar código e ícone",
              "Validar código final",
              "Instalar Gradle 8.11.1",
              "Limpar projeto",
              "Gerar APK",
              "Verificar APK"
          }

          for step in steps:

              name = step.get(
                  "name",
                  ""
              )

              if name in stop_names:
                  break

              if name in {
                  "Baixar projeto",
                  "Configurar Java 17"
              }:
                  continue

              run_step(
                  step
              )

          print("")
          print("=" * 70)
          print("BASE APLICADA")
          print("=" * 70)

      # ============================================================
      # CORREÇÃO DO CARTÃO
      # ============================================================

      - name: Corrigir cartão
        shell: python
        run: |
          from pathlib import Path
          import re

          main = Path(
              "ControleHoras/"
              "app/src/main/java/com/didhuuu/"
              "controlehoras/MainActivity.kt"
          )

          code = main.read_text(
              encoding="utf-8"
          )

          pattern = re.compile(
              r"""
              box\.addView\(
                  \s*
                  card\(\)\.apply\{
                  (?P<body>.*?)
                  \n\s*
                  \},
                  \s*0,
                  \s*0,
                  \s*0,
                  \s*dp\(10\)
                  \s*
              \)
              """,
              re.DOTALL |
              re.VERBOSE
          )

          match = pattern.search(
              code
          )

          if match:

              body = match.group(
                  "body"
              )

              replacement = (
                  "val employeeCard="
                  "(card() as ViewGroup).apply{"
                  +
                  body
                  +
                  "\n"
                  "              }\n\n"
                  "              box.addView(\n"
                  "                  employeeCard,\n"
                  "                  LinearLayout.LayoutParams(\n"
                  "                      -1,\n"
                  "                      -2\n"
                  "                  ).apply{\n"
                  "                      bottomMargin=dp(10)\n"
                  "                  }\n"
                  "              )"
              )

              code = (
                  code[:match.start()]
                  +
                  replacement
                  +
                  code[match.end():]
              )

              main.write_text(
                  code,
                  encoding="utf-8"
              )

              print(
                  "CARTÃO CORRIGIDO"
              )

          elif (
              "val employeeCard=" in code
              and
              "LinearLayout.LayoutParams" in code
          ):

              print(
                  "Cartão já corrigido."
              )

          else:

              raise SystemExit(
                  "ERRO: cartão não encontrado."
              )

      # ============================================================
      # RODA AZUL/NEON
      # ============================================================

      - name: Instalar roda azul neon
        shell: python
        run: |
          from pathlib import Path
          import base64

          root = Path(
              "ControleHoras"
          )

          main = (
              root /
              "app/src/main/java/com/didhuuu/"
              "controlehoras/MainActivity.kt"
          )

          wheel = (
              root /
              "app/src/main/java/com/didhuuu/"
              "controlehoras/TimeWheelView.kt"
          )

          code = main.read_text(
              encoding="utf-8"
          )

          imports = [
              "import android.graphics.Canvas",
              "import android.graphics.LinearGradient",
              "import android.graphics.Paint",
              "import android.graphics.Shader",
              "import android.media.AudioManager",
              "import android.media.ToneGenerator",
              "import android.view.MotionEvent",
              "import android.view.View",
              "import android.view.ViewGroup"
          ]

          package_line = (
              "package "
              "com.didhuuu.controlehoras\n"
          )

          if package_line not in code:
              raise SystemExit(
                  "ERRO: package não encontrado."
              )

          for imp in imports:
              if imp not in code:
                  code = code.replace(
                      package_line,
                      package_line +
                      imp +
                      "\n",
                      1
                  )

          # --------------------------------------------------------
          # RODA / DIALOG
          # --------------------------------------------------------

          DIALOG = (
              ""
          )

          EDIT = (
              ""
          )

          MANUAL = (
              ""
          )

          WHEEL = (
              "  cj12YWx1ZStvZmZzZXQKICAgICAgICAgICAgdmFsIHJhbmdlPW1heGltdW0tbWluaW11bSsxCgogICAgICAgICAgICB3aGlsZShudW1iZXI+bWF4aW11bSludW1iZXItPXJhbmdlCiAgICAgICAgICAgIHdoaWxlKG51bWJl cjxtaW5pbXVtKW51bWJl  "
          )

          def decode(value):
              return base64.b64decode(
                  value
              ).decode(
                  "utf-8"
              )

          dialog = decode(DIALOG)
          edit = decode(EDIT)
          manual = decode(MANUAL)
          wheel_code = decode(WHEEL)

          # Corrige automaticamente erros conhecidos da roda.
          wheel_code = wheel_code.replace(
              "ToneGenerator.TONE_PROP_CLICK",
              "ToneGenerator.TONE_PROP_BEEP"
          )

          wheel_code = wheel_code.replace(
              "acculated",
              "accumulated"
          )

          def find_function(
              source,
              name
          ):

              positions = []

              for prefix in [
                  "    private fun ",
                  "    fun "
              ]:

                  pos = source.find(
                      prefix + name
                  )

                  if pos >= 0:
                      positions.append(pos)

              if not positions:
                  return -1

              return min(
                  positions
              )

          edit_start = find_function(
              code,
              "showEditWheel"
          )

          manual_start = find_function(
              code,
              "showManualWheel"
          )

          history_start = find_function(
              code,
              "showHistory"
          )

          if (
              edit_start < 0
              or
              manual_start < 0
              or
              history_start < 0
          ):

              raise SystemExit(
                  "ERRO: funções da roda não encontradas."
              )

          code = (
              code[:edit_start]
              +
              dialog
              +
              "\n\n"
              +
              edit
              +
              "\n\n"
              +
              manual
              +
              "\n\n"
              +
              code[history_start:]
          )

          if "NumberPicker" in code:

              raise SystemExit(
                  "ERRO: NumberPicker ainda existe."
              )

          main.write_text(
              code,
              encoding="utf-8"
          )

          wheel.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          wheel.write_text(
              wheel_code,
              encoding="utf-8"
          )

          print(
              "RODA AZUL/NEON INSTALADA"
          )

      # ============================================================
      # CORRIGIR PUNCHNAMES + ERROS FINAIS DA RODA
      # ============================================================

      - name: Corrigir erros finais da roda
        shell: python
        run: |
          from pathlib import Path

          root = Path(
              "ControleHoras"
          )

          main = (
              root /
              "app/src/main/java/com/didhuuu/"
              "controlehoras/MainActivity.kt"
          )

          wheel = (
              root /
              "app/src/main/java/com/didhuuu/"
              "controlehoras/TimeWheelView.kt"
          )

          code = main.read_text(
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # PUNCHNAMES
          # --------------------------------------------------------

          punch_names = """
          private val punchNames = arrayOf(
              "Entrada",
              "Saída",
              "Retorno",
              "Saída intervalo 2",
              "Retorno intervalo 2",
              "Saída"
          )
          """

          if "private val punchNames" not in code:

              class_pos = code.find(
                  "class MainActivity"
              )

              if class_pos < 0:
                  raise SystemExit(
                      "ERRO: MainActivity não encontrada."
                  )

              brace_pos = code.find(
                  "{",
                  class_pos
              )

              if brace_pos < 0:
                  raise SystemExit(
                      "ERRO: abertura da MainActivity não encontrada."
                  )

              code = (
                  code[:brace_pos + 1]
                  +
                  "\n"
                  +
                  punch_names
                  +
                  "\n"
                  +
                  code[brace_pos + 1:]
              )

              print(
                  "punchNames adicionado."
              )

          else:

              print(
                  "punchNames já existe."
              )

          main.write_text(
              code,
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # CORREÇÕES DA TIMEWHEEL
          # --------------------------------------------------------

          wheel_code = wheel.read_text(
              encoding="utf-8"
          )

          wheel_code = wheel_code.replace(
              "ToneGenerator.TONE_PROP_CLICK",
              "ToneGenerator.TONE_PROP_BEEP"
          )

          wheel_code = wheel_code.replace(
              "acculated",
              "accumulated"
          )

          wheel.write_text(
              wheel_code,
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # VERIFICAÇÕES
          # --------------------------------------------------------

          final_main = main.read_text(
              encoding="utf-8"
          )

          final_wheel = wheel.read_text(
              encoding="utf-8"
          )

          if "private val punchNames" not in final_main:
              raise SystemExit(
                  "ERRO: punchNames não foi criado."
              )

          if "ToneGenerator.TONE_PROP_CLICK" in final_wheel:
              raise SystemExit(
                  "ERRO: TONE_PROP_CLICK ainda existe."
              )

          if "acculated" in final_wheel:
              raise SystemExit(
                  "ERRO: acculated ainda existe."
              )

          if "accumulated" not in final_wheel:
              raise SystemExit(
                  "ERRO: accumulated não encontrado."
              )

          print("")
          print("=" * 70)
          print("CORREÇÕES DA RODA APLICADAS")
          print("=" * 70)

      # ============================================================
      # VALIDAÇÃO
      # ============================================================

      - name: Validar código final
        shell: bash
        run: |
          set -e

          ROOT="ControleHoras"

          MAIN="$ROOT/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          WHEEL="$ROOT/app/src/main/java/com/didhuuu/controlehoras/TimeWheelView.kt"

          test -s "$MAIN"
          test -s "$WHEEL"

          grep -q "TimeWheelView" "$MAIN"
          grep -q "showTimeWheelDialog" "$MAIN"
          grep -q "showManualWheel" "$MAIN"
          grep -q "showEditWheel" "$MAIN"

          grep -q "punchNames" "$MAIN"

          grep -q "08:48" "$MAIN"
          grep -q "07:20" "$MAIN"

          grep -q "selectedPunchDate" "$MAIN"

          grep -q "extra2Enabled" "$MAIN"

          grep -q "extra2ReturnEnabled" "$MAIN"

          grep -q "accumulated" "$WHEEL"

          if grep -q "NumberPicker" "$MAIN"; then
            echo "ERRO: NumberPicker encontrado."
            exit 1
          fi

          if grep -q "NumberPicker" "$WHEEL"; then
            echo "ERRO: NumberPicker encontrado."
            exit 1
          fi

          if grep -q "TONE_PROP_CLICK" "$WHEEL"; then
            echo "ERRO: TONE_PROP_CLICK encontrado."
            exit 1
          fi

          if grep -q "acculated" "$WHEEL"; then
            echo "ERRO: acculated encontrado."
            exit 1
          fi

          if grep -q "DSR" "$MAIN"; then
            echo "ERRO: DSR encontrado."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "VALIDAÇÃO OK"
          echo "=============================================="

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo ""
          echo "=============================================="
          echo "APK GERADO"
          echo "=============================================="

          ls -lh "$APK"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t \
            "$APK" \
            >/dev/null

          echo ""
          echo "=============================================="
          echo "APK VALIDADO COM SUCESSO"
          echo "=============================================="

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
