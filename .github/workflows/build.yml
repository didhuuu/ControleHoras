                  dialog.show()
              }
          '''


          if(
              "private fun showControleHorasWheelDialog("
              not in code
          ):

              anchor=
                  code.find(
                      "    private fun showEditWheel("
                  )

              if anchor<0:

                  anchor=
                      code.find(
                          "    private fun showManualWheel("
                      )

              if anchor<0:

                  raise SystemExit(
                      "Métodos de ponto não encontrados."
                  )

              code=(
                  code[:anchor]
                  +dialog
                  +"\n"
                  +code[anchor:]
              )


          # --------------------------------------------------------
          # EDITAR BATIDA EXISTENTE
          # --------------------------------------------------------

          edit=r'''
              private fun showEditWheel(
                  rec:PunchDay,
                  index:Int
              ){

                  val old=
                      rec.punches[index]

                  val parts=
                      old.split(":")

                  val now=
                      Calendar.getInstance()


                  val hour=
                      parts.getOrNull(0)
                          ?.toIntOrNull()
                          ?.coerceIn(0,23)
                          ?:now.get(
                              Calendar.HOUR_OF_DAY
                          )


                  val minute=
                      parts.getOrNull(1)
                          ?.toIntOrNull()
                          ?.coerceIn(0,59)
                          ?:now.get(
                              Calendar.MINUTE
                          )


                  showControleHorasWheelDialog(
                      punchNames[index],
                      df.format(
                          parseIso(rec.date)
                      ),
                      hour,
                      minute
                  ){value->

                      rec.punches[index]=
                          value

                      saveData()

                      showPunch()
                  }
              }
          '''


          code=
              replace_method(
                  code,
                  "    private fun showEditWheel(",
                  edit
              )


          # --------------------------------------------------------
          # REGISTRO MANUAL
          # --------------------------------------------------------

          manual=r'''
              private fun showManualWheel(
                  empId:Long
              ){

                  val rec=
                      getRecord(
                          empId,
                          selectedPunchDate
                      )


                  val index=
                      nextPunchIndex(
                          rec,
                          extraEnabled(
                              empId,
                              selectedPunchDate
                          )
                      )


                  if(index<0){

                      Toast.makeText(
                          this,
                          "As batidas deste dia já estão preenchidas.",
                          Toast.LENGTH_LONG
                      ).show()

                      return
                  }


                  val now=
                      Calendar.getInstance()


                  showControleHorasWheelDialog(
                      punchNames[index],
                      df.format(
                          parseIso(
                              selectedPunchDate
                          )
                      ),
                      now.get(
                          Calendar.HOUR_OF_DAY
                      ),
                      now.get(
                          Calendar.MINUTE
                      )
                  ){value->

                      rec.punches[index]=
                          value

                      saveData()

                      showPunch()
                  }
              }
          '''


          code=
              replace_method(
                  code,
                  "    private fun showManualWheel(",
                  manual
              )


          # --------------------------------------------------------
          # REGISTRAR PONTO
          # --------------------------------------------------------

          register=r'''
              private fun registerPunch(
                  empId:Long
              ){

                  val rec=
                      getRecord(
                          empId,
                          selectedPunchDate
                      )


                  val index=
                      nextPunchIndex(
                          rec,
                          extraEnabled(
                              empId,
                              selectedPunchDate
                          )
                      )


                  if(index<0)
                      return


                  if(
                      selectedPunchDate==
                      today()
                  ){

                      rec.punches[index]=
                          nowTime()

                      saveData()

                      showPunch()

                  }else{

                      showManualWheel(
                          empId
                      )
                  }
              }
          '''


          code=
              replace_method(
                  code,
                  "    private fun registerPunch(",
                  register
              )


          # --------------------------------------------------------
          # VALIDAÇÃO
          # --------------------------------------------------------

          required=[
              "ControleHorasTimeWheelView",
              "showControleHorasWheelDialog",
              "showEditWheel",
              "showManualWheel",
              "registerPunch",
              "punchNames",
              "nextPunchIndex"
          ]


          for item in required:

              if item not in code:

                  raise SystemExit(
                      "ERRO: recurso ausente: "
                      +item
                  )


          if "NumberPicker(" in code:

              raise SystemExit(
                  "ERRO: NumberPicker antigo ainda existe."
              )


          src.write_text(
              code,
              encoding="utf-8"
          )


          print("========================================")
          print("ROLETA AZUL NEON INSTALADA")
          print("EDIÇÃO POR ROLAGEM INSTALADA")
          print("REGISTRO MANUAL INSTALADO")
          print("========================================")


      # ============================================================
      # 9 - VALIDAÇÃO FINAL ANTES DO GRADLE
      # ============================================================

      - name: Validar código final
        shell: bash
        run: |
          set -e

          SRC="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          SOUND="ControleHoras/app/src/main/res/raw/roller_click.wav"

          echo "========================================"
          echo "VALIDANDO CÓDIGO"
          echo "========================================"

          test -s "$SRC"
          test -s "$SOUND"

          grep -q \
            "ControleHorasTimeWheelView" \
            "$SRC"

          grep -q \
            "showControleHorasWheelDialog" \
            "$SRC"

          grep -q \
            "showEditWheel" \
            "$SRC"

          grep -q \
            "showManualWheel" \
            "$SRC"

          grep -q \
            "registerPunch" \
            "$SRC"

          grep -q \
            "nextPunchIndex" \
            "$SRC"

          grep -q \
            "punchNames" \
            "$SRC"

          grep -q \
            "selectedPunchDate" \
            "$SRC"

          grep -q \
            "extra2Enabled" \
            "$SRC"

          if grep -q \
            "NumberPicker(" \
            "$SRC"; then

            echo \
              "ERRO: NumberPicker antigo encontrado."

            exit 1
          fi

          echo "CÓDIGO FINAL VALIDADO"
          echo "ROLETA VALIDADA"
          echo "REGISTRO MANUAL VALIDADO"
          echo "========================================"


      # ============================================================
      # 10 - GRADLE
      # ============================================================

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version


      # ============================================================
      # 11 - LIMPAR
      # ============================================================

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle \
            clean \
            --no-daemon


      # ============================================================
      # 12 - GERAR APK
      # ============================================================

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GERANDO APK"
          echo "========================================"

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

          echo "========================================"
          echo "APK GERADO"
          echo "========================================"


      # ============================================================
      # 13 - VALIDAR APK
      # ============================================================

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t \
            "$APK" \
            >/dev/null

          echo "========================================"
          echo "APK VALIDADO"
          echo "========================================"


      # ============================================================
      # 14 - PUBLICAR APK
      # ============================================================

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
