    private fun employeeDialog(
        existing: Employee?
    ) {

        val layout =
            LinearLayout(this).apply {
                orientation =
                    LinearLayout.VERTICAL
                setPadding(
                    dp(16),
                    dp(5),
                    dp(16),
                    dp(5)
                )
            }

        val name =
            EditText(this).apply {
                hint = "Nome"
                setSingleLine()
                setText(
                    existing?.name ?: ""
                )
            }

        val salary =
            EditText(this).apply {
                hint = "Salário"
                inputType = 2 or 8192
                setSingleLine()
                setText(
                    if (existing != null)
                        existing.salary.toString()
                    else
                        ""
                )
            }

        layout.addView(
            name,
            LinearLayout.LayoutParams(
                -1,
                dp(60)
            )
        )

        layout.addView(
            salary,
            LinearLayout.LayoutParams(
                -1,
                dp(60)
            )
        )

        AlertDialog.Builder(this)
            .setTitle(
                if (existing == null)
                    "Novo funcionário"
                else
                    "Editar funcionário"
            )
            .setView(layout)
            .setNegativeButton(
                "Cancelar",
                null
            )
            .setPositiveButton(
                "Salvar"
            ) { _, _ ->

                val n =
                    name.text.toString().trim()

                if (n.isBlank()) {

                    Toast.makeText(
                        this,
                        "Informe o nome.",
                        Toast.LENGTH_SHORT
                    ).show()

                    return@setPositiveButton
                }

                val sal =
                    salary.text.toString()
                        .replace(",", ".")
                        .toDoubleOrNull()
                        ?: 0.0

                if (existing == null) {

                    val employee =
                        Employee(
                            System.currentTimeMillis(),
                            n,
                            sal
                        )

                    employees += employee

                    selectedEmployeeId =
                        employee.id

                } else {

                    existing.name = n
                    existing.salary = sal

                    records
                        .filter {
                            it.employeeId ==
                            existing.id
                        }
                        .forEach {
                            it.employeeName = n
                        }
                }

                saveData()
                showEmployees()
            }
            .show()
    }

