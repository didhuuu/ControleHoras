    private fun nextPunchIndex2(
        r:PunchDay,
        extra:Boolean
    ):Int{

        if(
            r.punches[0].isBlank()
        )
            return 0

        if(
            r.punches[1].isBlank()
        )
            return 1

        if(
            r.punches[2].isBlank()
        )
            return 2

        if(
            extra &&
            r.punches[3].isBlank()
        )
            return 3

        if(
            extra &&
            r.punches[4].isBlank()
        )
            return 4

        if(
            r.punches[5].isBlank()
        )
            return 5

        return -1
    }

    private fun brDate(
        value:String
    ):String{

        val p =
            value.split("-")

        return if(
            p.size == 3
        ){

            "${p[2]}/${p[1]}/${p[0]}"

        }else{

            value
        }
    }

