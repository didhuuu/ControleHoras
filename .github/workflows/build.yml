name: ControleHoras - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair ControleHoras.zip
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO EXTRAÍDO OK"

      - name: Corrigir MainActivity original
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          arquivo = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          if not arquivo.exists():
              raise SystemExit("ERRO: MainActivity.kt não encontrada.")

          codigo = arquivo.read_text(encoding="utf-8")

          print("========================================")
          print("ANALISANDO MAINACTIVITY ORIGINAL")
          print("========================================")
          print("Linhas:", len(codigo.splitlines()))
          print("Bytes:", len(codigo.encode("utf-8")))

          # -------------------------------------------------------
          # 1. CORRIGIR SALÁRIO
          # -------------------------------------------------------

          antigo = 'setText(if(existing!=null)existing.salary.toString():"")'

          novo = 'setText(if(existing!=null)existing.salary.toString() else "")'

          if antigo in codigo:
              codigo = codigo.replace(antigo, novo, 1)
              print("OK - salário corrigido")
          else:
              print("AVISO - salário já estava corrigido")

          # -------------------------------------------------------
          # 2. CORRIGIR setTextColor(text)
          # -------------------------------------------------------

          quantidade = codigo.count("setTextColor(text)")

          if quantidade:
              codigo = codigo.replace(
                  "setTextColor(text)",
                  "setTextColor(this@MainActivity.text)"
              )

          print(
              "OK - setTextColor:",
              quantidade,
              "correções"
          )

          # -------------------------------------------------------
          # 3. CORRIGIR HISTÓRICO MENSAL
          # -------------------------------------------------------

          antigo = (
              'it.date.endsWith('
              'SimpleDateFormat("MM-yyyy", Locale.US).format(Date())'
              ')'
          )

          novo = (
              'it.date.startsWith('
              'SimpleDateFormat("yyyy-MM", Locale.US).format(Date())'
              ')'
          )

          if antigo in codigo:
              codigo = codigo.replace(antigo, novo, 1)
              print("OK - histórico mensal corrigido")
          else:
              print("AVISO - filtro antigo do histórico não encontrado")

          # -------------------------------------------------------
          # 4. ADICIONAR normalizeTime E timeEdit
          # -------------------------------------------------------

          marcador = (
              '    private fun getRecord(empId:Long,date:String):PunchDay{'
          )

          if marcador not in codigo:
              raise SystemExit(
                  "ERRO: getRecord não encontrado."
              )

          if "private fun normalizeTime(" not in codigo:

              helper_lines = [
                  "    private fun normalizeTime(value:String):String{",
                  "        val digits=value.filter{it.isDigit()}.take(4)",
                  "",
                  "        if(digits.length!=4)return \"\"",
                  "",
                  "        val hour=digits.substring(0,2).toIntOrNull()?:return \"\"",
                  "        val minute=digits.substring(2,4).toIntOrNull()?:return \"\"",
                  "",
                  "        if(hour !in 0..23)return \"\"",
                  "        if(minute !in 0..59)return \"\"",
                  "",
                  "        return \"%02d:%02d\".format(Locale.US,hour,minute)",
                  "    }",
                  "",
                  "    private fun timeEdit(initial:String=\"\",hintText:String=\"00:00\"):EditText{",
                  "",
                  "        val e=EditText(this).apply{",
                  "            hint=hintText",
                  "            inputType=2",
                  "            setSingleLine()",
                  "",
                  "            val normalized=normalizeTime(initial)",
                  "",
                  "            if(normalized.isNotEmpty()){",
                  "                setText(normalized)",
                  "            }",
                  "        }",
                  "",
                  "        var changing=false",
                  "",
                  "        e.addTextChangedListener(object:android.text.TextWatcher{",
                  "",
                  "            override fun beforeTextChanged(s:CharSequence?,start:Int,count:Int,after:Int){}",
                  "",
                  "            override fun onTextChanged(s:CharSequence?,start:Int,before:Int,count:Int){}",
                  "",
                  "            override fun afterTextChanged(editable:android.text.Editable?){",
                  "",
                  "                if(changing)return",
                  "",
                  "                val digits=editable?.toString()?.filter{it.isDigit()}?.take(4).orEmpty()",
                  "",
                  "                val formatted=when{",
                  "                    digits.isEmpty()->\"\"",
                  "                    digits.length<=2->digits",
                  "                    else->digits.substring(0,2)+\":\"+digits.substring(2)",
                  "                }",
                  "",
                  "                if(formatted!=editable?.toString()){",
                  "                    changing=true",
                  "                    e.setText(formatted)",
                  "                    e.setSelection(e.text.length)",
                  "                    changing=false",
                  "                }",
                  "            }",
                  "        })",
                  "",
                  "        e.setOnFocusChangeListener{_,hasFocus->",
                  "            if(!hasFocus){",
                  "                val normalized=normalizeTime(e.text.toString())",
                  "",
                  "                if(normalized.isNotEmpty()){",
                  "                    e.setText(normalized)",
                  "                    e.setSelection(e.text.length)",
                  "                }",
                  "            }",
                  "        }",
                  "",
                  "        return e",
                  "    }",
                  "",
              ]

              helper = "\n".join(helper_lines)

              codigo = codigo.replace(
                  marcador,
                  helper + marcador,
                  1
              )

              print("OK - funções de horário adicionadas")
          else:
              print("OK - funções de horário já existem")

          # -------------------------------------------------------
          # 5. EDIÇÃO MANUAL
          # -------------------------------------------------------

          antigo = (
              'val e=EditText(this).apply{'
              'setText(r.punches[index]);'
              'hint="HH:mm";'
              'inputType=2;'
              'setSingleLine()}'
          )

          novo = (
              'val e=timeEdit('
              'r.punches[index],'
              'punchNames[index]'
              ')'
          )

          if antigo in codigo:
              codigo = codigo.replace(antigo, novo, 1)
              print("OK - edição manual")
          else:
              print("AVISO - edição manual já corrigida")

          # -------------------------------------------------------
          # 6. SALVAR EDIÇÃO MANUAL
          # -------------------------------------------------------

          antigo = (
              'r.punches[index]=e.text.toString();'
              'saveData();showPunch()'
          )

          novo = (
              'r.punches[index]=normalizeTime(e.text.toString());'
              'saveData();showPunch()'
          )

          if antigo in codigo:
              codigo = codigo.replace(antigo, novo, 1)
              print("OK - salvamento manual")
          else:
              print("AVISO - salvamento manual já corrigido")

          # -------------------------------------------------------
          # 7. EDIÇÃO DO HISTÓRICO
          # -------------------------------------------------------

          antigo = (
              'val fields=r.punches.mapIndexed'
              '{i,v->EditText(this).apply{'
              'hint=punchNames[i];'
              'setText(v);'
              'inputType=2;'
              'setSingleLine();}}'
          )

          novo = (
              'val fields=r.punches.mapIndexed'
              '{i,v->timeEdit(v,punchNames[i])}'
          )

          if antigo in codigo:
              codigo = codigo.replace(antigo, novo, 1)
              print("OK - edição do histórico")
          else:
              print("AVISO - campos do histórico já corrigidos")

          # -------------------------------------------------------
          # 8. SALVAR HISTÓRICO
          # -------------------------------------------------------

          antigo = (
              'fields.forEachIndexed'
              '{i,e->r.punches[i]=e.text.toString()};'
              'saveData();showHistory()'
          )

          novo = (
              'fields.forEachIndexed'
              '{i,e->r.punches[i]=normalizeTime(e.text.toString())};'
              'saveData();showHistory()'
          )

          if antigo in codigo:
              codigo = codigo.replace(antigo, novo, 1)
              print("OK - salvamento do histórico")
          else:
              print("AVISO - salvamento do histórico já corrigido")

          # -------------------------------------------------------
          # 9. ESCALA
          # -------------------------------------------------------

          antigo = (
              'val ed=EditText(this).apply{'
              'setText(p.second);'
              'hint="00:00";'
              'gravity=Gravity.CENTER;'
              'inputType=2;'
              'setSingleLine()}'
          )

          novo = (
              'val ed=timeEdit(p.second,"00:00").apply{'
              'gravity=Gravity.CENTER}'
          )

          if antigo in codigo:
              codigo = codigo.replace(antigo, novo, 1)
              print("OK - escala")
          else:
              print("AVISO - campo da escala já corrigido")

          # -------------------------------------------------------
          # 10. SALVAR ESCALA
          # -------------------------------------------------------

          antigo = (
              '0->s.e=ed.text.toString();'
              '1->s.x1=ed.text.toString();'
              '2->s.r1=ed.text.toString();'
              '3->s.x2=ed.text.toString()'
          )

          novo = (
              '0->s.e=normalizeTime(ed.text.toString());'
              '1->s.x1=normalizeTime(ed.text.toString());'
              '2->s.r1=normalizeTime(ed.text.toString());'
              '3->s.x2=normalizeTime(ed.text.toString())'
          )

          if antigo in codigo:
              codigo = codigo.replace(antigo, novo, 1)
              print("OK - salvamento da escala")
          else:
              print("AVISO - salvamento da escala já corrigido")

          # -------------------------------------------------------
          # 11. MINUTES BETWEEN
          #
          # Usa o texto EXATO da MainActivity original.
          # -------------------------------------------------------

          antigo = (
              '    private fun minutesBetween(a:String,b:String):Int{\n'
              '        if(a.isBlank()||b.isBlank())return 0\n'
              '        return try{val x=a.split(":");val y=b.split(":");'
              'max(0,(y[0].toInt()*60+y[1].toInt())-'
              '(x[0].toInt()*60+x[1].toInt()))}catch(_:Exception){0}\n'
              '    }\n'
          )

          novo = (
              '    private fun minutesBetween(a:String,b:String):Int{\n'
              '\n'
              '        val x=normalizeTime(a)\n'
              '        val y=normalizeTime(b)\n'
              '\n'
              '        if(x.isBlank()||y.isBlank())return 0\n'
              '\n'
              '        return try{\n'
              '\n'
              '            val xa=x.split(":")\n'
              '            val ya=y.split(":")\n'
              '\n'
              '            val inicio='
              'xa[0].toInt()*60+xa[1].toInt()\n'
              '            val fim='
              'ya[0].toInt()*60+ya[1].toInt()\n'
              '\n'
              '            max(0,fim-inicio)\n'
              '\n'
              '        }catch(_:Exception){\n'
              '            0\n'
              '        }\n'
              '    }\n'
          )

          if antigo not in codigo:
              raise SystemExit(
                  "ERRO: minutesBetween original não encontrada."
              )

          codigo = codigo.replace(
              antigo,
              novo,
              1
          )

          print("OK - minutesBetween corrigido")

          # -------------------------------------------------------
          # 12. FORMATMIN
          # -------------------------------------------------------

          antigo = (
              '    private fun formatMin(m:Int):String="'
              '${m/60}:%02d".format(m%60)\n'
          )

          novo = (
              '    private fun formatMin(m:Int):String='
              '"%02d:%02d".format(Locale.US,max(0,m)/60,max(0,m)%60)\n'
          )

          if antigo not in codigo:
              raise SystemExit(
                  "ERRO: formatMin original não encontrada."
              )

          codigo = codigo.replace(
              antigo,
              novo,
              1
          )

          print("OK - formatMin corrigido")

          # -------------------------------------------------------
          # 13. VALIDAÇÃO
          # -------------------------------------------------------

          obrigatorias = [
              "private fun normalizeTime",
              "private fun timeEdit",
              "private fun minutesBetween",
              "private fun formatMin",
              "private fun editPunch",
              "private fun editRecord",
              "private fun employeeDialog",
              "private fun confirmDelete",
              "private fun showPunch",
              "private fun showHistory",
              "private fun showReport",
              "private fun showEmployees",
              "private fun showScale"
          ]

          for funcao in obrigatorias:
              if funcao not in codigo:
                  raise SystemExit(
                      "ERRO FINAL: função ausente: " + funcao
                  )

          abertas = codigo.count("{")
          fechadas = codigo.count("}")

          print("========================================")
          print("VALIDAÇÃO")
          print("========================================")
          print("Linhas:", len(codigo.splitlines()))
          print("Chaves abertas:", abertas)
          print("Chaves fechadas:", fechadas)

          if abertas != fechadas:
              raise SystemExit(
                  f"ERRO: chaves incompatíveis "
                  f"{abertas}/{fechadas}"
              )

          if "%02d:%02d" not in codigo:
              raise SystemExit(
                  "
