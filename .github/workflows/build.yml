name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a versão 36
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess

          url = "https://raw.githubusercontent.com/didhuuu/ControleHoras/29bdaa86ef5b85ec79367cbced7c759063d7fe7b/.github/workflows/build.yml"

          workflow = urlopen(url, timeout=30).read().decode("utf-8")

          inicio = workflow.index(
              "      - name: Corrigir MainActivity"
          )

          fim = workflow.index(
              "      - name: Validar código",
              inicio
          )

          bloco = workflow[inicio:fim]

          marcador = "        run: |\n"

          pos = bloco.index(marcador) + len(marcador)

          linhas = bloco[pos:].splitlines()

          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in linhas
          )

          arquivo = Path("/tmp/corrigir36.py")

          arquivo.write_text(
              script + "\n",
              encoding="utf-8"
          )

          subprocess.run(
              ["python", str(arquivo)],
              check=True
          )

          print("VERSÃO 36 APLICADA")

      - name: Adicionar somente data retroativa
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          s = p.read_text(encoding="utf-8")

          def replace_once(old, new, name):
              global s

              if old not in s:
                  raise SystemExit(
                      "ERRO: trecho não encontrado: " + name
                  )

              s = s.replace(old, new, 1)

          # =====================================================
          # DATA SELECIONADA
          # =====================================================

          m = re.search(
              r'(?m)^(\s*)private var selectedEmployeeId = 0L\s*$',
              s
          )

          if not m:
              raise SystemExit(
                  "ERRO: selectedEmployeeId não encontrado"
              )

          indent = m.group(1)

          s = (
              s[:m.end()]
              + "\n"
              + indent
              + 'private var selectedPunchDate = ""'
              + s[m.end():]
          )

          # =====================================================
          # AO ABRIR COMEÇA EM HOJE
          # =====================================================

          replace_once(
              "        loadData()\n",
              "        loadData()\n"
              "        selectedPunchDate=today()\n",
              "data inicial"
          )

          # =====================================================
          # AO TROCAR FUNCIONÁRIO VOLTA PARA HOJE
          # =====================================================

          old_employee = (
              "selectedEmployeeId = employees[pos].id; showPunch()"
          )

          new_employee = (
              "selectedEmployeeId = employees[pos].id; "
              "selectedPunchDate=today(); showPunch()"
          )

          if old_employee not in s:
              raise SystemExit(
                  "ERRO: troca de funcionário não encontrada"
              )

          s = s.replace(
              old_employee,
              new_employee,
              1
          )

          # =====================================================
          # FUNÇÃO PARA ESCOLHER DATA
          # =====================================================

          marker = (
              "    private fun today()=iso.format(Date())\n"
          )

          if marker not in s:
              raise SystemExit(
                  "ERRO: função today() não encontrada"
              )

          helper = "\n".join([
              "    private fun choosePunchDate(){",
              "        val base=try{parseIso(selectedPunchDate)}catch(_:Exception){Date()}",
              "        val c=Calendar.getInstance().apply{time=base}",
              "        DatePickerDialog(this,{_,year,month,day->",
              "            val chosen=Calendar.getInstance().apply{",
              "                set(Calendar.YEAR,year)",
              "                set(Calendar.MONTH,month)",
              "                set(Calendar.DAY_OF_MONTH,day)",
              "                set(Calendar.HOUR_OF_DAY,0)",
              "                set(Calendar.MINUTE,0)",
              "                set(Calendar.SECOND,0)",
              "                set(Calendar.MILLISECOND,0)",
              "            }",
              "            val hoje=Calendar.getInstance().apply{",
              "                set(Calendar.HOUR_OF_DAY,0)",
              "                set(Calendar.MINUTE,0)",
              "                set(Calendar.SECOND,0)",
              "                set(Calendar.MILLISECOND,0)",
              "            }",
              "            if(!chosen.after(hoje)){",
              "                selectedPunchDate=iso.format(chosen.time)",
              "                showPunch()",
              "            }",
              "        },c.get(Calendar.YEAR),c.get(Calendar.MONTH),c.get(Calendar.DAY_OF_MONTH)).apply{",
              "            datePicker.maxDate=System.currentTimeMillis()",
              "        }.show()",
              "    }",
              ""
          ])

          s = s.replace(
              marker,
              marker + helper,
              1
          )

          # =====================================================
          # CARTÃO DA DATA
          #
          # IMPORTANTE:
          # Não usamos Button aqui.
          # Usamos TextView clicável para evitar o erro
          # de Context que ocorreu na compilação.
          # =====================================================

          old_date = (
              '            line.addView(TextView(context).apply { '
              'text = "Hoje\\n${df.format(Date())}"; '
              'textSize = 16f; '
              'setTextColor(this@MainActivity.text); '
              'setTypeface(null, Typeface.BOLD) '
              '}, LinearLayout.LayoutParams(0, dp(60), 1f))'
          )

          new_date = (
              '            line.addView(TextView(this@MainActivity).apply { '
              'text = "Data do ponto\\n${df.format(parseIso(selectedPunchDate))}\\nTOQUE PARA ALTERAR"; '
              'textSize = 16f; '
              'setTextColor(this@MainActivity.text); '
              'setTypeface(null, Typeface.BOLD); '
              'gravity = Gravity.CENTER_VERTICAL; '
              'setOnClickListener { choosePunchDate() } '
              '}, LinearLayout.LayoutParams(0, dp(60), 1f))'
          )

          replace_once(
              old_date,
              new_date,
              "cartão da data"
          )

          # =====================================================
          # SHOWPUNCH USA A DATA SELECIONADA
          # =====================================================

          inicio = s.find(
              "    private fun showPunch()"
          )

          fim = s.find(
              "    private val punchNames",
              inicio
          )

          if inicio < 0 or fim < 0:
              raise SystemExit(
                  "ERRO: showPunch não encontrada"
              )

          show = s[inicio:fim]

          if "getRecord(emp.id, today())" not in show:
              raise SystemExit(
                  "ERRO: registro de hoje não encontrado"
              )

          show = show.replace(
              "getRecord(emp.id, today())",
              "getRecord(emp.id, selectedPunchDate)"
          )

          # =====================================================
          # REGISTRAR BATIDA
          #
          # HOJE:
          # usa a hora atual.
          #
          # DATA ANTERIOR:
          # permite informar manualmente o horário.
          # =====================================================

          pattern = (
              r'(\s*)r\.punches\[n\]\s*=\s*nowTime\(\)\s*'
              r'\n\s*saveData\(\)\s*'
              r'\n\s*showPunch\(\)'
          )

          replacement = "\n".join([
              r"\1if(selectedPunchDate==today()){",
              r"\1    r.punches[n]=nowTime()",
              r"\1    saveData()",
              r"\1    showPunch()",
              r"\1}else{",
              r'\1    val e=timeEdit("",punchNames[n])',
              r"\1    AlertDialog.Builder(this)",
              r"\1        .setTitle(punchNames[n])",
              r'\1        .setMessage("Informe o horário da batida para ${df.format(parseIso(selectedPunchDate))}.")',
              r"\1        .setView(e)",
              r'\1        .setNegativeButton("Cancelar",null)',
              r'\1        .setPositiveButton("Salvar"){_,_->',
              r"\1            val t=normalizeTime(e.text.toString())",
              r"\1            if(t.isNotBlank()){",
              r"\1                r.punches[n]=t",
              r"\1                saveData()",
              r"\1                showPunch()",
              r"\1            }",
              r"\1        }",
              r"\1        .show()",
              r"\1}"
          ])

          show, count = re.subn(
              pattern,
              replacement,
              show,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERRO: batida automática não encontrada"
              )

          s = s[:inicio] + show + s[fim:]

          # =====================================================
          # VALIDAÇÕES
          # =====================================================

          required = [
              'private var selectedPunchDate = ""',
              'private fun choosePunchDate()',
              'datePicker.maxDate=System.currentTimeMillis()',
              'getRecord(emp.id, selectedPunchDate)',
              'selectedPunchDate==today()',
              'setOnClickListener { choosePunchDate() }'
          ]

          for item in required:
              if item not in s:
                  raise SystemExit(
                      "ERRO FINAL: " + item
                  )

          if s.count("{") != s.count("}"):
              raise SystemExit(
                  "ERRO FINAL: chaves Kotlin incompatíveis"
              )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print("DATA RETROATIVA APLICADA")

      - name: Validar código final
        shell: python
        run: |
          from pathlib import Path

          p = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          required = [
              'private var selectedPunchDate = ""',
              'private fun choosePunchDate()',
              'getRecord(emp.id, selectedPunchDate)',
              'private fun normalizeTime',
              'private fun timeEdit',
              'private fun weekKey',
              'private fun modeForDate',
              'private fun modeForDay',
              'private fun calculate(r:PunchDay):Calc'
          ]

          for item in required:
              if item not in s:
                  raise SystemExit(
                      "ERRO DE VALIDACAO: " + item
                  )

          if s.count("{") != s.count("}"):
              raise SystemExit(
                  "ERRO DE VALIDACAO: chaves incompatíveis"
              )

          if "Button(context)" in s:
              raise SystemExit(
                  "ERRO DE VALIDACAO: Button(context) encontrado"
              )

          print("CÓDIGO FINAL VALIDADO")

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q gradle-8.11.1-bin.zip

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug --no-daemon --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
