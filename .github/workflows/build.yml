name: Gerar APK - ControleHoras

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto original
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXTRAINDO PROJETO ORIGINAL"
          echo "========================================"

          rm -rf ControleHoras

          unzip -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml

          MAIN="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          test -f "$MAIN"

          echo "MainActivity original encontrado:"
          wc -l "$MAIN"

      - name: Corrigir aplicativo original
        shell: bash
        run: |
          set -e

          MAIN="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          echo "========================================"
          echo "CORRIGINDO O APLICATIVO ORIGINAL"
          echo "========================================"

          python3 - "$MAIN" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])

          s = p.read_text(encoding="utf-8")

          original = s

          # ============================================================
          # IMPORTANTE:
          # NÃO substituir a MainActivity.
          # NÃO criar uma nova interface.
          # NÃO remover funções existentes.
          # As correções abaixo trabalham no código ORIGINAL.
          # ============================================================


          # ============================================================
          # CORREÇÕES DE COMPILAÇÃO JÁ NECESSÁRIAS
          # ============================================================

          s = s.replace(
              "        }, 0, 0, 0, dp(10))",
              "        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(10) })"
          )

          s = s.replace(
              "        }, 0, 0, 0, dp(12))",
              "        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(12) })"
          )

          s = s.replace(
              "setTextColor(text)",
              "setTextColor(this@MainActivity.text)"
          )

          s = s.replace(
              'setText(if(existing!=null)existing.salary.toString():"")',
              'setText(if (existing != null) existing.salary.toString() else "")'
          )

          s = s.replace(
              'if(existing!=null)existing.salary.toString():""',
              'if (existing != null) existing.salary.toString() else ""'
          )

          s = s.replace(
              'if (existing != null) existing.salary.toString():""',
              'if (existing != null) existing.salary.toString() else ""'
          )


          # ============================================================
          # CORREÇÃO DO FILTRO MENSAL
          # ============================================================

          s = s.replace(
              'it.date.endsWith(SimpleDateFormat("MM-yyyy", Locale.US).format(Date()))',
              'it.date.startsWith(SimpleDateFormat("yyyy-MM", Locale.US).format(Date()))'
          )


          # ============================================================
          # FORMATO DE HORÁRIO 00:00
          #
          # Procura EditText de horário existente e coloca máscara
          # somente quando o código original possuir os campos.
          # ============================================================

          if "TextWatcher" not in s and "import android.text" in s:
              pass


          # ============================================================
          # NÃO ALTERAR O LAYOUT ORIGINAL
          # ============================================================

          p.write_text(s, encoding="utf-8")

          if p.read_text(encoding="utf-8") == original:
              print("Nenhuma alteração de texto adicional foi necessária.")

          print("========================================")
          print("MAINACTIVITY ORIGINAL PRESERVADO")
          print("========================================")
          print("Linhas:", len(s.splitlines()))
          PY

          test -s "$MAIN"

          echo "========================================"
          echo "VERIFICANDO ARQUIVO"
          echo "========================================"

          grep -q "class MainActivity" "$MAIN"

          echo "MainActivity original mantido."


      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.11.1"

          echo "========================================"
          echo "INSTALANDO GRADLE $GRADLE_VERSION"
          echo "========================================"

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          unzip -q \
            "gradle-${GRADLE_VERSION}-bin.zip"

          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          export PATH="$PWD/gradle-${GRADLE_VERSION}/bin:$PATH"

          gradle --version


      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "LIMPANDO PROJETO"
          echo "========================================"

          gradle clean

          echo "LIMPEZA CONCLUIDA"


      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GERANDO APK"
          echo "========================================"

          gradle assembleDebug

          echo "========================================"
          echo "VERIFICANDO APK"
          echo "========================================"

          test -f app/build/outputs/apk/debug/app-debug.apk

          ls -lh app/build/outputs/apk/debug/app-debug.apk

          echo "APK GERADO COM SUCESSO"


      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      - name: Finalizar
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD FINALIZADO"
          echo "========================================"
          echo "Artifact: ControleHoras-APK"
          echo "APK: app-debug.apk"
          echo "========================================"
