name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # BAIXAR PROJETO
      # ==========================================================

      - name: Baixar projeto
        uses: actions/checkout@v4

      # ==========================================================
      # JAVA
      # ==========================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================================
      # EXTRAIR PROJETO
      # ==========================================================

      - name: Extrair projeto original
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "========================================"
          echo "PROJETO ORIGINAL OK"
          echo "========================================"

          wc -l ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

      # ==========================================================
      # CORRIGIR MAINACTIVITY
      # ==========================================================

      - name: Corrigir MainActivity
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          s = p.read_text(encoding="utf-8")

          print("Linhas originais:", len(s.splitlines()))

          # ======================================================
          # CORREÇÕES BÁSICAS DE COMPILAÇÃO
          # ======================================================

          s = s.replace(
              "        }, 0, 0, 0, dp(10))",
              "        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(10) })"
          )

          s = s.replace(
              "        }, 0, 0, 0, dp(12))",
              "        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(12) })"
          )

          s = s.replace(
              "setTextColor(text)",
              "setTextColor(this@MainActivity.text)"
          )

          s = s.replace(
              'setText(if(existing!=null)existing.salary.toString():"")',
              'setText(if (existing != null) existing.salary.toString() else "")'
          )

          s = s.replace(
              'setText(if(existing!=null)existing.salary.toString():"")',
              'setText(if (existing != null) existing.salary.toString() else "")'
          )

          # Histórico mensal
          s = s.replace(
              'it.date.endsWith(SimpleDateFormat("MM-yyyy", Locale.US).format(Date()))',
              'it.date.startsWith(SimpleDateFormat("yyyy-MM", Locale.US).format(Date()))'
          )

          # ======================================================
          # NORMALIZAÇÃO DE HORÁRIO
          #
          # 0558 -> 05:58
          # 1203 -> 12:03
          # ======================================================

          marker = "    private fun getRecord(empId:Long,date:String):PunchDay{"

          helper = '''    private fun normalizeTime(value:String):String{
              val digits=value.filter{it.isDigit()}.take(4)

              if(digits.length!=4)return ""

              val hour=digits.substring(0,2).toIntOrNull()?:return ""
              val minute=digits.substring(2,4).toIntOrNull()?:return ""

              if(hour !in 0..23)return ""
              if(minute !in 0..59)return ""

              return "%02d:%02d".format(Locale.US,hour,minute)
          }

          private fun timeEdit(initial:String="",hintText:String="00:00"):EditText{
              val e=EditText(this).apply{
                  hint=hintText
                  inputType=2
                  setSingleLine()

                  val normalized=normalizeTime(initial)

                  if(normalized.isNotEmpty()){
                      setText(normalized)
                  }
              }

              var changing=false

              e.addTextChangedListener(object:android.text.TextWatcher{

                  override fun beforeTextChanged(
                      s:CharSequence?,
                      start:Int,
                      count:Int,
                      after:Int
                  ){}

                  override fun onTextChanged(
                      s:CharSequence?,
                      start:Int,
                      before:Int,
                      count:Int
                  ){}

                  override fun afterTextChanged(
                      editable:android.text.Editable?
                  ){

                      if(changing)return

                      val digits=
                          editable
                              ?.toString()
                              ?.filter{it.isDigit()}
                              ?.take(4)
                              .orEmpty()

                      val formatted=when{

                          digits.isEmpty()->""

                          digits.length<=2->digits

                          else->
                              digits.substring(0,2)+":"+
                              digits.substring(2)
                      }

                      if(formatted!=editable?.toString()){

                          changing=true

                          e.setText(formatted)
                          e.setSelection(e.text.length)

                          changing=false
                      }
                  }
              })

              e.setOnFocusChangeListener{_,hasFocus->

                  if(!hasFocus){

                      val normalized=
                          normalizeTime(e.text.toString())

                      if(normalized.isNotEmpty()){

                          e.setText(normalized)
                          e.setSelection(e.text.length)
                      }
                  }
              }

              return e
          }

          '''

          if marker not in s:
              raise SystemExit(
                  "ERRO: getRecord não encontrado"
              )

          if "private fun normalizeTime" not in s:

              s = s.replace(
                  marker,
                  helper + marker,
                  1
              )

          # ======================================================
          # DATA DO PONTO
          # ======================================================

          selected_marker = "    private var selectedEmployeeId=0L"

          if selected_marker in s:

              s = s.replace(
                  selected_marker,
                  selected_marker +
                  '\n    private var selectedPunchDate:String=""',
                  1
              )

          elif "private var selectedPunchDate:String" not in s:

              marker_oncreate = "    override fun onCreate"

              if marker_oncreate not in s:
                  raise SystemExit(
                      "ERRO: não encontrei onCreate"
                  )

              s = s.replace(
                  marker_oncreate,
                  '    private var selectedPunchDate:String=""\n\n' +
                  marker_oncreate,
                  1
              )

          # ======================================================
          # FUNÇÃO HOJE
          # ======================================================

          if "private fun today()" not in s:

              today_helper = '''    private fun today():String{
              return SimpleDateFormat(
                  "yyyy-MM-dd",
                  Locale.US
              ).format(Date())
          }

          '''

              s = s.replace(
                  marker,
                  today_helper + marker,
                  1
              )

          # ======================================================
          # ABERTURA DO APP = HOJE
          # ======================================================

          if "selectedPunchDate=today()" not in s:

              if "        loadData()" in s:

                  s = s.replace(
                      "        loadData()",
                      "        loadData()\n        selectedPunchDate=today()",
                      1
                  )

          # ======================================================
          # TROCAR PONTO FIXO DE HOJE PARA DATA SELECIONADA
          # ======================================================

          s = s.replace(
              "val rec = getRecord(emp.id, today())",
              "val rec = getRecord(emp.id, selectedPunchDate)",
              1
          )

          s = s.replace(
              "val r = getRecord(emp.id, today())",
              "val r = getRecord(emp.id, selectedPunchDate)",
              1
          )

          # ======================================================
          # TROCAR FUNCIONÁRIO = VOLTA PARA HOJE
          # ======================================================

          employee_switch = (
              'if (employees[pos].id != selectedEmployeeId) '
              '{ selectedEmployeeId = employees[pos].id; showPunch() }'
          )

          employee_switch_new = (
              'if (employees[pos].id != selectedEmployeeId) '
              '{ selectedEmployeeId = employees[pos].id; '
              'selectedPunchDate = today(); showPunch() }'
          )

          if employee_switch in s:

              s = s.replace(
                  employee_switch,
                  employee_switch_new,
                  1
              )

          # ======================================================
          # SELETOR DE DATA
          # ======================================================

          date_marker = "    private fun showPunch() {"

          date_function = '''    private fun selectPunchDate(){

              val current=parseIso(selectedPunchDate)

              val cal=Calendar.getInstance()
              cal.time=current

              DatePickerDialog(
                  this,
                  { _,year,month,day ->

                      val c=Calendar.getInstance()

                      c.set(
                          year,
                          month,
                          day,
                          0,
                          0,
                          0
                      )

                      selectedPunchDate=
                          SimpleDateFormat(
                              "yyyy-MM-dd",
                              Locale.US
                          ).format(c.time)

                      showPunch()
                  },
                  cal.get(Calendar.YEAR),
                  cal.get(Calendar.MONTH),
                  cal.get(Calendar.DAY_OF_MONTH)
              ).apply{

                  setTitle("Selecionar data")

                  setOnShowListener{
                      val max=Calendar.getInstance()

                      datePicker.maxDate=max.timeInMillis
                  }

              }.show()
          }

          '''

          if "private fun selectPunchDate()" not in s:

              if date_marker not in s:
                  raise SystemExit(
                      "ERRO: showPunch não encontrado"
                  )

              s = s.replace(
                  date_marker,
                  date_function + date_marker,
                  1
              )

          # ======================================================
          # INSERIR CARTÃO DE DATA NO PONTO
          # ======================================================

          date_card_marker = "        val rec = getRecord(emp.id, selectedPunchDate)"

          date_card = '''        val dateCard=card().apply{

              val line=LinearLayout(context).apply{
                  orientation=LinearLayout.HORIZONTAL
                  gravity=Gravity.CENTER_VERTICAL
                  setPadding(
                      dp(14),
                      dp(8),
                      dp(14),
                      dp(8)
                  )
              }

              val dateText=TextView(context).apply{
                  text=
                      "Data do ponto: "+
                      SimpleDateFormat(
                          "dd/MM/yyyy",
                          Locale(\"pt\",\"BR\")
                      ).format(
                          parseIso(selectedPunchDate)
                      )

                  textSize=16f
                  setTypeface(null,Typeface.BOLD)
                  setTextColor(darkBlue)
              }

              line.addView(
                  dateText,
                  LinearLayout.LayoutParams(
                      0,
                      dp(55),
                      1f
                  )
              )

              val button=Button(context).apply{

                  text="ALTERAR DATA"

                  setOnClickListener{
                      selectPunchDate()
                  }
              }

              line.addView(
                  button,
                  LinearLayout.LayoutParams(
                      dp(145),
                      dp(50)
                  )
              )

              addView(line)
          }

          box.addView(
              dateCard,
              LinearLayout.LayoutParams(
                  -1,
                  LinearLayout.LayoutParams.WRAP_CONTENT
              ).apply{
                  bottomMargin=dp(10)
              }
          )

          '''

          if "Data do ponto:" not in s:

              if date_card_marker not in s:
                  raise SystemExit(
                      "ERRO: local da data do ponto não encontrado"
                  )

              s = s.replace(
                  date_card_marker,
                  date_card + date_card_marker,
                  1
              )

          # ======================================================
          # MINUTOS
          # ======================================================

          old_minutes = '''    private fun minutesBetween(a:String,b:String):Int{
              if(a.isBlank()||b.isBlank())return 0
              return try{val x=a.split(":");val y=b.split(":");max(0,(y[0].toInt()*60+y[1].toInt())-(x[0].toInt()*60+x[1].toInt()))}catch(_:Exception){0}
          }'''

          new_minutes = '''    private fun minutesBetween(a:String,b:String):Int{

              val x=normalizeTime(a)
              val y=normalizeTime(b)

              if(x.isBlank()||y.isBlank())return 0

              return try{

                  val xa=x.split(":")
                  val ya=y.split(":")

                  val inicio=
                      xa[0].toInt()*60+
                      xa[1].toInt()

                  val fim=
                      ya[0].toInt()*60+
                      ya[1].toInt()

                  max(
                      0,
                      fim-inicio
                  )

              }catch(_:Exception){

                  0
              }
          }'''

          if old_minutes in s:

              s=s.replace(
                  old_minutes,
                  new_minutes,
                  1
              )

          # ======================================================
          # FORMATO DOS TOTAIS
          # ======================================================

          old_format='    private fun formatMin(m:Int):String="${m/60}:%02d".format(m%60)'

          new_format='    private fun formatMin(m:Int):String="%02d:%02d".format(Locale.US,max(0,m)/60,max(0,m)%60)'

          if old_format in s:

              s=s.replace(
                  old_format,
                  new_format,
                  1
              )

          # ======================================================
          # ADIÇÃO MANUAL
          # ======================================================

          old_edit='val e=EditText(this).apply{setText(r.punches[index]);hint="HH:mm";inputType=2;setSingleLine()}'

          if old_edit in s:

              s=s.replace(
                  old_edit,
                  'val e=timeEdit(r.punches[index],"00:00")',
                  1
              )

          s=s.replace(
              'r.punches[index]=e.text.toString();saveData();showPunch()',
              'r.punches[index]=normalizeTime(e.text.toString());saveData();showPunch()',
              1
          )

          # ======================================================
          # EDIÇÃO COMPLETA DO REGISTRO
          # ======================================================

          old_fields='val fields=r.punches.mapIndexed{i,v->EditText(this).apply{hint=punchNames[i];setText(v);inputType=2;setSingleLine();}}'

          if old_fields in s:

              s=s.replace(
                  old_fields,
                  'val fields=r.punches.mapIndexed{i,v->timeEdit(v,punchNames[i])}',
                  1
              )

          s=s.replace(
              'fields.forEachIndexed{i,e->r.punches[i]=e.text.toString()};saveData();showHistory()',
              'fields.forEachIndexed{i,e->r.punches[i]=normalizeTime(e.text.toString())};saveData();showHistory()',
              1
          )

          # ======================================================
          # ESCALA TAMBÉM USA HORÁRIO AUTOMÁTICO
          # ======================================================

          old_scale='val ed=EditText(this).apply{setText(p.second);hint="00:00";gravity=Gravity.CENTER;inputType=2;setSingleLine()}'

          if old_scale in s:

              s=s.replace(
                  old_scale,
                  'val ed=timeEdit(p.second,"00:00").apply{gravity=Gravity.CENTER}',
                  1
              )

          s=s.replace(
              '0->s.e=ed.text.toString();1->s.x1=ed.text.toString();2->s.r1=ed.text.toString();3->s.x2=ed.text.toString()',
              '0->s.e=normalizeTime(ed.text.toString());1->s.x1=normalizeTime(ed.text.toString());2->s.r1=normalizeTime(ed.text.toString());3->s.x2=normalizeTime(ed.text.toString())',
              1
          )

          # ======================================================
          # VERIFICAÇÃO
          # ======================================================

          if s.count("{") != s.count("}"):
              raise SystemExit(
                  "ERRO: quantidade de chaves incompatível"
              )

          if "private fun normalizeTime" not in s:
              raise SystemExit(
                  "ERRO: normalizeTime não foi inserida"
              )

          if "private fun timeEdit" not in s:
              raise SystemExit(
                  "ERRO: timeEdit não foi inserida"
              )

          if "private fun selectPunchDate()" not in s:
              raise SystemExit(
                  "ERRO: seletor de data não foi inserido"
              )

          if "selectedPunchDate" not in s:
              raise SystemExit(
                  "ERRO: selectedPunchDate não foi inserido"
              )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print("========================================")
          print("MAINACTIVITY CORRIGIDA")
          print("========================================")
          print("Horário automático: OK")
          print("Somatório: OK")
          print("Adição manual: OK")
          print("Edição manual: OK")
          print("Data retroativa: OK")
          print("Data inicial = hoje: OK")
          print("Troca funcionário = hoje: OK")
          print("Histórico: OK")
          print("Escala: OK")
          print("Estrutura Kotlin: OK")
          print("Linhas finais:",len(s.splitlines()))
          print("========================================")
          PY

      # ==========================================================
      # VERIFICAR CÓDIGO
      # ==========================================================

      - name: Verificar código antes de compilar
        shell: bash
        run: |
          set -e

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          test -s "$FILE"

          grep -q "private fun normalizeTime" "$FILE"
          grep -q "private fun timeEdit" "$FILE"
          grep -q "private fun selectPunchDate" "$FILE"
          grep -q "selectedPunchDate" "$FILE"
          grep -q "private fun minutesBetween" "$FILE"

          echo "========================================"
          echo "CÓDIGO VALIDADO"
          echo "========================================"

          wc -l "$FILE"

      # ==========================================================
      # GRADLE
      # ==========================================================

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip" \
            -O /tmp/gradle.zip

          unzip -q \
            /tmp/gradle.zip \
            -d /opt

          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          /opt/gradle-8.11.1/bin/gradle --version

      # ==========================================================
      # LIMPAR
      # ==========================================================

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon \
            --stacktrace

      # ==========================================================
      # GERAR APK
      # ==========================================================

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      # ==========================================================
      # VERIFICAR APK
      # ==========================================================

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="ControleHoras/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "========================================"
            echo "ERRO: APK NÃO FOI GERADO"
            echo "========================================"

            find ControleHoras/app/build/outputs \
              -type f \
              2>/dev/null || true

            exit 1
          fi

          echo "========================================"
          echo "APK GERADO COM SUCESSO"
          echo "========================================"

          ls -lh "$APK"

      # ==========================================================
      # ENVIAR APK
      # ==========================================================

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # FINAL
      # ==========================================================

      - name: Final
        shell: bash
        run: |
          echo "========================================"
          echo "CONTROLE HORAS - BUILD CONCLUÍDO"
          echo "========================================"
          echo "APK: ControleHoras-APK"
          echo "========================================"
