                  val normalized=normalizeTime(initial)

                  if(normalized.isNotEmpty()){
                      setText(normalized)
                  }
              }

              var changing=false

              e.addTextChangedListener(object:android.text.TextWatcher{

                  override fun beforeTextChanged(
                      s:CharSequence?,
                      start:Int,
                      count:Int,
                      after:Int
                  ){}

                  override fun onTextChanged(
                      s:CharSequence?,
                      start:Int,
                      before:Int,
                      count:Int
                  ){}

                  override fun afterTextChanged(
                      editable:android.text.Editable?
                  ){
                      if(changing)return

                      val digits=editable
                          ?.toString()
                          ?.filter{it.isDigit()}
                          ?.take(4)
                          .orEmpty()

                      val formatted=when{
                          digits.isEmpty()->""
                          digits.length<=2->digits
                          else->digits.substring(0,2)+":"+digits.substring(2)
                      }

                      if(formatted!=editable?.toString()){
                          changing=true
                          e.setText(formatted)
                          e.setSelection(e.text.length)
                          changing=false
                      }
                  }
              })

              e.setOnFocusChangeListener{_,hasFocus->
                  if(!hasFocus){
                      val normalized=normalizeTime(e.text.toString())

                      if(normalized.isNotEmpty()){
                          e.setText(normalized)
                          e.setSelection(e.text.length)
                      }
                  }
              }

              return e
          }

          '''

          source=source.replace(
              marker,
              helper+marker,
              1
          )

          # Substitui minutesBetween da fonte original sem depender de indentação
          # ou de procurar chaves posteriores.
          start=source.find("    private fun minutesBetween(a:String,b:String):Int{")

          if start == -1:
              raise SystemExit("ERRO: minutesBetween não encontrado")

          end=source.find(
              '    private fun formatMin(m:Int):String=',
              start
          )

          if end == -1:
              raise SystemExit("ERRO: formatMin não encontrado após minutesBetween")

          new_minutes='''    private fun minutesBetween(a:String,b:String):Int{
              val x=normalizeTime(a)
              val y=normalizeTime(b)

              if(x.isBlank()||y.isBlank())return 0

              return try{
                  val xa=x.split(":")
                  val ya=y.split(":")

                  max(
                      0,
                      (ya[0].toInt()*60+ya[1].toInt())-
                      (xa[0].toInt()*60+xa[1].toInt())
                  )
              }catch(_:Exception){
                  0
              }
          }

          '''

          source=source[:start]+new_minutes+source[end:]

          # Corrige formatMin.
          old='    private fun formatMin(m:Int):String="${m/60}:%02d".format(m%60)'

          if old in source:
              source=source.replace(
                  old,
                  '    private fun formatMin(m:Int):String="%02d:%02d".format(Locale.US,max(0,m)/60,max(0,m)%60)',
                  1
              )

          # Validações finais.
          if source.count("private fun normalizeTime") != 1:
              raise SystemExit("ERRO FINAL: normalizeTime")

          if source.count("private fun timeEdit") != 1:
              raise SystemExit("ERRO FINAL: timeEdit")

          if source.count("private fun minutesBetween") != 1:
              raise SystemExit("ERRO FINAL: minutesBetween")

          if source.count("private fun formatMin") != 1:
              raise SystemExit("ERRO FINAL: formatMin")

          if source.count("{") != source.count("}"):
              raise SystemExit(
                  f"ERRO FINAL: chaves {source.count('{')}/{source.count('}')}"
              )

          lines=len(source.splitlines())

          if lines < 500 or lines > 560:
              raise SystemExit(
                  f"ERRO FINAL: quantidade inesperada de linhas: {lines}"
              )

          p.write_text(source,encoding="utf-8")

          print("========================================")
          print(" MAINACTIVITY CORRIGIDA")
          print("========================================")
          print("UI ORIGINAL PRESERVADA")
          print("REGISTRO OK")
          print("ADIÇÃO MANUAL OK")
          print("DOIS PONTOS AUTOMÁTICOS OK")
          print("SOMATÓRIO OK")
          print("FORMATO 00:00 OK")
          print("HISTÓRICO OK")
          print("ESCALA OK")
          print("CHAVES:",source.count("{"),source.count("}"))
          print("LINHAS:",lines)
          print("========================================")
          PY

      - name: Verificar código antes de compilar
        shell: bash
        run: |
          set -e

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          test -s "$FILE"

          grep -q "private fun normalizeTime" "$FILE"
          grep -q "private fun timeEdit" "$FILE"
          grep -q "private fun minutesBetween" "$FILE"
          grep -q 'private fun formatMin(m:Int):String="%02d:%02d"' "$FILE"

          echo "========================================"
          echo "KOTLIN VALIDADO"
          echo "========================================"

          wc -l "$FILE"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"

          unzip -q "gradle-8.11.1-bin.zip"

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          export PATH="$PWD/gradle-8.11.1/bin:$PATH"

          gradle --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug --no-daemon --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "========================================"
          echo "APK GERADO"
          echo "========================================"

          ls -lh "$APK"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" > /dev/null

          echo "APK ÍNTEGRO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Finalizar
        shell: bash
        run: |
          echo "BUILD FINALIZADO"
