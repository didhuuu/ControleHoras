                  )
              )

              wheels.addView(
                  sep,
                  LinearLayout.LayoutParams(
                      dp(28),
                      dp(190)
                  )
              )

              wheels.addView(
                  minute,
                  LinearLayout.LayoutParams(
                      dp(105),
                      dp(190)
                  )
              )

              wrap.addView(
                  wheels
              )

              val selected=
                  TextView(this).apply{

                      text=
                          "%02d:%02d".format(
                              Locale.US,
                              hour.value,
                              minute.value
                          )

                      textSize=30f

                      setTypeface(
                          null,
                          Typeface.BOLD
                      )

                      setTextColor(
                          blue
                      )

                      gravity=
                          Gravity.CENTER

                      setPadding(
                          0,
                          dp(6),
                          0,
                          dp(10)
                      )
                  }

              fun refresh(){

                  selected.text=
                      "%02d:%02d".format(
                          Locale.US,
                          hour.value,
                          minute.value
                      )
              }

              hour.onValueChanged={
                  refresh()
              }

              minute.onValueChanged={
                  refresh()
