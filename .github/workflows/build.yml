name: Gerar APK - ControleHoras

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          echo "Extraindo ControleHoras.zip..."
          unzip -o ControleHoras.zip

          echo "Verificando estrutura..."

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "Projeto encontrado corretamente."

      - name: Corrigir Kotlin durante o Build
        shell: bash
        run: |
          set -e

          python3 -c '
          from pathlib import Path

          p = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          s = p.read_text(encoding="utf-8")

          print("Aplicando correções no MainActivity.kt durante o Build...")

          # ============================================================
          # 1. CORRIGIR OS DOIS addView COM PARÂMETROS INVÁLIDOS
          # ============================================================

          old = "        }, 0, 0, 0, dp(10))"

          new = """        },
            LinearLayout.LayoutParams(
                -1,
                LinearLayout.LayoutParams.WRAP_CONTENT
            ).apply {
                bottomMargin = dp(10)
            }
        )"""

          count = s.count(old)

          if count > 0:
              s = s.replace(old, new)
              print(f"OK: addView com margem 10 corrigido ({count} ocorrência(s)).")
          else:
              print("AVISO: addView com margem 10 não encontrado.")

          old = "        }, 0, 0, 0, dp(12))"

          new = """        },
            LinearLayout.LayoutParams(
                -1,
                LinearLayout.LayoutParams.WRAP_CONTENT
            ).apply {
                bottomMargin = dp(12)
            }
        )"""

          count = s.count(old)

          if count > 0:
              s = s.replace(old, new)
              print(f"OK: addView com margem 12 corrigido ({count} ocorrência(s)).")
          else:
              print("AVISO: addView com margem 12 não encontrado.")

          # ============================================================
          # 2. CORRIGIR setTextColor(text)
          # ============================================================

          count = s.count("setTextColor(text)")

          s = s.replace(
              "setTextColor(text)",
              "setTextColor(this@MainActivity.text)"
          )

          print(
              f"OK: setTextColor(text) corrigido ({count} ocorrência(s))."
          )

          # ============================================================
          # 3. CORRIGIR EXPRESSÃO DO SALÁRIO
          # ============================================================

          replacements = [
              (
                  'setText(if(existing!=null)existing.salary.toString():"")',
                  'setText(if (existing != null) existing.salary.toString() else "")'
              ),
              (
                  'if(existing!=null)existing.salary.toString():""',
                  'if (existing != null) existing.salary.toString() else ""'
              ),
              (
                  'if(existing != null) existing.salary.toString():""',
                  'if (existing != null) existing.salary.toString() else ""'
              )
          ]

          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new)
                  print("OK: expressão inválida do salário corrigida.")

          # ============================================================
          # SALVAR ARQUIVO CORRIGIDO TEMPORARIAMENTE NO BUILD
          # ============================================================

          p.write_text(s, encoding="utf-8")

          print("")
          print("======================================")
          print("VERIFICANDO CORREÇÕES")
          print("======================================")

          invalid = [
              "setTextColor(text)",
              "setText(if(existing!=null)existing.salary.toString():"")",
              "if(existing!=null)existing.salary.toString():""",
              "if(existing != null) existing.salary.toString():""",
              "        }, 0, 0, 0, dp(10))",
              "        }, 0, 0, 0, dp(12))"
          ]

          for item in invalid:
              if item in s:
                  print("ERRO: trecho inválido ainda encontrado:")
                  print(item)
                  raise SystemExit(1)

          print("Todas as correções foram aplicadas.")
          print("MainActivity.kt será compilado com a correção durante o Build.")
          '

      - name: Configurar AndroidX
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          grep -q '^android.useAndroidX=true' gradle.properties \
            || echo 'android.useAndroidX=true' >> gradle
