name: ControleHoras - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip
          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt
          echo "PROJETO OK"

      - name: Corrigir aplicativo
        shell: python
        run: |
          from pathlib import Path
          import re

          arquivo = Path("ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt")
          codigo = arquivo.read_text(encoding="utf-8")

          print("Linhas originais:", len(codigo.splitlines()))

          # =====================================================
          # CORREÇÕES SIMPLES
          # =====================================================

          codigo = codigo.replace(
              "setTextColor(text)",
              "setTextColor(this@MainActivity.text)"
          )

          codigo = codigo.replace(
              'it.date.endsWith(SimpleDateFormat("MM-yyyy", Locale.US).format(Date()))',
              'it.date.startsWith(SimpleDateFormat("yyyy-MM", Locale.US).format(Date()))'
          )

          codigo = codigo.replace(
              'setText(if(existing!=null)existing.salary.toString():"")',
              'setText(if(existing!=null)existing.salary.toString() else "")'
          )

          codigo = codigo.replace(
              'setText(if(existing != null) existing.salary.toString():"")',
              'setText(if(existing != null) existing.salary.toString() else "")'
          )

          # =====================================================
          # HORÁRIO AUTOMÁTICO
          # =====================================================

          marcador = "    private fun getRecord(empId:Long,date:String):PunchDay{"

          horario = (
              "    private fun normalizeTime(value:String):String{\n"
              "        val digits=value.filter{it.isDigit()}.take(4)\n"
              "        if(digits.length!=4)return \"\"\n"
              "        val hour=digits.substring(0,2).toIntOrNull()?:return \"\"\n"
              "        val minute=digits.substring(2,4).toIntOrNull()?:return \"\"\n"
              "        if(hour !in 0..23)return \"\"\n"
              "        if(minute !in 0..59)return \"\"\n"
              "        return \"%02d:%02d\".format(Locale.US,hour,minute)\n"
              "    }\n"
              "\n"
              "    private fun timeEdit(initial:String=\"\",hintText:String=\"00:00\"):EditText{\n"
              "        val e=EditText(this).apply{\n"
              "            hint=hintText\n"
              "            inputType=2\n"
              "            setSingleLine()\n"
              "            val normalized=normalizeTime(initial)\n"
              "            if(normalized.isNotEmpty())setText(normalized)\n"
              "        }\n"
              "        var changing=false\n"
              "        e.addTextChangedListener(object:android.text.TextWatcher{\n"
              "            override fun beforeTextChanged(s:CharSequence?,start:Int,count:Int,after:Int){}\n"
              "            override fun onTextChanged(s:CharSequence?,start:Int,before:Int,count:Int){}\n"
              "            override fun afterTextChanged(editable:android.text.Editable?){\n"
              "                if(changing)return\n"
              "                val digits=editable?.toString()?.filter{it.isDigit()}?.take(4).orEmpty()\n"
              "                val formatted=when{\n"
              "                    digits.isEmpty()->\"\"\n"
              "                    digits.length<=2->digits\n"
              "                    else->digits.substring(0,2)+\":\"+digits.substring(2)\n"
              "                }\n"
              "                if(formatted!=editable?.toString()){\n"
              "                    changing=true\n"
              "                    e.setText(formatted)\n"
              "                    e.setSelection(e.text.length)\n"
              "                    changing=false\n"
              "                }\n"
              "            }\n"
              "        })\n"
              "        e.setOnFocusChangeListener{_,hasFocus->\n"
              "            if(!hasFocus){\n"
              "                val normalized=normalizeTime(e.text.toString())\n"
              "                if(normalized.isNotEmpty()){\n"
              "                    e.setText(normalized)\n"
              "                    e.setSelection(e.text.length)\n"
              "                }\n"
              "            }\n"
              "        }\n"
              "        return e\n"
              "    }\n"
              "\n"
          )

          if "private fun normalizeTime" not in codigo:
              if marcador not in codigo:
                  raise SystemExit("ERRO: getRecord não encontrado.")
              codigo = codigo.replace(marcador, horario + marcador, 1)

          # =====================================================
          # DURAÇÃO SEMANAL
          # =====================================================

          duracao = (
              "    private fun normalizeDuration(value:String):String{\n"
              "        val digits=value.filter{it.isDigit()}.take(4)\n"
              "        if(digits.length!=4)return \"\"\n"
              "        val hour=digits.substring(0,2).toIntOrNull()?:return \"\"\n"
              "        val minute=digits.substring(2,4).toIntOrNull()?:return \"\"\n"
              "        if(hour !in 0..99)return \"\"\n"
              "        if(minute !in 0..59)return \"\"\n"
              "        return \"%02d:%02d\".format(Locale.US,hour,minute)\n"
              "    }\n"
              "\n"
              "    private fun durationMinutes(value:String):Int{\n"
              "        val v=normalizeDuration(value)\n"
              "        if(v.isBlank())return 0\n"
              "        return try{\n"
              "            val p=v.split(\":\")\n"
              "            p[0].toInt()*60+p[1].toInt()\n"
              "        }catch(_:Exception){0}\n"
              "    }\n"
              "\n"
          )

          if "private fun durationMinutes" not in codigo:
              codigo = codigo.replace(marcador, duracao + marcador, 1)

          # =====================================================
          # VARIÁVEIS SEMANAIS
          # =====================================================

          escala = "    private val scale = linkedMapOf<String, DayScale>()"

          if "private val weekModes" not in codigo:

              if escala not in codigo:
                  raise SystemExit("ERRO: scale não encontrada.")

              codigo = codigo.replace(
                  escala,
                  escala
                  + '\n    private var weeklyTarget:String = "44:00"'
                  + '\n    private val weekModes=linkedMapOf<String,String>()',
                  1
              )

          # =====================================================
          # FUNÇÕES SEMANAIS
          # =====================================================

          semana = (
              "    private fun weekKey(date:Date):String{\n"
              "        val c=Calendar.getInstance().apply{\n"
              "            time=date\n"
              "            set(Calendar.HOUR_OF_DAY,0)\n"
              "            set(Calendar.MINUTE,0)\n"
              "            set(Calendar.SECOND,0)\n"
              "            set(Calendar.MILLISECOND,0)\n"
              "            set(Calendar.DAY_OF_WEEK,Calendar.MONDAY)\n"
              "        }\n"
              "        return SimpleDateFormat(\"yyyy-MM-dd\",Locale.US).format(c.time)\n"
              "    }\n"
              "\n"
              "    private fun modeForDate(date:Date):String{\n"
              "        return weekModes[weekKey(date)] ?: \"MF\"\n"
              "    }\n"
              "\n"
              "    private fun modeForDay(date:Date):Boolean{\n"
              "        val c=Calendar.getInstance().apply{time=date}\n"
              "        val day=c.get(Calendar.DAY_OF_WEEK)\n"
              "        return if(modeForDate(date)==\"MS\"){\n"
              "            day in Calendar.MONDAY..Calendar.SATURDAY\n"
              "        }else{\n"
              "            day in Calendar.MONDAY..Calendar.FRIDAY\n"
              "        }\n"
              "    }\n"
              "\n"
              "    private fun weekLabel(date:Date):String{\n"
              "        val c=Calendar.getInstance().apply{\n"
              "            time=date\n"
              "            set(Calendar.DAY_OF_WEEK,Calendar.MONDAY)\n"
              "        }\n"
              "        val inicio=SimpleDateFormat(\"dd/MM/yyyy\",Locale.US).format(c.time)\n"
              "        c.add(Calendar.DAY_OF_MONTH,6)\n"
              "        val fim=SimpleDateFormat(\"dd/MM/yyyy\",Locale.US).format(c.time)\n"
              "        return \"$inicio até $fim\"\n"
              "    }\n"
              "\n"
              "    private fun modeTitle(mode:String):String{\n"
              "        return if(mode==\"MS\"){\n"
              "            \"Segunda a sábado — 07:20 por dia\"\n"
              "        }else{\n"
              "            \"Segunda a sexta — 08:48 por dia\"\n"
              "        }\n"
              "    }\n"
              "\n"
          )

          if "private fun weekKey" not in codigo:
              codigo = codigo.replace(marcador, semana + marcador, 1)

          # =====================================================
          # CARREGAR CONFIGURAÇÃO SEMANAL
          # =====================================================

          if 'prefs.getString("weekModes","{}")' not in codigo:

              pos = codigo.find("private fun loadData()")

              if pos == -1:
                  pos = codigo.find("fun loadData()")

              if pos == -1:
                  raise SystemExit("ERRO: loadData não encontrado.")

              fim_load = codigo.find(
                  "    private fun saveData",
                  pos
              )

              if fim_load == -1:
                  raise SystemExit("ERRO: saveData não encontrado.")

              trecho = codigo[pos:fim_load]

              inserir = (
                  "\n        weeklyTarget=normalizeDuration("
                  "prefs.getString(\"weeklyTarget\",\"44:00\") ?: \"44:00\""
                  ").ifBlank{\"44:00\"}\n"
                  "\n"
                  "        weekModes.clear()\n"
                  "\n"
                  "        try{\n"
                  "            val savedWeeks=prefs.getString(\"weekModes\",\"{}\") ?: \"{}\"\n"
                  "            val obj=JSONObject(savedWeeks)\n"
                  "            val keys=obj.keys()\n"
                  "            while(keys.hasNext()){\n"
                  "                val key=keys.next()\n"
                  "                weekModes[key]=obj.optString(key,\"MF\")\n"
                  "            }\n"
                  "        }catch(_:Exception){\n"
                  "            weekModes.clear()\n"
                  "        }\n"
              )

              trecho = trecho + inserir

              codigo = codigo[:pos] + trecho + codigo[fim_load:]

          # =====================================================
          # SALVAR CONFIGURAÇÃO SEMANAL
          # =====================================================

          if 'e.putString("weekModes"' not in codigo:

              pos = codigo.find("private fun saveData")

              if pos == -1:
                  raise SystemExit("ERRO: saveData não encontrado.")

              fim_save = codigo.find(
                  "    private fun",
                  pos + 20
              )

              if fim_save == -1:
                  fim_save = len(codigo)

              trecho = codigo[pos:fim_save]

              salvar = (
                  "\n        val weekJson=JSONObject()\n"
                  "\n"
                  "        weekModes.forEach{(key,mode)->\n"
                  "            weekJson.put(key,mode)\n"
                  "        }\n"
                  "\n"
                  "        e.putString(\"weeklyTarget\",weeklyTarget)\n"
                  "        e.putString(\"weekModes\",weekJson.toString())\n"
              )

              pos_apply = trecho.find("e.apply()")

              if pos_apply == -1:
                  raise SystemExit("ERRO: e.apply() não encontrado.")

              trecho = (
                  trecho[:pos_apply]
                  + salvar
                  + trecho[pos_apply:]
              )

              codigo = codigo[:pos] + trecho + codigo[fim_save:]

          # =====================================================
          # EDIÇÃO MANUAL
          # =====================================================

          codigo = codigo.replace(
              'val e=EditText(this).apply{setText(r.punches[index]);hint="HH:mm";inputType=2;setSingleLine()}',
              'val e=timeEdit(r.punches[index],punchNames[index])',
              1
          )

          codigo = codigo.replace(
              'r.punches[index]=e.text.toString();saveData();showPunch()',
              'r.punches[index]=normalizeTime(e.text.toString());saveData();showPunch()',
              1
          )

          codigo = codigo.replace(
              'val fields=r.punches.mapIndexed{i,v->EditText(this).apply{hint=punchNames[i];setText(v);inputType=2;setSingleLine();}}',
              'val fields=r.punches.mapIndexed{i,v->timeEdit(v,punchNames[i])}',
              1
          )

          codigo = codigo.replace(
              'fields.forEachIndexed{i,e->r.punches[i]=e.text.toString()};saveData();showHistory()',
              'fields.forEachIndexed{i,e->r.punches[i]=normalizeTime(e.text.toString())};saveData();showHistory()',
              1
          )

          # =====================================================
          # MINUTES BETWEEN
          # =====================================================

          inicio = codigo.find(
              "    private fun minutesBetween(a:String,b:String):Int{"
          )

          fim = codigo.find(
              "    private fun formatMin",
              inicio
          )

          if inicio == -1 or fim == -1:
              raise SystemExit("ERRO: minutesBetween não encontrada.")

          minutos = (
              "    private fun minutesBetween(a:String,b:String):Int{\n"
              "        val x=normalizeTime(a)\n"
              "        val y=normalizeTime(b)\n"
              "        if(x.isBlank()||y.isBlank())return 0\n"
              "        return try{\n"
              "            val xa=x.split(\":\")\n"
              "            val ya=y.split(\":\")\n"
              "            val inicio=xa[0].toInt()*60+xa[1].toInt()\n"
              "            val fim=ya[0].toInt()*60+ya[1].toInt()\n"
              "            max(0,fim-inicio)\n"
              "        }catch(_:Exception){0}\n"
              "    }\n"
              "\n"
          )

          codigo = codigo[:inicio] + minutos + codigo[fim:]

          # =====================================================
          # FORMAT MIN
          # =====================================================

          inicio = codigo.find(
              "    private fun formatMin"
          )

          if inicio == -1:
              raise SystemExit("ERRO: formatMin não encontrada.")

          fim = codigo.find("\n",inicio)

          codigo = (
              codigo[:inicio]
              + '    private fun formatMin(m:Int):String="%02d:%02d".format(Locale.US,max(0,m)/60,max(0,m)%60)'
              + codigo[fim:]
          )

          # =====================================================
          # CÁLCULO
          # =====================================================

          inicio = codigo.find(
              "    private fun calculate(r:PunchDay):Calc{"
          )

          fim = codigo.find(
              "    private fun minutesBetween",
              inicio
          )

          if inicio == -1 or fim == -1:
              raise SystemExit("ERRO: calculate não encontrada.")

          calculo = (
              "    private fun calculate(r:PunchDay):Calc{\n"
              "\n"
              "        var worked=0\n"
              "\n"
              "        worked+=minutesBetween(r.punches[0],r.punches[1])\n"
              "\n"
              "        val seis=r.punches[3].isNotBlank() || r.punches[4].isNotBlank()\n"
              "\n"
              "        if(seis){\n"
              "            worked+=minutesBetween(r.punches[2],r.punches[3])\n"
              "            worked+=minutesBetween(r.punches[4],r.punches[5])\n"
              "        }else{\n"
              "            worked+=minutesBetween(r.punches[2],r.punches[5])\n"
              "        }\n"
              "\n"
              "        val data=parseIso(r.date)\n"
              "\n"
              "        if(!modeForDay(data)){\n"
              "            return Calc(worked,0,0,worked)\n"
              "        }\n"
              "\n"
              "        val semanal=durationMinutes(weeklyTarget)\n"
              "        val dias=if(modeForDate(data)==\"MS\")6 else 5\n"
              "        val expected=semanal/dias\n"
              "        val extra=max(0,worked-expected)\n"
              "        val faltante=max(0,expected-worked)\n"
              "\n"
              "        return Calc(worked,expected,extra,faltante)\n"
              "    }\n"
              "\n"
          )

          codigo = codigo[:inicio] + calculo + codigo[fim:]

          # =====================================================
          # ESCALA SEMANAL
          # =====================================================

          inicio = codigo.find(
              "    private fun showScale() {"
          )

          fim = codigo.find(
              "    private fun employeeDialog",
              inicio
          )

          if inicio == -1 or fim == -1:
              raise SystemExit("ERRO: showScale não encontrada.")

          escala_semanal = (
              "    private fun showScale(){\n"
              "\n"
              "        val box=page(\"Escala Semanal\")\n"
              "\n"
              "        box.addView(infoCard(\"Carga semanal: 44:00\"))\n"
              "\n"
              "        fun semana(titulo:String,data:Date){\n"
              "\n"
              "            val key=weekKey(data)\n"
              "            val mode=modeForDate(data)\n"
              "            val c=card()\n"
              "\n"
              "            val layout=LinearLayout(this).apply{\n"
              "                orientation=LinearLayout.VERTICAL\n"
              "                setPadding(dp(12),dp(10),dp(12),dp(10))\n"
              "            }\n"
              "\n"
              "            layout.addView(TextView(this).apply{\n"
              "                text=titulo\n"
              "                textSize=18f\n"
              "                setTypeface(null,Typeface.BOLD)\n"
              "                setTextColor(darkBlue)\n"
              "            })\n"
              "\n"
              "            layout.addView(TextView(this).apply{\n"
              "                text=weekLabel(data)\n"
              "                textSize=13f\n"
              "                setTextColor(muted)\n"
              "            })\n"
              "\n"
              "            layout.addView(TextView(this).apply{\n"
              "                text=\"Selecionada: \"+modeTitle(mode)\n"
              "                textSize=15f\n"
              "                setTypeface(null,Typeface.BOLD)\n"
              "                setTextColor(darkBlue)\n"
              "            })\n"
              "\n"
              "            val mf=Button(this).apply{\n"
              "                text=\"Segunda a sexta — 08:48\"\n"
              "                isAllCaps=false\n"
              "            }\n"
              "\n"
              "            mf.setOnClickListener{\n"
              "                weekModes[key]=\"MF\"\n"
              "                saveData()\n"
              "                showScale()\n"
              "            }\n"
              "\n"
              "            val ms=Button(this).apply{\n"
              "                text=\"Segunda a sábado — 07:20\"\n"
              "                isAllCaps=false\n"
              "            }\n"
              "\n"
              "            ms.setOnClickListener{\n"
              "                weekModes[key]=\"MS\"\n"
              "                saveData()\n"
              "                showScale()\n"
              "            }\n"
              "\n"
              "            layout.addView(mf)\n"
              "            layout.addView(ms)\n"
              "            c.addView(layout)\n"
              "\n"
              "            box.addView(c,LinearLayout.LayoutParams(-1,dp(210)).apply{\n"
              "                bottomMargin=dp(10)\n"
              "            })\n"
              "        }\n"
              "\n"
              "        val hoje=Date()\n"
              "\n"
              "        val proxima=Calendar.getInstance().apply{\n"
              "            time=hoje\n"
              "            set(Calendar.DAY_OF_WEEK,Calendar.MONDAY)\n"
              "            add(Calendar.DAY_OF_MONTH,7)\n"
              "        }.time\n"
              "\n"
              "        semana(\"Semana atual\",hoje)\n"
              "        semana(\"Próxima semana\",proxima)\n"
              "\n"
              "        box.addView(infoCard(\n"
              "            \"Segunda a sexta = 08:48 por dia. \" +\n"
              "            \"Segunda a sábado = 07:20 por dia.\"\n"
              "        ))\n"
              "    }\n"
              "\n"
          )

          codigo = (
              codigo[:inicio]
              + escala_semanal
              + codigo[fim:]
          )

          # =====================================================
          # VALIDAÇÃO
          # =====================================================

          obrigatorias = [
              "private fun normalizeTime",
              "private fun timeEdit",
              "private fun normalizeDuration",
              "private fun durationMinutes",
              "private fun minutesBetween",
              "private fun formatMin",
              "private fun calculate(r:PunchDay):Calc",
              "private val weekModes",
              "private fun weekKey",
              "private fun modeForDate",
              "private fun modeForDay",
              "Segunda a sexta — 08:48",
              "Segunda a sábado — 07:20",
              "Semana atual",
              "Próxima semana"
          ]

          for item in obrigatorias:
              if item not in codigo:
                  raise SystemExit(
                      "ERRO FINAL: " + item
                  )

          if codigo.count("{") != codigo.count("}"):
              raise SystemExit(
                  "ERRO FINAL: chaves Kotlin diferentes."
              )

          arquivo.write_text(
              codigo,
              encoding="utf-8"
          )

          print("================================")
          print("MAINACTIVITY CORRIGIDA")
          print("================================")
          print("Registro: OK")
          print("Adição manual: OK")
          print("Horário automático: OK")
          print("Somatório: OK")
          print("4/6 batidas: OK")
          print("Escala semanal: OK")
          print("================================")

      - name: Validar código
        shell: bash
        run: |
          set -e

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          test -s "$FILE"

          grep -q "private fun normalizeTime" "$FILE"
          grep -q "private fun minutesBetween" "$FILE"
          grep -q "private fun calculate" "$FILE"
          grep -q "private fun weekKey" "$FILE"
          grep -q "Segunda a sexta" "$FILE"
          grep -q "Segunda a sábado" "$FILE"

          echo "CÓDIGO VALIDADO"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q gradle-8.11.1-bin.zip

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          export PATH="$PWD/gradle-8.11.1/bin:$PATH"

          gradle --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e
          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug --no-daemon --stacktrace

          test -s app/build/outputs/apk/debug/app-debug.apk

          echo "APK GERADO"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

          echo "APK ÍNTEGRO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
