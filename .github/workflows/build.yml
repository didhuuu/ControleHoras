name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name, next_name):
              start = workflow.index(
                  f"      - name: {name}"
              )

              end = workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              pos = (
                  block.index(marker)
                  + len(marker)
              )

              lines = block[pos:].splitlines()

              return "\n".join(
                  line[10:]
                  if line.startswith("          ")
                  else line
                  for line in lines
              ) + "\n"

          scripts = [
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for i, script in enumerate(scripts):

              p = (
                  Path(tempfile.gettempdir())
                  / f"base70_{i}.py"
              )

              p.write_text(
                  script,
                  encoding="utf-8"
              )

              subprocess.run(
                  [
                      "python",
                      str(p)
                  ],
                  check=True
              )

          print("BASE 70 APLICADA")

      - name: Aplicar funcionalidades da versão 80
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          start = workflow.index(
              "      - name: Aplicar correções finais da Base 70, edição por rolagem e ícone"
          )

          end = workflow.index(
              "      - name: Validar código e ícone",
              start
          )

          block = workflow[start:end]

          marker = "        run: |\n"

          pos = (
              block.index(marker)
              + len(marker)
          )

          lines = block[pos:].splitlines()

          script = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in lines
          ) + "\n"

          p = (
              Path(tempfile.gettempdir())
              / "funcionalidades.py"
          )

          p.write_text(
              script,
              encoding="utf-8"
          )

          subprocess.run(
              [
                  "python",
                  str(p)
              ],
              check=True
          )

          print(
              "FUNCIONALIDADES DA VERSÃO 80 APLICADAS"
          )

      - name: Recuperar ícone aprovado da versão 80
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          ROOT="$PWD/ControleHoras"

          ICON="$ROOT/app/src/main/res/drawable/controlehoras_icon.jpg"

          mkdir -p "$(dirname "$ICON")"

          ARTIFACT="/tmp/controlehoras80.zip"

          APKDIR="/tmp/controlehoras80"

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/didhuuu/ControleHoras/actions/artifacts/11068205148/zip" \
            -o "$ARTIFACT"

          test -s "$ARTIFACT"

          rm -rf "$APKDIR"

          mkdir -p "$APKDIR"

          unzip -q -o \
            "$ARTIFACT" \
            -d "$APKDIR"

          APK="$APKDIR/app-debug.apk"

          test -s "$APK"

          rm -rf /tmp/controlehoras80-apk

          mkdir -p /tmp/controlehoras80-apk

          unzip -q -o \
            "$APK" \
            -d /tmp/controlehoras80-apk

          FOUND="$(
            find /tmp/controlehoras80-apk/res \
              -type f \
              -name 'controlehoras_icon.jpg' \
              | head -n 1
          )"

          test -n "$FOUND"

          cp "$FOUND" "$ICON"

          test -s "$ICON"

          echo "ÍCONE APROVADO RECUPERADO"

      - name: Corrigir manifesto e validar
        shell: python
        run: |
          from pathlib import Path

          root = Path("ControleHoras")

          manifest = (
              root /
              "app/src/main/AndroidManifest.xml"
          )

          src = (
              root /
              "app/src/main/java/com/didhuuu/"
              "controlehoras/MainActivity.kt"
          )

          icon = (
              root /
              "app/src/main/res/drawable/"
              "controlehoras_icon.jpg"
          )

          m = manifest.read_text(
              encoding="utf-8"
          )

          if (
              'android:icon="@drawable/controlehoras_icon"'
              not in m
          ):

              m = m.replace(
                  "<application",
                  '<application\n'
                  '        android:icon="@drawable/controlehoras_icon"\n'
                  '        android:roundIcon="@drawable/controlehoras_icon"',
                  1
              )

              manifest.write_text(
                  m,
                  encoding="utf-8"
              )

          for p in (
              src,
              icon
          ):

              if (
                  not p.exists()
                  or p.stat().st_size == 0
              ):

                  raise SystemExit(
                      "ERRO: arquivo ausente: "
                      + str(p)
                  )

          source = src.read_text(
              encoding="utf-8"
          )

          required = (
              "extra2Enabled",
              "showManualWheel",
              "showEditWheel",
              "nextPunchIndex",
              "punchNames",
              "WindowCompat.setDecorFitsSystemWindows"
          )

          for term in required:

              if term not in source:

                  raise SystemExit(
                      "ERRO: recurso ausente: "
                      + term
                  )

          if "Button(context)" in source:

              raise SystemExit(
                  "ERRO: Button(context) encontrado"
              )

          print("VALIDAÇÃO OK")

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

          echo "APK GERADO COM SUCESSO"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
