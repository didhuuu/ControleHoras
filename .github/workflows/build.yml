              if anchor not in code:
                  raise SystemExit(
                      "ERRO: scale.clear não encontrado"
                  )

              load_block = """        extra2Enabled.clear()
          extra2ReturnEnabled.clear()
          try{
              val ja=JSONArray(
                  prefs.getString(
                      "extra2Enabled",
                      "[]"
                  ) ?: "[]"
              )

              for(i in 0 until ja.length()){
                  extra2Enabled.add(
                      ja.optString(i)
                  )
              }

              val jb=JSONArray(
                  prefs.getString(
                      "extra2ReturnEnabled",
