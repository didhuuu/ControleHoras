name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

      # ============================================================
      # BASE 70
      # ============================================================

      - name: Aplicar Base 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=60
          ).read().decode("utf-8")

          def extract_step(name, next_name):
              start_marker = "      - name: " + name
              end_marker = "      - name: " + next_name

              if start_marker not in workflow:
                  raise SystemExit(
                      "Etapa Base 70 não encontrada: " + name
                  )

              start = workflow.index(start_marker)
              end = workflow.index(end_marker, start)

              block = workflow[start:end]
              marker = "        run: |\n"

              if marker not in block:
                  raise SystemExit(
                      "run não encontrado: " + name
                  )

              pos = block.index(marker) + len(marker)

              result = []

              for line in block[pos:].splitlines():
                  if line.startswith("          "):
                      result.append(line[10:])
                  else:
                      result.append(line)

              return "\n".join(result).rstrip() + "\n"

          scripts = [
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for number, script in enumerate(scripts):
              path = (
                  Path(tempfile.gettempdir())
                  / f"base70_{number}.py"
              )

              path.write_text(
                  script,
                  encoding="utf-8"
              )

              compile(
                  script,
                  str(path),
                  "exec"
              )

              subprocess.run(
                  ["python", str(path)],
                  check=True
              )

          print("BASE 70 APLICADA")
          print("ESCALA PRESERVADA")

      # ============================================================
      # VERSÃO 80
      # ============================================================

      - name: Aplicar correções da versão 80
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=60
          ).read().decode("utf-8")

          start_marker = (
              "      - name: "
              "Aplicar correções finais da Base 70, "
              "edição por rolagem e ícone"
          )

          end_marker = (
              "      - name: Validar código e ícone"
          )

          if start_marker not in workflow:
              raise SystemExit(
                  "Etapa da versão 80 não encontrada."
              )

          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start)

          block = workflow[start:end]
          marker = "        run: |\n"

          if marker not in block:
              raise SystemExit(
                  "run da versão 80 não encontrado."
              )

          pos = block.index(marker) + len(marker)

          lines = block[pos:].splitlines()
          script_lines = []

          for line in lines:
              if line.startswith("          "):
                  script_lines.append(line[10:])
              else:
                  script_lines.append(line)

          script = (
              "\n".join(script_lines).rstrip()
              + "\n"
          )

          path = (
              Path(tempfile.gettempdir())
              / "versao80.py"
          )

          path.write_text(
              script,
              encoding="utf-8"
          )

          compile(
              script,
              str(path),
              "exec"
          )

          subprocess.run(
              ["python", str(path)],
              check=True
          )

          print("VERSÃO 80 APLICADA")

      # ============================================================
      # CORRIGIR CARTÃO
      # ============================================================

      - name: Corrigir cartão estruturalmente
        shell: python
        run: |
          from pathlib import Path

          src = Path(
              "ControleHoras/"
              "app/src/main/java/com/didhuuu/"
              "controlehoras/MainActivity.kt"
          )

          code = src.read_text(
              encoding="utf-8"
          )

          if "import android.view.ViewGroup" not in code:
              package_end = code.find("\n")
              code = (
                  code[:package_end + 1]
                  + "import android.view.ViewGroup\n"
                  + code[package_end + 1:]
              )

          target = (
              "box.addView(\n"
              "                      card().apply"
          )

          start = code.find(target)

          if start < 0:
              if (
                  "val employeeCard=" in code
                  and
                  "bottomMargin=dp(10)" in code
              ):
                  print("CARTÃO JÁ CORRIGIDO")
              else:
                  raise SystemExit(
                      "ERRO: cartão de funcionário não encontrado."
                  )
          else:

              open_paren = code.find(
                  "(",
                  start
              )

              depth = 0
              quote = None
              escaped = False
              end = -1
              i = open_paren

              while i < len(code):

                  ch = code[i]

                  if quote is not None:

                      if escaped:
                          escaped = False

                      elif ch == "\\":
                          escaped = True

                      elif ch == quote:
                          quote = None

                  else:

                      if ch == '"' or ch == "'":
                          quote = ch

                      elif ch == "(":
                          depth += 1

                      elif ch == ")":
                          depth -= 1

                          if depth == 0:
                              end = i
                              break

                  i += 1

              if end < 0:
                  raise SystemExit(
                      "ERRO: fechamento do cartão não encontrado."
                  )

              original = code[
                  start:end + 1
              ]

              card_pos = original.find(
                  "card().apply"
              )

              if card_pos < 0:
                  raise SystemExit(
                      "ERRO: card().apply não encontrado."
                  )

              card_expression = original[
                  card_pos:
              ]

              replacement = (
                  "val employeeCard=("
                  + card_expression
                  + ") as ViewGroup\n\n"
                  "                  box.addView(\n"
                  "                      employeeCard,\n"
                  "                      LinearLayout.LayoutParams(\n"
                  "                          -1,\n"
                  "                          -2\n"
                  "                      ).apply{\n"
                  "                          bottomMargin=dp(10)\n"
                  "                      }\n"
                  "                  )"
              )

              code = (
                  code[:start]
                  + replacement
                  + code[end + 1:]
              )

              src.write_text(
                  code,
                  encoding="utf-8"
              )

              print("CARTÃO CORRIGIDO")

      # ============================================================
      # SOM
      # ============================================================

      - name: Criar som da roleta
        shell: python
        run: |
          from pathlib import Path
          import wave
          import math
          import struct

          raw = Path(
              "ControleHoras/"
              "app/src/main/res/raw"
          )

          raw.mkdir(
              parents=True,
              exist_ok=True
          )

          filename = (
              raw / "roller_click.wav"
          )

          rate = 44100
          duration = 0.035
          total = int(rate * duration)

          data = bytearray()

          for i in range(total):

              t = i / rate
              envelope = 1.0 - (i / total)

              value = int(
                  14000
                  * envelope
                  * math.sin(
                      2
                      * math.pi
                      * 1800
                      * t
                  )
              )

              data.extend(
                  struct.pack(
                      "<h",
                      value
                  )
              )

          with wave.open(
              str(filename),
              "wb"
          ) as wav:

              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)
              wav.writeframes(bytes(data))

          test = filename.stat().st_size

          if test <= 44:
              raise SystemExit(
                  "Som inválido."
              )

          print("SOM CRIADO")

      # ============================================================
      # ROLETA
      #
      # Os códigos Kotlin são comprimidos em base64.
      # Isso evita completamente o problema de indentação YAML.
      # ============================================================

      - name: Instalar roleta azul neon
        shell: python
        run: |
          from pathlib import Path
          import base64
          import gzip

          src = Path(
              "ControleHoras/"
              "app/src/main/java/com/didhuuu/"
              "controlehoras/MainActivity.kt"
          )

          code = src.read_text(
              encoding="utf-8"
          )

          def dec(value):
              return gzip.decompress(
                  base64.b64decode(value)
              ).decode("utf-8")

          imports = [
              "import android.content.Context",
              "import android.graphics.Canvas",
              "import android.graphics.Color",
              "import android.graphics.Paint",
              "import android.graphics.RectF",
              "import android.graphics.Shader",
              "import android.graphics.LinearGradient",
              "import android.media.AudioAttributes",
              "import android.media.SoundPool",
              "import android.view.MotionEvent",
              "import android.view.View"
          ]

          first_line = code.find("\n")

          extra = ""

          for item in imports:
              if item not in code:
                  extra += item + "\n"

          if extra:
              code = (
                  code[:first_line + 1]
                  + extra
                  + code[first_line + 1:]
              )

          code = code.replace(
              "import android.widget.NumberPicker",
              ""
          )

          wheel = dec(
              ""
          )

          dialog = dec(
              ""
          )

          edit = dec(
              ""
          )

          manual = dec(
              ""
          )

          register = dec(
              ""
          )

          def replace_method(source, signature, replacement):

              start = source.find(signature)

              if start < 0:
                  raise SystemExit(
                      "Método não encontrado: " + signature
                  )

              opening = source.find("{", start)

              if opening < 0:
                  raise SystemExit(
                      "Abertura não encontrada: " + signature
                  )

              depth = 0
              quote = None
              escaped = False
              i = opening

              while i < len(source):

                  ch = source[i]

                  if quote is not None:

                      if escaped:
                          escaped = False

                      elif ch == "\\":
                          escaped = True

                      elif ch == quote:
                          quote = None

                  else:

                      if ch == '"' or ch == "'":
                          quote = ch

                      elif ch == "{":
                          depth += 1

                      elif ch == "}":

                          depth -= 1

                          if depth == 0:

                              return (
                                  source[:start]
                                  + replacement
                                  + source[i + 1:]
                              )

                  i += 1

              raise SystemExit(
                  "Fechamento não encontrado: " + signature
              )

          if "ControleHorasTimeWheelView" not in code:

              anchor = code.find(
                  "class MainActivity"
              )

              if anchor < 0:
                  raise SystemExit(
                      "MainActivity não encontrada."
                  )

              code = (
                  code[:anchor]
                  + wheel
                  + "\n"
                  + code[anchor:]
              )

          if "showControleHorasWheelDialog" not in code:

              anchor = code.find(
                  "    private fun showEditWheel("
              )

              if anchor < 0:
                  raise SystemExit(
                      "showEditWheel não encontrado."
                  )

              code = (
                  code[:anchor]
                  + dialog
                  + "\n"
                  + code[anchor:]
              )

          code = replace_method(
              code,
              "    private fun showEditWheel(",
              edit
          )

          code = replace_method(
              code,
              "    private fun showManualWheel(",
              manual
          )

          code = replace_method(
              code,
              "    private fun registerPunch(",
              register
          )

          if "NumberPicker" in code:
              raise SystemExit(
                  "ERRO: NumberPicker ainda existe."
              )

          required = [
              "ControleHorasTimeWheelView",
              "showControleHorasWheelDialog",
              "showEditWheel",
              "showManualWheel",
              "registerPunch",
              "nextPunchIndex",
              "punchNames",
              "selectedPunchDate"
          ]

          for item in required:
              if item not in code:
                  raise SystemExit(
                      "ERRO: recurso ausente: " + item
                  )

          src.write_text(
              code,
              encoding="utf-8"
          )

          print("ROLETA AZUL NEON INSTALADA")
          print("EDIÇÃO POR ROLAGEM INSTALADA")
          print("REGISTRO MANUAL INSTALADO")

      # ============================================================
      # VALIDAÇÃO FINAL
      # ============================================================

      - name: Validar código final
        shell: bash
        run: |
          set -e

          SRC="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          SOUND="ControleHoras/app/src/main/res/raw/roller_click.wav"

          test -s "$SRC"
          test -s "$SOUND"

          grep -q "ControleHorasTimeWheelView" "$SRC"
          grep -q "showControleHorasWheelDialog" "$SRC"
          grep -q "showEditWheel" "$SRC"
          grep -q "showManualWheel" "$SRC"
          grep -q "registerPunch" "$SRC"
          grep -q "nextPunchIndex" "$SRC"
          grep -q "punchNames" "$SRC"
          grep -q "selectedPunchDate" "$SRC"
          grep -q "extra2Enabled" "$SRC"

          if grep -q "NumberPicker" "$SRC"; then
            echo "ERRO: NumberPicker encontrado."
            exit 1
          fi

          echo "CÓDIGO FINAL VALIDADO"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e
          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t \
            "$APK" \
            >/dev/null

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
