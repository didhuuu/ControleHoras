name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Preservar ícone original da Base
        shell: bash
        run: |
          set -e

          if [ -f "ControleHoras/app/src/main/res/drawable/controlehoras_icon.jpg" ]; then
            cp \
              "ControleHoras/app/src/main/res/drawable/controlehoras_icon.jpg" \
              /tmp/controlehoras_icon_original.jpg

            echo "Ícone original preservado"
          else
            echo "Ícone original específico não encontrado; mantendo o recurso da Base"
          fi

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name, next_name):

              start = workflow.index(
                  f"      - name: {name}"
              )

              end = workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              pos = (
                  block.index(marker)
                  + len(marker)
              )

              lines = block[pos:].splitlines()

              return "\n".join(
                  line[10:]
                  if line.startswith("          ")
                  else line
                  for line in lines
              ) + "\n"

          scripts = [
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for i, script in enumerate(scripts):

              p = (
                  Path(tempfile.gettempdir())
                  / f"base70_{i}.py"
              )

              p.write_text(
                  script,
                  encoding="utf-8"
              )

              subprocess.run(
                  ["python", str(p)],
                  check=True
              )

          print(
              "BASE 70 APLICADA SEM ALTERAR A ESCALA"
          )

      - name: Aplicar funcionalidades da versão 80
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          start = workflow.index(
              "      - name: Aplicar correções finais da Base 70, edição por rolagem e ícone"
          )

          end = workflow.index(
              "      - name: Validar código e ícone",
              start
          )

          block = workflow[start:end]

          marker = "        run: |\n"

          pos = (
              block.index(marker)
              + len(marker)
          )

          lines = block[pos:].splitlines()

          script = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in lines
          ) + "\n"

          p = (
              Path(tempfile.gettempdir())
              / "funcionalidades.py"
          )

          p.write_text(
              script,
              encoding="utf-8"
          )

          subprocess.run(
              ["python", str(p)],
              check=True
          )

          print(
              "FUNCIONALIDADES DA VERSÃO 80 APLICADAS"
          )

      - name: Restaurar ícone original
        shell: bash
        run: |
          set -e

          if [ -f /tmp/controlehoras_icon_original.jpg ]; then

            cp \
              /tmp/controlehoras_icon_original.jpg \
              "ControleHoras/app/src/main/res/drawable/controlehoras_icon.jpg"

            echo "Ícone original restaurado"

          fi

      - name: Criar som mecânico da roleta
        shell: python
        run: |
          from pathlib import Path
          import wave
          import math
          import struct

          raw = Path(
              "ControleHoras/app/src/main/res/raw"
          )

          raw.mkdir(
              parents=True,
              exist_ok=True
          )

          filename = (
              raw /
              "roller_click.wav"
          )

          rate = 44100
          duration = 0.035
          frames = []

          for i in range(
              int(rate * duration)
          ):

              t = i / rate

              a = (
                  0.45
                  * math.exp(-85 * t)
                  * math.sin(
                      2
                      * math.pi
                      * 1850
                      * t
                  )
              )

              b = (
                  0.22
                  * math.exp(-130 * t)
                  * math.sin(
                      2
                      * math.pi
                      * 3200
                      * t
                  )
              )

              value = max(
                  -1.0,
                  min(
                      1.0,
                      a + b
                  )
              )

              frames.append(
                  struct.pack(
                      "<h",
                      int(
                          value * 32767
                      )
                  )
              )

          with wave.open(
              str(filename),
              "wb"
          ) as wav:

              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)

              wav.writeframes(
                  b"".join(frames)
              )

          print(
              "SOM DA ROLETA CRIADO"
          )

      - name: Corrigir tela e instalar roleta azul neon 3D
        shell: python
        run: |
          from pathlib import Path
          import base64
          import zlib

          root = Path(
              "ControleHoras"
          )

          src = root / (
              "app/src/main/java/"
              "com/didhuuu/controlehoras/"
              "MainActivity.kt"
          )

          wheel = root / (
              "app/src/main/java/"
              "com/didhuuu/controlehoras/"
              "TimeWheelView.kt"
          )

          code = src.read_text(
              encoding="utf-8"
          )

          def matching(
              text,
              start,
              op="{",
              cl="}"
          ):

              depth = 0
              quote = False
              triple = False
              esc = False

              i = start

              while i < len(text):

                  c = text[i]

                  if quote:

                      if esc:
                          esc = False

                      elif c == "\\":
                          esc = True

                      elif (
                          triple
                          and text.startswith(
                              '"""',
                              i
                          )
                      ):
                          quote = False
                          triple = False
                          i += 2

                      elif (
                          not triple
                          and c == '"'
                      ):
                          quote = False

                      i += 1
                      continue

                  if c == '"':

                      if text.startswith(
                          '"""',
                          i
                      ):
                          quote = True
                          triple = True
                          i += 3
                          continue

                      quote = True
                      i += 1
                      continue

                  if c == op:
                      depth += 1

                  elif c == cl:

                      depth -= 1

                      if depth == 0:
                          return i

                  i += 1

              raise RuntimeError(
                  "delimitador não encontrado"
              )

          # ============================================================
          # CORRIGIR CARTÃO DE FUNCIONÁRIO
          # ============================================================

          p = code.find(
              "box.addView(\n"
              "                      card().apply{"
          )

          if p >= 0:

              op = code.find(
                  "(",
                  p
              )

              end = (
                  matching(
                      code,
                      op,
                      "(",
                      ")"
                  )
                  + 1
              )

              call = code[p:end]

              body_start = (
                  call.find(
                      "card().apply{"
                  )
                  + len(
                      "card().apply{"
                  )
              )

              tail = call.rfind(
                  "},"
              )

              if (
                  body_start <= 0
                  or tail <= body_start
              ):
                  raise SystemExit(
                      "ERRO: cartão estrutural não reconhecido"
                  )

              body = call[
                  body_start:tail
              ].rstrip()

              replacement = (
                  "                  val employeeCard=card().apply{"
                  + body
                  + "\n"
                  "                  }\n\n"
                  "                  box.addView(\n"
                  "                      employeeCard,\n"
                  "                      LinearLayout.LayoutParams(-1,-2).apply{\n"
                  "                          bottomMargin=dp(10)\n"
                  "                      }\n"
                  "                  )"
              )

              code = (
                  code[:p]
                  + replacement
                  + code[end:]
              )

          # ============================================================
          # INTERVALO 2 SEPARADO
          # ============================================================

          extra_start = code.find(
              'box.addView(TextView(this).apply{text="INTERVALO 2 (OPCIONAL)"'
          )

          calc_pos = code.find(
              "                  val calc=calculate(rec)",
              extra_start
          )

          if (
              extra_start >= 0
              and calc_pos >= 0
          ):

              extra_b64 = ""

              extra = zlib.decompress(
                  base64.b64decode(
                      extra_b64
                  )
              ).decode(
                  "utf-8"
              )

              code = (
                  code[:extra_start]
                  + extra
                  + "\n\n"
                  + code[calc_pos:]
              )

          # ============================================================
          # PRÓXIMA BATIDA
          # ============================================================

          next_b64 = "eNpTUFBQKCjKLEssSVVIK81TyEutKAkozUvO8MxLSa3QKLICc1wSK3WAEkWJVk75+TmpiXmaVp55JdVcClCQmaZRpFcAUplaHG0Qq5dZ7JSTmJetoampUJRaUlqUp2CAXa0hNrWG2NUaYVNrhKwW7EQFNTUFhCZjbJqMCWgywabJBLurTLGpNYWrhQroQvxUCwA3MW6M"

          next_method = zlib.decompress(
              base64.b64decode(
                  next_b64
              )
          ).decode(
              "utf-8"
          )

          ns = code.find(
              "    private fun nextPunchIndex("
          )

          if ns < 0:
              raise SystemExit(
                  "ERRO: nextPunchIndex não encontrado"
              )

          nb = code.find(
              "{",
              ns
          )

          ne = (
              matching(
                  code,
                  nb
              )
              + 1
          )

          code = (
              code[:ns]
              + next_method
              + "\n\n"
              + code[ne:]
          )

          # ============================================================
          # SUBSTITUIR TODA A EDIÇÃO ANTIGA
          # ============================================================

          ms = code.find(
              "    private fun showEditWheel("
          )

          mc = code.find(
              "    private fun calculate(",
              ms
          )

          if (
              ms < 0
              or mc < 0
          ):
              raise SystemExit(
                  "ERRO: bloco antigo de edição não encontrado"
              )

          methods_b64 = ""

          methods = zlib.decompress(
              base64.b64decode(
                  methods_b64
              )
          ).decode(
              "utf-8"
          )

          code = (
              code[:ms]
              + methods
              + "\n\n"
              + code[mc:]
          )

          code = code.replace(
              "import android.widget.NumberPicker\n",
              ""
          )

          code = code.replace(
              "import android.widget.NumberPicker\r\n",
              ""
          )

          # ============================================================
          # NOMES DAS SEIS POSIÇÕES
          # ============================================================

          if "private val punchNames" not in code:

              anchor = code.find(
                  "class MainActivity"
              )

              if anchor < 0:
                  raise SystemExit(
                      "ERRO: MainActivity não encontrada"
                  )

              names = (
                  "    private val punchNames=arrayOf<String>(\n"
                  "        \"Entrada\",\n"
                  "        \"Saída\",\n"
                  "        \"Retorno\",\n"
                  "        \"Saída intervalo 2\",\n"
                  "        \"Retorno intervalo 2\",\n"
                  "        \"Saída\"\n"
                  "    )\n\n"
              )

              code = (
                  code[:anchor]
                  + names
                  + code[anchor:]
              )

          # ============================================================
          # SEM DSR
          # ============================================================

          if "DSR" in code.upper():
              raise SystemExit(
                  "ERRO: DSR encontrado; esta versão não usa DSR"
              )

          # ============================================================
          # SEM NUMBERPICKER
          # ============================================================

          if "NumberPicker" in code:
              raise SystemExit(
                  "ERRO: NumberPicker ainda presente"
              )

          # ============================================================
          # ROLETAS
          # ============================================================

          wheel_b64 = ""

          wheel_code = zlib.decompress(
              base64.b64decode(
                  wheel_b64
              )
          ).decode(
              "utf-8"
          )

          wheel.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          wheel.write_text(
              wheel_code,
              encoding="utf-8"
          )

          src.write_text(
              code,
              encoding="utf-8"
          )

          if "private fun showTimeWheelDialog(" not in code:
              raise SystemExit(
                  "ERRO: showTimeWheelDialog não instalado"
              )

          if "private fun showEditWheel(" not in code:
              raise SystemExit(
                  "ERRO: Entrada/edição por roleta não instalada"
              )

          if "private fun showManualWheel(" not in code:
              raise SystemExit(
                  "ERRO: registro manual por roleta não instalado"
              )

          if "private fun registerPunch(" not in code:
              raise SystemExit(
                  "ERRO: registro da batida não instalado"
              )

          print(
              "ROLETA AZUL/NEON 3D INSTALADA"
          )

          print(
              "ENTRADA EDITÁVEL + REGISTRO MANUAL + INTERVALO 2 SEPARADO"
          )

      - name: Validar projeto antes do Gradle
        shell: bash
        run: |
          set -e

          SRC="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          WHEEL="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/TimeWheelView.kt"
          SOUND="ControleHoras/app/src/main/res/raw/roller_click.wav"

          test -s "$SRC" || { echo "ERRO: MainActivity.kt não encontrado"; exit 1; }
          test -s "$WHEEL" || { echo "ERRO: TimeWheelView.kt não encontrado"; exit 1; }
          test -s "$SOUND" || { echo "ERRO: roller_click.wav não encontrado"; exit 1; }

          grep -q "TimeWheelView" "$SRC" || { echo "ERRO: TimeWheelView ausente"; exit 1; }
          grep -q "showTimeWheelDialog\|showControleHorasWheelDialog" "$SRC" || { echo "ERRO: diálogo da roleta ausente"; exit 1; }
          grep -q "showManualWheel" "$SRC" || { echo "ERRO: registro manual ausente"; exit 1; }
          grep -q "showEditWheel" "$SRC" || { echo "ERRO: edição pela roleta ausente"; exit 1; }
          grep -q "registerPunch" "$SRC" || { echo "ERRO: registerPunch ausente"; exit 1; }
          grep -q "punchNames" "$SRC" || { echo "ERRO: punchNames ausente"; exit 1; }
          grep -q "extra2Enabled" "$SRC" || { echo "ERRO: Intervalo 2 ausente"; exit 1; }

          if grep -q "NumberPicker" "$SRC"; then
            echo "ERRO: NumberPicker ainda presente"
            exit 1
          fi

          if grep -q "Esse registro ainda está vazio" "$SRC"; then
            echo "ERRO: mensagem antiga encontrada"
            exit 1
          fi

          echo "VALIDAÇÃO PRÉ-GRADLE OK"
          echo "A base e as funcionalidades chegaram até aqui."
          echo "Agora o Gradle fará a validação real do Kotlin."

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

          echo "APK GERADO COM SUCESSO"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t \
            "$APK" \
            >/dev/null

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
