                  val k=extraKey(empId,date)

                  if(value)
                      extra2Enabled.add(k)
                  else{
                      extra2Enabled.remove(k)
                      extra2ReturnEnabled.remove(k)
                  }

                  saveData()
              }

              private fun setExtraReturnEnabled(
                  empId:Long,
                  date:String,
                  value:Boolean
