name: ControleHoras APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt
          echo "PROJETO EXTRAIDO COM SUCESSO"

      - name: Corrigir MainActivity
        shell: python
        run: |
          from pathlib import Path

          p = Path("ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt")
          s = p.read_text(encoding="utf-8")

          # =====================================================
          # CORRECOES BASICAS
          # =====================================================

          s = s.replace(
              "setTextColor(text)",
              "setTextColor(this@MainActivity.text)"
          )

          s = s.replace(
              'it.date.endsWith(SimpleDateFormat("MM-yyyy", Locale.US).format(Date()))',
              'it.date.startsWith(SimpleDateFormat("yyyy-MM", Locale.US).format(Date()))'
          )

          # =====================================================
          # NORMALIZAR HORARIO
          # =====================================================

          marker = "    private fun getRecord(empId:Long,date:String):PunchDay{"

          if "private fun normalizeTime" not in s:

              if marker not in s:
                  raise SystemExit("ERRO: getRecord nao encontrado")

              add = "\n".join([
                  "    private fun normalizeTime(value:String):String{",
                  "        val digits=value.filter{it.isDigit()}.take(4)",
                  "        if(digits.length!=4)return \"\"",
                  "        val h=digits.substring(0,2).toIntOrNull()?:return \"\"",
                  "        val m=digits.substring(2,4).toIntOrNull()?:return \"\"",
                  "        if(h !in 0..23)return \"\"",
                  "        if(m !in 0..59)return \"\"",
                  "        return \"%02d:%02d\".format(Locale.US,h,m)",
                  "    }",
                  "",
                  "    private fun timeEdit(initial:String=\"\",hintText:String=\"00:00\"):EditText{",
                  "        val e=EditText(this).apply{",
                  "            hint=hintText",
                  "            inputType=2",
                  "            setSingleLine()",
                  "            val n=normalizeTime(initial)",
                  "            if(n.isNotEmpty())setText(n)",
                  "        }",
                  "        var changing=false",
                  "        e.addTextChangedListener(object:android.text.TextWatcher{",
                  "            override fun beforeTextChanged(s:CharSequence?,start:Int,count:Int,after:Int){}",
                  "            override fun onTextChanged(s:CharSequence?,start:Int,before:Int,count:Int){}",
                  "            override fun afterTextChanged(e2:android.text.Editable?){",
                  "                if(changing)return",
                  "                val d=e2?.toString()?.filter{it.isDigit()}?.take(4).orEmpty()",
                  "                val f=when{",
                  "                    d.isEmpty()->\"\"",
                  "                    d.length<=2->d",
                  "                    else->d.substring(0,2)+\":\"+d.substring(2)",
                  "                }",
                  "                if(f!=e2?.toString()){",
                  "                    changing=true",
                  "                    e.setText(f)",
                  "                    e.setSelection(e.text.length)",
                  "                    changing=false",
                  "                }",
                  "            }",
                  "        })",
                  "        e.setOnFocusChangeListener{_,hasFocus->",
                  "            if(!hasFocus){",
                  "                val n=normalizeTime(e.text.toString())",
                  "                if(n.isNotEmpty()){",
                  "                    e.setText(n)",
                  "                    e.setSelection(e.text.length)",
                  "                }",
                  "            }",
                  "        }",
                  "        return e",
                  "    }",
                  ""
              ])

              s = s.replace(marker, add + marker, 1)

          # =====================================================
          # DURACAO 44:00
          # =====================================================

          if "private fun durationMinutes" not in s:

              add = "\n".join([
                  "    private fun normalizeDuration(value:String):String{",
                  "        val d=value.filter{it.isDigit()}.take(4)",
                  "        if(d.length!=4)return \"\"",
                  "        val h=d.substring(0,2).toIntOrNull()?:return \"\"",
                  "        val m=d.substring(2,4).toIntOrNull()?:return \"\"",
                  "        if(h !in 0..99)return \"\"",
                  "        if(m !in 0..59)return \"\"",
                  "        return \"%02d:%02d\".format(Locale.US,h,m)",
                  "    }",
                  "",
                  "    private fun durationMinutes(value:String):Int{",
                  "        val v=normalizeDuration(value)",
                  "        if(v.isBlank())return 0",
                  "        return try{",
                  "            val x=v.split(\":\")",
                  "            x[0].toInt()*60+x[1].toInt()",
                  "        }catch(_:Exception){0}",
                  "    }",
                  ""
              ])

              s = s.replace(marker, add + marker, 1)

          # =====================================================
          # CONFIGURACAO SEMANAL
          # =====================================================

          scale_marker = "    private val scale = linkedMapOf<String, DayScale>()"

          if "private val weekModes" not in s:

              if scale_marker not in s:
                  raise SystemExit("ERRO: scale nao encontrada")

              s = s.replace(
                  scale_marker,
                  scale_marker
                  + "\n"
                  + "    private var weeklyTarget:String=\"44:00\"\n"
                  + "    private val weekModes=linkedMapOf<String,String>()",
                  1
              )

          # =====================================================
          # FUNCOES DA SEMANA
          # =====================================================

          if "private fun weekKey" not in s:

              add = "\n".join([
                  "    private fun weekKey(date:Date):String{",
                  "        val c=Calendar.getInstance().apply{",
                  "            time=date",
                  "            set(Calendar.DAY_OF_WEEK,Calendar.MONDAY)",
                  "            set(Calendar.HOUR_OF_DAY,0)",
                  "            set(Calendar.MINUTE,0)",
                  "            set(Calendar.SECOND,0)",
                  "            set(Calendar.MILLISECOND,0)",
                  "        }",
                  "        return SimpleDateFormat(\"yyyy-MM-dd\",Locale.US).format(c.time)",
                  "    }",
                  "",
                  "    private fun modeForDate(date:Date):String{",
                  "        return weekModes[weekKey(date)] ?: \"MF\"",
                  "    }",
                  "",
                  "    private fun modeForDay(date:Date):Boolean{",
                  "        val c=Calendar.getInstance().apply{time=date}",
                  "        val day=c.get(Calendar.DAY_OF_WEEK)",
                  "        return if(modeForDate(date)==\"MS\"){",
                  "            day in Calendar.MONDAY..Calendar.SATURDAY",
                  "        }else{",
                  "            day in Calendar.MONDAY..Calendar.FRIDAY",
                  "        }",
                  "    }",
                  "",
                  "    private fun weekLabel(date:Date):String{",
                  "        val c=Calendar.getInstance().apply{",
                  "            time=date",
                  "            set(Calendar.DAY_OF_WEEK,Calendar.MONDAY)",
                  "        }",
                  "        val a=SimpleDateFormat(\"dd/MM/yyyy\",Locale.US).format(c.time)",
                  "        c.add(Calendar.DAY_OF_MONTH,6)",
                  "        val b=SimpleDateFormat(\"dd/MM/yyyy\",Locale.US).format(c.time)",
                  "        return \"$a até $b\"",
                  "    }",
                  "",
                  "    private fun modeTitle(mode:String):String{",
                  "        return if(mode==\"MS\"){",
                  "            \"Segunda a sábado — 07:20 por dia\"",
                  "        }else{",
                  "            \"Segunda a sexta — 08:48 por dia\"",
                  "        }",
                  "    }",
                  ""
              ])

              s = s.replace(marker, add + marker, 1)

          # =====================================================
          # CARREGAR SEMANAS
          # =====================================================

          if 'prefs.getString("weekModes","{}")' not in s:

              pos = s.find("private fun loadData()")
              end = s.find("private fun saveData", pos)

              if pos < 0 or end < 0:
                  raise SystemExit("ERRO: loadData/saveData nao encontrados")

              extra = "\n".join([
                  "",
                  "        weeklyTarget=normalizeDuration(",
                  "            prefs.getString(\"weeklyTarget\",\"44:00\") ?: \"44:00\"",
                  "        ).ifBlank{\"44:00\"}",
                  "",
                  "        weekModes.clear()",
                  "",
                  "        try{",
                  "            val obj=JSONObject(",
                  "                prefs.getString(\"weekModes\",\"{}\") ?: \"{}\"",
                  "            )",
                  "            val keys=obj.keys()",
                  "            while(keys.hasNext()){",
                  "                val k=keys.next()",
                  "                weekModes[k]=obj.optString(k,\"MF\")",
                  "            }",
                  "        }catch(_:Exception){",
                  "            weekModes.clear()",
                  "        }",
                  ""
              ])

              s = s[:end] + extra + s[end:]

          # =====================================================
          # SALVAR SEMANAS
          # =====================================================

          if 'e.putString("weekModes"' not in s:

              pos = s.find("private fun saveData()")

              if pos < 0:
                  raise SystemExit("ERRO: saveData nao encontrado")

              end = s.find("private fun ", pos + 20)

              if end < 0:
                  end = len(s)

              bloco = s[pos:end]

              if "e.apply()" not in bloco:
                  raise SystemExit("ERRO: e.apply nao encontrado")

              extra = "\n".join([
                  "",
                  "        val weekJson=JSONObject()",
                  "        weekModes.forEach{(k,v)->weekJson.put(k,v)}",
                  "        e.putString(\"weeklyTarget\",weeklyTarget)",
                  "        e.putString(\"weekModes\",weekJson.toString())",
                  ""
              ])

              bloco = bloco.replace(
                  "        e.apply()",
                  extra + "        e.apply()",
                  1
              )

              s = s[:pos] + bloco + s[end:]

          # =====================================================
          # EDICAO MANUAL
          # =====================================================

          s = s.replace(
              'val e=EditText(this).apply{setText(r.punches[index]);hint="HH:mm";inputType=2;setSingleLine()}',
              'val e=timeEdit(r.punches[index],punchNames[index])',
              1
          )

          s = s.replace(
              'r.punches[index]=e.text.toString();saveData();showPunch()',
              'r.punches[index]=normalizeTime(e.text.toString());saveData();showPunch()',
              1
          )

          s = s.replace(
              'val fields=r.punches.mapIndexed{i,v->EditText(this).apply{hint=punchNames[i];setText(v);inputType=2;setSingleLine();}}',
              'val fields=r.punches.mapIndexed{i,v->timeEdit(v,punchNames[i])}',
              1
          )

          s = s.replace(
              'fields.forEachIndexed{i,e->r.punches[i]=e.text.toString()};saveData();showHistory()',
              'fields.forEachIndexed{i,e->r.punches[i]=normalizeTime(e.text.toString())};saveData();showHistory()',
              1
          )

          # =====================================================
          # MINUTES BETWEEN
          # =====================================================

          a = s.find("    private fun minutesBetween(a:String,b:String):Int{")
          b = s.find("    private fun formatMin", a)

          if a < 0 or b < 0:
              raise SystemExit("ERRO: minutesBetween nao encontrada")

          novo = "\n".join([
              "    private fun minutesBetween(a:String,b:String):Int{",
              "        val x=normalizeTime(a)",
              "        val y=normalizeTime(b)",
              "        if(x.isBlank()||y.isBlank())return 0",
              "        return try{",
              "            val p=x.split(\":\")",
              "            val q=y.split(\":\")",
              "            val inicio=p[0].toInt()*60+p[1].toInt()",
              "            val fim=q[0].toInt()*60+q[1].toInt()",
              "            max(0,fim-inicio)",
              "        }catch(_:Exception){0}",
              "    }",
              ""
          ])

          s = s[:a] + novo + s[b:]

          # =====================================================
          # FORMATAR MINUTOS
          # =====================================================

          a = s.find("    private fun formatMin")

          if a < 0:
              raise SystemExit("ERRO: formatMin nao encontrada")

          b = s.find("\n", a)

          if b < 0:
              b = len(s)

          s = (
              s[:a]
              + '    private fun formatMin(m:Int):String="%02d:%02d".format(Locale.US,max(0,m)/60,max(0,m)%60)'
              + s[b:]
          )

          # =====================================================
          # CALCULO DAS HORAS
          # =====================================================

          a = s.find("    private fun calculate(r:PunchDay):Calc{")
          b = s.find("    private fun minutesBetween", a)

          if a < 0 or b < 0:
              raise SystemExit("ERRO: calculate nao encontrada")

          calc = "\n".join([
              "    private fun calculate(r:PunchDay):Calc{",
              "        var worked=0",
              "        worked+=minutesBetween(r.punches[0],r.punches[1])",
              "",
              "        val seis=r.punches[3].isNotBlank()||r.punches[4].isNotBlank()",
              "",
              "        if(seis){",
              "            worked+=minutesBetween(r.punches[2],r.punches[3])",
              "            worked+=minutesBetween(r.punches[4],r.punches[5])",
              "        }else{",
              "            worked+=minutesBetween(r.punches[2],r.punches[5])",
              "        }",
              "",
              "        val data=parseIso(r.date)",
              "",
              "        if(!modeForDay(data)){",
              "            return Calc(worked,0,0,worked)",
              "        }",
              "",
              "        val semanal=durationMinutes(weeklyTarget)",
              "        val dias=if(modeForDate(data)==\"MS\")6 else 5",
              "        val expected=semanal/dias",
              "        val extra=max(0,worked-expected)",
              "        val faltante=max(0,expected-worked)",
              "",
              "        return Calc(worked,expected,extra,faltante)",
              "    }",
              ""
          ])

          s = s[:a] + calc + s[b:]

          # =====================================================
          # ESCALA SEMANAL
          # =====================================================

          a = s.find("    private fun showScale() {")
          b = s.find("    private fun employeeDialog", a)

          if a < 0 or b < 0:
              raise SystemExit("ERRO: showScale nao encontrada")

          escala = "\n".join([
              "    private fun showScale(){",
              "        val box=page(\"Escala Semanal\")",
              "        box.addView(infoCard(\"Carga semanal: 44:00\"))",
              "",
              "        fun semana(titulo:String,data:Date){",
              "            val key=weekKey(data)",
              "            val mode=modeForDate(data)",
              "            val c=card()",
              "",
              "            val l=LinearLayout(this).apply{",
              "                orientation=LinearLayout.VERTICAL",
              "                setPadding(dp(12),dp(10),dp(12),dp(10))",
              "            }",
              "",
              "            l.addView(TextView(this).apply{",
              "                text=titulo",
              "                textSize=18f",
              "                setTypeface(null,Typeface.BOLD)",
              "                setTextColor(darkBlue)",
              "            })",
              "",
              "            l.addView(TextView(this).apply{",
              "                text=weekLabel(data)",
              "                textSize=13f",
              "                setTextColor(muted)",
              "            })",
              "",
              "            l.addView(TextView(this).apply{",
              "                text=\"Selecionada: \"+modeTitle(mode)",
              "                textSize=15f",
              "                setTypeface(null,Typeface.BOLD)",
              "                setTextColor(darkBlue)",
              "            })",
              "",
              "            val mf=Button(this).apply{",
              "                text=\"Segunda a sexta — 08:48\"",
              "                isAllCaps=false",
              "            }",
              "",
              "            mf.setOnClickListener{",
              "                weekModes[key]=\"MF\"",
              "                saveData()",
              "                showScale()",
              "            }",
              "",
              "            val ms=Button(this).apply{",
              "                text=\"Segunda a sábado — 07:20\"",
              "                isAllCaps=false",
              "            }",
              "",
              "            ms.setOnClickListener{",
              "                weekModes[key]=\"MS\"",
              "                saveData()",
              "                showScale()",
              "            }",
              "",
              "            l.addView(mf)",
              "            l.addView(ms)",
              "            c.addView(l)",
              "",
              "            box.addView(c,LinearLayout.LayoutParams(-1,dp(210)).apply{",
              "                bottomMargin=dp(10)",
              "            })",
              "        }",
              "",
              "        val hoje=Date()",
              "",
              "        val proxima=Calendar.getInstance().apply{",
              "            time=hoje",
              "            set(Calendar.DAY_OF_WEEK,Calendar.MONDAY)",
              "            add(Calendar.DAY_OF_MONTH,7)",
              "        }.time",
              "",
              "        semana(\"Semana atual\",hoje)",
              "        semana(\"Próxima semana\",proxima)",
              "",
              "        box.addView(infoCard(",
              "            \"Segunda a sexta = 08:48 por dia. \" +",
              "            \"Segunda a sábado = 07:20 por dia.\"",
              "        ))",
              "    }",
              ""
          ])

          s = s[:a] + escala + s[b:]

          # =====================================================
          # VALIDACAO FINAL
          # =====================================================

          required = [
              "private fun normalizeTime",
              "private fun timeEdit",
              "private fun durationMinutes",
              "private fun minutesBetween",
              "private fun calculate(r:PunchDay):Calc",
              "private val weekModes",
              "private fun weekKey",
              "private fun modeForDate",
              "private fun modeForDay",
              "Segunda a sexta — 08:48",
              "Segunda a sábado — 07:20"
          ]

          for x in required:
              if x not in s:
                  raise SystemExit("ERRO FINAL: " + x)

          if s.count("{") != s.count("}"):
              raise SystemExit("ERRO FINAL: chaves Kotlin incorretas")

          p.write_text(s, encoding="utf-8")

          print("MAINACTIVITY CORRIGIDA")
          print("Linhas:", len(s.splitlines()))

      - name: Validar código
        shell: bash
        run: |
          set -e

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          test -s "$FILE"

          grep -q "private fun normalizeTime" "$FILE"
          grep -q "private fun minutesBetween" "$FILE"
          grep -q "private fun calculate" "$FILE"
          grep -q "private fun weekKey" "$FILE"

          echo "VALIDACAO OK"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q gradle-8.11.1-bin.zip

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          export PATH="$PWD/gradle-8.11.1/bin:$PATH"

          gradle --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e
          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug --no-daemon --stacktrace

          test -s app/build/outputs/apk/debug/app-debug.apk

          echo "APK GERADO COM SUCESSO"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
