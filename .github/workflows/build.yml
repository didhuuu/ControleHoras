name: Gerar APK - ControleHoras

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto original
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXTRAINDO PROJETO ORIGINAL"
          echo "========================================"

          rm -rf ControleHoras

          unzip -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Corrigir aplicativo original
        shell: bash
        run: |
          set -e

          MAIN="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          test -f "$MAIN"

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          s = p.read_text(encoding="utf-8")

          # Correções que já estavam necessárias
          s = s.replace(
              "        }, 0, 0, 0, dp(10))",
              "        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(10) })"
          )

          s = s.replace(
              "        }, 0, 0, 0, dp(12))",
              "        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(12) })"
          )

          s = s.replace(
              "setTextColor(text)",
              "setTextColor(this@MainActivity.text)"
          )

          s = s.replace(
              'setText(if(existing!=null)existing.salary.toString():"")',
              'setText(if (existing != null) existing.salary.toString() else "")'
          )

          s = s.replace(
              'if(existing!=null)existing.salary.toString():""',
              'if (existing != null) existing.salary.toString() else ""'
          )

          s = s.replace(
              'if (existing != null) existing.salary.toString():""',
              'if (existing != null) existing.salary.toString() else ""'
          )

          # Correção do filtro mensal
          s = s.replace(
              'it.date.endsWith(SimpleDateFormat("MM-yyyy", Locale.US).format(Date()))',
              'it.date.startsWith(SimpleDateFormat("yyyy-MM", Locale.US).format(Date()))'
          )

          # NÃO substitui a tela original
          p.write_text(s, encoding="utf-8")

          print("CODIGO ORIGINAL PRESERVADO")
          print("CORRECOES APLICADAS")
          PY

          test -s "$MAIN"

          echo "========================================"
          echo "MAINACTIVITY ORIGINAL PRESERVADO"
          echo "========================================"

          wc -l "$MAIN"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.11.1"

          echo "========================================"
          echo "INSTALANDO GRADLE $GRADLE_VERSION"
          echo "========================================"

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          unzip -q \
            "gradle-${GRADLE_VERSION}-bin.zip"

          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          export PATH="$PWD/gradle-${GRADLE_VERSION}/bin:$PATH"

          gradle --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "LIMPANDO PROJETO"
          echo "========================================"

          gradle clean

          echo "LIMPEZA CONCLUIDA"

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GERANDO APK"
          echo "========================================"

          gradle assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "========================================"
          echo "APK ENCONTRADO"
          echo "========================================"

          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ${{ github.workspace }}/ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Finalizar
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD FINALIZADO"
          echo "========================================"
          echo "APK GERADO:"
          ls -lh ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          echo "========================================"
