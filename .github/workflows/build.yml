          calculate = """    private fun calculate(
          r:PunchDay
      ):Calc{

          var worked=
              minutesBetween(
                  r.punches[0],
                  r.punches[1]
              )+
              minutesBetween(
                  r.punches[2],
                  r.punches[5]
              )

          if(
              r.punches[3].isNotBlank() &&
              r.punches[4].isNotBlank()
          ){
              worked=
                  minutesBetween(
                      r.punches[0],
                      r.punches[1]
                  )+
                  minutesBetween(
                      r.punches[2],
                      r.punches[3]
                  )+
                  minutesBetween(
                      r.punches[4],
                      r.punches[5]
                  )

          }else if(
              r.punches[3].isNotBlank()
          ){

              worked=
                  minutesBetween(
                      r.punches[0],
                      r.punches[1]
                  )+
                  minutesBetween(
                      r.punches[2],
                      r.punches[3]
                  )+
                  minutesBetween(
                      r.punches[3],
                      r.punches[5]
                  )
          }

          val date=
              parseIso(r.date)

          if(
              !modeForDay(date)
          ){
              return Calc(
                  worked,
                  0,
                  0,
                  worked
              )
          }

          val expected=
              durationMinutes(
                  weeklyTarget
              ) /
              (
                  if(
                      modeForDate(date)=="MS"
                  ){
                      6
                  }else{
                      5
                  }
              )

          val extra=
              max(
                  0,
                  worked-expected
              )

          return Calc(
              worked,
              expected,
              extra,
              0
          )
      }"""

          for name, body in [
