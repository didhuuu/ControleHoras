name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Aplicar MainActivity corrigida
        shell: python
        run: |
          from pathlib import Path

          root = Path("ControleHoras")
          main = root / "app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          manifest = root / "app/src/main/AndroidManifest.xml"
          xml = root / "app/src/main/res/xml"

          xml.mkdir(
              parents=True,
              exist_ok=True
          )

          main.write_text(r'''package com.didhuuu.controlehoras

          import android.app.*
          import android.os.Bundle
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.content.*
          import android.view.*
          import android.widget.*
          import androidx.core.content.FileProvider
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.text.NumberFormat
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.math.max

          class MainActivity : Activity() {

              data class Employee(
                  var id:Long,
                  var name:String,
                  var salary:Double
              )

              data class DayScale(
                  var enabled:Boolean=true,
                  var e:String="08:00",
                  var x1:String="12:00",
                  var r1:String="13:30",
                  var x2:String="17:30"
              )

              data class PunchDay(
                  var employeeId:Long,
                  var employeeName:String,
                  var date:String,
                  var punches:MutableList<String> =
                      MutableList(6){""}
              )

              data class Calc(
                  val worked:Int,
                  val expected:Int,
                  val extra60:Int,
                  val extra100:Int
              )

              private val blue=Color.rgb(0,92,205)
              private val darkBlue=Color.rgb(13,54,105)
              private val green=Color.rgb(0,170,82)
              private val bg=Color.rgb(245,248,252)
              private val text=Color.rgb(25,35,50)
              private val muted=Color.rgb(105,115,130)

              private lateinit var root:LinearLayout
              private lateinit var content:FrameLayout
              private lateinit var nav:LinearLayout

              private var selectedTab=0
              private var selectedEmployeeId=0L

              private var selectedPunchDate=""

              private val prefs by lazy{
                  getSharedPreferences(
                      "controle_horas",
                      MODE_PRIVATE
                  )
              }

              private val employees=
                  mutableListOf<Employee>()

              private val records=
                  mutableListOf<PunchDay>()

              private val scale=
                  linkedMapOf<String,DayScale>()

              private val weekModes=
                  linkedMapOf<String,String>()

              private var weeklyTarget="44:00"

              private val days=
                  listOf(
                      "Seg",
                      "Ter",
                      "Qua",
                      "Qui",
                      "Sex",
                      "Sáb",
                      "Dom"
                  )

              private val dayKeys=
                  listOf(
                      Calendar.MONDAY,
                      Calendar.TUESDAY,
                      Calendar.WEDNESDAY,
                      Calendar.THURSDAY,
                      Calendar.FRIDAY,
                      Calendar.SATURDAY,
                      Calendar.SUNDAY
                  )

              private val money=
                  NumberFormat.getCurrencyInstance(
                      Locale("pt","BR")
                  )

              private val df=
                  SimpleDateFormat(
                      "dd/MM/yyyy",
                      Locale("pt","BR")
                  )

              private val iso=
                  SimpleDateFormat(
                      "yyyy-MM-dd",
                      Locale.US
                  )

              private val punchNames=
                  listOf(
                      "Entrada",
                      "Saída intervalo 1",
                      "Retorno intervalo 1",
                      "Saída intervalo 2",
                      "Retorno intervalo 2",
                      "Saída"
                  )

              override fun onCreate(
                  savedInstanceState:Bundle?
              ){

                  super.onCreate(
                      savedInstanceState
                  )

                  loadData()

                  selectedPunchDate=today()

                  if(
                      employees.isNotEmpty()
                  ){
                      selectedEmployeeId=
                          employees.first().id
                  }

                  buildShell()
                  showTab(0)
              }

              private fun loadData(){

                  employees.clear()

                  try{

                      val ea=
                          JSONArray(
                              prefs.getString(
                                  "employees",
                                  "[]"
                              )
                          )

                      for(
                          i in 0 until ea.length()
                      ){

                          val o=
                              ea.getJSONObject(i)

                          employees+=Employee(
                              o.getLong("id"),
                              o.getString("name"),
                              o.getDouble("salary")
                          )
                      }

                  }catch(_:Exception){}

                  records.clear()

                  try{

                      val ra=
                          JSONArray(
                              prefs.getString(
                                  "records",
                                  "[]"
                              )
                          )

                      for(
                          i in 0 until ra.length()
                      ){

                          val o=
                              ra.getJSONObject(i)

                          val p=
                              MutableList(6){j->
                                  o.optString(
                                      "p$j",
                                      ""
                                  )
                              }

                          records+=PunchDay(
                              o.getLong("employeeId"),
                              o.optString(
                                  "employeeName",
                                  ""
                              ),
                              o.getString("date"),
                              p
                          )
                      }

                  }catch(_:Exception){}

                  scale.clear()

                  for(i in days.indices){

                      val def=
                          if(i<5)
                              DayScale()
                          else
                              DayScale(
                                  false,
                                  "",
                                  "",
                                  "",
                                  ""
                              )

                      try{

                          val fallback=
                              JSONObject()
                                  .put(
                                      "enabled",
                                      def.enabled
                                  )
                                  .put("e",def.e)
                                  .put("x1",def.x1)
                                  .put("r1",def.r1)
                                  .put("x2",def.x2)
                                  .toString()

                          val o=
                              JSONObject(
                                  prefs.getString(
                                      "scale_$i",
                                      fallback
                                  )
                              )

                          scale[days[i]]=
                              DayScale(
                                  o.optBoolean(
                                      "enabled",
                                      def.enabled
                                  ),
                                  safeTime(
                                      o.optString(
                                          "e",
                                          def.e
                                      )
                                  ),
                                  safeTime(
                                      o.optString(
                                          "x1",
                                          def.x1
                                      )
                                  ),
                                  safeTime(
                                      o.optString(
                                          "r1",
                                          def.r1
                                      )
                                  ),
                                  safeTime(
                                      o.optString(
                                          "x2",
                                          def.x2
                                      )
                                  )
                              )

                      }catch(_:Exception){

                          scale[days[i]]=def
                      }
                  }

                  weeklyTarget=
                      normalizeDuration(
                          prefs.getString(
                              "weeklyTarget",
                              "44:00"
                          ) ?: "44:00"
                      ).ifBlank{
                          "44:00"
                      }

                  weekModes.clear()

                  try{

                      val obj=
                          JSONObject(
                              prefs.getString(
                                  "weekModes",
                                  "{}"
                              ) ?: "{}"
                          )

                      val keys=obj.keys()

                      while(keys.hasNext()){

                          val key=keys.next()

                          weekModes[key]=
                              obj.optString(
                                  key,
                                  "MF"
                              )
                      }

                  }catch(_:Exception){}
              }

              private fun saveData(){

                  val ea=JSONArray()

                  employees.forEach{

                      ea.put(
                          JSONObject()
                              .put("id",it.id)
                              .put("name",it.name)
                              .put("salary",it.salary)
                      )
                  }

                  val ra=JSONArray()

                  records.forEach{r->

                      val o=
                          JSONObject()
                              .put(
                                  "employeeId",
                                  r.employeeId
                              )
                              .put(
                                  "employeeName",
                                  r.employeeName
                              )
                              .put(
                                  "date",
                                  r.date
                              )

                      r.punches.forEachIndexed{
                          j,v->
                          o.put(
                              "p$j",
                              normalizeTime(v)
                          )
                      }

                      ra.put(o)
                  }

                  val w=JSONObject()

                  weekModes.forEach{
                      (k,v)->
                      w.put(k,v)
                  }

                  val e=
                      prefs.edit()
                          .putString(
                              "employees",
                              ea.toString()
                          )
                          .putString(
                              "records",
                              ra.toString()
                          )
                          .putString(
                              "weeklyTarget",
                              weeklyTarget
                          )
                          .putString(
                              "weekModes",
                              w.toString()
                          )

                  days.forEachIndexed{
                      i,d->

                      val s=
                          scale[d]
                              ?: DayScale()

                      e.putString(
                          "scale_$i",
                          JSONObject()
                              .put(
                                  "enabled",
                                  s.enabled
                              )
                              .put("e",s.e)
                              .put("x1",s.x1)
                              .put("r1",s.r1)
                              .put("x2",s.x2)
                              .toString()
                      )
                  }

                  e.apply()
              }

              private fun buildShell(){

                  root=
                      LinearLayout(this).apply{
                          orientation=
                              LinearLayout.VERTICAL
                          setBackgroundColor(bg)
                      }

                  val header=
                      LinearLayout(this).apply{
                          orientation=
                              LinearLayout.HORIZONTAL
                          gravity=
                              Gravity.CENTER_VERTICAL
                          setPadding(
                              dp(18),
                              dp(10),
                              dp(14),
                              dp(10)
                          )
                          background(
                              blue,
                              0,
                              0,
                              0,
                              0
                          )
                      }

                  header.addView(
                      TextView(this).apply{
                          text="◷"
                          textSize=34f
                          setTextColor(
                              Color.WHITE
                          )
                      },
                      LinearLayout.LayoutParams(
                          dp(42),
                          dp(62)
                      )
                  )

                  header.addView(
                      TextView(this).apply{
                          text=
                              "  CONTROLE DE HORAS"
                          textSize=20f
                          setTypeface(
                              null,
                              Typeface.BOLD
                          )
                          setTextColor(
                              Color.WHITE
                          )
                          gravity=
                              Gravity.CENTER_VERTICAL
                      },
                      LinearLayout.LayoutParams(
                          0,
                          dp(62),
                          1f
                      )
                  )

                  header.addView(
                      TextView(this).apply{
                          text="⚙"
                          textSize=28f
                          setTextColor(
                              Color.WHITE
                          )
                          setOnClickListener{
                              showSettings()
                          }
                      },
                      LinearLayout.LayoutParams(
                          dp(45),
                          dp(62)
                      )
                  )

                  root.addView(header)

                  content=
                      FrameLayout(this).apply{
                          setBackgroundColor(bg)
                      }

                  root.addView(
                      content,
                      LinearLayout.LayoutParams(
                          -1,
                          0,
                          1f
                      )
                  )

                  nav=
                      LinearLayout(this).apply{
                          orientation=
                              LinearLayout.HORIZONTAL
                          setPadding(
                              dp(2),
                              dp(5),
                              dp(2),
                              dp(5)
                          )
                          background(
                              Color.WHITE,
                              dp(18),
                              0,
                              0,
                              0
                          )
                      }

                  val labels=
                      listOf(
                          "⌂\nPonto",
                          "▣\nHistórico",
                          "▥\nRelatório",
                          "♟\nFuncionários",
                          "▦\nEscala"
                      )

                  labels.forEachIndexed{
                      i,label->

                      nav.addView(
                          TextView(this).apply{

                              text=label
                              gravity=
                                  Gravity.CENTER
                              textSize=12f

                              setTypeface(
                                  null,
                                  Typeface.BOLD
                              )

                              setOnClickListener{
                                  showTab(i)
                              }
                          },
                          LinearLayout.LayoutParams(
                              0,
                              dp(68),
                              1f
                          )
                      )
                  }

                  root.addView(nav)

                  setContentView(root)
              }

              private fun showTab(tab:Int){

                  selectedTab=tab

                  content.removeAllViews()

                  when(tab){

                      0->showPunch()
                      1->showHistory()
                      2->showReport()
                      3->showEmployees()
                      4->showScale()
                  }

                  for(
                      i in 0 until nav.childCount
                  ){

                      val v=
                          nav.getChildAt(i)
                              as TextView

                      if(i==tab){

                          v.setTextColor(blue)

                          v.background(
                              0xFFE7F0FF.toInt(),
                              dp(16),
                              dp(16),
                              dp(16),
                              dp(16)
                          )

                      }else{

                          v.setTextColor(
                              muted
                          )

                          v.setBackgroundColor(
                              Color.TRANSPARENT
                          )
                      }
                  }
              }

              private fun page(
                  title:String
              ):LinearLayout{

                  val scroll=
                      ScrollView(this)

                  val box=
                      LinearLayout(this).apply{
                          orientation=
                              LinearLayout.VERTICAL
                          setPadding(
                              dp(18),
                              dp(16),
                              dp(18),
                              dp(22)
                          )
                      }

                  box.addView(
                      TextView(this).apply{
                          text=title
                          textSize=25f
                          setTypeface(
                              null,
                              Typeface.BOLD
                          )
                          setTextColor(
                              darkBlue
                          )
                      }
                  )

                  scroll.addView(box)

                  content.addView(
                      scroll,
                      FrameLayout.LayoutParams(
                          -1,
                          -1
                      )
                  )

                  return box
              }

              private fun showPunch(){

                  val box=
                      page("Bater Ponto")

                  if(employees.isEmpty()){

                      box.addView(
                          infoCard(
                              "Nenhum funcionário cadastrado."
                          )
                      )

                      return
                  }

                  val emp=
                      employees.firstOrNull{
                          it.id==
                              selectedEmployeeId
                      }
                          ?:employees.first()

                  val selector=card()

                  val selectorLine=
                      LinearLayout(this).apply{
                          orientation=
                              LinearLayout.VERTICAL
                          setPadding(
                              dp(14),
                              dp(10),
                              dp(14),
                              dp(10)
                          )
                      }

                  selectorLine.addView(
                      label("Funcionário")
                  )

                  val spinner=
                      Spinner(this)

                  spinner.adapter=
                      ArrayAdapter(
                          this,
                          android.R.layout
                              .simple_spinner_dropdown_item,
                          employees.map{
                              it.name
                          }
                      )

                  spinner.setSelection(
                      employees.indexOfFirst{
                          it.id==
                              selectedEmployeeId
                      }.coerceAtLeast(0)
                  )

                  spinner.onItemSelectedListener=
                      object:
                          AdapterView
                          .OnItemSelectedListener{

                          override fun
                          onNothingSelected(
                              p:AdapterView<*>?
                          ){}

                          override fun
                          onItemSelected(
                              p:AdapterView<*>?,
                              v:View?,
                              pos:Int,
                              id:Long
                          ){

                              if(
                                  employees[pos].id !=
                                  selectedEmployeeId
                              ){

                                  selectedEmployeeId=
                                      employees[pos].id

                                  selectedPunchDate=
                                      today()

                                  showPunch()
                              }
                          }
                      }

                  selectorLine.addView(
                      spinner
                  )

                  selectorLine.addView(
                      TextView(this).apply{

                          text=
                              "Salário mensal   " +
                              money.format(
                                  emp.salary
                              )

                          textSize=14f
                          setTextColor(muted)
                      }
                  )

                  selector.addView(
                      selectorLine
                  )

                  box.addView(
                      selector,
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      ).apply{
                          bottomMargin=dp(10)
                      }
                  )

                  val dateCard=card()

                  val dateLine=
                      LinearLayout(this).apply{
                          orientation=
                              LinearLayout.HORIZONTAL
                          gravity=
                              Gravity.CENTER_VERTICAL
                          setPadding(
                              dp(14),
                              dp(10),
                              dp(14),
                              dp(10)
                          )
                      }

                  dateLine.addView(
                      TextView(this).apply{
                          text="📅"
                          textSize=25f
                      },
                      LinearLayout.LayoutParams(
                          dp(45),
                          dp(55)
                      )
                  )

                  dateLine.addView(
                      TextView(this).apply{

                          text=
                              "Data do ponto\n" +
                              displayPunchDate(
                                  selectedPunchDate
                              )

                          textSize=15f

                          setTypeface(
                              null,
                              Typeface.BOLD
                          )

                          setTextColor(
                              this@MainActivity.text
                          )
                      },
                      LinearLayout.LayoutParams(
                          0,
                          dp(60),
                          1f
                      )
                  )

                  dateLine.addView(
                      Button(this).apply{

                          text="ALTERAR"

                          isAllCaps=false

                          setOnClickListener{
                              choosePunchDate()
                          }
                      },
                      LinearLayout.LayoutParams(
                          dp(105),
                          dp(52)
                      )
                  )

                  dateCard.addView(dateLine)

                  box.addView(
                      dateCard,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(82)
                      ).apply{
                          bottomMargin=dp(12)
                      }
                  )

                  val rec=
                      getRecord(
                          emp.id,
                          selectedPunchDate
                      )

                  val next=
                      rec.punches.indexOfFirst{
                          it.isBlank()
                      }

                  val action=
                      Button(this).apply{

                          text=
                              if(next<0)
                                  "PONTO DO DIA COMPLETO"
                              else
                                  "▶  REGISTRAR PRÓXIMA BATIDA\n"+
                                  punchNames[next]

                          isAllCaps=false
                          setTextColor(
                              Color.WHITE
                          )

                          isEnabled=
                              next>=0

                          background(
                              green,
                              dp(12),
                              dp(12),
                              dp(12),
                              dp(12)
                          )

                          setOnClickListener{
                              registerPunch(
                                  emp.id
                              )
                          }
                      }

                  box.addView(
                      action,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(72)
                      ).apply{
                          bottomMargin=dp(12)
                      }
                  )

                  punchNames.forEachIndexed{
                      i,n->

                      val row=
                          LinearLayout(this).apply{

                              orientation=
                                  LinearLayout.HORIZONTAL

                              gravity=
                                  Gravity.CENTER_VERTICAL

                              setPadding(
                                  dp(12),
                                  dp(4),
                                  dp(10),
                                  dp(4)
                              )

                              background(
                                  Color.WHITE,
                                  dp(12),
                                  dp(12),
                                  dp(12),
                                  dp(12)
                              )
                          }

                      row.addView(
                          TextView(this).apply{
                              text="${i+1}"
                              textSize=16f
                              gravity=
                                  Gravity.CENTER
                              setTypeface(
                                  null,
                                  Typeface.BOLD
                              )
                          },
                          LinearLayout.LayoutParams(
                              dp(42),
                              dp(42)
                          )
                      )

                      row.addView(
                          TextView(this).apply{

                              text=n
                              textSize=15f

                              setTextColor(
                                  this@MainActivity.text
                              )

                              setPadding(
                                  dp(12),
                                  0,
                                  0,
                                  0
                              )
                          },
                          LinearLayout.LayoutParams(
                              0,
                              dp(52),
                              1f
                          )
                      )

                      row.addView(
                          TextView(this).apply{

                              text=
                                  rec.punches[i]
                                      .ifBlank{
                                          "--:--"
                                      }

                              textSize=15f

                              setTextColor(
                                  if(
                                      rec.punches[i]
                                          .isBlank()
                                  )
                                      muted
                                  else
                                      darkBlue
                              )

                              setTypeface(
                                  null,
                                  Typeface.BOLD
                              )
                          }
                      )

                      row.setOnClickListener{
                          editPunch(
                              rec,
                              i
                          )
                      }

                      box.addView(
                          row,
                          LinearLayout.LayoutParams(
                              -1,
                              dp(58)
                          ).apply{
                              bottomMargin=dp(7)
                          }
                      )
                  }

                  val calc=
                      calculate(rec)

                  val cards=
                      LinearLayout(this).apply{
                          orientation=
                              LinearLayout.HORIZONTAL
                      }

                  cards.addView(
                      metricCard(
                          "Horas trabalhadas",
                          formatMin(
                              calc.worked
                          ),
                          blue
                      ),
                      LinearLayout.LayoutParams(
                          0,
                          dp(82),
                          1f
                      ).apply{
                          rightMargin=dp(6)
                      }
                  )

                  cards.addView(
                      metricCard(
                          "Horas extras",
                          formatMin(
                              calc.extra60+
                              calc.extra100
                          ),
                          green
                      ),
                      LinearLayout.LayoutParams(
                          0,
                          dp(82),
                          1f
                      ).apply{
                          leftMargin=dp(6)
                      }
                  )

                  box.addView(cards)
              }

              private fun registerPunch(
                  empId:Long
              ){

                  val r=
                      getRecord(
                          empId,
                          selectedPunchDate
                      )

                  val n=
                      r.punches.indexOfFirst{
                          it.isBlank()
                      }

                  if(n<0)return

                  if(
                      selectedPunchDate==
                      today()
                  ){

                      r.punches[n]=
                          nowTime()

                      saveData()
                      showPunch()

                      return
                  }

                  val e=
                      timeEdit(
                          "",
                          punchNames[n]
                      )

                  AlertDialog.Builder(this)
                      .setTitle(
                          "Lançar "+
                          punchNames[n]
                      )
                      .setMessage(
                          displayPunchDate(
                              selectedPunchDate
                          )
                      )
                      .setView(e)
                      .setNegativeButton(
                          "Cancelar",
                          null
                      )
                      .setPositiveButton(
                          "Salvar"
                      ){_,_->

                          val t=
                              normalizeTime(
                                  e.text.toString()
                              )

                          if(t.isBlank()){

                              Toast.makeText(
                                  this,
                                  "Horário inválido.",
                                  Toast.LENGTH_LONG
                              ).show()

                          }else{

                              r.punches[n]=t

                              saveData()
                              showPunch()
                          }
                      }
                      .show()
              }

              private fun showHistory(){

                  val box=
                      page("Histórico de Pontos")

                  if(employees.isEmpty()){

                      box.addView(
                          infoCard(
                              "Cadastre um funcionário."
                          )
                      )

                      return
                  }

                  val emp=
                      employees.firstOrNull{
                          it.id==
                              selectedEmployeeId
                      } ?: employees.first()

                  val monthKey=
                      SimpleDateFormat(
                          "yyyy-MM",
                          Locale.US
                      ).format(Date())

                  val list=
                      records
                          .filter{
                              it.employeeId==
                                  emp.id &&
                              it.date.startsWith(
                                  monthKey
                              )
                          }
                          .sortedByDescending{
                              it.date
                          }

                  list.forEach{r->

                      val c=
                          calculate(r)

                      val row=card()

                      row.addView(
                          TextView(this).apply{

