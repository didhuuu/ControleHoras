    private fun addExtraSwitch(
        box:LinearLayout,
        empId:Long,
        date:String,
        which:Int,
        checked:Boolean
    ){

        val title =
            if(which == 0)
                "Saída intervalo 2"
            else
                "Retorno intervalo 2"

        val row =
            LinearLayout(this).apply{

                orientation =
                    LinearLayout.HORIZONTAL

                gravity =
                    Gravity.CENTER_VERTICAL

                setPadding(
                    dp(12),
                    dp(2),
                    dp(8),
                    dp(2)
                )
            }

        row.addView(
            TextView(this).apply{

                text =
                    title

                textSize =
                    15f
            },
            LinearLayout.LayoutParams(
                0,
                dp(52),
                1f
            )
        )

        val sw =
            Switch(this).apply{

                isChecked =
                    checked

                isAllCaps =
                    false
            }

        if(which == 1){

            sw.isEnabled =
                extra2Enabled.contains(
                    extraKey(
                        empId,
                        date
                    )
                )
        }

        sw.setOnCheckedChangeListener{
            _,
            value ->

            val key =
                extraKey(
                    empId,
                    date
                )

            if(which == 0){

                if(value){

                    extra2Enabled.add(
                        key
                    )

                }else{

                    extra2Enabled.remove(
                        key
                    )

                    extra2ReturnEnabled.remove(
                        key
                    )
                }

            }else{

                if(value){

                    extra2ReturnEnabled.add(
                        key
                    )

                }else{

                    extra2ReturnEnabled.remove(
                        key
                    )
                }
            }

            saveExtra2()

            showPunch()
        }

        row.addView(
            sw
        )

        box.addView(
            row,
            LinearLayout.LayoutParams(
                -1,
                dp(56)
            ).apply{
                bottomMargin =
                    dp(4)
            }
        )
    }
