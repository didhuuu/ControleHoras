name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Aplicar versão 36
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess

          url = "https://raw.githubusercontent.com/didhuuu/ControleHoras/29bdaa86ef5b85ec79367cbced7c759063d7fe7b/.github/workflows/build.yml"

          workflow = urlopen(url, timeout=30).read().decode("utf-8")

          inicio = workflow.index(
              "      - name: Corrigir MainActivity"
          )

          fim = workflow.index(
              "      - name: Validar código",
              inicio
          )

          bloco = workflow[inicio:fim]

          marcador = "        run: |\n"

          pos = bloco.index(marcador) + len(marcador)

          linhas = bloco[pos:].splitlines()

          script = "\n".join(
              linha[10:] if linha.startswith("          ") else linha
              for linha in linhas
          )

          arquivo = Path("/tmp/corrigir36.py")

          arquivo.write_text(
              script + "\n",
              encoding="utf-8"
          )

          subprocess.run(
              ["python", str(arquivo)],
              check=True
          )

          print("VERSÃO 36 APLICADA COM SUCESSO")

      - name: Adicionar seleção de data retroativa
        shell: python
        run: |
          from pathlib import Path

          arquivo = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          codigo = arquivo.read_text(
              encoding="utf-8"
          )

          def replace_once(antigo, novo, nome):
              global codigo

              quantidade = codigo.count(antigo)

              if quantidade != 1:
                  raise SystemExit(
                      f"ERRO {nome}: encontrado {quantidade}, esperado 1"
                  )

              codigo = codigo.replace(
                  antigo,
                  novo,
                  1
              )

          # ==================================================
          # 1. CRIAR VARIÁVEL DA DATA SELECIONADA
          # ==================================================

          replace_once(
              "    private var selectedEmployeeId = 0L\n",
              "    private var selectedEmployeeId = 0L\n"
              "    private var selectedPunchDate = \"\"\n",
              "variável selectedPunchDate"
          )

          # ==================================================
          # 2. AO ABRIR O APP, COMEÇA EM HOJE
          # ==================================================

          replace_once(
              "        loadData()\n"
              "        if (employees.isNotEmpty()) selectedEmployeeId = employees.first().id\n",
              "        loadData()\n"
              "        selectedPunchDate = today()\n"
              "        if (employees.isNotEmpty()) selectedEmployeeId = employees.first().id\n",
              "data inicial"
          )

          # ==================================================
          # 3. AO TROCAR FUNCIONÁRIO, VOLTA PARA HOJE
          # ==================================================

          replace_once(
              "selectedEmployeeId = employees[pos].id; showPunch()",
              "selectedEmployeeId = employees[pos].id; "
              "selectedPunchDate = today(); showPunch()",
              "troca funcionário"
          )

          # ==================================================
          # 4. FUNÇÃO PARA ESCOLHER A DATA
          # ==================================================

          marcador_data = (
              "    private fun today()=iso.format(Date())\n"
          )

          funcao_data = '''    private fun choosePunchDate(){
        val cal=Calendar.getInstance()

        try{
            cal.time=iso.parse(selectedPunchDate) ?: Date()
        }catch(_:Exception){}

        DatePickerDialog(
            this@MainActivity,
            {_,year,month,day->

                val escolhida=Calendar.getInstance().apply{
                    set(Calendar.YEAR,year)
                    set(Calendar.MONTH,month)
                    set(Calendar.DAY_OF_MONTH,day)
                    set(Calendar.HOUR_OF_DAY,0)
                    set(Calendar.MINUTE,0)
                    set(Calendar.SECOND,0)
                    set(Calendar.MILLISECOND,0)
                }

                val hoje=Calendar.getInstance().apply{
                    set(Calendar.HOUR_OF_DAY,0)
                    set(Calendar.MINUTE,0)
                    set(Calendar.SECOND,0)
                    set(Calendar.MILLISECOND,0)
                }

                if(!escolhida.after(hoje)){
                    selectedPunchDate=iso.format(escolhida.time)
                    showPunch()
                }
            },
            cal.get(Calendar.YEAR),
            cal.get(Calendar.MONTH),
            cal.get(Calendar.DAY_OF_MONTH)
        ).apply{
            datePicker.maxDate=System.currentTimeMillis()
        }.show()
    }

'''

          replace_once(
              marcador_data,
              marcador_data + funcao_data,
              "função de data"
          )

          # ==================================================
          # 5. SHOWPUNCH PASSA A USAR A DATA ESCOLHIDA
          # ==================================================

          replace_once(
              "val rec = getRecord(emp.id, today())",
              "val rec = getRecord(emp.id, selectedPunchDate)",
              "registro da data"
          )

          replace_once(
              "val r = getRecord(emp.id, today())",
              "val r = getRecord(emp.id, selectedPunchDate)",
              "batida da data"
          )

          # ==================================================
          # 6. TEXTO DA DATA NO CARTÃO
          # ==================================================

          replace_once(
              'text = "Hoje\\n${df.format(Date())}"; textSize = 16f; setTextColor(text); setTypeface(null, Typeface.BOLD)',
              'text = "Data do ponto\\n${df.format(parseIso(selectedPunchDate))}"; textSize = 16f; setTextColor(this@MainActivity.text); setTypeface(null, Typeface.BOLD); setOnClickListener { choosePunchDate() }',
              "cartão da data"
          )

          # ==================================================
          # 7. BOTÃO DE REGISTRO
          #
          # HOJE:
          # registra automaticamente a hora atual.
          #
          # DATA ANTERIOR:
          # abre campo para digitar a hora.
          # ==================================================

          antigo_botao = '''                if (n >= 0) {
                    r.punches[n] = nowTime()
                    saveData()
                    showPunch()
                }'''

          novo_botao = '''                if (n >= 0) {

                    if (selectedPunchDate == today()) {

                        r.punches[n] = nowTime()

                        saveData()

                        showPunch()

                    } else {

                        val entrada = timeEdit(
                            "",
                            punchNames[n]
                        )

                        AlertDialog.Builder(
                            this@MainActivity
                        )
                            .setTitle(
                                punchNames[n]
                            )
                            .setMessage(
                                "Informe o horário da batida para ${df.format(parseIso(selectedPunchDate))}."
                            )
                            .setView(entrada)
                            .setNegativeButton(
                                "Cancelar",
                                null
                            )
                            .setPositiveButton(
                                "Salvar"
                            ) { _, _ ->

                                val horario =
                                    normalizeTime(
                                        entrada.text.toString()
                                    )

                                if (horario.isNotBlank()) {

                                    r.punches[n] =
                                        horario

                                    saveData()

                                    showPunch()
                                }
                            }
                            .show()
                    }
                }'''

          replace_once(
              antigo_botao,
              novo_botao,
              "registro retroativo"
          )

          # ==================================================
          # 8. GARANTIAS
          # ==================================================

          obrigatorios = [
              'private var selectedPunchDate = ""',
              'private fun choosePunchDate()',
              'selectedPunchDate = today()',
              'getRecord(emp.id, selectedPunchDate)',
              'selectedPunchDate == today()',
              'datePicker.maxDate=System.currentTimeMillis()',
              'setOnClickListener { choosePunchDate() }',
              'private fun normalizeTime',
              'private fun timeEdit'
          ]

          for item in obrigatorios:

              if item not in codigo:
                  raise SystemExit(
                      "ERRO FINAL: faltando " + item
                  )

          if "Button(context)" in codigo:
              raise SystemExit(
                  "ERRO FINAL: Button(context) encontrado"
              )

          arquivo.write_text(
              codigo,
              encoding="utf-8"
          )

          print("======================================")
          print("DATA RETROATIVA APLICADA")
          print("VERSÃO 36 PRESERVADA")
          print("ESCALA PRESERVADA")
          print("CÓDIGO PRONTO PARA COMPILAÇÃO")
          print("======================================")

      - name: Validar código
        shell: bash
        run: |
          set -e

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          test -s "$FILE"

          grep -q 'selectedPunchDate' "$FILE"
          grep -q 'choosePunchDate' "$FILE"
          grep -q 'datePicker.maxDate' "$FILE"
          grep -q 'private fun normalizeTime' "$FILE"
          grep -q 'private fun timeEdit' "$FILE"

          if grep -q 'Button(context)' "$FILE"; then
            echo "ERRO: Button(context) encontrado"
            exit 1
          fi

          echo "CÓDIGO VALIDADO"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q gradle-8.11.1-bin.zip

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e
          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug --no-daemon --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
