name: Gerar APK - ControleHoras

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "EXTRAINDO PROJETO"
          echo "================================"

          rm -rf ControleHoras
          unzip -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml

          echo "PROJETO EXTRAIDO"

      # ==========================================================
      # CORREÇÃO COMPLETA DO APLICATIVO
      # ==========================================================

      - name: Corrigir aplicativo
        shell: bash
        run: |
          set -e

          MAIN="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          mkdir -p "$(dirname "$MAIN")"

          cat > "$MAIN" <<'KOTLIN'
          package com.didhuuu.controlehoras

          import android.app.AlertDialog
          import android.os.Bundle
          import android.text.Editable
