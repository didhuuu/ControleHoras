              private fun showReport(){

                  val box=
                      page("Relatório Mensal")

                  if(employees.isEmpty()){

                      box.addView(
                          infoCard(
                              "Cadastre um funcionário."
                          )
                      )

                      return
                  }

                  val emp=
                      employees.firstOrNull{
                          it.id==
                              selectedEmployeeId
                      } ?: employees.first()

                  val ym=
                      SimpleDateFormat(
                          "yyyy-MM",
                          Locale.US
                      ).format(Date())

                  val list=
                      records.filter{
                          it.employeeId==
                              emp.id &&
                          it.date.startsWith(ym)
                      }

                  val worked=
                      list.sumOf{
                          calculate(it).worked
                      }

                  val e60=
                      list.sumOf{
                          calculate(it).extra60
                      }

                  val e100=
                      list.sumOf{
                          calculate(it).extra100
                      }

                  val normal=
                      list.sumOf{

                          val c=
                              calculate(it)

                          minOf(
                              c.worked,
                              c.expected
                          )
                      }

                  val scheduled=
                      scheduledDays(
                          emp.id,
                          ym
                      )

                  val workedDays=
                      list.count{

                          val c=
                              calculate(it)

                          c.worked>0 &&
                          c.expected>0
                      }

                  val absence=
                      max(
                          0,
                          scheduled-workedDays
                      )

                  val hourly=
                      emp.salary/220.0

                  val he60Value=
                      e60/60.0*
                      hourly*
                      1.60

                  val he100Value=
                      e100/60.0*
                      hourly*
                      2.00

                  val extraValue=
                      he60Value+
                      he100Value

                  val restDays=
                      max(
                          0,
                          calendarDaysInMonth(ym)-
                          scheduled
                      )

                  val dsr=
                      if(scheduled>0)
                          extraValue/
                          scheduled*
                          restDays
                      else
                          0.0

                  val finalTotal=
                      extraValue+
                      dsr

                  box.addView(
                      infoCard(
                          "${emp.name}\n"+
                          "Salário: "+
                          money.format(emp.salary)+
                          "\nValor hora normal: "+
                          money.format(hourly)
                      )
                  )

                  addReportLine(
                      box,
                      "Horas normais",
                      formatMin(normal)
                  )

                  addReportLine(
                      box,
                      "HE 60%",
                      formatMin(e60)
                  )

                  addReportLine(
                      box,
                      "HE 100%",
                      formatMin(e100)
                  )

                  addReportLine(
                      box,
                      "Total trabalhado",
                      formatMin(worked)
                  )

                  addReportLine(
                      box,
                      "Dias trabalhados",
                      workedDays.toString()
                  )

                  addReportLine(
                      box,
                      "Dias previstos na escala",
                      scheduled.toString()
                  )

                  addReportLine(
                      box,
                      "Dias de ausência",
                      absence.toString()
                  )

                  addReportLine(
                      box,
                      "Valor HE 60%",
                      money.format(
                          he60Value
                      )
                  )

                  addReportLine(
                      box,
                      "Valor HE 100%",
                      money.format(
                          he100Value
                      )
                  )

                  addReportLine(
                      box,
                      "DSR sobre horas extras",
                      money.format(dsr)
                  )

                  addReportLine(
                      box,
                      "TOTAL FINAL (HE + DSR)",
                      money.format(finalTotal),
                      true
                  )

                  box.addView(
                      Button(this).apply{

                          text=
                              "▧  GERAR PDF E COMPARTILHAR"

                          setOnClickListener{
                              sharePdf(
                                  emp,
                                  list
                              )
                          }
                      },
                      LinearLayout.LayoutParams(
                          -1,
                          dp(60)
                      )
                  )
              }

