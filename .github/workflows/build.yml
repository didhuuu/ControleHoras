          private fun registerPunch(
              empId:Long
          ){

              val r=
                  getRecord(
                      empId,
                      selectedPunchDate
                  )

              val n=
                  nextPunchIndex(
                      r,
                      extraEnabled(
                          empId,
                          selectedPunchDate
                      )
                  )

              if(n<0)
                  return

              if(
                  selectedPunchDate==
                  today()
              ){

                  r.punches[n]=
                      nowTime()

                  saveData()

                  showPunch()

                  return
              }

              val e=
                  timeEdit(
                      "",
                      punchNames[n]
                  )

              AlertDialog.Builder(this)
                  .setTitle(
                      "Lançar " +
                      punchNames[n]
                  )
                  .setMessage(
                      df.format(
                          parseIso(
                              selectedPunchDate
                          )
                      )
                  )
                  .setView(e)
                  .setNegativeButton(
                      "Cancelar",
                      null
                  )
                  .setPositiveButton(
                      "Salvar"
                  ){_,_->

                      val t=
                          normalizeTime(
                              e.text.toString()
                          )

                      if(t.isNotBlank()){

                          r.punches[n]=
                              t

                          saveData()

                          showPunch()

                      }else{

                          Toast.makeText(
                              this,
                              "Horário inválido.",
                              Toast.LENGTH_LONG
                          ).show()
                      }
                  }
                  .show()
          }

          private fun calculate(
              r:PunchDay
          ):Calc{

              var worked=
                  minutesBetween(
                      r.punches[0],
                      r.punches[1]
                  )+
                  minutesBetween(
                      r.punches[2],
                      r.punches[5]
                  )

              val extra2=
                  r.punches[3].isNotBlank() ||
                  r.punches[4].isNotBlank()

              if(extra2){

                  worked=
                      minutesBetween(
                          r.punches[0],
                          r.punches[1]
                      )+
                      minutesBetween(
                          r.punches[2],
                          r.punches[3]
                      )+
                      minutesBetween(
                          r.punches[4],
                          r.punches[5]
                      )
              }

              val date=
                  parseIso(
                      r.date
                  )

              if(
                  !modeForDay(
                      date
                  )
              ){

                  return Calc(
                      worked,
                      0,
                      0,
                      worked
                  )
              }

              val expected=
                  durationMinutes(
                      weeklyTarget
                  ) /
                  (
                      if(
                          modeForDate(
                              date
                          )=="MS"
                      )
                          6
                      else
                          5
                  )

              val extra=
                  max(
                      0,
                      worked-expected
                  )

              return Calc(
                  worked,
                  expected,
                  extra,
                  0
              )
          }

