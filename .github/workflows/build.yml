name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a versão 36
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess

          url = "https://raw.githubusercontent.com/didhuuu/ControleHoras/29bdaa86ef5b85ec79367cbced7c759063d7fe7b/.github/workflows/build.yml"

          workflow = urlopen(url, timeout=30).read().decode("utf-8")

          inicio = workflow.index(
              "      - name: Corrigir MainActivity"
          )

          fim = workflow.index(
              "      - name: Validar código",
              inicio
          )

          bloco = workflow[inicio:fim]

          marcador = "        run: |\n"

          pos = bloco.index(marcador) + len(marcador)

          linhas = bloco[pos:].splitlines()

          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in linhas
          )

          script_path = Path("/tmp/aplicar36.py")

          script_path.write_text(
              script + "\n",
              encoding="utf-8"
          )

          subprocess.run(
              ["python", str(script_path)],
              check=True
          )

          print("VERSÃO 36 APLICADA")

      - name: Adicionar somente seleção de data e preenchimento retroativo
        shell: python
        run: |
          from pathlib import Path

          p = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          s = p.read_text(encoding="utf-8")

          def need(old, new, label):
              global s

              if old not in s:
                  raise SystemExit(
                      "ERRO: trecho não encontrado: " + label
                  )

              s = s.replace(old, new, 1)

          # =====================================================
          # DATA SELECIONADA
          # =====================================================

          need(
              "    private var selectedEmployeeId = 0L\n",
              "    private var selectedEmployeeId = 0L\n"
              "    private var selectedPunchDate = \"\"\n",
              "selectedPunchDate"
          )

          # =====================================================
          # AO ABRIR O APP COMEÇA SEMPRE EM HOJE
          # =====================================================

          need(
              "        loadData()\n"
              "        if (employees.isNotEmpty()) selectedEmployeeId = employees.first().id",
              "        loadData()\n"
              "        selectedPunchDate = today()\n"
              "        if (employees.isNotEmpty()) selectedEmployeeId = employees.first().id",
              "data inicial"
          )

          # =====================================================
          # TROCOU FUNCIONÁRIO = VOLTA PARA HOJE
          # =====================================================

          need(
              "if (employees[pos].id != selectedEmployeeId) { "
              "selectedEmployeeId = employees[pos].id; showPunch() }",
              "if (employees[pos].id != selectedEmployeeId) { "
              "selectedEmployeeId = employees[pos].id; "
              "selectedPunchDate = today(); showPunch() }",
              "troca funcionário"
          )

          # =====================================================
          # ESCOLHER DATA
          # =====================================================

          marker = "    private fun today()=iso.format(Date())\n"

          if marker not in s:
              raise SystemExit(
                  "ERRO: função today() não encontrada"
              )

          date_helper = "\n".join([
              "    private fun choosePunchDate(){",
              "        val base=try{parseIso(selectedPunchDate)}catch(_:Exception){Date()}",
              "        val c=Calendar.getInstance().apply{time=base}",
              "        DatePickerDialog(this,{_,year,month,day->",
              "            val chosen=Calendar.getInstance().apply{",
              "                set(Calendar.YEAR,year)",
              "                set(Calendar.MONTH,month)",
              "                set(Calendar.DAY_OF_MONTH,day)",
              "                set(Calendar.HOUR_OF_DAY,0)",
              "                set(Calendar.MINUTE,0)",
              "                set(Calendar.SECOND,0)",
              "                set(Calendar.MILLISECOND,0)",
              "            }",
              "            val hoje=Calendar.getInstance().apply{",
              "                set(Calendar.HOUR_OF_DAY,0)",
              "                set(Calendar.MINUTE,0)",
              "                set(Calendar.SECOND,0)",
              "                set(Calendar.MILLISECOND,0)",
              "            }",
              "            if(!chosen.after(hoje)){",
              "                selectedPunchDate=iso.format(chosen.time)",
              "                showPunch()",
              "            }",
              "        },c.get(Calendar.YEAR),c.get(Calendar.MONTH),c.get(Calendar.DAY_OF_MONTH)).apply{",
              "            datePicker.maxDate=System.currentTimeMillis()",
              "        }.show()",
              "    }",
              ""
          ])

          s = s.replace(
              marker,
              marker + date_helper,
              1
          )

          # =====================================================
          # CARTÃO DA DATA
          # =====================================================

          date_line = (
              "        "
              + "line.addView(TextView(context).apply { "
              "text = \"Hoje\\n${df.format(Date())}\"; "
              "textSize = 16f; "
              "setTextColor(this@MainActivity.text); "
              "setTypeface(null, Typeface.BOLD) "
              "}, LinearLayout.LayoutParams(0, dp(60), 1f))"
          )

          date_line_new = (
              "        "
              + "line.addView(TextView(context).apply { "
              "text = \"Data do ponto\\n${df.format(parseIso(selectedPunchDate))}\"; "
              "textSize = 16f; "
              "setTextColor(this@MainActivity.text); "
              "setTypeface(null, Typeface.BOLD) "
              "}, LinearLayout.LayoutParams(0, dp(60), 1f))\n"
              "            line.addView(Button(context).apply { "
              "text = \"ALTERAR DATA\"; "
              "isAllCaps = false; "
              "setOnClickListener { choosePunchDate() } "
              "})"
          )

          need(
              date_line,
              date_line_new,
              "cartão da data"
          )

          # =====================================================
          # USAR A DATA ESCOLHIDA
          # =====================================================

          need(
              "val rec = getRecord(emp.id, today())",
              "val rec = getRecord(emp.id, selectedPunchDate)",
              "registro selecionado"
          )

          need(
              "val r = getRecord(emp.id, today())",
              "val r = getRecord(emp.id, selectedPunchDate)",
              "registro da batida"
          )

          # =====================================================
          # BATIDA:
          # HOJE = HORA ATUAL
          # DATA PASSADA = DIGITAR HORÁRIO
          # =====================================================

          old_click = "\n".join([
              "                if (n >= 0) {",
              "                      r.punches[n] = nowTime()",
              "                      saveData()",
              "                      showPunch()",
              "                  }",
          ])

          new_click = "\n".join([
              "                if (n >= 0) {",
              "                      if (selectedPunchDate == today()) {",
              "                          r.punches[n] = nowTime()",
              "                          saveData()",
              "                          showPunch()",
              "                      } else {",
              "                          val e=timeEdit(\"\",punchNames[n])",
              "                          AlertDialog.Builder(this)",
              "                              .setTitle(punchNames[n])",
              "                              .setMessage(\"Informe o horário da batida para ${df.format(parseIso(selectedPunchDate))}.\")",
              "                              .setView(e)",
              "                              .setNegativeButton(\"Cancelar\",null)",
              "                              .setPositiveButton(\"Salvar\"){_,_->",
              "                                  val t=normalizeTime(e.text.toString())",
              "                                  if(t.isNotBlank()){",
              "                                      r.punches[n]=t",
              "                                      saveData()",
              "                                      showPunch()",
              "                                  }",
              "                              }",
              "                              .show()",
              "                      }",
              "                  }",
          ])

          need(
              old_click,
              new_click,
              "batida retroativa"
          )

          # =====================================================
          # VALIDAÇÃO
          # =====================================================

          required = [
              "private var selectedPunchDate = \"\"",
              "private fun choosePunchDate()",
              "datePicker.maxDate=System.currentTimeMillis()",
              "getRecord(emp.id, selectedPunchDate)",
              "selectedPunchDate == today()"
          ]

          for item in required:
              if item not in s:
                  raise SystemExit(
                      "ERRO FINAL: " + item
                  )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print(
              "DATA RETROATIVA APLICADA SEM ALTERAR A ESCALA"
          )

      - name: Validar código final
        shell: python
        run: |
          from pathlib import Path

          p = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          s = p.read_text(encoding="utf-8")

          itens = [
              "private var selectedPunchDate = \"\"",
              "private fun choosePunchDate()",
              "datePicker.maxDate=System.currentTimeMillis()",
              "getRecord(emp.id, selectedPunchDate)",
              "selectedPunchDate == today()",
              "private fun normalizeTime",
              "private fun timeEdit",
              "private fun weekKey",
              "private fun modeForDate",
              "private fun modeForDay",
              "private fun calculate(r:PunchDay):Calc"
          ]

          for item in itens:
              if item not in s:
                  raise SystemExit(
                      "ERRO DE VALIDACAO: " + item
                  )

          if s.count("{") != s.count("}"):
              raise SystemExit(
                  "ERRO DE VALIDACAO: chaves incompatíveis"
              )

          print("CÓDIGO FINAL VALIDADO")

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q gradle-8.11.1-bin.zip

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug --no-daemon --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "========================================"
          echo "APK GERADO COM SUCESSO"
          echo "========================================"

          ls -lh "$APK"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
