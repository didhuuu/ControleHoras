name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1 - BAIXAR PROJETO
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4


      # ============================================================
      # 2 - JAVA 17
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3 - EXTRAIR PROJETO
      # ============================================================

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXTRAINDO CONTROLEHORAS"
          echo "========================================"

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"


      # ============================================================
      # 4 - BASE 70
      # ============================================================

      - name: Aplicar exatamente a Base 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          print("========================================")
          print("APLICANDO BASE 70")
          print("========================================")

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=60
          ).read().decode("utf-8")


          def extract_step(name, next_name):

              start_marker = (
                  f"      - name: {name}"
              )

              end_marker = (
                  f"      - name: {next_name}"
              )

              if start_marker not in workflow:
                  raise RuntimeError(
                      f"Etapa não encontrada: {name}"
                  )

              start = workflow.index(
                  start_marker
              )

              if end_marker not in workflow[start:]:
                  raise RuntimeError(
                      f"Próxima etapa não encontrada: {next_name}"
                  )

              end = workflow.index(
                  end_marker,
                  start
              )

              block = workflow[
                  start:end
              ]

              marker = (
                  "        run: |\n"
              )

              if marker not in block:
                  raise RuntimeError(
                      f"run não encontrado: {name}"
                  )

              pos = (
                  block.index(marker)
                  + len(marker)
              )

              lines = block[
                  pos:
              ].splitlines()

              return (
                  "\n".join(
                      line[10:]
                      if line.startswith("          ")
                      else line
                      for line in lines
                  ).rstrip()
                  + "\n"
              )


          scripts = [

              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),

              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )

          ]


          for i, script in enumerate(scripts):

              path = (
                  Path(tempfile.gettempdir())
                  / f"base70_{i}.py"
              )

              path.write_text(
                  script,
                  encoding="utf-8"
              )

              compile(
                  script,
                  str(path),
                  "exec"
              )

              subprocess.run(
                  [
                      "python",
                      str(path)
                  ],
                  check=True
              )


          print("========================================")
          print("BASE 70 APLICADA")
          print("ESCALA PRESERVADA")
          print("========================================")


      # ============================================================
      # 5 - FUNCIONALIDADES DA VERSÃO 80
      # ============================================================

      - name: Aplicar funcionalidades da versão 80
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          print("========================================")
          print("APLICANDO VERSÃO 80")
          print("========================================")

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=60
          ).read().decode("utf-8")


          start_marker = (
              "      - name: "
              "Aplicar correções finais da Base 70, "
              "edição por rolagem e ícone"
          )

          end_marker = (
              "      - name: Validar código e ícone"
          )


          if start_marker not in workflow:
              raise RuntimeError(
                  "Bloco da versão 80 não encontrado."
              )

          start = workflow.index(
              start_marker
          )

          end = workflow.index(
              end_marker,
              start
          )

          block = workflow[
              start:end
          ]

          marker = (
              "        run: |\n"
          )

          if marker not in block:
              raise RuntimeError(
                  "Bloco Python da versão 80 não encontrado."
              )

          pos = (
              block.index(marker)
              + len(marker)
          )

          lines = block[
              pos:
          ].splitlines()

          script = (
              "\n".join(
                  line[10:]
                  if line.startswith("          ")
                  else line
                  for line in lines
              ).rstrip()
              + "\n"
          )


          path = (
              Path(tempfile.gettempdir())
              / "versao80.py"
          )

          path.write_text(
              script,
              encoding="utf-8"
          )

          compile(
              script,
              str(path),
              "exec"
          )

          subprocess.run(
              [
                  "python",
                  str(path)
              ],
              check=True
          )

          print("========================================")
          print("VERSÃO 80 APLICADA")
          print("========================================")


      # ============================================================
      # 6 - CORRIGIR ADDVIEW DA VERSÃO 80
      # ============================================================

      - name: Corrigir estrutura do cartão
        shell: python
        run: |
          from pathlib import Path
          import re

          src = Path(
              "ControleHoras/"
              "app/src/main/java/com/didhuuu/"
              "controlehoras/MainActivity.kt"
          )

          code = src.read_text(
              encoding="utf-8"
          )


          pattern = re.compile(
              r"box\.addView"
              r"\s*card\(\.apply\{"
              r"(?P<body>.*?)"
              r"\s*addViewline\s*"
              r"\},"
              r"\s*0,"
              r"\s*0,"
              r"\s*0,"
              r"\s*dp10"
              r"\s*\)",
              re.S
          )


          match = pattern.search(
              code
          )


          if match:

              body = match.group(
                  "body"
              )

              replacement = (
                  "val employeeCard="
                  "((card() as android.view.ViewGroup).apply{\n"
                  + body
                  + "\n})\n\n"
                  + "box.addView(\n"
                  + "    employeeCard,\n"
                  + "    LinearLayout.LayoutParams(\n"
                  + "        -1,\n"
                  + "        -2\n"
                  + "    ).apply{\n"
                  + "        bottomMargin=dp(10)\n"
                  + "    }\n"
                  + ")"
              )

              code = (
                  code[:match.start()]
                  + replacement
                  + code[match.end():]
              )

          elif "val employeeCard=" not in code:

              raise SystemExit(
                  "ERRO: cartão de funcionário não encontrado."
              )


          src.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "CARTÃO DE FUNCIONÁRIO CORRIGIDO"
          )


      # ============================================================
      # 7 - CRIAR SOM DA ROLETA
      # ============================================================

      - name: Criar som mecânico da roleta
        shell: python
        run: |
          from pathlib import Path
          import wave
          import math
          import struct

          raw = Path(
              "ControleHoras/"
              "app/src/main/res/raw"
          )

          raw.mkdir(
              parents=True,
              exist_ok=True
          )

          filename = (
              raw / "roller_click.wav"
          )

          rate = 44100
          duration = 0.035

          total = int(
              rate * duration
          )

          frames = []


          for i in range(total):

              t = i / rate

              envelope = (
                  1.0 -
                  (i / total)
              )

              sample = int(
                  15000 *
                  envelope *
                  math.sin(
                      2 *
                      math.pi *
                      1800 *
                      t
                  )
              )

              frames.append(
                  struct.pack(
                      "<h",
                      sample
                  )
              )


          with wave.open(
              str(filename),
              "wb"
          ) as wav:

              wav.setnchannels(
                  1
              )

              wav.setsampwidth(
                  2
              )

              wav.setframerate(
                  rate
              )

              wav.writeframes(
                  b"".join(frames)
              )


          test = filename.read_bytes()

          if len(test) < 100:
              raise SystemExit(
                  "ERRO: som não foi criado."
              )

          print(
              "SOM MECÂNICO CRIADO"
          )


      # ============================================================
      # 8 - INSTALAR ROLETA DIRETAMENTE
      #
      # NÃO USA MAIS O SCRIPT ANTIGO DA VERSÃO 39.
      # ============================================================

      - name: Instalar roleta azul neon
        shell: python
        run: |
          from pathlib import Path
          import re

          src = Path(
              "ControleHoras/"
              "app/src/main/java/com/didhuuu/"
              "controlehoras/MainActivity.kt"
          )

          if not src.exists():
              raise SystemExit(
                  "MainActivity.kt não encontrado."
              )

          code = src.read_text(
              encoding="utf-8"
          )


          # ========================================================
          # IMPORTS
          # ========================================================

          package_end = code.find(
              "\n",
              code.find("package ")
          )


          imports = [
              "import android.content.Context",
              "import android.graphics.Canvas",
              "import android.graphics.Paint",
              "import android.graphics.Path",
              "import android.graphics.LinearGradient",
              "import android.graphics.Shader",
              "import android.graphics.RectF",
              "import android.media.AudioAttributes",
              "import android.media.SoundPool",
              "import android.view.MotionEvent"
          ]


          insertion = ""

          for imp in imports:

              if imp not in code:

                  insertion += (
                      imp + "\n"
                  )


          if insertion:

              code = (
                  code[:package_end + 1]
                  + insertion
                  + code[package_end + 1:]
              )


          # ========================================================
          # NOMES DAS BATIDAS
          # ========================================================

          if "private val punchNames" not in code:

              names = """
              private val punchNames=arrayOf<String>(
                  "Entrada",
                  "Saída",
                  "Retorno",
                  "Saída intervalo 2",
                  "Retorno intervalo 2",
                  "Saída"
              )

              """

              class_pos = code.find(
                  "class MainActivity"
              )

              if class_pos < 0:
                  raise SystemExit(
                      "MainActivity não encontrada."
                  )

              code = (
                  code[:class_pos]
                  + names
                  + code[class_pos:]
              )


          # ========================================================
          # REFERÊNCIA DA PÁGINA
          # ========================================================

          if (
              "private var controleHorasPunchPage"
              not in code
          ):

              class_pos = code.find(
                  "class MainActivity"
              )

              if class_pos < 0:
                  raise SystemExit(
                      "MainActivity não encontrada."
                  )

              prop = """
                  private var controleHorasPunchPage:View?=null

              """

              code = (
                  code[:class_pos]
                  + prop
                  + code[class_pos:]
              )


          # ========================================================
          # CLASSE DA ROLETA
          # ========================================================

          if (
              "class ControleHorasTimeWheelView"
              not in code
          ):

              wheel_class = r"""
              private class ControleHorasTimeWheelView(
                  context:Context,
                  private val maximum:Int,
                  initial:Int
              ):View(context){

                  private val density=
                      resources.displayMetrics.density

                  private fun dp(
                      v:Float
                  )=v*density

                  private val paint=
                      Paint(
                          Paint.ANTI_ALIAS_FLAG
                      )

                  private var current=
                      initial.coerceIn(
                          0,
                          maximum
                      )

                  private var downY=0f

                  private var moved=false

                  private val audio=
                      SoundPool.Builder()
                          .setMaxStreams(2)
                          .setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(
                                      AudioAttributes.USAGE_ASSISTANCE_SONIFICATION
                                  )
                                  .setContentType(
                                      AudioAttributes.CONTENT_TYPE_SONIFICATION
                                  )
                                  .build()
                          )
                          .build()

                  private var clickId=0

                  var onValueChanged:
                      ((Int)->Unit)?=null

                  init{

                      setLayerType(
                          View.LAYER_TYPE_SOFTWARE,
                          null
                      )

                      clickId=
                          audio.load(
                              context,
                              com.didhuuu.controlehoras.R.raw.roller_click,
                              1
                          )

                      setBackgroundColor(
                          0xFF111111.toInt()
                      )
                  }

                  fun value()=
                      current

                  fun setCurrent(
                      v:Int
                  ){

                      current=
                          v.coerceIn(
                              0,
                              maximum
                          )

                      invalidate()

                      onValueChanged?.invoke(
                          current
                      )
                  }

                  private fun click(){

                      if(clickId>0){

                          audio.play(
                              clickId,
                              0.35f,
                              0.35f,
                              1,
                              0,
                              1f
                          )
                      }
                  }

                  private fun change(
                      delta:Int
                  ){

                      val old=current

                      current=
                          (
                              current+delta
                          ).coerceIn(
                              0,
                              maximum
                          )

                      if(
                          old!=current
                      ){

                          click()

                          onValueChanged?.invoke(
                              current
                          )

                          invalidate()
                      }
                  }

                  override fun onDraw(
                      canvas:Canvas
                  ){

                      super.onDraw(
                          canvas
                      )

                      val w=
                          width.toFloat()

                      val h=
                          height.toFloat()

                      val radius=
                          dp(20f)


                      paint.shader=
                          LinearGradient(
                              0f,
                              0f,
                              w,
                              0f,
                              intArrayOf(
                                  0xFF151515.toInt(),
                                  0xFFBFC2C4.toInt(),
                                  0xFFF8F8F8.toInt(),
                                  0xFF96999B.toInt(),
                                  0xFF151515.toInt()
                              ),
                              null,
                              Shader.TileMode.CLAMP
                          )


                      canvas.drawRoundRect(
                          RectF(
                              0f,
                              0f,
                              w,
                              h
                          ),
                          radius,
                          radius,
                          paint
                      )


                      paint.shader=null

                      paint.style=
                          Paint.Style.STROKE

                      paint.strokeWidth=
                          dp(2f)

                      paint.color=
                          0xFF707070.toInt()


                      canvas.drawRoundRect(
                          RectF(
                              dp(4f),
                              dp(4f),
                              w-dp(4f),
                              h-dp(4f)
                          ),
                          radius,
                          radius,
                          paint
                      )


                      paint.style=
                          Paint.Style.FILL


                      val centerY=
                          h/2f

                      val bandH=
                          dp(58f)


                      paint.setShadowLayer(
                          dp(10f),
                          0f,
                          0f,
                          0xCC006EFF.toInt()
                      )


                      paint.color=
                          0xFF086BEA.toInt()


                      canvas.drawRoundRect(
                          RectF(
                              dp(9f),
                              centerY-bandH/2f,
                              w-dp(9f),
                              centerY+bandH/2f
                          ),
                          dp(9f),
                          dp(9f),
                          paint
                      )


                      paint.clearShadowLayer()


                      val centerPaint=
                          Paint(
                              Paint.ANTI_ALIAS_FLAG
                          )


                      centerPaint.color=
                          0xFFFFFFFF.toInt()

                      centerPaint.textAlign=
                          Paint.Align.CENTER

                      centerPaint.typeface=
                          android.graphics.Typeface.DEFAULT_BOLD

                      centerPaint.textSize=
                          dp(31f)


                      val centerBase=
                          centerY-
                          (
                              centerPaint.ascent()+
                              centerPaint.descent()
                          )/2f


                      canvas.drawText(
                          current
                              .toString()
                              .padStart(
                                  2,
                                  '0'
                              ),
                          w/2f,
                          centerBase,
                          centerPaint
                      )


                      val normalPaint=
                          Paint(
                              Paint.ANTI_ALIAS_FLAG
                          )

                      normalPaint.color=
                          0xFF101318.toInt()

                      normalPaint.textAlign=
                          Paint.Align.CENTER

                      normalPaint.typeface=
                          android.graphics.Typeface.DEFAULT_BOLD

                      normalPaint.textSize=
                          dp(25f)


                      val step=
                          dp(51f)


                      for(offset in -2..2){

                          if(offset==0)
                              continue

                          val number=
                              current+offset

                          if(
                              number<0 ||
                              number>maximum
                          )
                              continue

                          val y=
                              centerBase+
                              offset*step

                          normalPaint.alpha=
                              when(
                                  kotlin.math.abs(
                                      offset
                                  )
                              ){
                                  1->255
                                  else->125
                              }

                          canvas.drawText(
                              number
                                  .toString()
                                  .padStart(
                                      2,
                                      '0'
                                  ),
                              w/2f,
                              y,
                              normalPaint
                          )
                      }


                      normalPaint.alpha=255


                      val arrowPaint=
                          Paint(
                              Paint.ANTI_ALIAS_FLAG
                          )

                      arrowPaint.color=
                          0xFF1494FF.toInt()


                      val left=
                          Path()

                      left.moveTo(
                          dp(7f),
                          centerY
                      )

                      left.lineTo(
                          dp(25f),
                          centerY-dp(14f)
                      )

                      left.lineTo(
                          dp(25f),
                          centerY+dp(14f)
                      )

                      left.close()

                      canvas.drawPath(
                          left,
                          arrowPaint
                      )


                      val right=
                          Path()

                      right.moveTo(
                          w-dp(7f),
                          centerY
                      )

                      right.lineTo(
                          w-dp(25f),
                          centerY-dp(14f)
                      )

                      right.lineTo(
                          w-dp(25f),
                          centerY+dp(14f)
                      )

                      right.close()

                      canvas.drawPath(
                          right,
                          arrowPaint
                      )
                  }


                  override fun onTouchEvent(
                      event:MotionEvent
                  ):Boolean{

                      when(
                          event.actionMasked
                      ){

                          MotionEvent.ACTION_DOWN->{

                              downY=
                                  event.y

                              moved=false

                              return true
                          }


                          MotionEvent.ACTION_MOVE->{

                              val distance=
                                  downY-event.y

                              if(
                                  kotlin.math.abs(
                                      distance
                                  )>=dp(24f)
                              ){

                                  moved=true

                                  val steps=
                                      (
                                          distance/
                                          dp(24f)
                                      ).toInt()

                                  if(steps!=0){

                                      val direction=
                                          if(
                                              steps>0
                                          )
                                              1
                                          else
                                              -1

                                      repeat(
                                          kotlin.math.abs(
                                              steps
                                          )
                                      ){
                                          change(
                                              direction
                                          )
                                      }

                                      downY=
                                          event.y
                                  }
                              }

                              return true
                          }


                          MotionEvent.ACTION_UP->{

                              if(!moved){

                                  if(
                                      event.x<
                                      width/2f
                                  )
                                      change(-1)
                                  else
                                      change(1)
                              }

                              performClick()

                              return true
                          }


                          MotionEvent.ACTION_CANCEL->{

                              return true
                          }
                      }

                      return true
                  }


                  override fun performClick():
                      Boolean{

                      super.performClick()

                      return true
                  }


                  override fun onDetachedFromWindow(){

                      audio.release()

                      super.onDetachedFromWindow()
                  }
              }

              """


              main_index=
                  code.find(
                      "class MainActivity"
                  )


              if(main_index<0):
                  raise SystemExit(
                      "MainActivity não encontrada."
                  )


              code=(
                  code[:main_index]
                  +wheel_class
                  +"\n"
                  +code[main_index:]
              )


          # ========================================================
          # DIÁLOGO DA ROLETA
          # ========================================================

          dialog_method = r"""
