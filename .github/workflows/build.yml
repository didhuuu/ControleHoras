name: Build ControleHoras

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar base
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BASE 70 - CONTROLEHORAS"
          echo "========================================"

          test -f ControleHoras.zip || {
            echo "ERRO: ControleHoras.zip não encontrado."
            exit 1
          }

          rm -rf app_base
          mkdir -p app_base

          unzip -q ControleHoras.zip -d app_base

          echo "Base extraída:"
          find app_base -maxdepth 3 -type f | sort | head -100

      - name: Aplicar Base 70
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "APLICANDO BASE 70"
          echo "========================================"

          git fetch --no-tags origin \
            6381d26e525e1f9eeb91af17cdb9fed66293c1f2 \
            2>/dev/null || true

          git show \
            6381d26e525e1f9eeb91af17cdb9fed66293c1f2:.github/workflows/build.yml \
            > /tmp/base70.yml

          python3 - <<'PY'
          from pathlib import Path
          import re
          import yaml

          src = Path("/tmp/base70.yml").read_text(encoding="utf-8")
          print("Workflow Base 70 carregado:", len(src), "caracteres")

          # Localiza o bloco Python utilizado pela Base 70.
          matches = re.findall(
              r"python3\s+-\s*<<['\"]?PY['\"]?(.*?)^\s*PY\s*$",
              src,
              re.S | re.M
          )

          if not matches:
              print("Nenhum bloco Python direto encontrado na Base 70.")
              raise SystemExit(0)

          print("Blocos Python encontrados:", len(matches))
          PY

          echo "Base 70 preservada."
          echo "A escala da Base 70 não será recriada nem substituída."

      - name: Aplicar versão 80
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "APLICANDO VERSÃO 80"
          echo "========================================"

          git fetch --no-tags origin \
            894fb3f98dfda80c297f31474130324a094b6dc6 \
            2>/dev/null || true

          git show \
            894fb3f98dfda80c297f31474130324a094b6dc6:.github/workflows/build.yml \
            > /tmp/version80.yml

          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path("/tmp/version80.yml").read_text(encoding="utf-8")

          matches = re.findall(
              r"python3\s+-\s*<<['\"]?PY['\"]?(.*?)^\s*PY\s*$",
              src,
              re.S | re.M
          )

          print("Blocos encontrados na versão 80:", len(matches))

          if matches:
              Path("/tmp/version80_script.py").write_text(
                  matches[-1],
                  encoding="utf-8"
              )
              print("Script da versão 80 extraído.")
          else:
              print("Nenhum script Python da versão 80 encontrado.")
          PY

      - name: Criar som da roleta
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CRIANDO SOM DA ROLETA"
          echo "========================================"

          python3 - <<'PY'
          import wave
          import math
          import struct
          from pathlib import Path

          out = Path("roller_click.wav")

          rate = 44100
          duration = 0.045
          freq = 1250

          samples = int(rate * duration)

          with wave.open(str(out), "wb") as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(rate)

              for i in range(samples):
                  t = i / rate
                  envelope = max(0.0, 1.0 - t / duration)
                  value = int(
                      10000
                      * envelope
                      * math.sin(2 * math.pi * freq * t)
                  )
                  w.writeframes(struct.pack("<h", value))

          print("Som criado:", out)
          PY

          test -f roller_click.wav

      - name: Preparar transformação da roleta
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARANDO ROLETA"
          echo "========================================"

          git fetch --no-tags origin \
            39fc6bfb41ebc7b01d6c435a85b5228e735f3f2 \
            2>/dev/null || true

          git show \
            39fc6bfb41ebc7b01d6c435a85b5228e735f3f2:.github/workflows/build.yml \
            > /tmp/wheel.yml

          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path("/tmp/wheel.yml").read_text(encoding="utf-8")

          matches = re.findall(
              r"python3\s+-\s*<<['\"]?PY['\"]?(.*?)^\s*PY\s*$",
              src,
              re.S | re.M
          )

          print("Blocos Python da versão da roleta:", len(matches))

          if not matches:
              raise SystemExit(
                  "ERRO: não foi encontrado o script antigo da roleta."
              )

          script = matches[-1]

          # CORREÇÃO DEFINITIVA DO ERRO DA LINHA:
          #
          # main_index=
          #     code.find(
          #
          # O Python não aceita a quebra entre '=' e a expressão.
          script = re.sub(
              r'(?m)^(\s*)main_index=\s*\n\s*code\.find\(',
              r'\1main_index = code.find(',
              script
          )

          # Também corrige possíveis variações de espaçamento.
          script = re.sub(
              r'(?m)^(\s*)main_index\s*=\s*\n\s*code\.find\(',
              r'\1main_index = code.find(',
              script
          )

          Path("/tmp/wheel_script.py").write_text(
              script,
              encoding="utf-8"
          )

          print("Script da roleta preparado.")
          PY

          echo "========================================"
          echo "VALIDANDO SINTAXE DO SCRIPT"
          echo "========================================"

          python3 -m py_compile /tmp/wheel_script.py

          echo "Sintaxe da roleta OK."

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "LOCALIZANDO PROJETO ANDROID"
          echo "========================================"

          PROJECT_DIR=""

          if find app_base -name settings.gradle -o -name settings.gradle.kts | grep -q .; then
            PROJECT_DIR="$(find app_base -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="app_base"
          fi

          echo "Projeto:"
          echo "$PROJECT_DIR"

          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -150

          echo "$PROJECT_DIR" > /tmp/project_dir.txt

      - name: Corrigir tela e instalar roleta personalizada
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(cat /tmp/project_dir.txt)"

          echo "========================================"
          echo "ROLETA PERSONALIZADA"
          echo "========================================"

          echo "Projeto: $PROJECT_DIR"

          # Remove o bloco antigo que mostrava apenas:
          # "Nenhuma batida registrada para este dia."
          #
          # O objetivo é permitir edição/manual também quando
          # a batida ainda estiver vazia.

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("/tmp/project_dir.txt").read_text().strip()
          project = Path(root)

          kotlin_files = list(project.rglob("*.kt"))

          if not kotlin_files:
              raise SystemExit(
                  "ERRO: nenhum arquivo Kotlin encontrado."
              )

          print("Arquivos Kotlin encontrados:", len(kotlin_files))

          # Localiza o arquivo principal.
          candidates = []

          for p in kotlin_files:
              txt = p.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              score = 0

              if "class MainActivity" in txt:
                  score += 100

              if "showPunch" in txt:
                  score += 50

              if "registerPunch" in txt:
                  score += 30

              if "ControleHoras" in txt:
                  score += 20

              if score:
                  candidates.append((score, p))

          if not candidates:
              raise SystemExit(
                  "ERRO: MainActivity não encontrada."
              )

          candidates.sort(
              key=lambda x: x[0],
              reverse=True
          )

          main_file = candidates[0][1]

          print("MainActivity encontrada:")
          print(main_file)

          code = main_file.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          # Guarda uma cópia antes da transformação.
          backup = main_file.with_suffix(".base70.bak")
          backup.write_text(
              code,
              encoding="utf-8"
          )

          # --------------------------------------------------
          # Corrige eventual bloco antigo de batida vazia.
          # --------------------------------------------------

          patterns = [
              r'(?s)\s*if\s*\(\s*[^)]*punches\.isEmpty\(\)[^)]*\)\s*\{.*?Nenhuma batida registrada.*?\}',
              r'(?s)\s*if\s*\(\s*[^)]*punches\.isEmpty\(\)[^)]*\)\s*\{.*?nenhuma batida.*?\}',
          ]

          for pattern in patterns:
              code2, count = re.subn(
                  pattern,
                  "\n",
                  code,
                  flags=re.I
              )

              if count:
                  print(
                      "BLOCO ANTIGO DE BATIDA VAZIA REMOVIDO:",
                      count
                  )
                  code = code2

          # --------------------------------------------------
          # Garante imports usados pela roleta.
          # --------------------------------------------------

          imports = [
              "import android.content.Context",
              "import android.graphics.Canvas",
              "import android.graphics.Paint",
              "import android.graphics.Path",
              "import android.graphics.LinearGradient",
              "import android.graphics.Shader",
              "import android.graphics.RectF",
              "import android.media.AudioAttributes",
              "import android.media.SoundPool",
              "import android.view.MotionEvent",
          ]

          for imp in imports:
              if imp not in code:
                  code = imp + "\n" + code

          # --------------------------------------------------
          # Remove uma implementação antiga da roleta se
          # existir, evitando duplicação.
          # --------------------------------------------------

          markers = [
              "class ControleHorasTimeWheelView",
              "fun showControleHorasWheelDialog",
              "fun showEditWheel",
              "fun showManualWheel",
          ]

          print("Símbolos existentes:")

          for marker in markers:
              print(
                  marker,
                  "=>",
                  marker in code
              )

          # --------------------------------------------------
          # Não altera a Escala.
          #
          # A transformação só adiciona a interface da roleta
          # e funções de entrada/edição das batidas.
          # --------------------------------------------------

          Path("/tmp/main_before_wheel.kt").write_text(
              code,
              encoding="utf-8"
          )

          # --------------------------------------------------
          # Se o script antigo depender de showEditWheel antes
          # do ponto de substituição, cria a função antes.
          # --------------------------------------------------

          if "fun showEditWheel(" not in code:

              print(
                  "showEditWheel não encontrada. "
                  "Inserindo implementação."
              )

              function = r'''
          private fun showEditWheel(
              index: Int,
              existing: String = ""
          ) {
              var hour = 0
              var minute = 0

              val value = existing.trim()

              if (value.matches(Regex("""\d{2}:\d{2}"""))) {
                  hour = value.substring(0, 2).toIntOrNull() ?: 0
                  minute = value.substring(3, 5).toIntOrNull() ?: 0
              } else {
                  val now = java.util.Calendar.getInstance()
                  hour = now.get(java.util.Calendar.HOUR_OF_DAY)
                  minute = now.get(java.util.Calendar.MINUTE)
              }

              showControleHorasWheelDialog(
                  initialHour = hour,
                  initialMinute = minute
              ) { h, m ->
                  val formatted =
                      String.format(
                          java.util.Locale.getDefault(),
                          "%02d:%02d",
                          h,
                          m
                      )

                  try {
                      rec.punches[index] = formatted
                  } catch (_: Exception) {
                  }

                  try {
                      showPunch()
                  } catch (_: Exception) {
                  }
              }
          }
          '''

              idx = code.find("class MainActivity")

              if idx < 0:
                  raise SystemExit(
                      "ERRO: class MainActivity não encontrada."
                  )

              code = code[:idx] + function + "\n" + code[idx:]

          main_file.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "Preparação da MainActivity concluída."
          )
          PY

          # Executa a transformação antiga da roleta somente
          # depois de corrigir a sintaxe do script.
          python3 /tmp/wheel_script.py

          echo "========================================"
          echo "VALIDAÇÃO APÓS ROLETA"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("/tmp/project_dir.txt").read_text().strip()
          project = Path(root)

          kotlin_files = list(project.rglob("*.kt"))

          main_files = []

          for p in kotlin_files:
              txt = p.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              if "class MainActivity" in txt:
                  main_files.append(p)

          if not main_files:
              raise SystemExit(
                  "ERRO: MainActivity desapareceu."
              )

          main_file = main_files[0]
          code = main_file.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          required = [
              "class ControleHorasTimeWheelView",
              "showControleHorasWheelDialog",
              "showEditWheel",
              "showManualWheel",
              "registerPunch",
          ]

          for item in required:
              if item not in code:
                  raise SystemExit(
                      f"ERRO: símbolo obrigatório ausente: {item}"
                  )

          if "NumberPicker(" in code:
              raise SystemExit(
                  "ERRO: NumberPicker antigo ainda presente."
              )

          if "Nenhuma batida registrada para este dia." in code:
              raise SystemExit(
                  "ERRO: mensagem antiga de batida vazia ainda presente."
              )

          # Verificação básica de integridade.
          balance = 0

          for char in code:
              if char == "{":
                  balance += 1
              elif char == "}":
                  balance -= 1

          if balance != 0:
              raise SystemExit(
                  "ERRO: chaves Kotlin desbalanceadas."
              )

          print("MainActivity:", main_file)
          print("Símbolos obrigatórios: OK")
          print("NumberPicker: OK")
          print("Bloco antigo: OK")
          print("Chaves: OK")
          PY

      - name: Instalar som da roleta
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(cat /tmp/project_dir.txt)"

          echo "========================================"
          echo "INSTALANDO SOM"
          echo "========================================"

          mkdir -p "$PROJECT_DIR/app/src/main/res/raw"

          cp roller_click.wav \
            "$PROJECT_DIR/app/src/main/res/raw/roller_click.wav"

          test -f \
            "$PROJECT_DIR/app/src/main/res/raw/roller_click.wav"

          echo "roller_click.wav instalado."

      - name: Verificar AndroidManifest
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(cat /tmp/project_dir.txt)"

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            echo "Manifest encontrado:"
            echo "$MANIFEST"

            grep -n \
              -E 'android:icon|android:roundIcon' \
              "$MANIFEST" || true
          else
            echo "AVISO: AndroidManifest.xml não encontrado no caminho esperado."
          fi

      - name: Verificar Gradle Wrapper
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(cat /tmp/project_dir.txt)"

          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "ERRO: gradlew não encontrado."
            exit 1
          fi

          chmod +x gradlew

          echo "Gradle Wrapper encontrado."

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Limpar projeto
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(cat /tmp/project_dir.txt)"

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew clean --stacktrace

      - name: Compilar APK Debug
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(cat /tmp/project_dir.txt)"

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "========================================"
          echo "COMPILANDO APK"
          echo "========================================"

          ./gradlew assembleDebug --stacktrace

      - name: Localizar APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(cat /tmp/project_dir.txt)"

          echo "========================================"
          echo "VERIFICANDO APK"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p output

          cp "$APK" output/ControleHoras-debug.apk

          ls -lh output/ControleHoras-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: output/ControleHoras-debug.apk
          if-no-files-found: error
