name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a versão 36
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess

          url = "https://raw.githubusercontent.com/didhuuu/ControleHoras/29bdaa86ef5b85ec79367cbced7c759063d7fe7b/.github/workflows/build.yml"

          workflow = urlopen(url, timeout=30).read().decode("utf-8")

          inicio = workflow.index(
              "      - name: Corrigir MainActivity"
          )

          fim = workflow.index(
              "      - name: Validar código",
              inicio
          )

          bloco = workflow[inicio:fim]

          marcador = "        run: |\n"

          pos = bloco.index(marcador) + len(marcador)

          linhas = bloco[pos:].splitlines()

          script = "\n".join(
              linha[10:] if linha.startswith("          ") else linha
              for linha in linhas
          )

          arquivo = Path("/tmp/corrigir36.py")

          arquivo.write_text(
              script + "\n",
              encoding="utf-8"
          )

          subprocess.run(
              ["python", str(arquivo)],
              check=True
          )

          print("VERSÃO 36 APLICADA")

      - name: Adicionar somente data retroativa
        shell: python
        run: |
          from pathlib import Path
          import re

          arquivo = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          codigo = arquivo.read_text(
              encoding="utf-8"
          )

          def obrigatorio(velho, novo, nome):
              global codigo

              if velho not in codigo:
                  raise SystemExit(
                      "ERRO: trecho não encontrado: " + nome
                  )

              codigo = codigo.replace(
                  velho,
                  novo,
                  1
              )

          # ==================================================
          # DATA SELECIONADA
          # ==================================================

          padrao = re.search(
              r'(?m)^(\s*)private var selectedEmployeeId = 0L\s*$',
              codigo
          )

          if not padrao:
              raise SystemExit(
                  "ERRO: selectedEmployeeId não encontrado"
              )

          codigo = (
              codigo[:padrao.end()]
              + "\n"
              + padrao.group(1)
              + 'private var selectedPunchDate = ""'
              + codigo[padrao.end():]
          )

          # ==================================================
          # AO ABRIR O APLICATIVO = HOJE
          # ==================================================

          obrigatorio(
              "        loadData()\n",
              "        loadData()\n"
              "        selectedPunchDate=today()\n",
              "loadData"
          )

          # ==================================================
          # TROCAR FUNCIONÁRIO = VOLTAR PARA HOJE
          # ==================================================

          antigo = (
              "selectedEmployeeId = employees[pos].id; showPunch()"
          )

          novo = (
              "selectedEmployeeId = employees[pos].id; "
              "selectedPunchDate=today(); showPunch()"
          )

          if antigo in codigo:

              codigo = codigo.replace(
                  antigo,
                  novo,
                  1
              )

          else:

              padrao_funcionario = (
                  r'selectedEmployeeId\s*=\s*'
                  r'employees\[pos\]\.id\s*;\s*'
                  r'showPunch\(\)'
              )

              codigo, quantidade = re.subn(
                  padrao_funcionario,
                  novo,
                  codigo,
                  count=1
              )

              if quantidade != 1:
                  raise SystemExit(
                      "ERRO: seleção de funcionário não encontrada"
                  )

          # ==================================================
          # FUNÇÃO PARA ESCOLHER DATA
          # ==================================================

          if "private fun choosePunchDate()" not in codigo:

              marcador = (
                  "    private fun today()=iso.format(Date())\n"
              )

              if marcador not in codigo:
                  raise SystemExit(
                      "ERRO: função today() não encontrada"
                  )

              funcao_data = '''    private fun choosePunchDate(){
                  val base=parseIso(selectedPunchDate)

                  val cal=Calendar.getInstance().apply{
                      time=base
                  }

                  DatePickerDialog(
                      this@MainActivity,
                      {_,year,month,day->

                          val escolhida=Calendar.getInstance().apply{
                              set(Calendar.YEAR,year)
                              set(Calendar.MONTH,month)
                              set(Calendar.DAY_OF_MONTH,day)
                              set(Calendar.HOUR_OF_DAY,0)
                              set(Calendar.MINUTE,0)
                              set(Calendar.SECOND,0)
                              set(Calendar.MILLISECOND,0)
                          }

                          val hoje=Calendar.getInstance().apply{
                              set(Calendar.HOUR_OF_DAY,0)
                              set(Calendar.MINUTE,0)
                              set(Calendar.SECOND,0)
                              set(Calendar.MILLISECOND,0)
                          }

                          if(!escolhida.after(hoje)){

                              selectedPunchDate=
                                  iso.format(escolhida.time)

                              showPunch()
                          }
                      },
                      cal.get(Calendar.YEAR),
                      cal.get(Calendar.MONTH),
                      cal.get(Calendar.DAY_OF_MONTH)
                  ).apply{
                      datePicker.maxDate=
                          System.currentTimeMillis()
                  }.show()
              }

          '''

              codigo = codigo.replace(
                  marcador,
                  marcador + funcao_data,
                  1
              )

          # ==================================================
          # SHOWPUNCH PASSA A USAR A DATA SELECIONADA
          # ==================================================

          inicio = codigo.find(
              "    private fun showPunch()"
          )

          fim = codigo.find(
              "    private val punchNames",
              inicio
          )

          if inicio < 0 or fim < 0:
              raise SystemExit(
                  "ERRO: showPunch não encontrada"
              )

          bloco_show = codigo[inicio:fim]

          bloco_show = bloco_show.replace(
              "getRecord(emp.id, today())",
              "getRecord(emp.id, selectedPunchDate)"
          )

          # Caso a versão 36 ainda esteja usando Date() diretamente
          bloco_show = bloco_show.replace(
              'text="Hoje\\n${df.format(Date())}"',
              'text="Data do ponto\\n${df.format(parseIso(selectedPunchDate))}"'
          )

          bloco_show = bloco_show.replace(
              'text = "Hoje\\n${df.format(Date())}"',
              'text = "Data do ponto\\n${df.format(parseIso(selectedPunchDate))}"'
          )

          # ==================================================
          # BOTÃO DE DATA
          # ==================================================

          if "choosePunchDate()" not in bloco_show:

              linhas = bloco_show.splitlines()

              nova_lista = []

              inseriu = False

              for linha in linhas:

                  nova_lista.append(linha)

                  if (
                      not inseriu
                      and "Hoje" in linha
                      and "df.format" in linha
                  ):

                      indentacao = linha[
                          :len(linha)-len(linha.lstrip())
                      ]

                      nova_lista.append(
                          indentacao
                          + 'setOnClickListener { choosePunchDate() }'
                      )

                      inseriu = True

          # ==================================================
          # REGISTRO DE PONTO
          # ==================================================

          antigo_clique = '''setOnClickListener {
                val r = getRecord(emp.id, selectedPunchDate)
                val n = r.punches.indexOfFirst { it.isBlank() }
                if (n >= 0) {
                    r.punches[n] = nowTime()
                    saveData()
                    showPunch()
                }
            }'''

          novo_clique = '''setOnClickListener {
                val r = getRecord(emp.id, selectedPunchDate)
                val n = r.punches.indexOfFirst { it.isBlank() }

                if (n >= 0) {

                    if (selectedPunchDate == today()) {

                        r.punches[n] = nowTime()

                        saveData()

                        showPunch()

                    } else {

                        val entrada = timeEdit(
                            "",
                            punchNames[n]
                        )

                        AlertDialog.Builder(
                            this@MainActivity
                        )
                            .setTitle(
                                punchNames[n]
                            )
                            .setMessage(
                                "Informe o horário da batida para ${df.format(parseIso(selectedPunchDate))}."
                            )
                            .setView(entrada)
                            .setNegativeButton(
                                "Cancelar",
                                null
                            )
                            .setPositiveButton(
                                "Salvar"
                            ) { _, _ ->

                                val horario =
                                    normalizeTime(
                                        entrada.text.toString()
                                    )

                                if (horario.isNotBlank()) {

                                    r.punches[n] =
                                        horario

                                    saveData()

                                    showPunch()
                                }
                            }
                            .show()
                    }
                }
            }'''

          if antigo_clique in bloco_show:

              bloco_show = bloco_show.replace(
                  antigo_clique,
                  novo_clique,
                  1
              )

          # ==================================================
          # VOLTA O SHOWPUNCH PARA O CÓDIGO
          # ==================================================

          codigo = (
              codigo[:inicio]
              + bloco_show
              + codigo[fim:]
          )

          # ==================================================
          # GARANTIAS
          # ==================================================

          obrigatorios = [
              'private var selectedPunchDate = ""',
              'private fun choosePunchDate()',
              'datePicker.maxDate',
              'getRecord(emp.id, selectedPunchDate)',
              'selectedPunchDate == today()',
              'private fun normalizeTime',
              'private fun timeEdit',
              'private fun weekKey',
              'private fun modeForDate',
              'Segunda a sexta — 08:48',
              'Segunda a sábado — 07:20'
          ]

          for item in obrigatorios:

              if item not in codigo:

                  raise SystemExit(
                      "ERRO FINAL: faltando " + item
                  )

          # Não permitir o erro que aconteceu anteriormente
          if "Button(context)" in codigo:

              raise SystemExit(
                  "ERRO FINAL: Button(context) encontrado"
              )

          arquivo.write_text(
              codigo,
              encoding="utf-8"
          )

          print("DATA RETROATIVA APLICADA")
          print("VERSÃO 36 PRESERVADA")
          print("CÓDIGO PRONTO PARA COMPILAÇÃO")

      - name: Validar código final
        shell: python
        run: |
          from pathlib import Path

          arquivo = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          codigo = arquivo.read_text(
              encoding="utf-8"
          )

          obrigatorios = [
              'private var selectedPunchDate = ""',
              'private fun choosePunchDate()',
              'getRecord(emp.id, selectedPunchDate)',
              'private fun normalizeTime',
              'private fun timeEdit',
              'private fun weekKey',
              'private fun modeForDate',
              'private fun modeForDay',
              'private fun calculate(r:PunchDay):Calc',
              'Segunda a sexta — 08:48',
              'Segunda a sábado — 07:20'
          ]

          for item in obrigatorios:

              if item not in codigo:
                  raise SystemExit(
                      "ERRO DE VALIDACAO: " + item
                  )

          if "Button(context)" in codigo:

              raise SystemExit(
                  "ERRO DE VALIDACAO: Button(context)"
              )

          print("CÓDIGO FINAL VALIDADO")

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q gradle-8.11.1-bin.zip

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e
          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug --no-daemon --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
