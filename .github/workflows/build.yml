name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name, next_name):

              start = workflow.index(
                  f"      - name: {name}"
              )

              end = workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              pos = block.index(marker) + len(marker)

              lines = block[pos:].splitlines()

              return "\n".join(
                  line[10:]
                  if line.startswith("          ")
                  else line
                  for line in lines
              ) + "\n"

          scripts = [
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for i, script in enumerate(scripts):

              p = (
                  Path(tempfile.gettempdir())
                  / f"base70_{i}.py"
              )

              p.write_text(
                  script,
                  encoding="utf-8"
              )

              subprocess.run(
                  ["python", str(p)],
                  check=True
              )

          print(
              "BASE 70 APLICADA"
          )

      - name: Aplicar funcionalidades da versão 80
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          start = workflow.index(
              "      - name: Aplicar correções finais da Base 70, edição por rolagem e ícone"
          )

          end = workflow.index(
              "      - name: Validar código e ícone",
              start
          )

          block = workflow[start:end]

          marker = "        run: |\n"

          pos = (
              block.index(marker)
              + len(marker)
          )

          lines = block[pos:].splitlines()

          script = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in lines
          ) + "\n"

          p = (
              Path(tempfile.gettempdir())
              / "funcionalidades.py"
          )

          p.write_text(
              script,
              encoding="utf-8"
          )

          subprocess.run(
              ["python", str(p)],
              check=True
          )

          print(
              "FUNCIONALIDADES DA VERSÃO 80 APLICADAS"
          )

      - name: Criar som mecânico da roleta
        shell: python
        run: |
          from pathlib import Path
          import wave
          import math
          import struct

          raw = Path(
              "ControleHoras/app/src/main/res/raw"
          )

          raw.mkdir(
              parents=True,
              exist_ok=True
          )

          filename = raw / "roller_click.wav"

          rate = 44100
          duration = 0.035

          frames = []

          for i in range(
              int(rate * duration)
          ):

              t = i / rate

              a = (
                  0.45
                  * math.exp(-85 * t)
                  * math.sin(
                      2 * math.pi * 1850 * t
                  )
              )

              b = (
                  0.22
                  * math.exp(-130 * t)
                  * math.sin(
                      2 * math.pi * 3200 * t
                  )
              )

              value = max(
                  -1.0,
                  min(
                      1.0,
                      a + b
                  )
              )

              frames.append(
                  struct.pack(
                      "<h",
                      int(value * 32767)
                  )
              )

          with wave.open(
              str(filename),
              "wb"
          ) as wav:

              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)

              wav.writeframes(
                  b"".join(frames)
              )

          print(
              "SOM DA ROLETA CRIADO"
          )

      - name: Corrigir tela e instalar roleta personalizada
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile
          import re

          src = Path(
              "ControleHoras/app/src/main/java/"
              "com/didhuuu/controlehoras/MainActivity.kt"
          )

          if not src.exists():

              raise SystemExit(
                  "ERRO: MainActivity.kt não encontrado"
              )

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "39fc6bfb41ebc7b01d6c435a85b5228e735f3f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          step_name = (
              "      - name: "
              "Corrigir tela e instalar roleta personalizada"
          )

          start = workflow.index(
              step_name
          )

          end = workflow.rfind(
              "      - name: Validar projeto antes do Gradle"
          )

          if end <= start:

              raise SystemExit(
                  "ERRO: etapa original da roleta não encontrada"
              )

          block = workflow[start:end]

          marker = "        run: |\n"

          pos = (
              block.index(marker)
              + len(marker)
          )

          lines = block[pos:].splitlines()

          script = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in lines
          ) + "\n"

          # ==========================================================
          # REMOVER BLOCO ANTIGO DE BATIDA VAZIA
          # ==========================================================

          bad_start = script.find(
              "# PERMITIR EDITAR BATIDA VAZIA"
          )

          if bad_start >= 0:

              bad_end = script.find(
                  "# GARANTIR MANIFESTO",
                  bad_start
              )

              if bad_end < 0:

                  raise SystemExit(
                      "ERRO: final do bloco de batida vazia não encontrado"
                  )

              script = (
                  script[:bad_start]
                  + script[bad_end:]
              )

              print(
                  "BLOCO ANTIGO DE BATIDA VAZIA REMOVIDO"
              )

          # ==========================================================
          # CORRIGIR main_index
          # ==========================================================

          script = script.replace(
              "main_index=\n"
              "        code.find(",
              "main_index = code.find("
          )

          script = script.replace(
              "main_index=\n"
              "    code.find(",
              "main_index = code.find("
          )

          # ==========================================================
          # EXTRAIR ROLETA
          # ==========================================================

          wheel_match = re.search(
              r"wheel_dialog\s*=\s*r'''(.*?)\n'''",
              script,
              flags=re.DOTALL
          )

          if wheel_match is None:

              raise SystemExit(
                  "ERRO: bloco wheel_dialog não encontrado"
              )

          wheel_dialog = wheel_match.group(1)

          if (
              "private fun showControleHorasWheelDialog("
              not in wheel_dialog
          ):

              raise SystemExit(
                  "ERRO: showControleHorasWheelDialog não encontrada na roleta"
              )

          print(
              "WHEEL_DIALOG EXTRAÍDO COM SUCESSO"
          )

          fixed_script = script

          # ==========================================================
          # CORRIGIR VALIDAÇÃO ANTIGA
          # ==========================================================

          fixed_script = fixed_script.replace(
              'if "showControleHorasWheelDialog(" not in code:',
              'if "private fun showControleHorasWheelDialog(" not in code:'
          )

          fixed_script = re.sub(
              r'if\s+"showControleHorasWheelDialog\("\s+not\s+in\s+code:',
              'if "private fun showControleHorasWheelDialog(" not in code:',
              fixed_script
          )

          fixed_script = re.sub(
              r'^\s*"showControleHorasWheelDialog",\s*$',
              '',
              fixed_script,
              flags=re.MULTILINE
          )

          fixed_script = re.sub(
              r'^\s*"showEditWheel",\s*$',
              '',
              fixed_script,
              flags=re.MULTILINE
          )

          # ==========================================================
          # GARANTIR showEditWheel ANTES DO BLOCO ANTIGO
          #
          # IMPORTANTE:
          # O script original tenta localizar showEditWheel antes
          # de chegar à validação final.
          #
          # Portanto a função precisa existir ANTES desse bloco.
          # ==========================================================

          ensure_edit_code = '''
if "private fun showEditWheel(" not in code:

    anchor = code.find(
        "    private fun showManualWheel("
    )

    if anchor < 0:

        raise SystemExit(
            "ERRO: showManualWheel não encontrado para inserir showEditWheel"
        )

    edit_method = "\\n".join([
        "    private fun showEditWheel(",
        "        rec:PunchDay,",
        "        index:Int",
        "    ){",
        "",
        "        val old=rec.punches[index]",
        "        val parts=old.split(\\":\\")",
        "        val now=Calendar.getInstance()",
        "",
        "        val hour=if(parts.size==2)",
        "            parts[0].toIntOrNull() ?: now.get(Calendar.HOUR_OF_DAY)",
        "        else now.get(Calendar.HOUR_OF_DAY)",
        "",
        "        val minute=if(parts.size==2)",
        "            parts[1].toIntOrNull() ?: now.get(Calendar.MINUTE)",
        "        else now.get(Calendar.MINUTE)",
        "",
        "        showControleHorasWheelDialog(",
        "            \\"Editar registro\\",",
        "            df.format(parseIso(rec.date)),",
        "            hour,",
        "            minute",
        "        ){value->",
        "",
        "            rec.punches[index]=value",
        "            saveData()",
        "            showPunch()",
        "        }",
        "    }",
        ""
    ])

    code = (
        code[:anchor]
        + edit_method
        + code[anchor:]
    )
'''

          marker_edit_original = (
              "# ==========================================================\n"
              "# SUBSTITUIR SHOW EDIT WHEEL"
          )

          if marker_edit_original not in fixed_script:

              raise SystemExit(
                  "ERRO: bloco SUBSTITUIR SHOW EDIT WHEEL não encontrado"
              )

          fixed_script = fixed_script.replace(
              marker_edit_original,
              ensure_edit_code.strip("\n")
              + "\n\n"
              + marker_edit_original,
              1
          )

          # ==========================================================
          # VALIDAR SINTAXE PYTHON
          # ==========================================================

          compile(
              fixed_script,
              "corrigir_tela.py",
              "exec"
          )

          print(
              "SINTAXE DA ROLETA OK"
          )

          temp_script = (
              Path(tempfile.gettempdir())
              / "corrigir_tela.py"
          )

          temp_script.write_text(
              fixed_script,
              encoding="utf-8"
          )

          # ==========================================================
          # EXECUTAR SCRIPT
          # ==========================================================

          subprocess.run(
              [
                  "python",
                  str(temp_script)
              ],
              check=True
          )

          print(
              "SCRIPT ORIGINAL DA ROLETA EXECUTADO"
          )

          # ==========================================================
          # RECARREGAR MAINACTIVITY
          # ==========================================================

          code = src.read_text(
              encoding="utf-8"
          )

          # ==========================================================
          # GARANTIR ROLETA
          # ==========================================================

          function_signature = (
              "private fun showControleHorasWheelDialog("
          )

          if function_signature not in code:

              print(
                  "ROLETA NÃO FOI INSERIDA PELO SCRIPT ORIGINAL"
              )

              anchor = code.find(
                  "    private fun showManualWheel("
              )

              if anchor < 0:

                  raise SystemExit(
                      "ERRO: showManualWheel não encontrado"
                  )

              insertion = (
                  "\n"
                  + wheel_dialog
                  + "\n"
              )

              code = (
                  code[:anchor]
                  + insertion
                  + code[anchor:]
              )

              src.write_text(
                  code,
                  encoding="utf-8"
              )

              print(
                  "ROLETA INSERIDA DIRETAMENTE"
              )

          # ==========================================================
          # RECARREGAR
          # ==========================================================

          code = src.read_text(
              encoding="utf-8"
          )

          # ==========================================================
          # GARANTIR MANIFESTO
          # ==========================================================

          manifest = Path(
              "ControleHoras/app/src/main/AndroidManifest.xml"
          )

          m = manifest.read_text(
              encoding="utf-8"
          )

          if (
              'android:icon="@drawable/controlehoras_icon"'
              not in m
          ):

              m = m.replace(
                  "<application",
                  '<application\n'
                  '        android:icon="@drawable/controlehoras_icon"\n'
                  '        android:roundIcon="@drawable/controlehoras_icon"',
                  1
              )

              manifest.write_text(
                  m,
                  encoding="utf-8"
              )

          # ==========================================================
          # GARANTIR SHOW EDIT WHEEL DEPOIS DA TRANSFORMAÇÃO
          # ==========================================================

          if "private fun showEditWheel(" not in code:

              anchor = code.find(
                  "    private fun showManualWheel("
              )

              if anchor < 0:

                  raise SystemExit(
                      "ERRO FINAL: showManualWheel não encontrado"
                  )

              edit_method = "\n".join([
                  "    private fun showEditWheel(",
                  "        rec:PunchDay,",
                  "        index:Int",
                  "    ){",
                  "",
                  "        val old=rec.punches[index]",
                  "        val parts=old.split(\":\")",
                  "        val now=Calendar.getInstance()",
                  "",
                  "        val hour=if(parts.size==2)",
                  "            parts[0].toIntOrNull() ?: now.get(Calendar.HOUR_OF_DAY)",
                  "        else now.get(Calendar.HOUR_OF_DAY)",
                  "",
                  "        val minute=if(parts.size==2)",
                  "            parts[1].toIntOrNull() ?: now.get(Calendar.MINUTE)",
                  "        else now.get(Calendar.MINUTE)",
                  "",
                  "        showControleHorasWheelDialog(",
                  "            \"Editar registro\",",
                  "            df.format(parseIso(rec.date)),",
                  "            hour,",
                  "            minute",
                  "        ){value->",
                  "",
                  "            rec.punches[index]=value",
                  "            saveData()",
                  "            showPunch()",
                  "        }",
                  "    }",
                  ""
              ])

              code = (
                  code[:anchor]
                  + edit_method
                  + code[anchor:]
              )

              src.write_text(
                  code,
                  encoding="utf-8"
              )

              print(
                  "SHOW EDIT WHEEL INSERIDO"
              )

          # ==========================================================
          # VALIDAÇÃO FINAL
          # ==========================================================

          code = src.read_text(
              encoding="utf-8"
          )

          required = [
              "ControleHorasTimeWheelView",
              "showControleHorasWheelDialog",
              "showManualWheel",
              "showEditWheel",
              "punchNames",
              "controleHorasPunchPage",
              "extra2Enabled",
              "nextPunchIndex"
          ]

          missing = []

          for item in required:

              if item not in code:

                  missing.append(
                      item
                  )

          if missing:

              raise SystemExit(
                  "ERRO: recursos ainda ausentes: "
                  + ", ".join(missing)
              )

          if (
              "private fun showControleHorasWheelDialog("
              not in code
          ):

              raise SystemExit(
                  "ERRO FINAL: roleta não encontrada"
              )

          if (
              "private fun showEditWheel("
              not in code
          ):

              raise SystemExit(
                  "ERRO FINAL: showEditWheel não encontrada"
              )

          if "NumberPicker(" in code:

              raise SystemExit(
                  "ERRO: NumberPicker ainda presente"
              )

          if (
              "Esse registro ainda está vazio"
              in code
          ):

              raise SystemExit(
                  "ERRO: mensagem antiga ainda presente"
              )

          if "roller_click.wav" not in code:

              print(
                  "AVISO: referência textual ao som não encontrada"
              )

          src.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "=================================================="
          )

          print(
              "ROLETA PERSONALIZADA VALIDADA"
          )

          print(
              "SHOW EDIT WHEEL VALIDADO"
          )

          print(
              "EDITAR BATIDA VAZIA VALIDADO"
          )

          print(
              "NUMBERPICKER REMOVIDO"
          )

          print(
              "MAINACTIVITY FINAL VALIDADO"
          )

          print(
              "=================================================="
          )

      - name: Validar projeto antes do Gradle
        shell: bash
        run: |
          set -e

          SRC="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          ICON="ControleHoras/app/src/main/res/drawable/controlehoras_icon.jpg"

          SOUND="ControleHoras/app/src/main/res/raw/roller_click.wav"

          test -s "$SRC"
          test -s "$ICON"
          test -s "$SOUND"

          echo "Verificando roleta..."

          grep -q \
            "private fun showControleHorasWheelDialog(" \
            "$SRC"

          echo "OK: roleta encontrada"

          grep -q \
            "ControleHorasTimeWheelView" \
            "$SRC"

          echo "OK: TimeWheel encontrado"

          grep -q \
            "controleHorasPunchPage" \
            "$SRC"

          echo "OK: página de ponto encontrada"

          grep -q \
            "punchNames" \
            "$SRC"

          echo "OK: nomes das batidas encontrados"

          grep -q \
            "showManualWheel" \
            "$SRC"

          echo "OK: registro manual encontrado"

          grep -q \
            "showEditWheel" \
            "$SRC"

          echo "OK: edição encontrada"

          grep -q \
            "controlehoras_icon" \
            ControleHoras/app/src/main/AndroidManifest.xml

          echo "OK: ícone encontrado"

          if grep -q "NumberPicker(" "$SRC"; then
              echo "ERRO: NumberPicker encontrado"
              exit 1
          fi

          if grep -q \
            "Esse registro ainda está vazio" \
            "$SRC"
          then
              echo "ERRO: mensagem antiga encontrada"
              exit 1
          fi

          echo "=================================================="
          echo "VALIDAÇÃO COMPLETA DO PROJETO OK"
          echo "=================================================="

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

          echo "APK GERADO COM SUCESSO"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t \
            "$APK" \
            >/dev/null

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
