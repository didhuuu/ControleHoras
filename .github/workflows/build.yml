          """

          start =
              code.find(
                  "    private fun showEditWheel("
              )

          end =
              code.find(
                  "    private fun calculate(r:PunchDay):Calc{",
                  start
              )

          if start < 0 or end < 0:

              raise SystemExit(
                  "ERRO: funções antigas da roda não encontradas"
              )

          code = (
              code[:start]
              + helpers
              + "\n"
              + code[end:]
