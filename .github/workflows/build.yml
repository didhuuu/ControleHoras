name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # BAIXAR PROJETO
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # EXTRAIR PROJETO
      # ============================================================

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      # ============================================================
      # RECONSTRUIR BASE 70
      # ============================================================

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name, next_name):

              start = workflow.index(
                  f"      - name: {name}"
              )

              end = workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              pos = block.index(marker) + len(marker)

              lines = block[pos:].splitlines()

              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in lines
              ) + "\n"

          scripts = [

              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),

              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for i, script in enumerate(scripts):

              p = (
                  Path(tempfile.gettempdir()) /
                  f"base70_{i}.py"
              )

              p.write_text(
                  script,
                  encoding="utf-8"
              )

              subprocess.run(
                  ["python", str(p)],
                  check=True
              )

          print("BASE DA VERSÃO 70 APLICADA")

      # ============================================================
      # APLICAR FUNCIONALIDADES DA VERSÃO ATUAL
      #
      # Aqui usamos a etapa que já contém:
      #
      # - intervalo 2
      # - persistência
      # - registro manual
      # - rolagem de horário
      # - edição de horário
      # - cálculo
      # - barra do sistema
      # - ícone DIDHUUU
      # - manifesto
      # ============================================================

      - name: Aplicar funcionalidades completas
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name, next_name):

              start = workflow.index(
                  f"      - name: {name}"
              )

              end = workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              pos = block.index(marker) + len(marker)

              lines = block[pos:].splitlines()

              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in lines
              ) + "\n"

          script = extract_step(
              "Aplicar correções finais da Base 70, edição por rolagem e ícone",
              "Validar código e ícone"
          )

          p = (
              Path(tempfile.gettempdir()) /
              "funcionalidades.py"
          )

          p.write_text(
              script,
              encoding="utf-8"
          )

          subprocess.run(
              ["python", str(p)],
              check=True
          )

          print(
              "FUNCIONALIDADES DA VERSÃO ATUAL APLICADAS"
          )

      # ============================================================
      # CORREÇÕES DEFINITIVAS DO MAINACTIVITY
      #
      # CORRIGE:
      #
      # 1. punchNames inexistente
      # 2. addView com parâmetros inválidos
      # ============================================================

      - name: Corrigir MainActivity definitivamente
        shell: python
        run: |
          from pathlib import Path
          import re

          file = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          if not file.exists():
              raise SystemExit(
                  "ERRO: MainActivity.kt não encontrado"
              )

          code = file.read_text(
              encoding="utf-8"
          )

          # ========================================================
          # CORREÇÃO 1 - PUNCHNAMES
          # ========================================================

          if "private val punchNames" not in code:

              names = '''    private val punchNames=arrayOf<String>(
                  "Entrada",
                  "Saída",
                  "Retorno",
                  "Saída intervalo 2",
                  "Retorno intervalo 2",
                  "Saída"
              )
              '''

              anchors = [

                  '    private val extra2ReturnEnabled=mutableSetOf<String>()\n',

                  '    private val extra2Enabled=mutableSetOf<String>()\n',

                  '    private val weekModes=linkedMapOf<String,String>()\n',

                  '    private val weekModes = linkedMapOf<String,String>()\n'
              ]

              inserted = False

              for anchor in anchors:

                  if anchor in code:

                      code = code.replace(
                          anchor,
                          anchor + names,
                          1
                      )

                      inserted = True

                      break

              if not inserted:
                  raise SystemExit(
                      "ERRO: não foi possível inserir punchNames"
                  )

          # ========================================================
          # CORREÇÃO 2 - ADDVIEW INVÁLIDO
          # ========================================================

          pattern = (
              r'\},\s*'
              r'0,\s*'
              r'0,\s*'
              r'0,\s*'
              r'dp10\s*'
              r'\)\s*'
              r'val dateCard\s*=\s*card'
          )

          replacement = '''},
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      ).apply{
                          bottomMargin=dp(10)
                      }
                  )

                  val dateCard=card()'''

          code, count = re.subn(
              pattern,
              replacement,
              code,
              count=1
          )

          if count == 0:

              print(
                  "AVISO: addView inválido não encontrado."
              )

              print(
                  "Isso significa que ele já pode estar corrigido."
              )

          # ========================================================
          # GARANTIR FORMATO DAS BATIDAS
          # ========================================================

          if "private val punchNames" not in code:

              raise SystemExit(
                  "ERRO FINAL: punchNames ainda não existe"
              )

          # ========================================================
          # SALVAR
          # ========================================================

          file.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "MAINACTIVITY CORRIGIDO COM SUCESSO"
          )

      # ============================================================
      # VALIDAR CÓDIGO ANTES DO GRADLE
      # ============================================================

      - name: Validar código e ícone
        shell: bash
        run: |
          set -e

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          echo "Verificando MainActivity..."

          test -s "$FILE"

          echo "Verificando ícone..."

          test -s \
            "ControleHoras/app/src/main/res/drawable/controlehoras_icon.jpg"

          echo "Verificando intervalo 2..."

          grep -q \
            'extra2Enabled' \
            "$FILE"

          echo "Verificando registro manual..."

          grep -q \
            'showManualWheel' \
            "$FILE"

          echo "Verificando edição..."

          grep -q \
            'showEditWheel' \
            "$FILE"

          echo "Verificando próxima batida..."

          grep -q \
            'nextPunchIndex' \
            "$FILE"

          echo "Verificando punchNames..."

          grep -q \
            'punchNames' \
            "$FILE"

          echo "Verificando barras do sistema..."

          grep -q \
            'WindowCompat.setDecorFitsSystemWindows' \
            "$FILE"

          echo "Verificando ícone no Manifest..."

          grep -q \
            'controlehoras_icon' \
            ControleHoras/app/src/main/AndroidManifest.xml

          echo "Procurando Button(context)..."

          if grep -q 'Button(context)' "$FILE"; then

            echo "ERRO: Button(context) encontrado"

            exit 1

          fi

          echo "VALIDAÇÃO DO CÓDIGO OK"

      # =================================================
