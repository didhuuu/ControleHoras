name: Gerar APK - ControleHoras

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1 - BAIXAR PROJETO
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4


      # ============================================================
      # 2 - CONFIGURAR JAVA 17
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3 - EXTRAIR PROJETO
      # ============================================================

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXTRAINDO PROJETO"
          echo "========================================"

          rm -rf ControleHoras

          unzip -o ControleHoras.zip

          echo ""
          echo "Verificando arquivos..."

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo ""
          echo "Projeto encontrado corretamente."


      # ============================================================
      # 4 - CORRIGIR APLICATIVO
      # ============================================================

      - name: Corrigir aplicativo durante o Build
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          s = p.read_text(encoding="utf-8")

          print("Aplicando correções...")


          # ========================================================
          # CORREÇÃO 1 - addView dp(10)
          # ========================================================

          s = s.replace(
              "        }, 0, 0, 0, dp(10))",
              "        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(10) })"
          )


          # ========================================================
          # CORREÇÃO 2 - addView dp(12)
          # ========================================================

          s = s.replace(
              "        }, 0, 0, 0, dp(12))",
              "        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(12) })"
          )


          # ========================================================
          # CORREÇÃO 3 - CORES
          # ========================================================

          s = s.replace(
              "setTextColor(text)",
              "setTextColor(this@MainActivity.text)"
          )


          # ========================================================
          # CORREÇÃO 4 - SALÁRIO
          # ========================================================

          s = s.replace(
              'setText(if(existing!=null)existing.salary.toString():"")',
              'setText(if (existing != null) existing.salary.toString() else "")'
          )

          s = s.replace(
              'if(existing!=null)existing.salary.toString():""',
              'if (existing != null) existing.salary.toString() else ""'
          )

          s = s.replace(
              'if(existing != null) existing.salary.toString():""',
              'if (existing != null) existing.salary.toString() else ""'
          )


          # ========================================================
          # CORREÇÃO 5 - SOMATÓRIO DO HISTÓRICO
          # ========================================================

          s = s.replace(
              'it.date.endsWith(SimpleDateFormat("MM-yyyy", Locale.US).format(Date()))',
              'it.date.startsWith(SimpleDateFormat("yyyy-MM", Locale.US).format(Date()))'
          )


          # ========================================================
          # SALVAR ARQUIVO CORRIGIDO
          # ========================================================

          p.write_text(s, encoding="utf-8")

          print("Correções aplicadas com sucesso.")

          PY


      # ============================================================
      # 5 - INSTALAR GRADLE
      # ============================================================

      - name: Instalar Gradle
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INSTALANDO GRADLE"
          echo "========================================"

          GRADLE_VERSION="8.10.2"

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          unzip -q \
            "gradle-${GRADLE_VERSION}-bin.zip"

          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          export PATH="$PWD/gradle-${GRADLE_VERSION}/bin:$PATH"

          gradle --version


      # ============================================================
      # 6 - LIMPAR BUILD ANTERIOR
      # ============================================================

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "LIMPANDO PROJETO"
          echo "========================================"

          gradle clean --no-daemon

          echo "Limpeza concluída."


      # ============================================================
      # 7 - GERAR APK DEBUG
      # ============================================================

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GERANDO APK"
          echo "========================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "========================================"
          echo "VERIFICANDO APK"
          echo "========================================"

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo ""
          echo "APK GERADO COM SUCESSO!"
          echo ""

          ls -lh app/build/outputs/apk/debug/app-debug.apk


      # ============================================================
      # 8 - PUBLICAR APK NO GITHUB
      # ============================================================

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      # ============================================================
      # 9 - MOSTRAR RESULTADO
      # ============================================================

      - name: Finalizar
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "BUILD FINALIZADO"
          echo "========================================"
          echo ""
          echo "APK:"
          ls -lh ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          echo ""
          echo "Arquivo publicado como Artifact:"
          echo "ControleHoras-APK"
          echo ""
