                              dp(18)
                          )
                      }


                  root.addView(
                      TextView(this).apply{

                          text=
                              "$title\n$date"

                          textSize=19f

                          gravity=
                              Gravity.CENTER

                          setTypeface(
                              null,
                              Typeface.BOLD
                          )

                          setTextColor(
                              0xFF173A67.toInt()
                          )
                      },
                      LinearLayout.LayoutParams(
                          -1,
                          dp(68)
                      )
                  )


                  val wheels=
                      LinearLayout(this).apply{

                          orientation=
                              LinearLayout.HORIZONTAL

                          gravity=
                              Gravity.CENTER
                      }


                  val hour=
                      ControleHorasTimeWheelView(
