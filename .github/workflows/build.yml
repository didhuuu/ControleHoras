              }

              # ======================================================
              # PRÓXIMA BATIDA
              # ======================================================

              private fun nextPunchIndex(
                  r:PunchDay,
                  extra:Boolean
              ):Int{

                  if(
                      r.punches[0].isBlank()
                  )
                      return 0

                  if(
                      r.punches[1].isBlank()
                  )
                      return 1

                  if(
                      r.punches[2].isBlank()
                  )
                      return 2

                  if(
                      extra &&
                      r.punches[3].isBlank()
                  )
                      return 3

                  if(
                      extra &&
                      extraReturnEnabled(
                          r.employeeId,
                          r.date
                      ) &&
                      r.punches[4].isBlank()
                  )
                      return 4

                  if(
                      r.punches[5].isBlank()
                  )
                      return 5

                  return -1
              }

              # ======================================================
              # REGISTRAR BATIDA
              # ======================================================

              private fun registerPunch(
                  empId:Long
              ){

                  val r=
                      getRecord(
                          empId,
                          selectedPunchDate
                      )

                  val n=
                      nextPunchIndex(
                          r,
                          extraEnabled(
                              empId,
                              selectedPunchDate
                          )
                      )

                  if(n<0)
                      return

                  if(
                      selectedPunchDate==
                      today()
                  ){

                      r.punches[n]=
                          nowTime()

                      saveData()

                      showPunch()

                      return
                  }

                  val e=
                      timeEdit(
                          "",
                          punchNames[n]
                      )

                  AlertDialog.Builder(this)
                      .setTitle(
                          "Lançar ${punchNames[n]}"
                      )
                      .setMessage(
                          df.format(
                              parseIso(
                                  selectedPunchDate
                              )
                          )
                      )
                      .setView(e)
                      .setNegativeButton(
                          "Cancelar",
                          null
                      )
                      .setPositiveButton(
                          "Salvar"
                      ){_,_->

                          val t=
                              normalizeTime(
                                  e.text.toString()
                              )

                          if(t.isNotBlank()){

                              r.punches[n]=t

                              saveData()

                              showPunch()

                          }else{

                              Toast.makeText(
                                  this,
                                  "Horário inválido.",
                                  Toast.LENGTH_LONG
                              ).show()
                          }
                      }
                      .show()
              }

              # ======================================================
              # EDITAR BATIDA COM ROLAGEM
              # ======================================================

              private fun showEditWheel(
                  rec:PunchDay,
                  index:Int
              ){

                  if(
                      rec.punches[index].isBlank()
                  ){

                      Toast.makeText(
                          this,
                          "Esse registro ainda está vazio. Use REGISTRO MANUAL.",
                          Toast.LENGTH_LONG
                      ).show()

                      return
                  }

                  val parts=
                      rec.punches[index]
                          .split(":")

                  val currentHour=
                      parts
                          .getOrNull(0)
                          ?.toIntOrNull()
                          ?.coerceIn(0,23)
                          ?:0

                  val currentMinute=
                      parts
                          .getOrNull(1)
                          ?.toIntOrNull()
                          ?.coerceIn(0,59)
                          ?:0

                  val wrap=
                      LinearLayout(this).apply{

                          orientation=
                              LinearLayout.VERTICAL

                          gravity=
                              Gravity.CENTER_HORIZONTAL

                          setPadding(
                              dp(10),
                              0,
                              dp(10),
                              0
                          )
                      }

                  wrap.addView(
                      TextView(this).apply{

                          text=
                              "${punchNames[index]}\\n${df.format(parseIso(rec.date))}"

                          gravity=
                              Gravity.CENTER

                          textSize=16f

                          setTypeface(
                              null,
                              Typeface.BOLD
                          )

                          setTextColor(
                              darkBlue
                          )

                          setPadding(
                              0,
                              dp(4),
                              0,
                              dp(8)
                          )
                      }
                  )

                  val wheels=
                      LinearLayout(this).apply{

