name: ControleHoras - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair ControleHoras.zip
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO EXTRAÍDO OK"

      - name: Corrigir MainActivity
        shell: python
        run: |
          from pathlib import Path
          import re

          arquivo = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          codigo = arquivo.read_text(encoding="utf-8")

          print("Linhas originais:", len(codigo.splitlines()))

          # ======================================================
          # CORREÇÕES BÁSICAS
          # ======================================================

          codigo = codigo.replace(
              'setText(if(existing!=null)existing.salary.toString():"")',
              'setText(if(existing!=null)existing.salary.toString() else "")'
          )

          codigo = codigo.replace(
              'setText(if(existing != null) existing.salary.toString():"")',
              'setText(if(existing != null) existing.salary.toString() else "")'
          )

          codigo = codigo.replace(
              "setTextColor(text)",
              "setTextColor(this@MainActivity.text)"
          )

          codigo = codigo.replace(
              'it.date.endsWith(SimpleDateFormat("MM-yyyy", Locale.US).format(Date()))',
              'it.date.startsWith(SimpleDateFormat("yyyy-MM", Locale.US).format(Date()))'
          )

          codigo = re.sub(
              r',\s*0\s*,\s*0\s*,\s*0\s*,\s*dp\(10\)\)',
              ', LinearLayout.LayoutParams(-1, -2).apply{bottomMargin=dp(10)})',
              codigo
          )

          codigo = re.sub(
              r',\s*0\s*,\s*0\s*,\s*0\s*,\s*dp\(12\)\)',
              ', LinearLayout.LayoutParams(-1, -2).apply{bottomMargin=dp(12)})',
              codigo
          )

          codigo = codigo.replace(
              "}, 0, 0, 0, dp(10))",
              "}, LinearLayout.LayoutParams(-1, -2).apply{bottomMargin=dp(10)})"
          )

          codigo = codigo.replace(
              "}, 0, 0, 0, dp(12))",
              "}, LinearLayout.LayoutParams(-1, -2).apply{bottomMargin=dp(12)})"
          )

          # ======================================================
          # HORÁRIO DO RELÓGIO
          # Aceita somente 00:00 até 23:59
          # ======================================================

          inicio = codigo.find(
              "    private fun getRecord(empId:Long,date:String):PunchDay{"
          )

          if inicio == -1:
              raise SystemExit("ERRO: getRecord não encontrado.")

          if "private fun normalizeTime(" not in codigo:

              helper = "\n".join([
                  "    private fun normalizeTime(value:String):String{",
                  "        val digits=value.filter{it.isDigit()}.take(4)",
                  "        if(digits.length!=4)return \"\"",
                  "        val hour=digits.substring(0,2).toIntOrNull()?:return \"\"",
                  "        val minute=digits.substring(2,4).toIntOrNull()?:return \"\"",
                  "        if(hour !in 0..23)return \"\"",
                  "        if(minute !in 0..59)return \"\"",
                  "        return \"%02d:%02d\".format(Locale.US,hour,minute)",
                  "    }",
                  "",
                  "    private fun timeEdit(initial:String=\"\",hintText:String=\"00:00\"):EditText{",
                  "        val e=EditText(this).apply{",
                  "            hint=hintText",
                  "            inputType=2",
                  "            setSingleLine()",
                  "            val normalized=normalizeTime(initial)",
                  "            if(normalized.isNotEmpty())setText(normalized)",
                  "        }",
                  "",
                  "        var changing=false",
                  "",
                  "        e.addTextChangedListener(object:android.text.TextWatcher{",
                  "            override fun beforeTextChanged(s:CharSequence?,start:Int,count:Int,after:Int){}",
                  "            override fun onTextChanged(s:CharSequence?,start:Int,before:Int,count:Int){}",
                  "",
                  "            override fun afterTextChanged(editable:android.text.Editable?){",
                  "                if(changing)return",
                  "",
                  "                val digits=editable?.toString()?.filter{it.isDigit()}?.take(4).orEmpty()",
                  "",
                  "                val formatted=when{",
                  "                    digits.isEmpty()->\"\"",
                  "                    digits.length<=2->digits",
                  "                    else->digits.substring(0,2)+\":\"+digits.substring(2)",
                  "                }",
                  "",
                  "                if(formatted!=editable?.toString()){",
                  "                    changing=true",
                  "                    e.setText(formatted)",
                  "                    e.setSelection(e.text.length)",
                  "                    changing=false",
                  "                }",
                  "            }",
                  "        })",
                  "",
                  "        e.setOnFocusChangeListener{_,hasFocus->",
                  "            if(!hasFocus){",
                  "                val normalized=normalizeTime(e.text.toString())",
                  "                if(normalized.isNotEmpty()){",
                  "                    e.setText(normalized)",
                  "                    e.setSelection(e.text.length)",
                  "                }",
                  "            }",
                  "        }",
                  "",
                  "        return e",
                  "    }",
                  ""
              ])

              codigo = codigo.replace(
                  "    private fun getRecord(empId:Long,date:String):PunchDay{",
                  helper + "    private fun getRecord(empId:Long,date:String):PunchDay{",
                  1
              )

          # ======================================================
          # DURAÇÃO
          #
          # Aqui pode existir 44:00.
          # Não usa normalizeTime().
          # ======================================================

          if "private fun normalizeDuration(" not in codigo:

              helper = "\n".join([
                  "    private fun normalizeDuration(value:String):String{",
                  "        val digits=value.filter{it.isDigit()}.take(4)",
                  "        if(digits.length!=4)return \"\"",
                  "        val hour=digits.substring(0,2).toIntOrNull()?:return \"\"",
                  "        val minute=digits.substring(2,4).toIntOrNull()?:return \"\"",
                  "        if(hour !in 0..99)return \"\"",
                  "        if(minute !in 0..59)return \"\"",
                  "        return \"%02d:%02d\".format(Locale.US,hour,minute)",
                  "    }",
                  "",
                  "    private fun durationMinutes(value:String):Int{",
                  "        val v=normalizeDuration(value)",
                  "        if(v.isBlank())return 0",
                  "        return try{",
                  "            val p=v.split(\":\")",
                  "            p[0].toInt()*60+p[1].toInt()",
                  "        }catch(_:Exception){0}",
                  "    }",
                  "",
                  "    private fun durationEdit(initial:String=\"\",hintText:String=\"44:00\"):EditText{",
                  "        val e=EditText(this).apply{",
                  "            hint=hintText",
                  "            inputType=2",
                  "            setSingleLine()",
                  "            val normalized=normalizeDuration(initial)",
                  "            if(normalized.isNotEmpty())setText(normalized)",
                  "        }",
                  "",
                  "        var changing=false",
                  "",
                  "        e.addTextChangedListener(object:android.text.TextWatcher{",
                  "            override fun beforeTextChanged(s:CharSequence?,start:Int,count:Int,after:Int){}",
                  "            override fun onTextChanged(s:CharSequence?,start:Int,before:Int,count:Int){}",
                  "",
                  "            override fun afterTextChanged(editable:android.text.Editable?){",
                  "                if(changing)return",
                  "",
                  "                val digits=editable?.toString()?.filter{it.isDigit()}?.take(4).orEmpty()",
                  "",
                  "                val formatted=when{",
                  "                    digits.isEmpty()->\"\"",
                  "                    digits.length<=2->digits",
                  "                    else->digits.substring(0,2)+\":\"+digits.substring(2)",
                  "                }",
                  "",
                  "                if(formatted!=editable?.toString()){",
                  "                    changing=true",
                  "                    e.setText(formatted)",
                  "                    e.setSelection(e.text.length)",
                  "                    changing=false",
                  "                }",
                  "            }",
                  "        })",
                  "",
                  "        e.setOnFocusChangeListener{_,hasFocus->",
                  "            if(!hasFocus){",
                  "                val normalized=normalizeDuration(e.text.toString())",
                  "                if(normalized.isNotEmpty()){",
                  "                    e.setText(normalized)",
                  "                    e.setSelection(e.text.length)",
                  "                }",
                  "            }",
                  "        }",
                  "",
                  "        return e",
                  "    }",
                  ""
              ])

              codigo = codigo.replace(
                  "    private fun getRecord(empId:Long,date:String):PunchDay{",
                  helper + "    private fun getRecord(empId:Long,date:String):PunchDay{",
                  1
              )

          # ======================================================
          # CARGA SEMANAL
          # ======================================================

          if 'private var weeklyTarget:String = "44:00"' not in codigo:

              marcador = "    private val scale = linkedMapOf<String, DayScale>()"

              if marcador not in codigo:
                  raise SystemExit("ERRO: scale não encontrada.")

              codigo = codigo.replace(
                  marcador,
                  marcador + '\n    private var weeklyTarget:String = "44:00"',
                  1
              )

          # ======================================================
          # CARREGAR CARGA SEMANAL
          # ======================================================

          codigo = codigo.replace(
              'weeklyTarget=normalizeTime(prefs.getString("weeklyTarget","44:00")?:"44:00").ifBlank{"44:00"}',
              'weeklyTarget=normalizeDuration(prefs.getString("weeklyTarget","44:00")?:"44:00").ifBlank{"44:00"}'
          )

          # Se ainda não existir, coloca dentro de loadData.
          if 'prefs.getString("weeklyTarget","44:00")' not in codigo:

              marcador = "    private fun loadData() {"

              pos = codigo.find(marcador)

              if pos == -1:
                  raise SystemExit("ERRO: loadData não encontrada.")

              linha = '        weeklyTarget=normalizeDuration(prefs.getString("weeklyTarget","44:00")?:"44:00").ifBlank{"44:00"}\n'

              pos2 = codigo.find("\n",pos) + 1

              codigo = codigo[:pos2] + linha + codigo[pos2:]

          # ======================================================
          # SALVAR CARGA SEMANAL
          # ======================================================

          codigo = codigo.replace(
              'val e = prefs.edit().putString("records", ra.toString())',
              'val e = prefs.edit().putString("records", ra.toString()).putString("weeklyTarget", weeklyTarget)',
              1
          )

          # ======================================================
          # SHOW SCALE
          # ======================================================

          inicio = codigo.find("    private fun showScale() {")

          fim = codigo.find(
              "    private fun employeeDialog",
              inicio
          )

          if inicio == -1 or fim == -1:
              raise SystemExit("ERRO: showScale não encontrada.")

          escala = "\n".join([
              "    private fun showScale() {",
              "        val box=page(\"Escala Semanal\")",
              "",
              "        box.addView(infoCard(\"Carga semanal: informe 44:00. O aplicativo divide automaticamente a carga entre os dias marcados como TRABALHA.\"))",
              "",
              "        val cargaCard=card()",
              "        val cargaLinha=LinearLayout(this).apply{",
              "            orientation=LinearLayout.HORIZONTAL",
              "            gravity=Gravity.CENTER_VERTICAL",
              "            setPadding(dp(12),dp(8),dp(12),dp(8))",
              "        }",
              "",
              "        cargaLinha.addView(",
              "            TextView(this).apply{",
              "                text=\"Carga semanal\"",
              "                textSize=16f",
              "                setTypeface(null,Typeface.BOLD)",
              "                setTextColor(darkBlue)",
              "            },",
              "            LinearLayout.LayoutParams(0,dp(55),1f)",
              "        )",
              "",
              "        val cargaEdit=durationEdit(weeklyTarget,\"44:00\").apply{",
              "            gravity=Gravity.CENTER",
              "        }",
              "",
              "        cargaEdit.setOnFocusChangeListener{_,has->",
              "            if(!has){",
              "                val v=normalizeDuration(cargaEdit.text.toString())",
              "                if(v.isNotBlank()){",
              "                    weeklyTarget=v",
              "                    cargaEdit.setText(v)",
              "                    cargaEdit.setSelection(cargaEdit.text.length)",
              "                    saveData()",
              "                    showScale()",
              "                }",
              "            }",
              "        }",
              "",
              "        cargaLinha.addView(",
              "            cargaEdit,",
              "            LinearLayout.LayoutParams(dp(110),dp(55))",
              "        )",
              "",
              "        cargaCard.addView(cargaLinha)",
              "",
              "        box.addView(",
              "            cargaCard,",
              "            LinearLayout.LayoutParams(-1,dp(75)).apply{bottomMargin=dp(10)}",
              "        )",
              "",
              "        days.forEachIndexed{i,d->",
              "            val s=scale[d]!!",
              "            val row=card()",
              "",
              "            val line=LinearLayout(this).apply{",
              "                orientation=LinearLayout.VERTICAL",
              "                setPadding(dp(12),dp(8),dp(12),dp(8))",
              "            }",
              "",
              "            val top=LinearLayout(this).apply{",
              "                orientation=LinearLayout.HORIZONTAL",
              "                gravity=Gravity.CENTER_VERTICAL",
              "            }",
              "",
              "            top.addView(",
              "                TextView(this).apply{",
              "                    text=d",
              "                    textSize=16f",
              "                    setTypeface(null,Typeface.BOLD)",
              "                    setTextColor(darkBlue)",
              "                },",
              "                LinearLayout.LayoutParams(0,dp(48),1f)",
              "            )",
              "",
              "            val sw=Switch(this).apply{",
              "                text=if(s.enabled)\"TRABALHA\" else \"FOLGA\"",
              "                isChecked=s.enabled",
              "            }",
              "",
              "            sw.setOnCheckedChangeListener{_,v->",
              "                s.enabled=v",
              "                sw.text=if(v)\"TRABALHA\" else \"FOLGA\"",
              "                saveData()",
              "                showScale()",
              "            }",
              "",
              "            top.addView(sw)",
              "            line.addView(top)",
              "",
              "            if(s.enabled){",
              "                val times=LinearLayout(this).apply{",
              "                    orientation=LinearLayout.HORIZONTAL",
              "                }",
              "",
              "                listOf(",
              "                    \"Entrada\" to s.e,",
              "                    \"Saída 1\" to s.x1,",
              "                    \"Retorno 1\" to s.r1,",
              "                    \"Saída 2\" to s.x2",
              "                ).forEachIndexed{j,p->",
              "",
              "                    val ed=timeEdit(p.second,p.first).apply{",
              "                        gravity=Gravity.CENTER",
              "                    }",
              "",
              "                    ed.setOnFocusChangeListener{_,has->",
              "                        if(!has){",
              "                            val v=normalizeTime(ed.text.toString())",
              "                            when(j){",
              "                                0->s.e=v",
              "                                1->s.x1=v",
              "                                2->s.r1=v",
              "                                3->s.x2=v",
              "                            }",
              "                            saveData()",
              "                        }",
              "                    }",
              "",
              "                    times.addView(",
              "                        ed,",
              "                        LinearLayout.LayoutParams(0,dp(55),1f).apply{",
              "                            if(j<3)rightMargin=dp(4)",
              "                        }",
              "                    )",
              "                }",
              "",
              "                line.addView(times)",
              "",
              "                val diasAtivos=scale.values.count{it.enabled}.coerceAtLeast(1)",
              "                val cargaDiaria=durationMinutes(weeklyTarget)/diasAtivos",
              "",
              "                line.addView(",
              "                    TextView(this).apply{",
              "                        text=\"Carga automática do dia: ${formatMin(cargaDiaria)}\"",
              "                        textSize=13f",
              "                        setTextColor(muted)",
              "                        setPadding(0,dp(5),0,0)",
              "                    }",
              "                )",
              "            }",
              "",
              "            row.addView(line)",
              "",
              "            box.addView(",
              "                row,",
              "                LinearLayout.LayoutParams(",
              "                    -1,",
              "                    if(s.enabled)dp(180) else dp(70)",
              "                ).apply{bottomMargin=dp(8)}",
              "            )",
              "        }",
              "    }",
              "",
              ""
          ])

          codigo = codigo[:inicio] + escala + codigo[fim:]

          # ======================================================
          # CÁLCULO CORRETO
          # ======================================================

          inicio = codigo.find(
              "    private fun calculate(r:PunchDay):Calc{"
          )

          fim = codigo.find(
              "    private fun minutesBetween",
              inicio
          )

          if inicio == -1 or fim == -1:
              raise SystemExit("ERRO: calculate não encontrada.")

          calculo = "\n".join([
              "    private fun calculate(r:PunchDay):Calc{",
              "",
              "        var worked=0",
              "",
              "        // Primeiro período",
              "        worked+=minutesBetween(r.punches[0],r.punches[1])",
              "",
              "        // Se não existe segundo intervalo,",
              "        // a terceira batida vai diretamente até a saída final.",
              "        val segundoIntervalo=",
              "            r.punches[3].isNotBlank() ||",
              "            r.punches[4].isNotBlank()",
              "",
              "        if(segundoIntervalo){",
              "            worked+=minutesBetween(r.punches[2],r.punches[3])",
              "            worked+=minutesBetween(r.punches[4],r.punches[5])",
              "        }else{",
              "            worked+=minutesBetween(r.punches[2],r.punches[5])",
              "        }",
              "",
              "        val cal=Calendar.getInstance().apply{",
              "            time=parseIso(r.date)",
              "        }",
              "",
              "        val key=cal.get(Calendar.DAY_OF_WEEK)",
              "        val index=dayKeys.indexOf(key)",
              "        val d=if(index>=0)scale[days[index]] else null",
              "",
              "        if(d==null || !d.enabled){",
              "            return Calc(worked,0,0,worked)",
              "        }",
              "",
              "        // 44:00 é duração semanal, não horário do relógio.",
              "        val semanal=durationMinutes(weeklyTarget)",
              "",
              "        val diasTrabalhados=",
              "            scale.values.count{it.enabled}.coerceAtLeast(1)",
              "",
              "        val expected=semanal/diasTrabalhados",
              "",
              "        val extra=max(0,worked-expected)",
              "        val faltante=max(0,expected-worked)",
              "",
              "        return Calc(",
              "            worked,",
              "            expected,",
              "            extra,",
              "            faltante",
              "        )",
              "    }",
              "",
              ""
          ])

          codigo = codigo[:inicio] + calculo + codigo[fim:]

          # ======================================================
          # EDIÇÃO MANUAL
          # ======================================================

          codigo = re.sub(
              r'val e=EditText\(this\)\.apply\{setText\(r\.punches\[index\]\);hint="HH:mm";inputType=2;setSingleLine\(\)\}',
              'val e=timeEdit(r.punches[index],punchNames[index])',
              codigo,
              count=1
          )

          codigo = codigo.replace(
              'r.punches[index]=e.text.toString();saveData();showPunch()',
              'r.punches[index]=normalizeTime(e.text.toString());saveData();showPunch()'
          )

          codigo = re.sub(
              r'val fields=r\.punches\.mapIndexed\{i,v->EditText\(this\)\.apply\{hint=punchNames\[i\];setText\(v\);inputType=2;setSingleLine\(\);\}\}',
              'val fields=r.punches.mapIndexed{i,v->timeEdit(v,punchNames[i])}',
              codigo,
              count=1
          )

          codigo = codigo.replace(
              'fields.forEachIndexed{i,e->r.punches[i]=e.text.toString()};saveData();showHistory()',
              'fields.forEachIndexed{i,e->r.punches[i]=normalizeTime(e.text.toString())};saveData();showHistory()'
          )

          # ======================================================
          # MINUTES BETWEEN
          # ======================================================

          inicio = codigo.find(
              "    private fun minutesBetween(a:String,b:String):Int{"
          )

          fim = codigo.find(
              "    private fun formatMin",
              inicio
          )

          if inicio == -1 or fim == -1:
              raise SystemExit("ERRO: minutesBetween/formatMin não encontrados.")

          minutos = "\n".join([
              "    private fun minutesBetween(a:String,b:String):Int{",
              "        val x=normalizeTime(a)",
              "        val y=normalizeTime(b)",
              "        if(x.isBlank()||y.isBlank())return 0",
              "        return try{",
              "            val xa=x.split(\":\")",
              "            val ya=y.split(\":\")",
              "            val inicio=xa[0].toInt()*60+xa[1].toInt()",
              "            val fim=ya[0].toInt()*60+ya[1].toInt()",
              "            max(0,fim-inicio)",
              "        }catch(_:Exception){0}",
              "    }",
              ""
          ])

          codigo = codigo[:inicio] + minutos + codigo[fim:]

          # ======================================================
          # FORMATMIN
          # ======================================================

          inicio = codigo.find(
              "    private fun formatMin"
          )

          fim = codigo.find("\n",inicio)

          codigo = (
              codigo[:inicio]
              + '    private fun formatMin(m:Int):String="%02d:%02d".format(Locale.US,max(0,m)/60,max(0,m)%60)'
              + codigo[fim:]
          )

          # ======================================================
          # VALIDAÇÃO
          # ======================================================

          obrigatorias = [
              "private fun normalizeTime",
              "private fun normalizeDuration",
              "private fun durationMinutes",
              "private fun durationEdit",
              "private fun calculate(r:PunchDay):Calc",
              "private fun minutesBetween",
              'private var weeklyTarget:String = "44:00"',
              "Carga semanal",
              "Carga automática do dia",
              "val segundoIntervalo",
              "worked+=minutesBetween(r.punches[2],r.punches[5])"
          ]

          for item in obrigatorias:
              if item not in codigo:
                  raise SystemExit("ERRO: item ausente: " + item)

          abertas = codigo.count("{")
          fechadas = codigo.count("}")

          print("Linhas finais:",len(codigo.splitlines()))
          print("Chaves:",abertas,fechadas)

          if abertas != fechadas:
              raise SystemExit("ERRO DE CHAVES")

          arquivo.write_text(codigo,encoding="utf-8")

          print("========================================")
          print("MAINACTIVITY CORRIGIDA")
          print("========================================")

      - name: Validar código
        shell: python
        run: |
          from pathlib import Path

          arquivo=Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          codigo=arquivo.read_text(encoding="utf-8")

          obrigatorias=[
              "private fun normalizeTime",
              "private fun normalizeDuration",
              "private fun durationMinutes",
              "private fun durationEdit",
              "private fun calculate(r:PunchDay):Calc",
              "private fun minutesBetween",
              'private var weeklyTarget:String = "44:00"',
              "Carga semanal",
              "Carga automática do dia",
              "val segundoIntervalo"
          ]

          for item in obrigatorias:
              if item not in codigo:
                  raise SystemExit("ERRO: "+item)

          if codigo.count("{") != codigo.count("}"):
              raise SystemExit("ERRO: chaves incompatíveis")

          print("CÓDIGO VALIDADO")

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e
          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "========================================"
          echo "APK GERADO"
          echo "========================================"

          ls -lh "$APK"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          unzip -t "$APK" >/dev/null

          echo "APK ÍNTEGRO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Finalizar
        shell: bash
        run: |
          echo "CONTROLEHORAS FINALIZADO"
