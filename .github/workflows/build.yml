                      ),
                      now.get(
                          Calendar.MINUTE
                      ),
                      "REGISTRAR"
                  ){h,m->

                      r.punches[n]=
                          "%02d:%02d".format(
                              Locale.US,
                              h,
                              m
                          )

                      saveData()

                      showPunch()
                  }
              }

              private fun showTimeWheelDialog(
