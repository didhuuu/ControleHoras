name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip
          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt
          echo "BASE DO PROJETO OK"

      - name: Aplicar versão completa corrigida
        shell: python
        run: |
          from pathlib import Path

          root = Path("ControleHoras")

          main = root / "app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          manifest = root / "app/src/main/AndroidManifest.xml"
          paths = root / "app/src/main/res/xml/file_paths.xml"

          paths.parent.mkdir(parents=True, exist_ok=True)

          main.write_text(r'''package com.didhuuu.controlehoras

import android.app.*
import android.os.Bundle
import android.graphics.*
import android.graphics.drawable.GradientDrawable
import android.content.*
import android.view.*
import android.widget.*
import androidx.core.content.FileProvider
import org.json.JSONArray
import org.json.JSONObject
import java.io.File
import java.text.NumberFormat
import java.text.SimpleDateFormat
import java.util.*
import kotlin.math.max

class MainActivity : Activity() {

    data class Employee(
        var id:Long,
        var name:String,
        var salary:Double
    )

    data class DayScale(
        var enabled:Boolean=true,
        var e:String="08:00",
        var x1:String="12:00",
        var r1:String="13:30",
        var x2:String="17:30"
    )

    data class PunchDay(
        var employeeId:Long,
        var employeeName:String,
        var date:String,
        var punches:MutableList<String> = MutableList(6){""}
    )

    data class Calc(
        val worked:Int,
        val expected:Int,
        val extra60:Int,
        val extra100:Int
    )

    private val blue=Color.rgb(0,92,205)
    private val darkBlue=Color.rgb(13,54,105)
    private val green=Color.rgb(0,170,82)
    private val bg=Color.rgb(245,248,252)
    private val text=Color.rgb(25,35,50)
    private val muted=Color.rgb(105,115,130)

    private lateinit var root:LinearLayout
    private lateinit var content:FrameLayout
    private lateinit var nav:LinearLayout

    private var selectedTab=0
    private var selectedEmployeeId=0L

    /*
     * IMPORTANTE:
     * Não inicializar com today() aqui.
     * iso é declarado depois e isso podia causar fechamento
     * do aplicativo durante a inicialização.
     */
    private var selectedPunchDate=""

    private val prefs by lazy {
        getSharedPreferences("controle_horas",MODE_PRIVATE)
    }

    private val employees=mutableListOf<Employee>()
    private val records=mutableListOf<PunchDay>()
    private val scale=linkedMapOf<String,DayScale>()

    private val weekModes=linkedMapOf<String,String>()
    private var weeklyTarget="44:00"

    private val days=listOf(
        "Seg",
        "Ter",
        "Qua",
        "Qui",
        "Sex",
        "Sáb",
        "Dom"
    )

    private val dayKeys=listOf(
        Calendar.MONDAY,
        Calendar.TUESDAY,
        Calendar.WEDNESDAY,
        Calendar.THURSDAY,
        Calendar.FRIDAY,
        Calendar.SATURDAY,
        Calendar.SUNDAY
    )

    private val money=
        NumberFormat.getCurrencyInstance(Locale("pt","BR"))

    private val df=
        SimpleDateFormat("dd/MM/yyyy",Locale("pt","BR"))

    private val iso=
        SimpleDateFormat("yyyy-MM-dd",Locale.US)

    private val punchNames=listOf(
        "Entrada",
        "Saída intervalo 1",
        "Retorno intervalo 1",
        "Saída intervalo 2",
        "Retorno intervalo 2",
        "Saída"
    )

    override fun onCreate(savedInstanceState:Bundle?) {
        super.onCreate(savedInstanceState)

        loadData()

        /*
         * Hoje é o padrão somente depois que tudo foi inicializado.
         */
        selectedPunchDate=today()

        if(employees.isNotEmpty()) {
            selectedEmployeeId=employees.first().id
        }

        buildShell()
        showTab(0)
    }

    private fun loadData() {

        employees.clear()

        try {
            val ea=JSONArray(
                prefs.getString("employees","[]")
            )

            for(i in 0 until ea.length()) {

                val o=ea.getJSONObject(i)

                employees+=Employee(
                    o.getLong("id"),
                    o.getString("name"),
                    o.getDouble("salary")
                )
            }

        } catch(_:Exception) {}

        records.clear()

        try {

            val ra=JSONArray(
                prefs.getString("records","[]")
            )

            for(i in 0 until ra.length()) {

                val o=ra.getJSONObject(i)

                val p=MutableList(6) { j ->
                    o.optString("p$j","")
                }

                records+=PunchDay(
                    o.getLong("employeeId"),
                    o.optString("employeeName",""),
                    o.getString("date"),
                    p
                )
            }

        } catch(_:Exception) {}

        scale.clear()

        for(i in days.indices) {

            val def=
                if(i<5)
                    DayScale()
                else
                    DayScale(
                        false,
                        "",
                        "",
                        "",
                        ""
                    )

            try {

                val defaultJson=
                    JSONObject()
                        .put("enabled",def.enabled)
                        .put("e",def.e)
                        .put("x1",def.x1)
                        .put("r1",def.r1)
                        .put("x2",def.x2)
                        .toString()

                val o=JSONObject(
                    prefs.getString(
                        "scale_$i",
                        defaultJson
                    )
                )

                scale[days[i]]=DayScale(
                    o.optBoolean(
                        "enabled",
                        def.enabled
                    ),
                    normalizeTime(
                        o.optString("e",def.e)
                    ),
                    normalizeTime(
                        o.optString("x1",def.x1)
                    ),
                    normalizeTime(
                        o.optString("r1",def.r1)
                    ),
                    normalizeTime(
                        o.optString("x2",def.x2)
                    )
                )

            } catch(_:Exception) {

                scale[days[i]]=def
            }
        }

        weeklyTarget=
            normalizeDuration(
                prefs.getString(
                    "weeklyTarget",
                    "44:00"
                ) ?: "44:00"
            ).ifBlank {
                "44:00"
            }

        weekModes.clear()

        try {

            val o=JSONObject(
                prefs.getString(
                    "weekModes",
                    "{}"
                ) ?: "{}"
            )

            val it=o.keys()

            while(it.hasNext()) {

                val k=it.next()

                weekModes[k]=
                    o.optString(k,"MF")
            }

        } catch(_:Exception) {}
    }

    private fun saveData() {

        val ea=JSONArray()

        employees.forEach {

            ea.put(
                JSONObject()
                    .put("id",it.id)
                    .put("name",it.name)
                    .put("salary",it.salary)
            )
        }

        val ra=JSONArray()

        records.forEach { r ->

            val o=
                JSONObject()
                    .put("employeeId",r.employeeId)
                    .put("employeeName",r.employeeName)
                    .put("date",r.date)

            r.punches.forEachIndexed { j,v ->

                o.put(
                    "p$j",
                    normalizeTime(v)
                )
            }

            ra.put(o)
        }

        val w=JSONObject()

        weekModes.forEach { (k,v) ->
            w.put(k,v)
        }

        val e=
            prefs.edit()
                .putString(
                    "employees",
                    ea.toString()
                )
                .putString(
                    "records",
                    ra.toString()
                )
                .putString(
                    "weeklyTarget",
                    weeklyTarget
                )
                .putString(
                    "weekModes",
                    w.toString()
                )

        days.forEachIndexed { i,d ->

            val s=scale[d]!!

            e.putString(
                "scale_$i",
                JSONObject()
                    .put("enabled",s.enabled)
                    .put("e",s.e)
                    .put("x1",s.x1)
                    .put("r1",s.r1)
                    .put("x2",s.x2)
                    .toString()
            )
        }

        e.apply()
    }

    private fun buildShell() {

        root=LinearLayout(this).apply {

            orientation=LinearLayout.VERTICAL

            setBackgroundColor(bg)
        }

        val header=
            LinearLayout(this).apply {

                orientation=LinearLayout.HORIZONTAL

                gravity=
                    Gravity.CENTER_VERTICAL

                setPadding(
                    dp(18),
                    dp(10),
                    dp(14),
                    dp(10)
                )

                background(
                    blue,
                    0,
                    0,
                    0,
                    0
                )
            }

        header.addView(
            TextView(this).apply {

                text="◷"
                textSize=34f
                setTextColor(Color.WHITE)

            },
            LinearLayout.LayoutParams(
                dp(42),
                dp(62)
            )
        )

        header.addView(
            TextView(this).apply {

                text="  CONTROLE DE HORAS"
                textSize=20f

                setTypeface(
                    null,
                    Typeface.BOLD
                )

                setTextColor(Color.WHITE)

                gravity=
                    Gravity.CENTER_VERTICAL

            },
            LinearLayout.LayoutParams(
                0,
                dp(62),
                1f
            )
        )

        header.addView(
            TextView(this).apply {

                text="⚙"
                textSize=28f

                setTextColor(Color.WHITE)

                setPadding(
                    dp(8),
                    0,
                    0,
                    0
                )

                setOnClickListener {
                    showSettings()
                }

            },
            LinearLayout.LayoutParams(
                dp(45),
                dp(62)
            )
        )

        root.addView(header)

        content=
            FrameLayout(this).apply {
                setBackgroundColor(bg)
            }

        root.addView(
            content,
            LinearLayout.LayoutParams(
                -1,
                0,
                1f
            )
        )

        nav=
            LinearLayout(this).apply {

                orientation=
                    LinearLayout.HORIZONTAL

                setPadding(
                    dp(2),
                    dp(5),
                    dp(2),
                    dp(5)
                )

                background(
                    Color.WHITE,
                    dp(18),
                    0,
                    0,
                    0
                )
            }

        listOf(
            "⌂\nPonto",
            "▣\nHistórico",
            "▥\nRelatório",
            "♟\nFuncionários",
            "▦\nEscala"
        ).forEachIndexed { i,label ->

            nav.addView(

                TextView(this).apply {

                    text=label
                    gravity=Gravity.CENTER
                    textSize=12f

                    setTypeface(
                        null,
                        Typeface.BOLD
                    )

                    setPadding(
                        0,
                        dp(5),
                        0,
                        dp(4)
                    )

                    setOnClickListener {
                        showTab(i)
                    }

                },

                LinearLayout.LayoutParams(
                    0,
                    dp(68),
                    1f
                )
            )
        }

        root.addView(nav)

        setContentView(root)
    }

    private fun showTab(tab:Int) {

        selectedTab=tab

        content.removeAllViews()

        when(tab) {

            0 -> showPunch()

            1 -> showHistory()

            2 -> showReport()

            3 -> showEmployees()

            4 -> showScale()
        }

        for(i in 0 until nav.childCount) {

            val v=
                nav.getChildAt(i)
                    as TextView

            if(i==tab) {

                v.setTextColor(blue)

                v.background(
                    0xFFE7F0FF.toInt(),
                    dp(16),
                    dp(16),
                    dp(16),
                    dp(16)
                )

            } else {

                v.setTextColor(muted)

                v.setBackgroundColor(
                    Color.TRANSPARENT
                )
            }
        }
    }

    private fun page(
        title:String
    ):LinearLayout {

        val scroll=
            ScrollView(this)

        val box=
            LinearLayout(this).apply {

                orientation=
                    LinearLayout.VERTICAL

                setPadding(
                    dp(18),
                    dp(16),
                    dp(18),
                    dp(22)
                )
            }

        box.addView(
            TextView(this).apply {

                text=title
                textSize=25f

                setTypeface(
                    null,
                    Typeface.BOLD
                )

                setTextColor(darkBlue)

                setPadding(
                    0,
                    0,
                    0,
                    dp(14)
                )
            }
        )

        scroll.addView(box)

        content.addView(scroll)

        return box
    }

    private fun showPunch() {

        val box=page("Bater Ponto")

        if(employees.isEmpty()) {

            box.addView(
                infoCard(
                    "Nenhum funcionário cadastrado.\n" +
                    "Cadastre o primeiro em Funcionários."
                )
            )

            return
        }

        val emp=
            employees.firstOrNull {
                it.id==selectedEmployeeId
            } ?: employees.first().also {
                selectedEmployeeId=it.id
            }

        box.addView(
            card().apply {

                val line=
                    LinearLayout(context).apply {

                        orientation=
                            LinearLayout.VERTICAL

                        setPadding(
                            dp(16),
                            dp(12),
                            dp(16),
                            dp(12)
                        )
                    }

                line.addView(
                    label("Funcionário")
                )

                val spinner=
                    Spinner(context)

                spinner.adapter=
                    ArrayAdapter(
                        context,
                        android.R.layout.simple_spinner_dropdown_item,
                        employees.map {
                            it.name
                        }
                    )

                spinner.setSelection(
                    employees.indexOfFirst {
                        it.id==
                            selectedEmployeeId
                    }.coerceAtLeast(0)
                )

                spinner.onItemSelectedListener=
                    object:
                    AdapterView.OnItemSelectedListener {

                        override fun onNothingSelected(
                            p:AdapterView<*>?
                        ) {}

                        override fun onItemSelected(
                            p:AdapterView<*>?,
                            v:View?,
                            pos:Int,
                            id:Long
                        ) {

                            if(
                                employees[pos].id
                                !=
                                selectedEmployeeId
                            ) {

                                selectedEmployeeId=
                                    employees[pos].id

                                selectedPunchDate=
                                    today()

                                showPunch()
                            }
                        }
                    }

                line.addView(spinner)

                line.addView(
                    TextView(context).apply {

                        text=
                            "Salário mensal   " +
                            money.format(
                                emp.salary
                            )

                        textSize=14f
                        setTextColor(muted)

                        setPadding(
                            0,
                            dp(8),
                            0,
                            0
                        )
                    }
                )

                addView(line)
            },
            0,
            0,
            0,
            dp(10)
        )

        val dateCard=card()

        val dateLine=
            LinearLayout(this).apply {

                orientation=
                    LinearLayout.HORIZONTAL

                gravity=
                    Gravity.CENTER_VERTICAL

                setPadding(
                    dp(14),
                    dp(10),
                    dp(14),
                    dp(10)
                )
            }

        dateLine.addView(
            TextView(this).apply {

                text="📅"
                textSize=25f

            },
            LinearLayout.LayoutParams(
                dp(45),
                dp(55)
            )
        )

        dateLine.addView(
            TextView(this).apply {

                text=
                    "Data do ponto\n" +
                    df.format(
                        parseIso(
                            selectedPunchDate
                        )
                    )

                textSize=15f

                setTypeface(
                    null,
                    Typeface.BOLD
                )

                setTextColor(text)

            },
            LinearLayout.LayoutParams(
                0,
                dp(60),
                1f
            )
        )

        dateLine.addView(
            Button(this).apply {

                text="ALTERAR"
                isAllCaps
