name: ControleHoras - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair ControleHoras.zip
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO EXTRAÍDO OK"

      - name: Corrigir MainActivity original
        shell: python
        run: |
          from pathlib import Path
          import re

          arquivo = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          codigo = arquivo.read_text(encoding="utf-8")

          print("Linhas originais:", len(codigo.splitlines()))

          # ======================================================
          # CORREÇÕES BÁSICAS
          # ======================================================

          codigo = codigo.replace(
              'setText(if(existing!=null)existing.salary.toString():"")',
              'setText(if(existing!=null)existing.salary.toString() else "")'
          )

          codigo = codigo.replace(
              'setText(if(existing != null) existing.salary.toString():"")',
              'setText(if(existing != null) existing.salary.toString() else "")'
          )

          codigo = codigo.replace(
              "setTextColor(text)",
              "setTextColor(this@MainActivity.text)"
          )

          codigo = codigo.replace(
              'it.date.endsWith(SimpleDateFormat("MM-yyyy", Locale.US).format(Date()))',
              'it.date.startsWith(SimpleDateFormat("yyyy-MM", Locale.US).format(Date()))'
          )

          # ======================================================
          # HORÁRIO DO RELÓGIO
          # ======================================================

          if "private fun normalizeTime(" not in codigo:

              marcador = "    private fun getRecord(empId:Long,date:String):PunchDay{"

              if marcador not in codigo:
                  raise SystemExit("ERRO: getRecord não encontrado.")

              helper = "\n".join([
                  "    private fun normalizeTime(value:String):String{",
                  "        val digits=value.filter{it.isDigit()}.take(4)",
                  "        if(digits.length!=4)return \"\"",
                  "        val hour=digits.substring(0,2).toIntOrNull()?:return \"\"",
                  "        val minute=digits.substring(2,4).toIntOrNull()?:return \"\"",
                  "        if(hour !in 0..23)return \"\"",
                  "        if(minute !in 0..59)return \"\"",
                  "        return \"%02d:%02d\".format(Locale.US,hour,minute)",
                  "    }",
                  "",
                  "    private fun timeEdit(initial:String=\"\",hintText:String=\"00:00\"):EditText{",
                  "        val e=EditText(this).apply{",
                  "            hint=hintText",
                  "            inputType=2",
                  "            setSingleLine()",
                  "            val normalized=normalizeTime(initial)",
                  "            if(normalized.isNotEmpty())setText(normalized)",
                  "        }",
                  "",
                  "        var changing=false",
                  "",
                  "        e.addTextChangedListener(object:android.text.TextWatcher{",
                  "            override fun beforeTextChanged(s:CharSequence?,start:Int,count:Int,after:Int){}",
                  "            override fun onTextChanged(s:CharSequence?,start:Int,before:Int,count:Int){}",
                  "",
                  "            override fun afterTextChanged(editable:android.text.Editable?){",
                  "                if(changing)return",
                  "",
                  "                val digits=editable?.toString()?.filter{it.isDigit()}?.take(4).orEmpty()",
                  "",
                  "                val formatted=when{",
                  "                    digits.isEmpty()->\"\"",
                  "                    digits.length<=2->digits",
                  "                    else->digits.substring(0,2)+\":\"+digits.substring(2)",
                  "                }",
                  "",
                  "                if(formatted!=editable?.toString()){",
                  "                    changing=true",
                  "                    e.setText(formatted)",
                  "                    e.setSelection(e.text.length)",
                  "                    changing=false",
                  "                }",
                  "            }",
                  "        })",
                  "",
                  "        e.setOnFocusChangeListener{_,hasFocus->",
                  "            if(!hasFocus){",
                  "                val normalized=normalizeTime(e.text.toString())",
                  "                if(normalized.isNotEmpty()){",
                  "                    e.setText(normalized)",
                  "                    e.setSelection(e.text.length)",
                  "                }",
                  "            }",
                  "        }",
                  "",
                  "        return e",
                  "    }",
                  ""
              ])

              codigo = codigo.replace(
                  marcador,
                  helper + marcador,
                  1
              )

          # ======================================================
          # DURAÇÃO
          #
          # Diferente de horário.
          # Permite 44:00.
          # ======================================================

          if "private fun normalizeDuration(" not in codigo:

              marcador = "    private fun getRecord(empId:Long,date:String):PunchDay{"

              helper = "\n".join([
                  "    private fun normalizeDuration(value:String):String{",
                  "        val digits=value.filter{it.isDigit()}.take(4)",
                  "        if(digits.length!=4)return \"\"",
                  "        val hour=digits.substring(0,2).toIntOrNull()?:return \"\"",
                  "        val minute=digits.substring(2,4).toIntOrNull()?:return \"\"",
                  "        if(hour !in 0..99)return \"\"",
                  "        if(minute !in 0..59)return \"\"",
                  "        return \"%02d:%02d\".format(Locale.US,hour,minute)",
                  "    }",
                  "",
                  "    private fun durationMinutes(value:String):Int{",
                  "        val v=normalizeDuration(value)",
                  "        if(v.isBlank())return 0",
                  "        return try{",
                  "            val p=v.split(\":\")",
                  "            p[0].toInt()*60+p[1].toInt()",
                  "        }catch(_:Exception){0}",
                  "    }",
                  "",
                  "    private fun durationEdit(initial:String=\"\",hintText:String=\"44:00\"):EditText{",
                  "        val e=EditText(this).apply{",
                  "            hint=hintText",
                  "            inputType=2",
                  "            setSingleLine()",
                  "            val normalized=normalizeDuration(initial)",
                  "            if(normalized.isNotEmpty())setText(normalized)",
                  "        }",
                  "",
                  "        var changing=false",
                  "",
                  "        e.addTextChangedListener(object:android.text.TextWatcher{",
                  "            override fun beforeTextChanged(s:CharSequence?,start:Int,count:Int,after:Int){}",
                  "            override fun onTextChanged(s:CharSequence?,start:Int,before:Int,count:Int){}",
                  "",
                  "            override fun afterTextChanged(editable:android.text.Editable?){",
                  "                if(changing)return",
                  "",
                  "                val digits=editable?.toString()?.filter{it.isDigit()}?.take(4).orEmpty()",
                  "",
                  "                val formatted=when{",
                  "                    digits.isEmpty()->\"\"",
                  "                    digits.length<=2->digits",
                  "                    else->digits.substring(0,2)+\":\"+digits.substring(2)",
                  "                }",
                  "",
                  "                if(formatted!=editable?.toString()){",
                  "                    changing=true",
                  "                    e.setText(formatted)",
                  "                    e.setSelection(e.text.length)",
                  "                    changing=false",
                  "                }",
                  "            }",
                  "        })",
                  "",
                  "        e.setOnFocusChangeListener{_,hasFocus->",
                  "            if(!hasFocus){",
                  "                val normalized=normalizeDuration(e.text.toString())",
                  "                if(normalized.isNotEmpty()){",
                  "                    e.setText(normalized)",
                  "                    e.setSelection(e.text.length)",
                  "                }",
                  "            }",
                  "        }",
                  "",
                  "        return e",
                  "    }",
                  ""
              ])

              codigo = codigo.replace(
                  marcador,
                  helper + marcador,
                  1
              )

          # ======================================================
          # CARGA SEMANAL
          # ======================================================

          if 'private var weeklyTarget:String = "44:00"' not in codigo:

              marcador = "    private val scale = linkedMapOf<String, DayScale>()"

              if marcador not in codigo:
                  raise SystemExit("ERRO: scale não encontrada.")

              codigo = codigo.replace(
                  marcador,
                  marcador + '\n    private var weeklyTarget:String = "44:00"',
                  1
              )

          # ======================================================
          # JORNADA POR SEMANA
          #
          # MF = segunda a sexta
          # MS = segunda a sábado
          # P  = personalizada
          # ======================================================

          if "private val weekModes" not in codigo:

              marcador = '    private var weeklyTarget:String = "44:00"'

              codigo = codigo.replace(
                  marcador,
                  marcador + '\n    private val weekModes=linkedMapOf<String,String>()',
                  1
              )

          # ======================================================
          # FUNÇÕES DE SEMANA
          # ======================================================

          if "private fun weekKey(" not in codigo:

              marcador = "    private fun getRecord(empId:Long,date:String):PunchDay{"

              helpers = "\n".join([
                  "    private fun weekKey(date:Date):String{",
                  "        val c=Calendar.getInstance().apply{",
                  "            time=date",
                  "            set(Calendar.HOUR_OF_DAY,0)",
                  "            set(Calendar.MINUTE,0)",
                  "            set(Calendar.SECOND,0)",
                  "            set(Calendar.MILLISECOND,0)",
                  "            set(Calendar.DAY_OF_WEEK,Calendar.MONDAY)",
                  "        }",
                  "        return SimpleDateFormat(\"yyyy-MM-dd\",Locale.US).format(c.time)",
                  "    }",
                  "",
                  "    private fun modeForDate(date:Date):String{",
                  "        return weekModes[weekKey(date)] ?: \"MF\"",
                  "    }",
                  "",
                  "    private fun modeForDay(date:Date):Boolean{",
                  "        val c=Calendar.getInstance().apply{time=date}",
                  "        val day=c.get(Calendar.DAY_OF_WEEK)",
                  "        return when(modeForDate(date)){",
                  "            \"MS\"->day in Calendar.MONDAY..Calendar.SATURDAY",
                  "            \"P\"->true",
                  "            else->day in Calendar.MONDAY..Calendar.FRIDAY",
                  "        }",
                  "    }",
                  "",
                  "    private fun weekLabel(date:Date):String{",
                  "        val c=Calendar.getInstance().apply{",
                  "            time=date",
                  "            set(Calendar.HOUR_OF_DAY,0)",
                  "            set(Calendar.MINUTE,0)",
                  "            set(Calendar.SECOND,0)",
                  "            set(Calendar.MILLISECOND,0)",
                  "            set(Calendar.DAY_OF_WEEK,Calendar.MONDAY)",
                  "        }",
                  "        val inicio=SimpleDateFormat(\"dd/MM/yyyy\",Locale.US).format(c.time)",
                  "        c.add(Calendar.DAY_OF_MONTH,6)",
                  "        val fim=SimpleDateFormat(\"dd/MM/yyyy\",Locale.US).format(c.time)",
                  "        return \"$inicio até $fim\"",
                  "    }",
                  "",
                  "    private fun modeTitle(mode:String):String{",
                  "        return when(mode){",
                  "            \"MS\"->\"Segunda a sábado — 07:20 por dia\"",
                  "            \"P\"->\"Personalizada\"",
                  "            else->\"Segunda a sexta — 08:48 por dia\"",
                  "        }",
                  "    }",
                  ""
              ])

              codigo = codigo.replace(
                  marcador,
                  helpers + marcador,
                  1
              )

          # ======================================================
          # CARREGAR SEMANAS
          # ======================================================

          codigo = codigo.replace(
              'weeklyTarget=normalizeTime(prefs.getString("weeklyTarget","44:00")?:"44:00").ifBlank{"44:00"}',
              'weeklyTarget=normalizeDuration(prefs.getString("weeklyTarget","44:00")?:"44:00").ifBlank{"44:00"}'
          )

          if 'prefs.getString("weekModes","{}")' not in codigo:

              marcador = '        weeklyTarget=normalizeDuration(prefs.getString("weeklyTarget","44:00")?:"44:00").ifBlank{"44:00"}'

              if marcador not in codigo:
                  raise SystemExit("ERRO: carregamento da carga semanal não encontrado.")

              bloco = "\n".join([
                  marcador,
                  '        val savedWeeks=prefs.getString("weekModes","{}")?:"{}"',
                  "        try{",
                  "            val obj=JSONObject(savedWeeks)",
                  "            weekModes.clear()",
                  "            val keys=obj.keys()",
                  "            while(keys.hasNext()){",
                  "                val k=keys.next()",
                  "                weekModes[k]=obj.optString(k,\"MF\")",
                  "            }",
                  "        }catch(_:Exception){",
                  "            weekModes.clear()",
                  "        }"
              ])

              codigo = codigo.replace(
                  marcador,
                  bloco,
                  1
              )

          # ======================================================
          # SALVAR SEMANAS
          # ======================================================

          if '.putString("weekModes"' not in codigo:

              antigo = (
                  'val e = prefs.edit().putString("records", ra.toString()).putString("weeklyTarget", weeklyTarget)'
              )

              novo = "\n".join([
                  "        val weekJson=JSONObject()",
                  "        weekModes.forEach{(k,v)->weekJson.put(k,v)}",
                  '        val e = prefs.edit().putString("records", ra.toString()).putString("weeklyTarget", weeklyTarget).putString("weekModes",weekJson.toString())'
              ])

              if antigo not in codigo:
                  raise SystemExit("ERRO: saveData não encontrado.")

              codigo = codigo.replace(
                  antigo,
                  novo,
                  1
              )

          # ======================================================
          # SHOW SCALE
          # ======================================================

          inicio = codigo.find(
              "    private fun showScale() {"
          )

          fim = codigo.find(
              "    private fun employeeDialog",
              inicio
          )

          if inicio == -1 or fim == -1:
              raise SystemExit("ERRO: showScale não encontrada.")

          escala = "\n".join([
              "    private fun showScale() {",
              "        val box=page(\"Escala Semanal\")",
              "",
              "        box.addView(infoCard(\"Escolha a jornada de cada semana. O padrão é segunda a sexta, 08:48 por dia.\"))",
              "",
              "        fun semanaCard(titulo:String,data:Date){",
              "",
              "            val key=weekKey(data)",
              "            val mode=modeForDate(data)",
              "",
              "            val cardSemana=card()",
              "",
              "            val linha=LinearLayout(this).apply{",
              "                orientation=LinearLayout.VERTICAL",
              "                setPadding(dp(14),dp(10),dp(14),dp(10))",
              "            }",
              "",
              "            linha.addView(",
              "                TextView(this).apply{",
              "                    text=titulo",
              "                    textSize=18f",
              "                    setTypeface(null,Typeface.BOLD)",
              "                    setTextColor(darkBlue)",
              "                },",
              "                LinearLayout.LayoutParams(-1,dp(35))",
              "            )",
              "",
              "            linha.addView(",
              "                TextView(this).apply{",
              "                    text=weekLabel(data)",
              "                    textSize=13f",
              "                    setTextColor(muted)",
              "                },",
              "                LinearLayout.LayoutParams(-1,dp(28))",
              "            )",
              "",
              "            linha.addView(",
              "                TextView(this).apply{",
              "                    text=modeTitle(mode)",
              "                    textSize=15f",
              "                    setTypeface(null,Typeface.BOLD)",
              "                    setTextColor(darkBlue)",
              "                    setPadding(0,dp(6),0,dp(6))",
              "                },",
              "                LinearLayout.LayoutParams(-1,dp(45))",
              "            )",
              "",
              "            val mf=Button(this).apply{",
              "                text=\"Segunda a sexta — 08:48\"",
              "                isAllCaps=false",
              "            }",
              "",
              "            mf.setOnClickListener{",
              "                weekModes[key]=\"MF\"",
              "                saveData()",
              "                showScale()",
              "            }",
              "",
              "            val ms=Button(this).apply{",
              "                text=\"Segunda a sábado — 07:20\"",
              "                isAllCaps=false",
              "            }",
              "",
              "            ms.setOnClickListener{",
              "                weekModes[key]=\"MS\"",
              "                saveData()",
              "                showScale()",
              "            }",
              "",
              "            val personalizado=Button(this).apply{",
              "                text=\"Personalizada\"",
              "                isAllCaps=false",
              "            }",
              "",
              "            personalizado.setOnClickListener{",
              "                weekModes[key]=\"P\"",
              "                saveData()",
              "                showScale()",
              "            }",
              "",
              "            linha.addView(",
              "                mf,",
              "                LinearLayout.LayoutParams(-1,dp(48)).apply{bottomMargin=dp(5)}",
              "            )",
              "",
              "            linha.addView(",
              "                ms,",
              "                LinearLayout.LayoutParams(-1,dp(48)).apply{bottomMargin=dp(5)}",
              "            )",
              "",
              "            linha.addView(",
              "                personalizado,",
              "                LinearLayout.LayoutParams(-1,dp(48))",
              "            )",
              "",
              "            cardSemana.addView(linha)",
              "",
              "            box.addView(",
              "                cardSemana,",
              "                LinearLayout.LayoutParams(-1,dp(225)).apply{bottomMargin=dp(12)}",
              "            )",
              "        }",
              "",
              "        val hoje=Date()",
              "",
              "        val proxima=Calendar.getInstance().apply{",
              "            time=hoje",
              "            set(Calendar.HOUR_OF_DAY,0)",
              "            set(Calendar.MINUTE,0)",
              "            set(Calendar.SECOND,0)",
              "            set(Calendar.MILLISECOND,0)",
              "            set(Calendar.DAY_OF_WEEK,Calendar.MONDAY)",
              "            add(Calendar.DAY_OF_MONTH,7)",
              "        }.time",
              "",
              "        semanaCard(\"Semana atual\",hoje)",
              "        semanaCard(\"Próxima semana\",proxima)",
              "",
              "        box.addView(infoCard(\"44:00 semanais: segunda a sexta = 08:48 por dia. Segunda a sábado = 07:20 por dia.\"))",
              "    }",
              "",
              ""
          ])

          codigo = codigo[:inicio] + escala + codigo[fim:]

          # ======================================================
          # CÁLCULO
          # ======================================================

          inicio = codigo.find(
              "    private fun calculate(r:PunchDay):Calc{"
          )

          fim = codigo.find(
              "    private fun minutesBetween",
              inicio
          )

          if inicio == -1 or fim == -1:
              raise SystemExit("ERRO: calculate não encontrada.")

          calculo = "\n".join([
              "    private fun calculate(r:PunchDay):Calc{",
              "",
              "        var worked=0",
              "",
              "        worked+=minutesBetween(r.punches[0],r.punches[1])",
              "",
              "        val segundoIntervalo=",
              "            r.punches[3].isNotBlank() ||",
              "            r.punches[4].isNotBlank()",
              "",
              "        if(segundoIntervalo){",
              "            worked+=minutesBetween(r.punches[2],r.punches[3])",
              "            worked+=minutesBetween(r.punches[4],r.punches[5])",
              "        }else{",
              "            worked+=minutesBetween(r.punches[2],r.punches[5])",
              "        }",
              "",
              "        val data=parseIso(r.date)",
              "        val mode=modeForDate(data)",
              "",
              "        if(mode!=\"P\" && !modeForDay(data)){",
              "            return Calc(worked,0,0,worked)",
              "        }",
              "",
              "        if(mode==\"P\"){",
              "            val cal=Calendar.getInstance().apply{time=data}",
              "            val key=cal.get(Calendar.DAY_OF_WEEK)",
              "            val index=dayKeys.indexOf(key)",
              "            val d=if(index>=0)scale[days[index]] else null",
              "",
              "            if(d==null || !d.enabled){",
              "                return Calc(worked,0,0,worked)",
              "            }",
              "",
              "            val expected=",
              "                minutesBetween(d.e,d.x1)+minutesBetween(d.r1,d.x2)",
              "",
              "            val extra=max(0,worked-expected)",
              "            val faltante=max(0,expected-worked)",
              "",
              "            return Calc(worked,expected,extra,faltante)",
              "        }",
              "",
              "        val semanal=durationMinutes(weeklyTarget)",
              "        val dias=if(mode==\"MS\")6 else 5",
              "        val expected=semanal/dias",
              "",
              "        val extra=max(0,worked-expected)",
              "        val faltante=max(0,expected-worked)",
              "",
              "        return Calc(worked,expected,extra,faltante)",
              "    }",
              "",
              ""
          ])

          codigo = codigo[:inicio] + calculo + codigo[fim:]

          # ======================================================
          # EDIÇÃO MANUAL
          # ======================================================

          codigo = re.sub(
              r'val e=EditText\(this\)\.apply\{setText\(r\.punches\[index\]\);hint="HH:mm";inputType=2;setSingleLine\(\)\}',
              'val e=timeEdit(r.punches[index],punchNames[index])',
              codigo,
              count=1
          )

          codigo = codigo.replace(
              'r.punches[index]=e.text.toString();saveData();showPunch()',
              'r.punches[index]=normalizeTime(e.text.toString());saveData();showPunch()'
          )

          codigo = re.sub(
              r'val fields=r\.punches\.mapIndexed\{i,v->EditText\(this\)\.apply\{hint=punchNames\[i\];setText\(v\);inputType=2;setSingleLine\(\);\}\}',
              'val fields=r.punches.mapIndexed{i,v->timeEdit(v,punchNames[i])}',
              codigo,
              count=1
          )

          codigo = codigo.replace(
              'fields.forEachIndexed{i,e->r.punches[i]=e.text.toString()};saveData();showHistory()',
              'fields.forEachIndexed{i,e->r.punches[i]=normalizeTime(e.text.toString())};saveData();showHistory()'
          )

          # ======================================================
          # MINUTES BETWEEN
          # ======================================================

          inicio = codigo.find(
              "    private fun minutesBetween(a:String,b:String):Int{"
          )

          fim = codigo.find(
              "    private fun formatMin",
              inicio
          )

          if inicio == -1 or fim == -1:
              raise SystemExit("ERRO: minutesBetween não encontrado.")

          minutos = "\n".join([
              "    private fun minutesBetween(a:String,b:String):Int{",
              "        val x=normalizeTime(a)",
              "        val y=normalizeTime(b)",
              "        if(x.isBlank()||y.isBlank())return 0",
              "        return try{",
              "            val xa=x.split(\":\")",
              "            val ya=y.split(\":\")",
              "            val inicio=xa[0].toInt()*60+xa[1].toInt()",
              "            val fim=ya[0].toInt()*60+ya[1].toInt()",
              "            max(0,fim-inicio)",
              "        }catch(_:Exception){0}",
              "    }",
              ""
          ])

          codigo = codigo[:inicio] + minutos + codigo[fim:]

          # ======================================================
          # FORMAT MIN
          # ======================================================

          inicio = codigo.find(
              "    private fun formatMin"
          )

          fim = codigo.find("\n",inicio)

          codigo = (
              codigo[:inicio]
              + '    private fun formatMin(m:Int):String="%02d:%02d".format(Locale.US,max(0,m)/60,max(0,m)%60)'
              + codigo[fim:]
          )

          # ======================================================
          # VALIDAÇÃO
          # ======================================================

          obrigatorias = [
              "private fun normalizeTime",
              "private fun normalizeDuration",
              "private fun durationMinutes",
              "private fun durationEdit",
              "private val weekModes",
              "private fun weekKey",
              "private fun modeForDate",
              "private fun modeForDay",
              "private fun calculate(r:PunchDay):Calc",
              "private fun minutesBetween",
              'private var weeklyTarget:String = "44:00"',
              "Semana atual",
              "Próxima semana",
              "Segunda a sexta — 08:48",
              "Segunda a sábado — 07:20",
              "Carga semanal"
          ]

          for item in obrigatorias:
              if item not in codigo:
                  raise SystemExit(
                      "ERRO: item ausente: " + item
                  )

          abertas = codigo.count("{")
          fechadas = codigo.count("}")

          print("Linhas finais:",len(codigo.splitlines()))
          print("Chaves:",abertas,fechadas)

          if abertas != fechadas:
              raise SystemExit("ERRO DE CHAVES")

          arquivo.write_text(
              codigo,
              encoding="utf-8"
          )

          print("========================================")
          print("MAINACTIVITY CORRIGIDA")
          print("========================================")
          print("JORNADA SEMANAL CONFIGURADA")
          print("PADRÃO: SEGUNDA A SEXTA - 08:48")
          print("OPÇÃO: SEGUNDA A SÁBADO - 07:20")
          print("PERSONALIZADA: DISPONÍVEL")

      - name: Validar código
        shell: python
        run: |
          from pathlib import Path

          arquivo = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          codigo = arquivo.read_text(encoding="utf-8")

          obrigatorias = [
              "private fun normalizeTime",
              "private fun normalizeDuration",
              "private fun durationMinutes",
              "private val weekModes",
              "private fun weekKey",
              "private fun modeForDate",
              "private fun modeForDay",
              "private fun calculate(r:PunchDay):Calc",
              "Carga semanal",
              "Semana atual",
              "Próxima semana",
              "Segunda a sexta — 08:48",
              "Segunda a sábado — 07:20"
          ]

          for item in obrigatorias:
              if item not in codigo:
                  raise SystemExit(
                      "ERRO: " + item
                  )

          abertas = codigo.count("{")
          fechadas = codigo.count("}")

          print("Linhas:",len(codigo.splitlines()))
          print("Chaves:",abertas,fechadas)

          if abertas != fechadas:
              raise SystemExit(
                  "ERRO: quantidade de chaves diferente"
              )

          print("CÓDIGO VALIDADO COM SUCESSO")

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q gradle-8.11.1-bin.zip

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "========================================"
          echo "APK GERADO"
          echo "========================================"

          ls -lh "$APK"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK ÍNTEGRO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Finalizar
        shell: bash
        run: |
          echo "CONTROLEHORAS FINALIZADO"
