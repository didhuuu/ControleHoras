name: ControleHoras APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip
          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt
          echo "PROJETO ORIGINAL OK"
      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess, tempfile
          url="https://raw.githubusercontent.com/didhuuu/ControleHoras/6381d26e525e1f9eeb91af17cdb9fed66293c1f2/.github/workflows/build.yml"
          workflow=urlopen(url,timeout=30).read().decode("utf-8")
          def extract_step(name,next_name):
              start=workflow.index(f"      - name: {name}")
              end=workflow.index(f"      - name: {next_name}",start)
              block=workflow[start:end]
              marker="        run: |\n"
              pos=block.index(marker)+len(marker)
              lines=block[pos:].splitlines()
              return "\n".join(line[10:] if line.startswith("          ") else line for line in lines)+"\n"
          scripts=[extract_step("Aplicar versão 36","Adicionar seleção de data"),extract_step("Adicionar seleção de data","Validar código")]
          for i,script in enumerate(scripts):
              p=Path(tempfile.gettempdir())/f"base70_{i}.py"
              p.write_text(script,encoding="utf-8")
              subprocess.run(["python",str(p)],check=True)
          print("BASE DA VERSÃO 70 APLICADA")
      - name: Aplicar correções finais da Base 70, edição por rolagem e ícone
        shell: python
        run: |
          from pathlib import Path
          import base64
          root=Path('ControleHoras')
          src=root/'app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt'
          manifest=root/'app/src/main/AndroidManifest.xml'
          code=src.read_text(encoding='utf-8')
          if 'private val extra2Enabled' not in code:
              anchors=['    private val weekModes=linkedMapOf<String,String>()\n','    private val weekModes = linkedMapOf<String,String>()\n']
              for a in anchors:
                  if a in code:
                      code=code.replace(a,a+'    private val extra2Enabled=mutableSetOf<String>()\n    private val extra2ReturnEnabled=mutableSetOf<String>()\n',1)
                      break
              else:
                  raise SystemExit('ERRO: weekModes não encontrado')
          if 'prefs.getString("extra2Enabled"' not in code:
              anchor='        scale.clear()\n'
              if anchor not in code: raise SystemExit('ERRO: scale.clear não encontrado')
              block='''        extra2Enabled.clear()
                  extra2ReturnEnabled.clear()
                  try{
                      val ja=JSONArray(prefs.getString("extra2Enabled","[]") ?: "[]")
                      for(i in 0 until ja.length()) extra2Enabled.add(ja.optString(i))
                      val jb=JSONArray(prefs.getString("extra2ReturnEnabled","[]") ?: "[]")
                      for(i in 0 until jb.length()) extra2ReturnEnabled.add(jb.optString(i))
                  }catch(_:Exception){}
          '''
              code=code.replace(anchor,block+anchor,1)
              anchor='        e.apply()\n'
              if anchor not in code: raise SystemExit('ERRO: e.apply não encontrado')
              block='''        val extraJson=JSONArray()
                  extra2Enabled.forEach{extraJson.put(it)}
                  e.putString("extra2Enabled",extraJson.toString())
                  val extraReturnJson=JSONArray()
                  extra2ReturnEnabled.forEach{extraReturnJson.put(it)}
                  e.putString("extra2ReturnEnabled",extraReturnJson.toString())
          '''
              code=code.replace(anchor,block+anchor,1)
          if 'private fun extraKey' not in code:
              anchor='    private fun today()=iso.format(Date())\n'
              if anchor not in code: raise SystemExit('ERRO: today não encontrado')
              block='''    private fun extraKey(empId:Long,date:String)=empId.toString()+"|"+date
              private fun extraEnabled(empId:Long,date:String)=extra2Enabled.contains(extraKey(empId,date))
              private fun extraReturnEnabled(empId:Long,date:String)=extra2ReturnEnabled.contains(extraKey(empId,date))
              private fun setExtraEnabled(empId:Long,date:String,value:Boolean){
                  val k=extraKey(empId,date)
                  if(value) extra2Enabled.add(k) else {extra2Enabled.remove(k);extra2ReturnEnabled.remove(k)}
                  saveData()
              }
              private fun setExtraReturnEnabled(empId:Long,date:String,value:Boolean){
                  val k=extraKey(empId,date)
                  if(value && extra2Enabled.contains(k)) extra2ReturnEnabled.add(k) else extra2ReturnEnabled.remove(k)
                  saveData()
              }
          '''
              code=code.replace(anchor,block+anchor,1)
          start=code.find('    private fun showPunch()')
          end=code.find('    private fun showHistory()',start)
          if start<0 or end<0: raise SystemExit('ERRO: showPunch/showHistory não encontrados')
          show='''    private fun showPunch(){
                  val box=page("Bater Ponto")
                  if(employees.isEmpty()){box.addView(infoCard("Nenhum funcionário cadastrado.\\nCadastre o primeiro em Funcionários."));return}
                  val emp=employees.firstOrNull{it.id==selectedEmployeeId}?:employees.first().also{selectedEmployeeId=it.id}
                  box.addView(card().apply{
                      val line=LinearLayout(context).apply{orientation=LinearLayout.VERTICAL;setPadding(dp(16),dp(12),dp(16),dp(12))}
                      line.addView(label("Funcionário"))
                      val spinner=Spinner(context)
                      spinner.adapter=ArrayAdapter(context,android.R.layout.simple_spinner_dropdown_item,employees.map{it.name})
                      spinner.setSelection(employees.indexOfFirst{it.id==selectedEmployeeId}.coerceAtLeast(0))
                      spinner.onItemSelectedListener=object:AdapterView.OnItemSelectedListener{
                          override fun onNothingSelected(p:AdapterView<*>?){ }
                          override fun onItemSelected(p:AdapterView<*>?,v:View?,pos:Int,id:Long){
                              if(employees[pos].id!=selectedEmployeeId){selectedEmployeeId=employees[pos].id;selectedPunchDate=today();showPunch()}
                          }
                      }
                      line.addView(spinner)
                      line.addView(TextView(context).apply{text="Salário mensal   ${money.format(emp.salary)}";textSize=14f;setTextColor(muted);setPadding(0,dp(8),0,0)})
                      addView(line)
                  },0,0,0,dp(10))
                  val dateCard=card()
                  val dateLine=LinearLayout(this).apply{orientation=LinearLayout.HORIZONTAL;gravity=Gravity.CENTER_VERTICAL;setPadding(dp(14),dp(8),dp(14),dp(8))}
                  dateLine.addView(TextView(this).apply{text="📅";textSize=25f},LinearLayout.LayoutParams(dp(45),dp(55)))
                  dateLine.addView(TextView(this).apply{text="DATA\\n${df.format(parseIso(selectedPunchDate))}";textSize=16f;setTypeface(null,Typeface.BOLD);setTextColor(this@MainActivity.text)},LinearLayout.LayoutParams(0,dp(60),1f))
                  dateLine.addView(Button(this).apply{text="ALTERAR";isAllCaps=false;setOnClickListener{choosePunchDate()}},LinearLayout.LayoutParams(dp(105),dp(52)))
                  dateCard.addView(dateLine)
                  box.addView(dateCard,LinearLayout.LayoutParams(-1,dp(82)).apply{bottomMargin=dp(8)})
                  box.addView(Button(this).apply{
                      text="✎  REGISTRO MANUAL";isAllCaps=false;textSize=14f
                      setOnClickListener{showManualWheel(emp.id)}
                  },LinearLayout.LayoutParams(-1,dp(54)).apply{bottomMargin=dp(10)})
                  val rec=getRecord(emp.id,selectedPunchDate)
                  val extra=extraEnabled(emp.id,selectedPunchDate)
                  val next=nextPunchIndex(rec,extra)
                  box.addView(Button(this).apply{
                      text=if(next<0)"PONTO DO DIA COMPLETO" else "▶  REGISTRAR PRÓXIMA BATIDA\\n${punchNames[next]}"
                      textSize=15f;setTextColor(Color.WHITE);isAllCaps=false;isEnabled=next>=0
                      background(green,dp(12),dp(12),dp(12),dp(12))
                      setOnClickListener{registerPunch(emp.id)}
                  },LinearLayout.LayoutParams(-1,dp(72)).apply{bottomMargin=dp(10)})
                  box.addView(TextView(this).apply{text="BATIDAS DO DIA";textSize=13f;setTypeface(null,Typeface.BOLD);setTextColor(muted);setPadding(dp(4),dp(2),0,dp(6))})
                  addPunchRow(box,rec,0,punchNames[0])
                  addPunchRow(box,rec,1,punchNames[1])
                  addPunchRow(box,rec,2,punchNames[2])
                  addPunchRow(box,rec,5,punchNames[5])
                  box.addView(TextView(this).apply{text="INTERVALO 2 (OPCIONAL)";textSize=13f;setTypeface(null,Typeface.BOLD);setTextColor(muted);setPadding(dp(4),dp(8),0,dp(4))})
                  addExtraSwitch(box,emp.id,selectedPunchDate,0,rec)
                  addExtraSwitch(box,emp.id,selectedPunchDate,1,rec)
                  val total=calculate(rec,extra)
                  box.addView(card().apply{
                      addView(TextView(context).apply{text="TOTAL TRABALHADO";textSize=13f;setTypeface(null,Typeface.BOLD);setTextColor(muted)})
                      addView(TextView(context).apply{text=total;textSize=28f;setTypeface(null,Typeface.BOLD);setTextColor(blue);setPadding(0,dp(4),0,0)})
                  },LinearLayout.LayoutParams(-1,dp(95)).apply{topMargin=dp(10)})
                  addView(box)
              }
          '''
          code=code[:start]+show+code[end:]
          if 'private fun showEditWheel' not in code:
              anchor='    private fun showManualWheel'
              p=code.find(anchor)
              if p<0: raise SystemExit('ERRO: showManualWheel não encontrado')
              wheel='''    private fun showEditWheel(rec:EmployeeRecord,index:Int){
                  if(index<0 || index>=rec.punches.size)return
                  val parts=rec.punches[index].split(":")
                  val h0=parts.getOrNull(0)?.toIntOrNull()?.coerceIn(0,23)?:0
                  val m0=parts.getOrNull(1)?.toIntOrNull()?.coerceIn(0,59)?:0
                  val box=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;setPadding(dp(20),dp(10),dp(20),0)}
                  val wheels=LinearLayout(this).apply{orientation=LinearLayout.HORIZONTAL;gravity=Gravity.CENTER}
                  val hour=NumberPicker(this).apply{minValue=0;maxValue=23;value=h0;wrapSelectorWheel=true}
                  val minute=NumberPicker(this).apply{minValue=0;maxValue=59;value=m0;wrapSelectorWheel=true}
                  wheels.addView(hour)
                  wheels.addView(TextView(this).apply{text=":";textSize=28f;gravity=Gravity.CENTER;setPadding(dp(5),0,dp(5),0)})
                  wheels.addView(minute)
                  box.addView(wheels)
                  AlertDialog.Builder(this).setTitle("Editar horário").setView(box).setNegativeButton("Cancelar",null).setPositiveButton("Salvar"){_,_->
                      rec.punches[index]="%02d:%02d".format(Locale.US,hour.value,minute.value)
                      saveData()
                      showPunch()
                  }.show()
              }
          '''
              code=code[:p]+wheel+code[p:]
          if 'private fun showManualWheel' not in code:
              raise SystemExit('ERRO: showManualWheel não existe')
          if 'row.setOnClickListener{showEditWheel(rec,index)}' not in code:
              anchor='    private fun addPunchRow'
              p=code.find(anchor)
              if p<0: raise SystemExit('ERRO: addPunchRow não encontrado')
              row='''    private fun addPunchRow(box:LinearLayout,rec:EmployeeRecord,index:Int,title:String){
                  val row=LinearLayout(this).apply{orientation=LinearLayout.HORIZONTAL;gravity=Gravity.CENTER_VERTICAL;setPadding(dp(14),dp(8),dp(14),dp(8))}
                  row.addView(TextView(this).apply{text=title;textSize=14f;setTypeface(null,Typeface.BOLD)},LinearLayout.LayoutParams(0,dp(58),1f))
                  val value=TextView(this).apply{
                      text=rec.punches.getOrNull(index).orEmpty().ifBlank{"--:--"}
                      textSize=21f
                      setTypeface(null,Typeface.BOLD)
                      setTextColor(blue)
                      gravity=Gravity.CENTER
                  }
                  row.addView(value,LinearLayout.LayoutParams(dp(95),dp(58)))
                  row.setOnClickListener{showEditWheel(rec,index)}
                  box.addView(row,LinearLayout.LayoutParams(-1,dp(66)).apply{bottomMargin=dp(4)})
              }
          '''
              q=code.find(anchor)
              if q<0: raise SystemExit('ERRO addPunchRow')
              # Preserve original if it exists; only inject listener into existing function.
              # The final validation below checks the listener.
              endfun=code.find('\n    private fun ',q+len(anchor))
              if endfun<0: endfun=len(code)
              section=code[q:endfun]
              if 'row.setOnClickListener' not in section:
                  section=section.replace('box.addView(row', 'row.setOnClickListener{showEditWheel(rec,index)}\n                  box.addView(row',1)
                  code=code[:q]+section+code[endfun:]
          if 'private fun nextPunchIndex(rec:EmployeeRecord,extra:Boolean)' not in code:
              anchor='    private fun calculate'
              p=code.find(anchor)
              if p<0: raise SystemExit('ERRO: calculate não encontrado')
              fn='''    private fun nextPunchIndex(rec:EmployeeRecord,extra:Boolean):Int{
                  val indexes=if(extra) intArrayOf(0,1,2,5,3,4) else intArrayOf(0,1,2,5)
                  for(i in indexes) if(rec.punches.getOrNull(i).isNullOrBlank()) return i
                  return -1
              }
          '''
              code=code[:p]+fn+code[p:]
          if 'WindowCompat.setDecorFitsSystemWindows(window,false)' not in code:
              anchor='        buildShell()\n'
              if anchor not in code: raise SystemExit('ERRO: buildShell não encontrado')
              inset='''        WindowCompat.setDecorFitsSystemWindows(window,false)
                  window.statusBarColor=blue
                  window.navigationBarColor=Color.WHITE
                  window.decorView.systemUiVisibility=View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                  ViewCompat.setOnApplyWindowInsetsListener(root){v,insets->
                      val bars=insets.getInsets(WindowInsetsCompat.Type.systemBars())
                      v.setPadding(v.paddingLeft,bars.top,v.paddingRight,bars.bottom)
                      insets
                  }
                  ViewCompat.requestApplyInsets(root)
          '''
              code=code.replace(anchor,anchor+inset,1)
          icon_b64=''
          icon=root/'app/src/main/res/drawable/controlehoras_icon.jpg'
          icon.write_bytes(base64.b64decode(icon_b64))
          m=manifest.read_text(encoding='utf-8')
          if 'android:icon="@drawable/controlehoras_icon"' not in m:
              m=m.replace('<application','<application
        android:icon="@drawable/controlehoras_icon"
        android:roundIcon="@drawable/controlehoras_icon"',1)
          manifest.write_text(m,encoding='utf-8')
          src.write_text(code,encoding='utf-8')
          print('CORREÇÕES FINAIS APLICADAS')
      - name: Validar código e ícone
        shell: bash
        run: |
          set -e
          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          test -s "$FILE"
          test -s "ControleHoras/app/src/main/res/drawable/controlehoras_icon.jpg"
          grep -q 'extra2Enabled' "$FILE"
          grep -q 'showManualWheel' "$FILE"
          grep -q 'showEditWheel' "$FILE"
          grep -q 'nextPunchIndex' "$FILE"
          grep -q 'WindowCompat.setDecorFitsSystemWindows' "$FILE"
          grep -q 'controlehoras_icon' ControleHoras/app/src/main/AndroidManifest.xml
          if grep -q 'Button(context)' "$FILE"; then echo "ERRO Button(context)"; exit 1; fi
          echo "VALIDAÇÃO OK"
      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"
          "$PWD/gradle-8.11.1/bin/gradle" --version
      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: gradle clean --no-daemon
      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e
          gradle assembleDebug --no-daemon --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK VALIDADO"
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
