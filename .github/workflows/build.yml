name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name, next_name):

              start = workflow.index(
                  f"      - name: {name}"
              )

              end = workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              pos = block.index(marker) + len(marker)

              lines = block[pos:].splitlines()

              return (
                  "\n".join(
                      line[10:]
                      if line.startswith("          ")
                      else line
                      for line in lines
                  )
                  + "\n"
              )

          scripts = [
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for i, script in enumerate(scripts):

              p = (
                  Path(tempfile.gettempdir()) /
                  f"base70_{i}.py"
              )

              p.write_text(
                  script,
                  encoding="utf-8"
              )

              subprocess.run(
                  [
                      "python",
                      str(p)
                  ],
                  check=True
              )

          print(
              "BASE 70 APLICADA"
          )

      - name: Aplicar funcionalidades completas
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name, next_name):

              start = workflow.index(
                  f"- name: {name}"
              )

              end = workflow.index(
                  f"- name: {next_name}",
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              pos = block.index(marker) + len(marker)

              lines = block[pos:].splitlines()

              return (
                  "\n".join(
                      line[10:]
                      if line.startswith("          ")
                      else line
                      for line in lines
                  )
                  + "\n"
              )

          script = extract_step(
              "Aplicar correções finais da Base 70, edição por rolagem e ícone",
              "Validar código e ícone"
          )

          p = (
              Path(tempfile.gettempdir()) /
              "funcionalidades.py"
          )

          p.write_text(
              script,
              encoding="utf-8"
          )

          subprocess.run(
              [
                  "python",
                  str(p)
              ],
              check=True
          )

          print(
              "FUNCIONALIDADES COMPLETAS APLICADAS"
          )

      - name: Corrigir pontos finais sem quebrar o Python
        shell: python
        run: |
          from pathlib import Path

          file = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          code = file.read_text(
              encoding="utf-8"
          )

          # ============================================================
          # CORRIGIR addView COM 4 ARGUMENTOS
          # ============================================================

          old = (
              "                  },\n"
              "                  0,\n"
              "                  0,\n"
              "                  0,\n"
              "                  dp(10)\n"
              "              )\n"
              "\n"
              "              val dateCard=card()"
          )

          new = (
              "                  },\n"
              "                  LinearLayout.LayoutParams(\n"
              "                      -1,\n"
              "                      -2\n"
              "                  ).apply{\n"
              "                      bottomMargin=dp(10)\n"
              "                  }\n"
              "              )\n"
              "\n"
              "              val dateCard=card()"
          )

          if old in code:

              code = code.replace(
                  old,
                  new,
                  1
              )

              print(
                  "addView corrigido"
              )

          # ============================================================
          # PERMITIR EDITAR UMA BATIDA VAZIA
          # ============================================================

          old = (
              "                  if(rec.punches[index].isBlank()){\n"
              "                      Toast.makeText(this,\"Esse registro ainda está vazio. Use REGISTRO MANUAL.\",Toast.LENGTH_LONG).show()\n"
              "                      return\n"
              "                  }\n"
          )

          if old in code:

              code = code.replace(
                  old,
                  "",
                  1
              )

              print(
                  "Edição de batida vazia liberada"
              )

          # ============================================================
          # CRIAR VISUAL DAS RODAS
          # ============================================================

          if (
              "private fun styleWheel(picker:NumberPicker)"
              not in code
          ):

              marker = (
                  "              private fun showEditWheel("
              )

              helper_lines = [
                  "              private fun styleWheel(picker:NumberPicker){",
                  "                  picker.setBackgroundColor(Color.TRANSPARENT)",
                  "                  picker.wrapSelectorWheel=true",
                  "                  picker.descendantFocusability=NumberPicker.FOCUS_BLOCK_DESCENDANTS",
                  "                  picker.post{",
                  "                      for(i in 0 until picker.childCount){",
                  "                          val child=picker.getChildAt(i)",
                  "                          if(child is TextView){",
                  "                              child.setTextColor(darkBlue)",
                  "                              child.textSize=21f",
                  "                              child.gravity=Gravity.CENTER",
                  "                              child.setTypeface(null,Typeface.BOLD)",
                  "                          }",
                  "                      }",
                  "                  }",
                  "              }",
                  "",
              ]

              helper = "\n".join(
                  helper_lines
              )

              if marker not in code:
                  raise SystemExit(
                      "ERRO: showEditWheel não encontrado"
                  )

              code = code.replace(
                  marker,
                  helper + marker,
                  1
              )

          # ============================================================
          # APLICAR ESTILO NAS DUAS RODAS
          # ============================================================

          for function_name in (
              "showEditWheel",
              "showManualWheel"
          ):

              pos = code.find(
                  "private fun " + function_name
              )

              if pos < 0:
                  raise SystemExit(
                      "ERRO: " + function_name + " não encontrado"
                  )

              end = code.find(
                  "\n              }",
                  pos
              )

              if end < 0:
                  raise SystemExit(
                      "ERRO: fim de " + function_name + " não encontrado"
                  )

              trecho = code[
                  pos:end
              ]

              if "styleWheel(hour)" not in trecho:

                  marker = (
                      "                  val sep="
                  )

                  sep = trecho.find(
                      marker
                  )

                  if sep >= 0:

                      insertion = (
                          "                  styleWheel(hour)\n"
                          "                  styleWheel(minute)\n\n"
                      )

                      trecho = (
                          trecho[:sep]
                          + insertion
                          + trecho[sep:]
                      )

                      code = (
                          code[:pos]
                          + trecho
                          + code[end:]
                      )

          # ============================================================
          # GARANTIR PUNCHNAMES
          # ============================================================

          if "private val punchNames" not in code:

              names = (
                  "    private val punchNames=arrayOf<String>(\n"
                  "        \"Entrada\",\n"
                  "        \"Saída\",\n"
                  "        \"Retorno\",\n"
                  "        \"Saída intervalo 2\",\n"
                  "        \"Retorno intervalo 2\",\n"
                  "        \"Saída\"\n"
                  "    )\n"
              )

              anchors = [
                  "    private val extra2ReturnEnabled=mutableSetOf<String>()\n",
                  "    private val extra2Enabled=mutableSetOf<String>()\n",
                  "    private val weekModes=linkedMapOf<String,String>()\n",
                  "    private val weekModes = linkedMapOf<String,String>()\n"
              ]

              inserted = False

              for anchor in anchors:

                  if anchor in code:

                      code = code.replace(
                          anchor,
                          anchor + names,
                          1
                      )

                      inserted = True
                      break

              if not inserted:

                  raise SystemExit(
                      "ERRO: não foi possível inserir punchNames"
                  )

          file.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "CORREÇÕES FINAIS APLICADAS"
          )

      - name: Validar código e ícone
        shell: bash
        run: |
          set -e

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          echo "========================================"
          echo "VALIDANDO"
          echo "========================================"

          test -s "$FILE"

          test -s \
            "ControleHoras/app/src/main/res/drawable/controlehoras_icon.jpg"

          grep -q \
            'extra2Enabled' \
            "$FILE"

          grep -q \
            'showManualWheel' \
            "$FILE"

          grep -q \
            'showEditWheel' \
            "$FILE"

          grep -q \
            'nextPunchIndex' \
            "$FILE"

          grep -q \
            'punchNames' \
            "$FILE"

          grep -q \
            'WindowCompat.setDecorFitsSystemWindows' \
            "$FILE"

          grep -q \
            'controlehoras_icon' \
            ControleHoras/app/src/main/AndroidManifest.xml

          if grep -q \
            'Button(context)' \
            "$FILE"
          then
            echo "ERRO: Button(context)"
            exit 1
          fi

          echo "VALIDAÇÃO OK"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GERANDO APK"
          echo "========================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

          echo "APK GERADO"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t \
            "$APK" \
            >/dev/null

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
