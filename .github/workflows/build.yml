name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1 - BAIXAR PROJETO
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4


      # ============================================================
      # 2 - JAVA 17
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3 - EXTRAIR BASE
      # ============================================================

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXTRAINDO PROJETO"
          echo "========================================"

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO EXTRAÍDO COM SUCESSO"


      # ============================================================
      # 4 - BASE 70
      # ============================================================

      - name: Aplicar Base 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          print("========================================")
          print("APLICANDO BASE 70")
          print("========================================")

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=60
          ).read().decode("utf-8")


          def extract_step(
              name,
              next_name
          ):

              start_marker = (
                  "      - name: "
                  + name
              )

              end_marker = (
                  "      - name: "
                  + next_name
              )

              if start_marker not in workflow:
                  raise SystemExit(
                      "Etapa Base 70 não encontrada: "
                      + name
                  )

              start = workflow.index(
                  start_marker
              )

              end = workflow.index(
                  end_marker,
                  start
              )

              block = workflow[
                  start:end
              ]

              marker = (
                  "        run: |\n"
              )

              if marker not in block:
                  raise SystemExit(
                      "run da etapa não encontrado: "
                      + name
                  )

              pos = (
                  block.index(marker)
                  + len(marker)
              )

              lines = block[
                  pos:
              ].splitlines()

              result = []

              for line in lines:

                  if line.startswith(
                      "          "
                  ):
                      result.append(
                          line[10:]
                      )

                  else:
                      result.append(
                          line
                      )

              return (
                  "\n".join(result).rstrip()
                  + "\n"
              )


          scripts = [

              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),

              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]


          for number, script in enumerate(
              scripts
          ):

              path = (
                  Path(tempfile.gettempdir())
                  / f"base70_{number}.py"
              )

              path.write_text(
                  script,
                  encoding="utf-8"
              )

              compile(
                  script,
                  str(path),
                  "exec"
              )

              subprocess.run(
                  [
                      "python",
                      str(path)
                  ],
                  check=True
              )


          print("========================================")
          print("BASE 70 APLICADA")
          print("ESCALA PRESERVADA")
          print("========================================")


      # ============================================================
      # 5 - CORREÇÕES DA VERSÃO 80
      # ============================================================

      - name: Aplicar correções da versão 80
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          print("========================================")
          print("APLICANDO CORREÇÕES DA VERSÃO 80")
          print("========================================")

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=60
          ).read().decode("utf-8")


          start_marker = (
              "      - name: "
              "Aplicar correções finais da Base 70, "
              "edição por rolagem e ícone"
          )

          end_marker = (
              "      - name: Validar código e ícone"
          )


          if start_marker not in workflow:
              raise SystemExit(
                  "Etapa da versão 80 não encontrada."
              )

          start = workflow.index(
              start_marker
          )

          end = workflow.index(
              end_marker,
              start
          )

          block = workflow[
              start:end
          ]

          marker = (
              "        run: |\n"
          )

          pos = (
              block.index(marker)
              + len(marker)
          )

          lines = block[
              pos:
          ].splitlines()

          script_lines = []

          for line in lines:

              if line.startswith(
                  "          "
              ):
                  script_lines.append(
                      line[10:]
                  )

              else:
                  script_lines.append(
                      line
                  )

          script = (
              "\n".join(
                  script_lines
              ).rstrip()
              + "\n"
          )


          path = (
              Path(tempfile.gettempdir())
              / "versao80.py"
          )

          path.write_text(
              script,
              encoding="utf-8"
          )

          compile(
              script,
              str(path),
              "exec"
          )

          subprocess.run(
              [
                  "python",
                  str(path)
              ],
              check=True
          )

          print("========================================")
          print("CORREÇÕES DA VERSÃO 80 APLICADAS")
          print("========================================")


      # ============================================================
      # 6 - CORRIGIR CARTÃO
      #
      # NÃO procura mais a estrutura inteira do cartão.
      # Corrige somente o addView inválido.
      # ============================================================

      - name: Corrigir cartão de funcionário
        shell: python
        run: |
          from pathlib import Path

          src = Path(
              "ControleHoras/"
              "app/src/main/java/com/didhuuu/"
              "controlehoras/MainActivity.kt"
          )

          code = src.read_text(
              encoding="utf-8"
          )


          old = """                          addView(line)

                      },
                      0,
                      0,
                      0,
                      dp(10)
                  )"""


          new = """                          addView(line)

                      }.let { employeeCard ->

                          box.addView(
                              employeeCard,
                              LinearLayout.LayoutParams(
                                  -1,
                                  -2
                              ).apply{
                                  bottomMargin=dp(10)
                              }
                          )
                      }"""


          if old not in code:

              if (
                  "employeeCard" in code
                  and
                  "bottomMargin=dp(10)" in code
              ):

                  print(
                      "CARTÃO JÁ ESTÁ CORRIGIDO"
                  )

              else:

                  raise SystemExit(
                      "ERRO: fechamento do cartão "
                      "não encontrado."
                  )

          else:

              code = code.replace(
                  old,
                  new,
                  1
              )

              src.write_text(
                  code,
                  encoding="utf-8"
              )

              print(
                  "CARTÃO DE FUNCIONÁRIO CORRIGIDO"
              )


      # ============================================================
      # 7 - CRIAR SOM DA ROLETA
      # ============================================================

      - name: Criar som mecânico da roleta
        shell: python
        run: |
          from pathlib import Path
          import wave
          import math
          import struct

          raw = Path(
              "ControleHoras/"
              "app/src/main/res/raw"
          )

          raw.mkdir(
              parents=True,
              exist_ok=True
          )

          filename = (
              raw /
              "roller_click.wav"
          )

          rate = 44100
          duration = 0.035

          total = int(
              rate * duration
          )

          data = bytearray()


          for i in range(total):

              t = i / rate

              envelope = (
                  1.0 -
                  (i / total)
              )

              value = int(
                  14000 *
                  envelope *
                  math.sin(
                      2 *
                      math.pi *
                      1800 *
                      t
                  )
              )

              data.extend(
                  struct.pack(
                      "<h",
                      value
                  )
              )


          with wave.open(
              str(filename),
              "wb"
          ) as wav:

              wav.setnchannels(
                  1
              )

              wav.setsampwidth(
                  2
              )

              wav.setframerate(
                  rate
              )

              wav.writeframes(
                  bytes(data)
              )


          if not filename.exists():
              raise SystemExit(
                  "ERRO: som não foi criado."
              )

          print(
              "SOM DA ROLETA CRIADO"
          )


      # ============================================================
      # 8 - ROLETA AZUL / NEON
      # ============================================================

      - name: Instalar roleta azul neon
        shell: python
        run: |
          from pathlib import Path

          src = Path(
              "ControleHoras/"
              "app/src/main/java/com/didhuuu/"
              "controlehoras/MainActivity.kt"
          )

          code = src.read_text(
              encoding="utf-8"
          )


          # --------------------------------------------------------
          # REMOVER NUMBERPICKER ANTIGO
          # --------------------------------------------------------

          code = code.replace(
              "import android.widget.NumberPicker",
              ""
          )


          # --------------------------------------------------------
          # IMPORTS DA ROLETA
          # --------------------------------------------------------

          imports = [
              "import android.content.Context",
              "import android.graphics.Canvas",
              "import android.graphics.Color",
              "import android.graphics.Paint",
              "import android.graphics.Path",
              "import android.graphics.RectF",
              "import android.graphics.Shader",
              "import android.graphics.LinearGradient",
              "import android.media.AudioAttributes",
              "import android.media.SoundPool",
              "import android.view.MotionEvent"
          ]


          first_line = code.find(
              "\n"
          )

          extra_imports = ""

          for item in imports:

              if item not in code:

                  extra_imports += (
                      item + "\n"
                  )


          if extra_imports:

              code = (
                  code[:first_line + 1]
                  + extra_imports
                  + code[first_line + 1:]
              )


          # --------------------------------------------------------
          # NOMES DAS BATIDAS
          # --------------------------------------------------------

          if (
              "private val punchNames"
              not in code
          ):

              anchor = code.find(
                  "class MainActivity"
              )

              if anchor < 0:
                  raise SystemExit(
                      "MainActivity não encontrada."
                  )

              names = """
              private val punchNames=arrayOf<String>(
                  "Entrada",
                  "Saída",
                  "Retorno",
                  "Saída intervalo 2",
                  "Retorno intervalo 2",
                  "Saída"
              )

              """

              code = (
                  code[:anchor]
                  + names
                  + code[anchor:]
              )


          # --------------------------------------------------------
          # CLASSE DA ROLETA
          # --------------------------------------------------------

          wheel_class = r'''
          private class ControleHorasTimeWheelView(
              context:Context,
              private val maximum:Int,
              initial:Int
          ):View(context){

              private val density=
                  resources.displayMetrics.density

              private fun dp(
                  value:Float
              )=value*density

              private val paint=
                  Paint(
                      Paint.ANTI_ALIAS_FLAG
                  )

              private var current=
                  initial.coerceIn(
                      0,
                      maximum
                  )

              private var downY=0f

              private var moved=false

              private val sound=
                  SoundPool.Builder()
                      .setMaxStreams(2)
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(
                                  AudioAttributes.USAGE_ASSISTANCE_SONIFICATION
                              )
                              .setContentType(
                                  AudioAttributes.CONTENT_TYPE_SONIFICATION
                              )
                              .build()
                      )
                      .build()

              private var clickId=0

              var onValueChanged:
                  ((Int)->Unit)?=null

              init{

                  clickId=
                      sound.load(
                          context,
                          com.didhuuu.controlehoras.R.raw.roller_click,
                          1
                      )
              }

              fun value()=
                  current

              private fun click(){

                  if(clickId>0){

                      sound.play(
                          clickId,
                          0.35f,
                          0.35f,
                          1,
                          0,
                          1f
                      )
                  }
              }

              private fun change(
                  delta:Int
              ){

                  val next=
                      (
                          current+
                          delta
                      ).coerceIn(
                          0,
                          maximum
                      )

                  if(
                      next!=current
                  ){

                      current=next

                      click()

                      onValueChanged?.invoke(
                          current
                      )

                      invalidate()
                  }
              }

              override fun onDraw(
                  canvas:Canvas
              ){

                  super.onDraw(
                      canvas
                  )

                  val w=
                      width.toFloat()

                  val h=
                      height.toFloat()

                  val center=
                      h/2f


                  # METAL
                  paint.shader=
                      LinearGradient(
                          0f,
                          0f,
                          w,
                          0f,
                          intArrayOf(
                              0xFF111111.toInt(),
                              0xFFE5E5E5.toInt(),
                              0xFFFFFFFF.toInt(),
                              0xFF999999.toInt(),
                              0xFF111111.toInt()
                          ),
                          null,
                          Shader.TileMode.CLAMP
                      )


                  canvas.drawRoundRect(
                      RectF(
                          0f,
                          0f,
                          w,
                          h
                      ),
                      dp(18f),
                      dp(18f),
                      paint
                  )


                  paint.shader=null


                  # FAIXA AZUL
                  paint.color=
                      0xFF0879F9.toInt()

                  paint.setShadowLayer(
                      dp(9f),
                      0f,
                      0f,
                      0xDD0879F9.toInt()
                  )


                  canvas.drawRoundRect(
                      RectF(
                          dp(8f),
                          center-dp(30f),
                          w-dp(8f),
                          center+dp(30f)
                      ),
                      dp(10f),
                      dp(10f),
                      paint
                  )


                  paint.clearShadowLayer()


                  # VALOR CENTRAL
                  val main=
                      Paint(
                          Paint.ANTI_ALIAS_FLAG
                      )

                  main.color=
                      Color.WHITE

                  main.textAlign=
                      Paint.Align.CENTER

                  main.typeface=
                      android.graphics.Typeface.DEFAULT_BOLD

                  main.textSize=
                      dp(31f)


                  val base=
                      center-
                      (
                          main.ascent()+
                          main.descent()
                      )/2f


                  canvas.drawText(
                      current
                          .toString()
                          .padStart(
                              2,
                              '0'
                          ),
                      w/2f,
                      base,
                      main
                  )


                  # NÚMEROS LATERAIS
                  val side=
                      Paint(
                          Paint.ANTI_ALIAS_FLAG
                      )

                  side.color=
                      0xFF15191E.toInt()

                  side.textAlign=
                      Paint.Align.CENTER

                  side.typeface=
                      android.graphics.Typeface.DEFAULT_BOLD

                  side.textSize=
                      dp(23f)


                  val step=
                      dp(48f)


                  for(offset in -2..2){

                      if(offset==0)
                          continue

                      val number=
                          current+offset

                      if(
                          number<0 ||
                          number>maximum
                      )
                          continue

                      side.alpha=
                          if(
                              kotlin.math.abs(
                                  offset
                              )==1
                          )
                              255
                          else
                              110

                      canvas.drawText(
                          number
                              .toString()
                              .padStart(
                                  2,
                                  '0'
                              ),
                          w/2f,
                          base+
                          offset*step,
                          side
                      )
                  }


                  # SETAS
                  val arrow=
                      Paint(
                          Paint.ANTI_ALIAS_FLAG
                      )

                  arrow.color=
                      0xFF118CFF.toInt()


                  val left=
                      Path()

                  left.moveTo(
                      dp(6f),
                      center
                  )

                  left.lineTo(
                      dp(24f),
                      center-dp(12f)
                  )

                  left.lineTo(
                      dp(24f),
                      center+dp(12f)
                  )

                  left.close()

                  canvas.drawPath(
                      left,
                      arrow
                  )


                  val right=
                      Path()

                  right.moveTo(
                      w-dp(6f),
                      center
                  )

                  right.lineTo(
                      w-dp(24f),
                      center-dp(12f)
                  )

                  right.lineTo(
                      w-dp(24f),
                      center+dp(12f)
                  )

                  right.close()

                  canvas.drawPath(
                      right,
                      arrow
                  )
              }


              override fun onTouchEvent(
                  event:MotionEvent
              ):Boolean{

                  when(
                      event.actionMasked
                  ){

                      MotionEvent.ACTION_DOWN->{

                          downY=
                              event.y

                          moved=false

                          return true
                      }


                      MotionEvent.ACTION_MOVE->{

                          val distance=
                              downY-
                              event.y

                          if(
                              kotlin.math.abs(
                                  distance
                              )>=
                              dp(24f)
                          ){

                              val steps=
                                  (
                                      distance/
                                      dp(24f)
                                  ).toInt()

                              if(steps!=0){

                                  val direction=
                                      if(
                                          steps>0
                                      )
                                          1
                                      else
                                          -1

                                  repeat(
                                      kotlin.math.abs(
                                          steps
                                      )
                                  ){

                                      change(
                                          direction
                                      )
                                  }

                                  downY=
                                      event.y

                                  moved=true
                              }
                          }

                          return true
                      }


                      MotionEvent.ACTION_UP->{

                          if(!moved){

                              if(
                                  event.x<
                                  width/2f
                              ){

                                  change(-1)

                              }else{

                                  change(1)
                              }
                          }

                          performClick()

                          return true
                      }


                      MotionEvent.ACTION_CANCEL->{

                          return true
                      }
                  }

                  return true
              }


              override fun performClick():
                  Boolean{

                  super.performClick()

                  return true
              }


              override fun onDetachedFromWindow(){

                  sound.release()

                  super.onDetachedFromWindow()
              }
          }
          '''


          if(
              "class ControleHorasTimeWheelView"
              not in code
          ):

              anchor=
                  code.find(
                      "class MainActivity"
                  )

              if anchor<0:
                  raise SystemExit(
                      "MainActivity não encontrada."
                  )

              code=(
                  code[:anchor]
                  +wheel_class
                  +"\n"
                  +code[anchor:]
              )


          # --------------------------------------------------------
          # SUBSTITUIÇÃO SEGURA DE MÉTODOS
          # --------------------------------------------------------

          def replace_method(
              source,
              signature,
              replacement
          ):

              start=
                  source.find(
                      signature
                  )

              if start<0:
                  return source

              opening=
                  source.find(
                      "{",
                      start
                  )

              if opening<0:
                  raise SystemExit(
                      "Abertura não encontrada: "
                      +signature
                  )

              depth=0

              i=opening

              while i<len(source):

                  if source[i]=="{":

                      depth+=1

                  elif source[i]=="}":

                      depth-=1

                      if depth==0:

                          return (
                              source[:start]
                              +replacement
                              +source[i+1:]
                          )

                  i+=1

              raise SystemExit(
                  "Fechamento não encontrado: "
                  +signature
              )


          # --------------------------------------------------------
          # DIÁLOGO
          # --------------------------------------------------------

          dialog=r'''
              private fun showControleHorasWheelDialog(
