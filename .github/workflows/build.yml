    private fun sharePdf(
        employee: Employee,
        list: List<PunchDay>
    ) {

        try {

            val ym =
                SimpleDateFormat(
                    "yyyyMM",
                    Locale.US
                ).format(Date())

            val safeName =
                employee.name.replace(
                    Regex("[^A-Za-z0-9_-]"),
                    "_"
                )

            val file =
                File(
                    cacheDir,
                    "relatorio_${safeName}_$ym.pdf"
                )

            val worked =
                list.sumOf {
                    calculate(it).worked
                }

            val e60 =
                list.sumOf {
                    calculate(it).extra60
                }

            val e100 =
                list.sumOf {
                    calculate(it).extra100
                }

            val normal =
                list.sumOf {

                    val c =
                        calculate(it)

                    minOf(
                        c.worked,
                        c.expected
                    )
                }

            val month =
                SimpleDateFormat(
                    "yyyy-MM",
                    Locale.US
                ).format(Date())

            val scheduled =
                scheduledDays(
                    employee.id,
                    month
                )

            val workedDays =
                list.count {

                    val c =
                        calculate(it)

                    c.worked > 0 &&
                    c.expected > 0
                }

            val absence =
                max(
                    0,
                    scheduled - workedDays
                )

            val hourly =
                employee.salary / 220.0

            val v60 =
                e60 /
                    60.0 *
                    hourly *
                    1.60

            val v100 =
                e100 /
                    60.0 *
                    hourly *
                    2.00

            val extra =
                v60 + v100

            val rest =
                max(
                    0,
                    calendarDaysInMonth(month) -
                    scheduled
                )

            val dsr =
                if (scheduled > 0)
                    extra /
                        scheduled *
                        rest
                else
                    0.0

            val total =
                extra + dsr

            val document =
                PdfDocument()

            var pageNumber = 1

            var pdfPage =
                document.startPage(
                    PdfDocument.PageInfo
                        .Builder(
                            595,
                            842,
                            pageNumber
                        )
                        .create()
                )

            var canvas =
                pdfPage.canvas

            var y = 42f

            val paint =
                Paint(
                    Paint.ANTI_ALIAS_FLAG
                ).apply {
                    color = Color.BLACK
                    textSize = 13f
                }

            fun line(value: String) {

                if (y > 800f) {

                    document.finishPage(
                        pdfPage
                    )

                    pageNumber++

                    pdfPage =
                        document.startPage(
                            PdfDocument.PageInfo
                                .Builder(
                                    595,
                                    842,
                                    pageNumber
                                )
                                .create()
                        )

                    canvas =
                        pdfPage.canvas

                    y = 42f
                }

                canvas.drawText(
                    value.take(90),
                    35f,
                    y,
                    paint
                )

                y += 22f
            }

            paint.textSize = 19f
            paint.typeface =
                Typeface.DEFAULT_BOLD

            line(
                "CONTROLE DE HORAS - RELATORIO MENSAL"
            )

            paint.textSize = 13f
            paint.typeface =
                Typeface.DEFAULT

            line(
                "Funcionario: ${employee.name}"
            )

            line(
                "Salario: ${money.format(employee.salary)}"
            )

            line(
                "Valor hora normal: ${money.format(hourly)}"
            )

            line("")

            line(
                "Horas normais: ${formatMin(normal)}"
            )

            line(
                "HE 60%: ${formatMin(e60)} = ${money.format(v60)}"
            )

            line(
                "HE 100%: ${formatMin(e100)} = ${money.format(v100)}"
            )

            line(
                "Total trabalhado: ${formatMin(worked)}"
            )

            line(
                "Dias trabalhados: $workedDays"
            )

            line(
                "Dias de ausencia: $absence"
            )

            line(
                "DSR sobre horas extras: ${money.format(dsr)}"
            )

            line(
                "TOTAL FINAL: ${money.format(total)}"
            )

            line("")
            line("Detalhamento:")

            list.sortedBy {
                it.date
            }.forEach { record ->

                val c =
                    calculate(record)

                line(
                    "${displayDate(record.date)} | " +
                    "${record.punches.joinToString(" ")} | " +
                    "${formatMin(c.worked)}"
                )
            }

            document.finishPage(
                pdfPage
            )

            file.outputStream().use {
                document.writeTo(it)
            }

            document.close()

            val uri =
                FileProvider.getUriForFile(
                    this,
                    "$packageName.fileprovider",
                    file
                )

            val send =
                Intent(
                    Intent.ACTION_SEND
                ).apply {

                    type = "application/pdf"

                    putExtra(
                        Intent.EXTRA_STREAM,
                        uri
                    )

                    addFlags(
                        Intent.FLAG_GRANT_READ_URI_PERMISSION
                    )
                }

            startActivity(
                Intent.createChooser(
                    send,
                    "Enviar relatório PDF"
                )
            )

        } catch (e: Exception) {

            Toast.makeText(
                this,
                "Não foi possível gerar o PDF: ${e.message}",
                Toast.LENGTH_LONG
            ).show()
        }
    }

    private fun calculate(
        r: PunchDay
    ): Calc {

        var worked = 0

        /*
         * Jornada normal:
         *
         * 4 registros:
         * 1 -> 2
         * 3 -> 6
         *
         * 6 registros:
         * 1 -> 2
         * 3 -> 4
         * 5 -> 6
         */

        worked += minutesBetween(
            r.punches[0],
            r.punches[1]
        )

        val hasSecondInterval =
            r.punches[3].isNotBlank() ||
            r.punches[4].isNotBlank()

        if (hasSecondInterval) {

            worked += minutesBetween(
                r.punches[2],
                r.punches[3]
            )

            worked += minutesBetween(
                r.punches[4],
                r.punches[5]
            )

        } else {

            worked += minutesBetween(
                r.punches[2],
                r.punches[5]
            )
        }

        val date =
            parseIso(r.date)

        /*
         * Sábado/Domingo fora da escala:
         * todo o tempo trabalhado vira HE100.
         */
        if (!modeForDay(date)) {

            return Calc(
                worked = worked,
                expected = 0,
                extra60 = 0,
                extra100 = worked
            )
        }

        val expected =
            durationMinutes(
                weeklyTarget
            ) /
            if (
                modeForDate(date) == "MS"
            ) 6
            else 5

        val extra =
            max(
                0,
                worked - expected
            )

        return Calc(
            worked = worked,
            expected = expected,
            extra60 = extra,
            extra100 = 0
        )
    }

    private fun minutesBetween(
        a: String,
        b: String
    ): Int {

        val x =
            normalizeTime(a)

        val y =
            normalizeTime(b)

        if (
            x.isBlank() ||
            y.isBlank()
        ) {
            return 0
        }

        return try {

            val xa =
                x.split(":")

            val ya =
                y.split(":")

            max(
                0,
                (
                    ya[0].toInt() * 60 +
                    ya[1].toInt()
                ) -
                (
                    xa[0].toInt() * 60 +
                    xa[1].toInt()
                )
            )

        } catch (_: Exception) {

            0
        }
    }

    private fun formatMin(
        minutes: Int
    ): String {

        val safe =
            max(
                0,
                minutes
            )

        return "%02d:%02d".format(
            Locale.US,
            safe / 60,
            safe % 60
        )
    }

    private fun durationMinutes(
        value: String
    ): Int {

        val normalized =
            normalizeDuration(value)

        if (normalized.isBlank()) {
            return 0
        }

        return try {

            val p =
                normalized.split(":")

            p[0].toInt() * 60 +
            p[1].toInt()

        } catch (_: Exception) {

            0
        }
    }

    private fun normalizeDuration(
        value: String
    ): String {

        val digits =
            value.filter {
                it.isDigit()
            }

        if (digits.length == 4) {

            val h =
                digits.substring(
                    0,
                    2
                ).toIntOrNull()

            val m =
                digits.substring(
                    2,
                    4
                ).toIntOrNull()

            if (
                h != null &&
                m != null &&
                m in 0..59
            ) {
                return "%02d:%02d".format(
                    Locale.US,
                    h,
                    m
                )
            }
        }

        val p =
            value.split(":")

        if (p.size == 2) {

            val h =
                p[0].toIntOrNull()

            val m =
                p[1].toIntOrNull()

            if (
                h != null &&
                m != null &&
                h >= 0 &&
                m in 0..59
            ) {
                return "%02d:%02d".format(
                    Locale.US,
                    h,
                    m
                )
            }
        }

        return ""
    }

    private fun normalizeTime(
        value: String
    ): String {

        val digits =
            value.filter {
                it.isDigit()
            }

        if (digits.isBlank()) {
            return ""
        }

        if (digits.length == 4) {

            val hour =
                digits.substring(
                    0,
                    2
                ).toIntOrNull()

            val minute =
                digits.substring(
                    2,
                    4
                ).toIntOrNull()

            if (
                hour != null &&
                minute != null &&
                hour in 0..23 &&
                minute in 0..59
            ) {

                return "%02d:%02d".format(
                    Locale.US,
                    hour,
                    minute
                )
            }

            return ""
        }

        val parts =
            value.split(":")

        if (parts.size == 2) {

            val hour =
                parts[0].toIntOrNull()

            val minute =
                parts[1].toIntOrNull()

            if (
                hour != null &&
                minute != null &&
                hour in 0..23 &&
                minute in 0..59
            ) {

                return "%02d:%02d".format(
                    Locale.US,
                    hour,
                    minute
                )
            }
        }

        return ""
    }

    private fun safeTime(
        value: String
    ): String {

        if (value.isBlank()) {
            return ""
        }

        return normalizeTime(value)
    }

    private fun today(): String =
        iso.format(Date())

    private fun nowTime(): String =
        SimpleDateFormat(
            "HH:mm",
            Locale.US
        ).format(Date())

    private fun displayDate(
        value: String
    ): String {

        return try {
            df.format(
                parseIso(value)
            )
        } catch (_: Exception) {
            value
        }
    }

    private fun parseIso(
        value: String
    ): Date {

        return try {
            iso.parse(value) ?: Date()
        } catch (_: Exception) {
            Date()
        }
    }

    private fun weekKey(
        date: Date
    ): String {

        val calendar =
            Calendar.getInstance()

        calendar.time = date

        calendar.firstDayOfWeek =
            Calendar.MONDAY

        while (
            calendar.get(Calendar.DAY_OF_WEEK) !=
            Calendar.MONDAY
        ) {
            calendar.add(
                Calendar.DAY_OF_MONTH,
                -1
            )
        }

        calendar.set(
            Calendar.HOUR_OF_DAY,
            0
        )

        calendar.set(
            Calendar.MINUTE,
            0
        )

        calendar.set(
            Calendar.SECOND,
            0
        )

        calendar.set(
            Calendar.MILLISECOND,
            0
        )

        return iso.format(
            calendar.time
        )
    }

    private fun modeForDate(
        date: Date
    ): String {

        return weekModes[
            weekKey(date)
        ] ?: "MF"
    }

    private fun modeForDay(
        date: Date
    ): Boolean {

        val calendar =
            Calendar.getInstance()

        calendar.time = date

        return if (
            modeForDate(date) == "MS"
        ) {

            calendar.get(
                Calendar.DAY_OF_WEEK
            ) != Calendar.SUNDAY

        } else {

            calendar.get(
                Calendar.DAY_OF_WEEK
            ) != Calendar.SATURDAY &&
            calendar.get(
                Calendar.DAY_OF_WEEK
            ) != Calendar.SUNDAY
        }
    }

    private fun weekLabel(
        date: Date
    ): String {

        val calendar =
            Calendar.getInstance()

        calendar.time = date

        while (
            calendar.get(Calendar.DAY_OF_WEEK) !=
            Calendar.MONDAY
        ) {
            calendar.add(
                Calendar.DAY_OF_MONTH,
                -1
            )
        }

        val start =
            df.format(
                calendar.time
            )

        calendar.add(
            Calendar.DAY_OF_MONTH,
            6
        )

        val end =
            df.format(
                calendar.time
            )

        return "$start até $end"
    }

    private fun scheduledDays(
        empId: Long,
        ym: String
    ): Int {

        val parts =
            ym.split("-")

        if (parts.size != 2) {
            return 0
        }

        val calendar =
            Calendar.getInstance()

        calendar.set(
            parts[0].toInt(),
            parts[1].toInt() - 1,
            1
        )

        val last =
            calendar.getActualMaximum(
                Calendar.DAY_OF_MONTH
            )

        var total = 0

        for (day in 1..last) {

            calendar.set(
                Calendar.DAY_OF_MONTH,
                day
            )

            if (
                modeForDay(
                    calendar.time
                )
            ) {
                total++
            }
        }

        return total
    }

    private fun calendarDaysInMonth(
        ym: String
    ): Int {

        val parts =
            ym.split("-")

        if (parts.size != 2) {
            return 0
        }

        val calendar =
            Calendar.getInstance()

        calendar.set(
            parts[0].toInt(),
            parts[1].toInt() - 1,
            1
        )

        return calendar.getActualMaximum(
            Calendar.DAY_OF_MONTH
        )
    }

    private fun metricCard(
        title: String,
        value: String,
        color: Int
    ): View {

        val layout =
            LinearLayout(this).apply {

                orientation =
                    LinearLayout.VERTICAL

                gravity =
                    Gravity.CENTER_VERTICAL

                setPadding(
                    dp(12),
                    dp(7),
                    dp(8),
                    dp(7)
                )

                background(
                    if (color == green)
                        0xFFE7F8EE.toInt()
                    else
                        0xFFEAF2FF.toInt(),
                    dp(14),
                    dp(14),
                    dp(14),
                    dp(14)
                )
            }

        layout.addView(
            TextView(this).apply {

                text = title
                textSize = 12f
                setTextColor(darkBlue)
            }
        )

        layout.addView(
            TextView(this).apply {

                text = value
                textSize = 19f
                setTypeface(
                    null,
                    Typeface.BOLD
                )

                setTextColor(
                    if (color == green)
                        Color.rgb(0, 120, 55)
                    else
                        darkBlue
                )
            }
        )

        return layout
    }

    private fun infoCard(
        value: String
    ): View {

        val layout =
            card()

        layout.addView(
            TextView(this).apply {

                text = value
                textSize = 14f

                setTextColor(
                    textColor
                )

                setPadding(
                    dp(14),
                    dp(14),
                    dp(14),
                    dp(14)
                )
            }
        )

        return layout
    }

    private fun card():
        LinearLayout {

        return LinearLayout(this).apply {

            orientation =
                LinearLayout.VERTICAL

            background(
                Color.WHITE,
                dp(14),
                dp(14),
                dp(14),
                dp(14)
            )

            elevation =
                dp(1).toFloat()
        }
    }

    private fun label(
        value: String
    ): TextView {

        return TextView(this).apply {

            text = value
            textSize = 13f

            setTextColor(
                muted
            )

            setTypeface(
                null,
                Typeface.BOLD
            )
        }
    }

    private fun marginParams(
        left: Int,
        top: Int,
        right: Int,
        bottom: Int
    ): LinearLayout.LayoutParams {

        return LinearLayout.LayoutParams(
            -1,
            -2
        ).apply {

            setMargins(
                dp(left),
                dp(top),
                dp(right),
                dp(bottom)
            )
        }
    }

    private fun dp(
        value: Int
    ): Int {

        return (
            value *
            resources.displayMetrics.density
        )
            .toInt()
            .coerceAtLeast(1)
    }

    private fun View.background(
        color: Int,
        tl: Int,
        tr: Int,
        br: Int,
        bl: Int
    ) {

        background =
            GradientDrawable().apply {

                setColor(color)

                cornerRadii =
                    floatArrayOf(
                        tl.toFloat(),
                        tl.toFloat(),
                        tr.toFloat(),
                        tr.toFloat(),
                        br.toFloat(),
                        br.toFloat(),
                        bl.toFloat(),
                        bl.toFloat()
                    )
            }
    }
