name: Gerar APK - ControleHoras

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto original
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

          wc -l ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

      - name: Corrigir aplicativo original
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          file = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          s = file.read_text(encoding="utf-8")

          def must_replace(old, new, name):
              global s

              count = s.count(old)

              if count != 1:
                  raise SystemExit(
                      f"ERRO: {name}: encontrado {count} vez(es)"
                  )

              s = s.replace(old, new, 1)

          # =========================================================
          # CORREÇÕES DE COMPILAÇÃO
          # =========================================================

          s = s.replace(
              "        }, 0, 0, 0, dp(10))",
              "        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(10) })"
          )

          s = s.replace(
              "        }, 0, 0, 0, dp(12))",
              "        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(12) })"
          )

          s = s.replace(
              "setTextColor(text)",
              "setTextColor(this@MainActivity.text)"
          )

          # =========================================================
          # SALÁRIO
          # =========================================================

          must_replace(
              'setText(if(existing!=null)existing.salary.toString():"")',
              'setText(if (existing != null) existing.salary.toString() else "")',
              "salário"
          )

          # =========================================================
          # HISTÓRICO MENSAL
          # =========================================================

          must_replace(
              'it.date.endsWith(SimpleDateFormat("MM-yyyy", Locale.US).format(Date()))',
              'it.date.startsWith(SimpleDateFormat("yyyy-MM", Locale.US).format(Date()))',
              "filtro mensal"
          )

          # =========================================================
          # FORMATO DOS TOTAIS
          # SEMPRE 00:00
          # =========================================================

          format_pattern = re.compile(
              r'(?m)^\s*private fun formatMin\(m:Int\):String=.*$'
          )

          matches = format_pattern.findall(s)

          if len(matches) != 1:
              raise SystemExit(
                  f"ERRO: formatMin encontrado {len(matches)} vezes"
              )

          s = format_pattern.sub(
              '    private fun formatMin(m:Int):String="%02d:%02d".format(Locale.US,max(0,m)/60,max(0,m)%60)',
              s,
              count=1
          )

          # =========================================================
          # FUNÇÃO PARA NORMALIZAR HORÁRIO
          # =========================================================

          marker = "    private fun getRecord(empId:Long,date:String):PunchDay{"

          if marker not in s:
              raise SystemExit(
                  "ERRO: função getRecord não encontrada"
              )

          helper = """
              private fun normalizeTime(value:String):String{
                  val digits=value.filter{it.isDigit()}.take(4)

                  if(digits.isEmpty())return ""

                  val hour:Int
                  val minute:Int

                  when(digits.length){
                      1->{
                          hour=digits.toInt()
                          minute=0
                      }

                      2->{
                          hour=digits.toInt()
                          minute=0
                      }

                      3->{
                          hour=digits.substring(0,1).toInt()
                          minute=digits.substring(1,3).toInt()
                      }

                      else->{
                          hour=digits.substring(0,2).toInt()
                          minute=digits.substring(2,4).toInt()
                      }
                  }

                  if(hour !in 0..23)return ""
                  if(minute !in 0..59)return ""

                  return "%02d:%02d".format(
                      Locale.US,
                      hour,
                      minute
                  )
              }

              private fun timeEdit(
                  initial:String="",
                  hintText:String="00:00"
              ):EditText{

                  val e=EditText(this).apply{

                      hint=hintText

                      setText(
                          normalizeTime(initial)
                      )

                      inputType=2

                      setSingleLine()

                      if(text.isNotEmpty()){
                          setSelection(text.length)
                      }
                  }

                  e.addTextChangedListener(
                      object:android.text.TextWatcher{

                          private var changing=false

                          override fun beforeTextChanged(
                              s:CharSequence?,
                              start:Int,
                              count:Int,
                              after:Int
                          ){}

                          override fun onTextChanged(
                              s:CharSequence?,
                              start:Int,
                              before:Int,
                              count:Int
                          ){}

                          override fun afterTextChanged(
                              editable:android.text.Editable?
                          ){

                              if(changing)return

                              val digits=
                                  editable
                                      ?.toString()
                                      ?.filter{it.isDigit()}
                                      ?: ""

                              if(digits.isEmpty())return

                              val formatted=when{

                                  digits.length<=2->{
                                      digits
                                  }

                                  else->{
                                      digits.substring(0,2)+":"+
                                      digits.substring(
                                          2,
                                          minOf(4,digits.length)
                                      )
                                  }
                              }

                              if(
                                  formatted!=editable.toString()
                              ){

                                  changing=true

                                  e.setText(formatted)

                                  e.setSelection(
                                      e.text.length
                                  )

                                  changing=false
                              }
                          }
                      }
                  )

                  return e
              }

          """

          s = s.replace(
              marker,
              helper + marker,
              1
          )

          # =========================================================
          # CÁLCULO DAS HORAS
          # =========================================================

          start = s.find("    private fun minutesBetween(")

          if start == -1:
              raise SystemExit(
                  "ERRO: minutesBetween não encontrada"
              )

          end = s.find(
              "\n    private fun ",
              start + 10
          )

          if end == -1:
              raise SystemExit(
                  "ERRO: fim de minutesBetween não encontrado"
              )

          new_minutes = """
    private fun minutesBetween(a:String,b:String):Int{

        val x=normalizeTime(a)
        val y=normalizeTime(b)

        if(x.isBlank()||y.isBlank())return 0

        return try{

            val xa=x.split(":")
            val ya=y.split(":")

            max(
                0,
                (ya[0].toInt()*60+ya[1].toInt()) -
                (xa[0].toInt()*60+xa[1].toInt())
            )

        }catch(_:Exception){
            0
        }
    }
"""

          s = s[:start] + new_minutes + s[end:]

          # =========================================================
          # ADIÇÃO MANUAL
          # =========================================================

          must_replace(
              'val e=EditText(this).apply{setText(r.punches[index]);hint="HH:mm";inputType=2;setSingleLine()}',
              'val e=timeEdit(r.punches[index],punchNames[index])',
              "campo de adição manual"
          )

          must_replace(
              'r.punches[index]=e.text.toString();saveData();showPunch()',
              'r.punches[index]=normalizeTime(e.text.toString());saveData();showPunch()',
              "salvamento da adição manual"
          )

          # =========================================================
          # EDIÇÃO DOS REGISTROS
          # =========================================================

          must_replace(
              'val fields=r.punches.mapIndexed{i,v->EditText(this).apply{hint=punchNames[i];setText(v);inputType=2;setSingleLine();}}',
              'val fields=r.punches.mapIndexed{i,v->timeEdit(v,punchNames[i])}',
              "campos de edição"
          )

          must_replace(
              'r.punches[i]=e.text.toString()};saveData();showHistory()',
              'r.punches[i]=normalizeTime(e.text.toString())};saveData();showHistory()',
              "salvamento da edição"
          )

          # =========================================================
          # ESCALA
          # =========================================================

          must_replace(
              'val ed=EditText(this).apply{setText(p.second);hint="00:00";gravity=Gravity.CENTER;inputType=2;setSingleLine()}',
              'val ed=timeEdit(p.second,"00:00").apply{gravity=Gravity.CENTER}',
              "campo da escala"
          )

          must_replace(
              '0->s.e=ed.text.toString();1->s.x1=ed.text.toString();2->s.r1=ed.text.toString();3->s.x2=ed.text.toString()',
              '0->s.e=normalizeTime(ed.text.toString());1->s.x1=normalizeTime(ed.text.toString());2->s.r1=normalizeTime(ed.text.toString());3->s.x2=normalizeTime(ed.text.toString())',
              "salvamento da escala"
          )

          file.write_text(
              s,
              encoding="utf-8"
          )

          print("========================================")
          print(" APLICATIVO ORIGINAL PRESERVADO")
          print("========================================")
          print("Adição manual: CORRIGIDA")
          print("Dois pontos: AUTOMÁTICOS")
          print("Somatório: CORRIGIDO")
          print("Formato: 00:00")
          print("Histórico mensal: CORRIGIDO")
          print("Escala: CORRIGIDA")
          print("========================================")
          print("LINHAS:", len(s.splitlines()))
          print("========================================")

          PY

      - name: Verificar código
        shell: bash
        run: |
          set -e

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          test -s "$FILE"

          grep -q "private fun normalizeTime" "$FILE"
          grep -q "private fun timeEdit" "$FILE"
          grep -q "private fun minutesBetween" "$FILE"
          grep -q 'private fun formatMin(m:Int):String="%02d:%02d"' "$FILE"

          echo "========================================"
          echo " CÓDIGO KOTLIN VALIDADO"
          echo "========================================"

          wc -l "$FILE"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"

          unzip -q \
            "gradle-8.11.1-bin.zip"

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          export PATH="$PWD/gradle-8.11.1/bin:$PATH"

          gradle --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo " GERANDO APK"
          echo "========================================"

          gradle assembleDebug --no-daemon --stacktrace

          test -s \
            app/build/outputs/apk/debug/app-debug.apk

          echo "========================================"
          echo " APK GERADO COM SUCESSO"
          echo "========================================"

          ls -lh \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" > /dev/null

          echo "========================================"
          echo " APK ÍNTEGRO E VALIDADO"
          echo "========================================"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Finalizar
        shell: bash
        run: |
          echo "========================================"
          echo " BUILD FINALIZADO"
          echo "========================================"
