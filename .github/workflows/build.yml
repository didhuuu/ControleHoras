name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXTRAINDO PROJETO"
          echo "========================================"

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      # ============================================================
      # BASE 70
      # ============================================================

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          print("========================================")
          print("APLICANDO BASE 70")
          print("========================================")

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(url, timeout=60).read().decode("utf-8")

          def extract_step(name, next_name):

              start_marker = f"      - name: {name}"
              end_marker = f"      - name: {next_name}"

              if start_marker not in workflow:
                  raise RuntimeError(
                      f"Etapa não encontrada: {name}"
                  )

              start = workflow.index(start_marker)

              if end_marker not in workflow[start:]:
                  raise RuntimeError(
                      f"Próxima etapa não encontrada: {next_name}"
                  )

              end = workflow.index(
                  end_marker,
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              if marker not in block:
                  raise RuntimeError(
                      f"Bloco run não encontrado: {name}"
                  )

              pos = block.index(marker) + len(marker)

              lines = block[pos:].splitlines()

              return "\n".join(
                  line[10:]
                  if line.startswith("          ")
                  else line
                  for line in lines
              ).rstrip() + "\n"

          scripts = [
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for i, script in enumerate(scripts):

              p = (
                  Path(tempfile.gettempdir())
                  / f"base70_{i}.py"
              )

              p.write_text(
                  script,
                  encoding="utf-8"
              )

              compile(
                  script,
                  f"base70_{i}.py",
                  "exec"
              )

              subprocess.run(
                  ["python", str(p)],
                  check=True
              )

          print("========================================")
          print("BASE 70 APLICADA")
          print("ESCALA ORIGINAL PRESERVADA")
          print("========================================")

      # ============================================================
      # VERSÃO 80
      # ============================================================

      - name: Aplicar funcionalidades da versão 80
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          print("========================================")
          print("APLICANDO VERSÃO 80")
          print("========================================")

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=60
          ).read().decode("utf-8")

          start_marker = (
              "      - name: "
              "Aplicar correções finais da Base 70, "
              "edição por rolagem e ícone"
          )

          end_marker = (
              "      - name: Validar código e ícone"
          )

          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start)

          block = workflow[start:end]

          marker = "        run: |\n"

          pos = block.index(marker) + len(marker)

          lines = block[pos:].splitlines()

          script = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in lines
          ).rstrip() + "\n"

          p = (
              Path(tempfile.gettempdir())
              / "funcionalidades_v80.py"
          )

          p.write_text(
              script,
              encoding="utf-8"
          )

          compile(
              script,
              "funcionalidades_v80.py",
              "exec"
          )

          subprocess.run(
              ["python", str(p)],
              check=True
          )

          print("VERSÃO 80 APLICADA")

      # ============================================================
      # CORREÇÕES ESTRUTURAIS
      # ============================================================

      - name: Corrigir estrutura Kotlin
        shell: python
        run: |
          from pathlib import Path
          import re

          print("========================================")
          print("CORRIGINDO ESTRUTURA KOTLIN")
          print("========================================")

          src = Path(
              "ControleHoras/app/src/main/java/"
              "com/didhuuu/controlehoras/MainActivity.kt"
          )

          if not src.exists():
              raise SystemExit(
                  "ERRO: MainActivity.kt não encontrado."
              )

          code = src.read_text(
              encoding="utf-8"
          )

          # ----------------------------------------------------------
          # IMPORT View
          # ----------------------------------------------------------

          if not re.search(
              r"(?m)^import android\.view\.View\s*$",
              code
          ):

              lines = code.splitlines()

              package_index = 0

              for i, line in enumerate(lines):

                  if line.startswith("package "):
                      package_index = i
                      break

              lines.insert(
                  package_index + 1,
                  "import android.view.View"
              )

              code = "\n".join(lines) + "\n"

          # ----------------------------------------------------------
          # MAIN ACTIVITY
          # ----------------------------------------------------------

          main_match = re.search(
              r"class\s+MainActivity[^{]*\{",
              code
          )

          if not main_match:
              raise SystemExit(
                  "ERRO: MainActivity não encontrada."
              )

          class_end = main_match.end()

          # ----------------------------------------------------------
          # punchNames
          #
          # Construído com lista de strings.
          # Não existe string multilinha aqui.
          # ----------------------------------------------------------

          if not re.search(
              r"(?m)^\s*(?:private\s+)?val\s+punchNames\s*=",
              code
          ):

              punch_lines = [
                  "",
                  "    private val punchNames = arrayOf(",
                  '        "Entrada",',
                  '        "Saída",',
                  '        "Retorno",',
                  '        "Saída intervalo 2",',
                  '        "Retorno intervalo 2",',
                  '        "Saída"',
                  "    )",
                  ""
              ]

              punch_block = "\n".join(
                  punch_lines
              )

              code = (
                  code[:class_end]
                  + punch_block
                  + code[class_end:]
              )

          # ----------------------------------------------------------
          # controleHorasPunchPage
          # ----------------------------------------------------------

          if not re.search(
              r"(?m)^\s*(?:private\s+)?var\s+controleHorasPunchPage\s*:",
              code
          ):

              main_match = re.search(
                  r"class\s+MainActivity[^{]*\{",
                  code
              )

              class_end = main_match.end()

              page_lines = [
                  "",
                  "    private var controleHorasPunchPage: View? = null",
                  ""
              ]

              page_block = "\n".join(
                  page_lines
              )

              code = (
                  code[:class_end]
                  + page_block
                  + code[class_end:]
              )

          # ----------------------------------------------------------
          # CORRIGIR card() DO showPunch
          # ----------------------------------------------------------

          pattern = re.compile(
              r"box\.addView\s*"
              r"card\(\.apply\{"
          )

          match = pattern.search(code)

          if match:

              replacement = (
                  "box.addView(\n"
                  "                      "
                  "(card() as View).apply{"
              )

              code = (
                  code[:match.start()]
                  + replacement
                  + code[match.end():]
              )

              print("card() convertido explicitamente para View")

          else:

              print(
                  "Nenhum card() problemático encontrado "
                  "ou correção já aplicada."
              )

          # ----------------------------------------------------------
          # SALVAR
          # ----------------------------------------------------------

          src.write_text(
              code,
              encoding="utf-8"
          )

          print("punchNames: OK")
          print("controleHorasPunchPage: OK")
          print("ESCALA: PRESERVADA")
          print("========================================")

      # ============================================================
      # SOM MECÂNICO
      # ============================================================

      - name: Criar som mecânico da roleta
        shell: python
        run: |
          from pathlib import Path
          import wave
          import math
          import struct

          raw = Path(
              "ControleHoras/app/src/main/res/raw"
          )

          raw.mkdir(
              parents=True,
              exist_ok=True
          )

          filename = raw / "roller_click.wav"

          rate = 44100
          duration = 0.035
          frames = []

          for i in range(
              int(rate * duration)
          ):

              t = i / rate

              a = (
                  0.45
                  * math.exp(-85 * t)
                  * math.sin(
                      2 * math.pi * 1850 * t
                  )
              )

              b = (
                  0.22
                  * math.exp(-130 * t)
                  * math.sin(
                      2 * math.pi * 3200 * t
                  )
              )

              value = max(
                  -1.0,
                  min(1.0, a + b)
              )

              frames.append(
                  struct.pack(
                      "<h",
                      int(value * 32767)
                  )
              )

          with wave.open(
              str(filename),
              "wb"
          ) as wav:

              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)

              wav.writeframes(
                  b"".join(frames)
              )

          if not filename.exists():
              raise SystemExit(
                  "ERRO: som não criado."
              )

          if filename.stat().st_size == 0:
              raise SystemExit(
                  "ERRO: som vazio."
              )

          print("SOM DA ROLETA CRIADO")

      # ============================================================
      # ROLETA
      # ============================================================

      - name: Instalar roleta personalizada
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import re
          import textwrap

          print("========================================")
          print("INSTALANDO ROLETA PERSONALIZADA")
          print("========================================")

          src = Path(
              "ControleHoras/app/src/main/java/"
              "com/didhuuu/controlehoras/MainActivity.kt"
          )

          code = src.read_text(
              encoding="utf-8"
          )

          old_url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "39fc6bfb41ebc7b01d6c435a85b5228e735f3f2b/"
              ".github/workflows/build.yml"
          )

          legacy = urlopen(
              old_url,
              timeout=60
          ).read().decode("utf-8")

          def extract_raw(name):

              pattern = (
                  re.escape(name)
                  + r"\s*=\s*r'''([\s\S]*?)\n\s*'''"
              )

              match = re.search(
                  pattern,
                  legacy
              )

              if not match:
                  raise SystemExit(
                      "ERRO: bloco não encontrado: "
                      + name
                  )

              return textwrap.dedent(
                  match.group(1)
              ).strip("\n")

          wheel_class = extract_raw(
              "wheel_class"
          )

          wheel_dialog = extract_raw(
              "wheel_dialog"
          )

          edit_method = extract_raw(
              "edit_method"
          )

          manual_method = extract_raw(
              "manual_method"
          )

          register_method = extract_raw(
              "register_method"
          )

          # ----------------------------------------------------------
          # IMPORTS
          # ----------------------------------------------------------

          imports = [
              "import android.content.Context",
              "import android.graphics.Canvas",
              "import android.graphics.Paint",
              "import android.graphics.Path",
              "import android.graphics.LinearGradient",
              "import android.graphics.Shader",
              "import android.graphics.RectF",
              "import android.media.AudioAttributes",
              "import android.media.SoundPool",
              "import android.view.MotionEvent",
              "import android.view.View"
          ]

          package_end = code.find("\n")

          if package_end < 0:
              raise SystemExit(
                  "ERRO: package não encontrado."
              )

          for imp in imports:

              if not re.search(
                  r"(?m)^"
                  + re.escape(imp)
                  + r"\s*$",
                  code
              ):

                  code = (
                      code[:package_end + 1]
                      + imp
                      + "\n"
                      + code[package_end + 1:]
                  )

                  package_end += len(imp) + 1

          # ----------------------------------------------------------
          # CLASSE DA ROLETA
          # ----------------------------------------------------------

          if (
              "class ControleHorasTimeWheelView"
              not in code
          ):

              main_index = code.find(
                  "class MainActivity"
              )

              if main_index < 0:
                  raise SystemExit(
                      "ERRO: MainActivity não encontrada."
                  )

              code = (
                  code[:main_index]
                  + "\n"
                  + wheel_class
                  + "\n"
                  + code[main_index:]
              )

          # ----------------------------------------------------------
          # INDENTAR
          # ----------------------------------------------------------

          def indent_block(
              block,
              spaces
          ):

              prefix = " " * spaces

              return "\n".join(
                  prefix + line
                  if line.strip()
                  else ""
                  for line in block.splitlines()
              )

          # ----------------------------------------------------------
          # DIÁLOGO
          # ----------------------------------------------------------

          if (
              "private fun "
              "showControleHorasWheelDialog("
              not in code
          ):

              anchor = (
                  "    private fun showManualWheel("
              )

              pos = code.find(anchor)

              if pos < 0:
                  raise SystemExit(
                      "ERRO: showManualWheel não encontrada."
                  )

              code = (
                  code[:pos]
                  + indent_block(
                      wheel_dialog,
                      4
                  )
                  + "\n\n"
                  + code[pos:]
              )

          # ----------------------------------------------------------
          # SUBSTITUIR MÉTODO
          # ----------------------------------------------------------

          def replace_method(
              source,
              signature,
              body
          ):

              start = source.find(
                  signature
              )

              if start < 0:
                  raise SystemExit(
                      "ERRO: função não encontrada: "
                      + signature
                  )

              search_from = (
                  start
                  + len(signature)
              )

              next_match = re.search(
                  r"\n[ \t]{4}private\s+fun\s+",
                  source[search_from:]
              )

              if next_match:

                  end = (
                      search_from
                      + next_match.start()
                      + 1
                  )

              else:

                  closing = source.find(
                      "\n    }\n}",
                      start
                  )

                  if closing < 0:
                      raise SystemExit(
                          "ERRO: fim da função não encontrado: "
                          + signature
                      )

                  end = closing + len("\n    }")

              return (
                  source[:start]
                  + indent_block(
                      body,
                      4
                  )
                  + "\n"
                  + source[end:]
              )

          code = replace_method(
              code,
              "    private fun showEditWheel(",
              edit_method
          )

          code = replace_method(
              code,
              "    private fun showManualWheel(",
              manual_method
          )

          code = replace_method(
              code,
              "    private fun registerPunch(",
              register_method
          )

          # ----------------------------------------------------------
          # MANIFEST
          # ----------------------------------------------------------

          manifest = Path(
              "ControleHoras/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "ERRO: AndroidManifest.xml não encontrado."
              )

          manifest_code = manifest.read_text(
              encoding="utf-8"
          )

          if (
              'android:icon="@drawable/controlehoras_icon"'
              not in manifest_code
          ):

              manifest_code = manifest_code.replace(
                  "<application",
                  '<application\n'
                  '        android:icon="'
                  '@drawable/controlehoras_icon"\n'
                  '        android:roundIcon="'
                  '@drawable/controlehoras_icon"',
                  1
              )

          manifest.write_text(
              manifest_code,
              encoding="utf-8"
          )

          # ----------------------------------------------------------
          # VALIDAÇÃO
          # ----------------------------------------------------------

          required = [
              "class ControleHorasTimeWheelView",
              "private fun showControleHorasWheelDialog(",
              "private fun showManualWheel(",
              "private fun showEditWheel(",
              "private fun registerPunch(",
              "punchNames",
              "controleHorasPunchPage",
              "extra2Enabled",
              "nextPunchIndex"
          ]

          for item in required:

              if item not in code:
                  raise SystemExit(
                      "ERRO: recurso não encontrado: "
                      + item
                  )

          if "NumberPicker(" in code:
              raise SystemExit(
                  "ERRO: NumberPicker ainda presente."
              )

          if "Esse registro ainda está vazio" in code:
              raise SystemExit(
                  "ERRO: bloqueio antigo encontrado."
              )

          sound = Path(
              "ControleHoras/app/src/main/res/raw/"
              "roller_click.wav"
          )

          if (
              not sound.exists()
              or sound.stat().st_size == 0
          ):
              raise SystemExit(
                  "ERRO: roller_click.wav não encontrado."
              )

          icon = Path(
              "ControleHoras/app/src/main/res/drawable/"
              "controlehoras_icon.jpg"
          )

          if (
              not icon.exists()
              or icon.stat().st_size == 0
          ):
              raise SystemExit(
                  "ERRO: ícone não encontrado."
              )

          src.write_text(
              code,
              encoding="utf-8"
          )

          print("========================================")
          print("ROLETA INSTALADA")
          print("EDIÇÃO POR ROLETA: OK")
          print("REGISTRO MANUAL: OK")
          print("REGISTRO AUTOMÁTICO: PRESERVADO")
          print("punchNames: OK")
          print("controleHorasPunchPage: OK")
          print("NUMBERPICKER: REMOVIDO")
          print("ESCALA: PRESERVADA")
          print("========================================")

      # ============================================================
      # VALIDAÇÃO ANTES DO GRADLE
      # ============================================================

      - name: Validar projeto antes do Gradle
        shell: python
        run: |
          from pathlib import Path

          src = Path(
              "ControleHoras/app/src/main/java/"
              "com/didhuuu/controlehoras/MainActivity.kt"
          )

          if not src.exists():
              raise SystemExit(
                  "MainActivity.kt não encontrado."
              )

          code = src.read_text(
              encoding="utf-8"
          )

          required = [
              "class ControleHorasTimeWheelView",
              "private fun showControleHorasWheelDialog(",
              "private fun showManualWheel(",
              "private fun showEditWheel(",
              "private fun registerPunch(",
              "punchNames",
              "controleHorasPunchPage",
              "extra2Enabled",
              "nextPunchIndex"
          ]

          for item in required:

              if item not in code:
                  raise SystemExit(
                      "FALTA NO KOTLIN: "
                      + item
                  )

          if "NumberPicker(" in code:
              raise SystemExit(
                  "NumberPicker encontrado."
              )

          if "Esse registro ainda está vazio" in code:
              raise SystemExit(
                  "Bloqueio antigo encontrado."
              )

          sound = Path(
              "ControleHoras/app/src/main/res/raw/"
              "roller_click.wav"
          )

          if not sound.exists():
              raise SystemExit(
                  "roller_click.wav não encontrado."
              )

          icon = Path(
              "ControleHoras/app/src/main/res/drawable/"
              "controlehoras_icon.jpg"
          )

          if not icon.exists():
              raise SystemExit(
                  "controlehoras_icon.jpg não encontrado."
              )

          print("========================================")
          print("VALIDAÇÃO ESTRUTURAL OK")
          print("========================================
