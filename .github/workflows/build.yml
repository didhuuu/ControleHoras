name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1 - BAIXAR PROJETO
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # 2 - JAVA 17
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3 - EXTRAIR PROJETO
      # ============================================================

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXTRAINDO PROJETO"
          echo "========================================"

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      # ============================================================
      # 4 - APLICAR EXATAMENTE A BASE 70
      # ============================================================

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          print("========================================")
          print("APLICANDO BASE 70")
          print("========================================")

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=60
          ).read().decode("utf-8")

          def extract_step(name, next_name):

              start_marker = f"      - name: {name}"
              end_marker = f"      - name: {next_name}"

              if start_marker not in workflow:
                  raise RuntimeError(
                      f"Etapa não encontrada: {name}"
                  )

              start = workflow.index(start_marker)

              if end_marker not in workflow[start:]:
                  raise RuntimeError(
                      f"Próxima etapa não encontrada: {next_name}"
                  )

              end = workflow.index(
                  end_marker,
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              if marker not in block:
                  raise RuntimeError(
                      f"Bloco run não encontrado: {name}"
                  )

              pos = (
                  block.index(marker)
                  + len(marker)
              )

              lines = block[pos:].splitlines()

              return "\n".join(
                  line[10:]
                  if line.startswith("          ")
                  else line
                  for line in lines
              ).rstrip() + "\n"

          scripts = [
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for i, script in enumerate(scripts):

              p = (
                  Path(tempfile.gettempdir())
                  / f"base70_{i}.py"
              )

              p.write_text(
                  script,
                  encoding="utf-8"
              )

              compile(
                  script,
                  str(p),
                  "exec"
              )

              subprocess.run(
                  [
                      "python",
                      str(p)
                  ],
                  check=True
              )

          print("========================================")
          print("BASE 70 APLICADA")
          print("ESCALA ORIGINAL PRESERVADA")
          print("========================================")

      # ============================================================
      # 5 - APLICAR FUNCIONALIDADES DA VERSÃO 80
      # ============================================================

      - name: Aplicar funcionalidades da versão 80
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          print("========================================")
          print("APLICANDO VERSÃO 80")
          print("========================================")

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=60
          ).read().decode("utf-8")

          start_marker = (
              "      - name: "
              "Aplicar correções finais da Base 70, "
              "edição por rolagem e ícone"
          )

          end_marker = (
              "      - name: Validar código e ícone"
          )

          if start_marker not in workflow:
              raise RuntimeError(
                  "Bloco da versão 80 não encontrado."
              )

          start = workflow.index(
              start_marker
          )

          end = workflow.index(
              end_marker,
              start
          )

          block = workflow[start:end]

          marker = "        run: |\n"

          if marker not in block:
              raise RuntimeError(
                  "Bloco Python da versão 80 não encontrado."
              )

          pos = (
              block.index(marker)
              + len(marker)
          )

          lines = block[pos:].splitlines()

          script = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in lines
          ).rstrip() + "\n"

          p = (
              Path(tempfile.gettempdir())
              / "funcionalidades_v80.py"
          )

          p.write_text(
              script,
              encoding="utf-8"
          )

          compile(
              script,
              str(p),
              "exec"
          )

          subprocess.run(
              [
                  "python",
                  str(p)
              ],
              check=True
          )

          print("========================================")
          print("VERSÃO 80 APLICADA")
          print("========================================")

      # ============================================================
      # 6 - CRIAR SOM MECÂNICO DA ROLETA
      # ============================================================

      - name: Criar som mecânico da roleta
        shell: python
        run: |
          from pathlib import Path
          import wave
          import math
          import struct

          raw = Path(
              "ControleHoras/app/src/main/res/raw"
          )

          raw.mkdir(
              parents=True,
              exist_ok=True
          )

          filename = raw / "roller_click.wav"

          rate = 44100
          duration = 0.035

          frames = []

          for i in range(
              int(rate * duration)
          ):

              t = i / rate

              a = (
                  0.45
                  * math.exp(-85 * t)
                  * math.sin(
                      2 * math.pi * 1850 * t
                  )
              )

              b = (
                  0.22
                  * math.exp(-130 * t)
                  * math.sin(
                      2 * math.pi * 3200 * t
                  )
              )

              value = max(
                  -1.0,
                  min(
                      1.0,
                      a + b
                  )
              )

              frames.append(
                  struct.pack(
                      "<h",
                      int(value * 32767)
                  )
              )

          with wave.open(
              str(filename),
              "wb"
          ) as wav:

              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)

              wav.writeframes(
                  b"".join(frames)
              )

          print("SOM DA ROLETA CRIADO")

      # ============================================================
      # 7 - INSTALAR ROLETA E CORRIGIR TELA
      #
      # IMPORTANTE:
      # Usamos o bloco completo que já contém o showPunch
      # corrigido, em vez daquele bloco Python que ficou truncado.
      # ============================================================

      - name: Instalar roleta personalizada
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          print("========================================")
          print("INSTALANDO ROLETA PERSONALIZADA")
          print("========================================")

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "39fc6bfb41ebc7b01d6c435a85b5228e735f3f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=60
          ).read().decode("utf-8")

          start_marker = (
              "      - name: "
              "Corrigir tela e instalar roleta personalizada"
          )

          end_marker = (
              "      - name: Validar projeto antes do Gradle"
          )

          if start_marker not in workflow:
              raise RuntimeError(
                  "Bloco da roleta não encontrado."
              )

          start = workflow.index(
              start_marker
          )

          end = workflow.index(
              end_marker,
              start
          )

          block = workflow[start:end]

          marker = "        run: |\n"

          if marker not in block:
              raise RuntimeError(
                  "Bloco Python da roleta não encontrado."
              )

          pos = (
              block.index(marker)
              + len(marker)
          )

          lines = block[pos:].splitlines()

          script = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in lines
          ).rstrip() + "\n"

          p = (
              Path(tempfile.gettempdir())
              / "roleta_completa.py"
          )

          p.write_text(
              script,
              encoding="utf-8"
          )

          compile(
              script,
              str(p),
              "exec"
          )

          subprocess.run(
              [
                  "python",
                  str(p)
              ],
              check=True
          )

          print("========================================")
          print("ROLETA INSTALADA")
          print("SHOWPUNCH CORRIGIDO")
          print("EDIÇÃO MANUAL PRESERVADA")
          print("========================================")

      # ============================================================
      # 8 - VALIDAÇÃO ANTES DO GRADLE
      # ============================================================

      - name: Validar projeto antes do Gradle
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VALIDANDO PROJETO"
          echo "========================================"

          SRC="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          MANIFEST="ControleHoras/app/src/main/AndroidManifest.xml"

          SOUND="ControleHoras/app/src/main/res/raw/roller_click.wav"

          test -s "$SRC"

          test -s "$MANIFEST"

          test -s "$SOUND"

          grep -q \
            "ControleHorasTimeWheelView" \
            "$SRC"

          grep -q \
            "showControleHorasWheelDialog" \
            "$SRC"

          grep -q \
            "showManualWheel" \
            "$SRC"

          grep -q \
            "showEditWheel" \
            "$SRC"

          grep -q \
            "controleHorasPunchPage" \
            "$SRC"

          grep -q \
            "punchNames" \
            "$SRC"

          grep -q \
            "nextPunchIndex" \
            "$SRC"

          grep -q \
            "extra2Enabled" \
            "$SRC"

          grep -q \
            "controlehoras_icon" \
            "$MANIFEST"

          if grep -q "NumberPicker(" "$SRC"; then
              echo "ERRO: NumberPicker encontrado."
              exit 1
          fi

          if grep -q \
            "Esse registro ainda está vazio" \
            "$SRC"; then

              echo "ERRO: mensagem antiga encontrada."
              exit 1
          fi

          echo "========================================"
          echo "VALIDAÇÃO OK"
          echo "========================================"

      # ============================================================
      # 9 - INSTALAR GRADLE
      # ============================================================

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      # ============================================================
      # 10 - LIMPAR
      # ============================================================

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon

      # ============================================================
      # 11 - GERAR APK
      # ============================================================

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GERANDO APK"
          echo "========================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

          echo "========================================"
          echo "APK GERADO COM SUCESSO"
          echo "========================================"

      # ============================================================
      # 12 - VALIDAR APK
      # ============================================================

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t \
            "$APK" \
            >/dev/null

          echo "========================================"
          echo "APK VALIDADO"
          echo "========================================"

      # ============================================================
      # 13 - PUBLICAR APK
      # ============================================================

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
