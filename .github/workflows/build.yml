name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          URL=(
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow=(
              urlopen(URL,timeout=30)
              .read()
              .decode("utf-8")
          )

          def extract_step(name,next_name):

              start=workflow.index(
                  f"      - name: {name}"
              )

              end=workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block=workflow[start:end]

              marker="        run: |\n"

              pos=(
                  block.index(marker)
                  + len(marker)
              )

              lines=block[pos:].splitlines()

              result=[]

              for line in lines:

                  if line.startswith("          "):
                      result.append(line[10:])
                  else:
                      result.append(line)

              return "\n".join(result)+"\n"

          scripts=[
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for index,script in enumerate(scripts):

              path=(
                  Path(tempfile.gettempdir())
                  / f"base70_{index}.py"
              )

              path.write_text(
                  script,
                  encoding="utf-8"
              )

              subprocess.run(
                  ["python",str(path)],
                  check=True
              )

          print("BASE 70 APLICADA")

      - name: Aplicar correções finais da Base 70, edição por rolagem e intervalo 2
        shell: python
        run: |
          from pathlib import Path
          import base64

          root=Path("ControleHoras")

          src=(
              root
              / "app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          wheel=(
              root
              / "app/src/main/java/com/didhuuu/controlehoras/TimeWheelView.kt"
          )

          code=src.read_text(
              encoding="utf-8"
          )

          if "import android.view.ViewGroup" not in code:

              code=code.replace(
                  "import android.view.View\n",
                  "import android.view.View\n"
                  "import android.view.ViewGroup\n",
                  1
              )

          # ---------------------------------------------------------
          # INTERVALO 2
          # ---------------------------------------------------------

          if "private val extra2Enabled" not in code:

              anchors=[
                  "    private val weekModes=linkedMapOf<String,String>()\n",
                  "    private val weekModes = linkedMapOf<String,String>()\n"
              ]

              inserted=False

              for anchor in anchors:

                  if anchor in code:

                      code=code.replace(
                          anchor,
                          anchor
                          + "    private val extra2Enabled=mutableSetOf<String>()\n"
                          + "    private val extra2ReturnEnabled=mutableSetOf<String>()\n",
                          1
                      )

                      inserted=True
                      break

              if not inserted:

                  raise SystemExit(
                      "ERRO: weekModes não encontrado"
                  )

          # ---------------------------------------------------------
          # PERSISTÊNCIA DO INTERVALO 2
          # ---------------------------------------------------------

          if 'prefs.getString("extra2Enabled"' not in code:

              anchor="        scale.clear()\n"

              if anchor not in code:

                  raise SystemExit(
                      "ERRO: scale.clear não encontrado"
                  )

              block=(
                  "        extra2Enabled.clear()\n"
                  "        extra2ReturnEnabled.clear()\n"
                  "        try{\n"
                  "            val ja=JSONArray("
                  'prefs.getString("extra2Enabled","[]") ?: "[]"'
                  ")\n"
                  "            for(i in 0 until ja.length()) "
                  "extra2Enabled.add(ja.optString(i))\n"
                  "            val jb=JSONArray("
                  'prefs.getString("extra2ReturnEnabled","[]") ?: "[]"'
                  ")\n"
                  "            for(i in 0 until jb.length()) "
                  "extra2ReturnEnabled.add(jb.optString(i))\n"
                  "        }catch(_:Exception){}\n"
              )

              code=code.replace(
                  anchor,
                  block+anchor,
                  1
              )

              anchor="        e.apply()\n"

              if anchor not in code:

                  raise SystemExit(
                      "ERRO: e.apply não encontrado"
                  )

              block=(
                  "        val extraJson=JSONArray()\n"
                  "        extra2Enabled.forEach{"
                  "extraJson.put(it)"
                  "}\n"
                  '        e.putString("extra2Enabled",extraJson.toString())\n'
                  "        val extraReturnJson=JSONArray()\n"
                  "        extra2ReturnEnabled.forEach{"
                  "extraReturnJson.put(it)"
                  "}\n"
                  '        e.putString("extra2ReturnEnabled",extraReturnJson.toString())\n'
              )

              code=code.replace(
                  anchor,
                  block+anchor,
                  1
              )

          # ---------------------------------------------------------
          # HELPERS INTERVALO 2
          # ---------------------------------------------------------

          if "private fun extraKey" not in code:

              anchor="    private fun today()=iso.format(Date())\n"

              if anchor not in code:

                  raise SystemExit(
                      "ERRO: today não encontrado"
                  )

              block=(
                  '    private fun extraKey(empId:Long,date:String)=empId.toString()+"|"+date\n'
                  "    private fun extraEnabled(empId:Long,date:String)="
                  "extra2Enabled.contains(extraKey(empId,date))\n"
                  "    private fun extraReturnEnabled(empId:Long,date:String)="
                  "extra2ReturnEnabled.contains(extraKey(empId,date))\n"
                  "    private fun setExtraEnabled("
                  "empId:Long,date:String,value:Boolean){\n"
                  "        val k=extraKey(empId,date)\n"
                  "        if(value){\n"
                  "            extra2Enabled.add(k)\n"
                  "        }else{\n"
                  "            extra2Enabled.remove(k)\n"
                  "            extra2ReturnEnabled.remove(k)\n"
                  "        }\n"
                  "        saveData()\n"
                  "    }\n"
                  "    private fun setExtraReturnEnabled("
                  "empId:Long,date:String,value:Boolean){\n"
                  "        val k=extraKey(empId,date)\n"
                  "        if(value && extra2Enabled.contains(k)){\n"
                  "            extra2ReturnEnabled.add(k)\n"
                  "        }else{\n"
                  "            extra2ReturnEnabled.remove(k)\n"
                  "        }\n"
                  "        saveData()\n"
                  "    }\n"
              )

              code=code.replace(
                  anchor,
                  block+anchor,
                  1
              )

          # ---------------------------------------------------------
          # PONTO
          # ---------------------------------------------------------

          start=code.find(
              "    private fun showPunch()"
          )

          end=code.find(
              "    private fun showHistory()",
              start
          )

          if start<0 or end<0:

              raise SystemExit(
                  "ERRO: showPunch/showHistory não encontrados"
              )

          show_lines=[
              '    private fun showPunch(){',
              '        val box=page("Bater Ponto")',
              '        if(employees.isEmpty()){',
              '            box.addView(infoCard("Nenhum funcionário cadastrado.\\nCadastre o primeiro em Funcionários."))',
              '            return',
              '        }',
              '        val emp=employees.firstOrNull{it.id==selectedEmployeeId}',
              '            ?:employees.first().also{selectedEmployeeId=it.id}',
              '',
              '        val employeeCard=(card() as ViewGroup).apply{',
              '            val line=LinearLayout(context).apply{',
              '                orientation=LinearLayout.VERTICAL',
              '                setPadding(dp(16),dp(12),dp(16),dp(12))',
              '            }',
              '',
              '            line.addView(label("Funcionário"))',
              '',
              '            val spinner=Spinner(context)',
              '',
              '            spinner.adapter=ArrayAdapter(',
              '                context,',
              '                android.R.layout.simple_spinner_dropdown_item,',
              '                employees.map{it.name}',
              '            )',
              '',
              '            spinner.setSelection(',
              '                employees.indexOfFirst{',
              '                    it.id==selectedEmployeeId',
              '                }.coerceAtLeast(0)',
              '            )',
              '',
              '            spinner.onItemSelectedListener=',
              '                object:AdapterView.OnItemSelectedListener{',
              '',
              '                    override fun onNothingSelected(',
              '                        p:AdapterView<*>?',
              '                    ){}',
              '',
              '                    override fun onItemSelected(',
              '                        p:AdapterView<*>?,',
              '                        v:View?,',
              '                        pos:Int,',
              '                        id:Long',
              '                    ){',
              '                        if(employees[pos].id!=selectedEmployeeId){',
              '                            selectedEmployeeId=employees[pos].id',
              '                            selectedPunchDate=today()',
              '                            showPunch()',
              '                        }',
              '                    }',
              '                }',
              '',
              '            line.addView(spinner)',
              '',
              '            line.addView(',
              '                TextView(context).apply{',
              '                    text="Salário mensal   ${money.format(emp.salary)}"',
              '                    textSize=14f',
              '                    setTextColor(muted)',
              '                    setPadding(0,dp(8),0,0)',
              '                }',
              '            )',
              '',
              '            addView(line)',
              '        }',
              '',
              '        box.addView(',
              '            employeeCard,',
              '            LinearLayout.LayoutParams(-1,-2).apply{',
              '                bottomMargin=dp(10)',
              '            }',
              '        )',
              '',
              '        val dateCard=card()',
              '',
              '        val dateLine=LinearLayout(this).apply{',
              '            orientation=LinearLayout.HORIZONTAL',
              '            gravity=Gravity.CENTER_VERTICAL',
              '            setPadding(dp(14),dp(8),dp(14),dp(8))',
              '        }',
              '',
              '        dateLine.addView(',
              '            TextView(this).apply{',
              '                text="📅"',
              '                textSize=25f',
              '            },',
              '            LinearLayout.LayoutParams(dp(45),dp(55))',
              '        )',
              '',
              '        dateLine.addView(',
              '            TextView(this).apply{',
              '                text="DATA\\n${df.format(parseIso(selectedPunchDate))}"',
              '                textSize=16f',
              '                setTypeface(null,Typeface.BOLD)',
              '                setTextColor(this@MainActivity.text)',
              '            },',
              '            LinearLayout.LayoutParams(0,dp(60),1f)',
              '        )',
              '',
              '        dateLine.addView(',
              '            Button(this).apply{',
              '                text="ALTERAR"',
              '                isAllCaps=false',
              '                setOnClickListener{choosePunchDate()}',
              '            },',
              '            LinearLayout.LayoutParams(dp(105),dp(52))',
              '        )',
              '',
              '        dateCard.addView(dateLine)',
              '',
              '        box.addView(',
              '            dateCard,',
              '            LinearLayout.LayoutParams(-1,dp(82)).apply{',
              '                bottomMargin=dp(8)',
              '            }',
              '        )',
              '',
              '        box.addView(',
              '            Button(this).apply{',
              '                text="✎  REGISTRO MANUAL"',
              '                isAllCaps=false',
              '                textSize=14f',
              '                setOnClickListener{showManualWheel(emp.id)}',
              '            },',
              '            LinearLayout.LayoutParams(-1,dp(54)).apply{',
              '                bottomMargin=dp(10)',
              '            }',
              '        )',
              '',
              '        val rec=getRecord(',
              '            emp.id,',
              '            selectedPunchDate',
              '        )',
              '',
              '        val extra=extraEnabled(',
              '            emp.id,',
              '            selectedPunchDate',
              '        )',
              '',
              '        val extraReturn=extraReturnEnabled(',
              '            emp.id,',
              '            selectedPunchDate',
              '        )',
              '',
              '        val next=nextPunchIndex(',
              '            rec,',
              '            extra',
              '        )',
              '',
              '        box.addView(',
              '            Button(this).apply{',
              '                text=if(next<0)',
              '                    "PONTO DO DIA COMPLETO"',
              '                else',
              '                    "▶  REGISTRAR PRÓXIMA BATIDA\\n${punchNames[next]}"',
              '                textSize=15f',
              '                setTextColor(Color.WHITE)',
              '                isAllCaps=false',
              '                isEnabled=next>=0',
              '                background(',
              '                    green,',
              '                    dp(12),',
              '                    dp(12),',
              '                    dp(12),',
              '                    dp(12)',
              '                )',
              '                setOnClickListener{',
              '                    registerPunch(emp.id)',
              '                }',
              '            },',
              '            LinearLayout.LayoutParams(-1,dp(72)).apply{',
              '                bottomMargin=dp(10)',
              '            }',
              '        )',
              '',
              '        box.addView(',
              '            TextView(this).apply{',
              '                text="BATIDAS DO DIA"',
              '                textSize=13f',
              '                setTypeface(null,Typeface.BOLD)',
              '                setTextColor(muted)',
              '                setPadding(dp(4),dp(2),0,dp(6))',
              '            }',
              '        )',
              '',
              '        addPunchRow(box,rec,0,punchNames[0])',
              '        addPunchRow(box,rec,1,punchNames[1])',
              '        addPunchRow(box,rec,2,punchNames[2])',
              '',
              '        addExtraSwitch(',
              '            box,',
              '            "Intervalo 2",',
              '            extra,',
              '            {',
              '                setExtraEnabled(',
              '                    emp.id,',
              '                    selectedPunchDate,',
              '                    it',
              '                )',
              '                showPunch()',
              '            }',
              '        )',
              '',
              '        if(extra){',
              '            addPunchRow(',
              '                box,',
              '                rec,',
              '                3,',
              '                "Saída intervalo 2"',
              '            )',
              '',
              '            addExtraSwitch(',
              '                box,',
              '                "Retorno intervalo 2",',
              '                extraReturn,',
              '                {',
              '                    setExtraReturnEnabled(',
              '                        emp.id,',
              '                        selectedPunchDate,',
              '                        it',
              '                    )',
              '                    showPunch()',
              '                }',
              '            )',
              '',
              '            if(extraReturn){',
              '                addPunchRow(',
              '                    box,',
              '                    rec,',
              '                    4,',
              '                    "Retorno intervalo 2"',
              '                )',
              '            }',
              '        }',
              '',
              '        addPunchRow(box,rec,5,punchNames[5])',
              '',
              '        val calc=calculate(rec)',
              '',
              '        addTotalCard(',
              '            box,',
              '            "TRABALHADO",',
              '            normalizeDuration(calc.worked)',
              '        )',
              '',
              '        addTotalCard(',
              '            box,',
              '            "PREVISTO",',
              '            normalizeDuration(calc.expected)',
              '        )',
              '',
              '        addTotalCard(',
              '            box,',
              '            "EXTRAS",',
              '            normalizeDuration(calc.extra)',
              '        )',
              '',
              '        addTotalCard(',
              '            box,',
              '            "FALTANTE",',
              '            normalizeDuration(calc.missing)',
              '        )',
              '',
              '        content.removeAllViews()',
              '        content.addView(box)',
              '    }'
          ]

          show="\n".join(show_lines)+"\n"

          code=(
              code[:start]
              + show
              + code[end:]
          )

          # ---------------------------------------------------------
          # MÉTODOS DA RODA
          # ---------------------------------------------------------

          helper_payload=(
              " c2V0T25DbGlja0xpc3RlbmVyIHt o bkF2ZShoLnZhbHVlLG0udmFsdWUpOyBkaWFsb2cuZGlzbWlzcygpfX19CiAgICB9"
          )

          # O payload acima pode conter espaço inserido na cópia.
          helper_payload="".join(
              helper_payload.split()
          )

          helper_payload += "=" * (
              -len(helper_payload) % 4
          )

          helpers=base64.b64decode(
              helper_payload
          ).decode("utf-8")

          helper_start=code.find(
              "    private fun showEditWheel("
          )

          helper_end=code.find(
              "    private fun calculate(r:PunchDay):Calc{",
              helper_start
          )

          if helper_start<0 or helper_end<0:

              raise SystemExit(
                  "ERRO: funções da roda não encontradas"
              )

          code=(
              code[:helper_start]
              + helpers
              + "\n"
              + code[helper_end:]
          )

          src.write_text(
              code,
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # RODA VISUAL
          # ---------------------------------------------------------

          wheel_payload=(
              ""
          )

          wheel_payload="".join(
              wheel_payload.split()
          )

          wheel_payload += "=" * (
              -len(wheel_payload) % 4
          )

          wheel.write_text(
              base64.b64decode(
                  wheel_payload
              ).decode("utf-8"),
              encoding="utf-8"
          )

          print("CORREÇÕES FINAIS APLICADAS")

      - name: Validar estrutura final
        shell: bash
        run: |
          set -euo pipefail

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          WHEEL="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/TimeWheelView.kt"

          test -s "$FILE"
          test -s "$WHEEL"

          grep -q "extra2Enabled" "$FILE"
          grep -q "showManualWheel" "$FILE"
          grep -q "showEditWheel" "$FILE"
          grep -q "showTimeWheelDialog" "$FILE"
          grep -q "TimeWheelView" "$FILE"
          grep -q "nextPunchIndex" "$FILE"
          grep -q "punchNames" "$FILE"
          grep -q "class TimeWheelView" "$WHEEL"

          if grep -q "NumberPicker" "$FILE"; then
            echo "ERRO: NumberPicker antigo ainda presente"
            exit 1
          fi

          if grep -q "Button(context)" "$FILE"; then
            echo "ERRO: Button(context)"
            exit 1
          fi

          echo "ESTRUTURA FINAL VALIDADA"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q gradle-8.11.1-bin.zip

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -euo pipefail
          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -euo pipefail

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

          echo "APK GERADO"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
