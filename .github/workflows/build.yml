name: Gerar APK - ControleHoras

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto original
        shell: bash
        run: |
          set -e
          rm -rf ControleHoras
          unzip -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"
          wc -l ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

      - name: Corrigir aplicativo original
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt")
          s = p.read_text(encoding="utf-8")

          def replace_once(old, new, name):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"ERRO {name}: esperado 1, encontrado {n}")
              s = s.replace(old, new, 1)

          s = s.replace(
              "        }, 0, 0, 0, dp(10))",
              "        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(10) })"
          )

          s = s.replace(
              "        }, 0, 0, 0, dp(12))",
              "        }, LinearLayout.LayoutParams(-1, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(12) })"
          )

          s = s.replace(
              "setTextColor(text)",
              "setTextColor(this@MainActivity.text)"
          )

          replace_once(
              'setText(if(existing!=null)existing.salary.toString():"")',
              'setText(if (existing != null) existing.salary.toString() else "")',
              "salário"
          )

          s = s.replace(
              'it.date.endsWith(SimpleDateFormat("MM-yyyy", Locale.US).format(Date()))',
              'it.date.startsWith(SimpleDateFormat("yyyy-MM", Locale.US).format(Date()))'
          )

          marker = "    private fun getRecord(empId:Long,date:String):PunchDay{"

          helper = '''    private fun normalizeTime(value:String):String{
              val digits=value.filter{it.isDigit()}.take(4)
              if(digits.length!=4)return ""

              val hour=digits.substring(0,2).toIntOrNull()?:return ""
              val minute=digits.substring(2,4).toIntOrNull()?:return ""

              if(hour !in 0..23 || minute !in 0..59)return ""

              return "%02d:%02d".format(Locale.US,hour,minute)
          }

          private fun timeEdit(initial:String="",hintText:String="00:00"):EditText{
              val e=EditText(this).apply{
                  hint=hintText
                  inputType=2
                  setSingleLine()

                  val normalized=normalizeTime(initial)
                  if(normalized.isNotEmpty())setText(normalized)
              }

              var changing=false

              e.addTextChangedListener(object:android.text.TextWatcher{
                  override fun beforeTextChanged(s:CharSequence?,start:Int,count:Int,after:Int){}
                  override fun onTextChanged(s:CharSequence?,start:Int,before:Int,count:Int){}
                  
                  override fun afterTextChanged(editable:android.text.Editable?){
                      if(changing)return

                      val digits=editable?.toString()?.filter{it.isDigit()}?.take(4).orEmpty()

                      val formatted=when{
                          digits.isEmpty()->""
                          digits.length<=2->digits
                          else->digits.substring(0,2)+":"+digits.substring(2)
                      }

                      if(formatted!=editable?.toString()){
                          changing=true
                          e.setText(formatted)
                          e.setSelection(e.text.length)
                          changing=false
                      }
                  }
              })

              e.setOnFocusChangeListener{_,hasFocus->
                  if(!hasFocus){
                      val normalized=normalizeTime(e.text.toString())
                      if(normalized.isNotEmpty()){
                          e.setText(normalized)
                          e.setSelection(e.text.length)
                      }
                  }
              }

              return e
          }

          '''

          if marker not in s:
              raise SystemExit("ERRO: ponto de inserção de horário não encontrado")

          if "private fun normalizeTime" not in s:
              s = s.replace(marker, helper + marker, 1)

          old_minutes = '''    private fun minutesBetween(a:String,b:String):Int{
              if(a.isBlank()||b.isBlank())return 0
              return try{val x=a.split(":");val y=b.split(":");max(0,(y[0].toInt()*60+y[1].toInt())-(x[0].toInt()*60+x[1].toInt()))}catch(_:Exception){0}
          }'''

          new_minutes = '''    private fun minutesBetween(a:String,b:String):Int{
              val x=normalizeTime(a)
              val y=normalizeTime(b)

              if(x.isBlank()||y.isBlank())return 0

              return try{
                  val xa=x.split(":")
                  val ya=y.split(":")

                  max(
                      0,
                      (ya[0].toInt()*60+ya[1].toInt())-
                      (xa[0].toInt()*60+xa[1].toInt())
                  )
              }catch(_:Exception){
                  0
              }
          }'''

          replace_once(old_minutes, new_minutes, "minutesBetween")

          replace_once(
              '    private fun formatMin(m:Int):String="${m/60}:%02d".format(m%60)',
              '    private fun formatMin(m:Int):String="%02d:%02d".format(Locale.US,max(0,m)/60,max(0,m)%60)',
              "formatMin"
          )

          replace_once(
              'val e=EditText(this).apply{setText(r.punches[index]);hint="HH:mm";inputType=2;setSingleLine()}',
              'val e=timeEdit(r.punches[index],"00:00")',
              "campo manual"
          )

          replace_once(
              'r.punches[index]=e.text.toString();saveData();showPunch()',
              'r.punches[index]=normalizeTime(e.text.toString());saveData();showPunch()',
              "salvar manual"
          )

          replace_once(
              'val fields=r.punches.mapIndexed{i,v->EditText(this).apply{hint=punchNames[i];setText(v);inputType=2;setSingleLine();}}',
              'val fields=r.punches.mapIndexed{i,v->timeEdit(v,punchNames[i])}',
              "campos de edição"
          )

          replace_once(
              'fields.forEachIndexed{i,e->r.punches[i]=e.text.toString()};saveData();showHistory()',
              'fields.forEachIndexed{i,e->r.punches[i]=normalizeTime(e.text.toString())};saveData();showHistory()',
              "salvar edição"
          )

          replace_once(
              'val ed=EditText(this).apply{setText(p.second);hint="00:00";gravity=Gravity.CENTER;inputType=2;setSingleLine()}',
              'val ed=timeEdit(p.second,"00:00").apply{gravity=Gravity.CENTER}',
              "campo da escala"
          )

          replace_once(
              '0->s.e=ed.text.toString();1->s.x1=ed.text.toString();2->s.r1=ed.text.toString();3->s.x2=ed.text.toString()',
              '0->s.e=normalizeTime(ed.text.toString());1->s.x1=normalizeTime(ed.text.toString());2->s.r1=normalizeTime(ed.text.toString());3->s.x2=normalizeTime(ed.text.toString())',
              "salvar escala"
          )

          p.write_text(s, encoding="utf-8")

          if s.count("{") != s.count("}"):
              raise SystemExit(
                  f"ERRO ESTRUTURAL: chaves {{={s.count('{')} }}={s.count('}') }"
              )

          if len(s.splitlines()) > 560:
              raise SystemExit(
                  f"ERRO: arquivo ficou com {len(s.splitlines())} linhas"
              )

          print("========================================")
          print(" APLICATIVO ORIGINAL CORRIGIDO")
          print("========================================")
          print("Registro: OK")
          print("Adição manual: OK")
          print("Dois pontos automáticos: OK")
          print("Somatório: OK")
          print("Formato 00:00: OK")
          print("Histórico: OK")
          print("Escala: OK")
          print("Chaves: OK")
          print("Linhas:",len(s.splitlines()))
          print("========================================")
          PY

      - name: Verificar código antes de compilar
        shell: bash
        run: |
          set -e

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          test -s "$FILE"
          grep -q "private fun normalizeTime" "$FILE"
          grep -q "private fun timeEdit" "$FILE"
          grep -q "private fun minutesBetween" "$FILE"
          grep -q 'private fun formatMin(m:Int):String="%02d:%02d"' "$FILE"

          echo "CÓDIGO VALIDADO"
          wc -l "$FILE"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"
          unzip -q "gradle-8.11.1-bin.zip"

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/gradle-8.11.1/bin:$PATH"

          gradle --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e
          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug --no-daemon --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          echo "APK GERADO:"
          ls -lh "$APK"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" > /dev/null

          echo "APK ÍNTEGRO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Finalizar
        shell: bash
        run: |
          echo "BUILD FINALIZADO"
