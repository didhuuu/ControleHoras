    private fun showEditWheel(
        rec:PunchDay,
        index:Int
    ){

        val parts =
            rec.punches[index]
                .split(":")

        val hour =
            parts
                .getOrNull(0)
                ?.toIntOrNull()
                ?.coerceIn(0,23)
                ?: 0

        val minute =
            parts
                .getOrNull(1)
                ?.toIntOrNull()
                ?.coerceIn(0,59)
                ?: 0

        showTimeWheelDialog(
            "Editar batida",
            "${punchNames[index]}\n" +
            "${brDate(rec.date)}",
            hour,
            minute,
            "SALVAR"
        ){hh,mm->

            rec.punches[index] =
                "%02d:%02d".format(
                    java.util.Locale.US,
                    hh,
                    mm
                )

            saveData()

            showPunch()
        }
    }

    private fun showManualWheel(
        empId:Long
    ){

        val r =
            getRecord(
                empId,
                selectedPunchDate
            )

        loadExtra2()

        val extra =
            extra2Enabled.contains(
                extraKey(
                    empId,
                    selectedPunchDate
                )
            )

        val n =
            nextPunchIndex2(
                r,
                extra
            )

        if(n < 0){

            Toast.makeText(
                this,
                "Todas as batidas disponíveis estão preenchidas.",
                Toast.LENGTH_LONG
            ).show()

            return
        }

        val now =
            java.util.Calendar.getInstance()

        showTimeWheelDialog(
            "Registro manual",
            "${punchNames[n]}\n" +
            "${brDate(selectedPunchDate)}",
            now.get(
                java.util.Calendar.HOUR_OF_DAY
            ),
            now.get(
                java.util.Calendar.MINUTE
            ),
            "REGISTRAR"
        ){hh,mm->

            r.punches[n] =
                "%02d:%02d".format(
                    java.util.Locale.US,
                    hh,
                    mm
                )

            saveData()

            showPunch()
        }
    }

    private fun registerPunch(
        empId:Long
    ){

        val r =
            getRecord(
                empId,
                selectedPunchDate
            )

        loadExtra2()

        val extra =
            extra2Enabled.contains(
                extraKey(
                    empId,
                    selectedPunchDate
                )
            )

        val n =
            nextPunchIndex2(
                r,
                extra
            )

        if(n < 0)
            return

        if(
            selectedPunchDate ==
            today()
        ){

            val now =
                java.util.Calendar.getInstance()

            r.punches[n] =
                "%02d:%02d".format(
                    java.util.Locale.US,
                    now.get(
                        java.util.Calendar.HOUR_OF_DAY
                    ),
                    now.get(
                        java.util.Calendar.MINUTE
                    )
                )

            saveData()

            showPunch()

        }else{

            showTimeWheelDialog(
                "Registrar batida",
                "${punchNames[n]}\n" +
                "${brDate(selectedPunchDate)}",
                8,
                0,
                "REGISTRAR"
            ){hh,mm->

                r.punches[n] =
                    "%02d:%02d".format(
                        java.util.Locale.US,
                        hh,
                        mm
                    )

                saveData()

                showPunch()
            }
        }
    }

