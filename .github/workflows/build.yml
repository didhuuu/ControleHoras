name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Corrigir MainActivity
        shell: python
        run: |
          from pathlib import Path

          arquivo = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          codigo = arquivo.read_text(encoding="utf-8")

          print("Linhas originais:", len(codigo.splitlines()))

          # =====================================================
          # CORREÇÕES BÁSICAS
          # =====================================================

          codigo = codigo.replace(
              'setText(if(existing!=null)existing.salary.toString():"")',
              'setText(if(existing!=null)existing.salary.toString() else "")'
          )

          codigo = codigo.replace(
              'setText(if(existing != null) existing.salary.toString():"")',
              'setText(if(existing != null) existing.salary.toString() else "")'
          )

          codigo = codigo.replace(
              "setTextColor(text)",
              "setTextColor(this@MainActivity.text)"
          )

          codigo = codigo.replace(
              'it.date.endsWith(SimpleDateFormat("MM-yyyy", Locale.US).format(Date()))',
              'it.date.startsWith(SimpleDateFormat("yyyy-MM", Locale.US).format(Date()))'
          )

          codigo = codigo.replace(
              "}, 0, 0, 0, dp(10))",
              "}, LinearLayout.LayoutParams(-1, -2).apply{bottomMargin=dp(10)})"
          )

          codigo = codigo.replace(
              "}, 0, 0, 0, dp(12))",
              "}, LinearLayout.LayoutParams(-1, -2).apply{bottomMargin=dp(12)})"
          )

          # =====================================================
          # NORMALIZAÇÃO DE HORÁRIO
          # =====================================================

          marcador = "    private fun getRecord(empId:Long,date:String):PunchDay{"

          if marcador not in codigo:
              raise SystemExit("ERRO: getRecord não encontrado")

          helper = """
              private fun normalizeTime(value:String):String{
                  val digits=value.filter{it.isDigit()}.take(4)

                  if(digits.length!=4)return ""

                  val hour=digits.substring(0,2).toIntOrNull()?:return ""
                  val minute=digits.substring(2,4).toIntOrNull()?:return ""

                  if(hour !in 0..23)return ""
                  if(minute !in 0..59)return ""

                  return "%02d:%02d".format(Locale.US,hour,minute)
              }

              private fun timeEdit(
                  initial:String="",
                  hintText:String="00:00"
              ):EditText{

                  val e=EditText(this).apply{
                      hint=hintText
                      inputType=2
                      setSingleLine()

                      val normalized=normalizeTime(initial)

                      if(normalized.isNotEmpty()){
                          setText(normalized)
                      }
                  }

                  var changing=false

                  e.addTextChangedListener(
                      object:android.text.TextWatcher{

                          override fun beforeTextChanged(
                              s:CharSequence?,
                              start:Int,
                              count:Int,
                              after:Int
                          ){}

                          override fun onTextChanged(
                              s:CharSequence?,
                              start:Int,
                              before:Int,
                              count:Int
                          ){}

                          override fun afterTextChanged(
                              editable:android.text.Editable?
                          ){

                              if(changing)return

                              val digits=
                                  editable?.toString()
                                      ?.filter{it.isDigit()}
                                      ?.take(4)
                                      .orEmpty()

                              val formatted=when{

                                  digits.isEmpty()->""

                                  digits.length<=2->
                                      digits

                                  else->
                                      digits.substring(0,2)+":"+
                                      digits.substring(2)
                              }

                              if(formatted!=editable?.toString()){

                                  changing=true

                                  e.setText(formatted)
                                  e.setSelection(e.text.length)

                                  changing=false
                              }
                          }
                      }
                  )

                  e.setOnFocusChangeListener{_,hasFocus->

                      if(!hasFocus){

                          val normalized=
                              normalizeTime(e.text.toString())

                          if(normalized.isNotEmpty()){

                              e.setText(normalized)
                              e.setSelection(e.text.length)
                          }
                      }
                  }

                  return e
              }

          """

          if "private fun normalizeTime" not in codigo:

              codigo = codigo.replace(
                  marcador,
                  helper + marcador,
                  1
              )

          # =====================================================
          # ESCALA SEMANAL
          # =====================================================

          escala_marker = \
              "    private val scale = linkedMapOf<String, DayScale>()"

          if escala_marker not in codigo:
              raise SystemExit("ERRO: scale não encontrada")

          if "private var weeklyTarget" not in codigo:

              codigo = codigo.replace(
                  escala_marker,
                  escala_marker
                  + "\n"
                  + '    private var weeklyTarget:String="44:00"'
                  + "\n"
                  + "    private val weekModes=linkedMapOf<String,String>()",
                  1
              )

          # =====================================================
          # FUNÇÕES SEMANAIS
          # =====================================================

          if "private fun weekKey" not in codigo:

              helpers_semana = """
              private fun weekKey(date:Date):String{

                  val c=Calendar.getInstance()

                  c.time=date

                  c.set(
                      Calendar.DAY_OF_WEEK,
                      Calendar.MONDAY
                  )

                  c.set(Calendar.HOUR_OF_DAY,0)
                  c.set(Calendar.MINUTE,0)
                  c.set(Calendar.SECOND,0)
                  c.set(Calendar.MILLISECOND,0)

                  return SimpleDateFormat(
                      "yyyy-MM-dd",
                      Locale.US
                  ).format(c.time)
              }

              private fun modeForDate(date:Date):String{
                  return weekModes[
                      weekKey(date)
                  ] ?: "MF"
              }

              private fun modeForDay(date:Date):Boolean{

                  val c=Calendar.getInstance()

                  c.time=date

                  val day=
                      c.get(Calendar.DAY_OF_WEEK)

                  return if(modeForDate(date)=="MS"){

                      day!=Calendar.SUNDAY

                  }else{

                      day!=Calendar.SATURDAY &&
                      day!=Calendar.SUNDAY
                  }
              }

              private fun modeTitle(mode:String):String{

                  return if(mode=="MS"){

                      "Segunda a sábado — 07:20 por dia"

                  }else{

                      "Segunda a sexta — 08:48 por dia"
                  }
              }

              private fun weekLabel(date:Date):String{

                  val c=Calendar.getInstance()

                  c.time=date

                  c.set(
                      Calendar.DAY_OF_WEEK,
                      Calendar.MONDAY
                  )

                  val inicio=
                      SimpleDateFormat(
                          "dd/MM/yyyy",
                          Locale.US
                      ).format(c.time)

                  c.add(
                      Calendar.DAY_OF_MONTH,
                      6
                  )

                  val fim=
                      SimpleDateFormat(
                          "dd/MM/yyyy",
                          Locale.US
                      ).format(c.time)

                  return "$inicio até $fim"
              }

          """

              codigo = codigo.replace(
                  marcador,
                  helpers_semana + marcador,
                  1
              )

          # =====================================================
          # DURAÇÃO SEMANAL
          # =====================================================

          if "private fun durationMinutes" not in codigo:

              duration = """
              private fun normalizeDuration(
                  value:String
              ):String{

                  val digits=
                      value.filter{it.isDigit()}
                          .take(4)

                  if(digits.length!=4)return ""

                  val hour=
                      digits.substring(0,2)
                          .toIntOrNull()?:return ""

                  val minute=
                      digits.substring(2,4)
                          .toIntOrNull()?:return ""

                  if(hour !in 0..99)return ""
                  if(minute !in 0..59)return ""

                  return "%02d:%02d".format(
                      Locale.US,
                      hour,
                      minute
                  )
              }

              private fun durationMinutes(
                  value:String
              ):Int{

                  val v=normalizeDuration(value)

                  if(v.isBlank())return 0

                  return try{

                      val p=v.split(":")

                      p[0].toInt()*60+
                      p[1].toInt()

                  }catch(_:Exception){

                      0
                  }
              }

          """

              codigo = codigo.replace(
                  marcador,
                  duration + marcador,
                  1
              )

          # =====================================================
          # CARREGAR ESCALA SEMANAL
          # =====================================================

          if 'prefs.getString("weeklyTarget"' not in codigo:

              inicio_load=codigo.find(
                  "    private fun loadData() {"
              )

              if inicio_load==-1:
                  raise SystemExit(
                      "ERRO: loadData não encontrada"
                  )

              inicio_corpo=
                  codigo.find("\n",inicio_load)+1

              bloco_load = """
                  weeklyTarget=
                      normalizeDuration(
                          prefs.getString(
                              "weeklyTarget",
                              "44:00"
                          ) ?: "44:00"
                      ).ifBlank{"44:00"}

                  weekModes.clear()

                  try{

                      val obj=JSONObject(
                          prefs.getString(
                              "weekModes",
                              "{}"
                          ) ?: "{}"
                      )

                      val keys=obj.keys()

                      while(keys.hasNext()){

                          val key=keys.next()

                          weekModes[key]=
                              obj.optString(
                                  key,
                                  "MF"
                              )
                      }

                  }catch(_:Exception){

                      weekModes.clear()
                  }

              """

              codigo=(
                  codigo[:inicio_corpo]
                  +bloco_load
                  +codigo[inicio_corpo:]
              )

          # =====================================================
          # SALVAR ESCALA SEMANAL
          # =====================================================

          if 'putString("weeklyTarget"' not in codigo:

              salvar=
                  '        val e = prefs.edit().putString("records", ra.toString())'

              if salvar not in codigo:

                  raise SystemExit(
                      "ERRO: linha de saveData não encontrada"
                  )

              novo_salvar = """
                  val weekJson=JSONObject()

                  weekModes.forEach{
                      (k,v)->weekJson.put(k,v)
                  }

                  val e=prefs.edit()
                      .putString(
                          "records",
                          ra.toString()
                      )
                      .putString(
                          "weeklyTarget",
                          weeklyTarget
                      )
                      .putString(
                          "weekModes",
                          weekJson.toString()
                      )
              """

              codigo=codigo.replace(
                  salvar,
                  novo_salvar,
                  1
              )

          # =====================================================
          # EDIÇÃO MANUAL DOS HORÁRIOS
          # =====================================================

          codigo=codigo.replace(
              'val e=EditText(this).apply{setText(r.punches[index]);hint="HH:mm";inputType=2;setSingleLine()}',
              'val e=timeEdit(r.punches[index],punchNames[index])',
              1
          )

          codigo=codigo.replace(
              'r.punches[index]=e.text.toString();saveData();showPunch()',
              'r.punches[index]=normalizeTime(e.text.toString());saveData();showPunch()',
              1
          )

          codigo=codigo.replace(
              'val fields=r.punches.mapIndexed{i,v->EditText(this).apply{hint=punchNames[i];setText(v);inputType=2;setSingleLine();}}',
              'val fields=r.punches.mapIndexed{i,v->timeEdit(v,punchNames[i])}',
              1
          )

          codigo=codigo.replace(
              'fields.forEachIndexed{i,e->r.punches[i]=e.text.toString()};saveData();showHistory()',
              'fields.forEachIndexed{i,e->r.punches[i]=normalizeTime(e.text.toString())};saveData();showHistory()',
              1
          )

          # =====================================================
          # ESCALA
          # =====================================================

          inicio=codigo.find(
              "    private fun showScale() {"
          )

          fim=codigo.find(
              "    private fun employeeDialog",
              inicio
          )

          if inicio==-1 or fim==-1:
              raise SystemExit(
                  "ERRO: showScale não encontrada"
              )

          escala="""
              private fun showScale(){

                  val box=page("Escala Semanal")

                  box.addView(
                      infoCard(
                          "44:00 semanais — escolha Segunda a sexta ou Segunda a sábado."
                      )
                  )

                  fun semana(
                      titulo:String,
                      data:Date
                  ){

                      val key=weekKey(data)

                      val mode=modeForDate(data)

                      val row=card()

                      val line=
                          LinearLayout(this).apply{

                              orientation=
                                  LinearLayout.VERTICAL

                              setPadding(
                                  dp(12),
                                  dp(10),
                                  dp(12),
                                  dp(10)
                              )
                          }

                      line.addView(
                          TextView(this).apply{

                              text=titulo

                              textSize=18f

                              setTypeface(
                                  null,
                                  Typeface.BOLD
                              )

                              setTextColor(darkBlue)
                          }
                      )

                      line.addView(
                          TextView(this).apply{

                              text=weekLabel(data)

                              textSize=13f

                              setTextColor(muted)
                          }
                      )

                      line.addView(
                          TextView(this).apply{

                              text=modeTitle(mode)

                              textSize=15f

                              setTypeface(
                                  null,
                                  Typeface.BOLD
                              )

                              setTextColor(darkBlue)

                              setPadding(
                                  0,
                                  dp(6),
                                  0,
                                  dp(6)
                              )
                          }
                      )

                      val mf=
                          Button(this).apply{

                              text=
                                  "Segunda a sexta — 08:48"

                              isAllCaps=false
                          }

                      mf.setOnClickListener{

                          weekModes[key]="MF"

                          saveData()

                          showScale()
                      }

                      val ms=
                          Button(this).apply{

                              text=
                                  "Segunda a sábado — 07:20"

                              isAllCaps=false
                          }

                      ms.setOnClickListener{

                          weekModes[key]="MS"

                          saveData()

                          showScale()
                      }

                      line.addView(mf)
                      line.addView(ms)

                      row.addView(line)

                      box.addView(
                          row,
                          LinearLayout.LayoutParams(
                              -1,
                              dp(245)
                          ).apply{

                              bottomMargin=dp(10)
                          }
                      )
                  }

                  val hoje=Date()

                  val proxima=
                      Calendar.getInstance().apply{

                          time=hoje

                          set(
                              Calendar.DAY_OF_WEEK,
                              Calendar.MONDAY
                          )

                          add(
                              Calendar.DAY_OF_MONTH,
                              7
                          )
                      }.time

                  semana(
                      "Semana atual",
                      hoje
                  )

                  semana(
                      "Próxima semana",
                      proxima
                  )

                  box.addView(
                      infoCard(
                          "Padrão: Segunda a sexta = 08:48 por dia. " +
                          "Quando selecionar Segunda a sábado, serão 07:20 por dia."
                      )
                  )
              }

          """

          codigo=
              codigo[:inicio]+
              escala+
              codigo[fim:]

          # =====================================================
          # CÁLCULO CORRETO DAS BATIDAS
          # =====================================================

          inicio=codigo.find(
              "    private fun calculate(r:PunchDay):Calc{"
          )

          fim=codigo.find(
              "    private fun minutesBetween",
              inicio
          )

          if inicio==-1 or fim==-1:
              raise SystemExit(
                  "ERRO: calculate não encontrada"
              )

          calculo="""
              private fun calculate(
                  r:PunchDay
              ):Calc{

                  var worked=0

                  worked+=minutesBetween(
                      r.punches[0],
                      r.punches[1]
                  )

                  val seis=
                      r.punches[3].isNotBlank() ||
                      r.punches[4].isNotBlank()

                  if(seis){

                      worked+=minutesBetween(
                          r.punches[2],
                          r.punches[3]
                      )

                      worked+=minutesBetween(
                          r.punches[4],
                          r.punches[5]
                      )

                  }else{

                      worked+=minutesBetween(
                          r.punches[2],
                          r.punches[5]
                      )
                  }

                  val data=parseIso(r.date)

                  if(!modeForDay(data)){

                      return Calc(
                          worked,
                          0,
                          0,
                          worked
                      )
                  }

                  val semanal=
                      durationMinutes(
                          weeklyTarget
                      )

                  val dias=
                      if(
                          modeForDate(data)=="MS"
                      ){
                          6
                      }else{
                          5
                      }

                  val expected=
                      semanal/dias

                  val extra=
                      max(
                          0,
                          worked-expected
                      )

                  return Calc(
                      worked,
                      expected,
                      extra,
                      0
                  )
              }

          """

          codigo=
              codigo[:inicio]+
              calculo+
              codigo[fim:]

          # =====================================================
          # CÁLCULO DOS MINUTOS
          # =====================================================

          inicio=codigo.find(
              "    private fun minutesBetween(a:String,b:String):Int{"
          )

          fim=codigo.find(
              "    private fun formatMin",
              inicio
          )

          if inicio==-1 or fim==-1:
              raise SystemExit(
                  "ERRO: minutesBetween não encontrada"
              )

          minutos="""
              private fun minutesBetween(
                  a:String,
                  b:String
              ):Int{

                  val x=normalizeTime(a)
                  val y=normalizeTime(b)

                  if(
                      x.isBlank() ||
                      y.isBlank()
                  )return 0

                  return try{

                      val xa=x.split(":")
                      val ya=y.split(":")

                      val inicio=
                          xa[0].toInt()*60+
                          xa[1].toInt()

                      val fim=
                          ya[0].toInt()*60+
                          ya[1].toInt()

                      max(
                          0,
                          fim-inicio
                      )

                  }catch(_:Exception){

                      0
                  }
              }

          """

          codigo=
              codigo[:inicio]+
              minutos+
              codigo[fim:]

          # =====================================================
          # FORMATO HH:MM
          # =====================================================

          inicio=codigo.find(
              "    private fun formatMin"
          )

          if inicio==-1:
              raise SystemExit(
                  "ERRO: formatMin não encontrada"
              )

          fim=codigo.find(
              "\n",
              inicio
          )

          if fim==-1:
              fim=len(codigo)

          codigo=(
              codigo[:inicio]
              +
              '    private fun formatMin(m:Int):String="%02d:%02d".format(Locale.US,max(0,m)/60,max(0,m)%60)'
              +
              codigo[fim:]
          )

          # =====================================================
          # VALIDAÇÃO
          # =====================================================

          obrigatorias=[
              "private fun normalizeTime",
              "private fun timeEdit",
              "private fun normalizeDuration",
              "private fun durationMinutes",
              "private fun weekKey",
              "private fun modeForDate",
              "private fun modeForDay",
              "private fun calculate",
              "private fun minutesBetween",
              "private var weeklyTarget",
              "private val weekModes"
          ]

          for item in obrigatorias:

              if item not in codigo:

                  raise SystemExit(
                      "ERRO FINAL: "+item
                  )

          abertas=codigo.count("{")
          fechadas=codigo.count("}")

          print(
              "Linhas finais:",
              len(codigo.splitlines())
          )

          print(
              "Chaves:",
              abertas,
              fechadas
          )

          if abertas!=fechadas:

              raise SystemExit(
                  "ERRO FINAL: chaves Kotlin incompatíveis"
              )

          arquivo.write_text(
              codigo,
              encoding="utf-8"
          )

          print(
              "MAINACTIVITY CORRIGIDA COM SUCESSO"
          )

      # ==========================================================
      # NOVA CORREÇÃO — DATA RETROATIVA
      # ==========================================================

      - name: Adicionar seleção de data ao Ponto
        shell: python
        run: |
          from pathlib import Path

          arquivo=Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          codigo=arquivo.read_text(
              encoding="utf-8"
          )

          def replace_once(
              antigo,
              novo,
              nome
          ):

              global codigo

              quantidade=codigo.count(antigo)

              if quantidade!=1:

                  raise SystemExit(
                      f"ERRO {nome}: "
                      f"esperado 1 ocorrência, "
                      f"encontrado {quantidade}"
                  )

              codigo=codigo.replace(
                  antigo,
                  novo,
                  1
              )

          # ======================================================
          # VARIÁVEL DA DATA
          # ======================================================

          marcador=\
              "    private var selectedEmployeeId = 0L"

          if marcador not in codigo:

              raise SystemExit(
                  "ERRO: selectedEmployeeId não encontrado"
              )

          if "private var selectedPunchDate" not in codigo:

              codigo=codigo.replace(
                  marcador,
                  marcador
                  +
                  "\n"
                  +
                  "    private var selectedPunchDate:String = today()",
                  1
              )

          # ======================================================
          # FUNÇÕES DE DATA
          # ======================================================

          marcador_data=\
              "    private fun getRecord(empId:Long,date:String):PunchDay{"

          if marcador_data not in codigo:

              raise SystemExit(
                  "ERRO: getRecord não encontrado"
              )

          if "private fun choosePunchDate" not in codigo:

              funcoes="""
              private fun displayPunchDate(
                  value:String
              ):String{

                  return try{

                      df.format(
                          parseIso(value)
                      )

                  }catch(_:Exception){

                      df.format(Date())
                  }
              }

              private fun choosePunchDate(){

                  val atual=
                      parseIso(
                          selectedPunchDate
                      )

                  val cal=
                      Calendar.getInstance()

                  cal.time=atual

                  val dialog=
                      DatePickerDialog(
                          this,
                          { _,year,month,day ->

                              val escolhida=
                                  Calendar.getInstance()

                              escolhida.set(
                                  year,
                                  month,
                                  day,
                                  0,
                                  0,
                                  0
                              )

                              escolhida.set(
                                  Calendar.MILLISECOND,
                                  0
                              )

                              if(
                                  escolhida.timeInMillis
                                  >
                                  System.currentTimeMillis()
                              ){

                                  Toast.makeText(
                                      this,
                                      "Não é possível lançar ponto em data futura.",
                                      Toast.LENGTH_SHORT
                                  ).show()

                                  return@DatePickerDialog
                              }

                              selectedPunchDate=
                                  iso.format(
                                      escolhida.time
                                  )

                              showPunch()
                          },
                          cal.get(
                              Calendar.YEAR
                          ),
                          cal.get(
                              Calendar.MONTH
                          ),
                          cal.get(
                              Calendar.DAY_OF_MONTH
                          )
                      )

                  dialog.datePicker.maxDate=
                      System.currentTimeMillis()

                  dialog.setTitle(
                      "Selecionar data do ponto"
                  )

                  dialog.show()
              }

          """

              codigo=codigo.replace(
                  marcador_data,
                  funcoes+
                  marcador_data,
                  1
              )

          # ======================================================
          # TROCAR FUNCIONÁRIO = HOJE
          # ======================================================

          replace_once(
              'if (employees[pos].id != selectedEmployeeId) { selectedEmployeeId = employees[pos].id; showPunch() }',
              'if (employees[pos].id != selectedEmployeeId) { selectedEmployeeId = employees[pos].id; selectedPunchDate=today(); showPunch() }',
              "troca funcionário"
          )

          # ======================================================
          # DATA MOSTRADA NA TELA
          # ======================================================

          replace_once(
              'text = "Hoje\\n${df.format(Date())}"',
              'text = "Data do ponto\\n${displayPunchDate(selectedPunchDate)}"',
              "texto data"
          )

          # ======================================================
          # CARD DA DATA CLICÁVEL
          # ======================================================

          marcador_card=\
              "            addView(line)\n        }, LinearLayout.LayoutParams(-1, -2).apply{bottomMargin=dp(12)})"

          if marcador_card not in codigo:

              raise SystemExit(
                  "ERRO: cartão da data não encontrado"
              )

          codigo=codigo.replace(
              marcador_card,
              "            line.setOnClickListener { choosePunchDate() }\n"
              +
              "            addView(line)\n"
              +
              "        }, LinearLayout.LayoutParams(-1, -2).apply{bottomMargin=dp(12)})",
              1
          )

          # ======================================================
          # REGISTRO USA A DATA SELECIONADA
          # ======================================================

          replace_once(
              "val rec = getRecord(emp.id, today())",
              "val rec = getRecord(emp.id, selectedPunchDate)",
              "registro selecionado"
          )

          replace_once(
              "val r = getRecord(emp.id, today())",
              "val r = getRecord(emp.id, selectedPunchDate)",
              "gravação selecionada"
          )

          # ======================================================
          # ABRIR APP = HOJE
          # ======================================================

          marcador_oncreate=\
              "        loadData()"

          pos_oncreate=codigo.find(
              "override fun onCreate"
          )

          if pos_oncreate==-1:

              raise SystemExit(
                  "ERRO: onCreate não encontrado"
              )

          fim_oncreate=codigo.find(
              "        loadData()",
              pos_oncreate
          )

          if fim_oncreate==-1:

              raise SystemExit(
                  "ERRO: loadData do onCreate não encontrado"
              )

          trecho=codigo[
              pos_oncreate:
              fim_oncreate+len("        loadData()")
          ]

          if "selectedPunchDate=today()" not in trecho:

              codigo=codigo.replace(
                  "        loadData()",
                  "        loadData()\n"
                  "        selectedPunchDate=today()",
                  1
              )

          # ======================================================
          # VALIDAÇÃO
          # ======================================================

          obrigatorias=[
              "private var selectedPunchDate",
              "private fun displayPunchDate",
              "private fun choosePunchDate",
              'dialog.datePicker.maxDate',
              "selectedPunchDate=today()",
              "getRecord(emp.id, selectedPunchDate)"
          ]

          for item in obrigatorias:

              if item not in codigo:

                  raise SystemExit(
                      "ERRO DATA: faltou "+item
                  )

          abertas=codigo.count("{")
          fechadas=codigo.count("}")

          if abertas!=fechadas:

              raise SystemExit(
                  f"ERRO DATA: chaves {abertas}/{fechadas}"
              )

          arquivo.write_text(
              codigo,
              encoding="utf-8"
          )

          print("================================")
          print("DATA RETROATIVA APLICADA")
          print("================================")
          print("Data inicial: HOJE")
          print("Datas anteriores: PERMITIDAS")
          print("Data futura: BLOQUEADA")
          print("Troca funcionário: VOLTA PARA HOJE")
          print("Reabertura aplicativo: HOJE")
          print("Registro usa data selecionada: OK")
          print("Histórico por data preservado: OK")
          print("Chaves:",abertas,fechadas)
          print("================================")

      # ==========================================================
      # VALIDAR CÓDIGO
      # ==========================================================

      - name: Validar código
        shell: python
        run: |
          from pathlib import Path

          p=Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          s=p.read_text(
              encoding="utf-8"
          )

          itens=[
              "private fun normalizeTime",
              "private fun timeEdit",
              "private fun durationMinutes",
              "private fun weekKey",
              "private fun calculate",
              "private fun minutesBetween",
              "private var weeklyTarget",
              "private val weekModes",
              "private var selectedPunchDate",
              "private fun choosePunchDate",
              "private fun displayPunchDate",
              "selectedPunchDate=today()",
              "getRecord(emp.id, selectedPunchDate)"
          ]

          for item in itens:

              if item not in s:

                  raise SystemExit(
                      "ERRO DE VALIDACAO: "+item
                  )

          if s.count("{")!=s.count("}"):

              raise SystemExit(
                  "ERRO DE VALIDACAO: chaves incompatíveis"
              )

          print("================================")
          print("CÓDIGO VALIDADO")
          print("DATA RETROATIVA: OK")
          print("ESCALA: OK")
          print("HORÁRIOS: OK")
          print("CÁLCULO: OK")
          print("================================")

      # ==========================================================
      # GRADLE
      # ==========================================================

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      # ==========================================================
      # LIMPAR
      # ==========================================================

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon

      # ==========================================================
      # GERAR APK
      # ==========================================================

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "========================================"
          echo "APK GERADO COM SUCESSO"
          echo "========================================"

          ls -lh "$APK"

      # ==========================================================
      # VERIFICAR APK
      # ==========================================================

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK VALIDADO"

      # ==========================================================
      # PUBLICAR APK
      # ==========================================================

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
