name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name, next_name):

              start = workflow.index(
                  f"      - name: {name}"
              )

              end = workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              pos = block.index(marker) + len(marker)

              lines = block[pos:].splitlines()

              return "\n".join(
                  line[10:]
                  if line.startswith("          ")
                  else line
                  for line in lines
              ) + "\n"

          scripts = [
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for i, script in enumerate(scripts):

              p = (
                  Path(tempfile.gettempdir()) /
                  f"base70_{i}.py"
              )

              p.write_text(
                  script,
                  encoding="utf-8"
              )

              subprocess.run(
                  ["python", str(p)],
                  check=True
              )

          print("BASE 70 APLICADA")

      - name: Aplicar funcionalidades da versão 80
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          start = workflow.index(
              "      - name: Aplicar correções finais da Base 70, edição por rolagem e ícone"
          )

          end = workflow.index(
              "      - name: Validar código e ícone",
              start
          )

          block = workflow[start:end]

          marker = "        run: |\n"

          pos = block.index(marker) + len(marker)

          lines = block[pos:].splitlines()

          script = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in lines
          ) + "\n"

          p = (
              Path(tempfile.gettempdir())
              / "funcionalidades.py"
          )

          p.write_text(
              script,
              encoding="utf-8"
          )

          subprocess.run(
              ["python", str(p)],
              check=True
          )

          print("FUNCIONALIDADES DA VERSÃO 80 APLICADAS")

      - name: Criar som mecânico da roleta
        shell: python
        run: |
          from pathlib import Path
          import wave
          import math
          import struct

          raw = Path(
              "ControleHoras/app/src/main/res/raw"
          )

          raw.mkdir(
              parents=True,
              exist_ok=True
          )

          filename = raw / "roller_click.wav"

          rate = 44100
          duration = 0.035

          frames = []

          for i in range(
              int(rate * duration)
          ):

              t = i / rate

              a = (
                  0.45
                  * math.exp(-85 * t)
                  * math.sin(
                      2 * math.pi * 1850 * t
                  )
              )

              b = (
                  0.22
                  * math.exp(-130 * t)
                  * math.sin(
                      2 * math.pi * 3200 * t
                  )
              )

              value = max(
                  -1.0,
                  min(
                      1.0,
                      a + b
                  )
              )

              frames.append(
                  struct.pack(
                      "<h",
                      int(value * 32767)
                  )
              )

          with wave.open(
              str(filename),
              "wb"
          ) as wav:

              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)

              wav.writeframes(
                  b"".join(frames)
              )

          print("SOM DA ROLETA CRIADO")

      - name: Corrigir tela e instalar roleta personalizada
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          # ----------------------------------------------------------
          # IMPORTANTE:
          # Esta versão contém a implementação completa da roleta.
          # ----------------------------------------------------------

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "39fc6bba4ee9c420fee5d398a9974b793d8aaec7/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          step_name = (
              "      - name: "
              "Corrigir tela e instalar roleta personalizada"
          )

          start = workflow.index(
              step_name
          )

          # ----------------------------------------------------------
          # NÃO usar index() aqui.
          #
          # O texto "Validar projeto antes do Gradle" também aparece
          # dentro do código Python da própria etapa.
          #
          # rfind() pega a etapa YAML verdadeira que vem depois.
          # ----------------------------------------------------------

          end = workflow.rfind(
              "      - name: Validar projeto antes do Gradle"
          )

          if end <= start:

              raise SystemExit(
                  "ERRO: limite final da etapa da roleta não encontrado"
              )

          block = workflow[start:end]

          marker = "        run: |\n"

          marker_pos = block.index(
              marker
          )

          pos = (
              marker_pos
              + len(marker)
          )

          lines = block[pos:].splitlines()

          script = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in lines
          ) + "\n"

          # ----------------------------------------------------------
          # Remove eventual linha residual de YAML.
          # ----------------------------------------------------------

          if script.startswith("|"):

              script = script[
                  1:
              ].lstrip("\n")

          # ----------------------------------------------------------
          # CORREÇÃO DO ERRO DO TRIPLE-QUOTE
          #
          # O código antigo tinha:
          #
          # code.replace(
          #     '''if(...) ... ''',
          #     ""
          # )
          #
          # Isso estava dentro de outra string Python e provocava:
          #
          # SyntaxError: unterminated string literal
          #
          # Esse bloco não é mais necessário porque o novo
          # showEditWheel já permite editar batidas vazias.
          # ----------------------------------------------------------

          bad_start = script.find(
              "# PERMITIR EDITAR BATIDA VAZIA"
          )

          if bad_start >= 0:

              bad_end = script.find(
                  "# GARANTIR MANIFESTO",
                  bad_start
              )

              if bad_end < 0:

                  raise SystemExit(
                      "ERRO: bloco antigo encontrado, "
                      "mas seu final não foi localizado"
                  )

              script = (
                  script[:bad_start]
                  + script[bad_end:]
              )

              print(
                  "BLOCO ANTIGO DE BATIDA VAZIA REMOVIDO"
              )

          # ----------------------------------------------------------
          # Também remove uma eventual ocorrência de:
          #
          # import re
          #
          # somente se estiver duplicada não é necessário,
          # portanto deixamos o código original intacto.
          # ----------------------------------------------------------

          # ----------------------------------------------------------
          # TESTE DE SINTAXE ANTES DA EXECUÇÃO
          # ----------------------------------------------------------

          try:

              compile(
                  script,
                  "corrigir_tela.py",
                  "exec"
              )

          except SyntaxError as exc:

              print(
                  "========================================"
              )

              print(
                  "ERRO DE SINTAXE NO SCRIPT DA ROLETA"
              )

              print(
                  f"Linha: {exc.lineno}"
              )

              print(
                  f"Coluna: {exc.offset}"
              )

              print(
                  f"Texto: {exc.text}"
              )

              print(
                  "========================================"
              )

              raise

          print(
              "SINTAXE DO SCRIPT DA ROLETA OK"
          )

          # ----------------------------------------------------------
          # Salva o script temporariamente.
          # ----------------------------------------------------------

          p = (
              Path(tempfile.gettempdir())
              / "corrigir_tela.py"
          )

          p.write_text(
              script,
              encoding="utf-8"
          )

          # ----------------------------------------------------------
          # Executa a correção.
          # ----------------------------------------------------------

          subprocess.run(
              [
                  "python",
                  str(p)
              ],
              check=True
          )

          print(
              "TELA + ROLETA + SOM APLICADOS"
          )

      - name: Validar projeto antes do Gradle
        shell: bash
        run: |
          set -e

          SRC="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          ICON="ControleHoras/app/src/main/res/drawable/controlehoras_icon.jpg"

          SOUND="ControleHoras/app/src/main/res/raw/roller_click.wav"

          test -s "$SRC"
          test -s "$ICON"
          test -s "$SOUND"

          grep -q \
            "ControleHorasTimeWheelView" \
            "$SRC"

          grep -q \
            "showControleHorasWheelDialog" \
            "$SRC"

          grep -q \
            "controleHorasPunchPage" \
            "$SRC"

          grep -q \
            "punchNames" \
            "$SRC"

          grep -q \
            'controlehoras_icon' \
            ControleHoras/app/src/main/AndroidManifest.xml

          if grep -q "NumberPicker(" "$SRC"; then
              echo "ERRO: NumberPicker encontrado"
              exit 1
          fi

          if grep -q "Esse registro ainda está vazio" "$SRC"; then
              echo "ERRO: mensagem antiga encontrada"
              exit 1
          fi

          echo "VALIDAÇÃO DO PROJETO OK"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

          echo "APK GERADO COM SUCESSO"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t \
            "$APK" \
            >/dev/null

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
