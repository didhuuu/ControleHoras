              )

              for(i in 0 until jb.length()){
                  extra2ReturnEnabled.add(
                      jb.optString(i)
                  )
              }

          }catch(_:Exception){}
"""

              code = code.replace(
                  anchor,
                  load_block + anchor,
                  1
              )

              anchor = "        e.apply()\n"

              if anchor not in code:
                  raise SystemExit(
                      "ERRO: e.apply não encontrado"
                  )

              save_block = """        val extraJson=JSONArray()
          extra2Enabled.forEach{
              extraJson.put(it)
          }

          e.putString(
              "extra2Enabled",
              extraJson.toString()
          )

          val extraReturnJson=JSONArray()

          extra2ReturnEnabled.forEach{
              extraReturnJson.put(it)
          }

          e.putString(
              "extra2ReturnEnabled",
              extraReturnJson.toString()
          )
"""

              code = code.replace(
                  anchor,
                  save_block + anchor,
                  1
              )

          if "private fun extraKey" not in code:

              anchor = (
                  "    private fun today()="
                  "iso.format(Date())\n"
