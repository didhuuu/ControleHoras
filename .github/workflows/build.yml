name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip
          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml

      - name: Aplicar MainActivity corrigida
        shell: python
        env:
          MAIN_B64: ""
        run: |
          from pathlib import Path
          import base64
          import gzip
          import os

          root = Path("ControleHoras")
          main = root / "app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          manifest = root / "app/src/main/AndroidManifest.xml"
          xml = root / "app/src/main/res/xml"
          xml.mkdir(parents=True, exist_ok=True)

          main.write_bytes(
              gzip.decompress(
                  base64.b64decode(os.environ["MAIN_B64"])
              )
          )

          m = manifest.read_text(encoding="utf-8")

          if "androidx.core.content.FileProvider" not in m:
              provider = """
              <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="${applicationId}.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data
                      android:name="android.support.FILE_PROVIDER_PATHS"
                      android:resource="@xml/paths" />
              </provider>
              """

              m = m.replace(
                  "</application>",
                  provider + "</application>"
              )
          else:
              m = m.replace(
                  'android:resource="@xml/file_paths"',
                  'android:resource="@xml/paths"'
              )

          manifest.write_text(m, encoding="utf-8")

          (xml / "paths.xml").write_text(
              """<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
          </paths>
          """,
              encoding="utf-8"
          )

          s = main.read_text(encoding="utf-8")

          required = [
              "selectedPunchDate",
              "choosePunchDate",
              "normalizeTime",
              "weekModes",
              "DSR sobre horas extras",
              "FileProvider"
          ]

          for item in required:
              assert item in s, "FALTANDO: " + item

          print(
              "MainActivity OK:",
              len(s.splitlines()),
              "linhas"
          )

      - name: Validar código
        shell: bash
        run: |
          set -e

          test -s ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt
          test -s ControleHoras/app/src/main/res/xml/paths.xml

          grep -q 'selectedPunchDate' ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt
          grep -q 'DSR sobre horas extras' ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "VALIDAÇÃO OK"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" --version

      - name: Gerar APK
        working-directory: ControleHoras
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
