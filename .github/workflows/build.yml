name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip
          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt
          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess, tempfile

          url="https://raw.githubusercontent.com/didhuuu/ControleHoras/6381d26e525e1f9eeb91af17cdb9fed66293c1f2/.github/workflows/build.yml"

          workflow=urlopen(url,timeout=30).read().decode("utf-8")

          def extract_step(name,next_name):
              start=workflow.index(f"      - name: {name}")
              end=workflow.index(f"      - name: {next_name}",start)
              block=workflow[start:end]
              marker="        run: |\n"
              pos=block.index(marker)+len(marker)
              lines=block[pos:].splitlines()
              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in lines
              )+"\n"

          scripts=[
              extract_step("Aplicar versão 36","Adicionar seleção de data"),
              extract_step("Adicionar seleção de data","Validar código")
          ]

          for i,script in enumerate(scripts):
              p=Path(tempfile.gettempdir())/f"base70_{i}.py"
              p.write_text(script,encoding="utf-8")
              subprocess.run(["python",str(p)],check=True)

          print("BASE DA VERSÃO 70 APLICADA")

      - name: Aplicar correções finais da Base 70, edição por rolagem e ícone
        shell: python
        run: |
          from pathlib import Path
          import base64

          root=Path('ControleHoras')
          src=root/'app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt'
          manifest=root/'app/src/main/AndroidManifest.xml'
          code=src.read_text(encoding='utf-8')

          # Extra interval state
          if 'private val extra2Enabled' not in code:
              anchors=[
                  '    private val weekModes=linkedMapOf<String,String>()\n',
                  '    private val weekModes = linkedMapOf<String,String>()\n'
              ]

              for a in anchors:
                  if a in code:
                      code=code.replace(
                          a,
                          a+
                          '    private val extra2Enabled=mutableSetOf<String>()\n'
                          '    private val extra2ReturnEnabled=mutableSetOf<String>()\n',
                          1
                      )
                      break
              else:
                  raise SystemExit('ERRO: weekModes não encontrado')

          if 'prefs.getString("extra2Enabled"' not in code:
              anchor='        scale.clear()\n'

              if anchor not in code:
                  raise SystemExit('ERRO: scale.clear não encontrado')

              block='''        extra2Enabled.clear()
                  extra2ReturnEnabled.clear()
                  try{
                      val ja=JSONArray(prefs.getString("extra2Enabled","[]") ?: "[]")
                      for(i in 0 until ja.length()) extra2Enabled.add(ja.optString(i))

                      val jb=JSONArray(prefs.getString("extra2ReturnEnabled","[]") ?: "[]")
                      for(i in 0 until jb.length()) extra2ReturnEnabled.add(jb.optString(i))
                  }catch(_:Exception){}

          '''

              code=code.replace(anchor,block+anchor,1)

              anchor='        e.apply()\n'

              if anchor not in code:
                  raise SystemExit('ERRO: e.apply não encontrado')

              block='''        val extraJson=JSONArray()
                  extra2Enabled.forEach{extraJson.put(it)}
                  e.putString("extra2Enabled",extraJson.toString())

                  val extraReturnJson=JSONArray()
                  extra2ReturnEnabled.forEach{extraReturnJson.put(it)}
                  e.putString("extra2ReturnEnabled",extraReturnJson.toString())
          '''

              code=code.replace(anchor,block+anchor,1)

          # Helpers
          if 'private fun extraKey' not in code:
              anchor='    private fun today()=iso.format(Date())\n'

              if anchor not in code:
                  raise SystemExit('ERRO: today não encontrado')

              block='''    private fun extraKey(empId:Long,date:String)=empId.toString()+"|"+date
              private fun extraEnabled(empId:Long,date:String)=extra2Enabled.contains(extraKey(empId,date))
              private fun extraReturnEnabled(empId:Long,date:String)=extra2ReturnEnabled.contains(extraKey(empId,date))

              private fun setExtraEnabled(empId:Long,date:String,value:Boolean){
                  val k=extraKey(empId,date)
                  if(value) extra2Enabled.add(k)
                  else {
                      extra2Enabled.remove(k)
                      extra2ReturnEnabled.remove(k)
                  }
                  saveData()
              }

              private fun setExtraReturnEnabled(empId:Long,date:String,value:Boolean){
                  val k=extraKey(empId,date)
                  if(value && extra2Enabled.contains(k))
                      extra2ReturnEnabled.add(k)
                  else
                      extra2ReturnEnabled.remove(k)

                  saveData()
              }

          '''

              code=code.replace(anchor,block+anchor,1)

          # Replace only Ponto screen and its registration helpers.
          # Other tabs remain untouched.
          start=code.find('    private fun showPunch()')
          end=code.find('    private fun showHistory()',start)

          if start<0 or end<0:
              raise SystemExit('ERRO: showPunch/showHistory não encontrados')

          show='''    private fun showPunch(){
                  val box=page("Bater Ponto")

                  if(employees.isEmpty()){
                      box.addView(
                          infoCard(
                              "Nenhum funcionário cadastrado.\\nCadastre o primeiro em Funcionários."
                          )
                      )
                      return
                  }

                  val emp=employees.firstOrNull{it.id==selectedEmployeeId}
                      ?:employees.first().also{selectedEmployeeId=it.id}

                  box.addView(card().apply{
                      val line=LinearLayout(context).apply{
                          orientation=LinearLayout.VERTICAL
                          setPadding(dp(16),dp(12),dp(16),dp(12))
                      }

                      line.addView(label("Funcionário"))

                      val spinner=Spinner(context)

                      spinner.adapter=ArrayAdapter(
                          context,
                          android.R.layout.simple_spinner_dropdown_item,
                          employees.map{it.name}
                      )

                      spinner.setSelection(
                          employees
                              .indexOfFirst{it.id==selectedEmployeeId}
                              .coerceAtLeast(0)
                      )

                      spinner.onItemSelectedListener=
                          object:AdapterView.OnItemSelectedListener{

                              override fun onNothingSelected(
                                  p:AdapterView<*>?
                              ){}

                              override fun onItemSelected(
                                  p:AdapterView<*>?,
                                  v:View?,
                                  pos:Int,
                                  id:Long
                              ){
                                  if(employees[pos].id!=selectedEmployeeId){
                                      selectedEmployeeId=employees[pos].id
                                      selectedPunchDate=today()
                                      showPunch()
                                  }
                              }
                          }

                      line.addView(spinner)

                      line.addView(
                          TextView(context).apply{
                              text="Salário mensal   ${money.format(emp.salary)}"
                              textSize=14f
                              setTextColor(muted)
                              setPadding(0,dp(8),0,0)
                          }
                      )

                      addView(line)

                  },0,0,0,dp(10))

                  val dateCard=card()

                  val dateLine=LinearLayout(this).apply{
                      orientation=LinearLayout.HORIZONTAL
                      gravity=Gravity.CENTER_VERTICAL
                      setPadding(dp(14),dp(8),dp(14),dp(8))
                  }

                  dateLine.addView(
                      TextView(this).apply{
                          text="📅"
                          textSize=25f
                      },
                      LinearLayout.LayoutParams(dp(45),dp(55))
                  )

                  dateLine.addView(
                      TextView(this).apply{
                          text="DATA\\n${df.format(parseIso(selectedPunchDate))}"
                          textSize=16f
                          setTypeface(null,Typeface.BOLD)
                          setTextColor(this@MainActivity.text)
                      },
                      LinearLayout.LayoutParams(0,dp(60),1f)
                  )

                  dateLine.addView(
                      Button(this).apply{
                          text="ALTERAR"
                          isAllCaps=false
                          setOnClickListener{
                              choosePunchDate()
                          }
                      },
                      LinearLayout.LayoutParams(dp(105),dp(52))
                  )

                  dateCard.addView(dateLine)

                  box.addView(
                      dateCard,
                      LinearLayout.LayoutParams(-1,dp(82)).apply{
                          bottomMargin=dp(8)
                      }
                  )

                  box.addView(
                      Button(this).apply{
                          text="✎  REGISTRO MANUAL"
                          isAllCaps=false
                          textSize=14f
                          setOnClickListener{
                              showManualWheel(emp.id)
                          }
                      },
                      LinearLayout.LayoutParams(-1,dp(54)).apply{
                          bottomMargin=dp(10)
                      }
                  )

                  val rec=getRecord(emp.id,selectedPunchDate)
                  val extra=extraEnabled(emp.id,selectedPunchDate)
                  val next=nextPunchIndex(rec,extra)

                  box.addView(
                      Button(this).apply{
                          text=
                              if(next<0)
                                  "PONTO DO DIA COMPLETO"
                              else
                                  "▶  REGISTRAR PRÓXIMA BATIDA\\n${punchNames[next]}"

                          textSize=15f
                          setTextColor(Color.WHITE)
                          isAllCaps=false
                          isEnabled=next>=0

                          background(
                              green,
                              dp(12),
                              dp(12),
                              dp(12),
                              dp(12)
                          )

                          setOnClickListener{
                              registerPunch(emp.id)
                          }
                      },
                      LinearLayout.LayoutParams(-1,dp(72)).apply{
                          bottomMargin=dp(10)
                      }
                  )

                  box.addView(
                      TextView(this).apply{
                          text="BATIDAS DO DIA"
                          textSize=13f
                          setTypeface(null,Typeface.BOLD)
                          setTextColor(muted)
                          setPadding(dp(4),dp(2),0,dp(6))
                      }
                  )

                  addPunchRow(box,rec,0,punchNames[0])
                  addPunchRow(box,rec,1,punchNames[1])
                  addPunchRow(box,rec,2,punchNames[2])
                  addPunchRow(box,rec,5,punchNames[5])

                  box.addView(
                      TextView(this).apply{
                          text="INTERVALO 2 (OPCIONAL)"
                          textSize=13f
                          setTypeface(null,Typeface.BOLD)
                          setTextColor(muted)
                          setPadding(dp(4),dp(8),0,dp(4))
                      }
                  )

                  addExtraSwitch(
                      box,
                      emp.id,
                      selectedPunchDate,
                      0,
                      rec
                  )

                  addExtraSwitch(
                      box,
                      emp.id,
                      selectedPunchDate,
                      1,
                      rec
                  )

                  val calc=calculate(rec)

                  val cards=LinearLayout(this).apply{
                      orientation=LinearLayout.HORIZONTAL
                  }

                  cards.addView(
                      metricCard(
                          "Horas trabalhadas",
                          formatMin(calc.worked),
                          blue
                      ),
                      LinearLayout.LayoutParams(0,dp(82),1f).apply{
                          rightMargin=dp(6)
                      }
                  )

                  cards.addView(
                      metricCard(
                          "Horas extras",
                          formatMin(calc.extra60+calc.extra100),
                          green
                      ),
                      LinearLayout.LayoutParams(0,dp(82),1f).apply{
                          leftMargin=dp(6)
                      }
                  )

                  box.addView(cards)
              }

              private fun addPunchRow(
                  box:LinearLayout,
                  rec:PunchDay,
                  index:Int,
                  name:String
              ){
                  val row=LinearLayout(this).apply{
                      orientation=LinearLayout.HORIZONTAL
                      gravity=Gravity.CENTER_VERTICAL
                      setPadding(dp(12),dp(4),dp(10),dp(4))
                      background(
                          Color.WHITE,
                          dp(12),
                          dp(12),
                          dp(12),
                          dp(12)
                      )
                      elevation=dp(1).toFloat()
                  }

                  row.addView(
                      TextView(this).apply{
                          text=(index+1).toString()
                          textSize=16f
                          gravity=Gravity.CENTER
                          setTypeface(null,Typeface.BOLD)
                          background(
                              0xFFEAF0F7.toInt(),
                              30,
                              30,
                              30,
                              30
                          )
                      },
                      LinearLayout.LayoutParams(dp(42),dp(42))
                  )

                  row.addView(
                      TextView(this).apply{
                          text=name
                          textSize=15f
                          setTextColor(this@MainActivity.text)
                          setPadding(dp(12),0,0,0)
                      },
                      LinearLayout.LayoutParams(0,dp(52),1f)
                  )

                  row.addView(
                      TextView(this).apply{
                          text=rec.punches[index].ifBlank{"--:--"}
                          textSize=15f
                          setTextColor(
                              if(rec.punches[index].isBlank())
                                  muted
                              else
                                  darkBlue
                          )
                          setTypeface(null,Typeface.BOLD)
                          gravity=Gravity.CENTER
                      }
                  )

                  row.setOnClickListener{
                      showEditWheel(rec,index)
                  }

                  box.addView(
                      row,
                      LinearLayout.LayoutParams(-1,dp(58)).apply{
                          bottomMargin=dp(7)
                      }
                  )
              }

              private fun addExtraSwitch(
                  box:LinearLayout,
                  empId:Long,
                  date:String,
                  which:Int,
                  rec:PunchDay
              ){
                  val enabled=
                      if(which==0)
                          extraEnabled(empId,date)
                      else
                          extraReturnEnabled(empId,date)

                  val index=
                      if(which==0)
                          3
                      else
                          4

                  val title=
                      if(which==0)
                          "Saída intervalo 2"
                      else
                          "Retorno intervalo 2"

                  val row=LinearLayout(this).apply{
                      orientation=LinearLayout.HORIZONTAL
                      gravity=Gravity.CENTER_VERTICAL
                      setPadding(dp(12),dp(5),dp(10),dp(5))
                      background(
                          Color.WHITE,
                          dp(12),
                          dp(12),
                          dp(12),
                          dp(12)
                      )
                      elevation=dp(1).toFloat()
                  }

                  row.addView(
                      TextView(this).apply{
                          text=(index+1).toString()
                          textSize=16f
                          gravity=Gravity.CENTER
                          setTypeface(null,Typeface.BOLD)
                          background(
                              0xFFEAF0F7.toInt(),
                              30,
                              30,
                              30,
                              30
                          )
                      },
                      LinearLayout.LayoutParams(dp(42),dp(42))
                  )

                  row.addView(
                      TextView(this).apply{
                          text=title
                          textSize=15f
                          setTextColor(this@MainActivity.text)
                          setPadding(dp(12),0,0,0)
                      },
                      LinearLayout.LayoutParams(0,dp(52),1f)
                  )

                  val sw=Switch(this).apply{
                      isChecked=enabled
                      text=if(isChecked)"ATIVO" else "ATIVAR"
                  }

                  if(which==1)
                      sw.isEnabled=extraEnabled(empId,date)

                  sw.setOnCheckedChangeListener{_,checked->
                      if(which==0)
                          setExtraEnabled(empId,date,checked)
                      else
                          setExtraReturnEnabled(empId,date,checked)

                      showPunch()
                  }

                  row.addView(sw)

                  box.addView(
                      row,
                      LinearLayout.LayoutParams(-1,dp(62)).apply{
                          bottomMargin=dp(7)
                      }
                  )

                  if(enabled)
                      addPunchRow(box,rec,index,title)
              }

              private fun nextPunchIndex(
                  r:PunchDay,
                  extra:Boolean
              ):Int{
                  if(r.punches[0].isBlank())return 0
                  if(r.punches[1].isBlank())return 1
                  if(r.punches[2].isBlank())return 2

                  if(extra && r.punches[3].isBlank())
                      return 3

                  if(
                      extra &&
                      extraReturnEnabled(r.employeeId,r.date) &&
                      r.punches[4].isBlank()
                  )
                      return 4

                  if(r.punches[5].isBlank())
                      return 5

                  return -1
              }

              private fun registerPunch(empId:Long){
                  val r=getRecord(empId,selectedPunchDate)

                  val n=nextPunchIndex(
                      r,
                      extraEnabled(empId,selectedPunchDate)
                  )

                  if(n<0)return

                  if(selectedPunchDate==today()){
                      r.punches[n]=nowTime()
                      saveData()
                      showPunch()
                      return
                  }

                  val e=timeEdit("",punchNames[n])

                  AlertDialog.Builder(this)
                      .setTitle("Lançar ${punchNames[n]}")
                      .setMessage(df.format(parseIso(selectedPunchDate)))
                      .setView(e)
                      .setNegativeButton("Cancelar",null)
                      .setPositiveButton("Salvar"){_,_->
                          val t=normalizeTime(e.text.toString())

                          if(t.isNotBlank()){
                              r.punches[n]=t
                              saveData()
                              showPunch()
                          }else{
                              Toast.makeText(
                                  this,
                                  "Horário inválido.",
                                  Toast.LENGTH_LONG
                              ).show()
                          }
                      }
                      .show()
              }

              private fun showEditWheel(
                  rec:PunchDay,
                  index:Int
              ){
                  if(rec.punches[index].isBlank()){
                      Toast.makeText(
                          this,
                          "Esse registro ainda está vazio. Use REGISTRO MANUAL.",
                          Toast.LENGTH_LONG
                      ).show()
                      return
                  }

                  val parts=rec.punches[index].split(":")

                  val currentHour=
                      parts.getOrNull(0)
                          ?.toIntOrNull()
                          ?.coerceIn(0,23)
                          ?:0

                  val currentMinute=
                      parts.getOrNull(1)
                          ?.toIntOrNull()
                          ?.coerceIn(0,59)
                          ?:0

                  val wrap=LinearLayout(this).apply{
                      orientation=LinearLayout.VERTICAL
                      gravity=Gravity.CENTER_HORIZONTAL
                      setPadding(dp(10),0,dp(10),0)
                  }

                  wrap.addView(
                      TextView(this).apply{
                          text="${punchNames[index]}\\n${df.format(parseIso(rec.date))}"
                          gravity=Gravity.CENTER
                          textSize=16f
                          setTypeface(null,Typeface.BOLD)
                          setTextColor(darkBlue)
                          setPadding(0,dp(4),0,dp(8))
                      }
                  )

                  val wheels=LinearLayout(this).apply{
                      orientation=LinearLayout.HORIZONTAL
                      gravity=Gravity.CENTER
                  }

                  val hour=NumberPicker(this).apply{
                      minValue=0
                      maxValue=23
                      value=currentHour
                      wrapSelectorWheel=true
                      descendantFocusability=
                          NumberPicker.FOCUS_BLOCK_DESCENDANTS
                  }

                  val minute=NumberPicker(this).apply{
                      minValue=0
                      maxValue=59
                      value=currentMinute
                      wrapSelectorWheel=true
                      descendantFocusability=
                          NumberPicker.FOCUS_BLOCK_DESCENDANTS
                  }

                  val sep=TextView(this).apply{
                      text=":"
                      textSize=28f
                      gravity=Gravity.CENTER
                  }

                  wheels.addView(
                      hour,
                      LinearLayout.LayoutParams(dp(88),dp(150))
                  )

                  wheels.addView(
                      sep,
                      LinearLayout.LayoutParams(dp(35),dp(150))
                  )

                  wheels.addView(
                      minute,
                      LinearLayout.LayoutParams(dp(88),dp(150))
                  )

                  wrap.addView(wheels)

                  val value=TextView(this).apply{
                      text="%02d:%02d".format(
                          Locale.US,
                          hour.value,
                          minute.value
                      )
                      textSize=24f
                      setTypeface(null,Typeface.BOLD)
                      setTextColor(blue)
                      gravity=Gravity.CENTER
                      setPadding(0,dp(5),0,dp(5))
                  }

                  val listener=
                      NumberPicker.OnValueChangeListener{_,_,_->
                          value.text="%02d:%02d".format(
                              Locale.US,
                              hour.value,
                              minute.value
                          )
                      }

                  hour.setOnValueChangedListener(listener)
                  minute.setOnValueChangedListener(listener)

                  wrap.addView(value)

                  val dialog=
                      AlertDialog.Builder(this)
                          .setTitle("Editar registro")
                          .setView(wrap)
                          .setNegativeButton("Cancelar",null)
                          .setPositiveButton("SALVAR",null)
                          .create()

                  dialog.setOnShowListener{
                      dialog
                          .getButton(AlertDialog.BUTTON_POSITIVE)
                          .setOnClickListener{
                              rec.punches[index]=
                                  "%02d:%02d".format(
                                      Locale.US,
                                      hour.value,
                                      minute.value
                                  )

                              saveData()
                              dialog.dismiss()
                              showPunch()
                          }
                  }

                  dialog.show()
              }

              private fun showManualWheel(empId:Long){
                  val r=getRecord(empId,selectedPunchDate)

                  val n=nextPunchIndex(
                      r,
                      extraEnabled(empId,selectedPunchDate)
                  )

                  if(n<0){
                      Toast.makeText(
                          this,
                          "As batidas disponíveis deste dia já estão preenchidas.",
                          Toast.LENGTH_LONG
                      ).show()
                      return
                  }

                  val wrap=LinearLayout(this).apply{
                      orientation=LinearLayout.VERTICAL
                      gravity=Gravity.CENTER_HORIZONTAL
                      setPadding(dp(10),0,dp(10),0)
                  }

                  wrap.addView(
                      TextView(this).apply{
                          text="${punchNames[n]}\\n${df.format(parseIso(selectedPunchDate))}"
                          gravity=Gravity.CENTER
                          textSize=16f
                          setTypeface(null,Typeface.BOLD)
                          setTextColor(darkBlue)
                          setPadding(0,dp(4),0,dp(8))
                      }
                  )

                  val wheels=LinearLayout(this).apply{
                      orientation=LinearLayout.HORIZONTAL
                      gravity=Gravity.CENTER
                  }

                  val now=Calendar.getInstance()

                  val hour=NumberPicker(this).apply{
                      minValue=0
                      maxValue=23
                      value=now.get(Calendar.HOUR_OF_DAY)
                      wrapSelectorWheel=true
                      descendantFocusability=
                          NumberPicker.FOCUS_BLOCK_DESCENDANTS
                  }

                  val minute=NumberPicker(this).apply{
                      minValue=0
                      maxValue=59
                      value=now.get(Calendar.MINUTE)
                      wrapSelectorWheel=true
                      descendantFocusability=
                          NumberPicker.FOCUS_BLOCK_DESCENDANTS
                  }

                  val sep=TextView(this).apply{
                      text=":"
                      textSize=28f
                      gravity=Gravity.CENTER
                  }

                  wheels.addView(
                      hour,
                      LinearLayout.LayoutParams(dp(88),dp(150))
                  )

                  wheels.addView(
                      sep,
                      LinearLayout.LayoutParams(dp(35),dp(150))
                  )

                  wheels.addView(
                      minute,
                      LinearLayout.LayoutParams(dp(88),dp(150))
                  )

                  wrap.add
