name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name, next_name):

              start = workflow.index(
                  f"      - name: {name}"
              )

              end = workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              pos = block.index(marker) + len(marker)

              lines = block[pos:].splitlines()

              return "\n".join(
                  line[10:]
                  if line.startswith("          ")
                  else line
                  for line in lines
              ) + "\n"

          scripts = [
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for i, script in enumerate(scripts):

              p = (
                  Path(tempfile.gettempdir())
                  / f"base70_{i}.py"
              )

              p.write_text(
                  script,
                  encoding="utf-8"
              )

              subprocess.run(
                  ["python", str(p)],
                  check=True
              )

          print(
              "BASE 70 APLICADA"
          )

      - name: Aplicar funcionalidades da versão 80
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          start = workflow.index(
              "      - name: Aplicar correções finais da Base 70, edição por rolagem e ícone"
          )

          end = workflow.index(
              "      - name: Validar código e ícone",
              start
          )

          block = workflow[start:end]

          marker = "        run: |\n"

          pos = (
              block.index(marker)
              + len(marker)
          )

          lines = block[pos:].splitlines()

          script = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in lines
          ) + "\n"

          p = (
              Path(tempfile.gettempdir())
              / "funcionalidades.py"
          )

          p.write_text(
              script,
              encoding="utf-8"
          )

          subprocess.run(
              ["python", str(p)],
              check=True
          )

          print(
              "FUNCIONALIDADES DA VERSÃO 80 APLICADAS"
          )

      - name: Criar som mecânico da roleta
        shell: python
        run: |
          from pathlib import Path
          import wave
          import math
          import struct

          raw = Path(
              "ControleHoras/app/src/main/res/raw"
          )

          raw.mkdir(
              parents=True,
              exist_ok=True
          )

          filename = raw / "roller_click.wav"

          rate = 44100
          duration = 0.035

          frames = []

          for i in range(
              int(rate * duration)
          ):

              t = i / rate

              a = (
                  0.45
                  * math.exp(-85 * t)
                  * math.sin(
                      2 * math.pi * 1850 * t
                  )
              )

              b = (
                  0.22
                  * math.exp(-130 * t)
                  * math.sin(
                      2 * math.pi * 3200 * t
                  )
              )

              value = max(
                  -1.0,
                  min(
                      1.0,
                      a + b
                  )
              )

              frames.append(
                  struct.pack(
                      "<h",
                      int(value * 32767)
                  )
              )

          with wave.open(
              str(filename),
              "wb"
          ) as wav:

              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)

              wav.writeframes(
                  b"".join(frames)
              )

          print(
              "SOM DA ROLETA CRIADO"
          )

      - name: Corrigir tela e instalar roleta personalizada
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile
          import re

          # ==========================================================
          # ARQUIVO PRINCIPAL
          # ==========================================================

          src = Path(
              "ControleHoras/app/src/main/java/"
              "com/didhuuu/controlehoras/MainActivity.kt"
          )

          if not src.exists():

              raise SystemExit(
                  "ERRO: MainActivity.kt não encontrado"
              )

          # ==========================================================
          # BAIXAR A IMPLEMENTAÇÃO ORIGINAL DA ROLETA
          # ==========================================================

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "39fc6bfb41ebc7b01d6c435a85b5228e735f3f2b/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          step_name = (
              "      - name: "
              "Corrigir tela e instalar roleta personalizada"
          )

          start = workflow.index(
              step_name
          )

          end = workflow.rfind(
              "      - name: Validar projeto antes do Gradle"
          )

          if end <= start:

              raise SystemExit(
                  "ERRO: etapa original da roleta não encontrada"
              )

          block = workflow[start:end]

          marker = "        run: |\n"

          pos = (
              block.index(marker)
              + len(marker)
          )

          lines = block[pos:].splitlines()

          script = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in lines
          ) + "\n"

          # ==========================================================
          # REMOVER O BLOCO PROBLEMÁTICO DE BATIDA VAZIA
          # ==========================================================

          bad_start = script.find(
              "# PERMITIR EDITAR BATIDA VAZIA"
          )

          if bad_start >= 0:

              bad_end = script.find(
                  "# GARANTIR MANIFESTO",
                  bad_start
              )

              if bad_end < 0:

                  raise SystemExit(
                      "ERRO: final do bloco de batida vazia não encontrado"
                  )

              script = (
                  script[:bad_start]
                  + script[bad_end:]
              )

              print(
                  "BLOCO ANTIGO DE BATIDA VAZIA REMOVIDO"
              )

          # ==========================================================
          # CORRIGIR main_index
          # ==========================================================

          script = script.replace(
              "main_index=\n"
              "        code.find(",
              "main_index = code.find("
          )

          script = script.replace(
              "main_index=\n"
              "    code.find(",
              "main_index = code.find("
          )

          # ==========================================================
          # EXTRAIR A IMPLEMENTAÇÃO COMPLETA DA FUNÇÃO DA ROLETA
          # DIRETAMENTE DA VARIÁVEL wheel_dialog DO SCRIPT ORIGINAL.
          # ==========================================================

          wheel_begin_marker = (
              "wheel_dialog = r'''"
          )

          wheel_end_marker = (
              "\n          '''"
          )

          wheel_begin = script.find(
              wheel_begin_marker
          )

          if wheel_begin < 0:

              raise SystemExit(
                  "ERRO: wheel_dialog não encontrado no script original"
              )

          wheel_begin += len(
              wheel_begin_marker
          )

          wheel_end = script.find(
              wheel_end_marker,
              wheel_begin
          )

          if wheel_end < 0:

              raise SystemExit(
                  "ERRO: fim de wheel_dialog não encontrado"
              )

          wheel_dialog = script[
              wheel_begin:wheel_end
          ]

          # ==========================================================
          # GRAVAR UMA CÓPIA DO SCRIPT ORIGINAL CORRIGIDO
          # ==========================================================

          fixed_script = script

          # ==========================================================
          # IMPEDIR O SCRIPT ANTIGO DE BLOQUEAR A ROLETA
          #
          # O código antigo verificava somente:
          #
          # showControleHorasWheelDialog(
          #
          # Isso pode encontrar uma chamada e não a declaração.
          #
          # A declaração real precisa ser:
          #
          # private fun showControleHorasWheelDialog(
          # ==========================================================

          fixed_script = fixed_script.replace(
              'if "showControleHorasWheelDialog(" not in code:',
              'if "private fun showControleHorasWheelDialog(" not in code:'
          )

          # ==========================================================
          # CORRIGIR A MESMA VERIFICAÇÃO CASO ESTEJA FORMATADA
          # EM MAIS DE UMA LINHA.
          # ==========================================================

          fixed_script = re.sub(
              r'if\s+"showControleHorasWheelDialog\("\s+not\s+in\s+code:',
              'if "private fun showControleHorasWheelDialog(" not in code:',
              fixed_script
          )

          # ==========================================================
          # VALIDAR SINTAXE DO SCRIPT ANTES DE EXECUTAR
          # ==========================================================

          compile(
              fixed_script,
              "corrigir_tela.py",
              "exec"
          )

          print(
              "SINTAXE DA ROLETA OK"
          )

          temp_script = (
              Path(tempfile.gettempdir())
              / "corrigir_tela.py"
          )

          temp_script.write_text(
              fixed_script,
              encoding="utf-8"
          )

          # ==========================================================
          # EXECUTAR A CORREÇÃO ORIGINAL
          # ==========================================================

          subprocess.run(
              [
                  "python",
                  str(temp_script)
              ],
              check=True
          )

          print(
              "SCRIPT ORIGINAL DA ROLETA EXECUTADO"
          )

          # ==========================================================
          # LER NOVAMENTE O MAINACTIVITY
          # ==========================================================

          code = src.read_text(
              encoding="utf-8"
          )

          # ==========================================================
          # CORREÇÃO DEFINITIVA:
          #
          # Se a declaração da roleta NÃO estiver presente,
          # nós mesmos inserimos a implementação completa.
          #
          # Não dependemos mais da decisão do script antigo.
          # ==========================================================

          function_signature = (
              "private fun showControleHorasWheelDialog("
          )

          if function_signature not in code:

              print(
                  "ROLETA NÃO FOI INSERIDA PELO SCRIPT ORIGINAL"
              )

              anchor = code.find(
                  "    private fun showManualWheel("
              )

              if anchor < 0:

                  raise SystemExit(
                      "ERRO: showManualWheel não encontrado para inserir a roleta"
                  )

              insertion = (
                  "\n"
                  + wheel_dialog
                  + "\n"
              )

              code = (
                  code[:anchor]
                  + insertion
                  + code[anchor:]
              )

              src.write_text(
                  code,
                  encoding="utf-8"
              )

              print(
                  "ROLETA INSERIDA DIRETAMENTE NO MainActivity.kt"
              )

          else:

              print(
                  "DECLARAÇÃO DA ROLETA JÁ EXISTE"
              )

          # ==========================================================
          # RECARREGAR APÓS A INSERÇÃO
          # ==========================================================

          code = src.read_text(
              encoding="utf-8"
          )

          # ==========================================================
          # GARANTIR MANIFESTO
          # ==========================================================

          manifest = Path(
              "ControleHoras/app/src/main/AndroidManifest.xml"
          )

          m = manifest.read_text(
              encoding="utf-8"
          )

          if (
              'android:icon="@drawable/controlehoras_icon"'
              not in m
          ):

              m = m.replace(
                  "<application",
                  '<application\n'
                  '        android:icon="@drawable/controlehoras_icon"\n'
                  '        android:roundIcon="@drawable/controlehoras_icon"',
                  1
              )

              manifest.write_text(
                  m,
                  encoding="utf-8"
              )

          # ==========================================================
          # VALIDAÇÃO FINAL DA ROLETA
          # ==========================================================

          required = [
              "ControleHorasTimeWheelView",
              "showControleHorasWheelDialog",
              "showManualWheel",
              "showEditWheel",
              "punchNames",
              "controleHorasPunchPage",
              "extra2Enabled",
              "nextPunchIndex"
          ]

          missing = []

          for item in required:

              if item not in code:

                  missing.append(
                      item
                  )

          if missing:

              raise SystemExit(
                  "ERRO: recursos ainda ausentes: "
                  + ", ".join(missing)
              )

          if (
              "private fun showControleHorasWheelDialog("
              not in code
          ):

              raise SystemExit(
                  "ERRO FINAL: declaração da roleta não está no MainActivity.kt"
              )

          if "NumberPicker(" in code:

              raise SystemExit(
                  "ERRO: NumberPicker ainda presente"
              )

          if (
              "Esse registro ainda está vazio"
              in code
          ):

              raise SystemExit(
                  "ERRO: mensagem antiga ainda presente"
              )

          if "roller_click.wav" not in code:

              print(
                  "AVISO: referência textual ao som não encontrada; "
                  "arquivo será validado separadamente"
              )

          src.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "=================================================="
          )

          print(
              "ROLETA PERSONALIZADA VALIDADA COM SUCESSO"
          )

          print(
              "EDITAR BATIDA VAZIA VALIDADO"
          )

          print(
              "NUMBERPICKER REMOVIDO"
          )

          print(
              "MAINACTIVITY FINAL VALIDADO"
          )

          print(
              "=================================================="
          )

      - name: Validar projeto antes do Gradle
        shell: bash
        run: |
          set -e

          SRC="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          ICON="ControleHoras/app/src/main/res/drawable/controlehoras_icon.jpg"

          SOUND="ControleHoras/app/src/main/res/raw/roller_click.wav"

          test -s "$SRC"
          test -s "$ICON"
          test -s "$SOUND"

          echo "Verificando assinatura da roleta..."

          grep -q \
            "private fun showControleHorasWheelDialog(" \
            "$SRC"

          echo "OK: declaração da roleta encontrada"

          grep -q \
            "ControleHorasTimeWheelView" \
            "$SRC"

          echo "OK: TimeWheel encontrado"

          grep -q \
            "controleHorasPunchPage" \
            "$SRC"

          echo "OK: página de ponto encontrada"

          grep -q \
            "punchNames" \
            "$SRC"

          echo "OK: nomes das batidas encontrados"

          grep -q \
            "showManualWheel" \
            "$SRC"

          echo "OK: registro manual encontrado"

          grep -q \
            "showEditWheel" \
            "$SRC"

          echo "OK: edição encontrada"

          grep -q \
            "controlehoras_icon" \
            ControleHoras/app/src/main/AndroidManifest.xml

          echo "OK: ícone encontrado"

          if grep -q "NumberPicker(" "$SRC"; then
              echo "ERRO: NumberPicker encontrado"
              exit 1
          fi

          if grep -q \
            "Esse registro ainda está vazio" \
            "$SRC"
          then
              echo "ERRO: mensagem antiga encontrada"
              exit 1
          fi

          echo "=================================================="
          echo "VALIDAÇÃO COMPLETA DO PROJETO OK"
          echo "=================================================="

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

          echo "APK GERADO COM SUCESSO"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t \
            "$APK" \
            >/dev/null

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
