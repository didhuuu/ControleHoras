          private fun addExtraSwitch(
              box:LinearLayout,
              empId:Long,
              date:String,
              which:Int
          ){

              val enabled=
                  if(which==0){
                      extraEnabled(
                          empId,
                          date
                      )
                  }else{
                      extraReturnEnabled(
                          empId,
                          date
                      )
                  }

              val title=
                  if(which==0){
                      "Saída intervalo 2"
                  }else{
                      "Retorno intervalo 2"
                  }

              val row=
                  LinearLayout(this).apply{

                      orientation=
                          LinearLayout.HORIZONTAL

                      gravity=
                          Gravity.CENTER_VERTICAL

                      setPadding(
                          dp(14),
                          dp(3),
                          dp(10),
                          dp(3)
                      )

                      background(
                          Color.WHITE,
                          dp(12),
                          dp(12),
                          dp(12),
                          dp(12)
                      )

                      elevation=
                          dp(1).toFloat()
                  }

              row.addView(
                  TextView(this).apply{
                      text=title
                      textSize=15f
                      setTextColor(
                          this@MainActivity.text
                      )
                  },
                  LinearLayout.LayoutParams(
                      0,
                      dp(52),
                      1f
                  )
              )

              val sw=
                  Switch(this).apply{

                      isChecked=enabled

                      text=
                          if(isChecked){
                              "ATIVO"
                          }else{
                              "ATIVAR"
                          }

                      isAllCaps=true
                  }

              sw.setOnCheckedChangeListener{
                  _,
                  checked->

                  if(which==0){
                      setExtraEnabled(
                          empId,
                          date,
                          checked
                      )
                  }else{
                      setExtraReturnEnabled(
                          empId,
                          date,
                          checked
                      )
                  }

                  showPunch()
              }

              row.addView(
                  sw
              )

              row.setOnClickListener{
                  if(sw.isEnabled){
                      sw.isChecked=
                          !sw.isChecked
                  }
              }

              box.addView(
                  row,
                  LinearLayout.LayoutParams(
                      -1,
                      dp(58)
                  ).apply{
                      bottomMargin=dp(7)
                  }
              )
          }

          private fun nextPunchIndex(
              r:PunchDay,
              extra:Boolean
          ):Int{

              if(
                  r.punches[0]
                      .isBlank()
              )return 0

              if(
                  r.punches[1]
                      .isBlank()
              )return 1

              if(
                  r.punches[2]
                      .isBlank()
              )return 2

              if(
                  extra &&
                  r.punches[3]
                      .isBlank()
              )return 3

              if(
                  extra &&
                  extraReturnEnabled(
                      r.employeeId,
                      r.date
                  ) &&
                  r.punches[4]
                      .isBlank()
              )return 4

              if(
                  r.punches[5]
                      .isBlank()
              )return 5

              return -1
          }

          private fun registerPunch(
              empId:Long
          ){

              val r=
                  getRecord(
                      empId,
                      selectedPunchDate
                  )

              val n=
                  nextPunchIndex(
                      r,
                      extraEnabled(
                          empId,
                          selectedPunchDate
                      )
                  )

              if(n<0)return

              if(
                  selectedPunchDate==
                  today()
              ){

                  r.punches[n]=
                      nowTime()

                  saveData()
                  showPunch()

                  return
              }

              val e=
                  timeEdit(
                      "",
                      punchNames[n]
                  )

              AlertDialog.Builder(this)
                  .setTitle(
                      "Lançar ${punchNames[n]}"
                  )
                  .setMessage(
                      df.format(
                          parseIso(
                              selectedPunchDate
                          )
                      )
                  )
                  .setView(e)
                  .setNegativeButton(
                      "Cancelar",
                      null
                  )
                  .setPositiveButton(
                      "Salvar"
                  ){_,_->

                      val t=
                          normalizeTime(
                              e.text.toString()
                          )

                      if(
                          t.isNotBlank()
                      ){

                          r.punches[n]=t
                          saveData()
                          showPunch()

                      }else{

                          Toast.makeText(
                              this,
                              "Horário inválido.",
                              Toast.LENGTH_LONG
                          ).show()
                      }
                  }
                  .show()
          }

          private fun showEditWheel(
              rec:PunchDay,
              index:Int
          ){

              val parts=
                  rec.punches[index]
                      .split(":")

              val now=
                  Calendar.getInstance()

              val hour=
                  parts
                      .getOrNull(0)
                      ?.toIntOrNull()
                      ?.coerceIn(0,23)
                      ?:now.get(
                          Calendar.HOUR_OF_DAY
                      )

              val minute=
                  parts
                      .getOrNull(1)
                      ?.toIntOrNull()
                      ?.coerceIn(0,59)
                      ?:now.get(
                          Calendar.MINUTE
                      )

              showTimeWheelDialog(
                  "Editar registro",
                  "${punchNames[index]}\\n"+
                  "${df.format(parseIso(rec.date))}",
                  hour,
                  minute,
                  "SALVAR"
              ){h,m->

                  rec.punches[index]=
                      "%02d:%02d".format(
                          Locale.US,
                          h,
                          m
                      )

                  saveData()
                  showPunch()
              }
          }

          private fun showManualWheel(
              empId:Long
          ){

              val r=
                  getRecord(
                      empId,
                      selectedPunchDate
                  )

              val n=
                  nextPunchIndex(
                      r,
                      extraEnabled(
                          empId,
                          selectedPunchDate
                      )
                  )

              if(n<0){

                  Toast.makeText(
                      this,
                      "As batidas disponíveis deste dia já estão preenchidas.",
                      Toast.LENGTH_LONG
                  ).show()

                  return
              }

              val now=
                  Calendar.getInstance()

              showTimeWheelDialog(
                  "Registro manual",
                  "${punchNames[n]}\\n"+
                  "${df.format(parseIso(selectedPunchDate))}",
                  now.get(
                      Calendar.HOUR_OF_DAY
                  ),
                  now.get(
                      Calendar.MINUTE
                  ),
                  "REGISTRAR"
              ){h,m->

                  r.punches[n]=
                      "%02d:%02d".format(
                          Locale.US,
                          h,
                          m
                      )

                  saveData()
                  showPunch()
              }
          }

          private fun showTimeWheelDialog(
