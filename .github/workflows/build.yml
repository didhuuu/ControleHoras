                          orientation=
                              LinearLayout.HORIZONTAL

                          gravity=
                              Gravity.CENTER_VERTICAL

                          setPadding(
                              dp(12),
                              dp(5),
                              dp(10),
                              dp(5)
                          )

                          background(
                              Color.WHITE,
                              dp(12),
                              dp(12),
                              dp(12),
                              dp(12)
                          )

                          elevation=
                              dp(1).toFloat()
                      }

                  row.addView(
                      TextView(this).apply{

                          text=
                              (index+1).toString()

                          textSize=16f

                          gravity=
                              Gravity.CENTER

                          setTypeface(
                              null,
                              Typeface.BOLD
                          )

                          background(
                              0xFFEAF0F7.toInt(),
                              30,
                              30,
                              30,
                              30
                          )

                      },
                      LinearLayout.LayoutParams(
                          dp(42),
                          dp(42)
                      )
                  )

                  row.addView(
                      TextView(this).apply{

                          text=title

                          textSize=15f

                          setTextColor(
                              this@MainActivity.text
                          )

                          setPadding(
                              dp(12),
                              0,
                              0,
                              0
                          )

                      },
                      LinearLayout.LayoutParams(
                          0,
                          dp(52),
                          1f
                      )
                  )

                  val sw=
                      Switch(this).apply{

                          isChecked=enabled

                          text=
                              if(isChecked)
                                  "ATIVO"
                              else
                                  "ATIVAR"
                      }

                  if(which==1)
                      sw.isEnabled=
