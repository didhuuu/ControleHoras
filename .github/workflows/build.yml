      - name: Corrigir layout e instalar roda personalizada
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re

          root=Path("ControleHoras")

          src=
              root/
              "app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          wheel=
              root/
              "app/src/main/java/com/didhuuu/controlehoras/TimeWheelView.kt"

          def dec(value):
              return base64.b64decode(
                  value
              ).decode("utf-8")

          blocks={}

          blocks['SHOWPUNCH']=dec(
              ' bXBsb3llZXMuZmluZEluZGV4e2l0LmlkPT1zZWxlY3RlZEVtcGxveWVlSWR9LmNvZXJjZUF0TGVhc3QoMCkpCg=='
          )

          # O restante do código da versão final é instalado
          # a partir dos blocos validados da versão final.

          code=src.read_text(
              encoding="utf-8"
          )

          def replace_fun(
              code,
              name,
              new
          ):

              pattern=(
                  r"(?ms)^    private fun "
                  +
                  re.escape(name)
                  +
                  r"\(.*?(?=^    private fun |\Z)"
              )

              result,count=
                  re.subn(
                      pattern,
                      new+"\n\n",
                      code,
                      count=1
                  )

              if count==0:
                  raise SystemExit(
                      "ERRO: função não encontrada: "+
                      name
                  )

              return result

          code=replace_fun(
              code,
              "showPunch",
              blocks["SHOWPUNCH"]
          )

          src.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "RODA APLICADA"
          )

