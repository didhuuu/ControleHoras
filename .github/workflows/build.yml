          calculo="""
    private fun calculate(r:PunchDay):Calc{

        var worked=0

        worked+=minutesBetween(
            r.punches[0],
            r.punches[1]
        )

        val seis=
            r.punches[3].isNotBlank() ||
            r.punches[4].isNotBlank()

        if(seis){

            worked+=minutesBetween(
                r.punches[2],
                r.punches[3]
            )

            worked+=minutesBetween(
                r.punches[4],
                r.punches[5]
            )

        }else{

            worked+=minutesBetween(
                r.punches[2],
                r.punches[5]
            )
        }

        val data=parseIso(r.date)

        if(!modeForDay(data)){

            return Calc(
                worked,
                0,
                0,
                worked
            )
        }

        val semanal=
            durationMinutes(
                weeklyTarget
            )

        val dias=
            if(modeForDate(data)=="MS"){
                6
            }else{
                5
            }

        val expected=
            semanal/dias

        val extra=
            max(
                0,
                worked-expected
            )

        val faltante=
            max(
                0,
                expected-worked
            )

        return Calc(
            worked,
            expected,
            extra,
            faltante
        )
    }

