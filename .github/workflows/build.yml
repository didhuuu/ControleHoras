name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # BAIXAR PROJETO
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # EXTRAIR PROJETO
      # ============================================================

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      # ============================================================
      # RECONSTRUIR EXATAMENTE A BASE 70
      # ============================================================

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url=(
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow=urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name,next_name):

              start=workflow.index(
                  f"      - name: {name}"
              )

              end=workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block=workflow[start:end]

              marker="        run: |\n"

              pos=block.index(marker)+len(marker)

              lines=block[pos:].splitlines()

              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in lines
              )+"\n"

          scripts=[
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for i,script in enumerate(scripts):

              p=(
                  Path(tempfile.gettempdir())/
                  f"base70_{i}.py"
              )

              p.write_text(
                  script,
                  encoding="utf-8"
              )

              subprocess.run(
                  ["python",str(p)],
                  check=True
              )

          print("BASE 70 APLICADA COM SUCESSO")

      # ============================================================
      # APLICAR FUNCIONALIDADES QUE GERARAM O APK DO BUILD 80
      # ============================================================

      - name: Aplicar funcionalidades completas da versão 80
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url=(
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "acc38dd316464293e4d47b10ea3ccf6da7b9454a/"
              ".github/workflows/build.yml"
          )

          workflow=urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name,next_name):

              start=workflow.index(
                  f"      - name: {name}"
              )

              end=workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block=workflow[start:end]

              marker="        run: |\n"

              pos=block.index(marker)+len(marker)

              lines=block[pos:].splitlines()

              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in lines
              )+"\n"

          script=extract_step(
              "Aplicar funcionalidades completas",
              "Corrigir MainActivity definitivamente"
          )

          p=(
              Path(tempfile.gettempdir())/
              "funcionalidades80.py"
          )

          p.write_text(
              script,
              encoding="utf-8"
          )

          subprocess.run(
              ["python",str(p)],
              check=True
          )

          print(
              "FUNCIONALIDADES DA VERSÃO 80 APLICADAS"
          )

      # ============================================================
      # CORREÇÕES DEFINITIVAS DA MAINACTIVITY
      # ============================================================

      - name: Corrigir MainActivity definitivamente
        shell: python
        run: |
          from pathlib import Path
          import re

          file=Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          if not file.exists():
              raise SystemExit(
                  "ERRO: MainActivity.kt não encontrado"
              )

          code=file.read_text(
              encoding="utf-8"
          )

          # ========================================================
          # PUNCHNAMES
          # ========================================================

          if "private val punchNames" not in code:

              names=(
                  "    private val punchNames=arrayOf<String>(\n"
                  "        \"Entrada\",\n"
                  "        \"Saída\",\n"
                  "        \"Retorno\",\n"
                  "        \"Saída intervalo 2\",\n"
                  "        \"Retorno intervalo 2\",\n"
                  "        \"Saída\"\n"
                  "    )\n"
              )

              anchors=[
                  '    private val extra2ReturnEnabled=mutableSetOf<String>()\n',
                  '    private val extra2Enabled=mutableSetOf<String>()\n',
                  '    private val weekModes=linkedMapOf<String,String>()\n',
                  '    private val weekModes = linkedMapOf<String,String>()\n'
              ]

              inserted=False

              for anchor in anchors:

                  if anchor in code:

                      code=code.replace(
                          anchor,
                          anchor+names,
                          1
                      )

                      inserted=True
                      break

              if not inserted:

                  raise SystemExit(
                      "ERRO: não foi possível inserir punchNames"
                  )

          # ========================================================
          # CORRIGIR ADDVIEW
          # ========================================================

          pattern=(
              r'\},\s*'
              r'0,\s*'
              r'0,\s*'
              r'0,\s*'
              r'dp\(10\)\s*'
              r'\)\s*'
              r'val dateCard\s*=\s*card\(\)'
          )

          replacement=(
              "},\n"
              "                      LinearLayout.LayoutParams(\n"
              "                          -1,\n"
              "                          -2\n"
              "                      ).apply{\n"
              "                          bottomMargin=dp(10)\n"
              "                      }\n"
              "                  )\n\n"
              "                  val dateCard=card()"
          )

          code,count=re.subn(
              pattern,
              replacement,
              code,
              count=1
          )

          if count==0:

              print(
                  "ADDVIEW já estava corrigido"
              )

          # ========================================================
          # GARANTIR PUNCHNAMES
          # ========================================================

          if "private val punchNames" not in code:

              raise SystemExit(
                  "ERRO FINAL: punchNames não existe"
              )

          file.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "MAINACTIVITY BASE CORRIGIDA"
          )

      # ============================================================
      # CORREÇÃO COMPLETA DO RELÓGIO DE ROLAGEM
      # ============================================================

      - name: Corrigir completamente o relógio de rolagem
        shell: python
        run: |
          from pathlib import Path

          file=Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          code=file.read_text(
              encoding="utf-8"
          )

          # ========================================================
          # TAMANHO DAS RODAS
          # ========================================================

          code=code.replace(
              "dp(88),\n                          dp(150)",
              "dp(72),\n                          dp(126)"
          )

          code=code.replace(
              "dp(35),\n                          dp(150)",
              "dp(28),\n                          dp(126)"
          )

          # ========================================================
          # DOIS PONTOS
          # ========================================================

          code=code.replace(
              'text=":"\n                          textSize=28f',
              'text=":"\n                          textSize=22f'
          )

          # ========================================================
          # FUNÇÃO DE ESTILO
          # ========================================================

          if "private fun styleWheel(picker:NumberPicker)" not in code:

              marker=(
                  "              private fun showEditWheel("
              )

              if marker not in code:

                  marker=(
                      "    private fun showEditWheel("
                  )

              helper=(
                  "              private fun styleWheel(picker:NumberPicker){\n"
                  "                  picker.setBackgroundColor(Color.TRANSPARENT)\n"
                  "                  picker.wrapSelectorWheel=true\n"
                  "                  picker.descendantFocusability=NumberPicker.FOCUS_BLOCK_DESCENDANTS\n"
                  "                  picker.post{\n"
                  "                      for(i in 0 until picker.childCount){\n"
                  "                          val child=picker.getChildAt(i)\n"
                  "                          if(child is TextView){\n"
                  "                              child.setTextColor(darkBlue)\n"
                  "                              child.textSize=21f\n"
                  "                              child.gravity=Gravity.CENTER\n"
                  "                              child.setTypeface(null,Typeface.BOLD)\n"
                  "                          }\n"
                  "                      }\n"
                  "                  }\n"
                  "              }\n\n"
              )

              if marker not in code:

                  raise SystemExit(
                      "ERRO: showEditWheel não encontrado"
                  )

              code=code.replace(
                  marker,
                  helper+marker,
                  1
              )

          # ========================================================
          # APLICAR ESTILO NA EDIÇÃO
          # ========================================================

          edit_start=code.find(
              "private fun showEditWheel"
          )

          manual_start=code.find(
              "private fun showManualWheel",
              edit_start
          )

          if edit_start<0:

              raise SystemExit(
                  "ERRO: showEditWheel não encontrado"
              )

          if manual_start<0:

              raise SystemExit(
                  "ERRO: showManualWheel não encontrado"
              )

          edit_block=code[
              edit_start:
              manual_start
          ]

          if "styleWheel(hour)" not in edit_block:

              marker=(
                  "                  val sep="
              )

              pos=edit_block.find(marker)

              if pos<0:

                  raise SystemExit(
                      "ERRO: roda de edição não encontrada"
                  )

              edit_block=(
                  edit_block[:pos]+
                  "                  styleWheel(hour)\n"
                  "                  styleWheel(minute)\n\n"+
                  edit_block[pos:]
              )

              code=(
                  code[:edit_start]+
                  edit_block+
                  code[manual_start:]
              )

          # ========================================================
          # APLICAR ESTILO NO REGISTRO MANUAL
          # ========================================================

          manual_start=code.find(
              "private fun showManualWheel"
          )

          if manual_start<0:

              raise SystemExit(
                  "ERRO: showManualWheel não encontrado"
              )

          manual_block=code[
              manual_start:
          ]

          if "styleWheel(hour)" not in manual_block:

              marker=(
                  "                  val sep="
              )

              pos=manual_block.find(marker)

              if pos<0:

                  raise SystemExit(
                      "ERRO: roda de registro manual não encontrada"
                  )

              manual_block=(
                  manual_block[:pos]+
                  "                  styleWheel(hour)\n"
                  "                  styleWheel(minute)\n\n"+
                  manual_block[pos:]
              )

              code=(
                  code[:manual_start]+
                  manual_block
              )

          # ========================================================
          # VALIDAÇÕES DA FUNCIONALIDADE
          # ========================================================

          required=[
              "private fun showManualWheel(",
              "private fun showEditWheel(",
              "private fun nextPunchIndex(",
              "private fun calculate(",
              "formatMin(calc.worked)",
              "calc.extra60",
              "calc.extra100",
              '"%02d:%02d".format'
          ]

          for term in required:

              if term not in code:

                  raise SystemExit(
                      "ERRO: funcionalidade ausente: "+
                      term
                  )

          file.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "RELÓGIO DE ROLAGEM CORRIGIDO"
          )

      # ============================================================
      # VALIDAÇÃO FINAL
      # ============================================================

      - name: Validar código e ícone
        shell: bash
        run: |
          set -e

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          ICON="ControleHoras/app/src/main/res/drawable/controlehoras_icon.jpg"

          MANIFEST="ControleHoras/app/src/main/AndroidManifest.xml"

          echo "========================================"
          echo "VALIDAÇÃO FINAL"
          echo "========================================"

          test -s "$FILE"

          test -s "$ICON"

          grep -q 'extra2Enabled' "$FILE"

          grep -q 'extra2ReturnEnabled' "$FILE"

          grep -q 'showManualWheel' "$FILE"

          grep -q 'showEditWheel' "$FILE"

          grep -q 'nextPunchIndex' "$FILE"

          grep -q 'punchNames' "$FILE"

          grep -q 'calculate(' "$FILE"

          grep -q 'formatMin(calc.worked)' "$FILE"

          grep -q 'calc.extra60' "$FILE"

          grep -q 'calc.extra100' "$FILE"

          grep -q '"%02d:%02d".format' "$FILE"

          grep -q 'styleWheel' "$FILE"

          grep -q 'WindowCompat.setDecorFitsSystemWindows' "$FILE"

          grep -q 'controlehoras_icon' "$MANIFEST"

          if grep -q 'Button(context)' "$FILE"; then
              echo "ERRO: Button(context) encontrado"
              exit 1
          fi

          if grep -n "'''" "$GITHUB_WORKSPACE/.github/workflows/build.yml"; then
              echo "ERRO: aspas triplas encontradas no YAML"
              exit 1
          fi

          echo "========================================"
          echo "VALIDAÇÃO FINAL OK"
          echo "========================================"

      # ============================================================
      # GRADLE 8.11.1
      # ============================================================

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      # ============================================================
      # LIMPAR
      # ============================================================

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon

      # ============================================================
      # GERAR APK
      # ============================================================

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GERANDO APK"
          echo "========================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
              echo "ERRO: APK NÃO FOI GERADO"
              exit 1
          fi

          echo "========================================"
          echo "APK GERADO"
          echo "========================================"

          ls -lh "$APK"

      # ============================================================
      # TESTAR APK
      # ============================================================

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t \
            "$APK" \
            >/dev/null

          echo "APK VALIDADO COM SUCESSO"

      # ============================================================
      # PUBLICAR APK
      # ============================================================

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
