          minutos="""
    private fun minutesBetween(
        a:String,
        b:String
    ):Int{

        val x=normalizeTime(a)
        val y=normalizeTime(b)

        if(x.isBlank()||y.isBlank()){
            return 0
        }

        return try{

            val xa=x.split(":")
            val ya=y.split(":")

            val inicio=
                xa[0].toInt()*60+
                xa[1].toInt()

            val fim=
                ya[0].toInt()*60+
                ya[1].toInt()

            max(
                0,
                fim-inicio
            )

        }catch(_:Exception){

            0
        }
    }

