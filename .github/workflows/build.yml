name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          rm -rf ControleHoras
          unzip -q -o ControleHoras.zip
          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt
          echo "PROJETO ORIGINAL OK"

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess, tempfile

          url="https://raw.githubusercontent.com/didhuuu/ControleHoras/6381d26e525e1f9eeb91af17cdb9fed66293c1f2/.github/workflows/build.yml"

          workflow=urlopen(url,timeout=30).read().decode("utf-8")

          def extract_step(name,next_name):
              start=workflow.index(f"      - name: {name}")
              end=workflow.index(f"      - name: {next_name}",start)
              block=workflow[start:end]
              marker="        run: |\n"
              pos=block.index(marker)+len(marker)
              lines=block[pos:].splitlines()

              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in lines
              )+"\n"

          scripts=[
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for i,script in enumerate(scripts):
              p=Path(tempfile.gettempdir())/f"base70_{i}.py"

              p.write_text(
                  script,
                  encoding="utf-8"
              )

              subprocess.run(
                  ["python",str(p)],
                  check=True
              )

          print("BASE DA VERSÃO 70 APLICADA")

      - name: Aplicar correções finais sem versão 80
        shell: python
        run: |
          import base64
          import zlib

          scripts = [
              "".join([
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
              ]),
              "".join([
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "nl68/TuBu4935I8jLk85SK/fb/+eIN2E692HB+253703hzOjO77vTscgR78LT/8HOgtoHA==",
              ]),
          ]

          for i, payload in enumerate(scripts):
              payload = "".join(payload.split())
              payload += "=" * (-len(payload) % 4)

              raw = base64.b64decode(
                  payload,
                  validate=True
              )

              code = zlib.decompress(
                  raw
              ).decode("utf-8")

              compile(
                  code,
                  f"<patch_{i}>",
                  "exec"
              )

              exec(
                  compile(
                      code,
                      f"<patch_{i}>",
                      "exec"
                  ),
                  {
                      "__name__": "__main__"
                  }
              )

          print("PATCHES FINAIS APLICADOS")

      - name: Validar estrutura final
        shell: bash
        run: |
          set -euo pipefail

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          WHEEL="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/TimeWheelView.kt"

          test -s "$FILE"
          test -s "$WHEEL"

          grep -q 'extra2Enabled' "$FILE"
          grep -q 'showManualWheel' "$FILE"
          grep -q 'showEditWheel' "$FILE"
          grep -q 'showTimeWheelDialog' "$FILE"
          grep -q 'TimeWheelView' "$FILE"
          grep -q 'nextPunchIndex' "$FILE"
          grep -q 'punchNames' "$FILE"
          grep -q 'class TimeWheelView' "$WHEEL"

          if grep -q 'NumberPicker' "$FILE"; then
            echo "ERRO: NumberPicker antigo ainda presente"
            exit 1
          fi

          if grep -q 'Button(context)' "$FILE"; then
            echo "ERRO: Button(context)"
            exit 1
          fi

          echo "ESTRUTURA FINAL VALIDADA"

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q gradle-8.11.1-bin.zip

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle assembleDebug --no-daemon --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK VALIDADO"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
