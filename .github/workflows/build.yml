name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. BAIXAR PROJETO
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. EXTRAIR PROJETO ORIGINAL
      # ============================================================

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXTRAINDO PROJETO"
          echo "========================================"

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      # ============================================================
      # 4. APLICAR BASE 70
      # ============================================================

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          print("========================================")
          print("APLICANDO BASE 70")
          print("========================================")

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=60
          ).read().decode("utf-8")

          def extract_step(name, next_name):

              start_marker = f"      - name: {name}"
              end_marker = f"      - name: {next_name}"

              if start_marker not in workflow:
                  raise RuntimeError(
                      f"Etapa não encontrada: {name}"
                  )

              start = workflow.index(
                  start_marker
              )

              if end_marker not in workflow[start:]:
                  raise RuntimeError(
                      f"Próxima etapa não encontrada: {next_name}"
                  )

              end = workflow.index(
                  end_marker,
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              if marker not in block:
                  raise RuntimeError(
                      f"Bloco run não encontrado: {name}"
                  )

              pos = (
                  block.index(marker)
                  + len(marker)
              )

              lines = block[pos:].splitlines()

              return "\n".join(
                  line[10:]
                  if line.startswith("          ")
                  else line
                  for line in lines
              ).rstrip() + "\n"

          scripts = [
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for i, script in enumerate(scripts):

              p = (
                  Path(tempfile.gettempdir())
                  / f"base70_{i}.py"
              )

              p.write_text(
                  script,
                  encoding="utf-8"
              )

              compile(
                  script,
                  f"base70_{i}.py",
                  "exec"
              )

              subprocess.run(
                  [
                      "python",
                      str(p)
                  ],
                  check=True
              )

          print("========================================")
          print("BASE 70 APLICADA")
          print("ESCALA ORIGINAL PRESERVADA")
          print("========================================")

      # ============================================================
      # 5. APLICAR FUNCIONALIDADES DA VERSÃO 80
      # ============================================================

      - name: Aplicar funcionalidades da versão 80
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          print("========================================")
          print("APLICANDO VERSÃO 80")
          print("========================================")

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=60
          ).read().decode("utf-8")

          start_marker = (
              "      - name: "
              "Aplicar correções finais da Base 70, "
              "edição por rolagem e ícone"
          )

          end_marker = (
              "      - name: Validar código e ícone"
          )

          start = workflow.index(
              start_marker
          )

          end = workflow.index(
              end_marker,
              start
          )

          block = workflow[start:end]

          marker = "        run: |\n"

          pos = (
              block.index(marker)
              + len(marker)
          )

          lines = block[pos:].splitlines()

          script = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in lines
          ).rstrip() + "\n"

          p = (
              Path(tempfile.gettempdir())
              / "funcionalidades_v80.py"
          )

          p.write_text(
              script,
              encoding="utf-8"
          )

          compile(
              script,
              "funcionalidades_v80.py",
              "exec"
          )

          subprocess.run(
              [
                  "python",
                  str(p)
              ],
              check=True
          )

          print("VERSÃO 80 APLICADA")

      # ============================================================
      # 6. CORRIGIR ESTRUTURA KOTLIN
      # ============================================================

      - name: Corrigir estrutura Kotlin da versão 80
        shell: python
        run: |
          from pathlib import Path
          import re

          print("========================================")
          print("CORRIGINDO ESTRUTURA KOTLIN")
          print("========================================")

          src = Path(
              "ControleHoras/app/src/main/java/"
              "com/didhuuu/controlehoras/MainActivity.kt"
          )

          if not src.exists():
              raise SystemExit(
                  "ERRO: MainActivity.kt não encontrado."
              )

          code = src.read_text(
              encoding="utf-8"
          )

          # ----------------------------------------------------------
          # IMPORT VIEW
          # ----------------------------------------------------------

          if not re.search(
              r"(?m)^import android\.view\.View\s*$",
              code
          ):

              lines = code.splitlines()

              package_index = 0

              for i, line in enumerate(lines):

                  if line.startswith("package "):
                      package_index = i
                      break

              lines.insert(
                  package_index + 1,
                  "import android.view.View"
              )

              code = "\n".join(lines) + "\n"

          # ----------------------------------------------------------
          # LOCALIZAR MAINACTIVITY
          # ----------------------------------------------------------

          main_match = re.search(
              r"class\s+MainActivity[^{]*\{",
              code
          )

          if not main_match:
              raise SystemExit(
                  "ERRO: MainActivity não encontrada."
              )

          class_end = main_match.end()

