            "REGISTRAR"
        ){h,m->

            r.punches[n]=
                "%02d:%02d".format(
                    Locale.US,
                    h,
                    m
                )

            saveData()

            showPunch()
        }
    }
'''

          # --------------------------------------------------------
          # SUBSTITUIR SHOWEDITWHEEL + SHOWMANUALWHEEL
          # --------------------------------------------------------

          edit_start = function_start(
              code,
              "showEditWheel"
          )

          manual_start = function_start(
              code,
              "showManualWheel"
          )

          history_start = function_start(
              code,
              "showHistory"
          )

          if (
              edit_start < 0
              or
              manual_start < 0
              or
              history_start < 0
          ):

              raise SystemExit(
                  "ERRO: funções da roda não encontradas."
              )

          code = (
              code[:edit_start]
              +
              wheel_dialog.strip()
              +
              "\n\n"
              +
              edit_method.strip()
              +
              "\n\n"
              +
              manual_method.strip()
              +
              "\n\n"
              +
              code[history_start:]
          )

          # --------------------------------------------------------
          # GARANTIR QUE NÃO EXISTE NUMBERPICKER
          # --------------------------------------------------------

          if "NumberPicker" in code:

              raise SystemExit(
                  "ERRO: NumberPicker ainda existe."
              )

          main.write_text(
              code,
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # CLASSE DA RODA
          # --------------------------------------------------------

          wheel.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          wheel_code = r'''package com.didhuuu.controlehoras

import android.content.Context
import android.graphics.Canvas
import android.graphics.LinearGradient
import android.graphics.Paint
import android.graphics.Shader
import android.media.AudioManager
import android.media.ToneGenerator
import android.view.MotionEvent
import android.view.View
import kotlin.math.abs

class TimeWheelView(
    context:Context,
    private val minimum:Int,
    private val maximum:Int,
    initial:Int
):View(context){

    var value:Int=
        initial.coerceIn(
            minimum,
            maximum
        )
        private set

    var onValueChanged:
        (() -> Unit)?=null

    private val density=
        resources
            .displayMetrics
            .density

    private val paint=
        Paint(
            Paint.ANTI_ALIAS_FLAG
        )

    private val tone=
        ToneGenerator(
            AudioManager.STREAM_NOTIFICATION,
            65
        )

    private var lastY=0f
    private var accumulated=0f

    private fun dp(
        value:Int
    ):Float{

        return value*density
    }

    private fun change(
        amount:Int
    ){

        val next=
            (value+amount)
                .coerceIn(
                    minimum,
                    maximum
                )

        if(
            next==value
        ){
            return
        }

        value=next

        tone.startTone(
            ToneGenerator.TONE_PROP_CLICK,
            35
        )

        onValueChanged?.invoke()

        invalidate()
    }

    override fun onDraw(
        canvas:Canvas
    ){

        super.onDraw(
            canvas
        )

        val width=
            width.toFloat()

        val height=
            height.toFloat()

        val center=
            height/2f

        # Metallic outer body

        paint.shader=
            LinearGradient(
                0f,
                0f,
                width,
                0f,
                intArrayOf(
                    0xFF17191C.toInt(),
                    0xFFB9BDC4.toInt(),
                    0xFFF5F7FA.toInt(),
                    0xFF9EA4AB.toInt(),
                    0xFF17191C.toInt()
                ),
                null,
                Shader.TileMode.CLAMP
            )

        canvas.drawRoundRect(
            dp(4),
            dp(3),
            width-dp(4),
            height-dp(3),
            dp(18),
            dp(18),
            paint
        )

        paint.shader=null

        # Blue neon center

        paint.shader=
            LinearGradient(
                0f,
                center-dp(34),
                0f,
                center+dp(34),
                intArrayOf(
                    0xFF003CFF.toInt(),
                    0xFF008BFF.toInt(),
                    0xFF0050FF.toInt()
                ),
                null,
                Shader.TileMode.CLAMP
            )

        canvas.drawRoundRect(
            dp(9),
            center-dp(34),
            width-dp(9),
            center+dp(34),
            dp(10),
            dp(10),
            paint
        )

        paint.shader=null

        paint.textAlign=
            Paint.Align.CENTER

        for(
            offset in -2..2
        ){

            var number=
                value+offset

            val range=
                maximum-minimum+1

            while(
                number>maximum
            ){
                number-=range
            }

            while(
                number<minimum
            ){
                number+=range
            }

            paint.textSize=
                if(
                    offset==0
                ){
                    dp(28)
                }else{
                    dp(19)
                }

            paint.color=
                if(
                    offset==0
                ){
                    0xFFFFFFFF.toInt()
                }else{
                    0xFFE2E7EF.toInt()
                }

            canvas.drawText(
                "%02d".format(
                    number
                ),
                width/2f,
                center+
                offset*dp(45)+
                dp(9),
                paint
            )
        }

        # Neon selection markers

        paint.color=
            0xFF00D9FF.toInt()

        paint.style=
            Paint.Style.STROKE

        paint.strokeWidth=
            dp(2)

        canvas.drawLine(
            dp(3),
            center-dp(30),
            dp(19),
            center,
            paint
        )

        canvas.drawLine(
            dp(3),
            center+dp(30),
            dp(19),
            center,
            paint
        )

        canvas.drawLine(
            width-dp(3),
            center-dp(30),
            width-dp(19),
            center,
            paint
        )

        canvas.drawLine(
            width-dp(3),
            center+dp(30),
            width-dp(19),
            center,
            paint
        )

        paint.style=
            Paint.Style.FILL
    }

    override fun onTouchEvent(
        event:MotionEvent
    ):Boolean{

        when(
            event.actionMasked
        ){

            MotionEvent.ACTION_DOWN->{

                lastY=
                    event.y

                accumulated=
                    0f

                return true
            }

            MotionEvent.ACTION_MOVE->{

                val difference=
                    event.y-lastY

                accumulated+=
                    difference

                if(
                    abs(accumulated)>=
                    dp(28)
                ){

                    change(
                        if(
                            accumulated<0
                        ){
                            1
                        }else{
                            -1
                        }
                    )

                    accumulated=
                        0f
                }

                lastY=
                    event.y

                return true
            }

            MotionEvent.ACTION_UP->{

                if(
                    abs(accumulated)<
                    dp(10)
                ){

                    change(
                        if(
                            event.y<
                            height/2f
                        ){
                            1
                        }else{
                            -1
                        }
                    )
                }

                performClick()

                return true
            }
        }

        return true
    }

    override fun performClick():Boolean{

        super.performClick()

        return true
    }
}
'''

          # Kotlin não aceita comentários com #.
          wheel_code = wheel_code.replace(
              "# Metallic outer body",
              "// Metallic outer body"
          )

          wheel_code = wheel_code.replace(
              "# Blue neon center",
              "// Blue neon center"
          )

          wheel_code = wheel_code.replace(
              "# Neon selection markers",
              "// Neon selection markers"
          )

          wheel.write_text(
              textwrap.dedent(
                  wheel_code
              ).strip() +
              "\n",
              encoding="utf-8"
          )

          print(
              "RODA AZUL/NEON INSTALADA"
          )

      # ============================================================
      # RECUPERAR O ÍCONE APROVADO
      #
      # Primeiro tenta usar o artefato da versão aprovada.
      # Se não estiver disponível, mantém o ícone criado pela Base 80.
      # ============================================================

      - name: Recuperar ícone aprovado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          ICON_DIR="ControleHoras/app/src/main/res/drawable"

          mkdir -p "$ICON_DIR"

          if curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/didhuuu/ControleHoras/actions/artifacts/11068205148/zip" \
            -o /tmp/icon.zip
          then

            rm -rf /tmp/icon_extract

            mkdir -p \
              /tmp/icon_extract

            if unzip -q -o \
              /tmp/icon.zip \
              -d /tmp/icon_extract
            then

              APK=$(
                find \
                  /tmp/icon_extract \
                  -type f \
                  -name "app-debug.apk" \
                  | head -n 1
              )

              if [ -n "$APK" ]; then

                rm -rf \
                  /tmp/icon_apk

                mkdir -p \
                  /tmp/icon_apk

                unzip -q -o \
                  "$APK" \
                  -d /tmp/icon_apk

                APPROVED=$(
                  find \
                    /tmp/icon_apk/res \
                    -type f \
                    -name "controlehoras_icon.jpg" \
                    | head -n 1
                )

                if [ -n "$APPROVED" ]; then

                  cp \
                    "$APPROVED" \
                    "$ICON_DIR/controlehoras_icon.jpg"

                  echo \
                    "ÍCONE APROVADO RECUPERADO"

                else

                  echo \
                    "Ícone do artefato não encontrado; mantendo ícone existente."

                fi

              fi

            fi

          else

            echo \
              "Artefato antigo indisponível; mantendo ícone existente."

          fi

          test -s \
            "$ICON_DIR/controlehoras_icon.jpg"

      # ============================================================
      # VALIDAR ANTES DO GRADLE
      # ============================================================

      - name: Validar código final
        shell: bash
        run: |
          set -e

          ROOT="ControleHoras"

          MAIN="$ROOT/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"

          WHEEL="$ROOT/app/src/main/java/com/didhuuu/controlehoras/TimeWheelView.kt"

          ICON="$ROOT/app/src/main/res/drawable/controlehoras_icon.jpg"

          MANIFEST="$ROOT/app/src/main/AndroidManifest.xml"

          test -s "$MAIN"
          test -s "$WHEEL"
          test -s "$ICON"
          test -s "$MANIFEST"

          echo "Verificando roda..."

          grep -q \
            "TimeWheelView" \
            "$MAIN"

          grep -q \
            "showTimeWheelDialog" \
            "$MAIN"

          grep -q \
            "showManualWheel" \
            "$MAIN"

          grep -q \
            "showEditWheel" \
            "$MAIN"

          grep -q \
            "nextPunchIndex" \
            "$MAIN"

          echo "Verificando intervalo 2..."

          grep -q \
            "extra2Enabled" \
            "$MAIN"

          grep -q \
            "extra2ReturnEnabled" \
            "$MAIN"

          echo "Verificando escala Base 70..."

          grep -q \
            "08:48" \
            "$MAIN"

          grep -q \
            "07:20" \
            "$MAIN"

          echo "Verificando datas..."

          grep -q \
            "selectedPunchDate" \
            "$MAIN"

          echo "Verificando ícone..."

          grep -q \
            "controlehoras_icon" \
            "$MANIFEST"

          echo "Garantindo que NumberPicker não existe..."

          if grep -q \
            "NumberPicker" \
            "$MAIN"
          then
            echo \
              "ERRO: NumberPicker ainda encontrado."
            exit 1
          fi

          if grep -q \
            "NumberPicker" \
            "$WHEEL"
          then
            echo \
              "ERRO: NumberPicker encontrado na roda."
            exit 1
          fi

          echo "Garantindo que DSR não foi adicionado..."

          if grep -q \
            "DSR" \
            "$MAIN"
          then
            echo \
              "ERRO: DSR encontrado."
            exit 1
          fi

          echo "Garantindo que o cartão estrutural está correto..."

          if grep -q \
            "box.addView(.*0,.*0,.*0,.*dp(10)" \
            "$MAIN"
          then
            echo \
              "ERRO: addView antigo ainda existe."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "VALIDAÇÃO FINAL OK"
          echo "=============================================="

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      # ============================================================
      # LIMPEZA
      # ============================================================

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle \
            clean \
            --no-daemon

      # ============================================================
      # GERAR APK
      # ============================================================

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo ""
          echo "=============================================="
          echo "APK GERADO"
          echo "=============================================="

          ls -lh "$APK"

      # ============================================================
      # TESTE DO APK
      # ============================================================

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t \
            "$APK" \
            >/dev/null

          echo ""
          echo "=============================================="
          echo "APK VALIDADO COM SUCESSO"
          echo "=============================================="

      # ============================================================
      # PUBLICAR
      # ============================================================

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
