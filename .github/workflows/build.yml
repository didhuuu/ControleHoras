name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # RECUPERA A BASE 70 + CORREÇÕES DA VERSÃO 80
      # DIRETAMENTE DO WORKFLOW QUE JÁ EXISTE NO GITHUB.
      #
      # ISSO EVITA COLOCAR PYTHON/KOTLIN GIGANTE DENTRO DO YAML.
      # ============================================================

      - name: Aplicar Base 70 e correções da versão 80
        shell: python
        run: |
          import subprocess
          import tempfile
          from pathlib import Path
          from urllib.request import urlopen

          subprocess.run(
              [
                  "python",
                  "-m",
                  "pip",
                  "install",
                  "-q",
                  "pyyaml"
              ],
              check=True
          )

          import yaml

          URL = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          print("Baixando workflow-base...")
          workflow = urlopen(
              URL,
              timeout=60
          ).read().decode(
              "utf-8"
          )

          data = yaml.safe_load(
              workflow
          )

          steps = (
              data
              ["jobs"]
              ["build"]
              ["steps"]
          )

          def run_step(step):

              name = step.get(
                  "name",
                  "sem nome"
              )

              script = step.get(
                  "run"
              )

              if not script:
                  return

              shell = step.get(
                  "shell",
                  "bash"
              )

              working_directory = step.get(
                  "working-directory",
                  "."
              )

              print("")
              print("=" * 70)
              print(
                  "EXECUTANDO:",
                  name
              )
              print("=" * 70)

              cwd = Path(
                  working_directory
              )

              if not cwd.is_absolute():
                  cwd = (
                      Path.cwd() /
                      cwd
                  )

              if shell == "python":

                  filename = (
                      Path(
                          tempfile.gettempdir()
                      ) /
                      (
                          "controlehoras_" +
                          str(
                              abs(
                                  hash(name)
                              )
                          ) +
                          ".py"
                      )
                  )

                  filename.write_text(
                      script,
                      encoding="utf-8"
                  )

                  subprocess.run(
                      [
                          "python",
                          str(filename)
                      ],
                      cwd=str(cwd),
                      check=True
                  )

              else:

                  subprocess.run(
                      [
                          "bash",
                          "-e"
                      ],
                      input=script,
                      text=True,
                      cwd=str(cwd),
                      check=True
                  )

          for step in steps:

              name = step.get(
                  "name",
                  ""
              )

              # Não executar ações externas do workflow-base.
              if "uses" in step:
                  continue

              # Parar antes da validação/build.
              #
              # A partir daqui nós fazemos nossa própria correção
              # da roda e a própria validação.
              if name in [
                  "Validar código",
                  "Validar código e ícone",
                  "Instalar Gradle 8.11.1",
                  "Limpar projeto",
                  "Gerar APK"
              ]:
                  break

              run_step(step)

          print("")
          print("=" * 70)
          print("BASE 70 + CORREÇÕES DA VERSÃO 80 APLICADAS")
          print("=" * 70)

      # ============================================================
      # CORREÇÃO ESTRUTURAL DO CARTÃO
      #
      # Corrige o antigo:
      #
      # box.addView(
      #     card().apply{...},
      #     0,0,0,dp(10)
      # )
      #
      # que gera erro no Kotlin.
      # ============================================================

      - name: Corrigir cartão estruturalmente
        shell: python
        run: |
          from pathlib import Path
          import re

          file = Path(
              "ControleHoras/"
              "app/src/main/java/com/didhuuu/"
              "controlehoras/MainActivity.kt"
          )

          code = file.read_text(
              encoding="utf-8"
          )

          pattern = re.compile(
              r"""
              box\.addView\(
                  \s*
                  card\(\)\.apply\{
                  (?P<body>.*?)
                  \n\s*
                  \},
                  \s*0,
                  \s*0,
                  \s*0,
                  \s*dp\(10\)
                  \s*
              \)
              """,
              re.DOTALL |
              re.VERBOSE
          )

          match = pattern.search(
              code
          )

          if not match:

              # A correção pode já existir.
              if (
                  "val employeeCard=" in code
                  and
                  "LinearLayout.LayoutParams" in code
              ):
                  print(
                      "Cartão já corrigido."
                  )
              else:
                  raise SystemExit(
                      "ERRO: cartão estrutural não encontrado."
                  )

          else:

              body = match.group(
                  "body"
              )

              replacement = (
                  "val employeeCard="
                  "(card() as ViewGroup).apply{"
                  + body +
                  "\n"
                  "              }\n\n"
                  "              box.addView(\n"
                  "                  employeeCard,\n"
                  "                  LinearLayout.LayoutParams(\n"
                  "                      -1,\n"
                  "                      -2\n"
                  "                  ).apply{\n"
                  "                      bottomMargin=dp(10)\n"
                  "                  }\n"
                  "              )"
              )

              code = (
                  code[:match.start()]
                  +
                  replacement
                  +
                  code[match.end():]
              )

              file.write_text(
                  code,
                  encoding="utf-8"
              )

              print(
                  "CARTÃO CORRIGIDO"
              )

      # ============================================================
      # RODA AZUL / NEON
      #
      # Nada de NumberPicker.
      #
      # 00-23 horas
      # 00-59 minutos
      # toque para cima/baixo
      # dois pontos fixos
      # som de clique
      # ============================================================

      - name: Instalar roda azul neon
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          root = Path(
              "ControleHoras"
          )

          main = (
              root /
              "app/src/main/java/com/didhuuu/"
              "controlehoras/MainActivity.kt"
          )

          wheel = (
              root /
              "app/src/main/java/com/didhuuu/"
              "controlehoras/TimeWheelView.kt"
          )

          code = main.read_text(
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # IMPORTS
          # --------------------------------------------------------

          imports = [
              "import android.graphics.Canvas",
              "import android.graphics.LinearGradient",
              "import android.graphics.Paint",
              "import android.graphics.Shader",
              "import android.media.AudioManager",
              "import android.media.ToneGenerator",
              "import android.view.MotionEvent",
              "import android.view.View",
              "import android.view.ViewGroup"
          ]

          for imp in imports:

              if imp not in code:

                  marker = (
                      "package "
                      "com.didhuuu.controlehoras\n"
                  )

                  if marker in code:
                      code = code.replace(
                          marker,
                          marker +
                          imp +
                          "\n",
                          1
                      )

          # --------------------------------------------------------
          # FUNÇÃO PARA LOCALIZAR FUNÇÃO KOTLIN
          # --------------------------------------------------------

          def function_start(
              source,
              name
          ):

              variants = [
                  "    private fun " + name,
                  "    fun " + name
              ]

              positions = []

              for v in variants:

                  p = source.find(
                      v
                  )

                  if p >= 0:
                      positions.append(
                          p
                      )

              if not positions:
                  return -1

              return min(
                  positions
              )

          def function_end(
              source,
              start
          ):

              if start < 0:
                  return -1

              brace = source.find(
                  "{",
                  start
              )

              if brace < 0:
                  return -1

              depth = 0
              quote = None
              escaped = False
              i = brace

              while i < len(source):

                  ch = source[i]

                  if quote:

                      if escaped:
                          escaped = False

                      elif ch == "\\":
                          escaped = True

                      elif ch == quote:
                          quote = None

                  else:

                      if ch in [
                          '"',
                          "'"
                      ]:
                          quote = ch

                      elif ch == "{":
                          depth += 1

                      elif ch == "}":

                          depth -= 1

                          if depth == 0:
                              return i + 1

                  i += 1

              return -1

          # --------------------------------------------------------
          # DIÁLOGO DA RODA
          # --------------------------------------------------------

          wheel_dialog = r'''
