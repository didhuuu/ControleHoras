name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf ControleHoras

          unzip -q -o ControleHoras.zip

          test -f ControleHoras/settings.gradle.kts
          test -f ControleHoras/build.gradle.kts
          test -f ControleHoras/app/build.gradle.kts
          test -f ControleHoras/app/src/main/AndroidManifest.xml
          test -f ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt

          echo "PROJETO ORIGINAL OK"

      # ============================================================
      # RECONSTRUIR EXATAMENTE A BASE 70
      # ============================================================

      - name: Aplicar exatamente a base da versão 70
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "6381d26e525e1f9eeb91af17cdb9fed66293c1f2/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name, next_name):

              start = workflow.index(
                  f"      - name: {name}"
              )

              end = workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              pos = block.index(marker) + len(marker)

              lines = block[pos:].splitlines()

              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in lines
              ) + "\n"

          scripts = [
              extract_step(
                  "Aplicar versão 36",
                  "Adicionar seleção de data"
              ),
              extract_step(
                  "Adicionar seleção de data",
                  "Validar código"
              )
          ]

          for i, script in enumerate(scripts):

              p = (
                  Path(tempfile.gettempdir()) /
                  f"base70_{i}.py"
              )

              p.write_text(
                  script,
                  encoding="utf-8"
              )

              subprocess.run(
                  ["python", str(p)],
                  check=True
              )

          print("BASE 70 APLICADA")

      # ============================================================
      # APLICAR FUNCIONALIDADES QUE JÁ ESTAVAM FUNCIONANDO
      # ============================================================

      - name: Aplicar funcionalidades completas
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          import subprocess
          import tempfile

          url = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          workflow = urlopen(
              url,
              timeout=30
          ).read().decode("utf-8")

          def extract_step(name, next_name):

              start = workflow.index(
                  f"      - name: {name}"
              )

              end = workflow.index(
                  f"      - name: {next_name}",
                  start
              )

              block = workflow[start:end]

              marker = "        run: |\n"

              pos = block.index(marker) + len(marker)

              lines = block[pos:].splitlines()

              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in lines
              ) + "\n"

          script = extract_step(
              "Aplicar correções finais da Base 70, edição por rolagem e ícone",
              "Validar código e ícone"
          )

          p = (
              Path(tempfile.gettempdir()) /
              "funcionalidades.py"
          )

          p.write_text(
              script,
              encoding="utf-8"
          )

          subprocess.run(
              ["python", str(p)],
              check=True
          )

          print("FUNCIONALIDADES APLICADAS")

      # ============================================================
      # CORREÇÕES DEFINITIVAS
      # ============================================================

      - name: Corrigir relógio de rolagem e estrutura
        shell: python
        run: |
          from pathlib import Path
          import re

          file = Path(
              "ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          )

          code = file.read_text(
              encoding="utf-8"
          )

          # ========================================================
          # PUNCH NAMES
          # ========================================================

          if "private val punchNames" not in code:

              names = '''    private val punchNames=arrayOf<String>(
                  "Entrada",
                  "Saída",
                  "Retorno",
                  "Saída intervalo 2",
                  "Retorno intervalo 2",
                  "Saída"
              )
              '''

              anchors = [
                  '    private val extra2ReturnEnabled=mutableSetOf<String>()\n',
                  '    private val extra2Enabled=mutableSetOf<String>()\n',
                  '    private val weekModes=linkedMapOf<String,String>()\n',
                  '    private val weekModes = linkedMapOf<String,String>()\n'
              ]

              inserted = False

              for anchor in anchors:

                  if anchor in code:

                      code = code.replace(
                          anchor,
                          anchor + names,
                          1
                      )

                      inserted = True
                      break

              if not inserted:
                  raise SystemExit(
                      "ERRO: punchNames não pôde ser inserido"
                  )

          # ========================================================
          # CORRIGIR ADDVIEW
          # ========================================================

          pattern = (
              r'\},\s*'
              r'0,\s*'
              r'0,\s*'
              r'0,\s*'
              r'dp\(10\)\s*'
              r'\)\s*'
              r'val dateCard\s*=\s*card\(\)'
          )

          replacement = '''},
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      ).apply{
                          bottomMargin=dp(10)
                      }
                  )

                  val dateCard=card()'''

          code, count = re.subn(
              pattern,
              replacement,
              code,
              count=1
          )

          # ========================================================
          # MELHORAR TAMANHO DO RELÓGIO
          # ========================================================

          code = code.replace(
              "dp(88),\n                          dp(150)",
              "dp(70),\n                          dp(126)"
          )

          code = code.replace(
              "dp(88),\n                        dp(150)",
              "dp(70),\n                        dp(126)"
          )

          code = code.replace(
              "dp(35),\n                          dp(150)",
              "dp(28),\n                          dp(126)"
          )

          code = code.replace(
              "dp(35),\n                        dp(150)",
              "dp(28),\n                        dp(126)"
          )

          # ========================================================
          # RELÓGIO MAIS LIMPO
          # ========================================================

          code = code.replace(
              'text=":"\n                          textSize=28f',
              'text=":"\n                          textSize=22f'
          )

          code = code.replace(
              'text=":"\n                        textSize=28f',
              'text=":"\n                        textSize=22f'
          )

          code = code.replace(
              'textSize=24f\n\n                          setTypeface',
              'textSize=20f\n\n                          setTypeface'
          )

          code = code.replace(
              'textSize=24f\n\n                        setTypeface',
              'textSize=20f\n\n                        setTypeface'
          )

          # ========================================================
          # FUNÇÃO PARA DEIXAR O NUMBERPICKER TRANSPARENTE
          # ========================================================

          if "private fun styleHourMinutePicker" not in code:

              anchor = "    private fun showManualWheel("

              if anchor not in code:
                  raise SystemExit(
                      "ERRO: showManualWheel não encontrado"
                  )

              helper = '''    private fun styleHourMinutePicker(
                  picker:NumberPicker
              ){

                  picker.setBackgroundColor(
                      Color.TRANSPARENT
                  )

                  picker.wrapSelectorWheel=true

                  picker.descendantFocusability=
                      NumberPicker.FOCUS_BLOCK_DESCENDANTS

                  picker.post{

                      try{

                          val count=
                              picker.childCount

                          for(i in 0 until count){

                              val child=
                                  picker.getChildAt(i)

                              if(child is TextView){

                                  child.setTextColor(
                                      darkBlue
                                  )

                                  child.textSize=22f

                                  child.gravity=
                                      Gravity.CENTER

                                  child.setTypeface(
                                      null,
                                      Typeface.BOLD
                                  )

                              }
                          }

                      }catch(_:Exception){}

                  }
              }

              '''

              code = code.replace(
                  anchor,
                  helper + anchor,
                  1
              )

          # ========================================================
          # APLICAR ESTILO AOS DOIS RELÓGIOS
          # ========================================================

          # Depois da criação do relógio de edição
          code = code.replace(
              'minute.setOnValueChangedListener(\n                      listener\n                  )',
              '''styleHourMinutePicker(hour)

                  styleHourMinutePicker(minute)

                  minute.setOnValueChangedListener(
                      listener
                  )'''
          )

          code = code.replace(
              'minute.setOnValueChangedListener(\n                          listener\n                      )',
              '''styleHourMinutePicker(hour)

                  styleHourMinutePicker(minute)

                  minute.setOnValueChangedListener(
                      listener
                  )'''
          )

          # ========================================================
          # GARANTIR FORMATO HH:MM
          # ========================================================

          code = code.replace(
              '"%02d:%02d".format(\n                                      Locale.US,',
              '"%02d:%02d".format(\n                                      Locale.US,'
          )

          code = code.replace(
              '"%02d:%02d".format(\n                                  Locale.US,',
              '"%02d:%02d".format(\n                                  Locale.US,'
          )

          # ========================================================
          # GARANTIR PUNCHNAMES
          # ========================================================

          if "private val punchNames" not in code:
              raise SystemExit(
                  "ERRO FINAL: punchNames ausente"
              )

          if "showManualWheel" not in code:
              raise SystemExit(
                  "ERRO FINAL: showManualWheel ausente"
              )

          if "showEditWheel" not in code:
              raise SystemExit(
                  "ERRO FINAL: showEditWheel ausente"
              )

          if "nextPunchIndex" not in code:
              raise SystemExit(
                  "ERRO FINAL: nextPunchIndex ausente"
              )

          file.write_text(
              code,
              encoding="utf-8"
          )

          print("RELÓGIO CORRIGIDO")

      # ============================================================
      # ÍCONE DIDHUUU REAL EMBUTIDO
      # ============================================================

      - name: Instalar ícone DIDHUUU
        shell: python
        run: |
          from pathlib import Path
          import base64

          root = Path("ControleHoras")

          icon = (
              root /
              "app/src/main/res/drawable/controlehoras_icon.jpg"
          )

          icon.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          # ========================================================
          # ÍCONE DIDHUUU ASTRONAUTA + GRAFITE
          # ========================================================

          icon_b64 = """

"""

          data = base64.b64decode(
              "".join(icon_b64.split())
          )

          icon.write_bytes(data)

          if not icon.exists():
              raise SystemExit(
                  "ERRO: ícone não foi criado"
              )

          if icon.stat().st_size < 1000:
              raise SystemExit(
                  "ERRO: ícone inválido"
              )

          print(
              "ÍCONE DIDHUUU GRAVADO:",
              icon.stat().st_size,
              "bytes"
          )

      # ============================================================
      # MANIFEST
      # ============================================================

      - name: Configurar ícone no Android
        shell: python
        run: |
          from pathlib import Path

          manifest = Path(
              "ControleHoras/app/src/main/AndroidManifest.xml"
          )

          m = manifest.read_text(
              encoding="utf-8"
          )

          if 'android:icon="@drawable/controlehoras_icon"' not in m:

              m = m.replace(
                  "<application",
                  '<application\n'
                  '        android:icon="@drawable/controlehoras_icon"\n'
                  '        android:roundIcon="@drawable/controlehoras_icon"',
                  1
              )

          manifest.write_text(
              m,
              encoding="utf-8"
          )

          if 'android:icon="@drawable/controlehoras_icon"' not in m:
              raise SystemExit(
                  "ERRO: ícone não foi configurado no Manifest"
              )

          print("MANIFEST COM ÍCONE DIDHUUU OK")

      # ============================================================
      # VALIDAÇÃO FINAL
      # ============================================================

      - name: Validar projeto final
        shell: bash
        run: |
          set -e

          FILE="ControleHoras/app/src/main/java/com/didhuuu/controlehoras/MainActivity.kt"
          ICON="ControleHoras/app/src/main/res/drawable/controlehoras_icon.jpg"
          MANIFEST="ControleHoras/app/src/main/AndroidManifest.xml"

          test -s "$FILE"
          test -s "$ICON"

          grep -q "extra2Enabled" "$FILE"
          grep -q "showManualWheel" "$FILE"
          grep -q "showEditWheel" "$FILE"
          grep -q "nextPunchIndex" "$FILE"
          grep -q "punchNames" "$FILE"
          grep -q "styleHourMinutePicker" "$FILE"

          grep -q \
            "WindowCompat.setDecorFitsSystemWindows" \
            "$FILE"

          grep -q \
            'controlehoras_icon' \
            "$MANIFEST"

          if grep -q 'Button(context)' "$FILE"; then
            echo "ERRO: Button(context) encontrado"
            exit 1
          fi

          echo "========================================"
          echo "VALIDAÇÃO FINAL OK"
          echo "========================================"

          echo "Tamanho do ícone:"
          ls -lh "$ICON"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            gradle-8.11.1-bin.zip

          echo \
            "$PWD/gradle-8.11.1/bin" \
            >> "$GITHUB_PATH"

          "$PWD/gradle-8.11.1/bin/gradle" \
            --version

      - name: Limpar projeto
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon

      # ============================================================
      # GERAR APK
      # ============================================================

      - name: Gerar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GERANDO APK"
          echo "========================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "========================================"
          echo "APK GERADO COM SUCESSO"
          echo "========================================"

          ls -lh "$APK"

      # ============================================================
      # VERIFICAR APK
      # ============================================================

      - name: Verificar APK
        working-directory: ControleHoras
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK VALIDADO COM SUCESSO"

      # ============================================================
      # PUBLICAR APK
      # ============================================================

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleHoras-APK
          path: ControleHoras/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
