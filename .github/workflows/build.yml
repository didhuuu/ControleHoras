name: ControleHoras APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # BASE CORRETA
      #
      # 894fb3f98dfda80c297f31474130324a094b6dc6
      #
      # É O COMMIT DO WORKFLOW-BASE.
      # NÃO usar SHA de blob aqui.
      # ============================================================

      - name: Aplicar base ControleHoras
        shell: python
        run: |
          import subprocess
          import tempfile
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          import yaml

          SOURCE_URL = (
              "https://raw.githubusercontent.com/"
              "didhuuu/ControleHoras/"
              "894fb3f98dfda80c297f31474130324a094b6dc6/"
              ".github/workflows/build.yml"
          )

          print("=" * 70)
          print("BAIXANDO WORKFLOW BASE")
          print("=" * 70)
          print(SOURCE_URL)

          request = Request(
              SOURCE_URL,
              headers={
                  "User-Agent": "ControleHoras"
              }
          )

          workflow = urlopen(
              request,
              timeout=60
          ).read().decode("utf-8")

          print(
              "Workflow recebido:",
              len(workflow),
              "bytes"
          )

          data = yaml.safe_load(workflow)

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERRO: workflow base inválido."
              )

          jobs = data.get("jobs")

          if not jobs:
              raise SystemExit(
                  "ERRO: jobs não encontrado."
              )

          build = jobs.get("build")

          if not build:
              raise SystemExit(
                  "ERRO: job build não encontrado."
              )

          steps = build.get("steps", [])

          if not steps:
              raise SystemExit(
                  "ERRO: etapas não encontradas."
              )

          print(
              "Etapas encontradas:",
              len(steps)
          )

          def execute_step(step):

              name = step.get(
                  "name",
                  "Etapa"
              )

              if "uses" in step:
                  print(
                      "Ignorando uses:",
                      name
                  )
                  return

              script = step.get("run")

              if not script:
                  return

              shell = step.get(
                  "shell",
                  "bash"
              )

              workdir = step.get(
                  "working-directory",
                  "."
              )

              cwd = Path(workdir)

              if not cwd.is_absolute():
                  cwd = (
                      Path.cwd() /
                      cwd
                  )

              print("")
              print("=" * 70)
              print("EXECUTANDO:", name)
              print("=" * 70)

              env = os.environ.copy()

              if shell == "python":

                  temp = Path(
                      tempfile.gettempdir()
                  )

                  script_file = (
                      temp /
                      (
                          "controlehoras_"
                          +
                          str(
                              abs(
                                  hash(name)
                              )
                          )
                          +
                          ".py"
                      )
                  )

                  script_file.write_text(
                      script,
                      encoding="utf-8"
                  )

                  subprocess.run(
                      [
                          "python",
                          str(script_file)
                      ],
                      cwd=str(cwd),
                      env=env,
                      check=True
                  )

              else:

                  subprocess.run(
                      [
                          "bash",
                          "-e"
                      ],
                      input=script,
                      text=True,
                      cwd=str(cwd),
                      env=env,
                      check=True
                  )

          # --------------------------------------------------------
          # EXECUTA A BASE ATÉ ANTES DO BUILD.
          # O BUILD SERÁ FEITO ABAIXO.
          # --------------------------------------------------------

          stop_names = {
              "Validar código",
              "Validar código e ícone",
              "Validar código final",
              "Instalar Gradle 8.11.1",
              "Limpar projeto",
              "Gerar APK",
              "Verificar APK"
          }

          for step in steps:

              name = step.get(
                  "name",
                  ""
              )

              if name in stop_names:
                  break

              if name in {
                  "Baixar projeto",
                  "Configurar Java 17"
              }:
                  continue

              execute_step(step)

          print("")
          print("=" * 70)
          print("BASE APLICADA")
          print("=" * 70)

      # ============================================================
      # CORRIGIR CARTÃO DO FUNCIONÁRIO
      #
      # Corrige:
      #
      # box.addView(view,0,0,0,dp(10))
      #
      # para um LayoutParams válido.
      # ============================================================

      - name: Corrigir cartão do funcionário
        shell: python
        run: |
          from pathlib import Path
          import re

          main = Path(
              "ControleHoras/"
              "app/src/main/java/com/didhuuu/"
              "controlehoras/MainActivity.kt"
          )

          if not main.exists():
              raise SystemExit(
                  "ERRO: MainActivity.kt não encontrado."
              )

          code = main.read_text(
              encoding="utf-8"
          )

          pattern = re.compile(
              r"""
              box\.addView
                  \s*
                  card\(\.apply\{
                  (?P<body>.*?)
                  \n\s*
                  \},
                  \s*0,
                  \s*0,
                  \s*0,
                  \s*dp10
                  \s*
              \)
              """,
              re.DOTALL |
              re.VERBOSE
          )

          match = pattern.search(code)

          if match:

              body = match.group("body")

              replacement = (
                  "val employeeCard="
                  "(card() as ViewGroup).apply{"
                  +
                  body
                  +
                  "\n"
                  "              }\n\n"
                  "              box.addView(\n"
                  "                  employeeCard,\n"
                  "                  LinearLayout.LayoutParams(\n"
                  "                      -1,\n"
                  "                      -2\n"
                  "                  ).apply{\n"
                  "                      bottomMargin=dp(10)\n"
                  "                  }\n"
                  "              )"
              )

              code = (
                  code[:match.start()]
                  +
                  replacement
                  +
                  code[match.end():]
              )

              main.write_text(
                  code,
                  encoding="utf-8"
              )

              print(
                  "CARTÃO CORRIGIDO"
              )

          elif (
              "val employeeCard=" in code
              and
              "LinearLayout.LayoutParams" in code
          ):

              print(
                  "Cartão já estava corrigido."
              )

          else:

              raise SystemExit(
                  "ERRO: estrutura do cartão não encontrada."
              )

      # ============================================================
      # RODA DE HORAS AZUL / NEON
      #
      # 00-23
      # 00-59
      # HH:MM
      # toque para cima/baixo
      # clique sonoro
      # ============================================================

      - name: Instalar roda azul neon
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          root = Path("ControleHoras")

          main = (
              root /
              "app/src/main/java/com/didhuuu/"
              "controlehoras/MainActivity.kt"
          )

          wheel = (
              root /
              "app/src/main/java/com/didhuuu/"
              "controlehoras/TimeWheelView.kt"
          )

          code = main.read_text(
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # IMPORTS
          # --------------------------------------------------------

          imports = [
              "import android.graphics.Canvas",
              "import android.graphics.LinearGradient",
              "import android.graphics.Paint",
              "import android.graphics.Shader",
              "import android.media.AudioManager",
              "import android.media.ToneGenerator",
              "import android.view.MotionEvent",
              "import android.view.View",
              "import android.view.ViewGroup"
          ]

          package_line = (
              "package "
              "com.didhuuu.controlehoras\n"
          )

          if package_line not in code:
              raise SystemExit(
                  "ERRO: package da MainActivity não encontrado."
              )

          for imp in imports:

              if imp not in code:

                  code = code.replace(
                      package_line,
                      package_line +
                      imp +
                      "\n",
                      1
                  )

          # --------------------------------------------------------
          # LOCALIZAR FUNÇÃO
          # --------------------------------------------------------

          def find_function(
              source,
              name
          ):

              candidates = [
                  "    private fun " + name,
                  "    fun " + name
              ]

              found = []

              for item in candidates:

                  pos = source.find(item)

                  if pos >= 0:
                      found.append(pos)

              if not found:
                  return -1

              return min(found)

          # --------------------------------------------------------
          # DIÁLOGO
          # --------------------------------------------------------

          wheel_dialog = r'''
    private fun showTimeWheelDialog(
        title:String,
        subtitle:String,
        initialHour:Int,
        initialMinute:Int,
        positive:String,
        onSave:(Int,Int)->Unit
    ){

        val wrap=
            LinearLayout(this).apply{

                orientation=
                    LinearLayout.VERTICAL

                gravity=
                    Gravity.CENTER_HORIZONTAL

                setPadding(
                    dp(8),
                    0,
                    dp(8),
                    0
                )
            }

        wrap.addView(
            TextView(this).apply{

                text=subtitle

                gravity=
                    Gravity.CENTER

                textSize=16f

                setTypeface(
                    null,
                    Typeface.BOLD
                )

                setTextColor(
                    darkBlue
                )
            }
        )

        val wheels=
            LinearLayout(this).apply{

                orientation=
                    LinearLayout.HORIZONTAL

                gravity=
                    Gravity.CENTER
            }

        val hour=
            TimeWheelView(
                this,
                0,
                23,
                initialHour
            )

        val minute=
            TimeWheelView(
                this,
                0,
                59,
                initialMinute
            )

        val colon=
            TextView(this).apply{

                text=":"

                textSize=34f

                gravity=
                    Gravity.CENTER

                setTypeface(
                    null,
                    Typeface.BOLD
                )

                setTextColor(
                    darkBlue
                )
            }

        wheels.addView(
            hour,
            LinearLayout.LayoutParams(
                dp(105),
                dp(190)
            )
        )

        wheels.addView(
            colon,
            LinearLayout.LayoutParams(
                dp(30),
                dp(190)
            )
        )

        wheels.addView(
            minute,
            LinearLayout.LayoutParams(
                dp(105),
                dp(190)
            )
        )

        wrap.addView(
            wheels
        )

        val value=
            TextView(this).apply{

                text=
                    "%02d:%02d".format(
                        Locale.US,
                        hour.value,
                        minute.value
                    )

                textSize=30f

                gravity=
                    Gravity.CENTER

                setTypeface(
                    null,
                    Typeface.BOLD
                )

                setTextColor(
                    blue
                )
            }

        fun refresh(){

            value.text=
                "%02d:%02d".format(
                    Locale.US,
                    hour.value,
                    minute.value
                )
        }

        hour.onValueChanged={
            refresh()
        }

        minute.onValueChanged={
            refresh()
        }

        wrap.addView(
            value
        )

        val dialog=
            AlertDialog.Builder(this)
                .setTitle(title)
                .setView(wrap)
                .setNegativeButton(
                    "CANCELAR",
                    null
                )
                .setPositiveButton(
                    positive,
                    null
                )
                .create()

        dialog.setOnShowListener{

            dialog
                .getButton(
                    AlertDialog.BUTTON_POSITIVE
                )
                .setOnClickListener{

                    onSave(
                        hour.value,
                        minute.value
                    )

                    dialog.dismiss()
                }
        }

        dialog.show()
    }
'''

          # --------------------------------------------------------
          # EDITAR
          # --------------------------------------------------------

          edit_method = r'''
    private fun showEditWheel(
        rec:PunchDay,
        index:Int
    ){

        if(
            rec.punches[index].isBlank()
        ){

            Toast.makeText(
                this,
                "Esse registro ainda está vazio.",
                Toast.LENGTH_LONG
            ).show()

            return
        }

        val parts=
            rec.punches[index]
                .split(":")

        val hour=
            parts
                .getOrNull(0)
                ?.toIntOrNull()
                ?.coerceIn(0,23)
                ?:0

        val minute=
            parts
                .getOrNull(1)
                ?.toIntOrNull()
                ?.coerceIn(0,59)
                ?:0

        showTimeWheelDialog(
            "Editar registro",
            "${punchNames[index]}\n${df.format(parseIso(rec.date))}",
            hour,
            minute,
            "SALVAR"
        ){h,m->

            rec.punches[index]=
                "%02d:%02d".format(
                    Locale.US,
                    h,
                    m
                )

            saveData()

            showPunch()
        }
    }
'''

          # --------------------------------------------------------
          # REGISTRO MANUAL
          # --------------------------------------------------------

          manual_method = r'''
    private fun showManualWheel(
        empId:Long
    ){

        val r=
            getRecord(
                empId,
                selectedPunchDate
            )

        val n=
            nextPunchIndex(
                r,
                extraEnabled(
                    empId,
                    selectedPunchDate
                )
            )

        if(n<0){

            Toast.makeText(
                this,
                "As batidas disponíveis deste dia já estão preenchidas.",
                Toast.LENGTH_LONG
            ).show()

            return
        }

        val now=
            Calendar.getInstance()

        showTimeWheelDialog(
            "Registro manual",
            "${punchNames[n]}\n${df.format(parseIso(selectedPunchDate))}",
            now.get(Calendar.HOUR_OF_DAY),
            now.get(Calendar.MINUTE),
            "REGISTRAR"
        ){h,m->

            r.punches[n]=
                "%02d:%02d".format(
                    Locale.US,
                    h,
                    m
                )

            saveData()

            showPunch()
        }
    }
'''

          edit_start = find_function(
              code,
              "showEditWheel"
          )

          manual_start = find_function(
              code,
              "showManualWheel"
          )

          history_start = find_function(
              code,
              "showHistory"
          )

          if (
              edit_start < 0
              or
              manual_start < 0
              or
              history_start < 0
          ):

              raise SystemExit(
                  "ERRO: funções da roda não encontradas."
              )

          code = (
              code[:edit_start]
              +
              textwrap.dedent(
                  wheel_dialog
              ).strip()
              +
              "\n\n"
              +
              textwrap.dedent(
                  edit_method
              ).strip()
              +
              "\n\n"
              +
              textwrap.dedent(
                  manual_method
              ).strip()
              +
              "\n\n"
              +
              code[history_start:]
          )

          if "NumberPicker" in code:
              raise SystemExit(
                  "ERRO: NumberPicker ainda existe."
              )

          main.write_text(
              code,
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # CLASSE DA RODA
          # --------------------------------------------------------

          wheel_code = r'''package com.didhuuu.controlehoras

import android.content.Context
import android.graphics.Canvas
import android.graphics.LinearGradient
import android.graphics.Paint
import android.graphics.Shader
import android.media.AudioManager
import android.media.ToneGenerator
import android.view.MotionEvent
import android.view.View
import kotlin.math.abs

class TimeWheelView(
    context:Context,
    private val minimum:Int,
    private val maximum:Int,
    initial:Int
):View(context){

    var value:Int=
        initial.coerceIn(
            minimum,
            maximum
        )
        private set

    var onValueChanged:
        (() -> Unit)?=null

    private val density=
        resources
            .displayMetrics
            .density

    private val paint=
        Paint(
            Paint.ANTI_ALIAS_FLAG
        )

    private val tone=
        ToneGenerator(
            AudioManager.STREAM_NOTIFICATION,
            65
        )

    private var lastY=0f

    private var accumulated=0f

    private fun dp(
        value:Int
    ):Float{

        return value*density
    }

    private fun change(
        amount:Int
    ){

        val next=
            (value+amount)
                .coerceIn(
                    minimum,
                    maximum
                )

        if(
            next==value
        ){
            return
        }

        value=next

        tone.startTone(
            ToneGenerator.TONE_PROP_CLICK,
            35
        )

        onValueChanged?.invoke()

        invalidate()
    }

    override fun onDraw(
        canvas:Canvas
    ){

        super.onDraw(
            canvas
        )

        val width=
            width.toFloat()

        val height=
            height.toFloat()

        val center=
            height/2f

        paint.shader=
            LinearGradient(
                0f,
                0f,
                width,
                0f,
                intArrayOf(
                    0xFF17191C.toInt(),
                    0xFFB9BDC4.toInt(),
                    0xFFF5F7FA.toInt(),
                    0xFF9EA4AB.toInt(),
                    0xFF17191C.toInt()
                ),
                null,
                Shader.TileMode.CLAMP
            )

        canvas.drawRoundRect(
            dp(4),
            dp(3),
            width-dp(4),
            height-dp(3),
            dp(18),
            dp(18),
            paint
        )

        paint.shader=null

        paint.shader=
            LinearGradient(
                0f,
                center-dp(34),
                0f,
                center+dp(34),
                intArrayOf(
                    0xFF003CFF.toInt(),
                    0xFF008BFF.toInt(),
                    0xFF0050FF.toInt()
                ),
                null,
                Shader.TileMode.CLAMP
            )

        canvas.drawRoundRect(
            dp(9),
            center-dp(34),
            width-dp(9),
            center+dp(34),
            dp(10),
            dp(10),
            paint
        )

        paint.shader=null

        paint.textAlign=
            Paint.Align.CENTER

        for(
            offset in -2..2
        ){

            var number=
                value+offset

            val range=
                maximum-minimum+1

            while(
                number>maximum
            ){
                number-=range
            }

            while(
                number<minimum
            ){
                number+=range
            }

            paint.textSize=
                if(
                    offset==0
                ){
                    dp(28)
                }else{
                    dp(19)
                }

            paint.color=
                if(
                    offset==0
                ){
                    0xFFFFFFFF.toInt()
                }else{
                    0xFFE2E7EF.toInt()
                }

            canvas.drawText(
                "%02d".format(
                    number
                ),
                width/2f,
                center+
                offset*dp(45)+
                dp(9),
                paint
            )
        }

        paint.color=
            0xFF00D9FF.toInt()

        paint.style=
            Paint.Style.STROKE

        paint.strokeWidth=
            dp(2)

        canvas.drawLine(
            dp(3),
            center-dp(30),
            dp(19),
            center,
            paint
        )

        canvas.drawLine(
            dp(3),
            center+dp(30),
            dp(19),
            center,
            paint
        )

        canvas.drawLine(
            width-dp(3),
            center-dp(30),
            width-dp(19),
            center,
            paint
        )

        canvas.drawLine(
            width-dp(3),
            center+dp(30),
            width-dp(19),
            center,
            paint
        )

        paint.style=
            Paint.Style.FILL
    }

    override fun onTouchEvent(
        event:MotionEvent
    ):Boolean{

        when(
            event.actionMasked
        ){

            MotionEvent.ACTION_DOWN->{

                lastY=
                    event.y

                accumulated=
                    0f

                return true
            }

            MotionEvent.ACTION_MOVE->{

                val difference=
                    event.y-lastY

                accumulated+=
                    difference

                if(
                    abs(accumulated)>=
                    dp(28)
