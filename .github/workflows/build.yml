          )

          old = 'val fields=r.punches.mapIndexed{i,v->EditText(this).apply{hint=punchNames[i];setText(v);inputType=2;setSingleLine();}}'
          if old not in source:
              raise SystemExit("ERRO: campos de edição do histórico não encontrados")
          source = source.replace(old, 'val fields=r.punches.mapIndexed{i,v->timeEdit(v,punchNames[i])}', 1)
          source = source.replace(
              'fields.forEachIndexed{i,e->r.punches[i]=e.text.toString()};saveData();showHistory()',
              'fields.forEachIndexed{i,e->r.punches[i]=normalizeTime(e.text.toString())};saveData();showHistory()',
