                          initialMinute
                      )


                  wheels.addView(
                      hour,
                      LinearLayout.LayoutParams(
                          dp(135),
                          dp(220)
                      )
                  )


                  wheels.addView(
                      TextView(this).apply{

                          text=":"

                          textSize=30f

                          gravity=
                              Gravity.CENTER

                          setTypeface(
                              null,
                              Typeface.BOLD
                          )

                          setTextColor(
                              0xFF173A67.toInt()
                          )
                      },
                      LinearLayout.LayoutParams(
                          dp(30),
                          dp(220)
                      )
                  )


                  wheels.addView(
                      minute,
                      LinearLayout.LayoutParams(
                          dp(135),
                          dp(220)
                      )
                  )


                  root.addView(
                      wheels
                  )


                  val selected=
                      TextView(this).apply{

                          text=
                              "%02d:%02d".format(
                                  hour.value(),
                                  minute.value()
                              )

                          textSize=30f

                          gravity=
                              Gravity.CENTER

                          setTypeface(
                              null,
                              Typeface.BOLD
                          )

                          setTextColor(
                              0xFF0879F9.toInt()
