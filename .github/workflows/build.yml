          wheel.write_text(
              '''package com.didhuuu.controlehoras

import android.content.Context
import android.graphics.Canvas
import android.graphics.LinearGradient
import android.graphics.Paint
import android.graphics.Shader
import android.media.AudioManager
import android.media.ToneGenerator
import android.view.MotionEvent
import android.view.View
import kotlin.math.abs

class TimeWheelView(
    context:Context,
    private val min:Int,
    private val max:Int,
    initial:Int
):View(context){

    var value:Int=
        initial.coerceIn(
            min,
            max
        )
        private set

    var onValueChanged:
        (() -> Unit)?=null

    private val density=
        resources
            .displayMetrics
            .density

    private val paint=
        Paint(
            Paint.ANTI_ALIAS_FLAG
        )

    private val tone=
        ToneGenerator(
            AudioManager.STREAM_NOTIFICATION,
            65
        )

    private var lastY=0f
    private var moved=0f

    private fun dp(
        v:Int
    )=v*density

    private fun change(
        delta:Int
    ){

        val next=
            (
                value+delta
            ).coerceIn(
                min,
                max
            )

        if(
            next!=value
        ){

            value=next

            onValueChanged?.invoke()

            tone.startTone(
                ToneGenerator.TONE_PROP_CLICK,
                35
            )

            invalidate()
        }
    }

    override fun onDraw(
        canvas:Canvas
    ){

        super.onDraw(
            canvas
        )

        val w=
            width.toFloat()

        val h=
            height.toFloat()

        val center=
            h/2f

        paint.shader=
            LinearGradient(
                0f,
                0f,
                w,
                0f,
                intArrayOf(
                    0xFF202020.toInt(),
                    0xFFB9BDC4.toInt(),
                    0xFFF4F4F8.toInt(),
                    0xFF9CA2A8.toInt(),
                    0xFF202020.toInt()
                ),
                null,
                Shader.TileMode.CLAMP
            )

        canvas.drawRoundRect(
            dp(5),
            dp(3),
            w-dp(5),
            h-dp(3),
            dp(18),
            dp(18),
            paint
        )

        paint.shader=null

        paint.color=
            0xFFF0A67E.toInt()

        canvas.drawRoundRect(
            dp(10),
            center-dp(34),
            w-dp(10),
            center+dp(34),
            dp(10),
            dp(10),
            paint
        )

        paint.textAlign=
            Paint.Align.CENTER

        for(
            offset in -2..2
        ){

            var v=
                value+offset

            val range=
                max-min+1

            while(
                v>max
            ){
                v-=range
            }

            while(
                v<min
            ){
                v+=range
            }

            paint.textSize=
                if(
                    offset==0
                ){
                    28f
                }else{
                    20f
                }

            paint.color=
                if(
                    offset==0
                ){
                    0xFFFFFFFF.toInt()
                }else{
                    0xFF22272D.toInt()
                }

            canvas.drawText(
                "%02d".format(v),
                w/2f,
                center+
                offset*dp(47)+
                dp(9),
                paint
            )
        }

        paint.color=
            0xFF0875FF.toInt()

        paint.style=
            Paint.Style.STROKE

        paint.strokeWidth=
            2.5f*density

        canvas.drawLine(
            dp(3),
            center-dp(30),
            dp(18),
            center,
            paint
        )

        canvas.drawLine(
            dp(3),
            center+dp(30),
            dp(18),
            center,
            paint
        )

        canvas.drawLine(
            w-dp(3),
            center-dp(30),
            w-dp(18),
            center,
            paint
        )

        canvas.drawLine(
            w-dp(3),
            center+dp(30),
            w-dp(18),
            center,
            paint
        )

        paint.style=
            Paint.Style.FILL
    }

    override fun onTouchEvent(
        event:MotionEvent
    ):Boolean{

        when(
            event.actionMasked
        ){

            MotionEvent.ACTION_DOWN->{
                lastY=event.y
                moved=0f
                return true
            }

            MotionEvent.ACTION_MOVE->{

                val dy=
                    event.y-lastY

                moved+=dy

                if(
                    abs(moved)>=dp(32)
                ){

                    change(
                        if(
                            moved<0
                        ){
                            1
                        }else{
                            -1
                        }
                    )

                    moved=0f
                }

                lastY=event.y

                return true
            }

            MotionEvent.ACTION_UP->{

                if(
                    abs(moved)<dp(10)
                ){

                    change(
                        if(
                            event.y<
                            height/2f
                        ){
                            1
                        }else{
                            -1
                        }
                    )
                }

                performClick()

                return true
            }
        }

        return true
    }

    override fun performClick():Boolean{
        super.performClick()
        return true
    }
}
''',
              encoding="utf-8"
          )

