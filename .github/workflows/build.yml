          cend = code.find(
              "    private fun minutesBetween",
              cstart
          )

          if cstart < 0 or cend < 0:

              raise SystemExit(
                  "ERRO: calculate não encontrado"
              )

          calc = """    private fun calculate(r:PunchDay):Calc{
              var worked=
                  minutesBetween(
                      r.punches[0],
                      r.punches[1]
                  )+
                  minutesBetween(
                      r.punches[2],
                      r.punches[5]
                  )

              val extra2=
                  r.punches[3].isNotBlank() ||
                  r.punches[4].isNotBlank()

              if(extra2){

                  worked=
                      minutesBetween(
                          r.punches[0],
                          r.punches[1]
                      )+
                      minutesBetween(
                          r.punches[2],
                          r.punches[3]
                      )+
                      minutesBetween(
                          r.punches[4],
                          r.punches[5]
                      )
              }

              val date=parseIso(r.date)

              if(!modeForDay(date)){

                  return Calc(
                      worked,
                      0,
                      0,
                      worked
                  )
              }

              val expected=
                  durationMinutes(weeklyTarget) /
                  (
                      if(modeForDate(date)=="MS")
                          6
                      else
                          5
                  )

              val extra=
                  max(
                      0,
                      worked-expected
                  )

              return Calc(
                  worked,
                  expected,
                  extra,
                  0
              )
          }

          """

          code = (
              code[:cstart]
              + calc
              + code[cend:]
          )

          # ------------------------------------------------------------
          # REMOVE NUMBERPICKER IMPORT ANTIGO
          # ------------------------------------------------------------

          code = code.replace(
              "import android.widget.NumberPicker\n",
              ""
          )

          # ------------------------------------------------------------
          # INSETS
          # ------------------------------------------------------------

          imports = (
              "import androidx.core.view.WindowCompat\n"
              "import androidx.core.view.ViewCompat\n"
              "import androidx.core.view.WindowInsetsCompat\n"
          )

          if (
              "import androidx.core.view.WindowCompat"
              not in code
          ):

              anchor = (
                  "import androidx.core.content.FileProvider\n"
              )

              if anchor in code:

                  code = code.replace(
                      anchor,
                      anchor + imports,
                      1
                  )

          if (
              "WindowCompat.setDecorFitsSystemWindows"
              not in code
          ):

              anchor = "        buildShell()\n"

              if anchor in code:

                  inset = """        WindowCompat.setDecorFitsSystemWindows(
              window,
              false
          )

          window.statusBarColor=blue

          window.navigationBarColor=Color.WHITE

          window.decorView.systemUiVisibility=
              View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR

          ViewCompat.setOnApplyWindowInsetsListener(
              root
          ){v,insets->

              val bars=
                  insets.getInsets(
                      WindowInsetsCompat.Type.systemBars()
                  )

              v.setPadding(
                  v.paddingLeft,
                  bars.top,
                  v.paddingRight,
                  bars.bottom
              )

              insets
          }

          ViewCompat.requestApplyInsets(root)

          """

                  code = code.replace(
                      anchor,
                      anchor + inset,
                      1
                  )

          # ------------------------------------------------------------
          # SALVAR
          # ------------------------------------------------------------

          src.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "CORREÇÃO BASE 70 CONCLUÍDA"
          )
          PY

      - name: Executar correção Base 70
        shell: bash
